id: go-unix-utils-roadmap
title: "go-unix-utils Release Road Map"
releases:
    - version: "00.0"
      name: "Batch 0 — foundational infrastructure"
      status: implemented
      description: |
        Specify and verify the build lifecycle and shared library infrastructure that all
        subsequent releases depend on. This release covers magefiles/ (build, lint, clean,
        install targets and cmd/version), pkg/testutils (differential testing harness),
        pkg/sys (syscall abstractions), and pkg/format (output formatting). The cmd/version
        binary is the first compiled artifact and the smoke test for the build pipeline.
      use_cases:
        - id: rel00.0-uc001-magefiles
          status: implemented
        - id: rel00.0-uc002-format
          status: implemented
        - id: rel00.0-uc003-sys
          status: implemented
        - id: rel00.0-uc004-testutils
          status: implemented
        - id: rel00.0-uc005-hashutil
          status: implemented
        - id: rel00.0-uc006-sizeparse
          status: implemented
        - id: rel00.0-uc007-encutil
          status: implemented
    - version: "01.1"
      name: "Batch 1.1 — cat specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement cat for file concatenation and display. cat depends on pkg/testutils from
        rel00.0 for differential testing and does not require pkg/sys or pkg/format.
      use_cases:
        - id: rel01.1-uc001-cat
          status: implemented
    - version: "01.2"
      name: "Batch 1.2 — sponge specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement sponge for soak-before-write stdin buffering. sponge depends on
        pkg/testutils from rel00.0 for differential testing and does not require pkg/sys
        or pkg/format.
      use_cases:
        - id: rel01.2-uc001-sponge
          status: implemented
    - version: "01.3"
      name: "Batch 1.3 — du specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement du for recursive directory disk usage reporting. du depends on
        pkg/testutils from rel00.0 for differential testing and requires pkg/sys and
        pkg/format for extended file metadata and human-readable size formatting.
      use_cases:
        - id: rel01.3-uc001-du
          status: implemented
    - version: "02.0"
      name: "Batch 2 — trivial utilities (true, false, yes, basename, dirname)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five trivial utilities that require minimal logic and no shared library
        dependencies beyond pkg/testutils. true and false are exit-code-only programs. yes
        outputs repeated lines. basename and dirname perform string-based path manipulation.
        All are verified by differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel02.0-uc001-true
          status: implemented
        - id: rel02.0-uc002-false
          status: implemented
        - id: rel02.0-uc003-yes
          status: implemented
        - id: rel02.0-uc004-basename
          status: implemented
        - id: rel02.0-uc005-dirname
          status: implemented
    - version: "02.1"
      name: "Batch 2.1 — tee specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement tee for copying stdin to stdout and one or more output files simultaneously.
        tee depends on pkg/testutils from rel00.0 for differential testing. Supports append
        mode (-a) and SIGINT suppression (-i).
      use_cases:
        - id: rel02.1-uc001-tee
          status: implemented
    - version: "02.2"
      name: "Batch 2.2 — head and seq specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement head for printing the first N lines or bytes of files, and seq for
        generating number sequences. Both depend on pkg/testutils from rel00.0 for
        differential testing. head supports line-count (-n), byte-count (-c), negative
        counts, and multi-file headers with -q/-v control. seq supports three argument
        forms, format strings (-f), equal-width padding (-w), and custom separators (-s).
      use_cases:
        - id: rel02.2-uc001-head
          status: implemented
        - id: rel02.2-uc002-seq
          status: implemented
    - version: "03.0"
      name: "Batch 3 — wc specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement the wc word, line, and byte counter. wc depends on pkg/testutils from
        rel00.0 for differential testing and does not require pkg/sys or pkg/format.
        Moved from rel01.0 because wc has repeatedly timed out during generation runs
        due to task complexity from expanded sub-requirements.
      use_cases:
        - id: rel03.0-uc001-wc
          status: implemented
    - version: "03.1"
      name: "Batch 3.1 — system information (uname, arch, nproc, hostname, hostid)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five trivial system information utilities that wrap OS queries and print
        results. uname prints kernel name, version, machine architecture, and other system
        fields via individual flags or -a for all. arch prints the machine hardware name
        (equivalent to uname -m). nproc prints the number of available processing units with
        optional --all and --ignore=N flags. hostname prints the system hostname. hostid prints
        the 32-bit host identifier as an 8-digit hexadecimal number. All are verified by
        differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel03.1-uc001-uname
          status: implemented
        - id: rel03.1-uc002-arch
          status: implemented
        - id: rel03.1-uc003-nproc
          status: implemented
        - id: rel03.1-uc004-hostname
          status: implemented
        - id: rel03.1-uc005-hostid
          status: implemented
    - version: "04.0"
      name: "Batch 4 — ls specification and differential test"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Full ls implementation covering all flags: default, -1, -l, -a, -A, -d, --color, -h
        (core), plus -C, -x, sort flags (-t, -S, -r, -U, -v), metadata display (-i, -s, -n),
        -F classify, and -R recursive (extended). Previously split across rel04.0 and rel04.1;
        merged after combining srd008-ls and srd010-ls-extended into a single SRD.
      use_cases:
        - id: rel04.0-uc001-ls
          status: implemented
        - id: rel04.0-uc002-ls-extended
          status: implemented
    - version: "04.1"
      name: "Batch 4.1 — path and terminal utilities (realpath, readlink, pwd, tty, logname)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five path resolution and terminal utilities. realpath prints the resolved
        absolute path for each argument with existence modes (-e, -m), symlink control (-s),
        and relative output (--relative-to, --relative-base). readlink prints the target of
        a symbolic link or canonicalizes paths via -f, -e, -m modes. pwd prints the current
        working directory in logical (-L) or physical (-P) mode. tty prints the terminal
        device name connected to stdin or reports "not a tty" with exit code 1. logname prints
        the login name from the system login record. All are verified by differential testing
        against GNU coreutils reference binaries.
      use_cases:
        - id: rel04.1-uc001-realpath
          status: implemented
        - id: rel04.1-uc002-readlink
          status: implemented
        - id: rel04.1-uc003-pwd
          status: implemented
        - id: rel04.1-uc004-tty
          status: implemented
        - id: rel04.1-uc005-logname
          status: implemented
    - version: "05.0"
      name: "Batch 5 — text stream transforms (echo, tac, nl, fold)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement four easy stream-transform utilities that depend only on pkg/testutils and
        pkg/sys. echo outputs arguments with optional escape interpretation. tac reverses
        line order by buffering all input. nl numbers lines with configurable styles, format,
        and section delimiters. fold wraps long lines to a fixed column or byte width.
        All are verified by differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel05.0-uc001-echo
          status: implemented
        - id: rel05.0-uc002-tac
          status: implemented
        - id: rel05.0-uc003-nl
          status: implemented
        - id: rel05.0-uc004-fold
          status: implemented
    - version: "05.1"
      name: "Batch 5.1 — tab conversion pair (expand, unexpand)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement expand (tabs to spaces) and unexpand (spaces to tabs). Both utilities share
        the same internal expand_common code in the C source and are natural inverses of each
        other, though unexpand is not a lossless inverse. Both support custom tab stop intervals
        and lists via -t. expand passes all characters through and converts only tabs. unexpand
        converts only leading whitespace by default and all whitespace with -a. Both are verified
        by differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel05.1-uc001-expand
          status: implemented
        - id: rel05.1-uc002-unexpand
          status: implemented
    - version: "05.2"
      name: "Batch 5.2 — columnar operations pair (cut, paste)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement cut (extract fields/bytes from lines) and paste (merge file lines side
        by side). cut and paste are complementary: cut removes columns and paste adds them.
        cut supports byte, character, and field selection with range lists, delimiter
        configuration, output delimiter, and complement mode. paste supports parallel merge
        and serial mode with configurable and cycling delimiters. Both are verified by
        differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel05.2-uc001-cut
          status: implemented
        - id: rel05.2-uc002-paste
          status: implemented
    - version: "05.3"
      name: "Batch 5.3 — sorted-stream comparison pair (uniq, comm)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement uniq (filter adjacent duplicate lines) and comm (compare two sorted files).
        Both utilities operate on sorted or adjacently-ordered input. uniq uses windowed
        memory (one previous line) to detect and filter duplicate runs. comm reads one line
        from each of two sorted files and classifies each line into three columns based on
        set membership. Both are verified by differential testing against GNU coreutils
        reference binaries.
      use_cases:
        - id: rel05.3-uc001-uniq
          status: implemented
        - id: rel05.3-uc002-comm
          status: implemented
    - version: "05.4"
      name: "Batch 5.4 — checksum quartet (md5sum, sha1sum, sha256sum, sha512sum)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement md5sum, sha1sum, sha256sum, and sha512sum. All four share the same
        protocol: GNU two-space format for text mode, asterisk format for binary mode,
        BSD tag format, and --check verification mode with OK/FAILED reporting. Each
        delegates to the corresponding Go standard library package (crypto/md5, crypto/sha1,
        crypto/sha256, crypto/sha512). Verified by differential testing against gmd5sum,
        gsha1sum, gsha256sum, and gsha512sum from Homebrew coreutils.
      use_cases:
        - id: rel05.4-uc001-md5sum
          status: implemented
        - id: rel05.4-uc002-sha1sum
          status: implemented
        - id: rel05.4-uc003-sha256sum
          status: implemented
        - id: rel05.4-uc004-sha512sum
          status: implemented
    - version: "06.0"
      name: "Batch 6.0 — file/directory creation and removal (mkdir, rmdir, mktemp, ln, unlink)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five file and directory manipulation utilities. mkdir creates directories
        with optional parent creation (-p) and mode setting (-m). rmdir removes empty
        directories with optional ancestor removal (-p). mktemp creates temporary files or
        directories with unique names. ln creates hard or symbolic links. unlink removes a
        single file via the unlink(2) syscall. All are verified by differential testing
        against GNU coreutils reference binaries.
      use_cases:
        - id: rel06.0-uc001-mkdir
          status: implemented
        - id: rel06.0-uc002-rmdir
          status: implemented
        - id: rel06.0-uc003-mktemp
          status: implemented
        - id: rel06.0-uc004-ln
          status: implemented
        - id: rel06.0-uc005-unlink
          status: implemented
    - version: "06.1"
      name: "Batch 6.1 — environment and identity (env, printenv, id, whoami, groups)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five environment and identity utilities. env runs a command in a modified
        environment with variable setting, unsetting, and clean-environment support. printenv
        prints environment variables with optional NUL-delimited output. id prints user and
        group IDs with selection and modifier flags. whoami prints the effective username.
        groups prints group memberships. All are verified by differential testing against
        GNU coreutils reference binaries.
      use_cases:
        - id: rel06.1-uc001-env
          status: implemented
        - id: rel06.1-uc002-printenv
          status: implemented
        - id: rel06.1-uc003-id
          status: implemented
        - id: rel06.1-uc004-whoami
          status: implemented
        - id: rel06.1-uc005-groups
          status: implemented
    - version: "07.0"
      name: "Batch 7.0 — text processing pipeline (sort, tr, tail)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three text processing utilities that complete the stream processing
        toolkit. sort orders lines with configurable keys, numeric modes, and field
        delimiters. tr translates, deletes, or squeezes characters using SET specifications
        and POSIX character classes. tail prints the last N lines or bytes of files, the
        complement to head (rel02.2). All are verified by differential testing against GNU
        coreutils reference binaries.
      use_cases:
        - id: rel07.0-uc001-sort
          status: implemented
        - id: rel07.0-uc002-tr
          status: implemented
        - id: rel07.0-uc003-tail
          status: implemented
    - version: "07.1"
      name: "Batch 7.1 — file operations (cp, mv, rm)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three fundamental file operation utilities. cp copies files and directories
        with attribute preservation, recursive mode, and symlink handling. mv moves or renames
        files within and across filesystems. rm removes files and directories with recursive,
        force, and interactive modes. All are verified by differential testing against GNU
        coreutils reference binaries, comparing exit codes and resulting file system state.
      use_cases:
        - id: rel07.1-uc001-cp
          status: implemented
        - id: rel07.1-uc002-mv
          status: implemented
        - id: rel07.1-uc003-rm
          status: implemented
    - version: "08.0"
      name: "Batch 8.0 — time, randomness, and expression utilities (date, sleep, touch, timeout, shuf, factor, expr)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement seven utilities spanning time operations, randomness, and expression
        evaluation. date formats and displays date/time with configurable output. sleep pauses
        for a specified duration with suffix support. touch creates files and updates timestamps.
        timeout runs a command with a time limit and signal escalation. shuf randomly permutes
        input lines or generates random samples. factor prints prime factorizations. expr
        evaluates arithmetic, comparison, and string expressions. All are verified by
        differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel08.0-uc001-date
          status: implemented
        - id: rel08.0-uc002-sleep
          status: implemented
        - id: rel08.0-uc003-touch
          status: implemented
        - id: rel08.0-uc004-timeout
          status: implemented
        - id: rel08.0-uc005-shuf
          status: implemented
        - id: rel08.0-uc006-factor
          status: implemented
        - id: rel08.0-uc007-expr
          status: implemented
    - version: "08.1"
      name: "Batch 8.1 — file splitting, joining, formatting, and data display (split, csplit, join, fmt, numfmt, od, printf)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement seven utilities for file splitting, field joining, text formatting, number
        conversion, and data display. split divides files into pieces by line count, byte count,
        or chunk count. csplit splits files at context-determined boundaries using regular
        expressions or line numbers. join performs relational joins on two sorted files. fmt
        reformats text paragraphs to a specified width. numfmt converts numbers between raw
        and human-readable formats with SI/IEC suffixes. od dumps file contents in octal,
        hexadecimal, and other formats. printf formats and prints data using printf-style
        format strings. All are verified by differential testing against GNU coreutils
        reference binaries.
      use_cases:
        - id: rel08.1-uc001-split
          status: implemented
        - id: rel08.1-uc002-csplit
          status: implemented
        - id: rel08.1-uc003-join
          status: implemented
        - id: rel08.1-uc004-fmt
          status: implemented
        - id: rel08.1-uc005-numfmt
          status: implemented
        - id: rel08.1-uc006-od
          status: implemented
        - id: rel08.1-uc007-printf
          status: implemented
    - version: "09.0"
      name: "Batch 9.0 — hash and checksum utilities (sha224sum, sha384sum, b2sum, cksum, sum)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement five checksum and hash utilities. sha224sum and sha384sum complete the
        SHA-2 family alongside the existing sha256sum and sha512sum. b2sum adds BLAKE2b
        support with variable-length digests. cksum computes POSIX CRC-32 checksums with
        optional algorithm selection for modern hashes. sum computes BSD or System V
        checksums. All are verified by differential testing against GNU coreutils reference
        binaries.
      use_cases:
        - id: rel09.0-uc001-sha224sum
          status: implemented
        - id: rel09.0-uc002-sha384sum
          status: implemented
        - id: rel09.0-uc003-b2sum
          status: implemented
        - id: rel09.0-uc004-cksum
          status: implemented
        - id: rel09.0-uc005-sum
          status: implemented
    - version: "09.1"
      name: "Batch 9.1 — encoding utilities (base32, base64, basenc)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three encoding/decoding utilities. base32 and base64 handle RFC 4648
        Base32 and Base64 encoding with wrap control and decode modes. basenc is a
        generalized encoder supporting Base64, Base64URL, Base32, Base32hex, Base16, and
        Z85 alphabets. All are verified by differential testing against GNU coreutils
        reference binaries.
      use_cases:
        - id: rel09.1-uc001-base32
          status: implemented
        - id: rel09.1-uc002-base64
          status: implemented
        - id: rel09.1-uc003-basenc
          status: implemented
    - version: "10.0"
      name: "Batch 10.0 — file metadata and operations (stat, truncate, link, sync)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement four file metadata and operation utilities. stat displays file and
        filesystem status with printf-style format strings. truncate sets or adjusts file
        sizes with relative operations and unit suffixes. link creates hard links via the
        link(2) system call. sync flushes filesystem caches with per-file and filesystem
        modes. All are verified by differential testing against GNU coreutils reference
        binaries.
      use_cases:
        - id: rel10.0-uc001-stat
          status: implemented
        - id: rel10.0-uc002-truncate
          status: implemented
        - id: rel10.0-uc003-link
          status: implemented
        - id: rel10.0-uc004-sync
          status: implemented
    - version: "10.1"
      name: "Batch 10.1 — permission and ownership (chmod, chgrp, chown)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three permission and ownership utilities. chmod changes file mode bits
        with octal and symbolic mode specifications. chgrp changes group ownership. chown
        changes file owner and group with OWNER[:GROUP] syntax. All support recursive
        traversal and symlink handling options. All are verified by differential testing
        against GNU coreutils reference binaries.
      use_cases:
        - id: rel10.1-uc001-chmod
          status: implemented
        - id: rel10.1-uc002-chgrp
          status: implemented
        - id: rel10.1-uc003-chown
          status: implemented
    - version: "11.0"
      name: "Batch 11.0 — special files and process control (mkfifo, mknod, nice, nohup)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement four special file and process control utilities. mkfifo creates named
        pipes. mknod creates block special, character special, or FIFO files. nice runs
        commands with adjusted scheduling priority. nohup runs commands immune to SIGHUP
        with automatic output redirection. All are verified by differential testing against
        GNU coreutils reference binaries.
      use_cases:
        - id: rel11.0-uc001-mkfifo
          status: implemented
        - id: rel11.0-uc002-mknod
          status: implemented
        - id: rel11.0-uc003-nice
          status: implemented
        - id: rel11.0-uc004-nohup
          status: implemented
    - version: "11.1"
      name: "Batch 11.1 — user and session information (users, who, pinky)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three user information utilities. users prints login names of logged-in
        users. who shows detailed login session information with idle time and boot time.
        pinky provides lightweight finger-style user lookups with GECOS field display. All
        read the utmpx database and are verified by differential testing against GNU
        coreutils reference binaries.
      use_cases:
        - id: rel11.1-uc001-users
          status: implemented
        - id: rel11.1-uc002-who
          status: implemented
        - id: rel11.1-uc003-pinky
          status: implemented
    - version: "12.0"
      name: "Batch 12.0 — file security and installation (shred, chroot, install)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three file security and installation utilities. shred overwrites files
        with random data to prevent recovery. chroot changes the root directory and
        executes commands in the new root. install copies files while setting ownership,
        permissions, and creating directories. All are verified by differential testing
        against GNU coreutils reference binaries.
      use_cases:
        - id: rel12.0-uc001-shred
          status: implemented
        - id: rel12.0-uc002-chroot
          status: implemented
        - id: rel12.0-uc003-install
          status: implemented
    - version: "12.1"
      name: "Batch 12.1 — miscellaneous utilities (tsort, pathchk, test)"
      status: implemented
      depends_on: ["00.0"]
      description: |
        Implement three miscellaneous utilities. tsort performs topological sorting with
        cycle detection. pathchk validates pathnames against POSIX portability rules. test
        evaluates conditional expressions for file tests, string comparisons, and integer
        arithmetic. All are verified by
        differential testing against GNU coreutils reference binaries.
      use_cases:
        - id: rel12.1-uc001-tsort
          status: implemented
        - id: rel12.1-uc002-pathchk
          status: implemented
        - id: rel12.1-uc003-test
          status: implemented
    - version: "13.0"
      name: "Batch 13.0 — directory listing and filesystem (df, dir, vdir, dircolors)"
      status: spec_complete
      depends_on: ["00.0"]
      description: |
        Implement four directory listing and filesystem utilities. df reports filesystem
        disk space usage with human-readable and SI format options. dir lists directory
        contents in multi-column format (equivalent to ls -C -b). vdir lists directory
        contents in long format (equivalent to ls -l -b). dircolors outputs shell commands
        to set LS_COLORS for colorized ls output. All are verified by differential testing
        against GNU coreutils reference binaries.
      use_cases:
        - id: rel13.0-uc001-df
          status: implemented
        - id: rel13.0-uc002-dir
          status: implemented
        - id: rel13.0-uc003-vdir
          status: implemented
        - id: rel13.0-uc004-dircolors
          status: implemented
    - version: "14.0"
      name: "Batch 14.0 — moreutils (chronic, pee, vidir)"
      status: spec_complete
      depends_on: ["00.0"]
      description: |
        Implement three moreutils utilities. chronic runs commands and suppresses output
        unless the command fails, useful for cron jobs. pee tees stdin to multiple pipe
        commands simultaneously. vidir enables batch renaming and deletion of files by
        editing a directory listing in a text editor. All are verified by differential
        testing against Homebrew moreutils reference binaries.
      use_cases:
        - id: rel14.0-uc001-chronic
          status: spec_complete
        - id: rel14.0-uc002-pee
          status: spec_complete
        - id: rel14.0-uc003-vidir
          status: spec_complete
    - version: "15.0"
      name: "Batch 15.0 — complex utilities (ts, stty, pr, ptx)"
      status: spec_complete
      depends_on: ["00.0"]
      description: |
        Implement four complex utilities that require extended stitch time due to
        algorithmic complexity. ts timestamps stdin lines with multiple modes including
        relative-time conversion. stty prints and changes terminal line settings via
        termios. pr paginates text files with headers, page numbers, and multi-column
        layout. ptx produces a permuted keyword-in-context index. All SRDs have been
        restructured so each weight-4 requirement is in its own group. All are verified
        by differential testing against reference binaries.
      use_cases:
        - id: rel15.0-uc001-ts
          status: spec_complete
        - id: rel15.0-uc002-stty
          status: spec_complete
        - id: rel15.0-uc003-pr
          status: spec_complete
        - id: rel15.0-uc004-ptx
          status: spec_complete
