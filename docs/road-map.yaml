id: go-unix-utils-roadmap
title: "go-unix-utils Release Road Map"

releases:
  - version: "00.0"
    name: "Batch 0 — foundational infrastructure"
    status: in_progress
    description: |
      Specify and verify the build lifecycle and shared library infrastructure that all
      subsequent releases depend on. This release covers magefiles/ (build, lint, clean,
      install targets and cmd/version), pkg/testutils (differential testing harness),
      pkg/sys (syscall abstractions), and pkg/format (output formatting). The cmd/version
      binary is the first compiled artifact and the smoke test for the build pipeline.
    use_cases:
      - id: rel00.0-uc001-magefiles
        status: specs_written
      - id: rel00.0-uc002-format
        status: specs_written

  - version: "01.0"
    name: "Batch 1 — ts specification and differential test"
    status: spec_complete
    description: |
      Establish the end-to-end pipeline for a single utility: derive the PRD from C/Perl
      source, write a use case, produce a test suite, and verify a passing differential
      test against the Homebrew ts reference binary. This release also establishes the
      shared infrastructure PRDs (pkg/testutils, pkg/sys, pkg/format) and the source
      extraction and dependency analysis artifacts.
    use_cases:
      - id: rel01.0-uc001-ts
        status: spec_complete

  - version: "01.1"
    name: "Batch 2 — wc, cat, sponge specification and differential tests"
    status: spec_complete
    description: |
      Extend the pipeline to three additional moreutils/coreutils utilities that share
      the same pkg/testutils dependency and do not require pkg/sys or pkg/format. Each
      utility gets a PRD, use case, and test suite.
    use_cases:
      - id: rel01.1-uc001-wc
        status: spec_complete
      - id: rel01.1-uc002-cat
        status: spec_complete
      - id: rel01.1-uc003-sponge
        status: spec_complete

  - version: "02.0"
    name: "Batch 3 — ls core and du specification and differential tests"
    status: spec_complete
    description: |
      Extend the pipeline to utilities that require the pkg/sys and pkg/format shared
      libraries. ls core covers the most common flags (default, -1, -l, -a, -A, -d,
      --color, -h). du covers recursive directory sizes with -h, -s, -a, -d, -k, -m,
      -c, and --apparent-size. Each utility gets a PRD, use case, and test suite.
    use_cases:
      - id: rel02.0-uc001-ls
        status: spec_complete
      - id: rel02.0-uc002-du
        status: spec_complete

  - version: "02.1"
    name: "Batch 4 — ls extended specification and differential tests"
    status: spec_complete
    description: |
      Extend ls with flags requiring heavier normalization or more complex layout logic:
      -C (forced multi-column), -x (horizontal), sort flags (-t, -S, -r, -U, -v),
      metadata display (-i inode, -s blocks, -n numeric IDs), -F classify, -R recursive.
    use_cases:
      - id: rel02.1-uc001-ls-extended
        status: spec_complete
