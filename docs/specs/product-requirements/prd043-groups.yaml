id: prd043-groups
title: "cmd/groups: Print Group Memberships"

problem: |
  Shell scripts that check group-based permissions need a quick way to list a user's group
  memberships. The groups utility wraps the system group database into a one-line summary.
  The macOS BSD groups and GNU groups share the same basic behavior but differ in output
  formatting for named-user queries. The Go implementation must match the Homebrew GNU
  reference binary (ggroups, installed by coreutils) byte-for-byte on all argument
  combinations and edge cases, verified by differential testing via pkg/testutils.

goals:
  - G1: Print the group memberships of the current user when invoked with no arguments.
  - G2: Print the group memberships of one or more named users when USER arguments are given.
  - G3: Format output consistently with the GNU reference, including the "user :" prefix for named-user queries.

requirements:
  R1:
    title: Default behavior
    items:
      - R1.1:
          text: When invoked with no arguments, must print the group names of the current user, space-separated, on a single line followed by a newline, and exit 0.
          weight: 1
      - R1.2:
          text: When invoked with one or more USER arguments, must print the groups for each user on a separate line and exit 0.
          weight: 1
      - R1.3:
          text: If a named USER does not exist, must print an error message to stderr for that user and continue processing remaining users. Must exit 1 if any user was not found.
          weight: 1

  R2:
    title: Output format
    items:
      - R2.1:
          text: When no USER argument is given, must print only the space-separated group names with no prefix.
          weight: 1
      - R2.2:
          text: "When USER arguments are given, each line must be formatted as: 'user : group1 group2 ...' with the user name, a space, a colon, a space, and then the space-separated group names."
          weight: 1
      - R2.3:
          text: Group names must appear in the order returned by the system group database.
          weight: 1

  R3:
    title: Differential testing
    items:
      - R3.1:
          text: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (ggroups) via pkg/testutils.
          weight: 1
      - R3.2:
          text: "Tests must cover: no-argument current-user output, single named user, multiple named users, nonexistent user error, and mixed valid/invalid users."
          weight: 1
      - R3.3:
          text: Tests must verify the "user :" prefix format for named-user queries.
          weight: 1

non_goals:
  - cmd/groups does not support any flags beyond --help and --version; it has no optional behavior modes.
  - cmd/groups does not print GIDs; only group names are output.
  - cmd/groups does not read user names from stdin; all input comes from command-line arguments.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/groups with no arguments prints the current user's groups, matching ggroups."
    traces:
      - R1.1
      - R1.2
      - R1.3
  - id: AC2
    criterion: "go run ./cmd/groups root prints 'root : ...' with root's groups, matching ggroups root."
    traces:
      - R1.1
      - R1.2
      - R1.3
  - id: AC3
    criterion: "go run ./cmd/groups root nobody prints one line per user with the 'user :' prefix, matching ggroups."
    traces:
      - R1.1
      - R1.2
      - R1.3
  - id: AC4
    criterion: "go run ./cmd/groups nonexistentuser exits 1 with an error message to stderr, matching ggroups."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R3.1
      - R3.2
  - id: AC5
    criterion: "Differential test against ggroups passes for current-user, named users, and error cases."
    traces:
      - R1.3
      - R3.1
      - R3.2
  - id: AC6
    criterion: "cmd/groups compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R3.3
