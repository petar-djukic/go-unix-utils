id: prd020-true
title: "cmd/true: Exit Successfully"

problem: |
  Shell scripts use true as a no-op command that always succeeds. It appears in conditional
  expressions, while loops (while true; do ...; done), and as a placeholder in pipelines.
  The Go implementation must match the Homebrew GNU reference binary (gtrue, installed by
  coreutils) in exit code behavior and output, verified by differential testing via
  pkg/testutils under LC_ALL=C.

goals:
  - G1: Exit with status 0 unconditionally, matching GNU true exit behavior.
  - G2: Handle --help and --version flags, matching GNU true flag handling.

requirements:
  R1:
    title: Exit status
    items:
      - R1.1: Must exit with status 0 when invoked with no arguments.
      - R1.2: Must exit with status 0 when invoked with any arguments that are not --help or --version. Arguments are not parsed, validated, or acted upon; they are silently ignored.
      - R1.3: Must not read from stdin under any circumstances.
      - R1.4: Must not write to stdout or stderr under normal operation (no arguments or unrecognized arguments).

  R2:
    title: Flag handling (--help, --version)
    items:
      - R2.1: When --help is the first argument, must print a usage message to stdout and exit 0. Remaining arguments after --help are ignored.
      - R2.2: When --version is the first argument, must print version information to stdout and exit 0. Remaining arguments after --version are ignored.
      - R2.3: Only the first argument is checked for --help and --version. If --help or --version appears in any position other than the first argument, it is ignored and true exits 0 silently.

  R3:
    title: Operand behavior
    items:
      - R3.1: All operands (non-flag arguments) are silently ignored. true does not distinguish between flags and operands; everything except --help and --version as the first argument is discarded.
      - R3.2: The "--" end-of-options marker has no special meaning to true. It is ignored like any other argument.

  R4:
    title: SIGPIPE handling
    items:
      - R4.1: |
          Must install a SIGPIPE handler at startup using pkg/sys.InstallSIGPIPEHandler, matching
          the pattern used by other utilities in the project (see cmd/cat/main.go). This ensures
          silent exit when stdout is closed by a downstream consumer in a pipeline.

  R5:
    title: Error handling and exit codes
    items:
      - R5.1: Must exit 0 in all cases except a write error during --help or --version output.
      - R5.2: If a write error occurs while printing --help or --version output (e.g., SIGPIPE or full disk), must exit 1.
      - R5.3: "Error messages for write failures must be written to stderr in the format: \"true: <error description>\"."
      - R5.4: Must not exit with any status other than 0 or 1.

non_goals:
  - cmd/true does not implement any flags beyond --help and --version.
  - cmd/true does not perform any computation or I/O beyond the optional help/version output.
  - cmd/true does not read from stdin or process piped input.

acceptance_criteria:
  - "AC1: go run ./cmd/true; echo $? prints 0."
  - "AC2: go run ./cmd/true foo bar --baz; echo $? prints 0."
  - "AC3: go run ./cmd/true --help prints a usage message to stdout and exits 0."
  - "AC4: go run ./cmd/true --version prints version information to stdout and exits 0."
  - "AC5: Differential test against gtrue passes with LC_ALL=C for no-args, arbitrary-args, and single-unrecognized-flag cases, comparing exit codes."
  - "AC6: Differential test verifies no stdout or stderr output when invoked without --help or --version, under LC_ALL=C."
  - "AC7: cmd/true compiles with no warnings under golangci-lint."
