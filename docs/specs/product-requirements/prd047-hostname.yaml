id: prd047-hostname
title: "cmd/hostname: Print System Hostname"

problem: |
  Scripts and configuration tools use hostname to query the system's network node name.
  The GNU coreutils hostname is deliberately minimal compared to the net-tools hostname:
  it prints the hostname and exits. The Go implementation must match the Homebrew GNU
  reference binary (ghostname, installed by coreutils) byte-for-byte on stdout and exit
  code, verified by differential testing via pkg/testutils.

goals:
  - G1: Print the system hostname followed by a newline.
  - G2: Reject any extra operands or unsupported flags with an error message and nonzero exit.

requirements:
  R1:
    title: Default behavior
    items:
      - R1.1: When invoked with no arguments, must print the system hostname followed by a newline and exit 0.
      - R1.2: The output must be identical to the value returned by the gethostname(2) syscall on the current system.

  R2:
    title: Error handling
    items:
      - R2.1: If any extra operand is provided (beyond --help and --version), must print an error message to stderr and exit 1.
      - R2.2: Must not accept any flags other than --help and --version. Unknown flags must produce an error message to stderr and exit 1.

  R3:
    title: Differential testing
    items:
      - R3.1: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (ghostname) via pkg/testutils.
      - R3.2: "Tests must cover: normal invocation (no arguments), extra operand error, and unknown flag error."
      - R3.3: All differential tests must set LC_ALL=C in the environment.

non_goals:
  - cmd/hostname does not set the hostname; it is read-only.
  - cmd/hostname does not support -s (short), -f (FQDN), -d (domain), or -i (IP) flags found in the net-tools hostname. The GNU coreutils hostname is a simpler utility.

acceptance_criteria:
  - "AC1: go run ./cmd/hostname prints the system hostname, matching ghostname."
  - "AC2: go run ./cmd/hostname extraarg exits 1 with an error message to stderr, matching ghostname."
  - "AC3: Differential test against ghostname passes for normal invocation and error cases."
  - "AC4: cmd/hostname compiles with no warnings under golangci-lint."
