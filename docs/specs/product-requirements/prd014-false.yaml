id: prd014-false
title: "cmd/false: Exit Unsuccessfully"

problem: |
  Shell scripts use false as a no-op command that always fails. It appears in conditional
  expressions, error-path testing, and as a placeholder where a non-zero exit is needed.
  The Go implementation must match the Homebrew GNU reference binary (gfalse, installed by
  coreutils) in exit code behavior, verified by differential testing via pkg/testutils.

goals:
  - G1: Exit with status 1 unconditionally, ignoring all arguments.
  - G2: Produce no output unless --help or --version is given.

requirements:
  R1:
    title: Core behavior
    items:
      - R1.1:
          text: Must exit with status 1 when invoked with no arguments.
          weight: 1
      - R1.2:
          text: Must exit with status 1 when invoked with any arguments, ignoring them entirely. Arguments are not parsed, validated, or acted upon.
          weight: 1
      - R1.3:
          text: Must not read from stdin. Must not write to stdout or stderr under normal operation (no arguments or unrecognized arguments).
          weight: 1

  R2:
    title: Help and version output
    items:
      - R2.1:
          text: When --help is the first argument, must print a usage message to stdout and exit 0.
          weight: 1
      - R2.2:
          text: When --version is the first argument, must print version information to stdout and exit 0.
          weight: 1
      - R2.3:
          text: If a write error occurs while printing --help or --version output, must exit 1.
          weight: 1

  R3:
    title: Exit codes
    items:
      - R3.1:
          text: Must exit 1 in all cases except when --help or --version is given and output succeeds (exit 0).
          weight: 1
      - R3.2:
          text: Must not exit with any status other than 0 or 1.
          weight: 1

  R4:
    title: Differential testing
    items:
      - R4.1:
          text: Differential tests must compare exit codes between the Go binary and the reference binary via pkg/testutils.
          weight: 1
      - R4.2:
          text: "Tests must cover: no arguments, arbitrary arguments (ignored), --help output, and --version output."
          weight: 1
      - R4.3:
          text: Tests must verify that no output is produced on stdout or stderr when invoked without --help or --version.
          weight: 1

non_goals:
  - cmd/false does not implement any flags beyond --help and --version.
  - cmd/false does not perform any computation or I/O beyond the optional help/version output.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/false; echo $? prints 1."
    traces:
      - R1.1
      - R1.2
      - R1.3
  - id: AC2
    criterion: "go run ./cmd/false foo bar --baz; echo $? prints 1."
    traces:
      - R1.1
      - R1.2
      - R1.3
  - id: AC3
    criterion: "go run ./cmd/false --help prints a usage message and exits 0, matching gfalse --help."
    traces:
      - R1.1
      - R1.2
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R4.1
      - R4.2
      - R4.3
  - id: AC4
    criterion: "Differential test against gfalse passes for no-args and arbitrary-args cases."
    traces:
      - R4.1
  - id: AC5
    criterion: "cmd/false compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R4.1
      - R4.2
      - R4.3
