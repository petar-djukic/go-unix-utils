id: prd051-pwd
title: "cmd/pwd: Print Working Directory"

problem: |
  Scripts use pwd to obtain the current working directory as an absolute path. The utility
  supports two modes: logical (-L, uses the PWD environment variable preserving symlink
  names) and physical (-P, resolves symlinks via the filesystem). The Go implementation
  must match the Homebrew GNU reference binary (gpwd, installed by coreutils) byte-for-byte
  on stdout and exit code, verified by differential testing via pkg/testutils.

goals:
  - G1: Print the absolute pathname of the current working directory.
  - G2: Support logical (-L) and physical (-P) modes.

requirements:
  R1:
    title: Default behavior and modes
    items:
      - R1.1: When invoked with no arguments, must print the current working directory followed by a newline and exit 0. The default mode is -P (physical).
      - R1.2: "-L (--logical) must print the value of the PWD environment variable if it names the current directory and contains no . or .. components. If PWD is unset or invalid, must fall back to physical mode."
      - R1.3: "-P (--physical) must print the resolved physical path with all symlinks resolved."
      - R1.4: When both -L and -P are given, the last one specified takes precedence.

  R2:
    title: Error handling
    items:
      - R2.1: If any positional operand is provided, must print an error message to stderr and exit 1.
      - R2.2: Unknown flags must produce an error message to stderr and exit 1.

  R3:
    title: Differential testing
    items:
      - R3.1: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (gpwd) via pkg/testutils.
      - R3.2: "Tests must cover: default invocation, -L, -P, -L -P precedence, and error cases."
      - R3.3: All differential tests must set LC_ALL=C in the environment.

non_goals:
  - cmd/pwd does not change the working directory.
  - cmd/pwd does not support any output formatting options.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/pwd prints the current directory, matching gpwd."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
  - id: AC2
    criterion: "go run ./cmd/pwd -L prints the logical path from PWD, matching gpwd -L."
    traces:
      - R1.2
      - R1.4
      - R3.2
  - id: AC3
    criterion: "go run ./cmd/pwd -P prints the physical path, matching gpwd -P."
    traces:
      - R1.1
      - R1.3
      - R1.4
      - R3.2
  - id: AC4
    criterion: "Differential test against gpwd passes for all modes and error cases."
    traces:
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
  - id: AC5
    criterion: "cmd/pwd compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
