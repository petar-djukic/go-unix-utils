id: prd045-arch
title: "cmd/arch: Print Machine Hardware Name"

problem: |
  The arch utility prints the machine hardware name, equivalent to uname -m. It is used in
  scripts that branch on CPU architecture (e.g., x86_64 vs arm64) without invoking the full
  uname flag set. The Go implementation must match the Homebrew GNU reference binary (garch,
  installed by coreutils) byte-for-byte on stdout and exit code, verified by differential
  testing via pkg/testutils.

goals:
  - G1: Print the machine hardware name followed by a newline.
  - G2: Reject any extra operands with an error message and nonzero exit.

requirements:
  R1:
    title: Default behavior
    items:
      - R1.1: When invoked with no arguments, must print the machine hardware name (e.g., x86_64, arm64) followed by a newline and exit 0.
      - R1.2: The output must be identical to guname -m on the same system.

  R2:
    title: Error handling
    items:
      - R2.1: If any extra operand is provided (beyond --help and --version), must print an error message to stderr and exit 1.
      - R2.2: Must not accept any flags other than --help and --version. Unknown flags must produce an error message to stderr and exit 1.

  R3:
    title: Differential testing
    items:
      - R3.1: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (garch) via pkg/testutils.
      - R3.2: "Tests must cover: normal invocation (no arguments), extra operand error, and unknown flag error."
      - R3.3: All differential tests must set LC_ALL=C in the environment.

non_goals:
  - cmd/arch does not accept any flags for selecting different information fields; use cmd/uname for that.
  - cmd/arch does not print processor type (-p) or hardware platform (-i).

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/arch prints the machine hardware name, matching garch."
    traces:
      - R1.1
      - R1.2
  - id: AC2
    criterion: "go run ./cmd/arch extraarg exits 1 with an error message to stderr, matching garch."
    traces:
      - R1.1
      - R2.1
      - R2.2
      - R3.1
      - R3.2
  - id: AC3
    criterion: "Differential test against garch passes for normal invocation and error cases."
    traces:
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
  - id: AC4
    criterion: "cmd/arch compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
