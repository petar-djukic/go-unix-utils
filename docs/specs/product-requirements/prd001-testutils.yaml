id: prd001-testutils
title: "pkg/testutils: Differential Testing Harness"

problem: |
  Every utility in go-unix-utils is verified by running the Go binary and the Homebrew
  GNU reference binary side by side and comparing their stdout, stderr, and exit code.
  Without a shared harness, each cmd/ package would duplicate the execution and comparison
  logic, the normalization hooks needed for non-deterministic output (timestamps in ts,
  path ordering in find), and the divergence reporting format. This duplication makes
  the verification layer fragile: a bug in one cmd/'s harness copy would produce
  different verification behavior than another cmd/'s copy.

  pkg/testutils is the acceptance gate for the entire pipeline. The mage-claude-orchestrator
  cannot declare a utility complete until its differential tests pass through this harness.

goals:
  - G1: Provide a single execution function that runs a Go binary and a GNU reference binary with identical inputs and returns both outputs for comparison.
  - G2: Provide a comparison function that diffs stdout, stderr, and exit code and reports divergence with the triggering input.
  - G3: Provide a normalization hook mechanism so individual utilities can strip or replace non-deterministic output fields before comparison.
  - G4: Integrate with go test so that each cmd/ package can define test cases as data and call the harness from a standard TestXxx function.

requirements:
  R1:
    title: Test case data structure
    items:
      - R1.1: |
          Must define DiffTest as the following named struct in package testutils:

            type DiffTest struct {
                Name          string                 // subtest name used with t.Run; required
                Args          []string               // command-line arguments passed to both binaries
                Stdin         []byte                 // nil = no stdin (both binaries receive EOF immediately)
                Env           []string               // nil = inherit test process environment with no overrides; non-nil values are KEY=VALUE pairs that override or extend the inherited environment
                ExitCode      int                    // expected exit code for both binaries
                Normalize     []func([]byte) []byte  // applied in order to stdout and stderr of both binaries before comparison; nil or empty = no normalization
                ExpectedFiles map[string][]byte      // optional: path -> expected byte content after execution, for file-output utilities (sponge, cp)
            }
      - R1.2: DiffTest.Stdin nil means both binaries receive EOF immediately on stdin. An empty non-nil slice ([]byte{}) also produces no bytes but is semantically distinct (open stdin that is immediately closed).
      - R1.3: DiffTest.Env nil means both binaries inherit the test process environment unchanged. When non-nil, the slice replaces (does not append to) the process environment for that invocation.
      - R1.4: Must define type NormalizeFunc = func([]byte) []byte as a named type alias in package testutils. The Normalize field in DiffTest uses this element type. When the slice is nil or empty, no normalization is applied to stdout or stderr.

  R2:
    title: Binary execution
    items:
      - R2.1: |
          Must provide func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) that accepts the path to the Go binary under test (goBinary) and the GNU reference binary (refBinary), then runs each DiffTest as a named subtest via t.Run(test.Name, ...). Both binaries are invoked with identical Args, Stdin, and Env for each test case.
      - R2.2: Must capture stdout, stderr, and exit code from each binary independently.
      - R2.3: Must impose a configurable timeout on each binary invocation. The default timeout must be 10 seconds. The test fails if either binary exceeds the timeout.
      - R2.4: Must not write any output to the test process stdout or stderr during a passing test run.
      - R2.5: Must support passing a working directory to each binary invocation. When not specified, both binaries run in a per-test temporary directory created by the harness.

  R3:
    title: Comparison and reporting
    items:
      - R3.1: Must apply the DiffTest.Normalize function (if non-nil) to both binaries' stdout and stderr before comparison.
      - R3.2: Must compare normalized stdout byte-for-byte. Any difference must be reported as a test failure.
      - R3.3: Must compare normalized stderr byte-for-byte. Any difference must be reported as a test failure.
      - R3.4: Must compare exit codes exactly. A difference must be reported as a test failure.
      - R3.5: 'Must report divergence with the following information in the failure message: the DiffTest args, the stdin content (truncated to 256 bytes if longer), the reference binary stdout, the Go binary stdout, the reference stderr, the Go stderr, and both exit codes.'
      - R3.6: Must run each DiffTest as a named subtest (t.Run) so individual test case failures are identifiable in go test output.

  R4:
    title: Normalization hooks
    items:
      - R4.1: Must allow per-DiffTest normalization via the Normalize field. The function receives the raw output bytes and returns the normalized bytes.
      - R4.2: Must provide a built-in TimestampNormalizer that replaces common strftime timestamp patterns with a fixed placeholder string. This normalizer is used by cmd/ts tests.
      - R4.3: 'Must allow normalizers to be composed: the harness must accept a slice of Normalize functions applied in order, not a single function. When the slice is nil or empty, no normalization is applied.'

  R5:
    title: File-state comparison
    items:
      - R5.1: Must support utilities whose primary output is a file rather than stdout (sponge, cp, mv). For these, DiffTest must allow specifying expected file content after execution alongside expected stdout/stderr.
      - R5.2: Must compare expected file content byte-for-byte and report divergence in the same format as stdout divergence.

non_goals:
  - pkg/testutils does not build or compile the Go binaries under test.
  - pkg/testutils does not install or manage Homebrew reference binaries.
  - pkg/testutils does not produce test reports beyond standard go test output.
  - pkg/testutils does not implement retry logic; a failing test fails immediately.
  - pkg/testutils does not mock or stub the filesystem or OS for unit testing cmd/ packages.

acceptance_criteria:
  - "AC1: A cmd/ package can define a []DiffTest slice and call RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) from a TestXxx function with no other setup. RunDiffTests runs each DiffTest as a named subtest (t.Run(test.Name, ...)) and calls t.Fatal on the first divergence in any subtest."
  - "AC2: A passing test run produces no output. A failing test prints the triggering args, stdin, and both binaries' stdout, stderr, and exit code."
  - "AC3: TimestampNormalizer replaces strftime-formatted timestamps (e.g., \"Feb 19 12:34:56\") with a fixed placeholder so that ts differential tests pass despite wall-clock differences."
  - "AC4: A DiffTest with a file expectation field correctly fails when the Go binary writes different content than the reference binary."
  - "AC5: A DiffTest that exceeds the timeout fails with a clear timeout message rather than hanging the test run."
  - "AC6: All pkg/testutils code compiles with no warnings under golangci-lint."
