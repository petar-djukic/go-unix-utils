id: prd031-sha1sum
title: "cmd/sha1sum: Compute and Check SHA-1 Message Digests"

problem: |
  macOS ships shasum rather than sha1sum; the output format and flag set differ from GNU
  sha1sum. Scripts that generate or verify SHA-1 checksums using the GNU format cannot
  use the macOS native binary without wrapper adjustments. The Go implementation must
  match the Homebrew GNU reference binary (gsha1sum, installed by coreutils) byte-for-byte
  on all flag combinations, using crypto/sha1 from the Go standard library, verified by
  differential testing via pkg/testutils.

goals:
  - G1: Compute SHA-1 digests for one or more files or stdin and print them in GNU format, matching gsha1sum behavior.
  - G2: Support --check (-c) to verify a checksum file and report mismatches.
  - G3: Support --binary (-b), --text (-t), and --tag output format flags.

requirements:
  R1:
    title: Digest computation
    items:
      - R1.1:
          text: Must compute the SHA-1 digest of each named file and write one line per file in the format "HASH  FILENAME" (text mode) or "HASH *FILENAME" (binary mode). The default is text mode.
          weight: 1
      - R1.2:
          text: Must read from stdin and print "HASH  -" when no file arguments are given or when "-" is provided as a filename.
          weight: 1
      - R1.3:
          text: --tag must use BSD-style output format "SHA1 (FILENAME) = HASH".
          weight: 1
      - R1.4:
          text: Must exit 1 when any named file cannot be opened, printing an error to stderr, and continue processing remaining files.
          weight: 1

  R2:
    title: Checksum verification (--check, -c)
    items:
      - R2.1:
          text: "--check FILE must read FILE, parse each line (GNU or BSD tag format), recompute the digest, and compare to the stored hash."
          weight: 1
      - R2.2:
          text: 'Must print "FILENAME: OK" or "FILENAME: FAILED" for each entry. Must exit 1 if any check fails.'
          weight: 1
      - R2.3:
          text: --warn prints a warning for each malformed line. --quiet suppresses OK lines. --status suppresses all output.
          weight: 1

  R3:
    title: Binary and text mode flags
    items:
      - R3.1:
          text: -b marks input as binary; output uses "HASH *FILENAME". -t (default) uses "HASH  FILENAME". On Linux/macOS, no functional difference for digest computation.
          weight: 1
      - R3.2:
          text: --tag produces BSD tag format regardless of -b/-t.
          weight: 1

  R4:
    title: Exit codes and SIGPIPE
    items:
      - R4.1:
          text: Must exit 0 when all files are processed and all verified digests match.
          weight: 1
      - R4.2:
          text: Must exit 1 when any file cannot be opened, any digest fails, or the checksum file is unreadable.
          weight: 1
      - R4.3:
          text: Must handle SIGPIPE gracefully (exit 0) using pkg/sys.InstallSIGPIPEHandler.
          weight: 1

non_goals:
  - cmd/sha1sum does not implement HMAC-SHA1 or keyed variants.
  - SHA-1 is cryptographically broken; this implementation is for compatibility with GNU tools only.

acceptance_criteria:
  - id: AC1
    criterion: "sha1sum on a known file produces the correct SHA-1 hash in GNU format, matching gsha1sum."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
  - id: AC2
    criterion: "sha1sum --check on a valid checksum file exits 0 and prints 'FILENAME: OK' for each entry."
    traces:
      - R1.4
      - R2.1
      - R2.2
      - R4.1
      - R4.2
      - R4.3
  - id: AC3
    criterion: "sha1sum --check on a file with a mismatch exits 1 and prints 'FILENAME: FAILED'."
    traces:
      - R1.4
      - R2.1
      - R2.2
      - R4.1
      - R4.2
      - R4.3
  - id: AC4
    criterion: "Differential test against gsha1sum passes for all required test cases."
    traces:
      - R3.1
  - id: AC5
    criterion: "cmd/sha1sum compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R4.1
      - R4.2
      - R4.3
