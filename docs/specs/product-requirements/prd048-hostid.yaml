id: prd048-hostid
title: "cmd/hostid: Print Numeric Host Identifier"

problem: |
  The hostid utility prints the numeric identifier of the current host as an 8-digit
  hexadecimal number. While rarely used in modern systems, it appears in legacy license
  managers and system fingerprinting scripts. The Go implementation must match the Homebrew
  GNU reference binary (ghostid, installed by coreutils) byte-for-byte on stdout and exit
  code, verified by differential testing via pkg/testutils.

goals:
  - G1: Print the 32-bit host identifier as an 8-digit lowercase hexadecimal number.
  - G2: Reject any extra operands with an error message and nonzero exit.

requirements:
  R1:
    title: Default behavior
    items:
      - R1.1:
          text: When invoked with no arguments, must print the 32-bit host identifier as an 8-digit lowercase hexadecimal number followed by a newline and exit 0.
          weight: 1
      - R1.2:
          text: The value must be derived from the gethostid(3) syscall or equivalent system call on the current platform.
          weight: 1

  R2:
    title: Error handling
    items:
      - R2.1:
          text: If any extra operand is provided (beyond --help and --version), must print an error message to stderr and exit 1.
          weight: 1
      - R2.2:
          text: Must not accept any flags other than --help and --version. Unknown flags must produce an error message to stderr and exit 1.
          weight: 1

  R3:
    title: Differential testing
    items:
      - R3.1:
          text: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (ghostid) via pkg/testutils.
          weight: 1
      - R3.2:
          text: "Tests must cover: normal invocation (no arguments), extra operand error, and unknown flag error."
          weight: 1
      - R3.3:
          text: All differential tests must set LC_ALL=C in the environment.
          weight: 1

non_goals:
  - cmd/hostid does not set the host identifier.
  - cmd/hostid does not support any formatting options.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/hostid prints the host identifier in 8-digit hex, matching ghostid."
    traces:
      - R1.1
      - R1.2
  - id: AC2
    criterion: "go run ./cmd/hostid extraarg exits 1 with an error message to stderr, matching ghostid."
    traces:
      - R1.1
      - R2.1
      - R2.2
      - R3.1
      - R3.2
  - id: AC3
    criterion: "Differential test against ghostid passes for normal invocation and error cases."
    traces:
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
  - id: AC4
    criterion: "cmd/hostid compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
