id: prd068-csplit
title: "cmd/csplit: Split a File into Context-Determined Pieces"

problem: |
  Shell scripts and data pipelines use csplit to split files at context-determined boundaries
  defined by regular expressions or line numbers rather than fixed sizes. The macOS BSD csplit
  differs from GNU csplit in regex syntax, repeat counts, and suffix options. The Go
  implementation must match the Homebrew GNU reference binary (gcsplit, installed by
  coreutils) in output and exit codes for all supported pattern combinations, verified by
  differential testing via pkg/testutils.

goals:
  - G1: Split a file at lines matching regular expressions or at specified line numbers.
  - G2: Support repeat counts for patterns and elision of empty output files.
  - G3: Support configurable output prefix and suffix options.
  - G4: Verify functional parity against gcsplit via differential testing.

requirements:
  R1:
    title: Pattern-based splitting
    items:
      - R1.1:
          text: "Must accept one or more PATTERN arguments. Each pattern is applied in order to split the input at the matching boundary."
          weight: 1
      - R1.2:
          text: "/REGEXP/ must split at the next line matching REGEXP. The matching line becomes the first line of the next piece."
          weight: 1
      - R1.3:
          text: "%REGEXP% must skip to the next line matching REGEXP without creating an output file for the skipped content."
          weight: 1
      - R1.4:
          text: "INTEGER must split at the given line number. The specified line becomes the first line of the next piece."
          weight: 1

  R2:
    title: Repeat counts and offset
    items:
      - R2.1:
          text: "{N} appended to a pattern must repeat that pattern N additional times (total N+1 applications)."
          weight: 1
      - R2.2:
          text: "{*} appended to a pattern must repeat that pattern as many times as possible until end of input."
          weight: 1
      - R2.3:
          text: "/REGEXP/+N and /REGEXP/-N must split N lines after or before the matching line, respectively."
          weight: 1
      - R2.4:
          text: When a pattern does not match, must print an error to stderr. With --suppress-matched this is not an error if at least one split occurred.
          weight: 1

  R3:
    title: Output control and prefix options
    items:
      - R3.1:
          text: "Must write output files named xx00, xx01, xx02, etc. by default."
          weight: 1
      - R3.2:
          text: "-f PREFIX or --prefix=PREFIX must use PREFIX instead of 'xx' for output filenames."
          weight: 1
      - R3.3:
          text: "-n DIGITS or --digits=DIGITS must use DIGITS-wide numeric suffixes (default 2)."
          weight: 1
      - R3.4:
          text: "-z or --elide-empty-files must suppress creation of empty output files."
          weight: 1

  R4:
    title: Exit codes and differential testing
    items:
      - R4.1:
          text: Must exit 0 when the input is split successfully.
          weight: 1
      - R4.2:
          text: Must exit 1 when a pattern fails to match (unless suppressed) or an invalid option is given.
          weight: 1
      - R4.3:
          text: "Differential tests must compare output file contents and exit codes between the Go binary and the reference binary via pkg/testutils."
          weight: 1
      - R4.4:
          text: "Tests must cover: regex split, line number split, skip patterns (%), repeat counts ({N} and {*}), offset (+N/-N), -f custom prefix, -n digit width, -z elide empty, stdin input, and error cases (no match, invalid regex)."
          weight: 1

non_goals:
  - cmd/csplit does not implement --suppress-matched beyond the basic behavior.
  - cmd/csplit does not implement --keep-files on error (files are removed on error by default per GNU behavior).

acceptance_criteria:
  - id: AC1
    criterion: "printf 'a\\nb\\nc\\nd\\n' | go run ./cmd/csplit - /c/ produces xx00 (a,b) and xx01 (c,d), matching gcsplit."
    traces:
      - R1.1
      - R1.2
      - R3.1
  - id: AC2
    criterion: "seq 1 10 | go run ./cmd/csplit - 4 7 produces xx00 (1-3), xx01 (4-6), xx02 (7-10), matching gcsplit."
    traces:
      - R1.4
      - R4.1
  - id: AC3
    criterion: "go run ./cmd/csplit -f chunk -n 3 testfile '/pattern/' '{*}' produces chunk000, chunk001, etc., matching gcsplit."
    traces:
      - R2.2
      - R3.2
      - R3.3
  - id: AC4
    criterion: "go run ./cmd/csplit testfile '/nomatch/' exits 1 with error on stderr, matching gcsplit."
    traces:
      - R2.4
      - R4.2
  - id: AC5
    criterion: "Differential test against gcsplit passes for all pattern combinations listed in R4.4."
    traces:
      - R4.3
      - R4.4
  - id: AC6
    criterion: "cmd/csplit compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
      - R2.1
      - R2.2
      - R2.3
      - R2.4
      - R3.1
      - R3.2
      - R3.3
      - R3.4
      - R4.1
      - R4.2
      - R4.3
      - R4.4
