id: rel06.1-uc005-groups
title: "Print group memberships via groups"

summary: |
  The operator invokes the Go groups binary to print group memberships. With no
  arguments it prints the groups of the current user. With a username argument it
  prints the groups of the named user. The differential testing harness runs both
  the Go binary and the Homebrew reference binary (ggroups from coreutils) with the
  same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd043-groups.yaml) and invokes do-work to
  produce a passing differential test for cmd/groups.

flow:
  - id: F1
    step: |
      The operator exercises groups with no arguments (current user), single
      named user, multiple named users, and nonexistent user error. Named-user
      mode changes the output format to include a "user :" prefix on each line.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/groups
      and ggroups with the same arguments and environment. Requires F1 (binary
      must be built). The harness compares stdout byte-for-byte and exit codes.

touchpoints:
  - T1: "cmd/groups — current user groups, named user groups (srd043-groups R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for current-user groups, single named user,
      multiple named users, nonexistent user error, and mixed valid/invalid
      users, confirming full parity with ggroups.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Multiple username arguments on a single invocation are tested only if ggroups
    supports them.
  - >-
    The exact format of the "user : group1 group2" prefix varies across platforms;
    the test compares against ggroups output, not a hardcoded format.

test_suite: test-rel-06.1
