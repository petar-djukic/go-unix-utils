id: rel05.3-uc001-uniq
title: "Filter adjacent duplicate lines via uniq"

summary: |
  The operator runs the Go uniq binary on a file or stdin. The binary processes adjacent
  duplicate lines, printing each unique run once by default, or filtering by duplicate-
  only or unique-only modes. The differential testing harness then runs both the Go
  binary and the Homebrew reference binary (guniq from coreutils) with identical inputs
  and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd028-uniq.yaml) and invokes do-work to produce
  a passing differential test for cmd/uniq.

flow:
  - id: F1
    step: |
      The operator exercises uniq in default mode, with output filters (-d, -u, -c),
      and with comparison modifiers (-i, -f, -s, -w). -c changes the output format
      by prepending a count prefix; -f/-s change which portion of each line is compared.
  - id: F2
    step: |
      The operator tests adjacent duplicates, non-adjacent duplicates (which uniq does
      not merge), and case-insensitive comparison to verify run-detection boundaries.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/uniq and
      guniq with the same stdin, args, and environment. Requires F1 (binary must be
      built).

touchpoints:
  - T1: "cmd/uniq — run detection, output filtering, count prefix, field/char skip, case folding (srd028-uniq R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default deduplication, -c count prefix, -d
      duplicate-only, -u unique-only, -i case-insensitive, and -f/-s field/char skip,
      confirming full parity with guniq.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - uniq does not sort its input; tests use pre-sorted or deliberately ordered input.
  - The --group flag is not implemented.

test_suite: test-rel-05.3
