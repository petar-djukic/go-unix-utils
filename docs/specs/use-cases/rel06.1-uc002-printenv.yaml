id: rel06.1-uc002-printenv
title: "Print environment variables via printenv"

summary: |
  The operator invokes the Go printenv binary to display environment variables. With
  no arguments it prints all variables; with a named variable it prints only that
  value. A missing variable causes exit code 1. The -0 flag separates output with NUL
  bytes instead of newlines. The differential testing harness runs both the Go binary
  and the Homebrew reference binary (gprintenv from coreutils) with the same arguments
  and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd040-printenv.yaml) and invokes do-work to
  produce a passing differential test for cmd/printenv.

flow:
  - id: F1
    step: |
      The operator exercises printenv with no arguments (full dump), single and
      multiple named variables, missing variables (exit 1), and -0 NUL-delimited
      output. Named-variable mode prints only values (no NAME= prefix) and uses
      the exit code to signal whether all requested variables exist.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/printenv
      and gprintenv with the same arguments and environment. Requires F1 (binary
      must be built). The harness compares stdout byte-for-byte and exit codes.

touchpoints:
  - T1: "cmd/printenv — print all variables, print specific variable, NUL-delimited output (srd040-printenv R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for full environment dump, single named
      variable, multiple named variables, missing variable (exit 1), mixed
      existing and missing variables, and -0 NUL-delimited output, confirming
      full parity with gprintenv.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - NUL-delimited output (-0) is tested for byte correctness but not for consumption by
    downstream tools (xargs -0).
  - Multiple variable arguments on a single invocation are tested only if gprintenv supports them.

test_suite: test-rel-06.1
