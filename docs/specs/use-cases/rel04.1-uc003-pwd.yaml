id: rel04.1-uc003-pwd
title: "Print working directory via pwd"

summary: |
  The operator invokes the Go pwd binary to print the current working directory. pwd
  supports logical mode (-L, uses PWD environment variable) and physical mode (-P,
  resolves symlinks). The differential testing harness runs both the Go binary and the
  Homebrew reference binary (gpwd from coreutils) with the same arguments and compares
  stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd051-pwd.yaml) and invokes do-work to
  produce a passing differential test for cmd/pwd.

flow:
  - id: F1
    step: |
      Build cmd/pwd via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/pwd with each flag combination (default, -L, -P, -L -P precedence).
      Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/pwd and
      gpwd with identical arguments and environment, comparing stdout byte-for-byte
      and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/pwd — working directory output (srd051-pwd R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all modes (default, -L, -P, -L -P precedence,
      and error cases), confirming full parity with gpwd.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4

out_of_scope:
  - Changing the working directory is not supported and not tested.
  - Logical mode (-L) behavior depends on the PWD environment variable, which
    may vary between test environments.

test_suite: test-rel-04.1
