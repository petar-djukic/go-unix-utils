id: rel04.1-uc003-pwd
title: "Print working directory via pwd"

summary: |
  The operator invokes the Go pwd binary to print the current working directory. pwd
  supports logical mode (-L, uses PWD environment variable) and physical mode (-P,
  resolves symlinks). The differential testing harness runs both the Go binary and the
  Homebrew reference binary (gpwd from coreutils) with the same arguments and compares
  stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd051-pwd.yaml) and invokes do-work to
  produce a passing differential test for cmd/pwd.

flow:
  - id: F1
    step: |
      The operator runs "./bin/pwd" with no arguments. pwd prints the current
      working directory followed by a newline.
  - id: F2
    step: |
      The operator runs "./bin/pwd -P" to print the physical path with all
      symlinks resolved.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/pwd
      and gpwd with the same arguments and environment.
  - id: F4
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output.

touchpoints:
  - T1: "cmd/pwd — working directory output (prd051-pwd R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: cmd/pwd compiles and ./bin/pwd exists after mage build.
  - id: S2
    criterion: |
      "./bin/pwd" prints the current working directory, matching gpwd.
  - id: S3
    criterion: |
      "./bin/pwd -P" prints the physical path, matching gpwd -P.
  - id: S4
    criterion: |
      The differential test passes for logical, physical, and error cases.

out_of_scope:
  - Changing the working directory is not supported and not tested.
  - Logical mode (-L) behavior depends on the PWD environment variable, which
    may vary between test environments.

test_suite: test-rel04.1
