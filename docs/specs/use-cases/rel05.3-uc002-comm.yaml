id: rel05.3-uc002-comm
title: "Compare two sorted files line by line via comm"

summary: |
  The operator runs the Go comm binary on two pre-sorted files. The binary produces
  three-column output showing lines unique to each file and lines common to both. Column
  suppression flags allow the operator to extract set intersections and differences. The
  differential testing harness then runs both the Go binary and the Homebrew reference
  binary (gcomm from coreutils) with identical inputs and confirms that their outputs are
  identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd029-comm.yaml) and invokes do-work to produce
  a passing differential test for cmd/comm.

flow:
  - id: F1
    step: |
      The operator exercises comm in full three-column mode and with column suppression
      flags (-1, -2, -3). Column suppression changes the indentation of remaining columns,
      requiring correct tab adjustment.
  - id: F2
    step: |
      The operator tests --output-delimiter and file-exhaustion behavior (one file
      shorter than the other) to verify correct column assignment for remaining lines.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/comm and gcomm
      with the same file arguments and environment. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/comm — three-column comparison, column suppression, indentation, order checking (srd029-comm R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for full three-column output, -12 common-only,
      -3 unique-only, -1 suppress, --output-delimiter, and file-exhaustion cases,
      confirming full parity with gcomm.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - comm does not sort its inputs; tests use pre-sorted files.
  - Locale-aware collation is not tested; LC_ALL=C is used throughout.

test_suite: test-rel-05.3
