id: rel05.4-uc003-sha256sum
title: "Compute and verify SHA-256 digests via sha256sum"

summary: |
  The operator runs the Go sha256sum binary on one or more files or stdin. The binary
  computes SHA-256 digests and prints them in GNU format, or verifies a checksum file.
  The differential testing harness then runs both the Go binary and the Homebrew
  reference binary (gsha256sum from coreutils) with identical inputs and confirms that
  their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd032-sha256sum.yaml) and invokes do-work to
  produce a passing differential test for cmd/sha256sum.

flow:
  - id: F1
    step: |
      The operator exercises sha256sum in digest mode (file and stdin), check mode
      (--check), and tag mode (--tag). --check changes the processing model from digest
      computation to verification against stored hashes.
  - id: F2
    step: |
      The operator tests --check with both matching and mismatching digests to verify
      OK/FAILED output and correct exit codes.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/sha256sum and
      gsha256sum with the same inputs and compares stdout byte-for-byte. Requires F1
      (binary must be built).

touchpoints:
  - T1: "cmd/sha256sum — SHA-256 digest computation, GNU format output, check mode, binary/tag flags (srd032-sha256sum R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for file digest, stdin digest, --check valid,
      --check mismatch, and --tag BSD format, confirming full parity with gsha256sum.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5

out_of_scope:
  - SHA-224 and SHA-256/224 truncations are not implemented.

test_suite: test-rel-05.4
