id: rel07.0-uc001-sort
title: "Sort lines of text files via sort"

summary: |
  The operator invokes the Go sort binary to order lines from files or pipeline input.
  The differential testing harness runs both the Go binary and the Homebrew reference
  binary (gsort from coreutils) with the same arguments, stdin, and environment, then
  compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd053-sort.yaml) and invokes do-work to
  produce a passing differential test for cmd/sort.

flow:
  - id: F1
    step: |
      The operator exercises sort with default lexicographic ordering, -n numeric,
      -h human-numeric, -M month, -V version sort modes, -k key fields with -t
      delimiters, -r reverse, -u unique, -s stable, -c check mode, -o output
      file, -b ignore-leading-blanks, multi-file input, and stdin. Each sort mode
      (-n, -h, -M, -V) changes the comparison function applied to lines or key
      fields.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/sort
      and gsort with the same arguments, stdin, and environment. Requires F1
      (binary must be built). The harness compares stdout byte-for-byte and exit
      codes.

touchpoints:
  - T1: "cmd/sort — lexicographic, numeric, human-numeric, month, version sort, key fields, delimiters, reverse, unique, stable, check mode (srd053-sort R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default lexicographic sort, -n numeric,
      -h human-numeric, -M month, -V version sort, -k key fields with -t
      delimiters, -r reverse, -u unique, -s stable, -c check mode, -b
      ignore-leading-blanks, multi-file input, and stdin, confirming full parity
      with gsort.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Parallel sort (--parallel) is excluded per the PRD.
  - Random sort (-R) is excluded per the PRD.

test_suite: test-rel-07.0
