id: rel03.1-uc005-hostid
title: "Print numeric host identifier via hostid"

summary: |
  The operator invokes the Go hostid binary to print the 32-bit numeric host identifier
  as an 8-digit lowercase hexadecimal number. The differential testing harness runs both
  the Go binary and the Homebrew reference binary (ghostid from coreutils) with the same
  arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd048-hostid.yaml) and invokes do-work to
  produce a passing differential test for cmd/hostid.

flow:
  - id: F1
    step: |
      Build cmd/hostid via mage build. Requires no prior steps.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/hostid
      and ghostid with identical arguments and environment, comparing stdout
      byte-for-byte and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/hostid — host identifier output (srd048-hostid R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for normal invocation and error cases (extra
      operand, unknown flag), confirming full parity with ghostid.
    traces:
      - AC1
      - AC2
      - AC3

out_of_scope:
  - Setting the host identifier is not supported and not tested.
  - The meaning of the host identifier value is platform-dependent and not validated
    beyond matching the reference binary output.

test_suite: test-rel-03.1
