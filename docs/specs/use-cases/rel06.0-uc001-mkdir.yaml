id: rel06.0-uc001-mkdir
title: "Create directories via mkdir"

summary: |
  The operator invokes the Go mkdir binary to create one or more directories,
  optionally creating intermediate parent directories with -p or setting
  permissions with -m. The differential testing harness runs both the Go binary
  and the Homebrew reference binary (gmkdir from coreutils) with the same
  arguments and compares stdout, stderr, and exit codes.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd034-mkdir.yaml) and invokes do-work to
  produce a passing differential test for cmd/mkdir.

flow:
  - id: F1
    step: |
      The operator exercises mkdir with single directories, multiple directories,
      -p parent chains, -m permission modes, and -v verbose output. The -p flag
      changes the processing model from fail-on-existing to create-if-missing,
      which also affects how -m applies to intermediate vs final directories.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/mkdir
      and gmkdir with the same arguments and environment. Requires F1 (binary
      must be built). The harness compares stdout, stderr, exit codes, and
      resulting filesystem state including permission bits.

touchpoints:
  - T1: "cmd/mkdir — single directory creation, parent creation (-p), permission mode (-m) (srd034-mkdir R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single directory creation, multiple
      directories, -p parent chains, -m permission modes, -v verbose output,
      already-existing directory errors, and missing-parent errors, confirming
      full parity with gmkdir.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - SELinux or ACL-based permission handling beyond POSIX mode bits.
  - Behavior on filesystems that do not support standard POSIX permissions.

test_suite: test-rel-06.0
