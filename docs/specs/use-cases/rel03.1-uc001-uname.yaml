id: rel03.1-uc001-uname
title: "Print system information via uname"

summary: |
  The operator invokes the Go uname binary to print system information fields such as
  kernel name, hostname, kernel release, version, and machine architecture. Individual
  flags select specific fields; -a prints all fields in canonical order. The differential
  testing harness runs both the Go binary and the Homebrew reference binary (guname from
  coreutils) with the same flags and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd044-uname.yaml) and invokes do-work to
  produce a passing differential test for cmd/uname.

flow:
  - id: F1
    step: |
      The operator runs "./bin/uname" with no arguments. uname prints the kernel
      name followed by a newline.
  - id: F2
    step: |
      The operator runs "./bin/uname -a" to print all system information fields
      in canonical order, space-separated.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/uname
      and guname with the same flags and environment.
  - id: F4
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output for each flag combination.

touchpoints:
  - T1: "cmd/uname — system information output (prd044-uname R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: cmd/uname compiles and ./bin/uname exists after mage build.
  - id: S2
    criterion: |
      "./bin/uname" with no arguments prints the kernel name, matching guname.
  - id: S3
    criterion: |
      "./bin/uname -a" prints all fields in canonical order, matching guname -a.
  - id: S4
    criterion: |
      Each individual flag (-s, -n, -r, -v, -m, -p, -i, -o) produces output matching guname.
  - id: S5
    criterion: |
      The differential test passes for all flag combinations and error cases.

out_of_scope:
  - Setting system information is not supported and not tested.
  - Long-form flag names beyond --help and --version are not tested.

test_suite: test-rel03.1
