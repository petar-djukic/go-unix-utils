id: rel03.1-uc001-uname
title: "Print system information via uname"

summary: |
  The operator invokes the Go uname binary to print system information fields such as
  kernel name, hostname, kernel release, version, and machine architecture. Individual
  flags select specific fields; -a prints all fields in canonical order. The differential
  testing harness runs both the Go binary and the Homebrew reference binary (guname from
  coreutils) with the same flags and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd044-uname.yaml) and invokes do-work to
  produce a passing differential test for cmd/uname.

flow:
  - id: F1
    step: |
      Build cmd/uname via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/uname with each flag combination (default, -s, -n, -r, -v, -m, -p,
      -i, -o, -a). Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/uname and
      guname with identical flags and environment, comparing stdout byte-for-byte and
      exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/uname — system information output (srd044-uname R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations (default, -s, -n, -r,
      -v, -m, -p, -i, -o, -a, and error cases), confirming full parity with guname.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4

out_of_scope:
  - Setting system information is not supported and not tested.
  - Long-form flag names beyond --help and --version are not tested.

test_suite: test-rel-03.1
