id: rel00.0-uc003-sys
title: "Query terminal width, stat files, and handle signals via pkg/sys"

summary: |
  The operator verifies that pkg/sys provides correct terminal-width queries, extended
  file metadata, and signal handling on both Darwin and Linux. The test exercises each
  capability in isolation: TerminalWidth returns a positive column count on a TTY,
  IsTerminal distinguishes terminals from pipes, Stat and Lstat return correct extended
  metadata, InstallSIGPIPEHandler suppresses broken-pipe errors, and OnTerminalResize
  invokes callbacks on SIGWINCH.

actor: Human Operator

trigger: |
  The operator has completed the PRD revision (srd002-sys.yaml) and wants to verify that
  pkg/sys satisfies its requirements via unit tests.

flow:
  - id: F1
    step: |
      The operator runs go test ./pkg/sys/... which executes the unit tests for pkg/sys.
      No reference binary exists; all validation is via unit tests.
  - id: F2
    step: |
      The terminal tests verify TerminalWidth and IsTerminal against both TTY and pipe
      file descriptors. These are independent of file metadata tests.
  - id: F3
    step: |
      The file metadata tests verify Stat, Lstat, and fillFromStat. Lstat depends on a
      symlink fixture created by the test setup. fillFromStat validates the Darwin/Linux
      abstraction (st_mtimespec vs st_mtim) using the same fixture.
  - id: F4
    step: |
      The InstallSIGPIPEHandler test verifies broken-pipe suppression. Independent of
      F2-F3 (signal handling has no shared state with terminal or stat APIs).

touchpoints:
  - T1: "pkg/sys — TerminalWidth, IsTerminal, InstallSIGPIPEHandler (srd002-sys R1)"
  - T2: "pkg/sys — Stat, Lstat, FileInfo, fillFromStat (srd002-sys R2)"
  - T3: "pkg/sys — OnTerminalResize (srd002-sys R3)"

success_criteria:
  - id: S1
    criterion: |
      go test ./pkg/sys/... passes on darwin/arm64, validating all three API surfaces
      (terminal queries, file metadata, signal handling) in a single test run.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
  - id: S2
    criterion: |
      Lstat on a symlink returns symlink type bits (not the target's mode), and Stat on the
      same path returns the target's mode. This cross-function check validates that the
      Darwin/Linux abstraction layer preserves the Stat/Lstat distinction.
    traces:
      - AC2
      - AC3

out_of_scope:
  - SIGWINCH testing requires a real terminal resize event; it is tested manually, not in the harness.
  - Process-group management (setpgid, killpg) is deferred to the xargs PRD.
  - SIGUSR1/SIGUSR2 handling is deferred to the find PRD.

test_suite: test-rel-00.0
