id: rel00.0-uc003-sys
title: "Query terminal width, stat files, and handle signals via pkg/sys"

summary: |
  The operator verifies that pkg/sys provides correct terminal-width queries, extended
  file metadata, and signal handling on both Darwin and Linux. The test exercises each
  capability in isolation: TerminalWidth returns a positive column count on a TTY,
  IsTerminal distinguishes terminals from pipes, Stat and Lstat return correct extended
  metadata, InstallSIGPIPEHandler suppresses broken-pipe errors, and OnTerminalResize
  invokes callbacks on SIGWINCH.

actor: Human Operator

trigger: |
  The operator has completed the PRD revision (prd002-sys.yaml) and wants to verify that
  pkg/sys satisfies its requirements via unit tests.

flow:
  - id: F1
    step: |
      The operator runs go test ./pkg/sys/... which executes the unit tests for pkg/sys.
      Unlike cmd/ packages, pkg/sys does not use differential testing because there is no
      reference binary — it is a library.
  - id: F2
    step: |
      The TerminalWidth test calls TerminalWidth() and verifies it returns a positive
      integer when stdout is a terminal, or an error when stdout is a pipe.
  - id: F3
    step: |
      The IsTerminal test calls IsTerminal with a pipe fd and verifies it returns false.
      It calls IsTerminal with a TTY fd (if available in the test environment) and verifies
      it returns true.
  - id: F4
    step: |
      The Stat test calls Stat on a known file and verifies Nlink, Uid, Gid, Dev, Ino,
      and Blocks match the output of stat(1) on the same file.
  - id: F5
    step: |
      The Lstat test calls Lstat on a symbolic link and verifies that the returned FileInfo
      has type bits showing symlink, not the target's mode.
  - id: F6
    step: |
      The fillFromStat test verifies that the Darwin/Linux abstraction correctly populates
      FileInfo.ModTime from st_mtimespec (Darwin) or st_mtim (Linux).
  - id: F7
    step: |
      The InstallSIGPIPEHandler test verifies that writing to a broken pipe after installing
      the handler causes the process to exit 0 rather than printing a write error.

touchpoints:
  - T1: "pkg/sys — TerminalWidth, IsTerminal, InstallSIGPIPEHandler (prd002-sys R1)"
  - T2: "pkg/sys — Stat, Lstat, FileInfo, fillFromStat (prd002-sys R2)"
  - T3: "pkg/sys — OnTerminalResize (prd002-sys R3)"

success_criteria:
  - id: S1
    criterion: TerminalWidth returns a positive integer on a TTY or an error on a pipe.
  - id: S2
    criterion: IsTerminal(pipeFd) returns false.
  - id: S3
    criterion: Stat on a known file returns correct Nlink, Uid, Gid, Dev, Ino, Blocks.
  - id: S4
    criterion: Lstat on a symlink returns type bits showing symlink.
  - id: S5
    criterion: FileInfo.ModTime is populated from the platform-correct field.
  - id: S6
    criterion: InstallSIGPIPEHandler causes exit 0 on broken pipe.
  - id: S7
    criterion: go test ./pkg/sys/... passes on darwin/arm64 with no failures.

out_of_scope:
  - SIGWINCH testing requires a real terminal resize event; it is tested manually, not in the harness.
  - Process-group management (setpgid, killpg) is deferred to the xargs PRD.
  - SIGUSR1/SIGUSR2 handling is deferred to the find PRD.

test_suite: test-rel00.0
