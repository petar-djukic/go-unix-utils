id: rel07.0-uc003-tail
title: "Print the last lines or bytes of files via tail"

summary: |
  The operator invokes the Go tail binary to extract the end of files or pipeline
  output. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gtail from coreutils) with the same arguments, stdin, and
  environment, then compares stdout byte-for-byte. Follow mode (-f) is excluded
  from testing because its output is non-deterministic.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd055-tail.yaml) and invokes do-work to
  produce a passing differential test for cmd/tail.

flow:
  - id: F1
    step: |
      The operator exercises tail with default 10-line output, explicit -n line
      count, -n +N plus-offset (start from line N), -c byte count, -c +N byte
      offset, multi-file headers, -q header suppression, -v forced headers,
      stdin input, and error on non-existent file. The -c flag changes the
      counting unit from lines to bytes, and the + prefix reverses the selection
      direction from end-of-file to start-from-offset.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/tail
      and gtail with the same arguments, stdin, and environment. Requires F1
      (binary must be built). The harness compares stdout byte-for-byte and exit
      codes.

touchpoints:
  - T1: "cmd/tail — line-count, byte-count, plus-offset, multi-file headers, quiet/verbose (srd055-tail R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default 10-line output, explicit -n count,
      -n +N plus-offset, -c byte count, -c +N byte offset, multi-file headers,
      -q suppression, -v forced headers, stdin input, and error on non-existent
      file, confirming full parity with gtail.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Follow mode (-f) is excluded per the PRD.

test_suite: test-rel-07.0
