id: rel03.0-uc001-wc
title: "Count lines, words, and bytes via wc"

summary: |
  The operator runs the Go wc binary on one or more files or stdin. The binary counts
  lines, words, and bytes (or characters, or max line length) and writes formatted results
  to stdout. The differential testing harness then runs both the Go binary and the Homebrew
  reference binary (gwc from coreutils) with the same stdin, args, and environment and
  confirms that their outputs are identical byte-for-byte. No output normalization is
  needed because wc output consists of deterministic integer counts.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd005-wc.yaml) and invokes do-work to produce
  a passing differential test for cmd/wc.

flow:
  - id: F1
    step: |
      Build cmd/wc via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/wc with stdin or file arguments using each flag combination (default,
      -l, -w, -c, -m, -L, multi-file). Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/wc and gwc
      with identical stdin, args, and environment and compares stdout byte-for-byte.
      Requires F1 (binary must be built).
  - id: F4
    step: |
      Verify error handling: a non-existent file produces stderr output, exits 1, and
      remaining files are still processed. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/wc — line, word, byte, char, max-line-length counting, multi-file totals (srd005-wc R1, R2, R3, R4, R5, R6)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations (default, -l, -w, -c,
      -m with LC_ALL=C, -L, multi-file with totals, stdin), confirming full parity
      with gwc.
    traces:
      - AC1
      - AC2
      - AC3
      - AC6
  - id: S2
    criterion: |
      Error recovery across multiple file operands works correctly: a non-existent file
      produces stderr output and exit 1 while remaining files are still counted, matching
      gwc behavior.
    traces:
      - AC4

out_of_scope:
  - --files0-from is covered in the test suite but is not the primary flow of this use case.
  - --total=always and --total=only are covered in the test suite but are not part of the primary flow.
  - Binary input edge cases are covered in the test suite but are not the primary flow.

test_suite: test-rel-03.0
