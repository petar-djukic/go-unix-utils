id: rel07.0-uc002-tr
title: "Translate or delete characters via tr"

summary: |
  The operator invokes the Go tr binary to translate, delete, or squeeze characters
  from stdin. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gtr from coreutils) with the same arguments, stdin, and environment,
  then compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd054-tr.yaml) and invokes do-work to
  produce a passing differential test for cmd/tr.

flow:
  - id: F1
    step: |
      The operator exercises tr with basic character translation (SET1 to SET2),
      -d delete mode, -s squeeze mode, -c complement mode, -ds combined
      delete-and-squeeze, character ranges, POSIX character classes, case
      conversion ([:lower:] to [:upper:]), octal escapes, and error cases. The
      -d flag changes the processing model from translate to delete, removing
      characters in SET1 rather than mapping them.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/tr
      and gtr with the same arguments, stdin, and environment. Requires F1
      (binary must be built). The harness compares stdout byte-for-byte and exit
      codes.

touchpoints:
  - T1: "cmd/tr — character translation, deletion, squeezing, complement, character classes, ranges, escapes (srd054-tr R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for basic translation, -d delete, -s squeeze,
      -c complement, -ds combined, character ranges, POSIX character classes,
      case conversion, octal escapes, and error cases, confirming full parity
      with gtr.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Multibyte character support is excluded per the PRD.

test_suite: test-rel-07.0
