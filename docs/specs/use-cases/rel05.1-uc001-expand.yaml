id: rel05.1-uc001-expand
title: "Convert tabs to spaces via expand"

summary: |
  The operator runs the Go expand binary on one or more files or stdin. The binary
  replaces tab characters with the appropriate number of spaces to reach the next tab
  stop, using a configurable tab stop interval or position list. The differential testing
  harness then runs both the Go binary and the Homebrew reference binary (gexpand from
  coreutils) with identical inputs and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd024-expand.yaml) and invokes do-work to produce
  a passing differential test for cmd/expand.

flow:
  - id: F1
    step: |
      The operator runs the Go expand binary on a file or stdin.
      Example: printf 'col1\tcol2\tcol3\n' | ./bin/expand
  - id: F2
    step: |
      cmd/expand reads each input character in sequence, tracking the current column
      position. When it encounters a tab, it writes enough spaces to advance to the
      next configured tab stop.
  - id: F3
    step: |
      Non-tab characters pass through unchanged. Newlines reset the column counter to 1.
  - id: F4
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/expand and
      gexpand with the same stdin, args, and environment.
  - id: F5
    step: |
      The harness compares stdout byte-for-byte with no normalization. Both binaries must
      produce identical output bytes and exit codes.
  - id: F6
    step: |
      If the outputs match, the test passes. If they diverge, the harness reports the
      triggering args, both outputs, and both exit codes.

touchpoints:
  - T1: "cmd/expand — tab-to-space conversion, tab stop tracking, custom tab stop list (prd024-expand R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: cmd/expand compiles and ./bin/expand exists after mage build.
  - id: S2
    criterion: The differential test for default mode passes; tabs expand to the next multiple-of-8 column, matching gexpand.
  - id: S3
    criterion: The differential test for -t N (single interval) passes; tabs expand to multiples of N.
  - id: S4
    criterion: The differential test for -t LIST (multiple stops) passes; each tab reaches the next absolute stop.
  - id: S5
    criterion: The differential test for input with no tabs passes; output is identical to input.
  - id: S6
    criterion: The differential test for multiple consecutive tabs passes; each tab advances independently to its stop.

out_of_scope:
  - Unicode multi-column character width is not tested; LC_ALL=C single-byte behavior is the requirement.
  - Backspace column adjustment is not implemented.

test_suite: test-rel05.1
