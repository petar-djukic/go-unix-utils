id: rel05.1-uc001-expand
title: "Convert tabs to spaces via expand"

summary: |
  The operator runs the Go expand binary on one or more files or stdin. The binary
  replaces tab characters with the appropriate number of spaces to reach the next tab
  stop, using a configurable tab stop interval or position list. The differential testing
  harness then runs both the Go binary and the Homebrew reference binary (gexpand from
  coreutils) with identical inputs and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd024-expand.yaml) and invokes do-work to produce
  a passing differential test for cmd/expand.

flow:
  - id: F1
    step: |
      The operator exercises expand in default mode (tab stop every 8), with a single
      interval (-t N), and with a tab stop list (-t LIST). The list mode changes tab
      expansion from uniform intervals to absolute column positions.
  - id: F2
    step: |
      The operator tests input with no tabs (passthrough) and multiple consecutive tabs
      to verify each tab advances independently to its stop.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/expand and
      gexpand with the same stdin, args, and environment. Requires F1 (binary must be
      built).

touchpoints:
  - T1: "cmd/expand — tab-to-space conversion, tab stop tracking, custom tab stop list (srd024-expand R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default tab expansion, -t N single interval,
      -t LIST absolute positions, no-tab passthrough, and multiple consecutive tabs,
      confirming full parity with gexpand.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Unicode multi-column character width is not tested; LC_ALL=C single-byte behavior is the requirement.
  - Backspace column adjustment is not implemented.

test_suite: test-rel-05.1
