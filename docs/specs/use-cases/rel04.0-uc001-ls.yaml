id: rel04.0-uc001-ls
title: "List directory contents via ls (core flags)"

summary: |
  The operator runs the Go ls binary on a known fixture directory with core flags (default,
  -1, -l, -a, -A, -d, --color, -h). The differential testing harness runs both the Go binary
  and the Homebrew reference binary (gls from coreutils) with the same arguments and
  environment, applies an LsNormalizer to both outputs (replacing mtime columns with a fixed
  placeholder), and confirms that the normalized outputs are identical. All tests run with
  --color=never and LC_ALL=C to eliminate ANSI and locale variance.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd008-ls.yaml) and shared component PRDs
  (pkg/sys, pkg/format from rel00.0) and invokes do-work to produce a passing differential
  test for cmd/ls core flags.

flow:
  - id: F1
    step: |
      Build cmd/ls via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/ls with core flags (default, -1, -l, -lh, -a, -A, -d, --color=never)
      on a fixture directory with known file types, sizes, and permissions. Requires F1
      (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/ls and gls
      with identical arguments and environment (LC_ALL=C, --color=never), applies the
      LsNormalizer to replace mtime columns, and compares normalized outputs byte-for-byte.
      Requires F1 (binary must be built).
  - id: F4
    step: |
      Verify error handling: a non-existent path exits 1, an invalid option exits 2,
      matching gls behavior. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/ls — directory listing, format modes, filter flags, color, human sizes (srd008-ls R1, R2, R3, R4)"
  - T2: "pkg/sys — TerminalWidth, Stat/Lstat, IsTerminal, InstallSIGPIPEHandler, OnTerminalResize (rel00.0 infrastructure)"
  - T3: "pkg/format — Columns, FileTypeColor, HumanSize (rel00.0 infrastructure)"
  - T4: "pkg/testutils — RunDiffTests, LsNormalizer, binary execution and comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all core flag combinations (default, -1, -l,
      -lh, -a, -A, -d, --color=never), confirming full parity with gls.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7
  - id: S2
    criterion: |
      Cross-component integration with pkg/sys (TerminalWidth, Stat, IsTerminal) and
      pkg/format (Columns, HumanSize, FileTypeColor) produces correct output across
      format modes, validated by the LsNormalizer in the differential harness.
    traces:
      - AC3
      - AC5

out_of_scope:
  - Default multi-column mode on a real TTY is difficult to test deterministically in the
    harness; we test -C explicitly in the ls extended use case (rel04.1).
  - Owner/group name normalization is not applied; tests use a fixture where files are owned
    by the test runner's UID/GID, ensuring consistency.
  - SIGWINCH behavior is specified in srd008-ls R4.5 but is not directly testable in the
    differential harness.

test_suite: test-rel-04.0
