id: rel05.0-uc003-nl
title: "Number lines of files via nl"

summary: |
  The operator runs the Go nl binary on one or more files or stdin. The binary numbers
  lines according to the active numbering style (body only by default), applying
  configurable format, width, separator, and start/increment values. The differential
  testing harness then runs both the Go binary and the Homebrew reference binary (gnl
  from coreutils) with identical inputs and confirms that their outputs are identical
  byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd022-nl.yaml) and invokes do-work to produce
  a passing differential test for cmd/nl.

flow:
  - id: F1
    step: |
      The operator exercises nl in default mode, with style flags (-b a, -b t, -h a),
      and with format/width/separator/start/increment options (-n, -w, -s, -v, -i).
      Section delimiters change the active numbering style mid-stream.
  - id: F2
    step: |
      The operator tests section delimiter handling (\\:\\:\\:, \\:\\:, \\:) to verify
      that delimiter lines are consumed and section-specific styles are applied.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/nl and gnl
      with the same stdin, args, and environment. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/nl — section parsing, line numbering, format/width/separator options (srd022-nl R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default mode, -b a, -n ln/rn/rz, -w, -s,
      -v, -i, section delimiters with -h a, and multi-file input, confirming full
      parity with gnl.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Regex numbering style (-b p RE) beyond basic pattern matching is not the primary test focus.
  - Locale-aware regex collation is not tested; LC_ALL=C is used throughout.

test_suite: test-rel-05.0
