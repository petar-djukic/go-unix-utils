id: rel01.1-uc001-cat
title: "Concatenate and display files via cat"

summary: |
  The operator runs the Go cat binary on one or more files or stdin. The binary concatenates
  input to stdout, optionally applying line numbering, blank-line squeezing, or non-printing
  character display. The differential testing harness then runs both the Go binary and the
  Homebrew reference binary (gcat from coreutils) with the same stdin, args, and environment
  and confirms that their outputs are identical byte-for-byte. No output normalization is
  needed because cat output is deterministic.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd006-cat.yaml) and invokes do-work to produce
  a passing differential test for cmd/cat.

flow:
  - id: F1
    step: |
      The operator runs the Go cat binary with file arguments or stdin.
      Example: printf 'hello\nworld\n' | ./bin/cat -n
  - id: F2
    step: |
      cmd/cat reads from each named file in order (or stdin when no files are given or
      when "-" is given). It applies transformations in order: squeeze blanks (-s),
      non-printing display (-v/-T), end-of-line marker (-E), line number prefix (-n/-b).
      Transformation ordering matters: -s reduces blank runs before -n assigns line numbers.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/cat and gcat
      with the same stdin, args, and environment. Requires F1 (binary must be built).
  - id: F4
    step: |
      The harness compares stdout byte-for-byte with no normalization (cat output is
      deterministic). Divergence triggers failure reporting per pkg/testutils contract.

touchpoints:
  - T1: "cmd/cat — concatenation, line numbering, blank squeezing, non-printing display (srd006-cat R1, R2, R3, R4, R5)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations: default, -n, -b, -s, -v,
      -A (-vET combined), multi-file concatenation, and stdin. This validates the full
      cmd/cat implementation against gcat in a single test run.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC7
  - id: S2
    criterion: |
      -A mode (combined -vET) produces output matching gcat -A byte-for-byte on binary
      input, confirming that the three transformations compose correctly.
    traces:
      - AC4
  - id: S3
    criterion: |
      A non-existent file argument produces an error to stderr, exits 1, and still
      processes remaining files, matching gcat behavior. This validates error-recovery
      across multiple inputs.
    traces:
      - AC6

out_of_scope:
  - FIONREAD ioctl optimization is not tested; correctness is the only requirement.
  - Same-file detection warning (cat reading from its own output) is not tested.
  - -u flag is accepted but has no observable effect; a test verifies acceptance only.

test_suite: test-rel-01.1
