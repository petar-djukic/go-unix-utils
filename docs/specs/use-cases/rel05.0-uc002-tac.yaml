id: rel05.0-uc002-tac
title: "Reverse lines of files via tac"

summary: |
  The operator runs the Go tac binary on one or more files or stdin. The binary buffers
  all input, splits it into records on the separator, and writes the records in reverse
  order to stdout. The differential testing harness then runs both the Go binary and the
  Homebrew reference binary (gtac from coreutils) with identical inputs and confirms that
  their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd021-tac.yaml) and invokes do-work to produce
  a passing differential test for cmd/tac.

flow:
  - id: F1
    step: |
      The operator exercises tac in default mode, with custom separators (-s), and with
      before-separator mode (-b). tac buffers the entire input before producing output,
      so all modes require full-input reads.
  - id: F2
    step: |
      The operator tests multi-file input and input without a trailing newline to verify
      per-file independent reversal and trailing-separator handling.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/tac and gtac
      with the same stdin, args, and environment. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/tac — full-input buffering, record reversal, separator handling (srd021-tac R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default reversal, missing trailing newline,
      -s with custom separator, -b before-separator mode, and multi-file input,
      confirming full parity with gtac.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Files larger than available memory are not supported; tac buffers the full input.
  - Regex separator testing (-r) is covered but not the primary use case.

test_suite: test-rel-05.0
