id: rel06.1-uc001-env
title: "Run a command in a modified environment via env"

summary: |
  The operator invokes the Go env binary to print the current environment, run a
  command with additional or modified variables, clear the environment with -i, or
  unset specific variables with -u. The differential testing harness runs both the
  Go binary and the Homebrew reference binary (genv from coreutils) with the same
  arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd039-env.yaml) and invokes do-work to
  produce a passing differential test for cmd/env.

flow:
  - id: F1
    step: |
      The operator exercises env with no arguments (environment dump), NAME=VALUE
      pairs, -i clean environment, -u variable unsetting, -0 NUL-delimited
      output, and command execution with exit code passthrough. The -i flag
      changes the processing model from inherit-and-modify to start-from-empty,
      giving full control over what the child process sees.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/env
      and genv with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares stdout byte-for-byte and exit codes.

touchpoints:
  - T1: "cmd/env — print environment, set variables, clean environment, unset variables (srd039-env R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for bare environment dump, NAME=VALUE pairs,
      -i clean environment, -u variable unsetting, -0 NUL-delimited output,
      command execution, and exit code passthrough, confirming full parity with
      genv.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Signal handling and the -S (split string) option are not tested.
  - Interaction with login shells or shell-specific environment inheritance is not tested.

test_suite: test-rel-06.1
