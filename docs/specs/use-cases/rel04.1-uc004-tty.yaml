id: rel04.1-uc004-tty
title: "Print terminal device name via tty"

summary: |
  The operator invokes the Go tty binary to print the file name of the terminal
  connected to stdin, or to check terminal status silently via -s. When stdin is not
  a terminal, tty prints "not a tty" and exits 1. The differential testing harness
  runs both the Go binary and the Homebrew reference binary (gtty from coreutils)
  with the same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd052-tty.yaml) and invokes do-work to
  produce a passing differential test for cmd/tty.

flow:
  - id: F1
    step: |
      Build cmd/tty via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/tty with each flag combination (default, -s) under both piped stdin
      and terminal stdin (when available). Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/tty and
      gtty with identical arguments and environment, comparing stdout byte-for-byte
      and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/tty — terminal device name output (srd052-tty R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations (default, -s) under
      piped and terminal stdin, confirming full parity with gtty.
    traces:
      - AC1
      - AC2
      - AC3

out_of_scope:
  - Terminal configuration is not supported; use stty for that.
  - Testing with an actual terminal device depends on the test environment and
    may be skipped in CI.

test_suite: test-rel-04.1
