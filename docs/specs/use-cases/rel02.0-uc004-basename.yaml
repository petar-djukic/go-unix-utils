id: rel02.0-uc004-basename
title: "Strip directory and suffix from filenames via basename"

summary: |
  The operator invokes the Go basename binary with file paths to extract the filename
  component, optionally removing a suffix. The differential testing harness runs both
  the Go binary and the Homebrew reference binary (gbasename from coreutils) with the
  same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd015-basename.yaml) and invokes do-work to
  produce a passing differential test for cmd/basename.

flow:
  - id: F1
    step: |
      The operator exercises basename in single-path mode with optional suffix removal,
      and in multi-path mode (-a, -s). All modes are pure string operations on path
      components; no filesystem access occurs.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/basename and
      gbasename with the same arguments. Requires F1 (binary must be built). Edge cases
      (root, trailing slashes, empty string) are included to catch boundary behavior.

touchpoints:
  - T1: "cmd/basename — path stripping, suffix removal, multi-argument mode, NUL output (srd015-basename R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for simple paths, suffix removal, -a, -s, -z,
      root, trailing slashes, and empty string, confirming full parity with gbasename.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Encoding-specific path handling is not tested; paths are byte sequences with "/" as separator.
  - NUL-delimited output (-z) is tested for byte correctness but not for consumption by
    downstream tools (xargs -0).

test_suite: test-rel-02.0
