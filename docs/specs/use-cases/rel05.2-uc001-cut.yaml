id: rel05.2-uc001-cut
title: "Extract fields and byte ranges from lines via cut"

summary: |
  The operator runs the Go cut binary on one or more files or stdin. The binary extracts
  the selected bytes, characters, or delimited fields from each line and writes them to
  stdout. The differential testing harness then runs both the Go binary and the Homebrew
  reference binary (gcut from coreutils) with identical inputs and confirms that their
  outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd026-cut.yaml) and invokes do-work to produce
  a passing differential test for cmd/cut.

flow:
  - id: F1
    step: |
      The operator exercises cut in byte mode (-b), character mode (-c), and field mode
      (-f) with delimiter (-d), suppress (-s), complement (--complement), and output
      delimiter (--output-delimiter). Field mode changes the extraction model from
      positional bytes to delimiter-split fields.
  - id: F2
    step: |
      The operator tests range list syntax (N, N-M, N-, -M) and --complement to verify
      selection inversion across all modes.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/cut and gcut
      with the same stdin, args, and environment. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/cut — byte/char/field extraction, range list parsing, delimiter handling, complement mode (srd026-cut R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for -b byte ranges, -f field selection with -d,
      -f with -s, --complement, --output-delimiter, and range list syntax,
      confirming full parity with gcut.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Multi-byte delimiter support is not tested; -d accepts one byte.
  - Locale-aware character cutting for -c is not tested beyond LC_ALL=C behavior.

test_suite: test-rel-05.2
