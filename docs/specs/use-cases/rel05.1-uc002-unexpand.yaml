id: rel05.1-uc002-unexpand
title: "Convert spaces to tabs via unexpand"

summary: |
  The operator runs the Go unexpand binary on one or more files or stdin. By default the
  binary converts only leading whitespace runs to tabs where alignment permits; with -a it
  converts all whitespace runs in the line. The differential testing harness then runs
  both the Go binary and the Homebrew reference binary (gunexpand from coreutils) with
  identical inputs and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd025-unexpand.yaml) and invokes do-work to produce
  a passing differential test for cmd/unexpand.

flow:
  - id: F1
    step: |
      The operator exercises unexpand in default mode (leading whitespace only) and
      all-whitespace mode (-a). -a changes the processing scope from leading-only to
      full-line whitespace conversion.
  - id: F2
    step: |
      The operator tests partial space runs (not reaching a tab stop) and custom tab
      stops (-t N) to verify alignment-aware conversion. -t implies -a, changing the
      default scope.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/unexpand and
      gunexpand with the same stdin, args, and environment. Requires F1 (binary must be
      built).

touchpoints:
  - T1: "cmd/unexpand — space-to-tab conversion, leading vs. all-whitespace mode, custom tab stops (srd025-unexpand R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default leading-only mode, -a all-whitespace mode,
      partial space runs, -t N custom tab stops, and non-leading space preservation,
      confirming full parity with gunexpand.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - unexpand is not a lossless inverse of expand for all inputs; the asymmetry is intentional.
  - Unicode multi-column character width is not tested; LC_ALL=C is used.

test_suite: test-rel-05.1
