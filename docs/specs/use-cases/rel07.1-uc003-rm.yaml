id: rel07.1-uc003-rm
title: "Remove files or directories via rm"

summary: |
  The operator invokes the Go rm binary to delete files and directory trees. The
  differential testing harness runs both the Go binary and the Homebrew reference
  binary (grm from coreutils) with the same arguments and environment, then compares
  exit codes and the resulting file system state.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd058-rm.yaml) and invokes do-work to
  produce a passing differential test for cmd/rm.

flow:
  - id: F1
    step: |
      The operator exercises rm with single file removal, multi-file removal, -r
      recursive directory removal, -f force (suppress errors on non-existent), -d
      empty directory removal, -v verbose, and error cases (directory without -r,
      refusing '.' and '..'). The -r flag changes the processing model from
      single-entry unlink to recursive tree traversal, and -f suppresses the
      non-existent error that would normally cause a non-zero exit.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/rm
      and grm with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares exit codes and resulting file system state
      (file existence).

touchpoints:
  - T1: "cmd/rm — single removal, multi-file, recursive, force, interactive, verbose, empty directory (srd058-rm R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, exit code and file system comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single file removal, multi-file removal,
      -r recursive, -f force on non-existent, -d empty directory, -v verbose,
      error on directory without -r, and refusing '.' or '..', confirming full
      parity with grm.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - One-file-system mode is excluded per the PRD.

test_suite: test-rel-07.1
