id: rel06.1-uc003-id
title: "Print user and group information via id"

summary: |
  The operator invokes the Go id binary to display user and group identity. The
  default output shows uid, gid, and supplementary groups in the standard format.
  Flags select individual fields: -u for uid, -g for gid, -G for all group IDs, and
  -n to print names instead of numbers. An optional username argument queries a named
  user. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gid from coreutils) with the same arguments and compares stdout
  byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd041-id.yaml) and invokes do-work to
  produce a passing differential test for cmd/id.

flow:
  - id: F1
    step: |
      The operator exercises id with no arguments (default uid/gid/groups line),
      -u, -g, -G selection flags, -n name modifier, -r real-ID modifier, named
      user lookup, and error cases (invalid user, conflicting flags). The
      selection flags (-u, -g, -G) change the output from the full identity line
      to a single field, and -n further modifies that field from numeric to name.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/id
      and gid with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares stdout byte-for-byte and exit codes.

touchpoints:
  - T1: "cmd/id — default output, -u, -g, -G, -n, named user lookup (srd041-id R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default output (uid/gid/groups), -u, -g,
      -G, -un, -gn, -Gn, -r real-ID modifier, named user lookup, and invalid
      user error, confirming full parity with gid.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - SELinux context output (--context / -Z) is not tested.
  - Real vs effective ID distinction (-r flag) is tested only if the test environment
    supports setuid scenarios.

test_suite: test-rel-06.1
