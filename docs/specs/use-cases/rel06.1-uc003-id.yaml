id: rel06.1-uc003-id
title: "Print user and group information via id"

summary: |
  The operator invokes the Go id binary to display user and group identity. The
  default output shows uid, gid, and supplementary groups in the standard format.
  Flags select individual fields: -u for uid, -g for gid, -G for all group IDs, and
  -n to print names instead of numbers. An optional username argument queries a named
  user. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gid from coreutils) with the same arguments and compares stdout
  byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd041-id.yaml) and invokes do-work to
  produce a passing differential test for cmd/id.

flow:
  - id: F1
    step: |
      The operator runs "./bin/id" with no arguments. id prints the current user's
      uid, gid, and supplementary groups in the standard format
      "uid=N(name) gid=N(name) groups=N(name),..." followed by a newline.
  - id: F2
    step: |
      The operator runs "./bin/id -u" to print only the effective numeric user ID.
  - id: F3
    step: |
      The operator runs "./bin/id -g" to print only the effective numeric group ID.
  - id: F4
    step: |
      The operator runs "./bin/id -G" to print all supplementary group IDs,
      space-separated.
  - id: F5
    step: |
      The operator runs "./bin/id -un" to print the effective username instead of
      the numeric uid. The -n flag modifies -u, -g, or -G to produce names.
  - id: F6
    step: |
      The operator runs "./bin/id root" to print identity information for a named
      user rather than the current user.
  - id: F7
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/id
      and gid with the same arguments and environment.
  - id: F8
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output.

touchpoints:
  - T1: "cmd/id — default output, -u, -g, -G, -n, named user lookup (prd041-id R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: cmd/id compiles and ./bin/id exists after mage build.
  - id: S2
    criterion: |
      "./bin/id" with no arguments produces the standard uid/gid/groups line,
      matching gid.
  - id: S3
    criterion: |
      The -u flag prints only the numeric uid, matching gid -u.
  - id: S4
    criterion: |
      The -g flag prints only the numeric gid, matching gid -g.
  - id: S5
    criterion: |
      The -G flag prints all supplementary group IDs, matching gid -G.
  - id: S6
    criterion: |
      The -n flag combined with -u, -g, or -G prints names instead of numbers.
  - id: S7
    criterion: |
      A named user argument produces identity information for that user, matching gid.
  - id: S8
    criterion: |
      The differential test passes for default output, -u, -g, -G, -un, -gn, -Gn,
      named user, and invalid user (error and exit code).

out_of_scope:
  - SELinux context output (--context / -Z) is not tested.
  - Real vs effective ID distinction (-r flag) is tested only if the test environment
    supports setuid scenarios.

test_suite: test-rel06.1
