id: rel04.1-uc005-logname
title: "Print login name via logname"

summary: |
  The operator invokes the Go logname binary to print the login name of the current
  user as recorded by the system login process. Unlike whoami, logname reports the
  original login identity rather than the effective username. The differential testing
  harness runs both the Go binary and the Homebrew reference binary (glogname from
  coreutils) with the same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd053-logname.yaml) and invokes do-work to
  produce a passing differential test for cmd/logname.

flow:
  - id: F1
    step: |
      Build cmd/logname via mage build. Requires no prior steps.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/logname
      and glogname with identical arguments and environment, comparing stdout
      byte-for-byte and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/logname — login name output (srd053-logname R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for normal invocation and error cases (extra
      operand, unknown flag), confirming full parity with glogname.
    traces:
      - AC1
      - AC2
      - AC3

out_of_scope:
  - Behavior after su or sudo is not tested beyond what the test environment
    naturally provides.
  - The distinction between logname and whoami output depends on the login
    session and is not artificially tested.

test_suite: test-rel-04.1
