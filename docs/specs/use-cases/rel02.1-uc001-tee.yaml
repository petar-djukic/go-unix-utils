id: rel02.1-uc001-tee
title: "Copy stdin to stdout and files via tee"

summary: |
  The operator pipes data through the Go tee binary to capture a copy in one or more
  files while passing the stream through to stdout. The differential testing harness
  runs both the Go binary and the Homebrew reference binary (gtee from coreutils) with
  the same arguments, stdin, and environment, then compares stdout and output file
  contents byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd017-tee.yaml) and invokes do-work to
  produce a passing differential test for cmd/tee.

flow:
  - id: F1
    step: |
      The operator pipes data through tee to one or more output files. tee writes to
      stdout and all file arguments simultaneously (fan-out pattern).
  - id: F2
    step: |
      The operator tests append mode (-a) and passthrough (no file arguments). Append
      mode must not truncate existing file content before writing.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/tee and gtee
      with the same stdin and arguments. Requires F1 (binary must be built). Compares
      both stdout and output file contents byte-for-byte via file-state comparison.

touchpoints:
  - T1: "cmd/tee — stdin copy, file output, append mode, SIGINT suppression (srd017-tee R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout and file comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single file, multiple files, append mode,
      passthrough, and write-error cases, confirming full parity with gtee.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
  - id: S2
    criterion: |
      Write-error handling: tee exits 1 when an output file cannot be opened, prints
      a diagnostic to stderr, and continues writing to remaining destinations. This
      validates error-recovery across multiple output streams.
    traces:
      - AC4

out_of_scope:
  - SIGINT suppression (-i) is tested for compilation but interactive signal delivery
    is not automated in the differential harness.
  - Output-error modes (--output-error) and -p flag are excluded per the PRD.

test_suite: test-rel-02.1
