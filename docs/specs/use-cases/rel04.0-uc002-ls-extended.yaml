id: rel04.0-uc002-ls-extended
title: "List directory contents via ls (extended flags)"

summary: |
  The operator runs the Go ls binary with extended flags (-C, -x, -t, -S, -r, -U, -v, -i,
  -s, -n, -F, -R) on a fixture directory. The differential testing harness runs both the Go
  binary and the Homebrew reference binary (gls from coreutils) with the same arguments and
  environment, applies an LsExtendedNormalizer (which extends the core LsNormalizer with
  mtime replacement across recursive subdirectory listings), and confirms that the normalized
  outputs are identical. All tests use LC_ALL=C and --color=never. Fixture files have
  controlled sizes, mtimes, and permissions to ensure deterministic sort order.

actor: Human Operator

trigger: |
  The operator has completed srd008-ls.yaml (the combined ls PRD covering both core and
  extended flags) and invokes do-work to produce a passing differential test for cmd/ls
  extended flags.

flow:
  - id: F1
    step: |
      Build cmd/ls via mage build (if not already built). Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/ls with extended flags (-C, -x, -t, -S, -r, -U, -v, -i, -s, -n, -F,
      -R, and combinations) on a fixture directory with controlled sizes, mtimes, and
      types. Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/ls and gls
      with identical arguments and environment (LC_ALL=C, --color=never), applies the
      LsExtendedNormalizer to replace mtime columns across recursive listings, and
      compares normalized outputs byte-for-byte. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/ls — multi-column layout, sort order, metadata display, classify, recursive (srd008-ls R1, R2, R3, R4)"
  - T2: "pkg/sys — TerminalWidth, Stat/Lstat for mtime, size, inode, blocks"
  - T3: "pkg/format — Columns for -C/-x, FileTypeColor, HumanSize for -s -h"
  - T4: "pkg/testutils — RunDiffTests, LsExtendedNormalizer"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all extended flag combinations (-C, -x, -t,
      -S, -r, -U, -v, -i, -s, -n, -F, -R, and combinations like -Rl, -tr, -SF),
      confirming full parity with gls.
    traces:
      - AC8
      - AC9
      - AC10
      - AC11
      - AC12
      - AC13
      - AC14
      - AC15
      - AC16
      - AC17
      - AC18
  - id: S2
    criterion: |
      Recursive listing (-R) correctly integrates sort, filter, format, and metadata
      flags across subdirectory boundaries, with "path:" headers and per-directory
      "total" lines matching gls -lR after mtime normalization.
    traces:
      - AC17

out_of_scope:
  - -v (version sort) test uses a simple fixture with files named file1, file2, file10;
    full strverscmp edge cases are not exercised in the differential test.
  - -U (unsorted) output order depends on filesystem directory order; both binaries produce
    the same order when reading the same directory, so comparison is valid but not a test
    of Go-specific behavior.
  - SIGWINCH and terminal resize behavior during -R recursive listing is not testable in the
    differential harness.

test_suite: test-rel-04.0-ext
