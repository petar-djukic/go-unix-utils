id: rel06.1-uc004-whoami
title: "Print effective user name via whoami"

summary: |
  The operator invokes the Go whoami binary to print the effective username of the
  current process. whoami takes no arguments and prints a single line. The differential
  testing harness runs both the Go binary and the Homebrew reference binary (gwhoami
  from coreutils) with the same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd042-whoami.yaml) and invokes do-work to
  produce a passing differential test for cmd/whoami.

flow:
  - id: F1
    step: |
      The operator exercises whoami with no arguments (prints effective username)
      and with extra operands and unknown flags (error cases). whoami is
      deliberately minimal: it prints one name and exits.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/whoami
      and gwhoami with the same arguments and environment. Requires F1 (binary
      must be built). The harness compares stdout byte-for-byte and exit codes.

touchpoints:
  - T1: "cmd/whoami — effective username output (srd042-whoami R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for normal invocation (effective username),
      extra operand error, and unknown flag error, confirming full parity with
      gwhoami.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4

out_of_scope:
  - Behavior under setuid or sudo contexts is not tested beyond what the test
    environment naturally provides.
  - Extra arguments are rejected with an error; this is tested for exit code but not
    for exact error message wording.

test_suite: test-rel-06.1
