id: rel00.0-uc004-testutils
title: "Execute differential tests and compare binary outputs via pkg/testutils"

summary: |
  The operator verifies that pkg/testutils correctly executes Go and reference binaries
  with identical inputs, compares their outputs, and reports divergence. The test exercises
  each harness capability in isolation: RunDiffTests runs named subtests and compares
  stdout, stderr, and exit code byte-for-byte; normalization hooks strip non-deterministic
  fields before comparison; ComposeNormalizers chains multiple hooks; file-state comparison
  validates output files for utilities like sponge; and the timeout mechanism prevents
  hanging test runs.

actor: Human Operator

trigger: |
  The operator has completed the PRD revision (srd001-testutils.yaml) and wants to verify
  that pkg/testutils satisfies its requirements via unit tests.

flow:
  - id: F1
    step: |
      The operator runs go test ./pkg/testutils/... which executes the unit tests for
      pkg/testutils. The harness tests itself using mock binaries that produce known
      stdout, stderr, and exit codes.
  - id: F2
    step: |
      The core execution tests verify RunDiffTests with matching and divergent mock
      binaries. The matching test confirms silent pass; the divergent test confirms
      failure reporting includes args, stdin, both outputs, and both exit codes.
  - id: F3
    step: |
      The normalization tests verify TimestampNormalizer and ComposeNormalizers. These
      depend on RunDiffTests (F2) being correct, since normalization is applied within
      the comparison pipeline.
  - id: F4
    step: |
      The file-state comparison test verifies ExpectedFiles. This depends on RunDiffTests
      (F2) for execution and extends it with post-execution file content checks.
  - id: F5
    step: |
      The timeout and environment tests verify edge cases: timeout prevents hangs,
      LC_ALL=C default is applied. Both depend on RunDiffTests (F2) for execution.

touchpoints:
  - T1: "pkg/testutils — DiffTest, NormalizeFunc (srd001-testutils R1)"
  - T2: "pkg/testutils — RunDiffTests, WorkDir, LC_ALL default (srd001-testutils R2)"
  - T3: "pkg/testutils — comparison and divergence reporting (srd001-testutils R3)"
  - T4: "pkg/testutils — TimestampNormalizer, ComposeNormalizers (srd001-testutils R4)"
  - T5: "pkg/testutils — ExpectedFiles file-state comparison (srd001-testutils R5)"

success_criteria:
  - id: S1
    criterion: |
      go test ./pkg/testutils/... passes, validating execution, comparison, normalization,
      file-state checking, timeout, and environment defaults in a single test run.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7
      - AC8
      - AC9
  - id: S2
    criterion: |
      RunDiffTests with matching mock binaries produces no output, and with divergent mock
      binaries reports args, stdin, both stdouts, both stderrs, and both exit codes. This
      validates the complete comparison pipeline end-to-end.
    traces:
      - AC1
      - AC2
  - id: S3
    criterion: |
      TimestampNormalizer composed with a custom normalizer via ComposeNormalizers produces
      correct results when applied within RunDiffTests, confirming the normalization hook
      integrates with the comparison pipeline.
    traces:
      - AC3
      - AC7

out_of_scope:
  - Utility-specific normalizers (LsNormalizer, LsExtendedNormalizer) are defined in their
    respective cmd/ packages, not in pkg/testutils.
  - Binary compilation and installation are handled by magefiles, not pkg/testutils.
  - Retry logic and filesystem mocking are explicitly excluded by the PRD.

test_suite: test-rel-00.0
