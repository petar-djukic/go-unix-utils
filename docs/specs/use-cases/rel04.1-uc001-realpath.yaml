id: rel04.1-uc001-realpath
title: "Resolve absolute paths via realpath"

summary: |
  The operator invokes the Go realpath binary to resolve file paths to their canonical
  absolute form. realpath follows symlinks, removes . and .. components, and supports
  existence modes (-e, -m) and relative output (--relative-to, --relative-base). The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (grealpath from coreutils) with the same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd049-realpath.yaml) and invokes do-work to
  produce a passing differential test for cmd/realpath.

flow:
  - id: F1
    step: |
      The operator runs "./bin/realpath /tmp" to resolve a path. realpath prints
      the canonical absolute path followed by a newline.
  - id: F2
    step: |
      The operator runs "./bin/realpath -m /nonexistent/foo" to resolve a path
      that does not exist, constructing the remainder.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/realpath
      and grealpath with the same arguments and environment.
  - id: F4
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output for each flag combination.

touchpoints:
  - T1: "cmd/realpath — path resolution output (prd049-realpath R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: cmd/realpath compiles and ./bin/realpath exists after mage build.
  - id: S2
    criterion: |
      "./bin/realpath /tmp" prints the canonical path, matching grealpath.
  - id: S3
    criterion: |
      "./bin/realpath -m /nonexistent/foo" prints a constructed path, matching grealpath.
  - id: S4
    criterion: |
      The differential test passes for all flag combinations and error cases.

out_of_scope:
  - Creating files or directories is not supported and not tested.
  - Behavior on filesystems with unusual symlink configurations is not tested
    beyond what the test environment provides.

test_suite: test-rel04.1
