id: rel04.1-uc001-realpath
title: "Resolve absolute paths via realpath"

summary: |
  The operator invokes the Go realpath binary to resolve file paths to their canonical
  absolute form. realpath follows symlinks, removes . and .. components, and supports
  existence modes (-e, -m) and relative output (--relative-to, --relative-base). The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (grealpath from coreutils) with the same arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd049-realpath.yaml) and invokes do-work to
  produce a passing differential test for cmd/realpath.

flow:
  - id: F1
    step: |
      Build cmd/realpath via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/realpath with each flag combination (default, -e, -m, -s,
      --relative-to, --relative-base, multiple operands). Requires F1
      (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/realpath
      and grealpath with identical arguments and environment, comparing stdout
      byte-for-byte and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/realpath — path resolution output (srd049-realpath R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations (default, -e, -m, -s,
      --relative-to, --relative-base, multiple operands, and error cases), confirming
      full parity with grealpath.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4

out_of_scope:
  - Creating files or directories is not supported and not tested.
  - Behavior on filesystems with unusual symlink configurations is not tested
    beyond what the test environment provides.

test_suite: test-rel-04.1
