id: rel02.2-uc002-seq
title: "Print a sequence of numbers via seq"

summary: |
  The operator invokes the Go seq binary to generate a sequence of numbers for shell
  scripting and pipeline use. The differential testing harness runs both the Go binary
  and the Homebrew reference binary (gseq from coreutils) with the same arguments and
  environment, then compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd019-seq.yaml) and invokes do-work to produce
  a passing differential test for cmd/seq.

flow:
  - id: F1
    step: |
      The operator exercises seq in all three argument forms (LAST, FIRST LAST,
      FIRST INCREMENT LAST) including descending sequences with negative increments.
  - id: F2
    step: |
      The operator tests output formatting: equal-width padding (-w), printf-style
      format strings (-f), and custom separators (-s). These interact with the
      number generation: -w width is computed from the widest endpoint.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/seq and gseq
      with the same arguments. Requires F1 (binary must be built). Floating-point
      precision matching is validated by byte-for-byte comparison.

touchpoints:
  - T1: "cmd/seq — argument forms, sequence generation, formatting (srd019-seq R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all argument forms, -w, -f, -s, descending,
      floating-point, and error cases, confirming full parity with gseq.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7
      - AC8
      - AC9

out_of_scope:
  - Hexadecimal integer output is excluded; use -f '%a' for hex floating-point.
  - Infinity (inf) as an endpoint is excluded; sequences must be bounded.
  - Locale-aware decimal separators are excluded; output always uses '.'.

test_suite: test-rel-02.2
