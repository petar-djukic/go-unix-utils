id: rel06.0-uc004-ln
title: "Create links between files via ln"

summary: |
  The operator invokes the Go ln binary to create hard links or symbolic links
  between files. The differential testing harness runs both the Go binary and
  the Homebrew reference binary (gln from coreutils) with the same arguments
  and compares stderr, exit codes, and resulting filesystem state.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd037-ln.yaml) and invokes do-work to
  produce a passing differential test for cmd/ln.

flow:
  - id: F1
    step: |
      The operator exercises ln with hard links, symbolic links (-s), force
      overwrite (-f), no-dereference (-n), verbose output (-v), backup creation
      (-b), relative symlinks (-r), multiple targets into a directory, and error
      cases. The -s flag changes the link type from hard to symbolic, which also
      permits linking to directories and non-existent targets.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/ln
      and gln with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares stdout, stderr, exit codes, and verifies
      that resulting links have identical type and target.

touchpoints:
  - T1: "cmd/ln — hard link creation, symbolic link (-s), force overwrite (-f) (srd037-ln R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for hard links, symbolic links (-s), force
      overwrite (-f), no-dereference (-n), verbose output (-v), backup creation
      (-b), relative symlinks (-r), multiple targets into a directory, and error
      cases, confirming full parity with gln.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Cross-filesystem hard link restrictions; tests run within a single filesystem.
  - Linking to directories (hard links to directories are disallowed on most systems).

test_suite: test-rel-06.0
