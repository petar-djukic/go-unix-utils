id: rel07.1-uc001-cp
title: "Copy files and directories via cp"

summary: |
  The operator invokes the Go cp binary to duplicate files and directory trees. The
  differential testing harness runs both the Go binary and the Homebrew reference
  binary (gcp from coreutils) with the same arguments and environment, then compares
  exit codes and the resulting file system state.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd056-cp.yaml) and invokes do-work to
  produce a passing differential test for cmd/cp.

flow:
  - id: F1
    step: |
      The operator exercises cp with single file copy, multi-file copy into a
      directory, -r recursive directory copy, -p preserve (mode, ownership,
      timestamps), -a archive, -f force, -n no-clobber, -v verbose, symlink
      handling (-L dereference, -P no-dereference), and error cases (missing
      source, directory without -r). The -r flag changes the processing model
      from single-file to recursive tree traversal, and -a combines -r with
      full attribute preservation.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/cp
      and gcp with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares exit codes and resulting file system state
      (existence, content, permissions).

touchpoints:
  - T1: "cmd/cp — single copy, multi-file, recursive, preserve, archive, force, no-clobber, interactive, symlinks, verbose (srd056-cp R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, exit code and file system comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single file copy, multi-file copy, -r
      recursive, -p preserve, -a archive, -f force, -n no-clobber, -v verbose,
      symlink handling, and error cases (missing source, directory without -r),
      confirming full parity with gcp.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Reflink and sparse file support are excluded per the PRD.

test_suite: test-rel-07.1
