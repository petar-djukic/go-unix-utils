id: rel05.4-uc001-md5sum
title: "Compute and verify MD5 digests via md5sum"

summary: |
  The operator runs the Go md5sum binary on one or more files or stdin. The binary
  computes MD5 digests and prints them in GNU format, or verifies a checksum file.
  The differential testing harness then runs both the Go binary and the Homebrew
  reference binary (gmd5sum from coreutils) with identical inputs and confirms that
  their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd030-md5sum.yaml) and invokes do-work to produce
  a passing differential test for cmd/md5sum.

flow:
  - id: F1
    step: |
      The operator exercises md5sum in digest mode (file and stdin), check mode (--check),
      and tag mode (--tag). --check changes the processing model from digest computation
      to verification against stored hashes.
  - id: F2
    step: |
      The operator tests --check with both matching and mismatching digests to verify
      OK/FAILED output and correct exit codes.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/md5sum and
      gmd5sum with the same inputs and compares stdout byte-for-byte. Requires F1
      (binary must be built).

touchpoints:
  - T1: "cmd/md5sum — digest computation, GNU format output, check mode, binary/tag flags (srd030-md5sum R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for file digest, stdin digest, --check valid,
      --check mismatch, and --tag BSD format, confirming full parity with gmd5sum.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - HMAC-MD5 variants are not tested.
  - md5sum is not used for security; only format compatibility is verified.

test_suite: test-rel-05.4
