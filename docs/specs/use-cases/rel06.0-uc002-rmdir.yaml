id: rel06.0-uc002-rmdir
title: "Remove empty directories via rmdir"

summary: |
  The operator invokes the Go rmdir binary to remove one or more empty
  directories, optionally removing ancestor directories with -p. The
  differential testing harness runs both the Go binary and the Homebrew
  reference binary (grmdir from coreutils) with the same arguments and
  compares stderr and exit codes.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd035-rmdir.yaml) and invokes do-work to
  produce a passing differential test for cmd/rmdir.

flow:
  - id: F1
    step: |
      The operator exercises rmdir with single empty directories, multiple
      directories, -p ancestor chains, non-empty directory errors, nonexistent
      directory errors, --ignore-fail-on-non-empty suppression, and -v verbose
      output. The -p flag changes the processing model from single removal to
      ascending ancestor removal.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/rmdir
      and grmdir with the same arguments and environment. Requires F1 (binary
      must be built). The harness compares stdout, stderr, and exit codes.

touchpoints:
  - T1: "cmd/rmdir — single directory removal, parent removal (-p), non-empty directory error (srd035-rmdir R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single empty directory removal, multiple
      directories, -p ancestor chains, non-empty directory errors, nonexistent
      directory errors, --ignore-fail-on-non-empty suppression, and -v verbose
      output, confirming full parity with grmdir.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Recursive removal of non-empty directories; that is the domain of rm -r.
  - Behavior when the directory is a mount point.

test_suite: test-rel-06.0
