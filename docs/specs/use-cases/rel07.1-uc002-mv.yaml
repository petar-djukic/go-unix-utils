id: rel07.1-uc002-mv
title: "Move or rename files via mv"

summary: |
  The operator invokes the Go mv binary to move or rename files and directories. The
  differential testing harness runs both the Go binary and the Homebrew reference
  binary (gmv from coreutils) with the same arguments and environment, then compares
  exit codes and the resulting file system state.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd057-mv.yaml) and invokes do-work to
  produce a passing differential test for cmd/mv.

flow:
  - id: F1
    step: |
      The operator exercises mv with single file rename, move into directory,
      multi-file move, -f force, -n no-clobber, -v verbose, -t target directory,
      directory move (no -r needed), and error cases (missing source, permission
      denied). Unlike cp, mv does not require -r for directories because rename(2)
      operates on directory entries directly.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/mv
      and gmv with the same arguments and environment. Requires F1 (binary must
      be built). The harness compares exit codes and resulting file system state
      (existence, content, location).

touchpoints:
  - T1: "cmd/mv — rename, move into directory, multi-file, interactive, force, no-clobber, verbose, target directory (srd057-mv R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, exit code and file system comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for single file rename, move into directory,
      multi-file move, -f force, -n no-clobber, -v verbose, -t target directory,
      directory move, and error cases (missing source, permission denied),
      confirming full parity with gmv.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Backup mode (--backup) is excluded per the PRD.

test_suite: test-rel-07.1
