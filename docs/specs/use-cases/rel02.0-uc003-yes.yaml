id: rel02.0-uc003-yes
title: "Repeatedly output a string via yes"

summary: |
  The operator pipes the Go yes binary into a consumer (e.g., head) to generate repeated
  lines of output. The differential testing harness runs both the Go binary and the
  Homebrew reference binary (gyes from coreutils) piped through "head -n N" with the same
  arguments, then compares the captured stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd012-yes.yaml) and invokes do-work to produce
  a passing differential test for cmd/yes.

flow:
  - id: F1
    step: |
      The operator runs "./bin/yes | head -n 5". yes outputs "y\n" repeatedly. head
      captures the first 5 lines and closes the pipe, sending SIGPIPE to yes.
  - id: F2
    step: |
      The operator runs "./bin/yes hello world | head -n 3". yes joins the arguments
      with a space and outputs "hello world\n" repeatedly.
  - id: F3
    step: |
      The operator runs "./bin/yes -- --help | head -n 1" to verify that arguments
      after "--" are treated as literal strings, not flags.
  - id: F4
    step: |
      The differential testing harness (pkg/testutils) executes both "./bin/yes | head -n N"
      and "gyes | head -n N" with the same arguments and environment.
  - id: F5
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output for the captured lines.

touchpoints:
  - T1: "cmd/yes — repeated output, argument joining, SIGPIPE handling (prd012-yes R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: cmd/yes compiles and ./bin/yes exists after mage build.
  - id: S2
    criterion: |
      "./bin/yes | head -n 5" produces five lines of "y", matching gyes output.
  - id: S3
    criterion: |
      "./bin/yes hello world | head -n 3" produces three lines of "hello world",
      matching gyes output.
  - id: S4
    criterion: |
      "./bin/yes -- --help | head -n 1" produces "--help", matching gyes output.
  - id: S5
    criterion: |
      The differential test passes for default, single-arg, multi-arg, and "--"
      separator cases.

out_of_scope:
  - Throughput benchmarking is not part of differential testing. Performance is verified
    manually by observing that yes saturates pipe throughput.
  - Empty string argument ("yes ''") behavior is documented in the PRD but may diverge
    between GNU versions; test with caution.

test_suite: test-rel02.0
