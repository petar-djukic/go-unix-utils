id: rel02.0-uc003-yes
title: "Repeatedly output a string via yes"

summary: |
  The operator pipes the Go yes binary into a consumer (e.g., head) to generate repeated
  lines of output. The differential testing harness runs both the Go binary and the
  Homebrew reference binary (gyes from coreutils) piped through "head -n N" with the same
  arguments, then compares the captured stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd012-yes.yaml) and invokes do-work to produce
  a passing differential test for cmd/yes.

flow:
  - id: F1
    step: |
      The operator runs "./bin/yes | head -n 5". yes outputs "y\n" repeatedly until
      head closes the pipe, sending SIGPIPE. The binary must handle SIGPIPE gracefully
      via pkg/sys.InstallSIGPIPEHandler.
  - id: F2
    step: |
      The operator tests argument joining and "--" separator. yes joins all arguments
      with spaces; arguments after "--" are treated as literals.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/yes and gyes
      piped through head with the same arguments. Requires F1 (binary must be built).
      Output is captured after head truncates the infinite stream.

touchpoints:
  - T1: "cmd/yes — repeated output, argument joining, SIGPIPE handling (srd012-yes R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default, single-arg, multi-arg, and "--"
      separator cases, confirming output and SIGPIPE handling match gyes.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5

out_of_scope:
  - Throughput benchmarking is not part of differential testing. Performance is verified
    manually by observing that yes saturates pipe throughput.
  - Empty string argument ("yes ''") behavior is documented in the PRD but may diverge
    between GNU versions; test with caution.

test_suite: test-rel-02.0
