id: rel01.3-uc001-du
title: "Report recursive directory disk usage via du"

summary: |
  The operator runs the Go du binary on a fixture directory to report disk usage. The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (gdu from coreutils) on the same directory on the same filesystem with the same arguments
  and environment, and confirms that their outputs are identical byte-for-byte. Block counts
  are deterministic when both binaries stat the same files on the same filesystem. All tests
  use -k to pin output to 1024-byte blocks and eliminate platform block-size default variance.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd009-du.yaml) and shared component PRDs
  (pkg/sys, pkg/format from rel00.0) and invokes do-work to produce a passing differential
  test for cmd/du.

flow:
  - id: F1
    step: |
      The operator runs the Go du binary on a fixture directory with known file sizes and
      directory structure. Example: ./bin/du -k testdata/du-fixture/
  - id: F2
    step: |
      cmd/du traverses the directory tree using os.ReadDir, calling pkg/sys.Lstat on each
      entry for st_blocks (block counts) and st_dev/st_ino (hard-link deduplication).
      Depends on pkg/sys (rel00.0) for platform-correct stat fields.
  - id: F3
    step: |
      cmd/du writes output in "SIZE\tPATH\n" format. With -h, sizes are formatted via
      pkg/format.HumanSize. Depends on pkg/format (rel00.0) for human-readable formatting.
  - id: F4
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/du and gdu on
      the same fixture on the same filesystem. Both binaries stat the same files, so block
      counts are deterministic. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/du — recursive traversal, block accumulation, hard-link dedup, flag modes (srd009-du R1, R2, R3, R4, R5)"
  - T2: "pkg/sys — Stat/Lstat for st_blocks, st_dev, st_ino, InstallSIGPIPEHandler"
  - T3: "pkg/format — HumanSize for -h output"
  - T4: "pkg/testutils — RunDiffTests, binary execution and comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations: default -k, -sk, -ak, -h,
      -ck, -d 1, --apparent-size, and missing path. This validates the full cmd/du
      implementation against gdu in a single test run.
    traces:
      - AC1
      - AC2
      - AC3
      - AC5
      - AC7
      - AC9
  - id: S2
    criterion: |
      Hard-link deduplication works: a fixture with two directory entries pointing to the
      same inode produces a total that counts the file's blocks only once, matching gdu.
      This validates the cross-component integration between cmd/du and pkg/sys (st_dev,
      st_ino from Stat).
    traces:
      - AC4
  - id: S3
    criterion: |
      -h mode produces human-readable size strings matching gdu -h, confirming the
      integration between cmd/du and pkg/format.HumanSize.
    traces:
      - AC3

out_of_scope:
  - Cross-filesystem behavior (files on different mount points) is not tested in the
    differential harness; both binaries see the same single filesystem.
  - SIGPIPE handling is specified in srd009-du R5.1 but is not directly testable in the
    differential harness.
  - Sparse file creation depends on the filesystem; --apparent-size tests use a regular file
    with known size rather than a true sparse file.

test_suite: test-rel-01.3
