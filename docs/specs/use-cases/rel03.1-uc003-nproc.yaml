id: rel03.1-uc003-nproc
title: "Print available processor count via nproc"

summary: |
  The operator invokes the Go nproc binary to print the number of available processing
  units. nproc supports --all for installed count and --ignore=N to subtract cores. The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (gnproc from coreutils) with the same flags and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd046-nproc.yaml) and invokes do-work to
  produce a passing differential test for cmd/nproc.

flow:
  - id: F1
    step: |
      Build cmd/nproc via mage build. Requires no prior steps.
  - id: F2
    step: |
      Run ./bin/nproc with each flag combination (default, --all, --ignore=N).
      Requires F1 (binary must be built).
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/nproc and
      gnproc with identical flags and environment, comparing stdout byte-for-byte and
      exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/nproc — processor count output (srd046-nproc R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for all flag combinations (default, --all,
      --ignore=N, --all --ignore=N, and error cases), confirming full parity
      with gnproc.
    traces:
      - AC1
      - AC2
      - AC3

out_of_scope:
  - CPU affinity and cgroup limits are not tested; on macOS, available and installed
    counts are typically identical.

test_suite: test-rel-03.1
