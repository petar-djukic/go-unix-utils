id: rel03.1-uc003-nproc
title: "Print available processor count via nproc"

summary: |
  The operator invokes the Go nproc binary to print the number of available processing
  units. nproc supports --all for installed count and --ignore=N to subtract cores. The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (gnproc from coreutils) with the same flags and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd046-nproc.yaml) and invokes do-work to
  produce a passing differential test for cmd/nproc.

flow:
  - id: F1
    step: |
      The operator runs "./bin/nproc" with no arguments. nproc prints the number
      of available processing units followed by a newline.
  - id: F2
    step: |
      The operator runs "./bin/nproc --ignore=1" to print one fewer than the
      available count.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/nproc
      and gnproc with the same flags and environment.
  - id: F4
    step: |
      The harness compares stdout byte-for-byte and exit codes. Both binaries must
      produce identical output.

touchpoints:
  - T1: "cmd/nproc — processor count output (prd046-nproc R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: cmd/nproc compiles and ./bin/nproc exists after mage build.
  - id: S2
    criterion: |
      "./bin/nproc" prints the CPU count, matching gnproc.
  - id: S3
    criterion: |
      "./bin/nproc --ignore=1" prints one fewer than the default, matching gnproc.
  - id: S4
    criterion: |
      The differential test passes for default, --all, --ignore, and error cases.

out_of_scope:
  - CPU affinity and cgroup limits are not tested; on macOS, available and installed
    counts are typically identical.

test_suite: test-rel03.1
