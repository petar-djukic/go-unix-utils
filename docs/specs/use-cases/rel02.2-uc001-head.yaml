id: rel02.2-uc001-head
title: "Print the first lines or bytes of files via head"

summary: |
  The operator invokes the Go head binary to extract the beginning of files or pipeline
  output. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (ghead from coreutils) with the same arguments, stdin, and environment,
  then compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd018-head.yaml) and invokes do-work to
  produce a passing differential test for cmd/head.

flow:
  - id: F1
    step: |
      The operator exercises head in line-count (-n), byte-count (-c), and negative-count
      modes. Negative counts require buffering all input before output, changing the
      internal processing model.
  - id: F2
    step: |
      The operator tests multi-file mode with automatic headers ("==> FILENAME <==")
      and header control (-q, -v). Multi-file mode changes the output format.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/head and ghead
      with the same arguments and stdin. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/head — line-count, byte-count, negative counts, multi-file headers, quiet/verbose (srd018-head R1, R2, R3, R4)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default, -n, -c, negative counts, multi-file,
      -q, -v, stdin, and error cases, confirming full parity with ghead.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7
  - id: S2
    criterion: |
      Negative line count ("head -n -5") correctly buffers all input and excludes the
      last N lines, matching ghead. This validates the distinct processing model
      required for negative counts versus the streaming approach for positive counts.
    traces:
      - AC3

out_of_scope:
  - Zero-terminated line mode (-z) is excluded per the PRD.
  - Decimal multiplier suffixes (kB, MB, GB) are excluded per the PRD.

test_suite: test-rel-02.2
