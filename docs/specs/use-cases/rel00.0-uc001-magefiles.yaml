id: rel00.0-uc001-magefiles
title: "Build, lint, and version-check via mage targets"

summary: |
  The operator runs mage build to compile cmd/version to bin/version, verifies that the
  binary prints the repository's version tag, runs mage lint to confirm no warnings, and
  runs mage clean to remove build artifacts. This exercises the scaffold-provided build
  lifecycle (srd011-magefiles) and the version binary (srd059-version) before any utility
  code exists.

actor: Human Operator

trigger: |
  The operator has completed the PRDs (srd011-magefiles.yaml, srd059-version.yaml) and
  wants to verify that the build pipeline produces a working binary.

flow:
  - id: F1
    step: |
      The operator runs mage build. The target compiles every package under cmd/ to bin/.
      For cmd/version, the target resolves the latest version tag via
      git describe --tags --abbrev=0 --match "v[0-9]*" and passes it through -ldflags.
  - id: F2
    step: |
      The operator runs bin/version. The binary prints the version tag (e.g., "v0.20260228.0")
      to stdout followed by a newline and exits 0. Requires F1 (binary must exist).
  - id: F3
    step: |
      The operator runs bin/version --version and bin/version --bogus to exercise flag
      parsing. Requires F1 (binary must exist).
  - id: F4
    step: |
      The operator runs mage lint. golangci-lint runs on cmd/, pkg/, and magefiles/ with
      no warnings or errors. Independent of F2-F3 (lint checks source, not runtime).
  - id: F5
    step: |
      The operator runs mage clean. The bin/ directory and its contents are removed. If
      bin/ does not exist, the target succeeds silently. Requires F1 (verifies clean
      removes what build produced).

touchpoints:
  - T1: "cmd/version — version string printing, ldflags injection (srd059-version R1)"
  - T2: "magefiles/ — build, lint, clean targets (srd011-magefiles R1, R2, R3)"
  - T3: "configuration.yaml — project fields (srd011-magefiles R5)"

success_criteria:
  - id: S1
    criterion: |
      The full build-run-clean lifecycle completes without error: mage build produces
      bin/version, the binary prints a version tag and exits 0, and mage clean removes bin/.
    traces:
      - srd059-version AC1
      - srd011-magefiles AC1
      - srd011-magefiles AC3
  - id: S2
    criterion: |
      A development build (no ldflags) produces a binary that prints "dev", confirming
      the ldflags injection path controls version output end-to-end.
    traces:
      - srd059-version AC4

out_of_scope:
  - Differential testing of cmd/version against a reference binary (there is no GNU version equivalent).
  - mage install is exercised by the operator manually; it is not part of this use case's primary flow.
  - Orchestrator, generator, scaffold, and prompt targets are provided by cobbler-scaffold and not covered here.

test_suite: test-rel-00.0
