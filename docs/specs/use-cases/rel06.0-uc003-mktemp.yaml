id: rel06.0-uc003-mktemp
title: "Create temporary files and directories via mktemp"

summary: |
  The operator invokes the Go mktemp binary to create uniquely named temporary
  files or directories. mktemp generates a name from a template (defaulting to
  tmp.XXXXXXXXXX), creates the entry, and prints the resulting path to stdout.
  The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gmktemp from coreutils) with the same arguments. Because
  the generated names are random, the harness compares structural properties
  (exit code, output line count, path prefix, template pattern) rather than
  byte-for-byte stdout.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd036-mktemp.yaml) and invokes do-work to
  produce a passing differential test for cmd/mktemp.

flow:
  - id: F1
    step: |
      The operator exercises mktemp with default file creation, -d directory
      creation, explicit templates, --tmpdir directory placement, --suffix, -t
      legacy mode, and -u dry-run. The -d flag changes the created entry from a
      file (mode 0600) to a directory (mode 0700).
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/mktemp
      and gmktemp with the same arguments and environment. Requires F1 (binary
      must be built). Because generated names are random, the harness compares
      exit codes and structural properties (path prefix, template pattern,
      permissions) rather than byte-for-byte stdout.

touchpoints:
  - T1: "cmd/mktemp — default temp file, temp directory (-d), explicit template (srd036-mktemp R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default file creation, -d directory
      creation, explicit templates, --tmpdir directory placement, --suffix, -t
      legacy mode, and error cases, comparing exit codes and structural output
      properties to confirm parity with gmktemp.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Byte-for-byte stdout comparison; random suffixes make exact matching impossible.
  - Security properties of the random name generation beyond what the OS provides.

test_suite: test-rel-06.0
