id: rel06.0-uc003-mktemp
title: "Create temporary files and directories via mktemp"

summary: |
  The operator invokes the Go mktemp binary to create uniquely named temporary
  files or directories. mktemp generates a name from a template (defaulting to
  tmp.XXXXXXXXXX), creates the entry, and prints the resulting path to stdout.
  The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gmktemp from coreutils) with the same arguments. Because
  the generated names are random, the harness compares structural properties
  (exit code, output line count, path prefix, template pattern) rather than
  byte-for-byte stdout.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd036-mktemp.yaml) and invokes do-work to
  produce a passing differential test for cmd/mktemp.

flow:
  - id: F1
    step: |
      The operator runs "./bin/mktemp". mktemp creates a temporary file in the
      system TMPDIR using the default template and prints the absolute path to
      stdout.
  - id: F2
    step: |
      The operator runs "./bin/mktemp -d". mktemp creates a temporary directory
      instead of a file and prints the path to stdout.
  - id: F3
    step: |
      The operator runs "./bin/mktemp /tmp/myapp.XXXXXX" with an explicit
      template. mktemp replaces the trailing X characters with random characters,
      creates the file, and prints the resulting path.
  - id: F4
    step: |
      The operator runs "./bin/mktemp --tmpdir=custom myprefix.XXXXXX". mktemp
      creates the temporary file inside the "custom" directory using the given
      template prefix.
  - id: F5
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/mktemp
      and gmktemp with the same arguments and environment.
  - id: F6
    step: |
      The harness compares exit codes and validates that both outputs share the
      same path prefix, template structure, and line count. Exact filenames are
      expected to differ due to randomness.

touchpoints:
  - T1: "cmd/mktemp — default temp file, temp directory (-d), explicit template (prd036-mktemp R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: cmd/mktemp compiles and ./bin/mktemp exists after mage build.
  - id: S2
    criterion: |
      "./bin/mktemp" creates a file in TMPDIR, prints its path, and exits 0.
      The created path exists on disk.
  - id: S3
    criterion: |
      Directory creation works: "./bin/mktemp -d" creates a directory (not a
      file) and prints its path.
  - id: S4
    criterion: |
      Explicit templates work: "./bin/mktemp /tmp/myapp.XXXXXX" produces a path
      matching the pattern /tmp/myapp.[a-zA-Z0-9]{6}.
  - id: S5
    criterion: |
      The differential test passes, comparing exit codes and structural output
      properties for default creation, -d, explicit templates, and --tmpdir.

out_of_scope:
  - Byte-for-byte stdout comparison; random suffixes make exact matching impossible.
  - Security properties of the random name generation beyond what the OS provides.

test_suite: test-rel06.0
