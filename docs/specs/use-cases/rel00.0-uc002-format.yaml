id: rel00.0-uc002-format
title: "Format output with columns, color, and human-readable sizes"

summary: |
  The operator verifies that pkg/format produces correct column layouts, ANSI color
  sequences, and human-readable size strings. The test exercises each formatting
  capability in isolation: Columns distributes entries into a grid that fits the terminal
  width, FileTypeColor returns the correct ANSI escape for each file type, the color
  override mechanism works for --color=always and --color=never, and HumanSize converts
  byte counts to human-readable strings matching GNU coreutils behavior.

actor: Human Operator

trigger: |
  The operator has completed the PRD revision (srd003-format.yaml) and wants to verify
  that pkg/format satisfies its requirements via unit tests.

flow:
  - id: F1
    step: |
      The operator runs go test ./pkg/format/... which executes the unit tests for
      pkg/format. No reference binary exists; all validation is via unit tests.
  - id: F2
    step: |
      The Columns and padding tests verify grid layout and string alignment. Columns
      depends on displayWidth (rune-aware width calculation) for correct column sizing.
  - id: F3
    step: |
      The color tests verify FileTypeColor, SetColorEnabled, and ColorEnabled. The
      color override test depends on SetColorEnabled state to confirm suppression works.
  - id: F4
    step: |
      The HumanSize test verifies binary (1024-based) and SI (1000-based) formatting.
      Independent of F2-F3 (no shared state with column or color APIs).

touchpoints:
  - T1: "pkg/format — Columns, PadRight, PadLeft, displayWidth (srd003-format R1)"
  - T2: "pkg/format — FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled (srd003-format R2)"
  - T3: "pkg/format — HumanSize (srd003-format R3)"
  - T4: "pkg/sys — IsTerminal, called internally by ColorEnabled"

success_criteria:
  - id: S1
    criterion: |
      go test ./pkg/format/... passes, validating all three API surfaces (column layout,
      color control, human-readable sizes) in a single test run.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
  - id: S2
    criterion: |
      ColorEnabled returns false for pipe writers and SetColorEnabled(false) suppresses
      all ANSI output, confirming the color subsystem interacts correctly with pkg/sys.IsTerminal.
    traces:
      - AC3
      - AC5

out_of_scope:
  - LS_COLORS environment variable parsing is explicitly excluded from pkg/format.
  - Terminal hyperlinks are not in scope.
  - East-asian full-width character width computation is deferred.

test_suite: test-rel-00.0
