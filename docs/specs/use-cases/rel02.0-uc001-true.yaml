id: rel02.0-uc001-true
title: "Exit successfully via true"

summary: |
  The operator invokes the Go true binary, which exits with status 0 unconditionally. The
  differential testing harness runs both the Go binary and the Homebrew reference binary
  (gtrue from coreutils) with the same arguments and compares exit codes. true ignores all
  arguments and produces no output under normal operation.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd013-true.yaml) and invokes do-work to produce
  a passing differential test for cmd/true.

flow:
  - id: F1
    step: |
      The operator invokes ./bin/true with no arguments. The binary exits immediately
      with status 0.
  - id: F2
    step: |
      The operator invokes ./bin/true with arbitrary arguments (e.g., "foo", "--bar").
      The binary ignores all arguments and exits with status 0.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/true and gtrue
      with the same arguments and environment.
  - id: F4
    step: |
      The harness compares exit codes. Both binaries must exit 0 for normal invocations.
      No stdout or stderr comparison is needed for the default case.

touchpoints:
  - T1: "cmd/true — unconditional exit 0, argument ignoring (prd013-true R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, exit code comparison"

success_criteria:
  - id: S1
    criterion: cmd/true compiles and ./bin/true exists after mage build.
  - id: S2
    criterion: ./bin/true exits with status 0 when invoked with no arguments.
  - id: S3
    criterion: ./bin/true exits with status 0 when invoked with arbitrary arguments.
  - id: S4
    criterion: |
      The differential test passes for no-args and arbitrary-args cases, confirming
      exit code parity with gtrue.

out_of_scope:
  - --help and --version output formatting is verified manually, not via differential testing,
    because the Go binary prints different version strings than the GNU binary.
  - Write-error exit code (R2.3) is not tested in the differential harness; it requires
    closing stdout before invocation, which is platform-specific.

test_suite: test-rel02.0
