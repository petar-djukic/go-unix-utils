id: rel05.2-uc002-paste
title: "Merge lines of files side by side via paste"

summary: |
  The operator runs the Go paste binary on two or more files. The binary reads one line
  from each file per output cycle and joins them with a delimiter, producing merged
  columnar output. The differential testing harness then runs both the Go binary and the
  Homebrew reference binary (gpaste from coreutils) with identical inputs and confirms
  that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd027-paste.yaml) and invokes do-work to produce
  a passing differential test for cmd/paste.

flow:
  - id: F1
    step: |
      The operator exercises paste in default parallel mode, with custom delimiters (-d),
      and in serial mode (-s). -s changes the merge strategy from parallel (one line per
      file per output line) to serial (all lines of each file on one output line).
  - id: F2
    step: |
      The operator tests unequal-length files, stdin as "-", and delimiter cycling to
      verify empty-field handling and delimiter list rotation.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/paste and
      gpaste with the same file arguments and environment. Requires F1 (binary must be
      built).

touchpoints:
  - T1: "cmd/paste — parallel file merge, delimiter cycling, serial mode, unequal-length file handling (srd027-paste R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for parallel merge, -d custom delimiter, unequal
      file lengths, -s serial mode, and stdin as "-", confirming full parity with gpaste.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Files larger than available file descriptors are not a concern; paste opens all files simultaneously.
  - Multi-byte delimiter escape sequences beyond the defined set are not tested.

test_suite: test-rel-05.2
