id: rel15.0-uc001-ts
title: "Timestamp stdin lines via ts"

summary: |
  The operator runs a log-producing command piped through the Go ts binary. The binary
  reads stdin line by line and writes each line to stdout prefixed with a strftime
  timestamp. The differential testing harness then runs both the Go binary and the
  Homebrew reference binary (ts from moreutils) with the same stdin input and confirms
  that their outputs are identical after timestamp normalization.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd004-ts.yaml) and invokes do-work to produce
  a passing differential test for cmd/ts.

flow:
  - id: F1
    step: |
      The operator exercises ts in default mode, custom format mode, elapsed mode (-s),
      and incremental mode (-i). -s and -i change the timestamp source from wall-clock
      to elapsed-since-start and elapsed-since-previous-line respectively, requiring
      TZ=GMT internally.
  - id: F2
    step: |
      The operator tests empty stdin (immediate EOF) and invalid flags to verify clean
      exit behavior and usage error reporting.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/ts and the
      reference ts binary with the same stdin content, args, and environment. Requires
      F1 (binary must be built). The harness applies TimestampNormalizer to both outputs
      before comparison, replacing wall-clock timestamps with a fixed placeholder.

touchpoints:
  - T1: "cmd/ts — timestamp prefix logic, all flag modes (srd004-ts R1, R2, R3, R4, R5, R6, R7, R8, R10)"
  - T2: "pkg/testutils — RunDiffTests, TimestampNormalizer, binary execution and comparison (rel00.0 infrastructure)"
  - T3: "Human Operator — triggers use case via do-work after srd004-ts R1-R10 is complete"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for default format, custom format, -s elapsed mode,
      -i incremental mode, empty stdin, and error cases, confirming full parity with
      the reference ts binary after timestamp normalization.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - -r mode (relative timestamp conversion) is covered by tests in the test suite but is not the primary flow of this use case.
  - -m mode (monotonic clock) differential testing is noted in the test suite but excluded from the primary flow because the reference binary and Go binary may use different monotonic sources.
  - The use case does not cover cmd/ts code generation by the orchestrator; that is handled by the cobbler:stitch mage target.

test_suite: test-rel-15.0
