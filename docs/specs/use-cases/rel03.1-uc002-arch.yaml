id: rel03.1-uc002-arch
title: "Print machine hardware name via arch"

summary: |
  The operator invokes the Go arch binary to print the machine hardware name (e.g.,
  x86_64, arm64), equivalent to uname -m. The differential testing harness runs both
  the Go binary and the Homebrew reference binary (garch from coreutils) with the same
  arguments and compares stdout byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd045-arch.yaml) and invokes do-work to
  produce a passing differential test for cmd/arch.

flow:
  - id: F1
    step: |
      Build cmd/arch via mage build. Requires no prior steps.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/arch and
      garch with identical arguments and environment, comparing stdout byte-for-byte
      and exit codes. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/arch — machine hardware name output (srd045-arch R1, R2)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for normal invocation and error cases (extra
      operand, unknown flag), confirming full parity with garch.
    traces:
      - AC1
      - AC2
      - AC3

out_of_scope:
  - Processor type (-p) and hardware platform (-i) are not reported by arch;
    use uname for those fields.

test_suite: test-rel-03.1
