id: rel05.4-uc004-sha512sum
title: "Compute and verify SHA-512 digests via sha512sum"

summary: |
  The operator runs the Go sha512sum binary on one or more files or stdin. The binary
  computes SHA-512 digests and prints them in GNU format, or verifies a checksum file.
  The differential testing harness then runs both the Go binary and the Homebrew
  reference binary (gsha512sum from coreutils) with identical inputs and confirms that
  their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd033-sha512sum.yaml) and invokes do-work to
  produce a passing differential test for cmd/sha512sum.

flow:
  - id: F1
    step: |
      The operator exercises sha512sum in digest mode (file and stdin), check mode
      (--check), and tag mode (--tag). --check changes the processing model from digest
      computation to verification against stored hashes.
  - id: F2
    step: |
      The operator tests --check with both matching and mismatching digests to verify
      OK/FAILED output and correct exit codes.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/sha512sum and
      gsha512sum with the same inputs and compares stdout byte-for-byte. Requires F1
      (binary must be built).

touchpoints:
  - T1: "cmd/sha512sum — SHA-512 digest computation, GNU format output, check mode, binary/tag flags (srd033-sha512sum R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for file digest, stdin digest, --check valid,
      --check mismatch, and --tag BSD format, confirming full parity with gsha512sum.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5

out_of_scope:
  - SHA-384 and SHA-512/256 truncations are not implemented.

test_suite: test-rel-05.4
