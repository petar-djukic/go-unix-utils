id: rel05.0-uc001-echo
title: "Print arguments to stdout via echo"

summary: |
  The operator runs the Go echo binary with various argument and flag combinations. The
  binary writes its arguments to stdout, optionally suppressing the trailing newline or
  interpreting backslash escape sequences. The differential testing harness then runs both
  the Go binary and the Homebrew reference binary (gecho from coreutils) with identical
  inputs and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd020-echo.yaml) and invokes do-work to produce
  a passing differential test for cmd/echo.

flow:
  - id: F1
    step: |
      The operator exercises echo in default, -n, -e, -E, and combined-flag modes.
      -e changes the processing model from literal passthrough to escape-sequence
      interpretation; \\c within -e terminates output immediately.
  - id: F2
    step: |
      The operator tests arguments starting with "-" that are not recognized flags,
      confirming they are treated as literal text.
  - id: F3
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/echo and gecho
      with the same args and environment. Requires F1 (binary must be built).

touchpoints:
  - T1: "cmd/echo — argument joining, newline suppression, escape sequence interpretation (srd020-echo R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for no arguments, single/multiple arguments, -n,
      -e with all escape sequences, -e with \\c, -E, combined -n -e, and arguments
      starting with "-", confirming full parity with gecho.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Interactive shell built-in echo behavior is not tested; only the standalone binary is covered.
  - --help and --version output matching is not required.

test_suite: test-rel-05.0
