id: rel05.0-uc001-echo
title: "Print arguments to stdout via echo"

summary: |
  The operator runs the Go echo binary with various argument and flag combinations. The
  binary writes its arguments to stdout, optionally suppressing the trailing newline or
  interpreting backslash escape sequences. The differential testing harness then runs both
  the Go binary and the Homebrew reference binary (gecho from coreutils) with identical
  inputs and confirms that their outputs are identical byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (prd020-echo.yaml) and invokes do-work to produce
  a passing differential test for cmd/echo.

flow:
  - id: F1
    step: |
      The operator runs the Go echo binary with text arguments.
      Example: ./bin/echo hello world
  - id: F2
    step: |
      cmd/echo joins its arguments with spaces, appends a newline (unless -n is given),
      and writes the result to stdout.
  - id: F3
    step: |
      When -e is given, cmd/echo processes backslash escape sequences in the argument
      strings before writing. A \\c sequence terminates output immediately.
  - id: F4
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/echo and gecho
      with the same args and environment.
  - id: F5
    step: |
      The harness compares stdout byte-for-byte with no normalization. Both binaries must
      produce identical output bytes and exit codes.
  - id: F6
    step: |
      If the outputs match, the test passes. If they diverge, the harness reports the
      triggering args, both outputs, and both exit codes.

touchpoints:
  - T1: "cmd/echo — argument joining, newline suppression, escape sequence interpretation (prd020-echo R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, binary execution and byte-for-byte comparison"
  - T3: "pkg/sys — InstallSIGPIPEHandler for graceful SIGPIPE handling"

success_criteria:
  - id: S1
    criterion: cmd/echo compiles and ./bin/echo exists after mage build.
  - id: S2
    criterion: ./bin/echo hello world produces "hello world\n", matching gecho byte-for-byte.
  - id: S3
    criterion: The differential test for -n passes; output has no trailing newline.
  - id: S4
    criterion: The differential test for -e with escape sequences passes; \\t, \\n, \\a, and octal/hex escapes produce correct bytes.
  - id: S5
    criterion: The differential test for -e with \\c passes; output terminates at the \\c position with no trailing newline.
  - id: S6
    criterion: The differential test for arguments starting with "-" treated as literals passes.
  - id: S7
    criterion: The differential test for combined -n -e passes.

out_of_scope:
  - Interactive shell built-in echo behavior is not tested; only the standalone binary is covered.
  - --help and --version output matching is not required.

test_suite: test-rel05.0
