id: rel01.2-uc001-sponge
title: "Soak stdin and write to file via sponge"

summary: |
  The operator runs a pipeline that reads a file, transforms it, and pipes the result through
  the Go sponge binary back to the same file. sponge reads all of stdin before opening the
  output file, making the idiom "cmd file | sponge file" safe. The differential testing
  harness runs both the Go binary and the Homebrew reference binary (sponge from moreutils)
  with the same stdin and arguments, then compares the output file contents byte-for-byte.
  Unlike wc and cat, sponge verification uses file-content comparison, not stdout comparison.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd007-sponge.yaml) and invokes do-work to produce
  a passing differential test for cmd/sponge.

flow:
  - id: F1
    step: |
      The operator runs a pipeline that pipes file content through the Go sponge binary back
      to the same file. Example: cat data.txt | ./bin/sponge data.txt
  - id: F2
    step: |
      cmd/sponge reads all bytes from stdin into an in-memory buffer. The output file is
      not opened during this phase (soak-before-write contract). If the buffer exceeds the
      memory threshold, sponge spills to a temp file and continues reading.
  - id: F3
    step: |
      After stdin reaches EOF (requires F2 completion), cmd/sponge opens the output file.
      If it exists, sponge reads its permissions for restoration. In append mode (-a),
      sponge prepends the original file content to the buffered stdin content.
  - id: F4
    step: |
      cmd/sponge writes the buffered content to a temp file, then atomically renames it to
      the output path. Requires F3 (output path and permissions must be resolved). If
      rename fails (cross-device), sponge falls back to a byte-for-byte copy.
  - id: F5
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/sponge and the
      reference binary in isolated temp directories, then compares output file contents
      byte-for-byte using file-state comparison (srd001-testutils R5).

touchpoints:
  - T1: "cmd/sponge — soak-before-write contract, atomic rename, append mode, passthrough (srd007-sponge R1, R2, R3, R4, R5)"
  - T2: "pkg/testutils — RunDiffTests, file-state comparison"

success_criteria:
  - id: S1
    criterion: |
      The soak-before-write contract holds: "cat file | ./bin/sponge file" produces a file
      containing the original content (not empty or truncated), confirming sponge did not
      open the output file until stdin was fully consumed. This is the defining integration
      property that distinguishes sponge from simple redirection.
    traces:
      - AC1
      - AC2
  - id: S2
    criterion: |
      The differential test passes for all modes: small stdin, large stdin (spill path),
      append (-a), passthrough (no file argument), and soak-before-write contract. This
      validates the full implementation against the reference binary.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6

out_of_scope:
  - Cross-device rename fallback is covered in the test suite but is not the primary flow.
  - SIGINT/SIGTERM cleanup behavior is specified in the PRD but is not directly testable in the
    differential harness; it is verified by manual inspection.
  - Memory threshold tuning is not tested; the spill path is exercised by the large-input test.

test_suite: test-rel-01.2
