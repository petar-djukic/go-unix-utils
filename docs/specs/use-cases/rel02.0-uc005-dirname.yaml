id: rel02.0-uc005-dirname
title: "Strip last component from file paths via dirname"

summary: |
  The operator invokes the Go dirname binary with file paths to extract the directory
  component. The differential testing harness runs both the Go binary and the Homebrew
  reference binary (gdirname from coreutils) with the same arguments and compares stdout
  byte-for-byte.

actor: Human Operator

trigger: |
  The operator has completed the PRD (srd016-dirname.yaml) and invokes do-work to
  produce a passing differential test for cmd/dirname.

flow:
  - id: F1
    step: |
      The operator exercises dirname with simple, nested, and edge-case paths. All
      operations are pure string manipulation; no filesystem access occurs.
  - id: F2
    step: |
      The differential testing harness (pkg/testutils) executes both ./bin/dirname and
      gdirname with the same arguments. Requires F1 (binary must be built). Edge cases
      (root, trailing slashes, dots, multiple arguments) are included.

touchpoints:
  - T1: "cmd/dirname — path stripping, trailing slash handling, NUL output (srd016-dirname R1, R2, R3)"
  - T2: "pkg/testutils — RunDiffTests, stdout comparison"

success_criteria:
  - id: S1
    criterion: |
      The differential test passes for simple paths, nested paths, trailing slashes,
      root, relative paths, dots, multiple arguments, and -z mode, confirming full
      parity with gdirname.
    traces:
      - AC1
      - AC2
      - AC3
      - AC4
      - AC5
      - AC6
      - AC7

out_of_scope:
  - Symlink resolution is not tested; dirname operates on string representation only.
  - NUL-delimited output (-z) is tested for byte correctness but not for consumption by
    downstream tools.

test_suite: test-rel-02.0
