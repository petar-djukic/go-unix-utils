id: srd042-whoami
title: "cmd/whoami: Print Effective User Name"

problem: |
  Scripts and interactive sessions use whoami as a quick check for the effective user identity,
  particularly when verifying privilege escalation or drop. The utility is deliberately minimal:
  it prints one name and exits. The macOS BSD whoami and GNU whoami behave identically for the
  core case, but differ in --help and --version handling. The Go implementation must match the
  Homebrew GNU reference binary (gwhoami, installed by coreutils) byte-for-byte, verified by
  differential testing via pkg/testutils.

goals:
  - G1: Print the effective username of the current process followed by a newline.
  - G2: Reject any extra operands with an error message and nonzero exit.

requirements:
  R1:
    title: Default behavior
    items:
      - R1.1:
          text: When invoked with no arguments, must print the effective username (equivalent to id -un) followed by a newline and exit 0.
          weight: 1
      - R1.2:
          text: The username must reflect the effective UID, not the real UID, matching the behavior of gwhoami after su or sudo.
          weight: 1

  R2:
    title: Error handling
    items:
      - R2.1:
          text: If any extra operand is provided (beyond --help and --version), must print an error message to stderr and exit 1.
          weight: 1
      - R2.2:
          text: Must not accept any flags other than --help and --version. Unknown flags must produce an error message to stderr and exit 1.
          weight: 1

  R3:
    title: Differential testing
    items:
      - R3.1:
          text: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (gwhoami) via pkg/testutils.
          weight: 1
      - R3.2:
          text: "Tests must cover: normal invocation (no arguments), extra operand error, and unknown flag error."
          weight: 1
      - R3.3:
          text: Tests must verify that the output matches the effective username returned by the system.
          weight: 1

non_goals:
  - cmd/whoami does not accept a USER argument; it always reports the current process identity.
  - cmd/whoami does not print the UID, GID, or group memberships; use cmd/id for that.
  - cmd/whoami does not support -u or any other selection flags.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/whoami prints the current effective username, matching gwhoami."
    traces:
      - R1.1
      - R1.2
  - id: AC2
    criterion: "go run ./cmd/whoami extraarg exits 1 with an error message to stderr, matching gwhoami."
    traces:
      - R1.1
      - R2.1
      - R2.2
      - R3.1
      - R3.2
  - id: AC3
    criterion: "Differential test against gwhoami passes for normal invocation and error cases."
    traces:
      - R2.1
      - R2.2
      - R3.1
      - R3.2
  - id: AC4
    criterion: "cmd/whoami compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R2.1
      - R2.2
      - R3.1
      - R3.2
      - R3.3
