id: srd046-nproc
title: "cmd/nproc: Print Number of Available Processing Units"

problem: |
  Build scripts and parallel job schedulers use nproc to determine the number of available
  CPUs for concurrency decisions (e.g., make -j$(nproc)). The utility supports an --all flag
  for installed processors and an --ignore=N flag to reserve cores. The Go implementation must
  match the Homebrew GNU reference binary (gnproc, installed by coreutils) on stdout and exit
  code, verified by differential testing via pkg/testutils.

goals:
  - G1: Print the number of available processing units.
  - G2: Support --all and --ignore=N flags for installed count and core reservation.

requirements:
  R1:
    title: Default behavior and flags
    items:
      - R1.1:
          text: When invoked with no arguments, must print the number of available processing units followed by a newline and exit 0.
          weight: 1
      - R1.2:
          text: "--all must print the number of installed processors, which may differ from the available count if CPU affinity or cgroups restrict the set."
          weight: 1
      - R1.3:
          text: "--ignore=N must subtract N from the processor count and print the result. The result must never be less than 1."
          weight: 1
      - R1.4:
          text: --all and --ignore=N may be combined. When combined, --ignore subtracts from the installed count.
          weight: 1

  R2:
    title: Error handling
    items:
      - R2.1:
          text: If any positional operand is provided, must print an error message to stderr and exit 1.
          weight: 1
      - R2.2:
          text: If --ignore is given a non-numeric value, must print an error message to stderr and exit 1.
          weight: 1
      - R2.3:
          text: Unknown flags must produce an error message to stderr and exit 1.
          weight: 1

  R3:
    title: Differential testing
    items:
      - R3.1:
          text: Differential tests must compare stdout output and exit codes between the Go binary and the reference binary (gnproc) via pkg/testutils.
          weight: 1
      - R3.2:
          text: "Tests must cover: default invocation, --all, --ignore=1, --all --ignore=1, and error cases."
          weight: 1
      - R3.3:
          text: All differential tests must set LC_ALL=C in the environment.
          weight: 1

non_goals:
  - cmd/nproc does not set CPU affinity or modify scheduling.
  - cmd/nproc does not read cgroup limits on macOS; the available and installed counts may be identical.

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/nproc prints the CPU count, matching gnproc."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
  - id: AC2
    criterion: "go run ./cmd/nproc --ignore=1 prints one fewer than the default, matching gnproc."
    traces:
      - R1.3
      - R1.4
      - R2.2
      - R3.2
  - id: AC3
    criterion: "Differential test against gnproc passes for all supported flags and error cases."
    traces:
      - R1.2
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R3.3
  - id: AC4
    criterion: "cmd/nproc compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
      - R2.1
      - R2.2
      - R2.3
      - R3.1
      - R3.2
      - R3.3
