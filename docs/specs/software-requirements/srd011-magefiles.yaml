id: srd011-magefiles
title: "magefiles: Build Lifecycle Targets (scaffold-provided)"

problem: |
  go-unix-utils needs build, lint, clean, and install mage targets for its development
  workflow. These targets are provided by the cobbler-scaffold orchestrator library and
  exposed via magefiles/orchestrator.go, which is generated by mage scaffold:push. This
  SRD documents the build lifecycle contract for traceability but requires no code
  generation — all requirements are satisfied by the scaffold.

goals:
  - G1: Document the build lifecycle targets provided by cobbler-scaffold.
  - G2: Document the configuration contract between magefiles/ and configuration.yaml.

requirements:
  R1:
    title: Build target (scaffold-provided)
    items:
      - R1.1:
          text: |
            mage build compiles every package under cmd/ to a binary in the directory
            specified by configuration.yaml project.binary_dir (default: bin/). Provided
            by cobbler-scaffold orchestrator.

  R2:
    title: Lint target (scaffold-provided)
    items:
      - R2.1:
          text: |
            mage lint runs golangci-lint on all Go source directories listed in
            configuration.yaml project.go_source_dirs. Provided by cobbler-scaffold
            orchestrator.

  R3:
    title: Clean target (scaffold-provided)
    items:
      - R3.1:
          text: |
            mage clean removes the binary_dir and all its contents. If the directory
            does not exist, the target succeeds silently. Provided by cobbler-scaffold
            orchestrator.

  R4:
    title: Install target (scaffold-provided)
    items:
      - R4.1:
          text: |
            mage install runs go install for every package under cmd/. Provided by
            cobbler-scaffold orchestrator.

  R5:
    title: Configuration contract (scaffold-provided)
    items:
      - R5.1:
          text: |
            configuration.yaml project section must contain module_path, binary_dir,
            go_source_dirs, and magefiles_dir fields. Populated by mage scaffold:push.

non_goals:
  - This SRD does not specify orchestrator, generator, scaffold, prompt, or stats targets. Those are provided by cobbler-scaffold.
  - cmd/version is specified separately in srd059-version.

acceptance_criteria:
  - id: AC1
    criterion: "mage build compiles cmd/ binaries to bin/. Provided by cobbler-scaffold."
    traces: [R1.1]
  - id: AC2
    criterion: "mage lint runs with no warnings. Provided by cobbler-scaffold."
    traces: [R2.1]
  - id: AC3
    criterion: "mage clean removes bin/. Provided by cobbler-scaffold."
    traces: [R3.1]
  - id: AC4
    criterion: "mage install runs go install for every package under cmd/. Provided by cobbler-scaffold."
    traces: [R4.1]
  - id: AC5
    criterion: "configuration.yaml project fields are present. Populated by scaffold:push."
    traces: [R5.1]
