id: srd057-mv
title: "cmd/mv: Move or Rename Files"

problem: |
  mv renames files within the same filesystem or copies and deletes across filesystems.
  The macOS BSD mv differs from GNU mv in cross-device fallback behavior and verbose
  output formatting. The Go implementation must match the Homebrew GNU reference binary
  (gmv, installed by coreutils) on exit codes and observable file system state for all
  supported flag combinations, verified by differential testing via pkg/testutils.

goals:
  - G1: Move or rename files and directories within and across filesystems.
  - G2: Support interactive, force, and no-clobber modes for destination conflict resolution.
  - G3: Support verbose output and target directory specification.
  - G4: Verify functional parity against gmv via differential testing.

requirements:
  R1:
    title: Basic move and rename
    items:
      - R1.1:
          text: "When given SOURCE DEST, must rename SOURCE to DEST if on the same filesystem, or copy and delete if on different filesystems."
      - R1.2:
          text: "When given multiple SOURCE arguments and a DEST directory, must move each SOURCE into DEST."
      - R1.3:
          text: Must move directories without requiring a recursive flag (unlike cp).
      - R1.4:
          text: "When DEST exists and is a directory, must move SOURCE into DEST as DEST/SOURCE."

  R2:
    title: Overwrite control
    items:
      - R2.1:
          text: "-i or --interactive must prompt before overwriting an existing destination file."
      - R2.2:
          text: "-f or --force must not prompt before overwriting. When combined with -i, the last flag given takes precedence."
      - R2.3:
          text: "-n or --no-clobber must not overwrite an existing destination file."
      - R2.4:
          text: "When the destination cannot be overwritten due to permissions, must print an error to stderr."

  R3:
    title: Output control and target directory
    items:
      - R3.1:
          text: "-v or --verbose must print the name of each file as it is moved, in the format 'SOURCE -> DEST' or 'renamed SOURCE -> DEST'."
      - R3.2:
          text: "-t DIRECTORY or --target-directory=DIRECTORY must move all SOURCE arguments into DIRECTORY."
      - R3.3:
          text: "-T or --no-target-directory must treat DEST as a normal file, not a directory."

  R4:
    title: Exit codes and differential testing
    items:
      - R4.1:
          text: Must exit 0 when all files are moved successfully.
      - R4.2:
          text: Must exit 1 when any move operation fails (permission denied, source not found).
      - R4.3:
          text: "When moving multiple files and one fails, must continue moving remaining files and exit 1."
      - R4.4:
          text: "Differential tests must compare exit codes and resulting file system state between the Go binary and the reference binary via pkg/testutils. Tests must cover: single file rename, move into directory, multi-file move, -i interactive, -f force, -n no-clobber, -v verbose, -t target directory, directory move, and error cases."

non_goals:
  - cmd/mv does not implement --backup (make backups of existing destination files).
  - cmd/mv does not implement --suffix (override backup suffix).
  - cmd/mv does not implement -u (move only when source is newer).
  - cmd/mv does not implement SELinux context preservation (--context).

acceptance_criteria:
  - id: AC1
    criterion: "go run ./cmd/mv file1.txt file2.txt renames the file, matching gmv."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
  - id: AC2
    criterion: "go run ./cmd/mv file1.txt dir/ moves file into directory, matching gmv."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
  - id: AC3
    criterion: "go run ./cmd/mv -n existing.txt target.txt does not overwrite target, matching gmv."
    traces:
      - R2.3
      - R4.4
  - id: AC4
    criterion: "go run ./cmd/mv -v file1.txt file2.txt prints the move operation, matching gmv."
    traces:
      - R3.1
      - R4.4
  - id: AC5
    criterion: "go run ./cmd/mv nonexistent.txt target.txt exits 1 with error on stderr, matching gmv."
    traces:
      - R2.4
      - R4.1
      - R4.2
      - R4.3
      - R4.4
  - id: AC6
    criterion: "Differential test against gmv passes for all flag combinations listed in R4.4."
    traces:
      - R4.4
  - id: AC7
    criterion: "cmd/mv compiles with no warnings under golangci-lint."
    traces:
      - R1.1
      - R1.2
      - R1.3
      - R1.4
      - R2.1
      - R2.2
      - R2.3
      - R2.4
      - R3.1
      - R3.2
      - R3.3
      - R4.1
      - R4.2
      - R4.3
      - R4.4
