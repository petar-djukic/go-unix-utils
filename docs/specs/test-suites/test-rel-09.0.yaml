id: test-rel-09.0
title: "Test Suite: rel09.0 — sha224sum, sha384sum, b2sum, cksum, sum"
release: rel09.0

traces:
  - rel09.0-uc001-sha224sum
  - rel09.0-uc002-sha384sum
  - rel09.0-uc003-b2sum
  - rel09.0-uc004-cksum
  - rel09.0-uc005-sum
  - srd074-sha224sum R1
  - srd074-sha224sum R2
  - srd074-sha224sum R3
  - srd074-sha224sum R4
  - srd075-sha384sum R1
  - srd075-sha384sum R2
  - srd075-sha384sum R3
  - srd075-sha384sum R4
  - srd076-b2sum R1
  - srd076-b2sum R2
  - srd076-b2sum R3
  - srd076-b2sum R4
  - srd077-cksum R1
  - srd077-cksum R2
  - srd077-cksum R3
  - srd078-sum R1
  - srd078-sum R2
  - srd078-sum R3

preconditions:
  - "Go binary for each utility is built via go build -o bin/<name> ./cmd/<name>/"
  - "Reference binaries installed via Homebrew: gsha224sum, gsha384sum, gb2sum, gcksum, gsum (coreutils package)"
  - "Tests use LC_ALL=C for deterministic output"

test_cases:

  # ---- sha224sum ----

  - name: sha224sum_compute_stdin
    description: "sha224sum on stdin produces SHA-224 hash in GNU text format"
    inputs:
      args: []
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd074-sha224sum R1.1
      - srd074-sha224sum R1.2

  - name: sha224sum_compute_file
    description: "sha224sum on a named file produces correct hash and filename"
    inputs:
      args: ["hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd074-sha224sum R1.1

  - name: sha224sum_check_valid
    description: "sha224sum --check with correct checksums exits 0 and prints OK"
    inputs:
      args: ["--check", "sums.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd074-sha224sum R2.1
      - srd074-sha224sum R2.2

  - name: sha224sum_tag_format
    description: "sha224sum --tag produces BSD-style tagged output"
    inputs:
      args: ["--tag"]
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd074-sha224sum R1.3

