id: test-rel-05.4
title: "Test Suite: rel05.4 — md5sum, sha1sum, sha256sum, sha512sum"
release: rel05.4

traces:
  - rel05.4-uc001-md5sum
  - rel05.4-uc002-sha1sum
  - rel05.4-uc003-sha256sum
  - rel05.4-uc004-sha512sum
  - srd030-md5sum R1
  - srd030-md5sum R2
  - srd031-sha1sum R1
  - srd031-sha1sum R2
  - srd032-sha256sum R1
  - srd032-sha256sum R2
  - srd033-sha512sum R1
  - srd033-sha512sum R2

preconditions:
  - ./bin/md5sum, ./bin/sha1sum, ./bin/sha256sum, and ./bin/sha512sum exist (built via mage build).
  - Reference binaries gmd5sum, gsha1sum, gsha256sum, and gsha512sum are installed via Homebrew (coreutils) and on PATH.
  - Tests are run via go test ./cmd/md5sum/... ./cmd/sha1sum/... ./cmd/sha256sum/... ./cmd/sha512sum/... which invoke RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.
  - No normalization is applied; all outputs are compared byte-for-byte.
  - Test setup creates a known file (e.g. containing "hello\n") and a pre-computed checksum file for check-mode tests.

test_cases:

  # ---- md5sum ----

  - name: md5sum_compute_stdin
    description: Compute MD5 of stdin; output is "HASH  -" in GNU text format.
    inputs:
      args: []
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "b1946ac92492d2347c6235b4d2611184  -\n"
      stderr: ""
    traces:
      - srd030-md5sum R1.1
      - srd030-md5sum R1.2

  - name: md5sum_compute_file
    description: "Compute MD5 of a named file. Setup: hello.txt contains 'hello\\n'."
    inputs:
      args: ["hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "b1946ac92492d2347c6235b4d2611184  hello.txt\n"
      stderr: ""
    traces:
      - srd030-md5sum R1.1

  - name: md5sum_binary_mode
    description: "-b uses asterisk format: 'HASH *FILENAME'."
    inputs:
      args: ["-b", "hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "b1946ac92492d2347c6235b4d2611184 *hello.txt\n"
      stderr: ""
    traces:
      - srd030-md5sum R3.1

  - name: md5sum_tag_format
    description: "--tag uses BSD format: 'MD5 (FILENAME) = HASH'."
    inputs:
      args: ["--tag", "hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "MD5 (hello.txt) = b1946ac92492d2347c6235b4d2611184\n"
      stderr: ""
    traces:
      - srd030-md5sum R1.3

  - name: md5sum_check_valid
    description: "--check on a valid checksum file exits 0 and prints OK. Setup: checksums.md5 contains the correct hash for hello.txt."
    inputs:
      args: ["--check", "checksums.md5"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello.txt: OK\n"
      stderr: ""
    traces:
      - srd030-md5sum R2.1
      - srd030-md5sum R2.2

  - name: md5sum_check_failure
    description: "--check on a file with wrong hash exits 1 and prints FAILED. Setup: bad.md5 contains an incorrect hash for hello.txt."
    inputs:
      args: ["--check", "bad.md5"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout: "hello.txt: FAILED\n"
      stderr_contains: "WARNING"
    traces:
      - srd030-md5sum R2.2

  # ---- sha1sum ----

  - name: sha1sum_compute_stdin
    description: Compute SHA-1 of stdin.
    inputs:
      args: []
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "f572d396fae9206628714fb2ce00f72e94f2258f  -\n"
      stderr: ""
    traces:
      - srd031-sha1sum R1.1
      - srd031-sha1sum R1.2

  - name: sha1sum_check_valid
    description: "--check on a valid SHA-1 checksum file exits 0."
    inputs:
      args: ["--check", "checksums.sha1"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello.txt: OK\n"
      stderr: ""
    traces:
      - srd031-sha1sum R2.1
      - srd031-sha1sum R2.2

  - name: sha1sum_tag_format
    description: "--tag uses BSD format: 'SHA1 (FILENAME) = HASH'."
    inputs:
      args: ["--tag", "hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "SHA1 (hello.txt) = f572d396fae9206628714fb2ce00f72e94f2258f\n"
      stderr: ""
    traces:
      - srd031-sha1sum R1.3

  # ---- sha256sum ----

  - name: sha256sum_compute_stdin
    description: Compute SHA-256 of stdin.
    inputs:
      args: []
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "5891b5b522d5df086d0ff0b110fbd9d21bb4fc7163af34d08286a2e846f6be03  -\n"
      stderr: ""
    traces:
      - srd032-sha256sum R1.1
      - srd032-sha256sum R1.2

  - name: sha256sum_check_valid
    description: "--check on a valid SHA-256 checksum file exits 0."
    inputs:
      args: ["--check", "checksums.sha256"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello.txt: OK\n"
      stderr: ""
    traces:
      - srd032-sha256sum R2.1
      - srd032-sha256sum R2.2

  - name: sha256sum_tag_format
    description: "--tag uses BSD format: 'SHA256 (FILENAME) = HASH'."
    inputs:
      args: ["--tag", "hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "SHA256 (hello.txt) = 5891b5b522d5df086d0ff0b110fbd9d21bb4fc7163af34d08286a2e846f6be03\n"
      stderr: ""
    traces:
      - srd032-sha256sum R1.3

  # ---- sha512sum ----

  - name: sha512sum_compute_stdin
    description: Compute SHA-512 of stdin.
    inputs:
      args: []
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "e7c22b994c59d9cf2b48e549b1e24666636045930d3da7c1acb299d1c3b7f931f94aae41edda2c2b207a36e10f8bcb8d45223e54878f5b316e7ce3b6bc019629  -\n"
      stderr: ""
    traces:
      - srd033-sha512sum R1.1
      - srd033-sha512sum R1.2

  - name: sha512sum_check_valid
    description: "--check on a valid SHA-512 checksum file exits 0."
    inputs:
      args: ["--check", "checksums.sha512"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello.txt: OK\n"
      stderr: ""
    traces:
      - srd033-sha512sum R2.1
      - srd033-sha512sum R2.2

  - name: sha512sum_tag_format
    description: "--tag uses BSD format: 'SHA512 (FILENAME) = HASH'."
    inputs:
      args: ["--tag", "hello.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "SHA512 (hello.txt) = e7c22b994c59d9cf2b48e549b1e24666636045930d3da7c1acb299d1c3b7f931f94aae41edda2c2b207a36e10f8bcb8d45223e54878f5b316e7ce3b6bc019629\n"
      stderr: ""
    traces:
      - srd033-sha512sum R1.3
