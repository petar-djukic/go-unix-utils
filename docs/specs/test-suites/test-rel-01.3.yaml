id: test-rel-01.3
title: "Test Suite: rel01.3 — du specification and differential test"
release: rel01.3

traces:
  - rel01.3-uc001-du
  - srd009-du R1
  - srd009-du R2
  - srd009-du R3
  - srd009-du R4
  - srd009-du R5

preconditions:
  - Binaries exist under ./bin/ (built via mage build).
  - Reference binaries are installed via Homebrew gdu (coreutils).
  - Tests are run via go test ./cmd/du/... which invokes RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.
  - No normalization is applied; du output is deterministic when both binaries run on the same directory on the same filesystem.
  - All block-count tests use -k to pin output to 1024-byte blocks and eliminate platform default divergence.
  - Tests use a fixture directory (testdata/du-fixture/) containing nested files of known sizes, a second subdirectory for multi-argument tests, and files of varied sizes.
  - Hard-link pairs are created in test setup (not committed) to test dedup. All files in the fixture are on the same filesystem as the test runner.

test_cases:
  - name: du_default_recursive
    description: Default flags with -k on fixture directory; one line per subdirectory and root.
    inputs:
      args: ["-k", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one "SIZE\tPATH" line per subdirectory, ending with the root directory total
      stderr: ""
    traces:
      - srd009-du R1.1
      - srd009-du R1.2
      - srd009-du R1.3

  - name: du_summary_mode
    description: -s prints only the total for each argument.
    inputs:
      args: ["-sk", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line with total size and path
      stderr: ""
    traces:
      - srd009-du R2.2

  - name: du_all_files
    description: -a prints size for every file, not just directories.
    inputs:
      args: ["-ak", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line per file and directory in the tree
      stderr: ""
    traces:
      - srd009-du R2.3

  - name: du_human_readable
    description: -h displays sizes as human-readable strings (K/M/G).
    inputs:
      args: ["-h", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: size values contain unit suffixes (K, M, G)
      stderr: ""
    traces:
      - srd009-du R2.1

  - name: du_max_depth_1
    description: -d 1 limits output to the argument and its immediate children.
    inputs:
      args: ["-k", "-d", "1", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: lines for immediate subdirectories and the root; no deeper entries
      stderr: ""
    traces:
      - srd009-du R2.4

  - name: du_grand_total
    description: -c prints a grand total "total" line after all arguments.
    inputs:
      args: ["-ck", "testdata/du-fixture/subdir1", "testdata/du-fixture/subdir2"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: per-argument lines followed by a "SIZE\ttotal" line
      stderr: ""
    traces:
      - srd009-du R2.7

  - name: du_hard_link_dedup
    description: 'A file hard-linked into two directories is counted only once. Setup: create testdata/du-hardlink-fixture/ with dir_a/shared.txt (a regular file) and dir_b/shared.txt (hard link to dir_a/shared.txt, same inode). The hard link is created at test time via os.Link.'
    inputs:
      args: ["-k", "testdata/du-hardlink-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: total for the root counts shared.txt blocks once, not twice
      stderr: ""
    traces:
      - srd009-du R3.1
      - srd009-du R3.2
      - srd009-du R3.3

  - name: du_apparent_size
    description: --apparent-size reports st_size instead of st_blocks.
    inputs:
      args: ["--apparent-size", "-k", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: sizes based on file content length, not block allocation
      stderr: ""
    traces:
      - srd009-du R2.8

  - name: du_kilobyte_units
    description: -k reports in 1024-byte blocks (default, accepted without error).
    inputs:
      args: ["-k", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: identical to default_recursive (1K is the default)
      stderr: ""
    traces:
      - srd009-du R2.5

  - name: du_megabyte_units
    description: -m reports in 1048576-byte (1M) blocks.
    inputs:
      args: ["-m", "testdata/du-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: sizes in megabyte units, smaller values show as 1 (rounded up)
      stderr: ""
    traces:
      - srd009-du R2.6

  - name: du_missing_path
    description: Non-existent argument prints error to stderr, exits 1.
    inputs:
      args: ["-k", "nonexistent_dir"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stderr_contains: "nonexistent_dir"
    traces:
      - srd009-du R4.2
