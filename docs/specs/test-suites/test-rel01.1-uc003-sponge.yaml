id: test-rel01.1-uc003-sponge
title: "Test Suite: sponge soak stdin and write to file"

traces:
  - rel01.1-uc003-sponge
  - prd007-sponge R1
  - prd007-sponge R2
  - prd007-sponge R3
  - prd007-sponge R4
  - prd007-sponge R5
  - prd007-sponge R6

preconditions: |
  - ./bin/sponge exists (built via mage build).
  - The reference binary sponge is installed (brew install moreutils) and on PATH.
  - Tests are run via go test ./cmd/sponge/... which invokes RunDiffTests from pkg/testutils.
  - Each test creates an isolated temp directory to avoid interference between tests.
  - Comparison is on output file content (prd001-testutils R5), not stdout, for all tests
    that specify an output filename.
  - Passthrough mode tests compare stdout byte-for-byte (standard stdout comparison).

test_cases:
  - name: small_stdin_to_file
    description: 100 lines piped to sponge with an output filename; compare output file content.
    inputs:
      args: ["outfile.txt"]
      stdin: "seq 1 100 output (lines 1 through 100, each followed by newline)"
      env: []
    normalization: none
    expected:
      exit_code: 0
      files:
        outfile.txt: "100 lines, '1\n' through '100\n'"
      stderr: ""
    traces:
      - prd007-sponge R1.1
      - prd007-sponge R1.2
      - prd007-sponge R2.1

  - name: soak_before_write
    description: Same input and output file (cat file | sponge file). Output must equal input, proving sponge did not truncate before reading.
    inputs:
      args: ["data.txt"]
      stdin: "content of data.txt (fed via 'cat data.txt')"
      env: []
      setup: |
        data.txt contains "line1\nline2\nline3\n"
        Pipeline: cat data.txt | sponge data.txt
    normalization: none
    expected:
      exit_code: 0
      files:
        data.txt: "line1\nline2\nline3\n"
      stderr: ""
    traces:
      - prd007-sponge R1.1
      - prd007-sponge R2.5

  - name: passthrough_stdout
    description: No output filename; stdin content appears on stdout.
    inputs:
      args: []
      stdin: "hello world\n"
      env: []
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello world\n"
      stderr: ""
    traces:
      - prd007-sponge R4.1
      - prd007-sponge R4.3

  - name: append_mode
    description: -a flag prepends original file content before stdin content.
    inputs:
      args: ["-a", "existing.txt"]
      stdin: "appended line\n"
      env: []
      setup: |
        existing.txt contains "original line\n"
    normalization: none
    expected:
      exit_code: 0
      files:
        existing.txt: "original line\nappended line\n"
      stderr: ""
    traces:
      - prd007-sponge R3.1
      - prd007-sponge R3.3

  - name: append_mode_no_existing_file
    description: -a with a non-existent output file behaves as default mode (creates new file).
    inputs:
      args: ["-a", "newfile.txt"]
      stdin: "new content\n"
      env: []
      setup: |
        newfile.txt does not exist
    normalization: none
    expected:
      exit_code: 0
      files:
        newfile.txt: "new content\n"
      stderr: ""
    traces:
      - prd007-sponge R3.2

  - name: large_stdin
    description: Input >= 1 MB forces temp-file spill; output file content must match.
    inputs:
      args: ["large_out.txt"]
      stdin: "generated payload of 1,048,576+ bytes (e.g., seq 1 50000)"
      env: []
    normalization: none
    expected:
      exit_code: 0
      files:
        large_out.txt: "identical to stdin content"
      stderr: ""
    traces:
      - prd007-sponge R1.3
      - prd007-sponge R1.4

  - name: output_file_exists_mode
    description: Existing file has mode 0640; after sponge, file mode is preserved.
    inputs:
      args: ["protected.txt"]
      stdin: "new content\n"
      env: []
      setup: |
        protected.txt exists with mode 0640 and contains "old content\n"
    normalization: none
    expected:
      exit_code: 0
      files:
        protected.txt: "new content\n"
      state:
        protected.txt_mode: "0640"
      stderr: ""
    traces:
      - prd007-sponge R2.3

  - name: empty_stdin
    description: Zero bytes of stdin; output file created with zero bytes.
    inputs:
      args: ["empty_out.txt"]
      stdin: ""
      env: []
    normalization: none
    expected:
      exit_code: 0
      files:
        empty_out.txt: ""
      stderr: ""
    traces:
      - prd007-sponge R1.1
      - prd007-sponge R2.1
