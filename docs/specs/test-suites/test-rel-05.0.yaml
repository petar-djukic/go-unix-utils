id: test-rel-05.0
title: "Test Suite: rel05.0 — echo, tac, nl, fold"
release: rel05.0

traces:
  - rel05.0-uc001-echo
  - rel05.0-uc002-tac
  - rel05.0-uc003-nl
  - rel05.0-uc004-fold
  - srd020-echo R1
  - srd020-echo R2
  - srd020-echo R3
  - srd021-tac R1
  - srd021-tac R2
  - srd021-tac R3
  - srd022-nl R1
  - srd022-nl R2
  - srd022-nl R3
  - srd022-nl R4
  - srd023-fold R1
  - srd023-fold R2
  - srd023-fold R3

preconditions:
  - ./bin/echo, ./bin/tac, ./bin/nl, and ./bin/fold exist (built via mage build).
  - Reference binaries gecho, gtac, gnl, and gfold are installed via Homebrew (coreutils) and on PATH.
  - Tests are run via go test ./cmd/echo/... ./cmd/tac/... ./cmd/nl/... ./cmd/fold/... which invoke RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.
  - No normalization is applied; all outputs are compared byte-for-byte.

test_cases:

  # ---- echo ----

  - name: echo_default_output
    description: No flags; arguments joined with spaces, followed by newline.
    inputs:
      args: ["hello", "world"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello world\n"
      stderr: ""
    traces:
      - srd020-echo R1.1

  - name: echo_no_args
    description: No arguments; outputs only a newline.
    inputs:
      args: []
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "\n"
      stderr: ""
    traces:
      - srd020-echo R1.2

  - name: echo_suppress_newline
    description: -n flag suppresses trailing newline.
    inputs:
      args: ["-n", "hello"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello"
      stderr: ""
    traces:
      - srd020-echo R1.3

  - name: echo_escape_tab
    description: -e interprets \\t as a horizontal tab.
    inputs:
      args: ["-e", "col1\\tcol2"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "col1\tcol2\n"
      stderr: ""
    traces:
      - srd020-echo R2.1

  - name: echo_escape_newline
    description: -e interprets \\n as an embedded newline.
    inputs:
      args: ["-e", "line1\\nline2"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "line1\nline2\n"
      stderr: ""
    traces:
      - srd020-echo R2.1

  - name: echo_escape_c_terminates
    description: -e with \\c terminates output at that point; no trailing newline.
    inputs:
      args: ["-e", "before\\cafter"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "before"
      stderr: ""
    traces:
      - srd020-echo R2.2

  - name: echo_no_escape_default
    description: Without -e, backslash sequences are literal.
    inputs:
      args: ["a\\tb"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "a\\tb\n"
      stderr: ""
    traces:
      - srd020-echo R2.3

  - name: echo_combined_n_e
    description: -n -e combined; escape sequences processed and no trailing newline.
    inputs:
      args: ["-n", "-e", "x\\ty"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "x\ty"
      stderr: ""
    traces:
      - srd020-echo R1.3
      - srd020-echo R2.1

  # ---- tac ----

  - name: tac_default_reversal
    description: Lines reversed; trailing newline preserved.
    inputs:
      args: []
      stdin: "alpha\nbeta\ngamma\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "gamma\nbeta\nalpha\n"
      stderr: ""
    traces:
      - srd021-tac R1.1
      - srd021-tac R1.2

  - name: tac_no_trailing_newline
    description: Input without trailing newline; last line (now first) has no newline.
    inputs:
      args: []
      stdin: "a\nb\nc"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "c\nb\na"
      stderr: ""
    traces:
      - srd021-tac R1.2

  - name: tac_custom_separator
    description: -s ':' splits on colon; records reversed with colon separator after each.
    inputs:
      args: ["-s", ":"]
      stdin: "a:b:c:"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "c:b:a:"
      stderr: ""
    traces:
      - srd021-tac R2.1

  - name: tac_before_flag
    description: -b places separator before each record.
    inputs:
      args: ["-b", "-s", ":"]
      stdin: ":a:b:c"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ":c:b:a"
      stderr: ""
    traces:
      - srd021-tac R2.2

  - name: tac_single_line
    description: Single line input reverses to itself.
    inputs:
      args: []
      stdin: "only\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "only\n"
      stderr: ""
    traces:
      - srd021-tac R1.1

  # ---- nl ----

  - name: nl_default_body_numbering
    description: Default mode numbers non-empty body lines only; empty lines pass through unnumbered.
    inputs:
      args: []
      stdin: "first\n\nsecond\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "     1\tfirst\n\n     2\tsecond\n"
      stderr: ""
    traces:
      - srd022-nl R1.1
      - srd022-nl R1.2

  - name: nl_number_all_lines
    description: -b a numbers every line including empty lines.
    inputs:
      args: ["-b", "a"]
      stdin: "x\n\ny\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "     1\tx\n     2\t\n     3\ty\n"
      stderr: ""
    traces:
      - srd022-nl R2.1

  - name: nl_format_ln_width_3_separator
    description: "-n ln -w 3 -s ': ' uses left-justified 3-char field with custom separator."
    inputs:
      args: ["-n", "ln", "-w", "3", "-s", ": "]
      stdin: "a\nb\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "1  : a\n2  : b\n"
      stderr: ""
    traces:
      - srd022-nl R3.1
      - srd022-nl R3.2
      - srd022-nl R3.3

  - name: nl_start_and_increment
    description: -v 10 -i 5 starts at 10 and increments by 5.
    inputs:
      args: ["-v", "10", "-i", "5"]
      stdin: "p\nq\nr\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "    10\tp\n    15\tq\n    20\tr\n"
      stderr: ""
    traces:
      - srd022-nl R3.4

  - name: nl_section_delimiters
    description: Section delimiter lines consumed; header numbered with -h a.
    inputs:
      args: ["-h", "a"]
      stdin: "\\:\\:\\:\nheader line\n\\:\\:\nbody line\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "     1\theader line\n     1\tbody line\n"
      stderr: ""
    traces:
      - srd022-nl R4.1
      - srd022-nl R4.2

  # ---- fold ----

  - name: fold_default_width_80
    description: Lines up to 80 characters pass through unchanged.
    inputs:
      args: []
      stdin: "short line\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "short line\n"
      stderr: ""
    traces:
      - srd023-fold R1.2

  - name: fold_wrap_at_width
    description: -w 4 wraps a 10-character string into segments of 4, 4, 2.
    inputs:
      args: ["-w", "4"]
      stdin: "abcdefghij"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "abcd\nefgh\nij"
      stderr: ""
    traces:
      - srd023-fold R1.1
      - srd023-fold R1.3
      - srd023-fold R1.4

  - name: fold_space_break
    description: -w 11 -s breaks at the last space within 11 columns.
    inputs:
      args: ["-w", "11", "-s"]
      stdin: "hello world foo\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hello world\nfoo\n"
      stderr: ""
    traces:
      - srd023-fold R3.1

  - name: fold_byte_mode
    description: -b measures width in bytes; no tab-stop expansion.
    inputs:
      args: ["-b", "-w", "4"]
      stdin: "abcde"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "abcd\ne"
      stderr: ""
    traces:
      - srd023-fold R2.3

  - name: fold_tab_columns
    description: Tab expands to tab stops for column counting; wrap accounts for tab width.
    inputs:
      args: ["-w", "9"]
      stdin: "a\tbcde\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "a\tbcd\ne\n"
      stderr: ""
    traces:
      - srd023-fold R2.2

  - name: fold_space_break_no_space
    description: -s with no space in first W columns falls back to hard wrap.
    inputs:
      args: ["-w", "4", "-s"]
      stdin: "abcdefgh\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "abcd\nefgh\n"
      stderr: ""
    traces:
      - srd023-fold R3.2
