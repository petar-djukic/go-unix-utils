id: test-rel01.1-uc001-wc
title: "Test Suite: wc count lines, words, and bytes"

traces:
  - rel01.1-uc001-wc
  - prd005-wc R1
  - prd005-wc R2
  - prd005-wc R3
  - prd005-wc R4
  - prd005-wc R5
  - prd005-wc R6

preconditions: |
  - ./bin/wc exists (built via mage build).
  - The reference binary gwc is installed (brew install coreutils) and on PATH.
  - Tests are run via go test ./cmd/wc/... which invokes RunDiffTests from pkg/testutils.
  - No normalization is applied; wc output is deterministic integer counts.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.

test_cases:
  - name: default_three_lines
    description: Default flags (line, word, byte count) with three-line stdin.
    inputs:
      args: []
      stdin: "foo\nbar baz\nqux\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "3"
      stderr: ""
    traces:
      - prd005-wc R1.1
      - prd005-wc R1.2
      - prd005-wc R1.3

  - name: lines_only
    description: -l flag counts newline characters only.
    inputs:
      args: ["-l"]
      stdin: "one\ntwo\nthree\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "3"
      stderr: ""
    traces:
      - prd005-wc R2.1
      - prd005-wc R2.6

  - name: words_only
    description: -w flag counts words (maximal sequences of non-whitespace).
    inputs:
      args: ["-w"]
      stdin: "hello world\ngoodbye  cruel   world\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "5"
      stderr: ""
    traces:
      - prd005-wc R2.2
      - prd005-wc R2.6

  - name: bytes_only
    description: -c flag counts bytes.
    inputs:
      args: ["-c"]
      stdin: "abc\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "4"
      stderr: ""
    traces:
      - prd005-wc R2.3

  - name: chars_lc_c
    description: -m with LC_ALL=C; character count equals byte count under C locale.
    inputs:
      args: ["-m"]
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "6"
      stderr: ""
    traces:
      - prd005-wc R2.4
      - prd005-wc R5.1
      - prd005-wc R5.2

  - name: max_line_length
    description: -L flag reports the longest line length with tab expansion.
    inputs:
      args: ["-L"]
      stdin: "short\na much longer line here\nmed\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "22"
      stderr: ""
    traces:
      - prd005-wc R2.5

  - name: combined_flags_order
    description: Combined flags (-l -w -c) produce counts in fixed order (lines, words, bytes).
    inputs:
      args: ["-w", "-l", "-c"]
      stdin: "one two\nthree\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: counts in order lines, words, bytes regardless of flag order
      stderr: ""
    traces:
      - prd005-wc R2.6

  - name: multi_file_total
    description: Two files produce per-file lines and a total line with right-aligned columns.
    inputs:
      args: ["file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
      setup: |
        file1.txt contains "hello\nworld\n" (2 lines, 2 words, 12 bytes)
        file2.txt contains "foo bar baz\n" (1 line, 3 words, 12 bytes)
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: three lines — file1 counts, file2 counts, total with label "total"; columns right-aligned
      stderr: ""
    traces:
      - prd005-wc R1.4
      - prd005-wc R3.1
      - prd005-wc R3.2

  - name: total_only
    description: --total=only with two files prints only the total line.
    inputs:
      args: ["--total=only", "file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
      setup: |
        file1.txt contains "a\n"
        file2.txt contains "b\nc\n"
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line with summed counts and label "total"
      stderr: ""
    traces:
      - prd005-wc R3.3

  - name: total_never
    description: --total=never with two files prints no total line.
    inputs:
      args: ["--total=never", "file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
      setup: |
        file1.txt contains "x\n"
        file2.txt contains "y\n"
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: two lines (one per file), no total line
      stderr: ""
    traces:
      - prd005-wc R3.3

  - name: stdin_dash
    description: "-" as a filename argument reads from stdin.
    inputs:
      args: ["-"]
      stdin: "stdin content\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line of counts (no filename label for stdin dash)
      stderr: ""
    traces:
      - prd005-wc R4.1

  - name: empty_stdin
    description: Zero bytes of stdin produces "0 0 0" for default flags.
    inputs:
      args: []
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "0"
      stderr: ""
    traces:
      - prd005-wc R4.3

  - name: missing_file
    description: Non-existent file prints error to stderr, exits 1, processes remaining files.
    inputs:
      args: ["nonexistent.txt", "real.txt"]
      stdin: null
      env: ["LC_ALL=C"]
      setup: |
        real.txt contains "data\n"
        nonexistent.txt does not exist
    normalization: none
    expected:
      exit_code: 1
      stdout_structure: counts for real.txt and a total line are printed
      stderr_contains: "nonexistent.txt"
    traces:
      - prd005-wc R6.2
