id: test-rel-03.0
title: "Test Suite: rel03.0 — wc specification and differential test"
release: rel03.0

traces:
  - rel03.0-uc001-wc
  - srd005-wc R1
  - srd005-wc R2
  - srd005-wc R3
  - srd005-wc R4
  - srd005-wc R5
  - srd005-wc R6

preconditions:
  - ./bin/wc exists (built via mage build).
  - Reference binary gwc is installed via Homebrew (coreutils) and on PATH.
  - Tests are run via go test ./cmd/wc/... which invokes RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.
  - "wc: no normalization is applied; wc output is deterministic integer counts."

test_cases:
  - name: wc_default_three_lines
    description: Default flags (line, word, byte count) with three-line stdin.
    inputs:
      args: []
      stdin: "foo\nbar baz\nqux\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "3"'
      stderr: ""
    traces:
      - srd005-wc R1.1
      - srd005-wc R1.2
      - srd005-wc R1.3

  - name: wc_lines_only
    description: -l flag counts newline characters only.
    inputs:
      args: ["-l"]
      stdin: "one\ntwo\nthree\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "3"'
      stderr: ""
    traces:
      - srd005-wc R2.1
      - srd005-wc R2.6

  - name: wc_words_only
    description: -w flag counts words (maximal sequences of non-whitespace).
    inputs:
      args: ["-w"]
      stdin: "hello world\ngoodbye  cruel   world\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "5"'
      stderr: ""
    traces:
      - srd005-wc R2.2
      - srd005-wc R2.6

  - name: wc_bytes_only
    description: -c flag counts bytes.
    inputs:
      args: ["-c"]
      stdin: "abc\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "4"'
      stderr: ""
    traces:
      - srd005-wc R2.3

  - name: wc_chars_lc_c
    description: -m with LC_ALL=C; character count equals byte count under C locale.
    inputs:
      args: ["-m"]
      stdin: "hello\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "6"'
      stderr: ""
    traces:
      - srd005-wc R2.4
      - srd005-wc R5.1
      - srd005-wc R5.2

  - name: wc_max_line_length
    description: -L flag reports the longest line length with tab expansion.
    inputs:
      args: ["-L"]
      stdin: "short\na much longer line here\nmed\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "22"'
      stderr: ""
    traces:
      - srd005-wc R2.5

  - name: wc_combined_flags_order
    description: Combined flags (-l -w -c) produce counts in fixed order (lines, words, bytes).
    inputs:
      args: ["-w", "-l", "-c"]
      stdin: "one two\nthree\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: counts in order lines, words, bytes regardless of flag order
      stderr: ""
    traces:
      - srd005-wc R2.6

  - name: wc_multi_file_total
    description: 'Two files produce per-file lines and a total line with right-aligned columns. Setup: file1.txt contains "hello\nworld\n" (2 lines, 2 words, 12 bytes), file2.txt contains "foo bar baz\n" (1 line, 3 words, 12 bytes)'
    inputs:
      args: ["file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: three lines — file1 counts, file2 counts, total with label "total"; columns right-aligned
      stderr: ""
    traces:
      - srd005-wc R1.4
      - srd005-wc R3.1
      - srd005-wc R3.2

  - name: wc_total_only
    description: '--total=only with two files prints only the total line. Setup: file1.txt contains "a\n", file2.txt contains "b\nc\n"'
    inputs:
      args: ["--total=only", "file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line with summed counts and label "total"
      stderr: ""
    traces:
      - srd005-wc R3.3

  - name: wc_total_never
    description: '--total=never with two files prints no total line. Setup: file1.txt contains "x\n", file2.txt contains "y\n"'
    inputs:
      args: ["--total=never", "file1.txt", "file2.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: two lines (one per file), no total line
      stderr: ""
    traces:
      - srd005-wc R3.3

  - name: wc_stdin_dash
    description: '"-" as a filename argument reads from stdin.'
    inputs:
      args: ["-"]
      stdin: "stdin content\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one line of counts (no filename label for stdin dash)
      stderr: ""
    traces:
      - srd005-wc R4.1

  - name: wc_empty_stdin
    description: Zero bytes of stdin produces "0 0 0" for default flags.
    inputs:
      args: []
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "0"'
      stderr: ""
    traces:
      - srd005-wc R4.3

  - name: wc_missing_file
    description: 'Non-existent file prints error to stderr, exits 1, processes remaining files. Setup: real.txt contains "data\n", nonexistent.txt does not exist'
    inputs:
      args: ["nonexistent.txt", "real.txt"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout_structure: counts for real.txt and a total line are printed
      stderr_contains: "nonexistent.txt"
    traces:
      - srd005-wc R6.2
