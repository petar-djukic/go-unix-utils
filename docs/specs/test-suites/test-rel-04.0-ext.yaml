id: test-rel-04.0-ext
title: "Test Suite: rel04.0 extended — ls extended flag listing"
release: rel04.0

traces:
  - rel04.0-uc002-ls-extended
  - srd008-ls R1
  - srd008-ls R2
  - srd008-ls R3
  - srd008-ls R4

preconditions:
  - ./bin/ls exists (built via mage build).
  - The reference binary gls is installed (brew install coreutils) and on PATH.
  - Tests are run via go test ./cmd/ls/... which invokes RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C and --color=never to eliminate locale and ANSI variance.
  - The LsExtendedNormalizer replaces mtime columns with MTIME in all output including recursive subdirectory listings.
  - Both binaries run on the same fixture directory on the same filesystem, ensuring inode numbers and block counts are identical.
  - "Fixture directory (testdata/ls-extended-fixture/) contains files with distinct known sizes, files with distinct mtimes set via os.Chtimes, subdirectories with nested files for -R testing, a symbolic link, an executable file (mode 0755), a named pipe (FIFO), files named file1/file2/file10/file20 for -v version sort testing, and dotfiles for filter interaction with -R."

test_cases:
  # --- uc001-ls-extended: ls extended flag listing ---

  - name: multi_col_forced
    description: -C forces multi-column output even when stdout is piped. stdout is a pipe; -C overrides single-column default
    inputs:
      args: ["-C", "--color=never", "-w", "80", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries in columns, fitting within 80 characters
      stderr: ""
    traces:
      - srd008-ls R1.11
      - srd008-ls R1.12

  - name: horizontal_layout
    description: -x sorts entries horizontally (across, then down).
    inputs:
      args: ["-x", "--color=never", "-w", "80", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries arranged across rows first, then down
      stderr: ""
    traces:
      - srd008-ls R1.13

  - name: sort_by_mtime
    description: '-t sorts by modification time, newest first. Fixture files have distinct mtimes set via os.Chtimes: newest_file (mtime = now), middle_file (mtime = now - 1h), oldest_file (mtime = now - 2h)'
    inputs:
      args: ["-1t", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries ordered newest to oldest
      stderr: ""
    traces:
      - srd008-ls R2.5

  - name: sort_by_size
    description: -S sorts by size, largest first.
    inputs:
      args: ["-1S", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries ordered largest to smallest by file size
      stderr: ""
    traces:
      - srd008-ls R2.6

  - name: sort_reverse
    description: -r reverses the default alphabetical sort order.
    inputs:
      args: ["-1r", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries in reverse C locale alphabetical order
      stderr: ""
    traces:
      - srd008-ls R2.7

  - name: sort_reverse_time
    description: -tr reverses time sort (oldest first).
    inputs:
      args: ["-1tr", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries ordered oldest to newest
      stderr: ""
    traces:
      - srd008-ls R2.7
      - srd008-ls R2.5

  - name: sort_unsorted
    description: -U disables sorting; entries in directory order.
    inputs:
      args: ["-1U", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries in directory order (same for both binaries on same filesystem)
      stderr: ""
    traces:
      - srd008-ls R2.8

  - name: version_sort
    description: -v sorts with numeric-aware version sort (file2 before file10).
    inputs:
      args: ["-1v", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: file1, file2, file10, file20 (numeric sort, not lexicographic)
      stderr: ""
    traces:
      - srd008-ls R2.9

  - name: inode_display
    description: -i prepends inode number to each entry.
    inputs:
      args: ["-1i", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: each line has right-aligned inode number followed by entry name
      stderr: ""
    traces:
      - srd008-ls R2.11

  - name: block_display
    description: -s prepends block count to each entry.
    inputs:
      args: ["-1s", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: each line has right-aligned block count followed by entry name
      stderr: ""
    traces:
      - srd008-ls R2.12

  - name: numeric_ids
    description: -n activates long format with numeric UID/GID instead of names.
    inputs:
      args: ["-n", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: LsExtendedNormalizer replaces mtime with MTIME
    expected:
      exit_code: 0
      stdout_structure: long format with numeric owner and group IDs
      stderr: ""
    traces:
      - srd008-ls R2.14
      - srd008-ls R4.6

  - name: classify_indicator
    description: '-F appends type indicators to entry names. Fixture contains: a directory (gets /), an executable (gets *), a symlink (gets @), a named pipe (gets |), a regular file (no indicator).'
    inputs:
      args: ["-1F", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: 'output contains "/", "*", and "@"'
      stderr: ""
    traces:
      - srd008-ls R3.8
      - srd008-ls R3.9

  - name: recursive
    description: -R recursively lists subdirectories with "path:" headers.
    inputs:
      args: ["-1R", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: |
        Root listing followed by subdirectory listings, each with "path:" header
        and blank-line separators.
      stderr: ""
    traces:
      - srd008-ls R3.11
      - srd008-ls R3.13
      - srd008-ls R3.14

  - name: recursive_long
    description: -Rl lists all subdirectories in long format with "total N" per directory.
    inputs:
      args: ["-Rl", "--color=never", "testdata/ls-extended-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: LsExtendedNormalizer replaces all mtime columns with MTIME
    expected:
      exit_code: 0
      stdout_structure: |
        Each subdirectory block has "path:" header, "total N" line, and long-format entries
        with MTIME placeholder.
      stderr: ""
    traces:
      - srd008-ls R3.12
      - srd008-ls R4.8
