id: test-rel13.1
title: "Test Suite: rel13.1 — pr, ptx"
release: rel13.1

traces:
  - rel13.1-uc001-pr
  - rel13.1-uc002-ptx
  - prd110-pr R1
  - prd110-pr R2
  - prd110-pr R3
  - prd111-ptx R1
  - prd111-ptx R2
  - prd111-ptx R3

preconditions:
  - "Go binary for each utility is built via go build -o bin/<name> ./cmd/<name>/"
  - "Reference binaries installed via Homebrew: gpr, gptx (coreutils package)"
  - "Tests use LC_ALL=C for deterministic output"

test_cases:

  - name: pr_default
    description: "pr paginates input with header"
    inputs:
      args: []
      stdin: "line1\nline2\nline3\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - prd110-pr R1.1
      - prd110-pr R1.4

  - name: pr_two_columns
    description: "pr -2 produces two-column output"
    inputs:
      args: ["-2"]
      stdin: "a\nb\nc\nd\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - prd110-pr R2.1

  - name: ptx_basic
    description: "ptx produces permuted index"
    inputs:
      args: []
      stdin: "hello world\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - prd111-ptx R1.1
      - prd111-ptx R1.4
