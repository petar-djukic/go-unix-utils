id: test-rel-12.1
title: "Test Suite: rel12.1 — tsort, pathchk, test"
release: rel12.1

traces:
  - rel12.1-uc001-tsort
  - rel12.1-uc002-pathchk
  - rel12.1-uc003-test
  - srd102-tsort R1
  - srd102-tsort R2
  - srd103-pathchk R1
  - srd103-pathchk R2
  - srd104-test R1
  - srd104-test R2
  - srd104-test R3
  - srd104-test R4

preconditions:
  - "Go binary for each utility is built via go build -o bin/<name> ./cmd/<name>/"
  - "Reference binaries installed via Homebrew: gtsort, gpathchk, gtest, gstty (coreutils package)"
  - "Tests use LC_ALL=C for deterministic output"

test_cases:

  - name: tsort_basic
    description: "tsort produces topological ordering"
    inputs:
      args: []
      stdin: "a b b c\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd102-tsort R1.1

  - name: tsort_cycle
    description: "tsort detects cycle and exits 1"
    inputs:
      args: []
      stdin: "a b b a\n"
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout: ""
      stderr: ""
    traces:
      - srd102-tsort R1.2

  - name: pathchk_valid
    description: "pathchk on valid path exits 0"
    inputs:
      args: ["validpath"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd103-pathchk R1.1

  - name: pathchk_posix_invalid
    description: "pathchk -p on non-portable path exits 1"
    inputs:
      args: ["-p", "invalid@path"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout: ""
      stderr: ""
    traces:
      - srd103-pathchk R1.2

  - name: test_file_exists
    description: "test -f on existing file exits 0"
    inputs:
      args: ["-f", "/etc/passwd"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd104-test R1.1

  - name: test_integer_eq
    description: "test 1 -eq 1 exits 0"
    inputs:
      args: ["1", "-eq", "1"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd104-test R2.2

  - name: test_not
    description: "test ! -d /nonexistent exits 0"
    inputs:
      args: ["!", "-d", "/nonexistent"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: ""
      stderr: ""
    traces:
      - srd104-test R3.1

