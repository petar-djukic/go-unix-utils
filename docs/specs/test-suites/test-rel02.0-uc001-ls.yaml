id: test-rel02.0-uc001-ls
title: "Test Suite: ls core flag listing"

traces:
  - rel02.0-uc001-ls
  - prd008-ls R1
  - prd008-ls R2
  - prd008-ls R3
  - prd008-ls R4
  - prd008-ls R5
  - prd008-ls R6
  - prd008-ls R7

preconditions: |
  - ./bin/ls exists (built via mage build).
  - The reference binary gls is installed (brew install coreutils) and on PATH.
  - Tests are run via go test ./cmd/ls/... which invokes RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent sort divergence.
  - All differential tests use --color=never to eliminate ANSI escape variance (except
    color-specific structural tests).
  - For -l tests, the LsNormalizer replaces the mtime column (matching "Mon DD HH:MM" or
    "Mon DD  YYYY" patterns) with the placeholder "MTIME" before comparison.
  - Tests use a fixture directory (testdata/ls-fixture/) containing:
    - Regular files of known sizes (0 bytes, 1024 bytes, 1536 bytes, 1048576 bytes)
    - A subdirectory
    - Dotfiles (.hidden, .config)
    - A symbolic link
    - Files with known permissions (rwxr-xr-x, rw-r-----)
    - All files owned by the test runner's UID/GID for consistent owner/group display.

test_cases:
  - name: default_single_col_redirect
    description: No flags, stdout redirected (not a TTY); one entry per line in C locale order.
    inputs:
      args: ["--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
      note: stdout is a pipe (not TTY), so default format is single-column
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one entry per line, sorted in C locale order, no dotfiles
      stderr: ""
    traces:
      - prd008-ls R1.2
      - prd008-ls R1.3
      - prd008-ls R1.4

  - name: default_multi_col_tty
    description: Default on TTY (or forced with -C and --width=80); multi-column output.
    inputs:
      args: ["-C", "--color=never", "-w", "80", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
      note: -C forces multi-column even without TTY; -w 80 sets column width
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: entries arranged in columns fitting within 80 characters
      stderr: ""
    traces:
      - prd008-ls R1.1

  - name: single_col_flag
    description: -1 forces single-column output regardless of TTY.
    inputs:
      args: ["-1", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_structure: one entry per line, sorted in C locale order
      stderr: ""
    traces:
      - prd008-ls R2.1

  - name: long_format
    description: -l produces long format with permissions, nlink, owner, group, size, mtime, name.
    inputs:
      args: ["-l", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: LsNormalizer replaces mtime column with MTIME placeholder
    expected:
      exit_code: 0
      stdout_structure: |
        "total N" line followed by one long-format line per entry.
        Each line has: type+perms, nlink, owner, group, size, MTIME, name.
      stderr: ""
    traces:
      - prd008-ls R2.2
      - prd008-ls R2.3
      - prd008-ls R2.4
      - prd008-ls R2.5
      - prd008-ls R2.6
      - prd008-ls R2.7
      - prd008-ls R2.9

  - name: long_format_symlink
    description: -l on a directory containing a symlink shows "name -> target".
    inputs:
      args: ["-l", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: LsNormalizer replaces mtime column with MTIME placeholder
    expected:
      exit_code: 0
      stdout_contains: " -> "
      stderr: ""
    traces:
      - prd008-ls R2.8

  - name: long_human
    description: -lh displays human-readable file sizes matching gls -lh.
    inputs:
      args: ["-lh", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: LsNormalizer replaces mtime column with MTIME placeholder
    expected:
      exit_code: 0
      stdout_structure: long format with sizes like "1.0K", "1.5K", "1.0M" instead of byte counts
      stderr: ""
    traces:
      - prd008-ls R5.1
      - prd008-ls R5.2

  - name: filter_all
    description: -a includes all entries including . and .. and dotfiles.
    inputs:
      args: ["-a", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "."
      stdout_contains_2: ".."
      stdout_contains_3: ".hidden"
      stderr: ""
    traces:
      - prd008-ls R3.1

  - name: filter_almost_all
    description: -A includes dotfiles but excludes . and .. entries.
    inputs:
      args: ["-A", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: ".hidden"
      stdout_not_contains: standalone "." or ".." entries
      stderr: ""
    traces:
      - prd008-ls R3.2

  - name: directory_itself
    description: -d shows the directory entry itself, not its contents.
    inputs:
      args: ["-d", "--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "testdata/ls-fixture/\n"
      stderr: ""
    traces:
      - prd008-ls R3.3

  - name: color_suppressed
    description: --color=never produces no ANSI escape sequences.
    inputs:
      args: ["--color=never", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout_not_contains: "\\033["
      stderr: ""
    traces:
      - prd008-ls R4.4

  - name: color_always
    description: --color=always produces ANSI escape sequences for file types.
    inputs:
      args: ["--color=always", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
      note: structural check only, not a diff test (ANSI codes must be present)
    normalization: none
    expected:
      exit_code: 0
      stdout_contains: "\\033["
      stderr: ""
    traces:
      - prd008-ls R4.1
      - prd008-ls R4.3

  - name: missing_file
    description: Non-existent argument prints error to stderr, exits 1, lists other args.
    inputs:
      args: ["--color=never", "nonexistent", "testdata/ls-fixture/"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout_structure: listing of testdata/ls-fixture/ entries
      stderr_contains: "nonexistent"
    traces:
      - prd008-ls R6.2

  - name: bad_option
    description: Unknown flag produces error and exits 2.
    inputs:
      args: ["--invalid-flag"]
      stdin: null
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 2
      stderr_contains: "unrecognized option"
    traces:
      - prd008-ls R6.3
