id: test-rel-03.1
title: "Test Suite: rel03.1 — system information (uname, arch, nproc, hostname, hostid)"
release: rel03.1

traces:
  - rel03.1-uc001-uname
  - rel03.1-uc002-arch
  - rel03.1-uc003-nproc
  - rel03.1-uc004-hostname
  - rel03.1-uc005-hostid
  - srd044-uname R1
  - srd044-uname R2
  - srd044-uname R3
  - srd044-uname R4
  - srd045-arch R1
  - srd045-arch R2
  - srd045-arch R3
  - srd046-nproc R1
  - srd046-nproc R2
  - srd046-nproc R3
  - srd047-hostname R1
  - srd047-hostname R2
  - srd047-hostname R3
  - srd048-hostid R1
  - srd048-hostid R2
  - srd048-hostid R3

preconditions:
  - All binaries exist in ./bin/ (built via mage build).
  - Reference binaries guname, garch, gnproc, ghostname, ghostid are installed via Homebrew (coreutils) and on PATH.
  - Tests are run via go test ./cmd/<utility>/... which invokes RunDiffTests from pkg/testutils.
  - All tests use LC_ALL=C to eliminate locale-dependent divergence.

test_cases:
  # --- uname ---
  - name: uname_default
    description: "uname with no arguments prints the kernel name (same as -s)."
    inputs:
      args: []
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "kernel name followed by newline (e.g., Darwin)"
      stderr: ""
    traces:
      - srd044-uname R1.1

  - name: uname_kernel_name
    description: "uname -s prints the kernel name."
    inputs:
      args: ["-s"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "kernel name followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.2

  - name: uname_nodename
    description: "uname -n prints the network node hostname."
    inputs:
      args: ["-n"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hostname followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.3

  - name: uname_kernel_release
    description: "uname -r prints the kernel release string."
    inputs:
      args: ["-r"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "kernel release followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.4

  - name: uname_kernel_version
    description: "uname -v prints the kernel version string."
    inputs:
      args: ["-v"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "kernel version followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.5

  - name: uname_machine
    description: "uname -m prints the machine hardware name."
    inputs:
      args: ["-m"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "machine hardware name followed by newline (e.g., arm64)"
      stderr: ""
    traces:
      - srd044-uname R1.6

  - name: uname_processor
    description: "uname -p prints the processor type."
    inputs:
      args: ["-p"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "processor type or unknown followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.7

  - name: uname_hardware_platform
    description: "uname -i prints the hardware platform."
    inputs:
      args: ["-i"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "hardware platform or unknown followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.8

  - name: uname_os
    description: "uname -o prints the operating system name."
    inputs:
      args: ["-o"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "operating system name followed by newline"
      stderr: ""
    traces:
      - srd044-uname R1.9

  - name: uname_all
    description: "uname -a prints all fields in canonical order."
    inputs:
      args: ["-a"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "all fields space-separated followed by newline"
      stderr: ""
    traces:
      - srd044-uname R2.1

  - name: uname_combined_flags
    description: "uname -sn prints kernel name and node name, space-separated."
    inputs:
      args: ["-sn"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "kernel name and hostname space-separated followed by newline"
      stderr: ""
    traces:
      - srd044-uname R2.2

  - name: uname_extra_operand
    description: "uname with a positional operand prints an error."
    inputs:
      args: ["extraarg"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout: ""
      stderr: "error message about extra operand"
    traces:
      - srd044-uname R3.1

  # --- arch ---
  - name: arch_default
    description: "arch prints the machine hardware name."
    inputs:
      args: []
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "machine hardware name followed by newline (e.g., arm64)"
      stderr: ""
    traces:
      - srd045-arch R1.1

  - name: arch_extra_operand
    description: "arch with a positional operand prints an error."
    inputs:
      args: ["extraarg"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 1
      stdout: ""
      stderr: "error message about extra operand"
    traces:
      - srd045-arch R2.1

  # --- nproc ---
  - name: nproc_default
    description: "nproc prints the available processor count."
    inputs:
      args: []
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
