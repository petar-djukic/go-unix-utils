  - name: nproc_all
    description: "nproc --all prints the installed processor count."
    inputs:
      args: ["--all"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "numeric installed processor count followed by newline"
      stderr: ""
    traces:
      - srd046-nproc R1.2

  - name: nproc_ignore
    description: "nproc --ignore=1 prints one fewer than the available count."
    inputs:
      args: ["--ignore=1"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "available count minus 1 followed by newline"
      stderr: ""
    traces:
      - srd046-nproc R1.3

  - name: nproc_all_ignore
    description: "nproc --all --ignore=1 subtracts from the installed count."
    inputs:
      args: ["--all", "--ignore=1"]
      stdin: ""
      env: ["LC_ALL=C"]
    normalization: none
    expected:
      exit_code: 0
      stdout: "installed count minus 1 followed by newline"
      stderr: ""
    traces:
      - srd046-nproc R1.4

  - name: nproc_extra_operand
    description: "nproc with a positional operand prints an error."
    inputs:
      args: ["extraarg"]
