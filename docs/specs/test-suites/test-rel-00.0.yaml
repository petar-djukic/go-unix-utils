id: test-rel-00.0
title: "Test Suite: rel00.0 — build lifecycle, cmd/version, pkg/format, pkg/sys, and pkg/testutils"
release: rel00.0

traces:
  - rel00.0-uc001-magefiles
  - srd059-version R1
  - srd011-magefiles R1
  - srd011-magefiles R2
  - srd011-magefiles R3
  - srd011-magefiles R4
  - rel00.0-uc002-format
  - srd003-format R1
  - srd003-format R2
  - srd003-format R3
  - rel00.0-uc003-sys
  - srd002-sys R1
  - srd002-sys R2
  - srd002-sys R3
  - rel00.0-uc004-testutils
  - srd001-testutils R1
  - srd001-testutils R2
  - srd001-testutils R3
  - srd001-testutils R4
  - srd001-testutils R5
  - rel00.0-uc005-hashutil
  - srd086-hashutil R1
  - srd086-hashutil R2
  - srd086-hashutil R3
  - rel00.0-uc006-sizeparse
  - srd087-sizeparse R1
  - srd087-sizeparse R2
  - srd087-sizeparse R3
  - rel00.0-uc007-encutil
  - srd088-encutil R1
  - srd088-encutil R2
  - srd088-encutil R3

preconditions:
  - A git repository with at least one tag matching v[0-9]*.
  - golangci-lint is installed and on PATH.
  - mage is installed and on PATH.
  - configuration.yaml exists at the project root with project.binary_dir set to bin.

test_cases:
  # --- uc001-magefiles: build lifecycle and version ---

  - name: build_produces_version_binary
    description: mage build compiles cmd/version to bin/version.
    inputs:
      command: "mage build"
    expected:
      exit_code: 0
      postcondition: bin/version exists and is executable
    traces:
      - srd011-magefiles R1.1
      - srd059-version R1.1

  - name: version_prints_tag
    description: bin/version prints the latest version tag and exits 0.
    inputs:
      command: "bin/version"
    expected:
      exit_code: 0
      stdout_pattern: "v[0-9]+\\.[0-9]+\\.[0-9]+\n"
      stderr: ""
    traces:
      - srd059-version R1.1
      - srd059-version R1.2
      - srd059-version R1.3

  - name: version_flag_identical
    description: bin/version --version produces the same output as bin/version.
    inputs:
      command: "bin/version --version"
    expected:
      exit_code: 0
      stdout: same as bin/version with no arguments
      stderr: ""
    traces:
      - srd059-version R1.4

  - name: version_v_flag_identical
    description: bin/version -v produces the same output as bin/version.
    inputs:
      command: "bin/version -v"
    expected:
      exit_code: 0
      stdout: same as bin/version with no arguments
      stderr: ""
    traces:
      - srd059-version R1.4

  - name: version_unknown_flag
    description: bin/version --bogus prints usage to stderr and exits 2.
    inputs:
      command: "bin/version --bogus"
    expected:
      exit_code: 2
      stdout: ""
      stderr_contains: "usage"
    traces:
      - srd059-version R1.4

  - name: version_dev_build
    description: A build without ldflags prints "dev".
    inputs:
      command: "go build -o /tmp/version-dev ./cmd/version && /tmp/version-dev"
    expected:
      exit_code: 0
      stdout: "dev\n"
      stderr: ""
    traces:
      - srd059-version R1.2

  - name: lint_passes
    description: mage lint runs golangci-lint with no warnings.
    inputs:
      command: "mage lint"
    expected:
      exit_code: 0
    traces:
      - srd011-magefiles R2.1

  - name: clean_removes_bin
    description: mage clean removes the bin/ directory.
    inputs:
      command: "mage build && mage clean"
    expected:
      exit_code: 0
      postcondition: bin/ does not exist
    traces:
      - srd011-magefiles R3.1

  - name: clean_idempotent
    description: mage clean succeeds when bin/ does not exist.
    inputs:
      command: "mage clean && mage clean"
    expected:
      exit_code: 0
    traces:
      - srd011-magefiles R3.1

  # --- uc002-format: pkg/format output formatting ---

  - name: columns_20_entries_80_width
    description: Columns distributes 20 filenames into a grid fitting 80 columns.
    inputs:
      function: "format.Columns(entries, 80)"
      entries: 20 filenames of varying lengths
    expected:
      postcondition: each row fits within 80 characters; column count is maximized
    traces:
      - srd003-format R1.1
      - srd003-format R1.4

  - name: columns_empty_input
    description: Columns returns nil for empty input.
    inputs:
      function: "format.Columns(nil, 80)"
    expected:
      result: nil
    traces:
      - srd003-format R1.1

  - name: pad_right
    description: PadRight pads a string with trailing spaces to the specified width.
    inputs:
      function: 'format.PadRight("abc", 10)'
    expected:
      result: '"abc       "  (abc + 7 spaces)'
    traces:
      - srd003-format R1.2

  - name: pad_left
    description: PadLeft pads a string with leading spaces to the specified width.
    inputs:
      function: 'format.PadLeft("abc", 10)'
    expected:
      result: '"       abc"  (7 spaces + abc)'
    traces:
      - srd003-format R1.2

  - name: display_width_multibyte
    description: Column width uses rune count, not byte count, for multi-byte strings.
    inputs:
      function: 'format.PadRight("café", 10)'
    expected:
      result: '"café      "  (café is 4 runes, padded to 10)'
    traces:
      - srd003-format R1.3

  - name: file_type_color_all_types
    description: FileTypeColor returns correct ANSI codes for all eight file types.
    inputs:
      function: "format.FileTypeColor(mode) for each file type"
      setup: "format.SetColorEnabled(true)"
    expected:
      directory: '"\033[34m"'
      symlink: '"\033[36m"'
      executable: '"\033[32m"'
      block_device: '"\033[33;1m"'
      char_device: '"\033[33;1m"'
      socket: '"\033[35m"'
      pipe: '"\033[33m"'
      regular: '""'
    traces:
      - srd003-format R2.1
      - srd003-format R2.4

  - name: reset_color_enabled
    description: Reset returns ANSI reset sequence when color is enabled.
    inputs:
      function: "format.Reset()"
      setup: "format.SetColorEnabled(true)"
    expected:
      result: '"\033[0m"'
    traces:
      - srd003-format R2.2

  - name: color_disabled_suppresses_output
    description: SetColorEnabled(false) causes FileTypeColor and Reset to return empty strings.
    inputs:
      function: "format.FileTypeColor(os.ModeDir) and format.Reset()"
      setup: "format.SetColorEnabled(false)"
    expected:
      file_type_color: '""'
      reset: '""'
    traces:
      - srd003-format R2.6

  - name: reset_color_enabled_restores_auto
    description: ResetColorEnabled clears the override and reverts to TTY detection.
    inputs:
      function: "format.ResetColorEnabled() then format.ColorEnabled(pipe)"
      setup: "format.SetColorEnabled(true); format.ResetColorEnabled()"
    expected:
      color_enabled_pipe: false
    traces:
      - srd003-format R2.7

  - name: color_enabled_pipe
    description: ColorEnabled returns false for an os.Pipe writer.
    inputs:
      function: "format.ColorEnabled(pipeWriter)"
    expected:
      result: false
    traces:
      - srd003-format R2.3

  - name: color_enabled_non_file
    description: ColorEnabled returns false for a bytes.Buffer (non-*os.File).
    inputs:
      function: "format.ColorEnabled(&bytes.Buffer{})"
    expected:
      result: false
    traces:
      - srd003-format R2.3

  - name: human_size_binary
    description: HumanSize converts bytes using 1024-based units.
    inputs:
      function: "format.HumanSize(1536, HumanSizeOpts{Binary: true})"
    expected:
      result: '"1.5K"'
    traces:
      - srd003-format R3.1
      - srd003-format R3.2
      - srd003-format R3.3

  - name: human_size_si
    description: HumanSize converts bytes using 1000-based SI units.
    inputs:
      function: "format.HumanSize(1000000, HumanSizeOpts{Binary: false})"
    expected:
      result: '"1.0MB"'
    traces:
      - srd003-format R3.1
      - srd003-format R3.2

  - name: human_size_zero
    description: HumanSize returns "0" for zero bytes.
    inputs:
      function: "format.HumanSize(0, HumanSizeOpts{Binary: true})"
    expected:
      result: '"0"'
    traces:
      - srd003-format R3.4

  # --- uc003-sys: pkg/sys syscall abstractions ---

  - name: terminal_width_pipe
    description: TerminalWidth returns an error when stdout is a pipe.
    inputs:
      function: "sys.TerminalWidth() with stdout redirected to a pipe"
    expected:
      error: non-nil
    traces:
      - srd002-sys R1.1

  - name: is_terminal_pipe_fd
    description: IsTerminal returns false for a pipe file descriptor.
    inputs:
      function: "sys.IsTerminal(pipeFd)"
    expected:
      result: false
    traces:
      - srd002-sys R1.3

  - name: stat_known_file
    description: Stat returns correct extended metadata for a known file.
    inputs:
      function: "sys.Stat(testFile)"
    expected:
      postcondition: Nlink, Uid, Gid, Dev, Ino, Blocks match stat(1) output
    traces:
      - srd002-sys R2.1
      - srd002-sys R2.2

  - name: lstat_symlink
    description: Lstat on a symlink returns symlink type bits, not target's mode.
    inputs:
      function: "sys.Lstat(symlinkPath)"
    expected:
      postcondition: "Mode & os.ModeSymlink != 0"
    traces:
      - srd002-sys R2.1

  - name: stat_modtime_populated
    description: Stat returns a non-zero ModTime from the platform-correct field.
    inputs:
      function: "sys.Stat(testFile)"
    expected:
      postcondition: ModTime is non-zero and close to os.Stat(testFile).ModTime()
    traces:
      - srd002-sys R2.3

  - name: stat_hard_link_count
    description: Stat returns correct Nlink for a file with multiple hard links.
    inputs:
      setup: "create testFile, create hard link to testFile"
      function: "sys.Stat(testFile)"
    expected:
      postcondition: Nlink == 2
    traces:
      - srd002-sys R2.2

  - name: sigpipe_handler_exit_zero
    description: InstallSIGPIPEHandler causes exit 0 on broken pipe.
    inputs:
      function: "sys.InstallSIGPIPEHandler() then write to closed pipe"
    expected:
      exit_code: 0
    traces:
      - srd002-sys R1.5

  - name: on_terminal_resize_callback
    description: OnTerminalResize registers a callback invoked on SIGWINCH.
    inputs:
      function: "sys.OnTerminalResize(callback) then send SIGWINCH"
    expected:
      postcondition: callback was called with a positive width
    traces:
      - srd002-sys R3.1
      - srd002-sys R3.2

  - name: cross_platform_compile
    description: All pkg/sys code compiles on darwin/arm64 and linux/amd64.
    inputs:
      command: "GOOS=darwin GOARCH=arm64 go build ./pkg/sys/ && GOOS=linux GOARCH=amd64 go build ./pkg/sys/"
    expected:
      exit_code: 0
    traces:
      - srd002-sys R1.2

  # --- uc004-testutils: pkg/testutils differential testing harness ---

  - name: difftest_zero_value
    description: DiffTest zero value is a valid test case that runs without error.
    inputs:
      function: "testutils.RunDiffTests(t, echoBin, echoBin, []DiffTest{{Name: \"zero\"}})"
    expected:
      postcondition: test passes with no output
    traces:
      - srd001-testutils R1.1

  - name: rundifftests_matching_output
    description: RunDiffTests passes silently when both binaries produce identical output.
    inputs:
      function: "testutils.RunDiffTests(t, goBin, refBin, tests)"
      setup: "both mock binaries print \"hello\\n\" to stdout and exit 0"
    expected:
      postcondition: test passes with no output to stdout or stderr
    traces:
      - srd001-testutils R2.1
      - srd001-testutils R2.4
      - srd001-testutils R3.2

  - name: rundifftests_divergent_stdout
    description: RunDiffTests reports failure when stdout differs between binaries.
    inputs:
      function: "testutils.RunDiffTests(t, goBin, refBin, tests)"
      setup: "Go binary prints \"hello\\n\", reference prints \"world\\n\""
    expected:
      postcondition: "test fails with message containing args, stdin, both stdouts, both stderrs, and both exit codes"
    traces:
      - srd001-testutils R3.2
      - srd001-testutils R3.5

  - name: rundifftests_divergent_exit_code
    description: RunDiffTests reports failure when exit codes differ.
    inputs:
      function: "testutils.RunDiffTests(t, goBin, refBin, tests)"
      setup: "Go binary exits 0, reference exits 1"
    expected:
      postcondition: test fails with message showing both exit codes
    traces:
      - srd001-testutils R3.4
      - srd001-testutils R3.5

  - name: timestamp_normalizer
    description: TimestampNormalizer strips strftime timestamps so time-dependent outputs match.
    inputs:
      function: "testutils.RunDiffTests with Normalize: []NormalizeFunc{TimestampNormalizer}"
      setup: "binaries produce outputs differing only in timestamp field"
    expected:
      postcondition: test passes after normalization strips timestamps
    traces:
      - srd001-testutils R4.1
      - srd001-testutils R4.2

  - name: compose_normalizers
    description: ComposeNormalizers chains multiple functions applied in order.
    inputs:
      function: "testutils.ComposeNormalizers(fn1, fn2)"
    expected:
      postcondition: "composed function applies fn1 then fn2; output matches fn2(fn1(input))"
    traces:
      - srd001-testutils R4.3
      - srd001-testutils R4.4

  - name: expected_files_match
    description: ExpectedFiles comparison passes when Go binary writes correct file content.
    inputs:
      function: "testutils.RunDiffTests with ExpectedFiles"
      setup: "mock binary writes expected content to output file"
    expected:
      postcondition: test passes with no output
    traces:
      - srd001-testutils R5.1
      - srd001-testutils R5.2

  - name: expected_files_diverge
    description: ExpectedFiles comparison fails when Go binary writes wrong file content.
    inputs:
      function: "testutils.RunDiffTests with ExpectedFiles"
      setup: "mock binary writes different content than expected"
    expected:
      postcondition: test fails with message showing file path, expected content, actual content
    traces:
      - srd001-testutils R5.1
      - srd001-testutils R5.2

  - name: timeout_exceeded
    description: RunDiffTests fails with timeout message when binary exceeds timeout.
    inputs:
      function: "testutils.RunDiffTests with short timeout"
      setup: "mock binary sleeps beyond timeout"
    expected:
      postcondition: test fails with clear timeout message, not a hang
    traces:
      - srd001-testutils R2.3

  - name: env_default_lc_all
    description: RunDiffTests sets LC_ALL=C by default when DiffTest.Env is nil.
    inputs:
      function: "testutils.RunDiffTests with Env: nil"
      setup: "mock binary prints LC_ALL environment variable"
    expected:
      postcondition: "binary receives LC_ALL=C"
    traces:
      - srd001-testutils R2.6

  - name: env_override_lc_all
    description: DiffTest.Env overrides the LC_ALL=C default.
    inputs:
      function: 'testutils.RunDiffTests with Env: []string{"LC_ALL=en_US.UTF-8"}'
      setup: "mock binary prints LC_ALL environment variable"
    expected:
      postcondition: "binary receives LC_ALL=en_US.UTF-8"
    traces:
      - srd001-testutils R1.3
      - srd001-testutils R2.6

  - name: workdir_default_tempdir
    description: WorkDir defaults to t.TempDir() when empty.
    inputs:
      function: "testutils.RunDiffTests with WorkDir: \"\""
      setup: "mock binary prints working directory"
    expected:
      postcondition: both binaries run in a temporary directory
    traces:
      - srd001-testutils R2.5
