srd_to_use_case_mapping:
  - use_case: rel03.0-uc001-wc
    srd: srd005-wc
    why_required: wc exercises multi-file output, column alignment, and locale handling.
    coverage: Full — all srd005-wc requirement groups (R1-R6) are traced from the test suite.
  - use_case: rel01.1-uc001-cat
    srd: srd006-cat
    why_required: cat exercises binary passthrough, non-printing display, and flag combinations.
    coverage: Full — all srd006-cat requirement groups (R1-R5) are traced from the test suite.
  - use_case: rel01.2-uc001-sponge
    srd: srd007-sponge
    why_required: sponge exercises file-state comparison in pkg/testutils and atomic write patterns.
    coverage: Full — all srd007-sponge requirement groups (R1-R6) are traced from the test suite.
  - use_case: rel01.3-uc001-du
    srd: srd009-du
    why_required: du exercises hard-link deduplication and recursive block accumulation.
    coverage: Full — all srd009-du requirement groups (R1-R5) are traced from the test suite.
