prd_to_use_case_mapping:
  - use_case: rel01.0-uc001-ts
    prd: prd004-ts
    why_required: ts is the first utility in the pipeline; exercises prd001-testutils and prd004-ts.
    coverage: Full — all prd004-ts requirement groups (R1-R9) are traced from the test suite.
  - use_case: rel01.1-uc001-wc
    prd: prd005-wc
    why_required: wc exercises multi-file output, column alignment, and locale handling.
    coverage: Full — all prd005-wc requirement groups (R1-R6) are traced from the test suite.
  - use_case: rel01.1-uc002-cat
    prd: prd006-cat
    why_required: cat exercises binary passthrough, non-printing display, and flag combinations.
    coverage: Full — all prd006-cat requirement groups (R1-R5) are traced from the test suite.
  - use_case: rel01.1-uc003-sponge
    prd: prd007-sponge
    why_required: sponge exercises file-state comparison in pkg/testutils and atomic write patterns.
    coverage: Full — all prd007-sponge requirement groups (R1-R6) are traced from the test suite.
  - use_case: rel02.0-uc001-ls
    prd: prd008-ls
    why_required: ls core exercises pkg/sys and pkg/format for the first time in the pipeline.
    coverage: Full — all prd008-ls requirement groups (R1-R7) are traced from the test suite.
  - use_case: rel02.0-uc002-du
    prd: prd009-du
    why_required: du exercises hard-link deduplication and recursive block accumulation.
    coverage: Full — all prd009-du requirement groups (R1-R5) are traced from the test suite.
  - use_case: rel02.1-uc001-ls-extended
    prd: prd010-ls-extended
    why_required: ls extended exercises sort modes, metadata display, classification, and recursive listing.
    coverage: Full — all prd010-ls-extended requirement groups (R1-R6) are traced from the test suite.

coverage_gaps: |
  Shared library PRDs (prd001-testutils, prd002-sys, prd003-format) do not have dedicated use
  cases or test suites. They are exercised indirectly through the utility use cases that depend
  on them. This is by design: shared libraries are validated through their consumers, not
  independently.

  No coverage gaps exist in the current roadmap. Every use case has a test suite, every PRD is
  referenced by at least one use case touchpoint, and every release has a corresponding test
  suite.

