prd_index:
  - id: prd001-testutils
    title: "pkg/testutils: Differential Testing Harness"
    summary: Shared harness for executing Go and reference binaries side by side and comparing outputs.
    path: docs/specs/product-requirements/prd001-testutils.yaml
  - id: prd002-sys
    title: "pkg/sys: Syscall Abstractions"
    summary: Portable terminal-width, extended file metadata, and signal handling for Darwin and Linux.
    path: docs/specs/product-requirements/prd002-sys.yaml
  - id: prd003-format
    title: "pkg/format: Output Formatting"
    summary: Column alignment, ANSI color, and human-readable size conversion shared across utilities.
    path: docs/specs/product-requirements/prd003-format.yaml
  - id: prd004-ts
    title: "cmd/ts: Timestamp Stdin Lines"
    summary: Prepend strftime timestamps to each stdin line with incremental, elapsed, monotonic, and relative modes.
    path: docs/specs/product-requirements/prd004-ts.yaml
  - id: prd005-wc
    title: "cmd/wc: Count Lines, Words, and Bytes"
    summary: Count lines, words, bytes, characters, and max line length from files or stdin.
    path: docs/specs/product-requirements/prd005-wc.yaml
  - id: prd006-cat
    title: "cmd/cat: Concatenate and Display Files"
    summary: Concatenate files to stdout with line numbering, blank squeezing, and non-printing display.
    path: docs/specs/product-requirements/prd006-cat.yaml
  - id: prd007-sponge
    title: "cmd/sponge: Soak Stdin and Write to File"
    summary: Buffer all stdin before opening the output file, enabling safe in-place pipeline rewrites.
    path: docs/specs/product-requirements/prd007-sponge.yaml
  - id: prd008-ls
    title: "cmd/ls: Core File Listing"
    summary: List directory contents with multi-column, single-column, and long format plus filter and color flags.
    path: docs/specs/product-requirements/prd008-ls.yaml
  - id: prd009-du
    title: "cmd/du: Recursive Directory Disk Usage"
    summary: Report disk usage with recursive traversal, hard-link deduplication, and human-readable output.
    path: docs/specs/product-requirements/prd009-du.yaml
  - id: prd010-ls-extended
    title: "cmd/ls: Extended Flags"
    summary: Multi-column layout control, sort order, metadata display, classification, and recursive listing.
    path: docs/specs/product-requirements/prd010-ls-extended.yaml

  - id: prd012-yes
    title: "cmd/yes: Repeatedly Output a String"
    summary: Output a string repeatedly until killed, with buffered writes for throughput.
    path: docs/specs/product-requirements/prd012-yes.yaml
  - id: prd013-true
    title: "cmd/true: Exit Successfully"
    summary: Exit with status 0, ignoring all arguments.
    path: docs/specs/product-requirements/prd013-true.yaml
  - id: prd014-false
    title: "cmd/false: Exit Unsuccessfully"
    summary: Exit with status 1, ignoring all arguments.
    path: docs/specs/product-requirements/prd014-false.yaml
  - id: prd015-basename
    title: "cmd/basename: Strip Directory and Suffix from Filenames"
    summary: Strip directory prefix and optional suffix from file paths with multi-argument and NUL-delimited modes.
    path: docs/specs/product-requirements/prd015-basename.yaml
  - id: prd016-dirname
    title: "cmd/dirname: Strip Last Component from File Paths"
    summary: Extract directory component from file paths with NUL-delimited output mode.
    path: docs/specs/product-requirements/prd016-dirname.yaml
  - id: prd017-tee
    title: "cmd/tee: Read Stdin and Write to Stdout and Files"
    summary: Copy stdin to stdout and one or more files with append mode and SIGINT suppression.
    path: docs/specs/product-requirements/prd017-tee.yaml
  - id: prd018-head
    title: "cmd/head: Print the First Lines or Bytes of Files"
    summary: Print first N lines or bytes with negative counts, multi-file headers, and quiet/verbose modes.
    path: docs/specs/product-requirements/prd018-head.yaml
  - id: prd034-mkdir
    title: "cmd/mkdir: Create Directories"
    summary: Create directories with optional parent creation and permission mode setting.
    path: docs/specs/product-requirements/prd034-mkdir.yaml
  - id: prd035-rmdir
    title: "cmd/rmdir: Remove Empty Directories"
    summary: Remove empty directories with optional ancestor removal and error suppression.
    path: docs/specs/product-requirements/prd035-rmdir.yaml
  - id: prd036-mktemp
    title: "cmd/mktemp: Create Temporary Files or Directories"
    summary: Create temporary files or directories with unique names, configurable templates and locations.
    path: docs/specs/product-requirements/prd036-mktemp.yaml
  - id: prd037-ln
    title: "cmd/ln: Create Links Between Files"
    summary: Create hard or symbolic links with force, no-dereference, and verbose modes.
    path: docs/specs/product-requirements/prd037-ln.yaml
  - id: prd038-unlink
    title: "cmd/unlink: Remove a Single File"
    summary: Call unlink(2) to remove exactly one file, rejecting directories and wrong argument counts.
    path: docs/specs/product-requirements/prd038-unlink.yaml
  - id: prd039-env
    title: "cmd/env: Run a Command in a Modified Environment"
    summary: Print or modify environment variables and run commands with variable overrides.
    path: docs/specs/product-requirements/prd039-env.yaml
  - id: prd040-printenv
    title: "cmd/printenv: Print Environment Variables"
    summary: Print all or selected environment variables with optional NUL-delimited output.
    path: docs/specs/product-requirements/prd040-printenv.yaml
  - id: prd041-id
    title: "cmd/id: Print User and Group Information"
    summary: Print real and effective user and group IDs with selection and name-display flags.
    path: docs/specs/product-requirements/prd041-id.yaml
  - id: prd042-whoami
    title: "cmd/whoami: Print Effective User Name"
    summary: Print the effective username and exit.
    path: docs/specs/product-requirements/prd042-whoami.yaml
  - id: prd043-groups
    title: "cmd/groups: Print Group Memberships"
    summary: Print group memberships for the current or named users.
    path: docs/specs/product-requirements/prd043-groups.yaml

