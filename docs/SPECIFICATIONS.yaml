prd_index:
  - id: prd001-testutils
    title: "pkg/testutils: Differential Testing Harness"
    summary: Shared harness for executing Go and reference binaries side by side and comparing outputs.
    path: docs/specs/product-requirements/prd001-testutils.yaml
  - id: prd002-sys
    title: "pkg/sys: Syscall Abstractions"
    summary: Portable terminal-width, extended file metadata, and signal handling for Darwin and Linux.
    path: docs/specs/product-requirements/prd002-sys.yaml
  - id: prd003-format
    title: "pkg/format: Output Formatting"
    summary: Column alignment, ANSI color, and human-readable size conversion shared across utilities.
    path: docs/specs/product-requirements/prd003-format.yaml
  - id: prd004-ts
    title: "cmd/ts: Timestamp Stdin Lines"
    summary: Prepend strftime timestamps to each stdin line with incremental, elapsed, monotonic, and relative modes.
    path: docs/specs/product-requirements/prd004-ts.yaml
  - id: prd005-wc
    title: "cmd/wc: Count Lines, Words, and Bytes"
    summary: Count lines, words, bytes, characters, and max line length from files or stdin.
    path: docs/specs/product-requirements/prd005-wc.yaml
  - id: prd006-cat
    title: "cmd/cat: Concatenate and Display Files"
    summary: Concatenate files to stdout with line numbering, blank squeezing, and non-printing display.
    path: docs/specs/product-requirements/prd006-cat.yaml
  - id: prd007-sponge
    title: "cmd/sponge: Soak Stdin and Write to File"
    summary: Buffer all stdin before opening the output file, enabling safe in-place pipeline rewrites.
    path: docs/specs/product-requirements/prd007-sponge.yaml
  - id: prd008-ls
    title: "cmd/ls: Core File Listing"
    summary: List directory contents with multi-column, single-column, and long format plus filter and color flags.
    path: docs/specs/product-requirements/prd008-ls.yaml
  - id: prd009-du
    title: "cmd/du: Recursive Directory Disk Usage"
    summary: Report disk usage with recursive traversal, hard-link deduplication, and human-readable output.
    path: docs/specs/product-requirements/prd009-du.yaml
  - id: prd010-ls-extended
    title: "cmd/ls: Extended Flags"
    summary: Multi-column layout control, sort order, metadata display, classification, and recursive listing.
    path: docs/specs/product-requirements/prd010-ls-extended.yaml

