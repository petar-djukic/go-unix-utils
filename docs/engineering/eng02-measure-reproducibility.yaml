id: eng02-measure-reproducibility
title: "Measure Step Reproducibility Analysis"

introduction: |
  The cobbler measure step proposes implementation tasks by sending project context to a
  Claude agent. We ran two identical measure cycles back-to-back on 2026-02-24 to evaluate
  whether the step produces reproducible output. After implementing the single-turn fix
  (cobbler-scaffold#12), we re-ran the experiment to measure the improvement. This guideline
  records both the original findings and the before/after comparison.

sections:
  - title: "Experiment design"
    content: |
      We executed two generation cycles on the same codebase state with no spec or code
      changes between them. Each cycle ran mage generator:start, mage cobbler:measure, and
      mage generator:stop. The configuration used temperature 0, a 5-minute timeout, and
      the Claude Opus 4.6 model via the Claude Code CLI in a Podman container.

      Run A timestamp: 2026-02-24-21-51-50. Run B timestamp: 2026-02-24-21-54-24. Both
      ran against the same main branch commit with 10 PRDs, 7 use cases, 4 test suites,
      and 0 lines of Go code.

  - title: "Prompt reproducibility"
    content: |
      The measure prompts are functionally identical across runs. The orchestrator assembles
      the prompt deterministically from project files resolved by glob patterns (9 patterns
      yielding 27 files in both runs). The only difference is 3 lines containing the
      timestamp-based output filename (.cobbler/measure-YYYYMMDD-HHMMSS.yaml). The
      remaining 4,200+ lines are byte-for-byte identical.

      The prompt is reproducible. The output filename is the sole source of prompt variance.

  - title: "Issue reproducibility"
    content: |
      Both runs proposed exactly 1 issue targeting the same component (pkg/testutils) and
      the same PRD requirements (prd001 R1-R5). The issues are semantically equivalent but
      not textually identical.

      | Dimension              | Run A                        | Run B                        |
      |------------------------|------------------------------|------------------------------|
      | Title                  | ...DiffTest struct and RunDiffTests harness... | ...DiffTest harness...  |
      | Files to create        | difftest.go, normalize.go, difftest_test.go | difftest.go, normalizers.go, difftest_test.go |
      | Requirement count      | 6 (R1-R6)                    | 5 (R1-R5)                    |
      | Acceptance criteria    | 6 (AC1-AC6)                  | 7 (AC1-AC7)                  |
      | Design decisions       | 4 (D1-D4)                    | 4 (D1-D4)                    |
      | Output size            | 6,200 bytes                  | 7,999 bytes                  |
      | YAML style             | Inline strings               | Multi-line blocks             |

      Run A splits file-state comparison into a separate R6; Run B folds it into R5. Run B
      adds an explicit AC7 for test coverage. Run B names the normalizer file normalizers.go
      (plural); Run A uses normalize.go (singular). Run B explicitly includes ISO-8601
      datetime normalization; Run A omits it.

      The differences are in wording, formatting, granularity, and minor naming choices. Both
      issues would produce equivalent implementations.

  - title: "Token and cost variance"
    content: |
      | Metric            | Run A      | Run B      | Delta  |
      |-------------------|------------|------------|--------|
      | Duration          | 1m54s      | 3m8s       | +65%   |
      | Input tokens      | 180,777    | 184,453    | +2%    |
      | Output tokens     | 6,319      | 10,505     | +66%   |
      | Cost              | $0.696     | $0.824     | +18%   |
      | Thinking chars    | 6,957      | 14,252     | +105%  |
      | Cache read        | 102,929    | 102,785    | ~same  |
      | Cache creation    | 77,845     | 81,665     | +5%    |

  - title: "Turn structure"
    content: |
      Both runs have identical turn structure: system init, assistant (thinking + text +
      tool_use Write), rate_limit, user (tool_result), assistant (summary text), result.
      Two API turns total. The model made no file reads or searches in either run; the only
      tool call was the Write to save the issue YAML.

      The difference is entirely in the thinking block. Run A produced 6,957 characters of
      internal reasoning; Run B produced 14,252 characters. The model reached the same
      conclusion via a longer reasoning path in Run B.

  - title: "Sources of variance"
    content: |
      Source 1 — Thinking token non-determinism. At temperature 0 the model uses greedy
      decoding (always pick the highest-probability token), but the probabilities are
      computed with floating-point arithmetic that varies across GPU runs. Small differences
      in early tokens compound through the reasoning chain, producing thinking blocks that
      differ in length by 2x.

      Source 2 — Multi-turn accumulation. Turn 1's thinking tokens become part of the input
      context for turn 2 (after the Write tool result). A longer thinking block in turn 1
      inflates the input token count for turn 2. The 3,676-token input difference between
      runs closely tracks the 4,186-token output difference from accumulated conversation
      context.

      Source 3 — Output filename in prompt. The timestamp-based output filename
      (.cobbler/measure-YYYYMMDD-HHMMSS.yaml) differs between runs. This is cosmetic but
      prevents byte-for-byte prompt identity.

  - title: "Recommendations (original)"
    content: |
      Recommendation 1 — Single-turn measure (cobbler-scaffold#12). IMPLEMENTED. Redesign the
      measure step so the model returns issue YAML as text output instead of using the Write
      tool. The orchestrator captures the YAML and writes the file itself. This eliminates the
      second API turn, removes multi-turn token accumulation, and makes input token counts
      identical across runs.

      Recommendation 2 — Normalize the output filename. IMPLEMENTED. The orchestrator no longer
      includes a timestamp-based output filename in the prompt. Prompts are now byte-for-byte
      identical across runs.

      Recommendation 3 — Report thinking tokens separately. OPEN. The orchestrator log contains
      the full stream-json output but the stats file does not yet separate thinking tokens from
      output tokens.

      Recommendation 4 — Accept semantic equivalence. CONFIRMED. Six runs across two experiments
      all produce semantically equivalent issues with textual variance. This remains the
      practical standard.

  - title: "Single-turn experiment (GH-8)"
    content: |
      After implementing cobbler-scaffold#12 (single-turn measure) and the output filename
      normalization, we ran two more back-to-back measure cycles on the same codebase state.

      Run E timestamp: 2026-02-24-23-22-31. Run F timestamp: 2026-02-24-23-25-30. Both ran
      against the same main branch with 10 PRDs, 7 use cases, 4 test suites, and 0 lines of
      Go code. The orchestrator now passes --max-turns 1 to the Claude CLI.

  - title: "Single-turn results"
    content: |
      | Metric            | Run E      | Run F      | Delta   |
      |-------------------|------------|------------|---------|
      | Duration          | 2m37s      | 2m44s      | +4%     |
      | Input tokens      | 87,379     | 87,379     | 0%      |
      | Output tokens     | 8,862      | 8,948      | +1%     |
      | Cost              | $0.678     | $0.680     | +0.3%   |
      | Cache creation    | 71,783     | 71,783     | 0%      |
      | Cache read        | 15,594     | 15,594     | 0%      |
      | API turns         | 2          | 2          | same    |
      | Issue count       | 1          | 1          | same    |

      Input tokens are now identical (87,379 both runs). Cache creation and cache read are
      also identical. The prompt diff is zero lines. Output tokens differ by 1% (8,862 vs
      8,948), which is the residual variance from thinking token non-determinism.

  - title: "Before/after comparison"
    content: |
      | Metric            | Multi-turn (A/B avg) | Single-turn (E/F avg) | Improvement      |
      |-------------------|----------------------|-----------------------|------------------|
      | API turns         | 4                    | 2                     | -50%             |
      | Input tokens      | 182,615 (varies)     | 87,379 (identical)    | -52%, no variance|
      | Output tokens     | 8,412                | 8,905                 | +6% (noise)      |
      | Cost              | $0.760               | $0.679                | -11%             |
      | Input variance    | 2% (3,676 tokens)    | 0%                    | eliminated       |
      | Prompt diff       | 3 lines              | 0 lines               | eliminated       |

      The single-turn fix achieved its three goals: (1) input token counts are now identical
      across runs, eliminating the multi-turn accumulation variance; (2) prompts are byte-for-
      byte identical, eliminating the output filename variance; (3) cost is reduced by 11%.

      Input tokens dropped from ~183K to ~87K because the single-turn model does not receive
      its own prior output as context for a second turn. The ~96K token reduction corresponds
      to the removed second turn's input context (system prompt + first turn's output).

      The remaining variance is output tokens (1% spread) caused by thinking token non-
      determinism. This is irreducible with current LLM infrastructure at temperature 0 and
      represents the theoretical floor for measure reproducibility.

  - title: "Issue comparison across six runs"
    content: |
      | Dimension       | Run A  | Run B  | Run C  | Run D  | Run E  | Run F  |
      |-----------------|--------|--------|--------|--------|--------|--------|
      | Mode            | multi  | multi  | multi  | multi  | single | single |
      | Target          | testutils | testutils | testutils | testutils | testutils | testutils |
      | PRD reference   | prd001 | prd001 | prd001 | prd001 | prd001 | prd001 |
      | Requirements    | 6      | 5      | 6      | 4      | 5      | 6      |
      | ACs             | 6      | 7      | 6      | 6      | 6      | 7      |
      | Issue size (B)  | 6,200  | 7,999  | 7,210  | 5,636  | 6,513  | 6,093  |
      | Normalizer file | normalize | normalizers | normalizers | normalizers | normalizers | normalize |

      All six runs target the same component and PRD. Requirement count ranges from 4 to 6;
      AC count ranges from 6 to 7. The normalizer filename alternates between singular and
      plural. These patterns are consistent between multi-turn and single-turn modes,
      confirming that the single-turn change does not affect output quality — only cost and
      reproducibility of the input context.

  - title: "Updated recommendations"
    content: |
      Recommendation 1 — DONE. Single-turn measure eliminates multi-turn accumulation.

      Recommendation 2 — DONE. Output filename normalization eliminates prompt variance.

      Recommendation 3 — OPEN. Separate thinking tokens in stats for finer cost analysis.

      Recommendation 4 — CONFIRMED. Semantic equivalence is the standard. Six runs confirm
      that textual variance (requirement count, naming, formatting) does not affect the
      quality of the proposed implementation task.

