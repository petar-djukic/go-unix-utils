id: eng13-stress-test-decomposition
title: "Stress Test: SRD Requirement Decomposition Against Stitch Budget"

introduction: |
  We analyze every SRD (rel00.0 through rel02.0 and deferred rel99.0/99.1) to validate
  whether current requirements can be decomposed into tasks that fit within the stitch
  agent's 15-minute execution budget. For each SRD we apply the eng11 subsystem boundary
  rule, estimate LOC, identify infrastructure dependencies, and flag tasks at risk of
  failure. We then compare our proposed decompositions against actual measure proposals
  from eng12 (run 6) and recommend concrete SRD changes where sizing violations exist.

  The analysis confirms that no SRD has structural sizing violations after the GH-31
  atomicity and GH-37/GH-38 infrastructure revisions. Every requirement group decomposes
  into single-subsystem tasks within the 400-500 LOC budget. The dominant failure mode
  in eng12 was not task oversizing but infrastructure unavailability: the stitch agent
  spent 8-11 minutes rebuilding pkg/testutils and pkg/sys from scratch because they did
  not exist on the generation branch. Three SRD requirements contain unnecessary inline
  instructions that duplicate pkg/format functionality and should be changed.

sections:
  - title: "Methodology"
    content: |
      For each SRD we identify:

      1. Subsystem boundaries per eng11: any point where a new external API call, new data
         source, or new output mode is introduced.
      2. Proposed task decomposition: group requirements that share the same subsystem into
         one task; separate requirements that cross different subsystem boundaries into
         separate tasks.
      3. LOC estimate: based on actuals from eng04/eng10/eng12 where available, or structural
         analysis of requirement complexity for untested SRDs.
      4. Infrastructure dependencies: which pkg/ packages must exist before the task can
         compile.
      5. Risk flag: LOW (single subsystem, proven or straightforward), MEDIUM (single
         subsystem but complex, or borderline LOC), HIGH (multiple subsystems or infrastructure
         dependency without pre-commit).

      A task is flagged HIGH risk when any of these conditions apply (per eng10/eng11/eng12
      patterns):
      - Multiple subsystem boundaries (the only confirmed failure pattern)
      - Infrastructure rebuild cost > 5 minutes estimated
      - Total estimated LOC > 500 in a single task
      - Dependencies on packages not yet generated in the release sequence

  - title: "rel00.0 — Foundational infrastructure"
    content: |
      Table 1: rel00.0 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd001 | pkg/testutils: DiffTest harness | R1-R5 | 1 (test harness) | 300-425 | none | LOW | 250 LOC (eng04) |
      | prd002 | pkg/sys: syscall abstractions | R1-R4 | 1 (golang.org/x/sys/unix) | 190-290 | golang.org/x/sys/unix | LOW | ~284 LOC (eng04) |
      | prd003 | pkg/format: output formatting | R1-R3 | 1 (formatting + pkg/sys.IsTerminal) | 170-260 | pkg/sys | LOW | ~311 LOC (eng04) |

      All three infrastructure packages are single-subsystem tasks that have been generated
      successfully in eng04. pkg/format depends on pkg/sys (for ColorEnabled calling IsTerminal),
      so pkg/sys must be generated or pre-committed first.

      Magefiles (rel00.0-uc001) is build infrastructure written by the human operator, not
      generated by the stitch agent. It is excluded from this analysis.

      Generation strategy: pre-commit all three packages at mage generator:start. This
      eliminates the infrastructure rebuild cost that caused task 21v to fail in eng12.
      The eng12 recommendation #2 already calls for this.

  - title: "rel01.0 — ts"
    content: |
      Table 2: rel01.0 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd004 | cmd/ts: all modes | R1-R9 | 1 (strftime/time) | 340-510 | pkg/testutils | LOW | 546 LOC (eng04) |

      Despite having 9 requirement groups, cmd/ts is a single-subsystem task. All modes
      (default, -i, -s, -m, -r) operate on the same time-formatting pipeline. This was
      confirmed in eng04 where cmd/ts succeeded with 546 LOC on the first stitch attempt.

      The only infrastructure dependency is pkg/testutils for differential testing. With
      pre-committed infrastructure, this task has no risk.

  - title: "rel01.1 — wc, cat, sponge"
    content: |
      Table 3: rel01.1 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd005 | cmd/wc: multi-mode counter | R1-R6 | 1 (bufio + unicode) | 340-520 | pkg/testutils | LOW | 629 (eng04), 340 (eng12) |
      | prd006 | cmd/cat: streaming display | R1-R5 | 1 (format flags) | pkg/testutils | LOW | 357 LOC (eng04) |
      | prd007 | cmd/sponge: atomic file write | R1-R6 | 1 (temp + rename) | 340-520 | pkg/testutils | LOW | 300 LOC (eng12) |

      All three utilities are single-subsystem tasks with proven success across multiple
      generation runs. cmd/wc at 629 LOC (eng04) is the highest observed LOC for a
      successful single-subsystem task, confirming that requirement count (6 groups) is
      not the bottleneck — subsystem count is.

  - title: "rel02.0 — du"
    content: |
      Table 4: rel02.0 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd009 | cmd/du: recursive traversal | R1-R5 | 1 (filepath.Walk) | 350-500 | pkg/testutils, pkg/sys | LOW | 406 LOC (eng10) |

      cmd/du is a single-subsystem task: all requirements operate on filepath.Walk with
      block accumulation. Hard-link deduplication (R3) uses pkg/sys.Lstat for inode/device
      tracking but this is the same stat API used for size reporting — not a new subsystem.

      Infrastructure dependency: pkg/sys must exist for Stat/Lstat and InstallSIGPIPEHandler.
      With pre-committed infrastructure, risk is LOW.

      Note on inline instruction: srd009-du R2.1 says "using algorithm inlined in cmd/du
      (not pkg/format.HumanSize)". See "Recommended SRD changes" section for analysis.

  - title: "rel99.0 — ls core"
    content: |
      Table 5: rel99.0 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd008 | ls-core-A: default + filters + exit + signals | R1, R3, R6, R7 | 1 (os.ReadDir + sort) | 150-250 | pkg/testutils, pkg/sys, pkg/format | LOW | 316 LOC (eng10, task 4k3) |
      | prd008 | ls-core-B: long format | R2 | 1 (os.Lstat + stat fields) | pkg/sys | MEDIUM | untested |
      | prd008 | ls-core-C: color | R4 | 1 (ANSI escapes) | none (inlined) | LOW | untested |
      | prd008 | ls-core-D: human sizes | R5 | 0 (minor addition to -l) | none (inlined) | LOW | untested |

      srd008-ls is the first SRD that requires multi-task decomposition. The eng10 failure
      (task 5el) confirmed that bundling R2+R4+R5 as a single task crosses three subsystem
      boundaries and exceeds the stitch budget. The eng11 Rule 4 decomposition applies:
      each output mode is its own task.

      Task ls-core-A (R1+R3+R6+R7) was proven in eng10 as task 4k3 at 316 LOC. All four
      requirement groups share the os.ReadDir subsystem — filter flags are variations on
      the listing pipeline, exit codes and signals are boilerplate.

      Task ls-core-B (R2) is MEDIUM risk because long format (-l) involves several
      sub-concerns: permission string generation (10-char algorithm), user/group name
      resolution (os/user.LookupId with numeric fallback), mtime formatting (recency-based
      format switching), symlink display, and block count total line. These all operate on
      the os.Lstat result, so they share one subsystem boundary, but the LOC estimate
      (200-350) approaches the upper range.

      Tasks ls-core-C (R4) and ls-core-D (R5) are currently specified as inline
      implementations. See "Recommended SRD changes" for analysis.

  - title: "rel99.1 — ls extended"
    content: |
      Table 6: rel99.1 task decomposition

      | SRD | Task | Requirements | Subsystems | LOC est. | Infra deps | Risk | Actual |
      |-----|------|-------------|-----------|---------|-----------|------|--------|
      | prd010 | ls-ext-A: multi-column layout + flag interactions | R1, R6 | 0 (existing pkg/format.Columns) | 140-220 | pkg/format | LOW | untested |
      | prd010 | ls-ext-B: sort implementations | R2 | 1 (strverscmp) | none | MEDIUM | untested |
      | prd010 | ls-ext-C: metadata display + classification | R3, R4 | 1 (inode/blocks display) | 120-190 | pkg/sys | LOW | eng12: 21v failed (infra) |
      | prd010 | ls-ext-D: recursive listing | R5 | 1 (recursive descent) | none | MEDIUM | untested |

      The GH-31 atomicity improvements already structured srd010-ls-extended so that
      requirements map cleanly to subsystem boundaries. The eng12 measure agent correctly
      proposed R3+R4 as a scoped task (21v), validating the SRD structure.

      Task 21v failed in eng12 not because of sizing but because pkg/testutils and pkg/sys
      did not exist on the generation branch. The stitch agent spent 8-11 minutes per
      attempt rebuilding infrastructure, leaving insufficient time for cmd/ls code. With
      pre-committed infrastructure, this task should succeed.

      Task ls-ext-B (R2, sort implementations) is MEDIUM risk because strverscmp (natural
      version sort, -v flag) requires implementing a non-trivial string comparison algorithm
      from scratch. However, it is a single subsystem (sort.Interface variations) and the
      estimated LOC (150-220) is well within budget.

      Task ls-ext-D (R5, recursive listing) is MEDIUM risk because -R requires recursive
      directory descent with per-directory headers, format inheritance, and filter flag
      propagation. The estimated LOC (120-180) is moderate, but the logic complexity is
      higher than a simple flag addition.

  - title: "Summary decomposition table"
    content: |
      Table 7: All proposed tasks across all releases

      | # | Release | Task | Reqs | Subsystems | LOC est. | Risk | Proven |
      |---|---------|------|------|-----------|---------|------|--------|
      | 1 | rel00.0 | pkg/testutils | R1-R5 | 1 | 300-425 | LOW | yes (eng04) |
      | 2 | rel00.0 | pkg/sys | R1-R4 | 1 | 190-290 | LOW | yes (eng04) |
      | 3 | rel00.0 | pkg/format | R1-R3 | 1 | 170-260 | LOW | yes (eng04) |
      | 4 | rel01.0 | cmd/ts | R1-R9 | 1 | 340-510 | LOW | yes (eng04) |
      | 5 | rel01.1 | cmd/wc | R1-R6 | 1 | 340-520 | LOW | yes (eng04, eng12) |
      | 6 | rel01.1 | cmd/cat | R1-R5 | 1 | 360-580 | LOW | yes (eng04) |
      | 7 | rel01.1 | cmd/sponge | R1-R6 | 1 | 340-520 | LOW | yes (eng12) |
      | 8 | rel02.0 | cmd/du | R1-R5 | 1 | 350-500 | LOW | yes (eng10) |
      | 9 | rel99.0 | ls-core-A: default+filters | R1,R3,R6,R7 | 1 | 150-250 | LOW | yes (eng10) |
      | 10 | rel99.0 | ls-core-B: long format | R2 | 1 | 200-350 | MEDIUM | no |
      | 11 | rel99.0 | ls-core-C: color | R4 | 1 | 80-120 | LOW | no |
      | 12 | rel99.0 | ls-core-D: human sizes | R5 | 0 | 40-60 | LOW | no |
      | 13 | rel99.1 | ls-ext-A: multi-column | R1,R6 | 0 | 140-220 | LOW | no |
      | 14 | rel99.1 | ls-ext-B: sort modes | R2 | 1 | 150-220 | MEDIUM | no |
      | 15 | rel99.1 | ls-ext-C: metadata+classify | R3,R4 | 1 | 120-190 | LOW | no |
      | 16 | rel99.1 | ls-ext-D: recursive | R5 | 1 | 120-180 | MEDIUM | no |

      Total: 16 implementation tasks. 8 proven in previous runs, 8 untested. 3 MEDIUM risk
      (ls long format, ls sort modes, ls recursive). No HIGH risk tasks. No multi-subsystem
      tasks.

      Separate test tasks (per eng11 Rule 3) add approximately 8-10 more tasks for the
      cmd/ utilities. Test tasks follow a fixed pattern (DiffTest slice + RunDiffTests)
      and are consistently LOW risk.

  - title: "Comparison with eng12 actual measure proposals"
    content: |
      Table 8: eng12 measure proposals vs. stress test decomposition

      | eng12 task | eng12 scope | Outcome | This analysis scope | Match |
      |-----------|------------|---------|-------------------|-------|
      | 13w | cmd/wc R1-R6 | success | Task #5: cmd/wc R1-R6 | exact match |
      | zep | cmd/sponge R1-R5 | success | Task #7: cmd/sponge R1-R6 | match (R6 = testing, handled separately) |
      | 21v | cmd/ls -i,-s,-n,-F (R3,R4) | failed ×5 | Task #15: ls-ext-C R3+R4 | exact match |

      The measure agent's scoping in eng12 was correct for all three tasks. The GH-31
      atomicity improvements successfully guided measure to propose single-subsystem tasks.
      Task 21v's failure was not a sizing problem.

      Observations on what measure did NOT propose in eng12:
      - rel00.0 infrastructure (pkg/testutils, pkg/sys, pkg/format): not proposed. The
        measure agent does not recognize infrastructure packages as "unimplemented" and
        skips them. This is why pre-committing infrastructure at generator:start is the
        correct mitigation.
      - cmd/ts (rel01.0): not proposed. Reason unclear — possibly deprioritized by the
        measure agent in favor of rel01.1 tasks.
      - cmd/cat (rel01.1): not proposed. The measure agent chose wc and sponge from
        rel01.1 (max 3 tasks per cycle).
      - cmd/du (rel02.0): not proposed. Likely deferred because rel01.0 and rel01.1
        tasks were available.
      - cmd/ls core (rel99.0): not proposed. Correctly deferred — ls was moved to rel99.x.
      - cmd/ls extended R1,R2,R5,R6 (rel99.1): not proposed. Only R3+R4 selected.

      The measure agent's release ordering was imperfect: it proposed rel99.1 work (21v)
      before completing rel01.0 (ts) or rel02.0 (du). This ordering issue does not affect
      task sizing but could cause dependency violations if ls-extended tasks are attempted
      before ls-core exists.

  - title: "Infrastructure dependency analysis"
    content: |
      Table 9: Infrastructure dependency chain

      | Package | Required by | Must exist before |
      |---------|------------|------------------|
      | pkg/testutils | all cmd/ tasks | any cmd/ stitch task |
      | pkg/sys | cmd/du, cmd/ls, pkg/format | cmd/du, cmd/ls, pkg/format tasks |
      | pkg/format | cmd/ls (Columns) | cmd/ls core task A (R1) |
      | cmd/ls core | cmd/ls extended tasks | any ls-extended task |

      The eng12 failure analysis (task 21v) demonstrated that infrastructure unavailability
      is the dominant failure mode, not task oversizing. The stitch agent spent 8-11 minutes
      per attempt rebuilding pkg/testutils and pkg/sys from scratch before reaching cmd/ls
      code.

      With infrastructure pre-committed at generator:start, the dependency chain becomes:
      1. Infrastructure exists (pre-committed): pkg/testutils, pkg/sys, pkg/format
      2. Simple utilities generated (any order within release): ts, wc, cat, sponge, du
      3. ls core generated (4 sequential tasks): A → B → C → D
      4. ls extended generated (4 tasks, A depends on ls core; B/C/D independent of each other)

      The generation sequence matters for ls: core tasks must complete before extended tasks
      start. The measure agent should use a releases filter or the pipeline should enforce
      ordering: run rel00.0-rel02.0 first, then rel99.0, then rel99.1.

  - title: "Recommended SRD changes"
    content: |
      Three SRD requirements contain inline implementation instructions that duplicate
      functionality already provided by pkg/format. These inline instructions were written
      as defensive measures to avoid subsystem boundary crossings, but they are unnecessary
      when infrastructure is pre-committed and the tasks are properly decomposed.

      Change 1: srd008-ls R4.3 — remove inline color table

      Current: "Colorized output: inline color table in cmd/ls (do NOT call
      pkg/format.FileTypeColor)"

      Recommended: "Colorized output: call pkg/format.FileTypeColor(mode) for file-type
      ANSI escapes and pkg/format.Reset() for the reset sequence. Set the process-global
      color mode via pkg/format.SetColorEnabled(bool) based on the --color flag value
      (always/auto/never). For --color=auto, call pkg/sys.IsTerminal(os.Stdout.Fd())."

      Rationale: When task ls-core-C (R4) executes, pkg/format already exists on the
      generation branch (pre-committed in rel00.0). Calling pkg/format.FileTypeColor does
      not cross a new subsystem boundary — it reuses an existing API. Inlining duplicates
      the color table (8 file-type entries + reset) and creates a maintenance burden if
      color values change. Estimated LOC reduction: 15-25 lines.

      Change 2: srd008-ls R5.1 — remove inline human-size algorithm

      Current: "display file sizes using binary algorithm (inlined in cmd/ls, not
      pkg/format.HumanSize)"

      Recommended: "display file sizes via pkg/format.HumanSize(bytes, HumanSizeOpts{Binary:
      true})."

      Rationale: Same as Change 1. pkg/format.HumanSize exists; calling it does not cross
      a new subsystem boundary. Inlining duplicates the binary/SI conversion algorithm
      (~30-40 lines). Estimated LOC reduction: 25-35 lines.

      Change 3: srd009-du R2.1 — remove inline human-size algorithm

      Current: "using algorithm inlined in cmd/du (not pkg/format.HumanSize)"

      Recommended: "via pkg/format.HumanSize(bytes, HumanSizeOpts{Binary: true})."

      Rationale: Identical to Change 2. cmd/du R2.1 (-h flag) currently inlines the same
      algorithm that srd003-format R3 specifies. With pkg/format pre-committed, calling
      HumanSize reduces duplication without adding a subsystem boundary.

      These three changes collectively reduce estimated code duplication by 55-100 LOC
      across two utilities and ensure a single source of truth for color tables and
      human-readable size formatting.

  - title: "Risk summary and flagged tasks"
    content: |
      Table 10: Tasks flagged for review

      | Task | Risk | Reason | Mitigation |
      |------|------|--------|-----------|
      | ls-core-B (R2, long format) | MEDIUM | Complex sub-concerns (permissions, user/group, mtime, symlinks, total); 200-350 LOC | Single subsystem (os.Lstat); all sub-concerns operate on same data. Monitor first stitch attempt |
      | ls-ext-B (R2, sort modes) | MEDIUM | strverscmp implementation is non-trivial | Single subsystem (sort.Interface); 150-220 LOC is within budget. Consider providing strverscmp reference in required_reading |
      | ls-ext-D (R5, recursive) | MEDIUM | -R requires format inheritance, per-dir headers, filter propagation | Single subsystem (recursive descent); 120-180 LOC. Complexity is in integration, not LOC |

      No HIGH risk tasks exist. No tasks cross multiple subsystem boundaries. The three
      MEDIUM tasks are all single-subsystem with LOC estimates well under the 500 LOC cap.

      The dominant risk factor is not task sizing but infrastructure availability and rate
      limits:
      - Infrastructure: mitigated by pre-committing pkg/testutils, pkg/sys, pkg/format
      - Rate limits: mitigated by starting with a fresh 5-hour API window and increasing
        max_time_sec if rate limit pauses are observed
      - Release ordering: mitigated by using releases filter or pipeline enforcement

  - title: "Verdict: can GH-36 proceed?"
    content: |
      YES. The next generation run (GH-36) can proceed with the following conditions:

      1. Apply the three SRD changes (srd008-ls R4.3, R5.1; srd009-du R2.1) to remove
         inline instructions and use pkg/format APIs. This reduces code duplication and
         simplifies stitch tasks.

      2. Pre-commit infrastructure packages (pkg/testutils, pkg/sys, pkg/format) at
         mage generator:start. Use the versions from the most recent v1 tag, not the
         simplified versions from eng12 commit b8de78e.

      3. Start the generation run with a fresh 5-hour API window. The measure phase
         costs ~250K output tokens (~$2.30, ~11 minutes). Do not start a run with less
         than 300K output tokens remaining in the current window.

      4. Use releases filter to enforce ordering if measure does not respect it naturally.
         Recommended sequence: releases=["01.0","01.1"] first (ts, wc, cat, sponge),
         then ["02.0"] (du), then ["99.0"] (ls core), then ["99.1"] (ls extended).
         Infrastructure (rel00.0) is pre-committed, not generated.

      5. Monitor ls core tasks closely. Tasks ls-core-B (long format), ls-ext-B (sort
         modes), and ls-ext-D (recursive) are MEDIUM risk — they have not been tested
         in any generation run. If they fail, the task sizing is correct; investigate
         rate limits or infrastructure issues first.

      No structural barriers to generation exist. All 16 proposed tasks decompose into
      single-subsystem units within the 400-500 LOC budget. The eng11 subsystem boundary
      rule holds across all SRDs.

