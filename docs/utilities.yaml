id: utilities
title: "Unix Utility Catalog"

overview: |
  Complete catalog of all utilities across the four source repositories. Each entry
  records: description, implementation language and source file(s), approximate LOC,
  internal shared code, required Go packages, and a profile block for implementation
  planning.

  Go package shorthand:
    testutils   — pkg/testutils (differential testing harness; applies to ALL utilities)
    sys/stat    — pkg/sys Stat/Lstat (extended metadata: st_nlink, st_ino, st_dev, st_blocks)
    sys/tty     — pkg/sys TerminalWidth + IsTerminal (TIOCGWINSZ ioctl)
    sys/sigpipe — pkg/sys InstallSIGPIPEHandler (suppress broken-pipe errors)
    sys/sigwinch — pkg/sys OnTerminalResize (reflow on terminal resize)
    fmt/human   — pkg/format HumanSize (human-readable byte sizes for -h)
    fmt/columns — pkg/format Columns + PadRight/PadLeft (multi-column layout)
    fmt/color   — pkg/format FileTypeColor (ANSI color by file type)

  Coreutils internal shared code:
    copy_engine   — copy.c, copy-file-data.c, force-link.c (cp, mv, install)
    remove_engine — remove.c (rm, cp, mv)
    expand_common — expand-common.c (expand, unexpand)
    chown_engine  — chown-core.c (chown, chgrp)
    ls_engine     — ls.c with compile-time defaults (ls, dir, vdir)
    uname_engine  — uname.c (uname, arch)
    group_list    — group-list.c (id, groups)
    show_date     — show-date.c (date, touch)
    operand2sig   — operand2sig.c (kill)
  Moreutils internal shared code:
    physmem       — physmem.c (sponge, parallel)

  Profile taxonomy
  ────────────────
  type:
    os_wrapper      — thin wrapper around one or two syscalls; trivial dispatch logic
    stream_transform — reads bytes/lines, applies stateless transformation, writes output
    stream_stateful  — stream with bounded state between records (counter, previous line, etc.)
    stream_accumulate — must buffer all input before producing output
    file_operate    — acts on filesystem objects; no stream processing
    file_report     — queries and reports filesystem or system state
    process_manage  — manages child processes (fork/exec, signal forwarding, IPC)
    encode_decode   — checksums, base encoding/decoding, format conversion
    regex_search    — searches using DFA/NFA/PCRE engine
    number_emit     — generates or formats numbers (seq, factor, numfmt, expr)
    editor_launch   — spawns $EDITOR; interactive; not amenable to automation
    db_index        — builds or queries a binary file database (locate/updatedb)

  difficulty:
    trivial   — <150 effective LOC; obvious implementation; single syscall or trivial I/O
    easy      — 150–700 LOC; clear linear logic; few interacting modes
    medium    — 700–2000 LOC or moderate state machine; multiple modes with interactions
    hard      — >2000 LOC or complex internal algorithms; significant platform-specific code
    very_hard — >3500 LOC OR requires implementing a compiler/regex engine/locale-aware sort

  memory:
    streaming       — O(1); processes one record at a time; input size does not matter
    windowed        — small bounded buffer (e.g., N lines for tail -n, one previous line for uniq)
    accumulating    — O(N); must hold all input in memory before producing output
    spill_capable   — accumulates but overflows to temp files on disk when memory is exhausted
    filesystem_walk — proportional to directory depth/breadth being traversed

  concurrency (omit field if none):
    fork_exec  — spawns one or more child processes
    threaded   — uses POSIX threads (sort --parallel, parallel)
    parallel_capable — can use multiple workers with -P/-j flag

repositories:

  # ---------------------------------------------------------------------------
  - id: coreutils
    source: https://github.com/coreutils/coreutils
    brew: brew install coreutils  # installs with g-prefix: gls, gcat, gwc …
    utilities:

      # --- File content display / transformation ---

      - name: cat
        description: Concatenate files and print to stdout; display control chars with -v/-E/-T.
        language: C
        source_file: src/cat.c
        loc: 828
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gcat
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming
          algorithms: []

      - name: tac
        description: Concatenate files in reverse (last line first).
        language: C
        source_file: src/tac.c
        loc: 592
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gtac
        profile:
          type: stream_accumulate
          difficulty: easy
          memory: accumulating
          algorithms: []
          go_notes: |
            Must read entire input to reverse. Simplest Go approach: collect all lines into
            a slice, print in reverse. For very large inputs this exhausts memory; C tac uses
            block-level seek-backward tricks to avoid this.

      - name: head
        description: Print the first N lines or bytes of each file.
        language: C
        source_file: src/head.c
        loc: 1086
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: ghead
        profile:
          type: stream_stateful
          difficulty: easy
          memory: windowed  # reads only as many bytes/lines as requested

      - name: tail
        description: Print the last N lines or bytes; follow a file with -f.
        language: C
        source_file: src/tail.c
        loc: 2540
        shared_internal: []
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium  # -f is non-deterministic; static modes are high
        homebrew_binary: gtail
        profile:
          type: stream_stateful
          difficulty: hard
          memory: windowed  # circular buffer of N lines; -f watches indefinitely
          algorithms: [circular_buffer]
          go_notes: |
            Static mode (-n N): circular buffer of N lines — straightforward.
            Follow mode (-f): requires platform-specific file watching. On Linux use
            inotify; on Darwin use kqueue. Go's fsnotify wraps both but is not a
            well-known-source library per project rules — implement using
            golang.org/x/sys/unix directly.

      - name: wc
        description: Count newlines, words, and bytes in files.
        language: C
        source_file: src/wc.c
        loc: 1049
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gwc
        profile:
          type: stream_stateful
          difficulty: easy
          memory: streaming
          algorithms: []

      - name: nl
        description: Number lines of files with configurable style and section delimiters.
        language: C
        source_file: src/nl.c
        loc: 654
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gnl
        profile:
          type: stream_stateful
          difficulty: easy
          memory: streaming
          algorithms: [section_delimiter_state_machine]

      - name: od
        description: Dump files in octal, hex, decimal, or character representation.
        language: C
        source_file: src/od.c
        loc: 2064
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: god
        profile:
          type: stream_transform
          difficulty: hard
          memory: windowed  # buffers one output word/line at a time
          algorithms: [multi_radix_dump, char_encoding_table]
          go_notes: |
            Multiple output radices and word sizes (-t format strings). Address column
            is configurable. The format string parser (e.g., -t x4, -t d2, -t c) is
            a small but non-trivial DSL.

      - name: fold
        description: Wrap long lines to a specified width.
        language: C
        source_file: src/fold.c
        loc: 362
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gfold
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming

      - name: fmt
        description: Simple text formatter that fills and joins short lines.
        language: C
        source_file: src/fmt.c
        loc: 1065
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gfmt
        profile:
          type: stream_stateful
          difficulty: medium
          memory: windowed  # accumulates one paragraph at a time (bounded by paragraph size)
          algorithms: [paragraph_fill]

      # --- Text field / column processing ---

      - name: cut
        description: Remove sections from lines by byte, character, or field delimiter.
        language: C
        source_file: src/cut.c
        loc: 616
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gcut
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming

      - name: paste
        description: Merge lines of files side by side with a delimiter.
        language: C
        source_file: src/paste.c
        loc: 558
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gpaste
        profile:
          type: stream_stateful
          difficulty: easy
          memory: streaming
          go_notes: |
            Must interleave one line from each of N open files simultaneously. In Go,
            maintain a slice of open file handles and read one line per handle per output
            line. No threading needed; purely sequential per-line I/O.

      - name: join
        description: Join lines of two sorted files on a common field.
        language: C
        source_file: src/join.c
        loc: 1234
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gjoin
        profile:
          type: stream_stateful
          difficulty: medium
          memory: windowed  # both inputs must be pre-sorted; small lookahead state
          algorithms: [sort_merge_join]

      - name: tr
        description: Translate or delete characters; squeeze repeated characters with -s.
        language: C
        source_file: src/tr.c
        loc: 1906
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gtr
        profile:
          type: stream_transform
          difficulty: medium
          memory: streaming
          algorithms: [character_class_expansion, translation_table]
          go_notes: |
            Character class expansion ([a-z], [:alpha:], equivalence classes) is the
            complex part. Build a 256-entry lookup table at startup, then stream bytes
            through it. Squeeze mode adds one bit of state (previous output char).

      - name: expand
        description: Convert tabs to spaces.
        language: C
        source_file: src/expand.c
        loc: 230
        shared_internal: [expand_common]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gexpand
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming

      - name: unexpand
        description: Convert spaces back to tabs.
        language: C
        source_file: src/unexpand.c
        loc: 325
        shared_internal: [expand_common]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gunexpand
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming

      # --- Sorting / comparison ---

      - name: sort
        description: Sort lines of text files; locale-aware, numeric, random, and stable sorts.
        language: C
        source_file: src/sort.c
        loc: 4989
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium  # LC_ALL=C required; locale-sensitive otherwise
        homebrew_binary: gsort
        profile:
          type: stream_accumulate
          difficulty: very_hard
          memory: spill_capable
          concurrency: threaded  # --parallel uses pthreads for merge passes
          algorithms: [merge_sort, radix_sort, locale_collation, external_merge_sort]
          go_notes: |
            Two major challenges in Go:
            1. Locale-aware collation (LC_COLLATE): Go stdlib has no strcoll equivalent.
               Must implement locale collation in-house or accept LC_ALL=C-only behavior.
            2. External sort (inputs > RAM): sort.c spills sorted runs to temp files in
               TMPDIR and merge-sorts them. Go's sort.Slice is in-memory only.
               Need a custom k-way merge implementation with disk spill.
            3. --parallel uses pthreads; in Go use goroutines + sync.WaitGroup.

      - name: uniq
        description: Report or omit repeated adjacent lines; count occurrences with -c.
        language: C
        source_file: src/uniq.c
        loc: 663
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: guniq
        profile:
          type: stream_stateful
          difficulty: easy
          memory: windowed  # only needs the previous output line in memory

      - name: comm
        description: Compare two sorted files line by line; print lines unique to each or common.
        language: C
        source_file: src/comm.c
        loc: 511
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gcomm
        profile:
          type: stream_stateful
          difficulty: easy
          memory: windowed
          algorithms: [three_way_line_comparison]

      - name: tsort
        description: Perform topological sort; reads directed edges as pairs from stdin.
        language: C
        source_file: src/tsort.c
        loc: ~300
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gtsort
        profile:
          type: stream_accumulate
          difficulty: medium
          memory: accumulating  # must hold entire graph in memory
          algorithms: [dfs_topological_sort]

      # --- File listing / metadata ---

      - name: ls
        description: List directory contents; multi-column, long format, color, human-readable sizes.
        language: C
        source_file: src/ls.c
        loc: 5638
        shared_internal: [ls_engine]
        pkg_go: [sys/stat, sys/tty, sys/sigpipe, sys/sigwinch, fmt/human, fmt/columns, fmt/color]
        testability: medium
        homebrew_binary: gls
        profile:
          type: file_report
          difficulty: very_hard
          memory: filesystem_walk
          algorithms: [multi_column_layout, ansi_color, version_sort_strverscmp]
          go_notes: |
            Uses every shared package in the project. Notable challenges:
            - Multi-column layout: must compute column widths after reading all entries.
            - ANSI color: disabled when stdout is not a TTY.
            - SIGWINCH: reflows column layout when terminal is resized mid-listing.
            - Sorting: strverscmp (version sort) has no stdlib equivalent.
            - Extended stat: needs pkg/sys for st_nlink, st_ino, st_blocks, st_uid, st_gid.

      - name: dir
        description: Like ls but defaults to vertical column format (ls --format=vertical).
        language: C
        source_file: src/ls.c
        loc: 5638
        shared_internal: [ls_engine]
        pkg_go: [sys/stat, sys/tty, sys/sigpipe, sys/sigwinch, fmt/human, fmt/columns, fmt/color]
        testability: medium
        homebrew_binary: gdir
        profile:
          type: file_report
          difficulty: very_hard
          memory: filesystem_walk
          go_notes: Same source as ls; compiled with different default format.

      - name: vdir
        description: Like ls but defaults to long format (ls --format=long).
        language: C
        source_file: src/ls.c
        loc: 5638
        shared_internal: [ls_engine]
        pkg_go: [sys/stat, sys/tty, sys/sigpipe, sys/sigwinch, fmt/human, fmt/columns, fmt/color]
        testability: medium
        homebrew_binary: gvdir
        profile:
          type: file_report
          difficulty: very_hard
          memory: filesystem_walk
          go_notes: Same source as ls; compiled with different default format.

      - name: stat
        description: Display detailed file or filesystem status; printf-style format strings.
        language: C
        source_file: src/stat.c
        loc: 1989
        shared_internal: []
        pkg_go: [sys/stat, sys/sigpipe, fmt/human]
        testability: medium  # timestamps and inode numbers require normalization
        homebrew_binary: gstat
        profile:
          type: file_report
          difficulty: medium
          memory: streaming
          algorithms: [printf_format_string_parser]

      - name: du
        description: Estimate file space usage; recurses directories; deduplicates hard links.
        language: C
        source_file: src/du.c
        loc: ~1191
        shared_internal: []
        pkg_go: [sys/stat, sys/sigpipe, fmt/human]
        testability: medium
        homebrew_binary: gdu
        profile:
          type: file_report
          difficulty: medium
          memory: filesystem_walk
          algorithms: [inode_dedup_tracking]
          go_notes: |
            Hard-link deduplication requires a map[uint64]map[uint64]bool (dev → ino → seen)
            per invocation. This map is O(unique inodes) in memory — bounded but can be large
            on filesystems with many hard links.

      - name: df
        description: Report filesystem disk space usage for mounted filesystems.
        language: C
        source_file: src/df.c
        loc: 1855
        shared_internal: []
        pkg_go: [sys/sigpipe, fmt/human]
        testability: low  # filesystem sizes change at runtime
        homebrew_binary: gdf
        profile:
          type: file_report
          difficulty: medium
          memory: streaming
          go_notes: |
            Calls getmntent() (Linux) or getmntinfo() (Darwin) to enumerate mount points,
            then statfs() per mount. Darwin and Linux differ in struct layout; needs
            platform-specific build tags.

      - name: dircolors
        description: Output shell commands to set LS_COLORS from a color configuration database.
        language: C
        source_file: src/dircolors.c
        loc: ~500
        shared_internal: []
        pkg_go: []
        testability: high
        homebrew_binary: gdircolors
        profile:
          type: stream_transform
          difficulty: easy
          memory: streaming

      # --- File operations ---

      - name: cp
        description: Copy files and directories; preserves attributes with -a; supports reflinks.
        language: C
        source_file: src/cp.c
        loc: 1336
        shared_internal: [copy_engine, remove_engine]
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium
        homebrew_binary: gcp
        profile:
          type: file_operate
          difficulty: hard
          memory: streaming  # copies in blocks; no full buffering
          algorithms: [sparse_file_detection, reflink_copy]
          go_notes: |
            copy_engine (copy.c) handles sparse files, reflinks (FICLONE ioctl on Linux),
            and extended attributes. Reflinks are Linux-only and not available on macOS.
            The Go implementation must choose: skip reflinks entirely, or add a Linux build
            tag. Sparse file detection uses SEEK_HOLE/SEEK_DATA.

      - name: mv
        description: Move (rename) files; falls back to copy+delete on cross-device moves.
        language: C
        source_file: src/mv.c
        loc: 573
        shared_internal: [copy_engine, remove_engine]
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium
        homebrew_binary: gmv
        profile:
          type: file_operate
          difficulty: medium
          memory: streaming
          go_notes: |
            Cross-device move uses os.Rename first; on EXDEV error falls back to copy+delete
            using the copy_engine. The fallback path inherits all cp complexity.

      - name: rm
        description: Remove files or directories; recursive with -r; interactive with -i.
        language: C
        source_file: src/rm.c
        loc: 396
        shared_internal: [remove_engine]
        pkg_go: [sys/sigpipe]
        testability: medium
        homebrew_binary: grm
        profile:
          type: file_operate
          difficulty: medium
          memory: filesystem_walk
          algorithms: [fts_post_order_traversal]
          go_notes: |
            Recursive removal with -r uses FTS (file tree scan) in post-order so that
            directory entries are removed after their contents. In Go, implement with
            filepath.WalkDir or a manual post-order DFS.

      - name: ln
        description: Create hard or symbolic links between files.
        language: C
        source_file: src/ln.c
        loc: 716
        shared_internal: [force_link]
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium
        homebrew_binary: gln
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: install
        description: Copy files and set attributes (permissions, owner, strip); used in Makefiles.
        language: C
        source_file: src/install.c
        loc: 1107
        shared_internal: [copy_engine]
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium
        homebrew_binary: ginstall
        profile:
          type: file_operate
          difficulty: medium
          memory: streaming

      - name: shred
        description: Overwrite a file multiple times to make recovery harder; optionally delete.
        language: C
        source_file: src/shred.c
        loc: 1291
        shared_internal: []
        pkg_go: [sys/sigpipe, fmt/human]
        testability: low
        homebrew_binary: gshred
        profile:
          type: file_operate
          difficulty: medium
          memory: streaming  # writes in blocks; no full buffering
          algorithms: [secure_overwrite_passes, prng_fill]
          go_notes: |
            Multiple overwrite passes with random data. Uses a PRNG (not crypto/rand for
            performance). Progress output with -v uses human-readable sizes. The guarantee
            that data is unrecoverable depends on filesystem behavior (journaling, SSD wear
            leveling) that shred explicitly warns about — no algorithmic solution.

      - name: truncate
        description: Shrink or extend a file to a given size.
        language: C
        source_file: src/truncate.c
        loc: ~300
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gtruncate
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: dd
        description: Convert and copy a file with block I/O; byte-order conversion, skip, seek.
        language: C
        source_file: src/dd.c
        loc: 2547
        shared_internal: []
        pkg_go: [sys/stat, sys/sigpipe, fmt/human]
        testability: medium
        homebrew_binary: gdd
        profile:
          type: stream_transform
          difficulty: hard
          memory: windowed  # processes one block at a time (ibs/obs block sizes)
          algorithms: [block_io_conversion, byte_order_swap]
          go_notes: |
            Progress reporting uses SIGINFO on BSD/macOS and SIGUSR1 on Linux — needs
            platform-specific build tags. Conversions (conv=swab, conv=ucase, conv=ascii,
            conv=ebcdic) are table-driven. ibs and obs can differ, requiring an internal
            partial-block buffer when ibs != obs.

      - name: sync
        description: Synchronize cached writes to persistent storage.
        language: C
        source_file: src/sync.c
        loc: ~100
        shared_internal: []
        pkg_go: []
        testability: low  # no observable stdout; side effect only
        homebrew_binary: gsync
        profile:
          type: os_wrapper
          difficulty: trivial
          memory: streaming

      # --- Directory operations ---

      - name: mkdir
        description: Create directories; create parent directories with -p.
        language: C
        source_file: src/mkdir.c
        loc: 319
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium
        homebrew_binary: gmkdir
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: rmdir
        description: Remove empty directories; remove parent directories with -p.
        language: C
        source_file: src/rmdir.c
        loc: ~200
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium
        homebrew_binary: grmdir
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: mktemp
        description: Create a temporary file or directory with a unique name.
        language: C
        source_file: src/mktemp.c
        loc: 358
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: low  # output is random by design
        homebrew_binary: gmktemp
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: mkfifo
        description: Create named pipes (FIFOs).
        language: C
        source_file: src/mkfifo.c
        loc: ~150
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium
        homebrew_binary: gmkfifo
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: mknod
        description: Create block/character device files, FIFOs, or regular files.
        language: C
        source_file: src/mknod.c
        loc: ~200
        shared_internal: []
        pkg_go: []
        testability: low  # device nodes require root
        homebrew_binary: gmknod
        profile:
          type: file_operate
          difficulty: easy
          memory: streaming

      - name: realpath
        description: Print the resolved absolute path for each argument.
        language: C
        source_file: src/realpath.c
        loc: 302
        shared_internal: [relpath]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: grealpath
        profile:
          type: file_report
          difficulty: easy
          memory: streaming

      - name: readlink
        description: Print the value of a symbolic link or canonical file name.
        language: C
        source_file: src/readlink.c
        loc: ~180
        shared_internal: [relpath]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: greadlink
        profile:
          type: file_report
          difficulty: easy
          memory: streaming

      - name: pwd
        description: Print the name of the current working directory.
        language: C
        source_file: src/pwd.c
        loc: ~250
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gpwd
        profile:
          type: os_wrapper
          difficulty: trivial
          memory: streaming

      - name: basename
        description: Strip directory and suffix from filenames.
        language: C
        source_file: src/basename.c
        loc: 194
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gbasename
        profile:
          type: stream_transform
          difficulty: trivial
          memory: streaming

      - name: dirname
