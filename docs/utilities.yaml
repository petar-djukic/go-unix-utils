id: utilities
title: "Unix Utility Catalog"

overview: |
  Complete catalog of all utilities across the four source repositories used by this
  project. For each utility: description, source implementation language and file(s),
  approximate source LOC, internal code shared with other utilities in the same repo,
  and which of our Go packages (pkg/) the utility would require.

  Go package shorthand:
    testutils  — pkg/testutils (differential testing harness; applies to ALL utilities)
    sys/stat   — pkg/sys Stat/Lstat (extended metadata: st_nlink, st_ino, st_dev, st_blocks)
    sys/tty    — pkg/sys TerminalWidth + IsTerminal (TIOCGWINSZ ioctl)
    sys/sigpipe— pkg/sys InstallSIGPIPEHandler (suppress broken-pipe errors)
    sys/sigwinch— pkg/sys OnTerminalResize (reflow on terminal resize)
    fmt/human  — pkg/format HumanSize (human-readable byte sizes for -h flag)
    fmt/columns— pkg/format Columns + PadRight/PadLeft (multi-column layout)
    fmt/color  — pkg/format FileTypeColor (ANSI color by file type)

  Coreutils internal shared code (C infrastructure shared within the repo):
    copy_engine   — copy.c, copy-file-data.c, force-link.c (cp, mv, install)
    remove_engine — remove.c (rm, cp, mv)
    expand_common — expand-common.c (expand, unexpand)
    chown_engine  — chown-core.c (chown, chgrp)
    ls_engine     — ls.c with compile-time defaults (ls, dir, vdir)
    uname_engine  — uname.c (uname, arch)
    group_list    — group-list.c (id, groups)
    show_date     — show-date.c (date, touch)
    operand2sig   — operand2sig.c (kill)

  Moreutils internal shared code:
    physmem       — physmem.c (sponge, parallel)

repositories:

