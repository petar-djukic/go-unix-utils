  # ---------------------------------------------------------------------------
  - id: grep
    source: https://git.savannah.gnu.org/git/grep.git
    brew: brew install grep  # installs with g-prefix: ggrep
    utilities:

      - name: grep
        description: Search for patterns in files using BRE, ERE, or Perl-compatible regex.
        language: C
        source_file: src/grep.c
        loc: 3036
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: ggrep
        profile:
          type: regex_search
          difficulty: very_hard
          memory: streaming
          algorithms: [dfa_construction, boyer_moore, aho_corasick, pcre]
          go_notes: |
            Three regex engines in one binary:
            1. BRE/ERE (-G/-E): Go's regexp package uses RE2 semantics (no backreferences,
               no lookahead). For basic grep, RE2 is sufficient and compatible.
            2. Fixed strings (-F): Aho-Corasick multi-string search. Go stdlib has no
               Aho-Corasick; implement in-house (~200 lines) or use RE2 alternation.
            3. PCRE (-P): Perl-compatible with backreferences and lookahead. Go has no
               stdlib PCRE. Either drop -P support or use CGO with libpcre2. Per project
               rules, not a well-known-source Go library — CGO is the only option.
            For a first implementation, target BRE/ERE (-G/-E) and -F; exclude -P.

      - name: egrep
        description: Grep with extended regular expressions (ERE); equivalent to grep -E.
        language: shell
        source_file: src/egrep.sh
        loc: ~10
        shared_internal: [grep]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gegrep
        note: Obsolescent per POSIX; prefer grep -E.
        profile:
          type: regex_search
          difficulty: trivial  # shell wrapper only; all logic in grep
          memory: streaming

      - name: fgrep
        description: Grep with fixed strings (no regex); equivalent to grep -F.
        language: shell
        source_file: src/egrep.sh
        loc: ~10
        shared_internal: [grep]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: gfgrep
        note: Obsolescent per POSIX; prefer grep -F.
        profile:
          type: regex_search
          difficulty: trivial  # shell wrapper only
          memory: streaming

