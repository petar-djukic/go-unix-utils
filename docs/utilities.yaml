  # ---------------------------------------------------------------------------
  - id: moreutils
    source: https://git.joeyh.name/git/moreutils.git
    brew: brew install moreutils  # installs without g-prefix
    utilities:

      - name: ts
        description: Timestamp each line of stdin; -i/-s elapsed modes; -r relative conversion.
        language: Perl
        source_file: ts
        loc: 192
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: ts
        profile:
          type: stream_stateful
          difficulty: easy
          memory: streaming
          algorithms: [strftime_formatting, subsecond_extension_parsing]
          go_notes: |
            Needs in-house strftime covering the codes ts actually uses (%b, %d, %H, %M,
            %S, %Y, %m, %s epoch) plus the moreutils subsecond extensions (%.S, %.s, %.T).
            No external library per project rules. The subsecond extensions are not standard
            strftime and must be post-processed from time.Time.

      - name: sponge
        description: Soak up stdin before writing to a file; safe for in-place pipeline rewriting.
        language: C
        source_file: sponge.c
        loc: 395
        shared_internal: [physmem]
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: sponge
        profile:
          type: stream_accumulate
          difficulty: medium
          memory: spill_capable
          algorithms: [physmem_bounded_soak, atomic_file_rename]
          go_notes: |
            Two memory regimes: small input (fits in RAM, use a growing []byte) and large
            input (exceeds a fraction of available physical memory, spill to TMPDIR temp
            file). The threshold is derived from physmem_available(); in Go use
            runtime.MemStats or a fixed fraction of RLIMIT_DATA. Atomic rename requires
            os.Rename; cross-device fallback needs a copy loop.

      - name: pee
        description: Tee stdin to multiple commands simultaneously; exit OR of all subcommands.
        language: C
        source_file: pee.c
        loc: 119
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium  # output ordering across N commands may interleave
        homebrew_binary: pee
        profile:
          type: process_manage
          difficulty: medium
          memory: streaming
          concurrency: fork_exec
          go_notes: |
            Forks N children, each receiving a copy of stdin via a pipe. C implementation
            uses select() to multiplex writes. In Go: start N goroutines, each with their
            own io.Writer from an os/exec pipe; use io.MultiWriter to fan out from stdin.
            Exit status is bitwise OR of all child exit codes.

      - name: chronic
        description: Run a command silently unless it fails; suppress stdout/stderr on success.
        language: Perl
        source_file: chronic
        loc: 97
        shared_internal: []
        pkg_go: []
        testability: medium
        homebrew_binary: chronic
        profile:
          type: process_manage
          difficulty: easy
          memory: accumulating  # buffers all subprocess output in memory until exit
          concurrency: fork_exec
          go_notes: |
            Must capture all stdout+stderr of the subprocess in memory, then either discard
            (success) or print (failure). Buffer is O(subprocess output size) — unbounded but
            bounded by available memory. In Go: os/exec with bytes.Buffer for stdout/stderr.

      - name: vidir
        description: Edit file and directory names in a text editor; applies renames on save.
        language: Perl
        source_file: vidir
        loc: 243
        shared_internal: []
        pkg_go: []
        testability: low  # launches $EDITOR interactively
        homebrew_binary: vidir
        profile:
          type: editor_launch
          difficulty: medium
          memory: accumulating
          go_notes: |
            Reads all entries into a temp file, launches $EDITOR, diffs the before/after
            to determine renames and deletes, applies them. The editor interaction makes
            automated testing impractical. Not amenable to differential testing.

      - name: vipe
        description: Insert a text editor into a pipeline; edit stdin before it reaches stdout.
        language: Perl
        source_file: vipe
        loc: 94
        shared_internal: []
        pkg_go: []
        testability: low  # launches $EDITOR interactively
        homebrew_binary: vipe
        profile:
          type: editor_launch
          difficulty: easy
          memory: accumulating
          go_notes: |
            Buffers stdin to a temp file, launches $EDITOR, writes edited content to stdout.
            Like vidir, not differentially testable due to editor interaction.

      - name: ifne
        description: Run a command only if stdin is not empty; otherwise exit 0 silently.
        language: C
        source_file: ifne.c
        loc: 129
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: high
        homebrew_binary: ifne
        profile:
          type: process_manage
          difficulty: easy
          memory: windowed  # reads at most one byte to check emptiness
          concurrency: fork_exec

      - name: ifdata
        description: Check network interface data (IP, netmask, MTU, etc.) and return it.
        language: C
        source_file: ifdata.c
        loc: 585
        shared_internal: []
        pkg_go: []
        testability: low  # output depends on live network interface state
        homebrew_binary: ifdata
        profile:
          type: file_report
          difficulty: easy
          memory: streaming
          go_notes: |
            Uses SIOCGIFADDR and related ioctls. net package covers most needs;
            platform-specific ioctls via golang.org/x/sys/unix for MTU etc.

      - name: mispipe
        description: Pipe two commands together; return the exit status of the first.
        language: C
        source_file: mispipe.c
        loc: 179
        shared_internal: []
        pkg_go: []
        testability: medium
        homebrew_binary: mispipe
        profile:
          type: process_manage
          difficulty: easy
          memory: streaming
          concurrency: fork_exec

      - name: lckdo
        description: Execute a command while holding a lock file; retry or wait.
        language: C
        source_file: lckdo.c
        loc: 232
        shared_internal: []
        pkg_go: []
        testability: medium
        homebrew_binary: lckdo
        note: Deprecated in moreutils; use flock instead.
        profile:
          type: process_manage
          difficulty: easy
          memory: streaming
          concurrency: fork_exec

      - name: parallel
        description: Run multiple jobs in parallel from stdin; similar to xargs -P.
        language: C
        source_file: parallel.c
        loc: 427
        shared_internal: [physmem]
        pkg_go: [sys/sigpipe]
        testability: low  # output ordering is non-deterministic with -j N
        homebrew_binary: parallel
        note: Not the same as GNU parallel (a separate, much larger tool).
        profile:
          type: process_manage
          difficulty: medium
          memory: windowed  # holds one job per worker slot; not O(N) of input
          concurrency: fork_exec
          parallel_capable: true
          go_notes: |
            In Go, goroutines + semaphore (buffered channel) replace the C fork/wait loop.
            Goroutines are cheaper than OS threads, making -j 100 practical. Output
            interleaving is still non-deterministic without buffering.

      - name: zrun
