  - id: findutils
    source: https://git.savannah.gnu.org/git/findutils.git
    brew: brew install findutils  # installs with g-prefix: gfind, gxargs
    utilities:

      - name: find
        description: Search for files in a directory hierarchy by name, type, size, time, and more.
        language: C
        source_files:
          - find/ftsfind.c   # main traversal loop (816 loc)
          - find/parser.c    # predicate and option parsing (3320 loc)
          - find/pred.c      # predicate evaluation (1351 loc)
          - find/print.c     # -printf / -ls output formatting
          - find/tree.c      # directory tree representation
          - find/util.c      # shared helpers
        shared_internal: []
        pkg_go: [sys/stat, sys/sigpipe]
        testability: medium
        homebrew_binary: gfind
        profile:
          type: file_report
          difficulty: very_hard
          memory: filesystem_walk
          algorithms: [fts_traversal, predicate_dsl_parser, predicate_evaluation]
          go_notes: |
            Three distinct complexity layers:
            1. Traversal: FTS (file tree scan) with cycle detection (via st_dev/st_ino).
               Go's filepath.WalkDir is simpler but lacks FTS's -follow-symlink controls.
            2. Predicate parser (parser.c 3320 LOC): a recursive-descent parser for the
               find predicate DSL (-name, -type, -newer, -exec, -prune, -print, boolean
               operators). This is the single largest Go implementation challenge.
            3. -exec and -exec {} +: the latter batches arguments and exec's in bulk like
               xargs. Subprocess management with correct argument splitting is tricky.
            Start with a subset: -name, -type, -maxdepth, -print, -newer, -exec (single).

      - name: xargs
        description: Build and execute command lines from stdin; parallel execution with -P.
        language: C
        source_file: xargs/xargs.c
        loc: 1784
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium
        homebrew_binary: gxargs
        profile:
          type: process_manage
          difficulty: hard
          memory: windowed  # accumulates arguments up to -s limit, then exec's
          concurrency: fork_exec
          parallel_capable: true
          algorithms: [argument_splitting, nul_delimited_parsing]
          go_notes: |
            -P N (parallel) runs N processes concurrently with output interleaved unless
            --replace is used. In Go: goroutines + semaphore + sync.Mutex for output
            ordering. Argument accumulation (-n N, -s SIZE) is a fixed-size window.
            Seven distinct exit codes (0, 1, 123, 124, 125, 126, 127) each have specific
            semantics that must be preserved exactly.

      - name: locate
        description: Find files by name using a pre-built database (updatedb index).
        language: C
        source_files:
          - locate/locate.c
          - locate/frcode.c
        shared_internal: []
        pkg_go: []
        testability: low  # depends on database freshness and filesystem state
        homebrew_binary: glocate
        profile:
          type: db_index
          difficulty: medium
          memory: streaming
          algorithms: [frcode_decompression, front_coded_string_list]
          go_notes: |
            Frcode is a front-compression format: each entry stores only the suffix that
            differs from the previous path. Decompression is a simple state machine.
            The database format is stable and documented.

      - name: updatedb
        description: Update the database used by locate; scans the filesystem.
        language: C
        source_file: locate/updatedb.sh
        shared_internal: [locate]
        pkg_go: []
        testability: low
        homebrew_binary: gupdatedb
        profile:
          type: db_index
          difficulty: medium
          memory: filesystem_walk
          algorithms: [frcode_compression, front_coded_string_list]
          go_notes: |
            Walks the filesystem collecting paths, then encodes using frcode. Output is
            O(filesystem size). The shell script driver handles pruning and exclusions;
            the encoding logic is in frcode.c.
