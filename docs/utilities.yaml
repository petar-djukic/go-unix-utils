        source_file: xargs/xargs.c
        loc: 1784
        shared_internal: []
        pkg_go: [sys/sigpipe]
        testability: medium  # output order with -P is non-deterministic; sequential mode is deterministic
        homebrew_binary: gxargs

      - name: locate
