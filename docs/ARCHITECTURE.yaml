implementation_status:
  current_focus: |
    The working branch contains specifications only. Generated Go code (4,586 LOC across
    22 files) lives at the generation-merged tags from the first pipeline run: Gen A
    (generation-2026-02-25-07-08-59-merged), Gen B (generation-2026-02-25-07-46-59-merged),
    Gen C (generation-2026-02-25-08-44-27-merged). The combined code includes pkg/testutils,
    cmd/ts, cmd/cat, cmd/wc, cmd/sponge, pkg/sys, and pkg/format. No generated code is
    present on the working branch. See README Tagging Scheme and eng04 for details.

    "spec complete" means SRD, use case, and code exist (code at v1 tag). "specs written"
    means SRD, use case, and test suite exist but code generation has not run yet.
    "pending" means no SRD yet. See road-map.yaml for the active release and
    docs/utilities.yaml for the full catalog.
  progress:
    - pkg/testutils: "spec complete (rel01.0), code at generation-merged tags"
    - pkg/sys: "spec complete (rel02.0), code at generation-merged tags"
    - pkg/format: "spec complete (rel02.0), code at generation-merged tags"
    - cmd/ts: "spec complete (rel01.0), code at generation-merged tags"
    - cmd/wc: "spec complete (rel01.1), code at generation-merged tags"
    - cmd/cat: "spec complete (rel01.1), code at generation-merged tags"
    - cmd/sponge: "spec complete (rel01.1), code at generation-merged tags"
    - cmd/ls: "specs written (rel02.0 core / rel02.1 extended) — SRD, use case, and test suite complete; code generation pending"
    - cmd/du: "specs written (rel02.0) — SRD, use case, and test suite complete; code generation pending"
    - cmd/grep: pending
    - cmd/find: pending
    - cmd/xargs: pending
    - remaining 110 utilities: "cataloged in docs/utilities.yaml, not yet scheduled"

