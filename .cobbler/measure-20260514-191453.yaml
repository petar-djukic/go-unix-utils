- index: 0
  title: "[stitch] cmd/pwd: features implementation (srd051-pwd R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd051-pwd.yaml (full SRD for pwd utility -- read all requirements R1.1 through R1.4)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- SIGPIPE handling pattern)
      - pkg/sys/ (InstallSIGPIPEHandler function for SIGPIPE handling)

    files:
      - path: cmd/pwd/main.go
        action: create
        note: "pwd utility -- prints current working directory in logical (-L) or physical (-P) mode"

    requirements:
      - id: R1
        text: "Implement srd051-pwd R1.1 as specified in the SRD -- core default behavior printing the current working directory to stdout with a trailing newline"
      - id: R2
        text: "Implement srd051-pwd R1.2 as specified in the SRD -- logical mode behavior using PWD environment variable and symbolic link preservation"
      - id: R3
        text: "Implement srd051-pwd R1.3 as specified in the SRD -- physical mode behavior resolving all symbolic links to the real filesystem path"
      - id: R4
        text: "Implement srd051-pwd R1.4 as specified in the SRD -- flag parsing, mode selection, and default mode when no flags are provided"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils SIGPIPE behavior -- import github.com/petar-djukic/go-unix-utils/pkg/sys"
      - id: D2
        text: "Build with go build -o bin/pwd ./cmd/pwd/ -- the bin/ directory is gitignored"
      - id: D3
        text: "Parse flags using the standard library flag package or os.Args manual parsing as dictated by the SRD -- GNU pwd uses long options (--logical, --physical)"

    acceptance_criteria:
      - id: AC1
        text: "cmd/pwd/main.go compiles without errors: go build -o bin/pwd ./cmd/pwd/"
      - id: AC2
        text: "go vet ./cmd/pwd/... reports no issues"
      - id: AC3
        text: "srd051-pwd requirements R1.1 through R1.4 are implemented as specified in the SRD"
      - id: AC4
        text: "Running bin/pwd prints the current working directory to stdout and exits 0"

- index: 1
  title: "[stitch] cmd/pwd: features implementation (srd051-pwd R2.1-R3.2)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd051-pwd.yaml (full SRD for pwd -- read requirements R2.1, R2.2, R3.1, R3.2)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- differential testing pattern and graceful skip)
      - cmd/pwd/main.go (existing partial implementation from previous task -- read to understand current state)
      - pkg/testutils/ (BuildBinary, RunDiffTests, DiffTest type for differential testing)

    files:
      - path: cmd/pwd/main.go
        action: modify
        note: "Complete pwd implementation with remaining requirements R2.1-R2.2 and R3.1-R3.2"
      - path: cmd/pwd/pwd_test.go
        action: create
        note: "Differential tests comparing Go pwd against GNU gpwd reference binary"

    requirements:
      - id: R1
        text: "Implement srd051-pwd R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd051-pwd R2.2 as specified in the SRD"
      - id: R3
        text: "Implement srd051-pwd R3.1 as specified in the SRD"
      - id: R4
        text: "Implement srd051-pwd R3.2 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Use the standard differential testing pattern: goBin := testutils.BuildBinary(t, \".\"); refBin, err := exec.LookPath(\"gpwd\"); if err != nil { t.Skip(\"reference binary gpwd not in PATH\") }"
      - id: D2
        text: "Define test cases as []testutils.DiffTest and call testutils.RunDiffTests(t, goBin, refBin, tests) to compare stdout, stderr, and exit code"
      - id: D3
        text: "Set LC_ALL=C in the Env field of each DiffTest to ensure locale-independent output comparison"
      - id: D4
        text: "Import paths: github.com/petar-djukic/go-unix-utils/pkg/testutils for the test harness, os/exec for LookPath"

    acceptance_criteria:
      - id: AC1
        text: "cmd/pwd/main.go compiles without errors: go build -o bin/pwd ./cmd/pwd/"
      - id: AC2
        text: "go vet ./cmd/pwd/... reports no issues"
      - id: AC3
        text: "go test ./cmd/pwd/... -count=1 passes or skips gracefully if gpwd is not installed"
      - id: AC4
        text: "srd051-pwd requirements R2.1, R2.2, R3.1, R3.2 are implemented as specified in the SRD"
      - id: AC5
        text: "pwd_test.go uses testutils.RunDiffTests with at least one test case per implemented requirement"

- index: 2
  title: "[stitch] cmd/tty: features implementation (srd052-tty R1.1-R2.1)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd052-tty.yaml (full SRD for tty utility -- read all requirements R1.1 through R2.1)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- SIGPIPE handling pattern)
      - pkg/sys/ (InstallSIGPIPEHandler function and IsTerminal function for terminal detection)

    files:
      - path: cmd/tty/main.go
        action: create
        note: "tty utility -- prints terminal device name connected to stdin or reports not a tty"

    requirements:
      - id: R1
        text: "Implement srd052-tty R1.1 as specified in the SRD -- core behavior printing the terminal device path to stdout when stdin is a terminal"
      - id: R2
        text: "Implement srd052-tty R1.2 as specified in the SRD -- behavior when stdin is not connected to a terminal (print 'not a tty' to stdout)"
      - id: R3
        text: "Implement srd052-tty R1.3 as specified in the SRD -- exit code semantics (0 for terminal, 1 for non-terminal)"
      - id: R4
        text: "Implement srd052-tty R2.1 as specified in the SRD -- silent mode (-s) suppressing output and using only exit codes"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils SIGPIPE behavior -- import github.com/petar-djukic/go-unix-utils/pkg/sys"
      - id: D2
        text: "Build with go build -o bin/tty ./cmd/tty/ -- the bin/ directory is gitignored"
      - id: D3
        text: "Use os.Stdin.Fd() to get the file descriptor for stdin terminal detection"

    acceptance_criteria:
      - id: AC1
        text: "cmd/tty/main.go compiles without errors: go build -o bin/tty ./cmd/tty/"
      - id: AC2
        text: "go vet ./cmd/tty/... reports no issues"
      - id: AC3
        text: "srd052-tty requirements R1.1 through R1.3 and R2.1 are implemented as specified in the SRD"
      - id: AC4
        text: "Running bin/tty in a terminal prints the device path and exits 0"

