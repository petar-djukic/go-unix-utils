- index: 0
  title: "[stitch] pkg/testutils -- srd001-testutils (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd001-testutils.yaml (full SRD for differential testing harness)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- DiffTest pattern and BuildBinary usage)
      - CLAUDE.md (differential testing pattern showing BuildBinary and RunDiffTests usage)

    files:
      - path: pkg/testutils/difftest.go
        action: create
        note: All exported types and function signatures as Go stubs with panic("not implemented") bodies

    requirements:
      - id: R1
        text: Define DiffTest struct with fields Name string, Args []string, Stdin []byte, Env []string, WorkDir string, ExitCode int, Normalize []NormalizeFunc, ExpectedFiles map[string][]byte
      - id: R2
        text: Define NormalizeFunc type alias as func([]byte) []byte and declare ComposeNormalizers and TimestampNormalizer exports
      - id: R3
        text: Define RunDiffTests function signature accepting *testing.T, goBinary string, refBinary string, tests []DiffTest

    design_decisions:
      - id: D1
        text: "Primary file is difftest.go (named after the primary exported type DiffTest, not testutils.go)"
      - id: D2
        text: "Package is github.com/petar-djukic/go-unix-utils/pkg/testutils"
      - id: D3
        text: "Import constraints: must not import any cmd/ package or any other pkg/ package"
      - id: D4
        text: "All function bodies are panic(\"not implemented\") stubs -- this is a contract task, not an implementation task"

    acceptance_criteria:
      - id: AC1
        text: pkg/testutils/difftest.go compiles without errors (go build ./pkg/testutils/...)
      - id: AC2
        text: DiffTest struct is exported with all fields matching the contract signature
      - id: AC3
        text: RunDiffTests, ComposeNormalizers, and TimestampNormalizer are exported with correct signatures
      - id: AC4
        text: No imports of cmd/ or other pkg/ packages

