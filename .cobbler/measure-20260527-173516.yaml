- index: 0
  title: "[stitch] cmd/dircolors: implement srd109 R1.1, R1.2, R1.3, R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd109-dircolors.yaml (full SRD -- read all requirements R1.1 through R3.5 for overall design context)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler pattern)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests API)
      - cmd/printenv/main.go (reference cmd/ implementation pattern for a simple utility)

    files:
      - path: cmd/dircolors/main.go
        action: create
        note: dircolors utility -- main entry point, argument parsing, and R1 group implementation
      - path: cmd/dircolors/dircolors_test.go
        action: create
        note: differential tests covering R1.1 through R1.4

    requirements:
      - id: R1
        text: "Implement srd109 R1.1 -- read the SRD for the exact requirement text and acceptance criteria"
      - id: R2
        text: "Implement srd109 R1.2 -- read the SRD for the exact requirement text and acceptance criteria"
      - id: R3
        text: "Implement srd109 R1.3 -- read the SRD for the exact requirement text and acceptance criteria"
      - id: R4
        text: "Implement srd109 R1.4 -- read the SRD for the exact requirement text and acceptance criteria"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D2
        text: "Use testutils.BuildBinary and testutils.RunDiffTests for differential testing"
      - id: D3
        text: "Reference binary is gdircolors via exec.LookPath; t.Skip if not found"
      - id: D4
        text: "Set LC_ALL=C in test environment per project convention"

    acceptance_criteria:
      - id: AC1
        text: "cmd/dircolors/main.go compiles with go build -o bin/dircolors ./cmd/dircolors/"
      - id: AC2
        text: "go vet ./cmd/dircolors/ passes with no warnings"
      - id: AC3
        text: "go test ./cmd/dircolors/ -count=1 passes (tests skip gracefully if gdircolors not in PATH)"
      - id: AC4
        text: "All four SRD requirements R1.1, R1.2, R1.3, R1.4 have corresponding differential test cases in dircolors_test.go"

