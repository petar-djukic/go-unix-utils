- index: 0
  title: "cmd/true: implement true utility (srd013-true R1.1-R1.3, R2.1-R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd013-true.yaml (full SRD for true)
      - docs/ARCHITECTURE.yaml (shared_protocols section for SIGPIPE and differential testing patterns)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage pattern)

    files:
      - path: cmd/true/main.go
        action: create
        note: true utility -- exits 0, supports --help and --version

    requirements:
      - id: R1
        text: "Implement true to exit with status 0 when invoked with no arguments (srd013-true R1.1)"
      - id: R2
        text: "Exit with status 0 when invoked with any non-option arguments, ignoring them (srd013-true R1.2)"
      - id: R3
        text: "Print --help output to stdout and exit 0 when --help is passed (srd013-true R1.3)"
      - id: R4
        text: "Print --version output to stdout and exit 0 when --version is passed (srd013-true R2.1)"
      - id: R5
        text: "Call sys.InstallSIGPIPEHandler() at the start of main (srd013-true R2.2)"
      - id: R6
        text: "Match GNU true behavior: any single-dash flag (e.g. -x) is silently ignored and exits 0 (srd013-true R2.3)"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the top of main() per the shared SIGPIPE protocol"
      - id: D2
        text: "Use os.Args directly for argument parsing -- true has no flag processing beyond --help and --version"
      - id: D3
        text: "Match GNU coreutils true --help and --version output format exactly"

    acceptance_criteria:
      - id: AC1
        text: "cmd/true/main.go compiles with go build -o bin/true ./cmd/true/"
      - id: AC2
        text: "go vet ./cmd/true/ passes with no warnings"
      - id: AC3
        text: "Running bin/true with no arguments exits 0"
      - id: AC4
        text: "Running bin/true --help prints usage to stdout and exits 0"
      - id: AC5
        text: "Running bin/true --version prints version to stdout and exits 0"

- index: 1
  title: "cmd/true: differential tests (srd013-true R3.1-R3.2, R4.1-R4.3)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd013-true.yaml (full SRD for true)
      - cmd/true/main.go (implementation from previous task)
      - pkg/testutils/ (DiffTest struct and RunDiffTests function)
      - docs/ARCHITECTURE.yaml (shared_protocols section for differential testing pattern)

    files:
      - path: cmd/true/true_test.go
        action: create
        note: differential tests comparing Go true against gtrue

    requirements:
      - id: R1
        text: "Write TestDiff using testutils.BuildBinary and testutils.RunDiffTests to compare against gtrue (srd013-true R3.1)"
      - id: R2
        text: "Skip test gracefully if gtrue reference binary is not found via exec.LookPath (srd013-true R3.2)"
      - id: R3
        text: "Test no-argument invocation exits 0 with empty stdout and stderr (srd013-true R4.1)"
      - id: R4
        text: "Test --help and --version flags produce matching output (srd013-true R4.2)"
      - id: R5
        text: "Test that arbitrary arguments are silently ignored with exit 0 (srd013-true R4.3)"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary from within the test"
      - id: D2
        text: "Use exec.LookPath(\"gtrue\") and t.Skip if not found, per the graceful-skip protocol"
      - id: D3
        text: "Define test cases as []testutils.DiffTest with Name, Args, and expected ExitCode fields"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/true/... -count=1 passes (or skips if gtrue is not installed)"
      - id: AC2
        text: "Test file follows the RunDiffTests pattern from pkg/testutils"
      - id: AC3
        text: "At least 3 test cases: no args, --help, --version"
      - id: AC4
        text: "go vet ./cmd/true/ passes with no warnings"

