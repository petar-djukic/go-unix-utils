- index: 0
  title: "[stitch] Implement cmd/basenc decoding mode (srd081-basenc R2.1-R2.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd081-basenc.yaml (R2.1-R2.4 decoding mode requirements)
      - cmd/basenc/main.go (existing encoding mode implementation from R1.1-R1.4)
      - cmd/basenc/basenc_test.go (existing differential tests)
      - pkg/encutil/encutil.go (shared Decode function and DecoderConfig)

    files:
      - path: cmd/basenc/main.go
        action: modify
        note: Add --decode/-d flag handling and decoding logic for all encoding alphabets
      - path: cmd/basenc/basenc_test.go
        action: modify
        note: Add differential tests for decode mode across all supported alphabets

    requirements:
      - id: R1
        text: Implement srd081-basenc R2.1 -- add --decode/-d flag to switch basenc into decoding mode
      - id: R2
        text: Implement srd081-basenc R2.2 -- decode input using the selected encoding alphabet (base64, base64url, base32, base32hex, base16, z85)
      - id: R3
        text: Implement srd081-basenc R2.3 -- strip whitespace and newlines from input before decoding, consistent with GNU basenc behavior
      - id: R4
        text: Implement srd081-basenc R2.4 -- support --ignore-garbage flag to skip non-alphabet characters during decoding

    design_decisions:
      - id: D1
        text: Use pkg/encutil.Decode with a DecoderConfig constructed for the selected encoding alphabet. Each alphabet maps to a specific Go standard library decoder.
      - id: D2
        text: Reference binary is gbasenc from Homebrew coreutils. All differential tests compare output against gbasenc.
      - id: D3
        text: Reuse the alphabet selection logic from the existing encoding mode (R1.1-R1.4) -- the same flag determines both the encoder and decoder.

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/basenc/ succeeds with no errors"
      - id: AC2
        text: "go test ./cmd/basenc/... -count=1 passes all differential tests including new decode-mode tests"
      - id: AC3
        text: Decoding differential tests cover all six encoding alphabets (base64, base64url, base32, base32hex, base16, z85)
      - id: AC4
        text: "go vet ./cmd/basenc/ reports no issues"

- index: 1
  title: "[stitch] Implement cmd/basenc error handling and multi-file support (srd081-basenc R3.1-R3.4)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd081-basenc.yaml (R3.1-R3.4 error handling requirements)
      - cmd/basenc/main.go (existing encoding and decoding implementation from R1.1-R2.4)
      - cmd/basenc/basenc_test.go (existing differential tests)
      - pkg/encutil/encutil.go (shared OpenInput and error handling)

    files:
      - path: cmd/basenc/main.go
        action: modify
        note: Add error handling, multi-file support, and edge case handling
      - path: cmd/basenc/basenc_test.go
        action: modify
        note: Add differential tests for error cases and multi-file input

    requirements:
      - id: R1
        text: Implement srd081-basenc R3.1 -- handle invalid input during decoding with appropriate error messages and exit code
      - id: R2
        text: Implement srd081-basenc R3.2 -- support reading from file arguments in addition to stdin
      - id: R3
        text: Implement srd081-basenc R3.3 -- handle multiple file arguments by concatenating input
      - id: R4
        text: Implement srd081-basenc R3.4 -- treat "-" as stdin in the file argument list

    design_decisions:
      - id: D1
        text: Use pkg/encutil.OpenInput to handle file vs stdin selection. OpenInput returns an io.ReadCloser for either a filename or "-" (stdin).
      - id: D2
        text: Reference binary is gbasenc from Homebrew coreutils. Error message format and exit codes must match gbasenc behavior.

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/basenc/ succeeds with no errors"
      - id: AC2
        text: "go test ./cmd/basenc/... -count=1 passes all differential tests including new error and multi-file tests"
      - id: AC3
        text: Differential tests include invalid decode input, missing file arguments, and multi-file concatenation
      - id: AC4
        text: "go vet ./cmd/basenc/ reports no issues"

- index: 2
  title: "[stitch] Implement cmd/link core functionality (srd084-link R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd084-link.yaml (R1.1-R1.4 core requirements)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern)
      - cmd/unlink/main.go (similar simple utility for reference pattern)
      - cmd/unlink/unlink_test.go (differential test pattern for reference)

    files:
      - path: cmd/link/main.go
        action: create
        note: link utility -- creates a hard link via link(2) system call
      - path: cmd/link/link_test.go
        action: create
        note: Differential tests comparing against glink

    requirements:
      - id: R1
        text: Implement srd084-link R1.1 -- create a hard link from the first argument (source) to the second argument (target) using the link(2) system call
      - id: R2
        text: Implement srd084-link R1.2 -- exit with status 0 on success
      - id: R3
        text: Implement srd084-link R1.3 -- support --help flag that prints usage and exits with status 0
      - id: R4
        text: Implement srd084-link R1.4 -- support --version flag that prints version and exits with status 0

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior.
      - id: D2
        text: Reference binary is glink from Homebrew coreutils. Differential tests compare stdout, stderr, and exit code against glink.
      - id: D3
        text: Use exec.LookPath("glink") and t.Skip if the reference binary is not found, following the project differential testing pattern.

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/link ./cmd/link/ succeeds with no errors"
      - id: AC2
        text: "go test ./cmd/link/... -count=1 passes all differential tests"
      - id: AC3
        text: Differential tests verify successful hard link creation with two valid arguments
      - id: AC4
        text: "go vet ./cmd/link/ reports no issues"

- index: 3
  title: "[stitch] Implement cmd/link error handling (srd084-link R2.1-R2.3)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd084-link.yaml (R2.1-R2.3 error handling requirements)
      - cmd/link/main.go (existing core implementation from R1.1-R1.4)
      - cmd/link/link_test.go (existing differential tests)

    files:
      - path: cmd/link/main.go
        action: modify
        note: Add error handling for invalid arguments and link failures
      - path: cmd/link/link_test.go
        action: modify
        note: Add differential tests for error cases

    requirements:
      - id: R1
        text: Implement srd084-link R2.1 -- exit with status 1 and print error to stderr when argument count is not exactly 2
      - id: R2
        text: Implement srd084-link R2.2 -- exit with status 1 and print error to stderr when the link(2) system call fails
      - id: R3
        text: Implement srd084-link R2.3 -- error message format matches GNU link output (e.g., "link: cannot create link 'target' to 'source': ...")

    design_decisions:
      - id: D1
        text: Error messages must match GNU glink format exactly. Run glink with invalid inputs to verify the error prefix and structure.
      - id: D2
        text: Reference binary is glink from Homebrew coreutils. Error-case differential tests compare stderr and exit code against glink.

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/link ./cmd/link/ succeeds with no errors"
      - id: AC2
        text: "go test ./cmd/link/... -count=1 passes all differential tests including error cases"
      - id: AC3
        text: Differential tests cover wrong argument count (0, 1, 3+ args), nonexistent source file, and existing target file
      - id: AC4
        text: "go vet ./cmd/link/ reports no issues"