- index: 0
  title: "[stitch] cmd/fmt (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd070-fmt.yaml (full SRD -- read all requirements to define complete contract)
      - cmd/cat/main.go (reference pattern for a cmd/ utility with flag parsing and stdin/file processing)
      - pkg/sys/sigpipe.go (SIGPIPE handler used by all cmd/ utilities)

    files:
      - path: cmd/fmt/main.go
        action: create
        note: "fmt utility contract -- main function, flag definitions, and function stubs for all operations"

    requirements:
      - id: R1
        text: "Create cmd/fmt/main.go with the complete program skeleton per srd070-fmt R1.1. Define main() with sys.InstallSIGPIPEHandler(), parse all flags described in the SRD (width -w, goal -g, split-only -s, crown-margin -c, tagged-paragraph -t, prefix -p, uniform-spacing -u), and define function stubs (with TODO bodies that print 'not implemented' and exit 1) for all major operations: paragraph detection, line filling/wrapping, crown-margin handling, tagged-paragraph handling, prefix filtering, and uniform spacing. The contract must compile but is not expected to produce correct output."

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project SIGPIPE protocol"
      - id: D2
        text: "Process files from command-line arguments or stdin when no arguments given, following the standard coreutils input pattern"
      - id: D3
        text: "Use flag package or manual os.Args parsing consistent with other cmd/ packages in this repo"

    acceptance_criteria:
      - id: AC1
        text: "cmd/fmt/main.go exists and compiles with go build ./cmd/fmt/"
      - id: AC2
        text: "All flags from the SRD are declared and parsed in main"
      - id: AC3
        text: "Function stubs exist for each major operation identified in the SRD"
      - id: AC4
        text: "go vet ./cmd/fmt/ passes with no errors"

- index: 1
  title: "[stitch] cmd/join: srd069 R2.1-R2.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd069-join.yaml (full SRD -- focus on requirements R2.1 through R2.4)
      - cmd/join/main.go (existing contract with function stubs to fill in)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function for differential testing)

    files:
      - path: cmd/join/main.go
        action: modify
        note: "Implement srd069 R2.1-R2.4 by replacing function stubs with working code"
      - path: cmd/join/join_test.go
        action: create
        note: "Differential tests for R2.1-R2.4 using pkg/testutils.RunDiffTests against gjoin"

    requirements:
      - id: R1
        text: "Implement srd069-join R2.1 per the SRD. Read the requirement text from the SRD and implement the specified behavior."
      - id: R2
        text: "Implement srd069-join R2.2 per the SRD. Read the requirement text from the SRD and implement the specified behavior."
      - id: R3
        text: "Implement srd069-join R2.3 per the SRD. Read the requirement text from the SRD and implement the specified behavior."
      - id: R4
        text: "Implement srd069-join R2.4 per the SRD. Read the requirement text from the SRD and implement the specified behavior."

    design_decisions:
      - id: D1
        text: "Preserve the existing function signatures and types from the contract in cmd/join/main.go. Fill in stub bodies rather than restructuring."
      - id: D2
        text: "Use pkg/testutils.RunDiffTests with reference binary gjoin (exec.LookPath). Skip tests if gjoin is not found."
      - id: D3
        text: "Set LC_ALL=C in test environment (via DiffTest.Env) per project locale handling convention"
      - id: D4
        text: "Create temporary test fixture files in t.TempDir() for two-file join input scenarios"

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/join/ succeeds"
      - id: AC2
        text: "go test ./cmd/join/ -count=1 passes (skipping gracefully if gjoin not in PATH)"
      - id: AC3
        text: "go vet ./cmd/join/ passes with no errors"
      - id: AC4
        text: "Differential tests in join_test.go cover all behaviors specified in srd069 R2.1-R2.4"

