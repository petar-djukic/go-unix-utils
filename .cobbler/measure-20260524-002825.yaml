- index: 0
  title: "[stitch] Implement cmd/who extended session display (srd097 R2.1, R2.2, R2.3, R2.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd097-who.yaml (R2.1-R2.4 requirement definitions)
      - cmd/who/main.go (existing core implementation from R1.1-R1.4)
      - cmd/who/who_test.go (existing differential tests)
      - pkg/sys/ (system call abstractions for file metadata)

    files:
      - path: cmd/who/main.go
        action: modify
        note: Extend who implementation with R2.1-R2.4 features
      - path: cmd/who/who_test.go
        action: modify
        note: Add differential test cases for R2.1-R2.4

    requirements:
      - id: R1
        text: Implement srd097-who R2.1 per the SRD specification
      - id: R2
        text: Implement srd097-who R2.2 per the SRD specification
      - id: R3
        text: Implement srd097-who R2.3 per the SRD specification
      - id: R4
        text: Implement srd097-who R2.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Use pkg/testutils.RunDiffTests to compare against gwho reference binary
      - id: D2
        text: Call exec.LookPath("gwho") and t.Skip if reference binary not found
      - id: D3
        text: Set LC_ALL=C in test environment for deterministic output comparison

    acceptance_criteria:
      - id: AC1
        text: All R2.1-R2.4 behaviors from srd097-who.yaml are implemented in cmd/who/main.go
      - id: AC2
        text: "go build ./cmd/who/ compiles without errors"
      - id: AC3
        text: "go test ./cmd/who/ -count=1 passes"
      - id: AC4
        text: Differential tests against gwho pass for all R2.x features

