- index: 0
  title: "cmd/nproc: error handling and edge cases (srd046-nproc R2.1-R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd046-nproc.yaml (nproc SRD -- implement requirements R2.1, R2.2, R2.3)
      - cmd/nproc/main.go (existing core implementation covering R1.1-R1.4)

    files:
      - path: cmd/nproc/main.go
        action: modify
        note: Add error handling and remaining behaviors specified in SRD R2.1-R2.3

    requirements:
      - id: R1
        text: "Implement srd046-nproc R2.1 per the SRD specification"
      - id: R2
        text: "Implement srd046-nproc R2.2 per the SRD specification"
      - id: R3
        text: "Implement srd046-nproc R2.3 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Preserve the existing R1.1-R1.4 implementation unchanged; add R2.x behaviors without breaking existing functionality"
      - id: D2
        text: "Error messages go to stderr; match GNU nproc error message format and exit codes"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/nproc ./cmd/nproc/ compiles without errors"
      - id: AC2
        text: "srd046-nproc R2.1 behavior is implemented and functional"
      - id: AC3
        text: "srd046-nproc R2.2 behavior is implemented and functional"
      - id: AC4
        text: "srd046-nproc R2.3 behavior is implemented and functional"
      - id: AC5
        text: "go vet ./cmd/nproc/ reports no issues"

- index: 1
  title: "cmd/arch: differential tests (srd045-arch R3.1-R3.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd045-arch.yaml (arch SRD -- implement requirements R3.1, R3.2, R3.3)
      - cmd/arch/main.go (existing arch implementation)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function for differential testing)

    files:
      - path: cmd/arch/arch_test.go
        action: create
        note: Differential tests comparing Go arch binary against garch reference binary

    requirements:
      - id: R1
        text: "Implement srd045-arch R3.1 per the SRD specification"
      - id: R2
        text: "Implement srd045-arch R3.2 per the SRD specification"
      - id: R3
        text: "Implement srd045-arch R3.3 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile cmd/arch and exec.LookPath(\"garch\") for the Homebrew GNU reference binary"
      - id: D2
        text: "Call t.Skip if garch is not found in PATH so tests pass on machines without Homebrew GNU coreutils"
      - id: D3
        text: "Set LC_ALL=C in the test environment per project differential testing convention"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/arch/... -count=1 compiles and runs without build errors"
      - id: AC2
        text: "TestDiff function follows the project differential testing pattern using testutils.BuildBinary and exec.LookPath"
      - id: AC3
        text: "Tests skip gracefully with t.Skip when garch is not installed"
      - id: AC4
        text: "go vet ./cmd/arch/ reports no issues"

