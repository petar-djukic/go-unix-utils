- index: 0
  title: "cmd/echo: implement srd020-echo R4.2, R4.3"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd020-echo.yaml (SRD for echo -- focus on R4.2 and R4.3)
      - cmd/echo/main.go (existing echo implementation to extend)
      - cmd/echo/echo_test.go (existing echo test file to extend)
      - pkg/testutils/ (differential testing harness -- DiffTest, RunDiffTests, BuildBinary)

    files:
      - path: cmd/echo/main.go
        action: modify
        note: Extend echo implementation to satisfy srd020-echo R4.2 and R4.3
      - path: cmd/echo/echo_test.go
        action: modify
        note: Add differential test cases covering R4.2 and R4.3

    requirements:
      - id: R1
        text: "Implement srd020-echo R4.2 per the SRD specification"
      - id: R2
        text: "Implement srd020-echo R4.3 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Follow the differential testing pattern: testutils.BuildBinary(t, \".\") for the Go binary, exec.LookPath(\"gecho\") for the GNU reference binary, and testutils.RunDiffTests to compare stdout, stderr, and exit code"
      - id: D2
        text: "Maintain the existing sys.InstallSIGPIPEHandler() call at the start of main"
      - id: D3
        text: "Set LC_ALL=C in all differential test environments"

    acceptance_criteria:
      - id: AC1
        text: "srd020-echo R4.2 implemented and covered by at least one differential test case"
      - id: AC2
        text: "srd020-echo R4.3 implemented and covered by at least one differential test case"
      - id: AC3
        text: "go build ./cmd/echo/ succeeds with no errors"
      - id: AC4
        text: "go vet ./cmd/echo/... passes"
      - id: AC5
        text: "go test ./cmd/echo/... -count=1 passes (or skips gracefully if gecho not found)"

- index: 1
  title: "cmd/tac: implement srd021-tac R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd021-tac.yaml (SRD for tac -- focus on requirement group R1: R1.1, R1.2, R1.3, R1.4)
      - pkg/sys/ (SIGPIPE handler -- InstallSIGPIPEHandler)
      - pkg/testutils/ (differential testing harness -- DiffTest, RunDiffTests, BuildBinary)
      - cmd/basename/main.go (reference pattern for a simple cmd/ utility)

    files:
      - path: cmd/tac/main.go
        action: create
        note: Initial tac implementation covering srd021-tac R1.1 through R1.4
      - path: cmd/tac/tac_test.go
        action: create
        note: Differential test file with TestDiff scaffolding and test cases for R1.1-R1.4

    requirements:
      - id: R1
        text: "Implement srd021-tac R1.1 per the SRD specification"
      - id: R2
        text: "Implement srd021-tac R1.2 per the SRD specification"
      - id: R3
        text: "Implement srd021-tac R1.3 per the SRD specification"
      - id: R4
        text: "Implement srd021-tac R1.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior"
      - id: D2
        text: "Use the differential testing pattern: testutils.BuildBinary(t, \".\") for the Go binary, exec.LookPath(\"gtac\") for the GNU reference binary, t.Skip if not found, and testutils.RunDiffTests to compare"
      - id: D3
        text: "Build with go build -o bin/tac ./cmd/tac/ -- the bin/ directory is git-ignored"
      - id: D4
        text: "Set LC_ALL=C in all differential test environments"

    acceptance_criteria:
      - id: AC1
        text: "srd021-tac R1.1 through R1.4 functionality implemented in cmd/tac/main.go"
      - id: AC2
        text: "Differential tests in cmd/tac/tac_test.go cover R1.1 through R1.4"
      - id: AC3
        text: "go build -o bin/tac ./cmd/tac/ succeeds with no errors"
      - id: AC4
        text: "go vet ./cmd/tac/... passes"
      - id: AC5
        text: "go test ./cmd/tac/... -count=1 passes (or skips gracefully if gtac not found)"

