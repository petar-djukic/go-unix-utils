      - id: R4
        text: Implement srd029-comm requirement R1.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Create cmd/comm/main.go with a main function that calls sys.InstallSIGPIPEHandler() at the start, per project SIGPIPE convention.
      - id: D2
        text: Use the differential testing pattern with pkg/testutils.RunDiffTests against the gcomm reference binary (exec.LookPath("gcomm")). Skip tests if not found.
      - id: D3
        text: Build the binary in tests using testutils.BuildBinary(t, "."). Build output goes to bin/ directory.
      - id: D4
        text: Structure the implementation to accept later extension for R2.x through R4.x requirements without rewriting core logic.

    acceptance_criteria:
      - id: AC1
        text: cmd/comm/main.go exists and implements R1.1-R1.4 from srd029-comm
      - id: AC2
        text: cmd/comm/comm_test.go exists with differential test cases for each implemented requirement
      - id: AC3
        text: go build ./cmd/comm/ succeeds with no errors
      - id: AC4
        text: go test ./cmd/comm/ -count=1 passes (or skips gracefully if gcomm is not installed)
      - id: AC5
        text: sys.InstallSIGPIPEHandler() is called at the start of main()

