- index: 0
  title: "[stitch] cmd/expr: srd066 R2.1-R2.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd066-expr.yaml (requirement group R2 -- the requirements to implement)
      - cmd/expr/main.go (existing implementation from earlier requirement groups R1.1-R1.4)
      - cmd/expr/expr_test.go (existing differential tests)
      - docs/ARCHITECTURE.yaml (shared protocols section -- differential testing pattern and SIGPIPE handling)

    files:
      - path: cmd/expr/main.go
        action: modify
        note: Add functionality for srd066-expr requirements R2.1, R2.2, R2.3, R2.4
      - path: cmd/expr/expr_test.go
        action: modify
        note: Add differential test cases covering R2.1-R2.4

    requirements:
      - id: R1
        text: Implement srd066-expr requirement R2.1 per the SRD specification
      - id: R2
        text: Implement srd066-expr requirement R2.2 per the SRD specification
      - id: R3
        text: Implement srd066-expr requirement R2.3 per the SRD specification
      - id: R4
        text: Implement srd066-expr requirement R2.4 per the SRD specification

    design_decisions:
      - id: D1
        text: "Follow the differential testing pattern: use testutils.BuildBinary(t, \".\") for the Go binary and exec.LookPath(\"gexpr\") for the GNU reference binary. Skip with t.Skip if reference binary not found."
      - id: D2
        text: "Preserve all existing functionality from R1.1-R1.4. Do not remove or alter behavior implemented by earlier requirement groups."
      - id: D3
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the shared SIGPIPE protocol."

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/expr ./cmd/expr/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/expr/... reports no issues"
      - id: AC3
        text: "go test ./cmd/expr/... -count=1 passes (including new tests for R2.1-R2.4)"
      - id: AC4
        text: "All four requirements R2.1, R2.2, R2.3, R2.4 from srd066-expr are implemented"
      - id: AC5
        text: "Existing tests from earlier requirement groups continue to pass"

