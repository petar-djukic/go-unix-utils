      - id: R2
        text: Implement srd096 R1.2 -- sort names alphabetically and print as a space-separated single line to stdout
      - id: R3
        text: Implement srd096 R1.3 -- accept an optional utmpx file argument to read from a specified file instead of the system default

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main per project shared protocol
      - id: D2
        text: Use the utmpx C API via cgo or the Go syscall interface to read login records, matching GNU users behavior on Darwin

    acceptance_criteria:
      - id: AC1
        text: cmd/users/main.go compiles with go build -o bin/users ./cmd/users/
      - id: AC2
        text: go vet ./cmd/users/ reports no errors
      - id: AC3
        text: Binary prints space-separated sorted login names of currently logged-in users
      - id: AC4
        text: All three srd096 R1.x requirements are addressed in the implementation

