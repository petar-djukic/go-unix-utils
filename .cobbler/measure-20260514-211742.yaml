    required_reading:
      - docs/specs/software-requirements/srd049-realpath.yaml (full SRD for realpath)
      - pkg/sys/sys.go (InstallSIGPIPEHandler and file metadata)
      - pkg/testutils/ (differential testing pattern -- RunDiffTests, BuildBinary, DiffTest struct)

    files:
      - path: cmd/realpath/main.go
        action: create
        note: Main implementation of realpath covering R1.1 through R1.4
      - path: cmd/realpath/realpath_test.go
        action: create
        note: Differential tests against grealpath for R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd049-realpath requirement R1.1 per the SRD specification
      - id: R2
        text: Implement srd049-realpath requirement R1.2 per the SRD specification
      - id: R3
        text: Implement srd049-realpath requirement R1.3 per the SRD specification
      - id: R4
        text: Implement srd049-realpath requirement R1.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at start of main per project SIGPIPE protocol
      - id: D2
        text: Use testutils.BuildBinary(t, ".") and exec.LookPath("grealpath") for differential testing
      - id: D3
        text: Skip tests with t.Skip if grealpath reference binary not found in PATH
      - id: D4
        text: Set LC_ALL=C in test environment per project differential testing protocol
      - id: D5
        text: Use flag or manual argument parsing as specified in the SRD -- do not use third-party CLI libraries

    acceptance_criteria:
      - id: AC1
        text: cmd/realpath/main.go created with R1.1-R1.4 behavior implemented per SRD
      - id: AC2
        text: cmd/realpath/realpath_test.go created with differential test cases for R1.1-R1.4
      - id: AC3
        text: go build ./cmd/realpath/ succeeds with no errors
      - id: AC4
        text: go vet ./cmd/realpath/ reports no issues
      - id: AC5
        text: go test ./cmd/realpath/ -count=1 passes (or skips gracefully if grealpath not in PATH)

