- index: 0
  title: "[stitch] cmd/pr -- srd110-pr R5.1, R5.2"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd110-pr.yaml (R5 requirement group -- R5.1 and R5.2)
      - cmd/pr/main.go (existing implementation from prior requirement groups)
      - cmd/pr/pr_test.go (existing differential tests)
      - pkg/testutils/ (RunDiffTests harness and DiffTest struct)
      - pkg/sys/ (InstallSIGPIPEHandler)

    files:
      - path: cmd/pr/main.go
        action: modify
        note: Add R5.1 and R5.2 functionality to existing pr implementation
      - path: cmd/pr/pr_test.go
        action: modify
        note: Add differential test cases exercising R5.1 and R5.2

    requirements:
      - id: R1
        text: Implement srd110-pr requirement R5.1 per the SRD specification
      - id: R2
        text: Implement srd110-pr requirement R5.2 per the SRD specification

    design_decisions:
      - id: D1
        text: Extend the existing cmd/pr implementation -- do not rewrite or restructure code from prior requirement groups
      - id: D2
        text: Verify behavior via pkg/testutils.RunDiffTests against the gpr reference binary (Homebrew GNU coreutils)
      - id: D3
        text: Set LC_ALL=C in all differential test cases per project convention

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/pr/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/pr/ reports no issues"
      - id: AC3
        text: "go test ./cmd/pr/... -count=1 passes (when gpr is available)"
      - id: AC4
        text: Differential tests for R5.1 confirm output parity with gpr on exit code, stdout, and stderr
      - id: AC5
        text: Differential tests for R5.2 confirm output parity with gpr on exit code, stdout, and stderr

