- index: 0
  title: "[stitch] cmd/arch: core implementation and error handling (srd045-arch R1.1-R1.2, R2.1-R2.2)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd045-arch.yaml (full SRD for arch)
      - pkg/sys/ (InstallSIGPIPEHandler usage and existing syscall wrappers)
      - docs/ARCHITECTURE.yaml (shared protocols and import constraints)

    files:
      - path: cmd/arch/main.go
        action: create
        note: arch utility -- prints machine hardware name to stdout

    requirements:
      - id: R1
        text: "Implement srd045-arch R1.1 -- print the machine hardware name to stdout"
      - id: R2
        text: "Implement srd045-arch R1.2 -- output formatting and newline termination"
      - id: R3
        text: "Implement srd045-arch R2.1 -- --help flag prints usage to stdout and exits 0"
      - id: R4
        text: "Implement srd045-arch R2.2 -- --version flag prints version to stdout and exits 0"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at start of main per shared protocol"
      - id: D2
        text: "Per architecture, cmd/ packages must not import golang.org/x/sys directly -- route platform syscalls through pkg/sys or use Go standard library"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/arch ./cmd/arch/ succeeds without errors"
      - id: AC2
        text: "go vet ./cmd/arch/ reports no issues"
      - id: AC3
        text: "bin/arch prints the machine hardware name followed by a newline"
      - id: AC4
        text: "bin/arch --help prints usage information and exits 0"
      - id: AC5
        text: "bin/arch --version prints version information and exits 0"

