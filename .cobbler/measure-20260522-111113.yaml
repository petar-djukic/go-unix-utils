- index: 0
  title: "[stitch] cmd/fmt: srd070 R2.1-R5.1"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd070-fmt.yaml (full SRD -- read all requirements, focus on R2.1, R3.1, R4.1, R5.1)
      - pkg/sys/ (SIGPIPE handler via InstallSIGPIPEHandler)
      - pkg/testutils/ (differential testing framework -- DiffTest, RunDiffTests, BuildBinary)

    files:
      - path: cmd/fmt/main.go
        action: create
        note: fmt utility -- paragraph reformatting to specified width
      - path: cmd/fmt/fmt_test.go
        action: create
        note: differential tests against gfmt reference binary

    requirements:
      - id: R1
        text: "Implement srd070 R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd070 R3.1 as specified in the SRD"
      - id: R3
        text: "Implement srd070 R4.1 as specified in the SRD"
      - id: R4
        text: "Implement srd070 R5.1 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at start of main per shared SIGPIPE protocol"
      - id: D2
        text: "Use testutils.RunDiffTests with gfmt as reference binary from Homebrew coreutils"
      - id: D3
        text: "Set LC_ALL=C in all differential test cases"
      - id: D4
        text: "Call exec.LookPath for gfmt and t.Skip if not found per graceful skip protocol"
      - id: D5
        text: "Build binary with testutils.BuildBinary(t, \".\") from within cmd/fmt/ test"

    acceptance_criteria:
      - id: AC1
        text: "cmd/fmt/main.go compiles with go build -o bin/fmt ./cmd/fmt/"
      - id: AC2
        text: "go vet ./cmd/fmt/ reports no issues"
      - id: AC3
        text: "go test ./cmd/fmt/ -count=1 passes (or skips if gfmt not found)"
      - id: AC4
        text: "Differential tests cover all four requirements (R2.1, R3.1, R4.1, R5.1)"

