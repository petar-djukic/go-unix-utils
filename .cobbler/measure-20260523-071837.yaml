- index: 0
  title: "cmd/base32 implementation -- srd079-base32 R1.1, R1.2, R1.3, R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd079-base32.yaml (SRD for base32 -- read requirements R1.1 through R1.4)
      - docs/specs/software-requirements/srd088-encutil.yaml (shared encoding library SRD -- understand the Encode/Decode/OpenInput API)
      - pkg/encutil/ (read all .go files to understand the encoding utility API: EncoderConfig, DecoderConfig, Encode, Decode, OpenInput)
      - pkg/sys/ (read for InstallSIGPIPEHandler signature)

    files:
      - path: cmd/base32/main.go
        action: create
        note: base32 utility entry point implementing srd079-base32 R1.1-R1.4

    requirements:
      - id: R1
        text: "Implement srd079-base32 R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd079-base32 R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd079-base32 R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd079-base32 R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Use pkg/encutil.Encode with an EncoderConfig for Base32 encoding and pkg/encutil.OpenInput for stdin/file input handling"
      - id: D2
        text: "Call pkg/sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils behavior"
      - id: D3
        text: "Use encoding/base32.StdEncoding from the Go standard library as the Base32 alphabet for the EncoderConfig.Encode function"
      - id: D4
        text: "The binary is cmd/base32 and the single source file is cmd/base32/main.go"

    acceptance_criteria:
      - id: AC1
        text: "cmd/base32/main.go compiles without errors: go build ./cmd/base32/"
      - id: AC2
        text: "go vet ./cmd/base32/ passes with no warnings"
      - id: AC3
        text: "srd079-base32 requirements R1.1, R1.2, R1.3, and R1.4 are implemented as specified in the SRD"
      - id: AC4
        text: "SIGPIPE handler is installed at the start of main"

