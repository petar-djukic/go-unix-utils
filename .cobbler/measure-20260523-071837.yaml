- index: 3
  title: "cmd/base32 differential tests -- srd079-base32"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd079-base32.yaml (SRD for base32 -- derive test cases from all requirements R1.1 through R3.3)
      - docs/specs/use-cases/rel09.1-uc001-base32.yaml (use case for base32 -- understand expected end-to-end behavior)
      - docs/specs/test-suites/test-rel-09.1.yaml (test suite for release 09.1 -- follow specified test cases if present)
      - cmd/base32/main.go (implementation to test)
      - pkg/testutils/ (read all .go files for the DiffTest struct, RunDiffTests, and BuildBinary API)

    files:
      - path: cmd/base32/base32_test.go
        action: create
        note: Differential tests for base32 comparing Go binary against gbase32

    requirements:
      - id: R1
        text: "Create TestDiff function using pkg/testutils.BuildBinary and pkg/testutils.RunDiffTests following the project differential testing pattern"
      - id: R2
        text: "Include DiffTest cases covering encoding mode (srd079-base32 R1.x requirements)"
      - id: R3
        text: "Include DiffTest cases covering decode mode and options (srd079-base32 R2.x requirements)"
      - id: R4
        text: "Include DiffTest cases covering error handling and edge cases (srd079-base32 R3.x requirements)"

    design_decisions:
      - id: D1
        text: "Use exec.LookPath('gbase32') to find the GNU reference binary and t.Skip if not found"
      - id: D2
        text: "Set LC_ALL=C in the test environment via DiffTest.Env to ensure consistent output between Go and reference binaries"
      - id: D3
        text: "Follow the differential testing pattern from CLAUDE.md: BuildBinary(t, '.'), LookPath, []DiffTest, RunDiffTests"

    acceptance_criteria:
      - id: AC1
        text: "cmd/base32/base32_test.go compiles: go vet ./cmd/base32/"
      - id: AC2
        text: "Tests pass when gbase32 is available: go test ./cmd/base32/ -count=1"
      - id: AC3
        text: "Tests skip gracefully when gbase32 is not in PATH"
      - id: AC4
        text: "Test cases cover all three requirement groups (R1.x encoding, R2.x decode/options, R3.x errors)"