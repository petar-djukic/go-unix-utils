- index: 0
  title: "[stitch] cmd/mkdir error diagnostics and version/help (srd034 R4.1, R4.2, R4.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd034-mkdir.yaml (requirements R4.1, R4.2, R4.3)
      - cmd/mkdir/main.go (existing implementation -- R1 through R3 already complete)
      - cmd/mkdir/mkdir_test.go (existing differential tests)
      - pkg/testutils/ (DiffTest struct and RunDiffTests pattern)

    files:
      - path: cmd/mkdir/main.go
        action: modify
        note: Add R4.1, R4.2, R4.3 functionality
      - path: cmd/mkdir/mkdir_test.go
        action: modify
        note: Add differential test cases exercising R4.1, R4.2, R4.3

    requirements:
      - id: R1
        text: Implement srd034 R4.1 per the SRD specification
      - id: R2
        text: Implement srd034 R4.2 per the SRD specification
      - id: R3
        text: Implement srd034 R4.3 per the SRD specification

    design_decisions:
      - id: D1
        text: Use the differential testing pattern from pkg/testutils -- compare output against gmkdir reference binary via RunDiffTests
      - id: D2
        text: Call sys.InstallSIGPIPEHandler() at start of main per project convention
      - id: D3
        text: Skip differential tests if gmkdir reference binary is not in PATH via exec.LookPath and t.Skip
      - id: D4
        text: Build the Go binary under test with testutils.BuildBinary(t, ".")

    acceptance_criteria:
      - id: AC1
        text: srd034 R4.1 acceptance criteria pass per SRD
      - id: AC2
        text: srd034 R4.2 acceptance criteria pass per SRD
      - id: AC3
        text: srd034 R4.3 acceptance criteria pass per SRD
      - id: AC4
        text: go build ./cmd/mkdir/ compiles without errors
      - id: AC5
        text: go test ./cmd/mkdir/... -count=1 passes

