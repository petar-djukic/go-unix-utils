- index: 0
  title: "[stitch] srd041-id R2.2, R2.3, R2.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd041-id.yaml (requirements R2.2, R2.3, R2.4)
      - cmd/id/main.go (existing implementation covering R1.1, R1.2, R1.3, R2.1)
      - cmd/id/id_test.go (existing differential tests)
      - pkg/testutils/ (differential testing harness API)

    files:
      - path: cmd/id/main.go
        action: modify
        note: Extend id implementation with R2.2, R2.3, R2.4 functionality
      - path: cmd/id/id_test.go
        action: modify
        note: Add differential test cases for R2.2, R2.3, R2.4

    requirements:
      - id: R1
        text: "Implement srd041-id requirement R2.2 -- read the SRD for the full requirement text and acceptance criteria"
      - id: R2
        text: "Implement srd041-id requirement R2.3 -- read the SRD for the full requirement text and acceptance criteria"
      - id: R3
        text: "Implement srd041-id requirement R2.4 -- read the SRD for the full requirement text and acceptance criteria"

    design_decisions:
      - id: D1
        text: "Follow the differential testing shared protocol: build the Go binary with testutils.BuildBinary(t, \".\"), locate the reference binary with exec.LookPath(\"gid\"), skip if not found, and compare outputs with testutils.RunDiffTests."
      - id: D2
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the SIGPIPE shared protocol."
      - id: D3
        text: "Extend the existing code structure from R1.1-R2.1 without restructuring. Add new flag handling and output logic alongside existing implementations."

    acceptance_criteria:
      - id: AC1
        text: "srd041-id requirements R2.2, R2.3, R2.4 are implemented in cmd/id/main.go"
      - id: AC2
        text: "Differential test cases covering R2.2, R2.3, R2.4 are added to cmd/id/id_test.go"
      - id: AC3
        text: "go build -o bin/id ./cmd/id/ succeeds with no errors"
      - id: AC4
        text: "go test ./cmd/id/ -count=1 passes (or skips gracefully if reference binary gid is not found)"
      - id: AC5
        text: "go vet ./cmd/id/ reports no issues"

