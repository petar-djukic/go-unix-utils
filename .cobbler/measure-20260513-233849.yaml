- index: 1
  title: "[stitch] cmd/yes: core repeated output and SIGPIPE (srd012-yes R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd012-yes.yaml (R1.1-R1.4 requirements)
      - cmd/basename/main.go (reference for cmd/ package structure and SIGPIPE pattern)
      - cmd/basename/basename_test.go (reference for differential testing pattern)
      - pkg/sys/ (InstallSIGPIPEHandler function)
      - pkg/testutils/ (BuildBinary and RunDiffTests functions)

    files:
      - path: cmd/yes/main.go
        action: create
        note: Initial yes implementation with core output loop
      - path: cmd/yes/yes_test.go
        action: create
        note: Differential tests against gyes reference binary

    requirements:
      - id: R1
        text: Implement srd012-yes R1.1 per the SRD specification
      - id: R2
        text: Implement srd012-yes R1.2 per the SRD specification
      - id: R3
        text: Implement srd012-yes R1.3 per the SRD specification
      - id: R4
        text: Implement srd012-yes R1.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils behavior when piped to consumers that close stdin early
      - id: D2
        text: Use testutils.BuildBinary(t, ".") and testutils.RunDiffTests to compare against gyes reference binary
      - id: D3
        text: Call exec.LookPath("gyes") and t.Skip if the reference binary is not found
      - id: D4
        text: Package is github.com/petar-djukic/go-unix-utils/cmd/yes

    acceptance_criteria:
      - id: AC1
        text: All R1.1-R1.4 requirements from srd012-yes are implemented
      - id: AC2
        text: Differential tests pass against gyes for the R1.x requirements
      - id: AC3
        text: go build ./cmd/yes/ compiles without errors
      - id: AC4
        text: go test ./cmd/yes/ -count=1 passes (or skips if gyes is absent)

