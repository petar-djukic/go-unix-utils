- index: 0
  title: "[stitch] cmd/date: srd060 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd060-date.yaml (full SRD -- implement requirements R1.1 through R1.4)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern used by all cmd/ utilities)
      - pkg/testutils/difftest.go (DiffTest and RunDiffTests API for differential testing)
      - CLAUDE.md (project build and test conventions)

    files:
      - path: cmd/date/main.go
        action: create
        note: date utility -- initial structure implementing srd060 R1.1-R1.4
      - path: cmd/date/date_test.go
        action: create
        note: differential test scaffolding for date against gdate reference binary

    requirements:
      - id: R1
        text: "Implement srd060-date requirement R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd060-date requirement R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd060-date requirement R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd060-date requirement R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention for all cmd/ utilities"
      - id: D2
        text: "Reference binary for differential testing is gdate (GNU date installed via Homebrew)"
      - id: D3
        text: "Use exec.LookPath(\"gdate\") and t.Skip if not found, per project differential testing pattern"
      - id: D4
        text: "Set LC_ALL=C in differential test environment per project convention"

    acceptance_criteria:
      - id: AC1
        text: "cmd/date/main.go compiles without errors: go vet ./cmd/date/... passes"
      - id: AC2
        text: "go build -o bin/date ./cmd/date/ produces a working binary"
      - id: AC3
        text: "Requirements R1.1 through R1.4 from srd060-date.yaml are fully implemented"
      - id: AC4
        text: "Differential tests covering R1.1-R1.4 functionality pass against gdate reference binary"

