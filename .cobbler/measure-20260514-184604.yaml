- index: 2
  title: "[stitch] cmd/logname: features implementation (srd053-logname R1.1-R2.2)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd053-logname.yaml (requirements R1.1, R1.2, R2.1, R2.2)
      - pkg/testutils/ (differential testing harness -- DiffTest, RunDiffTests, BuildBinary)
      - pkg/sys/ (InstallSIGPIPEHandler)

    files:
      - path: cmd/logname/main.go
        action: create
        note: logname utility -- prints login name from system login record
      - path: cmd/logname/logname_test.go
        action: create
        note: Differential tests against glogname reference binary

    requirements:
      - id: R1
        text: Implement srd053-logname requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd053-logname requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd053-logname requirement R2.1 as specified in the SRD
      - id: R4
        text: Implement srd053-logname requirement R2.2 as specified in the SRD

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main()
      - id: D2
        text: Use testutils.BuildBinary(t, ".") to compile and testutils.RunDiffTests with glogname as the reference binary
      - id: D3
        text: Call exec.LookPath("glogname") and t.Skip if the reference binary is not found
      - id: D4
        text: All differential tests must set LC_ALL=C in the Env field

    acceptance_criteria:
      - id: AC1
        text: R1.1 behavior matches glogname reference binary in differential tests
      - id: AC2
        text: R1.2 behavior matches glogname reference binary in differential tests
      - id: AC3
        text: R2.1 behavior matches glogname reference binary in differential tests
      - id: AC4
        text: R2.2 behavior matches glogname reference binary in differential tests
      - id: AC5
