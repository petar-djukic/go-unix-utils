- index: 0
  title: "[stitch] cmd/ls: features implementation (srd008-ls R4.5-R4.8)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd008-ls.yaml (requirements R4.5, R4.6, R4.7, R4.8)
      - cmd/ls/main.go (existing implementation to extend)
      - cmd/ls/ls_test.go (existing differential tests to extend)
      - pkg/sys/ (file metadata and terminal width APIs)
      - pkg/format/ (output formatting, color, and column alignment APIs)

    files:
      - path: cmd/ls/main.go
        action: modify
        note: Implement features for R4.5, R4.6, R4.7, R4.8
      - path: cmd/ls/ls_test.go
        action: modify
        note: Add differential test cases for R4.5, R4.6, R4.7, R4.8

    requirements:
      - id: R1
        text: Implement srd008-ls requirement R4.5 as specified in the SRD
      - id: R2
        text: Implement srd008-ls requirement R4.6 as specified in the SRD
      - id: R3
        text: Implement srd008-ls requirement R4.7 as specified in the SRD
      - id: R4
        text: Implement srd008-ls requirement R4.8 as specified in the SRD

    design_decisions:
      - id: D1
        text: Extend the existing cmd/ls implementation -- do not restructure or refactor existing code
      - id: D2
        text: Follow the differential testing pattern using testutils.RunDiffTests with gls as the reference binary
      - id: D3
        text: All differential tests must set LC_ALL=C in the Env field

    acceptance_criteria:
      - id: AC1
        text: R4.5 behavior matches gls reference binary in differential tests
      - id: AC2
        text: R4.6 behavior matches gls reference binary in differential tests
      - id: AC3
        text: R4.7 behavior matches gls reference binary in differential tests
      - id: AC4
        text: R4.8 behavior matches gls reference binary in differential tests
      - id: AC5
        text: go build ./cmd/ls/ succeeds with no errors
      - id: AC6
        text: go test ./cmd/ls/ -count=1 passes (or skips gracefully if gls not in PATH)

