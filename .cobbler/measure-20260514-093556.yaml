- index: 1
  title: "[stitch] cmd/wc: core counting and standard input (srd005-wc R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd005-wc.yaml (R1.1-R1.4 requirement definitions)
      - cmd/seq/main.go (reference for cmd/ package structure, flag parsing, and SIGPIPE handler)
      - cmd/seq/seq_test.go (reference for differential test structure using testutils)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage)

    files:
      - path: cmd/wc/main.go
        action: create
        note: Initial wc implementation covering R1.1-R1.4 -- core counting logic and standard input handling
      - path: cmd/wc/wc_test.go
        action: create
        note: Differential tests for R1.1-R1.4 against gwc reference binary

    requirements:
      - id: R1
        text: Implement srd005-wc R1.1 per the SRD specification
      - id: R2
        text: Implement srd005-wc R1.2 per the SRD specification
      - id: R3
        text: Implement srd005-wc R1.3 per the SRD specification
      - id: R4
        text: Implement srd005-wc R1.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior
      - id: D2
        text: Use testutils.BuildBinary(t, ".") to compile the Go binary and testutils.RunDiffTests to compare against the gwc reference binary
      - id: D3
        text: Call exec.LookPath("gwc") and t.Skip if the reference binary is not found
      - id: D4
        text: Set LC_ALL=C in the test Env field for locale-independent comparison
      - id: D5
        text: Build the binary into bin/wc using "go build -o bin/wc ./cmd/wc/"

    acceptance_criteria:
      - id: AC1
        text: cmd/wc/main.go exists and compiles successfully
      - id: AC2
        text: srd005-wc R1.1 through R1.4 are implemented
      - id: AC3
        text: cmd/wc/wc_test.go contains differential tests covering R1.1-R1.4
      - id: AC4
        text: go test ./cmd/wc/... -count=1 passes
      - id: AC5
        text: go vet ./cmd/wc/... reports no issues

