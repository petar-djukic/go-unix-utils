- index: 0
  title: "[stitch] cmd/factor: srd065 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd065-factor.yaml (requirements R3.1-R3.4)
      - cmd/factor/main.go (existing implementation from R1-R2)
      - cmd/factor/factor_test.go (existing differential tests from R1-R2)
      - pkg/testutils/ (differential testing framework -- RunDiffTests, BuildBinary, DiffTest)

    files:
      - path: cmd/factor/main.go
        action: modify
        note: Extend factor implementation for srd065 R3.1-R3.4
      - path: cmd/factor/factor_test.go
        action: modify
        note: Add differential test cases covering R3.1-R3.4

    requirements:
      - id: R1
        text: Implement srd065-factor requirement R3.1 as specified in the SRD
      - id: R2
        text: Implement srd065-factor requirement R3.2 as specified in the SRD
      - id: R3
        text: Implement srd065-factor requirement R3.3 as specified in the SRD
      - id: R4
        text: Implement srd065-factor requirement R3.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Follow existing implementation patterns established in cmd/factor/main.go from R1-R2 requirement groups
      - id: D2
        text: Use differential testing via pkg/testutils.RunDiffTests comparing against gfactor reference binary from Homebrew
      - id: D3
        text: Maintain sys.InstallSIGPIPEHandler() call at start of main per project convention
      - id: D4
        text: Reference binary lookup uses exec.LookPath("gfactor") with t.Skip if not found

    acceptance_criteria:
      - id: AC1
        text: All R3.1-R3.4 requirements from srd065-factor.yaml are implemented in cmd/factor/main.go
      - id: AC2
        text: Differential test cases added to cmd/factor/factor_test.go for each R3.x requirement
      - id: AC3
        text: go build -o bin/factor ./cmd/factor/ succeeds with no errors
      - id: AC4
        text: go vet ./cmd/factor/ reports no issues
      - id: AC5
        text: go test ./cmd/factor/... -count=1 passes (or skips gracefully if gfactor not in PATH)

