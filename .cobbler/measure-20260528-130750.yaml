- index: 0
  title: "[stitch] cmd/pee differential tests (srd113-pee R2.1, R2.2)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd113-pee.yaml (full SRD -- requirements R2.1 and R2.2 define the differential test cases)
      - cmd/pee/main.go (existing implementation from R1.1-R1.3 -- the binary under test)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function -- the differential testing harness)
      - cmd/chronic/chronic_test.go (reference example of moreutils differential test file -- chronic is also a moreutils utility)

    files:
      - path: cmd/pee/pee_test.go
        action: create
        note: Differential tests comparing Go pee binary against Homebrew moreutils pee reference binary

    requirements:
      - id: R1
        text: "Implement differential tests per srd113-pee R2.1 -- test cases covering all flag combinations and stdin piping scenarios defined in the SRD"
      - id: R2
        text: "Implement differential tests per srd113-pee R2.2 -- edge cases including empty stdin, missing commands, and error propagation"

    design_decisions:
      - id: D1
        text: "Use the standard differential testing pattern: call testutils.BuildBinary(t, \".\") to compile cmd/pee, then exec.LookPath(\"pee\") for the Homebrew moreutils reference binary, then testutils.RunDiffTests to compare stdout, stderr, and exit code"
      - id: D2
        text: "Call t.Skip if the reference binary \"pee\" is not found in PATH -- moreutils reference binaries have no g-prefix unlike GNU coreutils"
      - id: D3
        text: "Set LC_ALL=C in the Env field of each DiffTest to ensure deterministic locale-independent output matching"

    acceptance_criteria:
      - id: AC1
        text: "cmd/pee/pee_test.go exists and contains a TestDiff function"
      - id: AC2
        text: "go test ./cmd/pee/... -count=1 passes when the reference binary is available"
      - id: AC3
        text: "go test ./cmd/pee/... -count=1 skips gracefully when the reference binary is not in PATH"
      - id: AC4
        text: "go vet ./cmd/pee/... reports no issues"
      - id: AC5
        text: "All test cases from srd113-pee R2.1 and R2.2 are present as DiffTest entries"

- index: 1
  title: "[stitch] cmd/vidir implementation (srd114-vidir R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd114-vidir.yaml (full SRD -- requirements R1.1 through R1.4 define the implementation)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler -- required at start of main per project rules)
      - cmd/pee/main.go (reference example of a moreutils cmd/ implementation in this project)

    files:
      - path: cmd/vidir/main.go
        action: create
        note: vidir implementation -- batch rename and delete files by editing a directory listing in a text editor

    requirements:
      - id: R1
        text: "Implement vidir per srd114-vidir R1.1 -- core directory listing generation and editor invocation"
      - id: R2
        text: "Implement vidir per srd114-vidir R1.2 -- parsing editor output to determine renames, deletions, and unchanged files"
      - id: R3
        text: "Implement vidir per srd114-vidir R1.3 -- executing the file operations (rename, delete) derived from editor output"
      - id: R4
        text: "Implement vidir per srd114-vidir R1.4 -- flag parsing, error handling, and exit code behavior"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU behavior when piped to consumers that close stdin early"
      - id: D2
        text: "Use os.Args and flag package for argument parsing -- derive flag names and semantics from the SRD, not from external documentation"
      - id: D3
        text: "The reference binary for vidir is \"vidir\" (Homebrew moreutils, no g-prefix)"

    acceptance_criteria:
      - id: AC1
        text: "cmd/vidir/main.go exists with package main and a main() function"
      - id: AC2
        text: "go build -o bin/vidir ./cmd/vidir/ succeeds with no errors"
      - id: AC3
        text: "go vet ./cmd/vidir/... reports no issues"
      - id: AC4
        text: "All flags and behaviors specified in srd114-vidir R1.1 through R1.4 are implemented"
      - id: AC5
        text: "sys.InstallSIGPIPEHandler() is called at the start of main()"

