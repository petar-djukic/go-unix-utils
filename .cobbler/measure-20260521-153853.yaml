- index: 0
  title: "[stitch] cmd/split: srd067 R4.1-R4.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd067-split.yaml (R4.1-R4.4 requirements and acceptance criteria)
      - cmd/split/main.go (existing implementation covering R1-R3)
      - cmd/split/split_test.go (existing differential tests from R1-R3)

    files:
      - path: cmd/split/main.go
        action: modify
        note: Add R4.1-R4.4 functionality to existing split implementation
      - path: cmd/split/split_test.go
        action: modify
        note: Add differential test cases for R4.1-R4.4

    requirements:
      - id: R1
        text: Implement srd067 R4.1 per the SRD specification
      - id: R2
        text: Implement srd067 R4.2 per the SRD specification
      - id: R3
        text: Implement srd067 R4.3 per the SRD specification
      - id: R4
        text: Implement srd067 R4.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Extend the existing split implementation -- do not restructure code from R1-R3
      - id: D2
        text: Add differential test cases using the existing RunDiffTests harness and gsplit reference binary

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/split ./cmd/split/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/split/... reports no issues
      - id: AC3
        text: go test ./cmd/split/... -count=1 passes (skips if gsplit not in PATH)
      - id: AC4
        text: All srd067 R4.1-R4.4 acceptance criteria from the SRD are satisfied

