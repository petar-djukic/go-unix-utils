- index: 0
  title: "[stitch] cmd/pr implementation (srd110-pr R1.1)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd110-pr.yaml (full SRD for pr -- read all requirements, implement only R1.1)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern -- call sys.InstallSIGPIPEHandler() at start of main)
      - cmd/nl/main.go (reference implementation of a text-processing cmd/ utility)

    files:
      - path: cmd/pr/main.go
        action: create
        note: "pr utility -- paginate text files with headers, page numbers, and multi-column layout"

    requirements:
      - id: R1
        text: "Implement srd110-pr requirement R1.1 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main to match GNU behavior when piped to consumers that close stdin early"
      - id: D2
        text: "Build target: go build -o bin/pr ./cmd/pr/"
      - id: D3
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for SIGPIPE handling"

    acceptance_criteria:
      - id: AC1
        text: "cmd/pr/main.go compiles without errors: go build -o bin/pr ./cmd/pr/"
      - id: AC2
        text: "go vet ./cmd/pr/... passes with no warnings"
      - id: AC3
        text: "All behaviors specified in srd110-pr R1.1 are implemented"

