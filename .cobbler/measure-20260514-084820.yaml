- index: 0
  title: "[stitch] cmd/head: byte-count mode and remaining core behavior (srd018-head R1.5, R2.1-R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd018-head.yaml (SRD for head -- focus on R1.5, R2.1, R2.2, R2.3)
      - cmd/head/main.go (existing implementation covering R1.1-R1.4: basic line output and defaults)
      - cmd/head/head_test.go (existing differential tests for R1.1-R1.4)
      - pkg/testutils/ (DiffTest struct and RunDiffTests for differential testing)
      - pkg/sys/ (InstallSIGPIPEHandler, already called in main)

    files:
      - path: cmd/head/main.go
        action: modify
        note: "Add byte-count mode, negative count support, and remaining group-1/group-2 behavior"
      - path: cmd/head/head_test.go
        action: modify
        note: "Add differential test cases for R1.5, R2.1, R2.2, R2.3 using ghead as reference"

    requirements:
      - id: R1
        text: "Implement srd018-head R1.5 per the SRD specification"
      - id: R2
        text: "Implement srd018-head R2.1 per the SRD specification"
      - id: R3
        text: "Implement srd018-head R2.2 per the SRD specification"
      - id: R4
        text: "Implement srd018-head R2.3 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Extend the existing flag-parsing and output logic established by R1.1-R1.4 in main.go"
      - id: D2
        text: "Use pkg/testutils.RunDiffTests with ghead as the reference binary for all new test cases"
      - id: D3
        text: "Set LC_ALL=C in test environment per project convention"

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/head/ succeeds with no errors"
      - id: AC2
        text: "go vet ./cmd/head/ reports no issues"
      - id: AC3
        text: "go test ./cmd/head/... -count=1 passes (or skips gracefully if ghead not in PATH)"
      - id: AC4
        text: "Requirements R1.5, R2.1, R2.2, R2.3 are implemented in main.go with corresponding differential tests"

