- index: 0
  title: "[stitch] cmd/shred (contract) -- srd099-shred"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd099-shred.yaml (all requirements and acceptance criteria for shred)
      - cmd/chmod/main.go (reference cmd/ package pattern -- flag parsing, SIGPIPE handler, exit codes)
      - pkg/sys/sigpipe.go (SIGPIPE handler import path)

    files:
      - path: cmd/shred/main.go
        action: create
        note: "Package main with flag definitions, main() skeleton, and stub functions for all shred operations"

    requirements:
      - id: R1
        text: "Define all flag variables matching every flag specified in srd099-shred with correct Go types and default values"
      - id: R2
        text: "Implement main() with sys.InstallSIGPIPEHandler(), flag.Parse(), argument validation that prints usage to stderr and exits 1 on no file arguments, and a dispatch loop over file arguments"
      - id: R3
        text: "Define stub functions for each operation required by the SRD -- each stub must have the correct signature and return nil or a placeholder error so the package compiles"
      - id: R4
        text: "Include --help and --version output matching GNU shred format with all flags documented"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project shared protocol"
      - id: D2
        text: "Use Go standard library flag package for command-line argument parsing"
      - id: D3
        text: "All stub functions must compile cleanly -- the contract must pass go build and go vet"

    acceptance_criteria:
      - id: AC1
        text: "cmd/shred/main.go exists with package main declaration"
      - id: AC2
        text: "go build ./cmd/shred/ succeeds with no errors"
      - id: AC3
        text: "go vet ./cmd/shred/ passes with no warnings"
      - id: AC4
        text: "All flags from srd099-shred are defined as flag variables with correct types and defaults"
      - id: AC5
        text: "main() calls sys.InstallSIGPIPEHandler() before any I/O and flag.Parse() before accessing flag values"

