- index: 0
  title: "[stitch] srd003-format (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd003-format.yaml (full SRD for the format package)
      - docs/ARCHITECTURE.yaml (pkg/format component description and design decisions)
      - pkg/sys/fileinfo.go (FileInfo and IsTerminal used by format for color detection)

    files:
      - path: pkg/format/humansize.go
        action: create
        note: HumanSizeOpts struct and HumanSize function stub
      - path: pkg/format/color.go
        action: create
        note: FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled stubs
      - path: pkg/format/align.go
        action: create
        note: PadRight, PadLeft, Columns function stubs

    requirements:
      - id: R1
        text: "Define HumanSizeOpts struct with Binary bool field and HumanSize function signature: func HumanSize(bytes int64, opts HumanSizeOpts) string. Stub body returns empty string."
      - id: R2
        text: "Define color function signatures as stubs: func FileTypeColor(mode os.FileMode) string, func Reset() string, func ColorEnabled(w io.Writer) bool, func SetColorEnabled(enabled bool), func ResetColorEnabled(). Stub bodies return zero values."
      - id: R3
        text: "Define alignment function signatures as stubs: func PadRight(s string, width int) string, func PadLeft(s string, width int) string, func Columns(entries []string, termWidth int) [][]string. Stub bodies return zero values."

    design_decisions:
      - id: D1
        text: "Package is github.com/petar-djukic/go-unix-utils/pkg/format"
      - id: D2
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for terminal detection in ColorEnabled. Import io and os for type references in function signatures."
      - id: D3
        text: "All function bodies are stubs returning zero values (empty string, nil, false). The contract establishes the compilable API surface only."
      - id: D4
        text: "Split into three files by concern: humansize.go (size formatting), color.go (ANSI color), align.go (column alignment). Each file corresponds to one SRD requirement group."

    acceptance_criteria:
      - id: AC1
        text: "go vet ./pkg/format/... passes with no errors"
      - id: AC2
        text: "All ten exported symbols are defined: HumanSizeOpts, HumanSize, FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled, PadRight, PadLeft, Columns"
      - id: AC3
        text: "No imports of any cmd/ package"
      - id: AC4
        text: "go build ./pkg/format/... compiles successfully"

- index: 1
  title: "[stitch] srd086-hashutil (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd086-hashutil.yaml (full SRD for the hashutil package)
      - docs/ARCHITECTURE.yaml (pkg/ component descriptions)

    files:
      - path: pkg/hashutil/hashconfig.go
        action: create
        note: HashConfig and CheckOptions types, all exported function stubs

    requirements:
      - id: R1
        text: "Define HashConfig struct with fields: Algorithm string, NewHash func() hash.Hash, DigestLen int"
      - id: R2
        text: "Define CheckOptions struct with fields: Warn bool, Quiet bool, Status bool"
      - id: R3
        text: "Define formatting function stubs: func FormatGNU(digest, filename string, binary bool) string and func FormatBSDTag(algorithm, filename, digest string) string. Stub bodies return empty string."
      - id: R4
        text: "Define operation function stubs: func ComputeDigest(r io.Reader, cfg HashConfig) (string, error), func ParseChecksumLine(line string, cfg HashConfig) (filename, expectedDigest string, binary bool, err error), func VerifyChecksums(checksumFile string, cfg HashConfig, opts CheckOptions, stdout, stderr io.Writer) (bool, error), func DigestFiles(files []string, cfg HashConfig, binary, tag bool, stdout, stderr io.Writer) int. Stub bodies return zero values."

    design_decisions:
      - id: D1
        text: "Package is github.com/petar-djukic/go-unix-utils/pkg/hashutil"
      - id: D2
        text: "Primary file is hashconfig.go, named after the primary exported type HashConfig"
      - id: D3
        text: "All function bodies return zero values. The contract establishes the compilable API surface only."
      - id: D4
        text: "Must not import any cmd/ package or any other pkg/ package. Imports limited to standard library: hash, io, os, fmt, encoding/hex, bufio, strings, regexp."

    acceptance_criteria:
      - id: AC1
        text: "go vet ./pkg/hashutil/... passes with no errors"
      - id: AC2
        text: "All eight exported symbols are defined: HashConfig, CheckOptions, FormatGNU, FormatBSDTag, ComputeDigest, ParseChecksumLine, VerifyChecksums, DigestFiles"
      - id: AC3
        text: "No imports of cmd/ or other pkg/ packages"
      - id: AC4
        text: "go build ./pkg/hashutil/... compiles successfully"

- index: 2
  title: "[stitch] srd001-testutils R5.1, R5.2"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd001-testutils.yaml (R5.1 and R5.2 requirement details)
      - pkg/testutils/ (all existing .go files -- the package has prior implementation from R1-R4)

    files:
      - path: pkg/testutils/difftest.go
        action: modify
        note: Add R5.1 and R5.2 functionality to the existing testutils package

    requirements:
      - id: R1
        text: "Implement srd001-testutils requirement R5.1 as specified in the SRD. Read the SRD to determine the exact deliverable. Extend the existing package without breaking existing exports (DiffTest, RunDiffTests, BuildBinary, NormalizeFunc)."
      - id: R2
        text: "Implement srd001-testutils requirement R5.2 as specified in the SRD. Read the SRD to determine the exact deliverable. Extend the existing package without breaking existing exports."

    design_decisions:
      - id: D1
        text: "Extend the existing pkg/testutils package. Do not rewrite, restructure, or remove any existing exported symbols."
      - id: D2
        text: "Must not import any cmd/ package or any other pkg/ package."
      - id: D3
        text: "If R5.1 or R5.2 requires a new file, name it after the primary exported type per project convention. If the new functionality fits in the existing difftest.go, add it there."

    acceptance_criteria:
      - id: AC1
        text: "go vet ./pkg/testutils/... passes with no errors"
      - id: AC2
        text: "go build ./pkg/testutils/... compiles successfully"
      - id: AC3
        text: "Existing exports (DiffTest, RunDiffTests, BuildBinary, NormalizeFunc) remain unchanged and functional"
      - id: AC4
        text: "Both R5.1 and R5.2 acceptance criteria from the SRD are satisfied"

- index: 3
  title: "[stitch] srd003-format R1.1-R1.4: human-readable size formatting"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd003-format.yaml (R1.1 through R1.4 requirement details)
      - pkg/format/humansize.go (contract stub created by prior task -- contains HumanSizeOpts and HumanSize signatures)

    files:
      - path: pkg/format/humansize.go
        action: modify
        note: Replace stubs with full implementation of HumanSizeOpts and HumanSize

    requirements:
      - id: R1
        text: "Implement srd003-format R1.1 as specified in the SRD. Read the SRD for exact acceptance criteria."
      - id: R2
        text: "Implement srd003-format R1.2 as specified in the SRD. Read the SRD for exact acceptance criteria."
      - id: R3
        text: "Implement srd003-format R1.3 as specified in the SRD. Read the SRD for exact acceptance criteria."
      - id: R4
        text: "Implement srd003-format R1.4 as specified in the SRD. Read the SRD for exact acceptance criteria."

    design_decisions:
      - id: D1
        text: "HumanSizeOpts.Binary field selects between 1024-based binary units and 1000-based SI units, per the contract signature."
      - id: D2
        text: "Replace the stub body in pkg/format/humansize.go with the full implementation. Do not change the function signature."
      - id: D3
        text: "Do not modify color.go or align.go -- those remain as stubs for future tasks."

    acceptance_criteria:
      - id: AC1
        text: "go vet ./pkg/format/... passes with no errors"
      - id: AC2
        text: "go build ./pkg/format/... compiles successfully"
      - id: AC3
        text: "HumanSize returns correct human-readable strings matching the SRD R1.1-R1.4 acceptance criteria"
      - id: AC4
        text: "Function signature matches the contract: func HumanSize(bytes int64, opts HumanSizeOpts) string"