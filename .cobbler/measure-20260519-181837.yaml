- index: 1
  title: "[stitch] cmd/sha1sum -- srd031 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd031-sha1sum.yaml (SRD for sha1sum -- focus on requirement group R1)
      - cmd/md5sum/main.go (reference pattern -- sha1sum follows the same structure as md5sum)
      - cmd/md5sum/md5sum_test.go (reference test pattern for differential testing)
      - pkg/hashutil/ (shared hash utility library -- provides HashConfig, ComputeDigest, DigestFiles, FormatGNU)
      - pkg/sys/ (provides InstallSIGPIPEHandler)

    files:
      - path: cmd/sha1sum/main.go
        action: create
        note: SHA-1 checksum utility implementing srd031 R1.1-R1.4
      - path: cmd/sha1sum/sha1sum_test.go
        action: create
        note: Differential tests for sha1sum R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd031 R1.1 per the SRD specification
      - id: R2
        text: Implement srd031 R1.2 per the SRD specification
      - id: R3
        text: Implement srd031 R1.3 per the SRD specification
      - id: R4
        text: Implement srd031 R1.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Use crypto/sha1 as the hash algorithm via pkg/hashutil.HashConfig
      - id: D2
        text: Use pkg/hashutil functions (DigestFiles, ComputeDigest, FormatGNU) for all shared checksum logic -- do not duplicate hashutil functionality
      - id: D3
        text: Call sys.InstallSIGPIPEHandler() at the start of main
      - id: D4
        text: Follow the same structure as cmd/md5sum/main.go for flag parsing, file processing, and error handling
      - id: D5
        text: Reference binary for differential testing is gsha1sum from Homebrew coreutils -- use exec.LookPath and t.Skip if not found

    acceptance_criteria:
      - id: AC1
        text: go build ./cmd/sha1sum/ compiles without errors
      - id: AC2
        text: go test ./cmd/sha1sum/... -count=1 passes all differential tests
      - id: AC3
        text: All srd031 R1.1, R1.2, R1.3, and R1.4 requirements are implemented as specified in the SRD
      - id: AC4
        text: cmd/sha1sum/main.go calls sys.InstallSIGPIPEHandler() at the start of main

