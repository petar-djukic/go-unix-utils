- index: 1
  title: "[stitch] cmd/readlink: features implementation (srd050-readlink R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd050-readlink.yaml (requirements R1.1 through R1.4)
      - pkg/sys/ (InstallSIGPIPEHandler function for SIGPIPE handling)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function)

    files:
      - path: cmd/readlink/main.go
        action: create
        note: "readlink utility -- prints symlink targets and canonicalizes paths via -f, -e, -m modes"
      - path: cmd/readlink/readlink_test.go
        action: create
        note: Differential tests against greadlink from Homebrew coreutils

    requirements:
      - id: R1
        text: "Implement srd050-readlink requirement R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd050-readlink requirement R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd050-readlink requirement R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd050-readlink requirement R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils behavior"
      - id: D2
        text: "Use os.Readlink for the core readlink(2) system call"
      - id: D3
        text: "Use pkg/testutils.BuildBinary(t, '.') to compile the Go binary for differential tests"
      - id: D4
        text: "Call exec.LookPath('greadlink') and t.Skip if the reference binary is not found"
      - id: D5
        text: "Set LC_ALL=C in all differential test environments"

    acceptance_criteria:
      - id: AC1
        text: "cmd/readlink/main.go compiles -- go build -o bin/readlink ./cmd/readlink/"
      - id: AC2
        text: "go vet ./cmd/readlink/ reports no issues"
      - id: AC3
        text: "R1.1 through R1.4 features work correctly per the SRD"
      - id: AC4
        text: "go test ./cmd/readlink/... -count=1 passes"
      - id: AC5
        text: "Differential tests match greadlink output for R1.1-R1.4 test cases"

