- index: 0
  title: "[stitch] cmd/sleep: srd061 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd061-sleep.yaml (SRD for sleep -- focus on requirement group R1)
      - pkg/sys/ (SIGPIPE handler pattern -- InstallSIGPIPEHandler)
      - pkg/testutils/ (differential testing pattern -- BuildBinary, RunDiffTests, DiffTest)

    files:
      - path: cmd/sleep/main.go
        action: create
        note: sleep implementation covering srd061 R1.1-R1.4
      - path: cmd/sleep/sleep_test.go
        action: create
        note: differential tests for srd061 R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd061-sleep requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd061-sleep requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd061-sleep requirement R1.3 as specified in the SRD
      - id: R4
        text: Implement srd061-sleep requirement R1.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior
      - id: D2
        text: Use testutils.BuildBinary and testutils.RunDiffTests for differential testing against gsleep reference binary
      - id: D3
        text: Call exec.LookPath("gsleep") and t.Skip if reference binary not found

    acceptance_criteria:
      - id: AC1
        text: cmd/sleep/main.go compiles with "go build -o bin/sleep ./cmd/sleep/"
      - id: AC2
        text: go vet ./cmd/sleep/... reports no issues
      - id: AC3
        text: Differential tests for R1.1-R1.4 pass against gsleep reference binary
      - id: AC4
        text: Tests skip gracefully when gsleep is not installed

