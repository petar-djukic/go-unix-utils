- index: 0
  title: "cmd/df: implement srd106 R3.1, R3.2, R3.3, R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd106-df.yaml (SRD with requirement definitions for R3.1-R3.4)
      - cmd/df/main.go (existing implementation covering R1.x and R2.x)
      - cmd/df/df_test.go (existing differential tests)
      - pkg/format/format.go (HumanSize and formatting helpers used by df)
      - pkg/sys/stat.go (filesystem metadata abstractions)

    files:
      - path: cmd/df/main.go
        action: modify
        note: Add implementation for srd106-df requirements R3.1, R3.2, R3.3, R3.4
      - path: cmd/df/df_test.go
        action: modify
        note: Add differential test cases covering R3.1, R3.2, R3.3, R3.4

    requirements:
      - id: R1
        text: "Implement srd106-df requirement R3.1 as specified in the SRD"
      - id: R2
        text: "Implement srd106-df requirement R3.2 as specified in the SRD"
      - id: R3
        text: "Implement srd106-df requirement R3.3 as specified in the SRD"
      - id: R4
        text: "Implement srd106-df requirement R3.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Extend the existing cmd/df implementation -- do not rewrite code that already satisfies R1.x and R2.x requirements"
      - id: D2
        text: "Add differential tests using testutils.RunDiffTests comparing against the gdf reference binary from Homebrew coreutils"
      - id: D3
        text: "All differential tests must set LC_ALL=C in the environment to ensure output parity between Go and GNU binaries"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/df ./cmd/df/ succeeds with no errors"
      - id: AC2
        text: "go vet ./cmd/df/ reports no issues"
      - id: AC3
        text: "go test ./cmd/df/ -count=1 passes (skips gracefully if gdf not in PATH)"
      - id: AC4
        text: "Each of R3.1, R3.2, R3.3, R3.4 has at least one differential test case in df_test.go"

