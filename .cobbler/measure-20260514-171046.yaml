- index: 0
  title: "[stitch] cmd/ls: core display features (srd008-ls R1.9-R1.12)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd008-ls.yaml (requirements R1.9, R1.10, R1.11, R1.12 -- read full text and acceptance criteria)
      - cmd/ls/main.go (existing ls implementation covering R1.1-R1.8 -- extend this file)
      - pkg/sys/ (FileInfo struct, Stat, Lstat for file metadata -- architecture dependency srd008-ls -> srd002-sys)
      - pkg/format/ (HumanSize, PadLeft, PadRight, FileTypeColor, Columns -- architecture dependency srd008-ls -> srd003-format)
      - CLAUDE.md (project build conventions and SIGPIPE handling requirement)

    files:
      - path: cmd/ls/main.go
        action: modify
        note: Add implementation for srd008-ls requirements R1.9 through R1.12

    requirements:
      - id: R1
        text: "Implement srd008-ls R1.9 exactly as specified in the SRD -- read the requirement text and acceptance criteria from the SRD file before coding"
      - id: R2
        text: "Implement srd008-ls R1.10 exactly as specified in the SRD -- read the requirement text and acceptance criteria from the SRD file before coding"
      - id: R3
        text: "Implement srd008-ls R1.11 exactly as specified in the SRD -- read the requirement text and acceptance criteria from the SRD file before coding"
      - id: R4
        text: "Implement srd008-ls R1.12 exactly as specified in the SRD -- read the requirement text and acceptance criteria from the SRD file before coding"

    design_decisions:
      - id: D1
        text: "Use pkg/sys.Stat and pkg/sys.Lstat for file metadata (mode, size, nlink, uid, gid, timestamps) per architecture dependency srd008-ls -> srd002-sys. Do not call syscall or golang.org/x/sys/unix directly from cmd/ls"
      - id: D2
        text: "Use pkg/format for output formatting (HumanSize, PadLeft, PadRight, FileTypeColor, Columns) per architecture dependency srd008-ls -> srd003-format. If pkg/format does not exist or is empty, implement the required formatting inline in cmd/ls/main.go"
      - id: D3
        text: "Preserve sys.InstallSIGPIPEHandler() call at the start of main and all existing functionality from R1.1-R1.8 -- do not restructure existing code"

    acceptance_criteria:
      - id: AC1
        text: "cmd/ls builds successfully with go build -o bin/ls ./cmd/ls/"
      - id: AC2
        text: "srd008-ls requirements R1.9, R1.10, R1.11, and R1.12 are fully implemented as specified in the SRD"
      - id: AC3
        text: "go vet ./cmd/ls/... passes with no warnings"
      - id: AC4
        text: "Existing functionality from R1.1-R1.8 is preserved -- no regressions in flag parsing or output"

- index: 1
  title: "[stitch] cmd/ls: core display features tests (srd008-ls R1.9-R1.12)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd008-ls.yaml (acceptance criteria for R1.9, R1.10, R1.11, R1.12 -- derive test inputs and expected behaviors from these)
      - cmd/ls/main.go (current ls implementation including R1.9-R1.12 features)
      - cmd/ls/ls_test.go (existing differential tests for R1.1-R1.8 -- follow the same test patterns)
      - pkg/testutils/ (DiffTest struct, RunDiffTests, BuildBinary -- the differential testing API)
      - CLAUDE.md (differential testing pattern and project conventions)

    files:
      - path: cmd/ls/ls_test.go
        action: modify
        note: Add DiffTest entries exercising srd008-ls R1.9 through R1.12

    requirements:
      - id: R1
        text: "Add DiffTest entries that exercise srd008-ls R1.9 per the SRD acceptance criteria -- each flag combination and edge case described in the SRD should have a test"
      - id: R2
        text: "Add DiffTest entries that exercise srd008-ls R1.10 per the SRD acceptance criteria"
      - id: R3
        text: "Add DiffTest entries that exercise srd008-ls R1.11 per the SRD acceptance criteria"
      - id: R4
        text: "Add DiffTest entries that exercise srd008-ls R1.12 per the SRD acceptance criteria"

    design_decisions:
      - id: D1
        text: "Append new DiffTest entries to the existing tests slice in the TestDiff function -- do not create a separate test function"
      - id: D2
        text: "Reference binary is gls from Homebrew via exec.LookPath(\"gls\"). If not found, the existing t.Skip call handles it -- do not add a second LookPath"
      - id: D3
        text: "Set LC_ALL=C in the Env field of each DiffTest to ensure consistent sorting and locale behavior between Go and GNU binaries"
      - id: D4
        text: "Create temporary directory fixtures for tests that need specific file layouts -- use t.TempDir() and populate with test files before running the diff test"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/ls/... -count=1 passes when gls is installed, or skips cleanly when gls is not found"
      - id: AC2
        text: "Each of R1.9, R1.10, R1.11, R1.12 has at least one DiffTest entry exercising its primary behavior"
      - id: AC3
        text: "Existing tests for R1.1-R1.8 continue to pass unchanged"

