- index: 0
  title: "[stitch] cmd/stty implementation (srd105-stty R2.1, R3.1, R3.2, R4.1)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd105-stty.yaml (full SRD for stty utility -- read all requirements R2.1, R3.1, R3.2, R4.1)
      - cmd/stty/main.go (existing implementation from srd105-stty R1.1)
      - cmd/stty/stty_test.go (existing differential tests)
      - docs/specs/use-cases/rel15.0-uc002-stty.yaml (use case for stty)
      - pkg/sys/sys.go (sys package API for terminal operations)

    files:
      - path: cmd/stty/main.go
        action: modify
        note: Add features for srd105-stty R2.1, R3.1, R3.2, R4.1
      - path: cmd/stty/stty_test.go
        action: modify
        note: Add differential tests for R2.1, R3.1, R3.2, R4.1

    requirements:
      - id: R1
        text: Implement srd105-stty R2.1 per the SRD acceptance criteria
      - id: R2
        text: Implement srd105-stty R3.1 per the SRD acceptance criteria
      - id: R3
        text: Implement srd105-stty R3.2 per the SRD acceptance criteria
      - id: R4
        text: Implement srd105-stty R4.1 per the SRD acceptance criteria

    design_decisions:
      - id: D1
        text: Extend the existing cmd/stty implementation -- do not rewrite or restructure existing code from R1.1
      - id: D2
        text: Follow the differential testing pattern from pkg/testutils using RunDiffTests against the gstty reference binary
      - id: D3
        text: Call sys.InstallSIGPIPEHandler() at the start of main per the SIGPIPE shared protocol
      - id: D4
        text: Use golang.org/x/sys/unix for termios operations per architecture technology choices

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/stty/ compiles without errors"
      - id: AC2
        text: "go test ./cmd/stty/... -count=1 passes all tests including new ones for R2.1, R3.1, R3.2, R4.1"
      - id: AC3
        text: "go vet ./cmd/stty/ reports no issues"
      - id: AC4
        text: Each of the four requirements has at least one differential test case in stty_test.go

