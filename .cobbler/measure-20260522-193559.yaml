- index: 2
  title: "[stitch] cmd/printf: srd073 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd073-printf.yaml (full SRD -- focus on requirement group R1)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler for SIGPIPE handling)

    files:
      - path: cmd/printf/main.go
        action: create
        note: "Initial printf implementation covering srd073 R1.1 through R1.4"
      - path: cmd/printf/printf_test.go
        action: create
        note: "Differential tests comparing Go printf against gprintf (Homebrew GNU printf)"

    requirements:
      - id: R1
        text: "Implement srd073 requirement R1.1 per the SRD specification"
      - id: R2
        text: "Implement srd073 requirement R1.2 per the SRD specification"
      - id: R3
        text: "Implement srd073 requirement R1.3 per the SRD specification"
      - id: R4
        text: "Implement srd073 requirement R1.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils behavior"
      - id: D2
        text: "Use the differential testing pattern: compare Go binary output against gprintf (Homebrew GNU printf) using testutils.RunDiffTests"
      - id: D3
        text: "Call exec.LookPath for gprintf and t.Skip if not found, so tests pass on machines without Homebrew GNU binaries"
      - id: D4
        text: "Set LC_ALL=C in all test environments to ensure byte-identical output comparison"

    acceptance_criteria:
      - id: AC1
        text: "All four R1 requirements from srd073 are implemented in cmd/printf/main.go"
      - id: AC2
        text: "cmd/printf/main.go calls sys.InstallSIGPIPEHandler() at the start of main()"
      - id: AC3
        text: "Differential test cases in cmd/printf/printf_test.go cover each R1 requirement"
      - id: AC4
        text: "go build ./cmd/printf/ succeeds with no errors"
      - id: AC5
        text: "go vet ./cmd/printf/ reports no issues"
      - id: AC6
        text: "go test ./cmd/printf/ -count=1 passes (or skips gracefully if gprintf is not installed)"

