- index: 1
  title: "[stitch] srd001-testutils R2.1-R2.4 -- RunDiffTests binary execution and output comparison"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd001-testutils.yaml (requirements R2.1, R2.2, R2.3, R2.4)
      - pkg/testutils/ (existing implementation -- DiffTest struct, NormalizeFunc type created by prior task for R1.1-R1.4)
      - docs/ARCHITECTURE.yaml (pkg/testutils component -- differential testing harness)

    files:
      - path: pkg/testutils/difftest.go
        action: modify
        note: Add RunDiffTests function that executes Go and reference binaries, compares stdout, stderr, and exit code

    requirements:
      - id: R1
        text: "Implement srd001-testutils R2.1 as specified in the SRD -- RunDiffTests core execution logic"
      - id: R2
        text: "Implement srd001-testutils R2.2 as specified in the SRD -- binary invocation with args, stdin, env, workdir from DiffTest"
      - id: R3
        text: "Implement srd001-testutils R2.3 as specified in the SRD -- stdout and stderr capture and comparison"
      - id: R4
        text: "Implement srd001-testutils R2.4 as specified in the SRD -- exit code comparison and error reporting"

    design_decisions:
      - id: D1
        text: "RunDiffTests signature: func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest)"
      - id: D2
        text: "Use os/exec.Command to invoke both binaries with identical arguments, stdin, and environment"
      - id: D3
