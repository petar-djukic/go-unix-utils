- index: 3
  title: "[stitch] srd001-testutils R2.5-R2.6, R3.1-R3.2 -- Output normalization and ComposeNormalizers"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd001-testutils.yaml (requirements R2.5, R2.6, R3.1, R3.2)
      - pkg/testutils/ (existing implementation -- DiffTest struct, NormalizeFunc, RunDiffTests from prior tasks)

    files:
      - path: pkg/testutils/difftest.go
        action: modify
        note: Add normalization support to RunDiffTests per R2.5-R2.6, implement ComposeNormalizers per R3.1-R3.2

    requirements:
      - id: R1
        text: "Implement srd001-testutils R2.5 as specified in the SRD -- apply Normalize functions from DiffTest before comparison"
      - id: R2
        text: "Implement srd001-testutils R2.6 as specified in the SRD -- additional RunDiffTests comparison features"
      - id: R3
        text: "Implement srd001-testutils R3.1 as specified in the SRD -- ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc"
      - id: R4
        text: "Implement srd001-testutils R3.2 as specified in the SRD -- normalizer composition and chaining"

    design_decisions:
      - id: D1
        text: "ComposeNormalizers signature: func ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc"
      - id: D2
        text: "NormalizeFunc is type NormalizeFunc = func([]byte) []byte -- a type alias, not a named type"
      - id: D3
        text: "RunDiffTests applies DiffTest.Normalize functions to both Go and reference binary output before byte comparison"
      - id: D4
        text: "pkg/testutils must not import any cmd/ or other pkg/ package"

