- index: 0
  title: "[stitch] cmd/paste (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd027-paste.yaml (full SRD -- read all requirements to identify flags, modes, and core operations)
      - cmd/cut/main.go (reference contract for a columnar utility in the same release)
      - pkg/sys/sys.go (InstallSIGPIPEHandler interface)

    files:
      - path: cmd/paste/main.go
        action: create
        note: paste command entry point with flag definitions and function stubs

    requirements:
      - id: R1
        text: "Create cmd/paste/main.go with package main, all necessary imports, and main() that calls sys.InstallSIGPIPEHandler() before any I/O"
      - id: R2
        text: "Define all flag variables covering every flag specified in srd027-paste -- serial mode, delimiter list, zero-terminated mode, and --help/--version"
      - id: R3
        text: "Create stub functions for all core operations identified in the SRD -- parallel merge of multiple files, serial mode processing, delimiter cycling -- each stub has the correct signature and returns a placeholder error or zero value"
      - id: R4
        text: "Wire flag parsing in main() to dispatch to the correct stub based on flag combinations, with os.Exit(1) for invalid usage"

    design_decisions:
      - id: D1
        text: "Follow the contract pattern established by cmd/cut/main.go -- define all function signatures with stub bodies that compile but do not implement logic"
      - id: D2
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for SIGPIPE handling per the shared SIGPIPE protocol in ARCHITECTURE.yaml"

    acceptance_criteria:
      - id: AC1
        text: "cmd/paste/main.go exists and compiles with go build ./cmd/paste/"
      - id: AC2
        text: "All flags declared in srd027-paste are present and registered"
      - id: AC3
        text: "main() calls sys.InstallSIGPIPEHandler() as its first action"
      - id: AC4
        text: "go vet ./cmd/paste/ passes with no diagnostics"
      - id: AC5
        text: "Every core operation identified in the SRD has a stub with the correct signature"

- index: 1
  title: "[stitch] cmd/cut: implement srd026-cut R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd026-cut.yaml (full SRD -- focus on requirements R1.1 through R1.4)
      - cmd/cut/main.go (existing contract with function stubs to fill in)

    files:
      - path: cmd/cut/main.go
        action: modify
        note: Implement R1.1-R1.4 logic in the existing contract stubs

    requirements:
      - id: R1
        text: "Implement srd026-cut requirement R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd026-cut requirement R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd026-cut requirement R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd026-cut requirement R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Modify the existing contract stubs in cmd/cut/main.go -- preserve the function signatures and structure established by the contract task"
      - id: D2
        text: "All I/O goes through the function signatures defined in the contract -- do not add new exported functions"

    acceptance_criteria:
      - id: AC1
