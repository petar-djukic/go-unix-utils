- index: 0
  title: "cmd/ln implementation -- core link creation (srd037-ln R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd037-ln.yaml (full SRD for ln -- read all requirements before starting)
      - cmd/mkdir/main.go (reference example of a file operation utility in this project)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler implementation for SIGPIPE protocol)

    files:
      - path: cmd/ln/main.go
        action: create
        note: "ln utility -- core hard link creation, argument parsing, program structure"

    requirements:
      - id: R1
        text: "Implement srd037-ln R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd037-ln R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd037-ln R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd037-ln R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the project shared SIGPIPE protocol"
      - id: D2
        text: "Import sys as github.com/petar-djukic/go-unix-utils/pkg/sys"
      - id: D3
        text: "Build with go build -o bin/ln ./cmd/ln/ -- the bin/ directory is gitignored"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/ln ./cmd/ln/ succeeds without errors"
      - id: AC2
        text: "go vet ./cmd/ln/ reports no warnings"
      - id: AC3
        text: "All four SRD requirements R1.1 through R1.4 are implemented as specified"
      - id: AC4
        text: "Program structure follows the pattern of other cmd/ packages in the project"

