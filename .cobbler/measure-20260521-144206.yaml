- index: 0
  title: "[stitch] cmd/touch: srd062 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd062-touch.yaml (requirement group R3 -- implementation and test requirements)
      - cmd/touch/main.go (existing implementation from earlier requirement groups)
      - cmd/touch/touch_test.go (existing differential tests)
      - pkg/testutils/difftest.go (DiffTest and RunDiffTests pattern)
      - pkg/sys/stat.go (FileInfo, Stat, Lstat for timestamp operations)

    files:
      - path: cmd/touch/main.go
        action: modify
        note: Implement srd062 R3.1-R3.4 functionality
      - path: cmd/touch/touch_test.go
        action: modify
        note: Add differential tests for R3.1-R3.4

    requirements:
      - id: R1
        text: "Implement srd062-touch requirement R3.1 as specified in the SRD"
      - id: R2
        text: "Implement srd062-touch requirement R3.2 as specified in the SRD"
      - id: R3
        text: "Implement srd062-touch requirement R3.3 as specified in the SRD"
      - id: R4
        text: "Implement srd062-touch requirement R3.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Follow the differential testing pattern: use testutils.BuildBinary and testutils.RunDiffTests with reference binary gtouch"
      - id: D2
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D3
        text: "Use exec.LookPath for gtouch and t.Skip if not found, so tests pass on machines without Homebrew GNU binaries"

    acceptance_criteria:
      - id: AC1
        text: "srd062 R3.1 through R3.4 are implemented in cmd/touch/main.go"
      - id: AC2
        text: "Differential tests for R3.1-R3.4 are added to cmd/touch/touch_test.go"
      - id: AC3
        text: "go build -o bin/touch ./cmd/touch/ compiles without errors"
      - id: AC4
        text: "go test ./cmd/touch/... -count=1 passes (or skips if gtouch not in PATH)"
      - id: AC5
        text: "go vet ./cmd/touch/... reports no issues"

