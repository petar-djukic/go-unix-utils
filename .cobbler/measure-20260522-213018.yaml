- index: 0
  title: "[stitch] cmd/b2sum implementation -- srd076 R3.2, R3.3, R4.1, R4.2"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd076-b2sum.yaml (requirements R3.2, R3.3, R4.1, R4.2)
      - cmd/b2sum/main.go (existing implementation from prior tasks covering R1.1-R3.1)
      - cmd/b2sum/b2sum_test.go (existing differential tests)
      - pkg/hashutil/ (shared hash utility library)

    files:
      - path: cmd/b2sum/main.go
        action: modify
        note: Add functionality for srd076 R3.2, R3.3, R4.1, R4.2
      - path: cmd/b2sum/b2sum_test.go
        action: modify
        note: Add differential test cases for R3.2, R3.3, R4.1, R4.2

    requirements:
      - id: R1
        text: "Implement srd076 requirement R3.2 per the SRD specification"
      - id: R2
        text: "Implement srd076 requirement R3.3 per the SRD specification"
      - id: R3
        text: "Implement srd076 requirement R4.1 per the SRD specification"
      - id: R4
        text: "Implement srd076 requirement R4.2 per the SRD specification"
      - id: R5
        text: "Add differential test cases covering R3.2, R3.3, R4.1, R4.2 using testutils.RunDiffTests against gb2sum reference binary"

    design_decisions:
      - id: D1
        text: "Use pkg/hashutil for shared hash computation and checksum formatting"
      - id: D2
        text: "Follow the differential testing pattern: testutils.BuildBinary for Go binary, exec.LookPath for gb2sum reference, t.Skip if reference not found"
      - id: D3
        text: "Preserve existing implementation structure from prior tasks (R1.1-R3.1)"

    acceptance_criteria:
      - id: AC1
        text: "go vet ./cmd/b2sum/... passes with no warnings"
      - id: AC2
        text: "go build -o bin/b2sum ./cmd/b2sum/ succeeds"
      - id: AC3
        text: "go test ./cmd/b2sum/... -count=1 passes (or skips gracefully if gb2sum not in PATH)"
      - id: AC4
        text: "All four SRD requirements (R3.2, R3.3, R4.1, R4.2) are implemented"
      - id: AC5
        text: "Differential tests cover each new requirement with at least one test case per requirement"

