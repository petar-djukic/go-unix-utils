- index: 0
  title: "cmd/nl: srd022-nl (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd022-nl.yaml (nl SRD -- all requirements and acceptance criteria define the flags, numbering styles, and behaviors)
      - cmd/tac/main.go (reference for cmd/ package structure, flag parsing pattern, and InstallSIGPIPEHandler usage)
      - cmd/tac/tac_test.go (reference for differential test structure using testutils.RunDiffTests)

    files:
      - path: cmd/nl/main.go
        action: create
        note: Package main with option struct, flag parsing, InstallSIGPIPEHandler call, and function stubs for all core processing
      - path: cmd/nl/nl_test.go
        action: create
        note: TestDiff skeleton with BuildBinary, LookPath for gnl, empty DiffTest slice

    requirements:
      - id: R1
        text: Create cmd/nl/main.go with package main, imports, and an options struct with fields for all flags defined in srd022-nl
      - id: R2
        text: Define main() that calls sys.InstallSIGPIPEHandler(), parses all flags into the options struct, and calls a stub processInput function that reads from stdin or file arguments
      - id: R3
        text: Define stub function signatures for core nl processing logic per srd022-nl -- stubs must compile but contain only placeholder logic (e.g. return nil)
      - id: R4
        text: Create cmd/nl/nl_test.go with TestDiff that calls testutils.BuildBinary(t, "."), exec.LookPath("gnl"), t.Skip if gnl not found, and testutils.RunDiffTests with an empty test slice

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() as the first statement in main() per project shared protocol
      - id: D2
        text: Use testutils.BuildBinary(t, ".") and testutils.RunDiffTests(t, goBin, refBin, tests) pattern per project shared protocol
      - id: D3
        text: Skip tests gracefully with t.Skip if gnl reference binary is not found via exec.LookPath
      - id: D4
        text: Derive all flag names, types, and default values from srd022-nl -- do not invent flags or defaults not specified in the SRD

    acceptance_criteria:
      - id: AC1
        text: go build ./cmd/nl/ compiles without errors
      - id: AC2
        text: go vet ./cmd/nl/ reports no issues
      - id: AC3
        text: go test ./cmd/nl/ -count=1 passes (tests skip if gnl not found, pass with empty test slice if found)
      - id: AC4
        text: All srd022-nl flags are represented as fields in the options struct with correct types and defaults
      - id: AC5
        text: All core processing functions have stub signatures that compile

