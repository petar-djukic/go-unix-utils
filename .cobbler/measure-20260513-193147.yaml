- index: 0
  title: "pkg/encutil contract (srd088-encutil)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd088-encutil.yaml (encoding utility library SRD -- defines all requirements, types, and function signatures)
      - docs/ARCHITECTURE.yaml (pkg/ component descriptions, import constraints, and design decisions)

    files:
      - path: pkg/encutil/encode.go
        action: create
        note: "EncoderConfig type and Encode function stub"
      - path: pkg/encutil/decode.go
        action: create
        note: "DecoderConfig type, Decode and OpenInput function stubs"

    requirements:
      - id: R1
        text: "Define EncoderConfig struct with fields: Encode func([]byte) string, WrapCol int"
      - id: R2
        text: "Define Encode function signature: func(r io.Reader, w io.Writer, cfg EncoderConfig) error -- panic stub body"
      - id: R3
        text: "Define DecoderConfig struct with fields: Decode func(string) ([]byte, error), IgnoreGarbage bool"
      - id: R4
        text: "Define Decode function signature: func(r io.Reader, w io.Writer, cfg DecoderConfig) error -- panic stub body"
      - id: R5
        text: "Define OpenInput function signature: func(filename string) (io.ReadCloser, error) -- panic stub body"

    design_decisions:
      - id: D1
        text: "All function bodies are panic(\"not implemented\") stubs -- implementation follows in separate tasks"
      - id: D2
        text: "Import constraints per ARCHITECTURE: must not import any cmd/ package or any other pkg/ package"
      - id: D3
        text: "Split into encode.go (EncoderConfig, Encode) and decode.go (DecoderConfig, Decode, OpenInput) following Go convention of one file per logical concern"

    acceptance_criteria:
      - id: AC1
        text: "go build ./pkg/encutil/... succeeds with no errors"
      - id: AC2
        text: "go vet ./pkg/encutil/... reports no issues"
      - id: AC3
        text: "All five exported symbols (EncoderConfig, DecoderConfig, Encode, Decode, OpenInput) are present with correct signatures"
      - id: AC4
        text: "No imports of cmd/ or other pkg/ packages"

