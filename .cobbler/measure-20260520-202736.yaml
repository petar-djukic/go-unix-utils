- index: 0
  title: "cmd/cp: srd056 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd056-cp.yaml (requirements R3.1 through R3.4)
      - cmd/cp/main.go (existing implementation covering R1.1-R2.4)
      - cmd/cp/cp_test.go (existing differential tests)
      - pkg/testutils/ (RunDiffTests, BuildBinary, DiffTest pattern)
      - pkg/sys/ (InstallSIGPIPEHandler, Stat, Lstat)

    files:
      - path: cmd/cp/main.go
        action: modify
        note: Add functionality for srd056-cp R3.1 through R3.4
      - path: cmd/cp/cp_test.go
        action: modify
        note: Add differential test cases covering R3.1 through R3.4

    requirements:
      - id: R1
        text: Implement the functionality specified by srd056-cp requirement R3.1
      - id: R2
        text: Implement the functionality specified by srd056-cp requirement R3.2
      - id: R3
        text: Implement the functionality specified by srd056-cp requirement R3.3
      - id: R4
        text: Implement the functionality specified by srd056-cp requirement R3.4

    design_decisions:
      - id: D1
        text: Extend the existing cmd/cp implementation -- do not rewrite or restructure code from R1.1-R2.4
      - id: D2
        text: Use testutils.RunDiffTests with gcp as the reference binary for all new differential tests
      - id: D3
        text: Skip differential tests with t.Skip if gcp is not found via exec.LookPath
      - id: D4
        text: Set LC_ALL=C in test environment to match GNU reference binary behavior

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/cp ./cmd/cp/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/cp/... reports no issues
      - id: AC3
        text: go test ./cmd/cp/... -count=1 passes (or skips if reference binary not found)
      - id: AC4
        text: Each of R3.1 through R3.4 has at least one differential test case in cp_test.go

