- index: 0
  title: "cmd/sort: core I/O and basic sorting -- srd053 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd053-sort.yaml (sort SRD -- focus on requirements R1.1 through R1.4)
      - docs/specs/use-cases/rel07.0-uc001-sort.yaml (sort use case for behavioral context)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern required by all cmd/ utilities)
      - cmd/head/main.go (example cmd/ package showing project structure and flag parsing conventions)

    files:
      - path: cmd/sort/main.go
        action: create
        note: sort utility entry point, flag parsing foundation, core line sorting, and I/O handling

    requirements:
      - id: R1
        text: Implement srd053-sort requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd053-sort requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd053-sort requirement R1.3 as specified in the SRD
      - id: R4
        text: Implement srd053-sort requirement R1.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main per project convention
      - id: D2
        text: Follow the same flag parsing and error handling patterns as other cmd/ packages in this repository
      - id: D3
        text: Target LC_ALL=C locale behavior only per project architecture decision DD6

    acceptance_criteria:
      - id: AC1
        text: cmd/sort/main.go exists and compiles with go build -o bin/sort ./cmd/sort/
      - id: AC2
        text: go vet ./cmd/sort/ reports no issues
      - id: AC3
        text: Requirements R1.1 through R1.4 from srd053-sort.yaml are implemented as specified
      - id: AC4
        text: The binary calls sys.InstallSIGPIPEHandler() at program start

