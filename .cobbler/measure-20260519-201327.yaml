- index: 3
  title: "[stitch] cmd/rmdir basic directory removal (srd035 R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd035-rmdir.yaml (requirement group R1 -- basic directory removal)
      - cmd/mkdir/main.go (reference for directory utility structure and flag parsing pattern)
      - pkg/testutils/ (RunDiffTests, BuildBinary, DiffTest pattern)
      - pkg/sys/ (InstallSIGPIPEHandler)

    files:
      - path: cmd/rmdir/main.go
        action: create
        note: rmdir implementation -- basic empty directory removal with argument handling
      - path: cmd/rmdir/rmdir_test.go
        action: create
        note: Differential tests comparing Go rmdir against grmdir reference binary

    requirements:
      - id: R1
        text: Implement srd035 R1.1 as specified in the SRD -- remove each directory argument that is empty, reporting an error for non-empty directories
      - id: R2
        text: Implement srd035 R1.2 as specified in the SRD -- support multiple directory arguments, processing each in order and continuing after errors
      - id: R3
        text: Implement srd035 R1.3 as specified in the SRD -- match GNU rmdir error messages and exit codes (exit 0 on all success, exit 1 if any removal fails)
      - id: R4
        text: Implement srd035 R1.4 as specified in the SRD -- handle edge cases such as non-existent directories, paths that are files, and permission denied

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior
      - id: D2
        text: Use the differential testing pattern -- BuildBinary for Go binary, exec.LookPath for grmdir reference, t.Skip if reference not found
      - id: D3
        text: Set LC_ALL=C in all differential test environments
      - id: D4
        text: Read srd035-rmdir.yaml for exact error message format and flag semantics -- the SRD is the source of truth

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/rmdir ./cmd/rmdir/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/rmdir/ reports no issues"
      - id: AC3
        text: "go test ./cmd/rmdir/ -count=1 passes -- differential tests pass against grmdir reference binary"
      - id: AC4
        text: "rmdir removes an empty directory and exits 0"
      - id: AC5
        text: "rmdir on a non-empty directory writes an error to stderr and exits 1"
      - id: AC6
        text: "rmdir with multiple arguments processes all arguments, continuing after errors"