- index: 0
  title: "[stitch] cmd/mkdir parent directory creation (srd034 R2.1, R2.2, R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd034-mkdir.yaml (requirement group R2 -- parent directory creation)
      - cmd/mkdir/main.go (existing implementation covering R1.1-R1.4 basic directory creation)
      - cmd/mkdir/mkdir_test.go (existing differential tests)
      - pkg/testutils/ (RunDiffTests and BuildBinary pattern)
      - pkg/sys/ (InstallSIGPIPEHandler)

    files:
      - path: cmd/mkdir/main.go
        action: modify
        note: Add -p flag support for creating parent directories
      - path: cmd/mkdir/mkdir_test.go
        action: modify
        note: Add differential tests for -p parent creation behavior

    requirements:
      - id: R1
        text: Implement srd034 R2.1 as specified in the SRD -- add the -p / --parents flag that creates intermediate parent directories as needed
      - id: R2
        text: Implement srd034 R2.2 as specified in the SRD -- when -p is given and the target directory already exists, do not report an error
      - id: R3
        text: Implement srd034 R2.3 as specified in the SRD -- handle -p interaction with other flags and multi-argument invocations

    design_decisions:
      - id: D1
        text: Follow the differential testing pattern -- compare Go mkdir against gmkdir from Homebrew coreutils using testutils.RunDiffTests
      - id: D2
        text: Maintain the existing SIGPIPE handler call (sys.InstallSIGPIPEHandler) at the start of main
      - id: D3
        text: Read srd034-mkdir.yaml for exact flag semantics and error behavior -- the SRD is the source of truth for -p behavior

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/mkdir ./cmd/mkdir/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/mkdir/ reports no issues"
      - id: AC3
        text: "go test ./cmd/mkdir/ -count=1 passes -- all existing tests continue to pass and new -p tests pass against gmkdir reference binary"
      - id: AC4
        text: "mkdir -p creates intermediate directories and does not error when the target already exists"

