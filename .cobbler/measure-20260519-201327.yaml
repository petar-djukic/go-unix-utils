    requirements:
      - id: R1
        text: Implement srd034 R4.1 as specified in the SRD -- handle error conditions (permission denied, path component not a directory, etc.) with correct stderr messages and exit codes
      - id: R2
        text: Implement srd034 R4.2 as specified in the SRD -- implement --version output matching GNU coreutils format
      - id: R3
        text: Implement srd034 R4.3 as specified in the SRD -- implement --help output matching GNU coreutils format

