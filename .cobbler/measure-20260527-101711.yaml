- index: 2
  title: "cmd/who differential tests -- srd097-who"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd097-who.yaml (all requirements for test coverage)
      - docs/specs/test-suites/test-rel-11.1.yaml (test suite specification)
      - cmd/who/main.go (implementation under test)
      - cmd/users/users_test.go (differential test pattern for utmpx utility)
      - pkg/testutils/ (DiffTest struct and RunDiffTests function)

    files:
      - path: cmd/who/who_test.go
        action: create
        note: differential tests comparing who against gwho reference binary

    requirements:
      - id: R1
        text: "Create TestDiff function using testutils.BuildBinary and testutils.RunDiffTests"
      - id: R2
        text: "Add DiffTest cases covering srd097-who R2.1-R2.4 behaviors"
      - id: R3
        text: "Add DiffTest cases covering srd097-who R3.1-R3.3 behaviors"
      - id: R4
        text: "Skip gracefully when gwho reference binary is not in PATH"

    design_decisions:
      - id: D1
        text: "Use exec.LookPath(\"gwho\") and t.Skip if not found per shared protocol"
      - id: D2
        text: "Set LC_ALL=C in test environment to ensure deterministic output comparison"
      - id: D3
        text: "Use timestamp or session-dependent normalizers where who output varies between runs"

    acceptance_criteria:
      - id: AC1
        text: "who_test.go compiles with go vet ./cmd/who/"
      - id: AC2
        text: "Tests skip cleanly when gwho is not installed"
      - id: AC3
        text: "Tests pass against gwho reference binary when available"
      - id: AC4
        text: "Test cases cover all implemented srd097-who requirements (R2.1-R3.3)"

