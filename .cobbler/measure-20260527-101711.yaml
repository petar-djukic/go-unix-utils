- index: 0
  title: "cmd/who implementation -- srd097-who R2.1, R2.2, R2.3, R2.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd097-who.yaml (requirements R2.1-R2.4)
      - cmd/users/main.go (utmpx reading pattern -- users is already implemented)
      - cmd/pinky/main.go (utmpx reading pattern -- pinky is already implemented)
      - pkg/sys/ (system call abstractions)

    files:
      - path: cmd/who/main.go
        action: create
        note: who utility implementation covering R2.1-R2.4

    requirements:
      - id: R1
        text: "Implement srd097-who R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd097-who R2.2 as specified in the SRD"
      - id: R3
        text: "Implement srd097-who R2.3 as specified in the SRD"
      - id: R4
        text: "Implement srd097-who R2.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per shared protocol"
      - id: D2
        text: "Follow the utmpx reading pattern established in cmd/users/ and cmd/pinky/"
      - id: D3
        text: "Use os.Exit for non-zero exit codes to match GNU who behavior"

    acceptance_criteria:
      - id: AC1
        text: "cmd/who/main.go compiles with go build ./cmd/who/"
      - id: AC2
        text: "go vet ./cmd/who/ passes with no warnings"
      - id: AC3
        text: "All behaviors specified in srd097-who R2.1-R2.4 are implemented"
      - id: AC4
        text: "sys.InstallSIGPIPEHandler() is called at start of main"

