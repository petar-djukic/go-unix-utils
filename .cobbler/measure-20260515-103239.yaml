- index: 0
  title: "[stitch] cmd/unexpand: implement srd025-unexpand R2.1-R2.3"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd025-unexpand.yaml (full SRD -- implement requirements R2.1, R2.2, R2.3)
      - cmd/unexpand/main.go (existing implementation from R1.1-R1.4 contract and first task)
      - cmd/unexpand/unexpand_test.go (existing differential tests)
      - pkg/testutils/ (differential testing framework -- BuildBinary, RunDiffTests, DiffTest)
      - pkg/sys/ (InstallSIGPIPEHandler)

    files:
      - path: cmd/unexpand/main.go
        action: modify
        note: Add functionality required by srd025-unexpand R2.1, R2.2, R2.3
      - path: cmd/unexpand/unexpand_test.go
        action: modify
        note: Add differential test cases covering R2.1, R2.2, R2.3

    requirements:
      - id: R1
        text: Implement srd025-unexpand requirement R2.1 exactly as specified in the SRD
      - id: R2
        text: Implement srd025-unexpand requirement R2.2 exactly as specified in the SRD
      - id: R3
        text: Implement srd025-unexpand requirement R2.3 exactly as specified in the SRD

    design_decisions:
      - id: D1
        text: Follow the differential testing pattern -- use testutils.BuildBinary(t, ".") to compile cmd/unexpand and testutils.RunDiffTests to compare against the reference binary
      - id: D2
        text: Reference binary is gunexpand from Homebrew GNU coreutils -- use exec.LookPath("gunexpand") and t.Skip if not found
      - id: D3
        text: All differential test cases must set LC_ALL=C in the Env field to ensure deterministic locale behavior

    acceptance_criteria:
      - id: AC1
        text: srd025-unexpand requirements R2.1, R2.2, and R2.3 are fully implemented in cmd/unexpand/main.go
      - id: AC2
        text: Differential test cases exercising R2.1, R2.2, and R2.3 are added to cmd/unexpand/unexpand_test.go
      - id: AC3
        text: go build ./cmd/unexpand/ succeeds with no errors
      - id: AC4
        text: go vet ./cmd/unexpand/ reports no issues
      - id: AC5
        text: go test ./cmd/unexpand/ -count=1 passes (tests skip gracefully if gunexpand is not in PATH)

