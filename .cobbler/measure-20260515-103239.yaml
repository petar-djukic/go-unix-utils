- index: 3
  title: "[stitch] cmd/cut (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd026-cut.yaml (full SRD for cut -- read all requirements to understand the complete flag set and processing modes)
      - pkg/testutils/ (differential testing framework -- BuildBinary, RunDiffTests, DiffTest struct)
      - pkg/sys/ (InstallSIGPIPEHandler)
      - cmd/unexpand/main.go (reference for contract structure pattern in this project)

    files:
      - path: cmd/cut/main.go
        action: create
        note: Package main with flag definitions, option struct, stub processing functions, and main() entrypoint
      - path: cmd/cut/cut_test.go
        action: create
        note: TestDiff skeleton with BuildBinary and RunDiffTests wiring

    requirements:
      - id: R1
        text: Create cmd/cut/main.go with package main declaration, an options struct covering all flags defined in srd026-cut (byte selection, character selection, field selection, delimiter, output delimiter, complement, only-delimited), and flag.Parse wiring
      - id: R2
        text: Define stub processing functions for each selection mode (bytes, characters, fields) that accept parsed options and an io.Reader, returning immediately or with a "not implemented" panic
      - id: R3
        text: Wire main() to call sys.InstallSIGPIPEHandler(), parse flags into the options struct, and dispatch to the appropriate stub processing function
      - id: R4
        text: Create cmd/cut/cut_test.go with a TestDiff function that calls testutils.BuildBinary(t, "."), looks up gcut via exec.LookPath (t.Skip if not found), and calls testutils.RunDiffTests with an empty []testutils.DiffTest slice

    design_decisions:
      - id: D1
        text: This is a contract task -- create compilable stubs, not full implementations. Stub functions may panic("not implemented") or return zero values.
      - id: D2
        text: Reference binary for differential testing is gcut from Homebrew GNU coreutils
      - id: D3
        text: Follow the same package structure as other cmd/ utilities -- main.go for implementation and cut_test.go for differential tests in the same directory

    acceptance_criteria:
      - id: AC1
        text: cmd/cut/main.go exists with package main, all SRD flag definitions, option struct, and stub functions
      - id: AC2
        text: cmd/cut/cut_test.go exists with TestDiff skeleton following the differential testing pattern
      - id: AC3
        text: go build ./cmd/cut/ succeeds -- the contract compiles without errors
      - id: AC4
        text: go vet ./cmd/cut/ reports no issues
      - id: AC5
        text: go test ./cmd/cut/ -count=1 passes (tests skip if gcut is not in PATH; empty test slice means no failures)