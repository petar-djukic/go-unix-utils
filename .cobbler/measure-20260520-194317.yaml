- index: 0
  title: "[stitch] cmd/tail: srd055 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd055-tail.yaml (requirement groups R3.1-R3.4)
      - cmd/tail/main.go (existing implementation from R1-R2)
      - cmd/tail/tail_test.go (existing differential tests from R1-R2)
      - pkg/testutils/ (differential testing pattern -- RunDiffTests, BuildBinary, DiffTest)
      - pkg/sys/ (InstallSIGPIPEHandler for SIGPIPE handling)
      - CLAUDE.md (project conventions and build instructions)

    files:
      - path: cmd/tail/main.go
        action: modify
        note: Add functionality for srd055-tail requirements R3.1 through R3.4
      - path: cmd/tail/tail_test.go
        action: modify
        note: Add differential test cases covering R3.1 through R3.4

    requirements:
      - id: R1
        text: "Implement srd055-tail requirement R3.1 as specified in the SRD"
      - id: R2
        text: "Implement srd055-tail requirement R3.2 as specified in the SRD"
      - id: R3
        text: "Implement srd055-tail requirement R3.3 as specified in the SRD"
      - id: R4
        text: "Implement srd055-tail requirement R3.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Use the differential testing pattern: testutils.BuildBinary for the Go binary, exec.LookPath(\"gtail\") for the GNU reference, t.Skip if reference not found"
      - id: D2
        text: "Call sys.InstallSIGPIPEHandler() at the start of main"
      - id: D3
        text: "Set LC_ALL=C in all differential test environments"
      - id: D4
        text: "Build with go build -o bin/tail ./cmd/tail/"

    acceptance_criteria:
      - id: AC1
        text: "All R3.1-R3.4 behaviors from srd055-tail are implemented in cmd/tail/main.go"
      - id: AC2
        text: "Differential test cases exist for each R3.x requirement in cmd/tail/tail_test.go"
      - id: AC3
        text: "go build ./cmd/tail/ compiles without errors"
      - id: AC4
        text: "go test ./cmd/tail/... -count=1 passes (or skips if gtail not in PATH)"
      - id: AC5
        text: "go vet ./cmd/tail/ reports no issues"

