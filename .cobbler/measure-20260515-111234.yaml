- index: 0
  title: "cmd/cut -- srd026 R4.1-R4.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd026-cut.yaml (requirements R4.1 through R4.4)
      - cmd/cut/main.go (existing cut implementation -- R1 through R3 already implemented)
      - pkg/testutils/ (DiffTest struct and RunDiffTests function for differential testing)
      - CLAUDE.md (differential testing pattern, SIGPIPE, and BuildBinary conventions)

    files:
      - path: cmd/cut/cut_test.go
        action: create
        note: Differential tests for cut using testutils.RunDiffTests against gcut

    requirements:
      - id: R1
        text: "Implement srd026-cut requirement R4.1 exactly as specified in the SRD"
      - id: R2
        text: "Implement srd026-cut requirement R4.2 exactly as specified in the SRD"
      - id: R3
        text: "Implement srd026-cut requirement R4.3 exactly as specified in the SRD"
      - id: R4
        text: "Implement srd026-cut requirement R4.4 exactly as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile cmd/cut and exec.LookPath(\"gcut\") for the GNU reference binary"
      - id: D2
        text: "Call t.Skip if the reference binary gcut is not found in PATH"
      - id: D3
        text: "Set LC_ALL=C in the Env field of each DiffTest to ensure consistent ordering between Go and GNU binaries"

    acceptance_criteria:
      - id: AC1
        text: "cmd/cut/cut_test.go exists with a TestDiff function using testutils.RunDiffTests"
      - id: AC2
        text: "Each of the four SRD requirements R4.1 through R4.4 is covered by at least one DiffTest case"
      - id: AC3
        text: "go test ./cmd/cut/... -count=1 passes when gcut is available, or skips gracefully when gcut is absent"
      - id: AC4
        text: "go vet ./cmd/cut/... reports no issues"

- index: 1
  title: "cmd/paste -- srd027 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd027-paste.yaml (requirements R1.1 through R1.4)
      - pkg/sys/ (InstallSIGPIPEHandler for SIGPIPE handling)
      - CLAUDE.md (SIGPIPE handler requirement, build conventions, differential testing pattern)

    files:
      - path: cmd/paste/main.go
        action: create
        note: Initial paste implementation covering R1.1 through R1.4

    requirements:
      - id: R1
        text: "Implement srd027-paste requirement R1.1 exactly as specified in the SRD"
      - id: R2
        text: "Implement srd027-paste requirement R1.2 exactly as specified in the SRD"
      - id: R3
        text: "Implement srd027-paste requirement R1.3 exactly as specified in the SRD"
      - id: R4
        text: "Implement srd027-paste requirement R1.4 exactly as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils behavior when piped to consumers that close stdin early"
      - id: D2
        text: "Import pkg/sys as github.com/petar-djukic/go-unix-utils/pkg/sys"
      - id: D3
        text: "Build the binary with go build -o bin/paste ./cmd/paste/ and keep bin/ in .gitignore"

    acceptance_criteria:
      - id: AC1
        text: "cmd/paste/main.go exists and compiles with go build -o bin/paste ./cmd/paste/"
      - id: AC2
        text: "All four SRD requirements R1.1 through R1.4 are implemented"
      - id: AC3
        text: "go vet ./cmd/paste/... reports no issues"
      - id: AC4
        text: "The main function calls sys.InstallSIGPIPEHandler() before any I/O"

