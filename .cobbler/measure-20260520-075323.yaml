- index: 1
  title: "[stitch] cmd/mktemp implementation -- basic template and file creation (srd036-mktemp R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd036-mktemp.yaml (R1.1 through R1.4)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler -- call at start of main)
      - pkg/testutils/difftest.go (DiffTest struct, RunDiffTests, BuildBinary)
      - cmd/ln/main.go (reference for cmd/ package structure and flag parsing patterns)
      - cmd/ln/ln_test.go (reference for differential test structure)

    files:
      - path: cmd/mktemp/main.go
        action: create
        note: "mktemp implementation covering R1.1-R1.4 -- the cmd/mktemp/ directory may already contain collision.* test fixture files which are not source code"
      - path: cmd/mktemp/mktemp_test.go
        action: create
        note: Differential tests for R1.1-R1.4 using RunDiffTests against gmktemp

    requirements:
      - id: R1
        text: "Implement srd036-mktemp R1.1"
      - id: R2
        text: "Implement srd036-mktemp R1.2"
      - id: R3
        text: "Implement srd036-mktemp R1.3"
      - id: R4
        text: "Implement srd036-mktemp R1.4"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D2
        text: "Use pkg/testutils.RunDiffTests to compare output against gmktemp reference binary"
      - id: D3
        text: "Call exec.LookPath('gmktemp') and t.Skip if reference binary not found"
      - id: D4
        text: "Set LC_ALL=C in differential test environment"
      - id: D5
        text: "The cmd/mktemp/ directory may already contain collision.* fixture files -- these are not source code and must not be modified or removed"

    acceptance_criteria:
      - id: AC1
        text: "cmd/mktemp/main.go created with R1.1-R1.4 functionality per SRD"
      - id: AC2
        text: "cmd/mktemp/mktemp_test.go created with differential tests for R1.1-R1.4"
      - id: AC3
        text: "go build -o bin/mktemp ./cmd/mktemp/ succeeds"
      - id: AC4
        text: "go test ./cmd/mktemp/ -count=1 passes"
      - id: AC5
        text: "Existing collision.* files in cmd/mktemp/ are untouched"

