- index: 0
  title: "pkg/format srd003-format (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd003-format.yaml (full SRD defining format package exports and behavior)
      - docs/ARCHITECTURE.yaml (pkg/format component -- output formatting, color, alignment)
      - pkg/sys/ (dependency package -- format imports pkg/sys for terminal detection)

    files:
      - path: pkg/format/humansize.go
        action: create
        note: HumanSizeOpts struct and HumanSize function stub
      - path: pkg/format/color.go
        action: create
        note: FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled stubs
      - path: pkg/format/column.go
        action: create
        note: PadRight, PadLeft, Columns function stubs

    requirements:
      - id: R1
        text: "Define HumanSizeOpts struct with field Binary bool, and stub function HumanSize(bytes int64, opts HumanSizeOpts) string"
      - id: R2
        text: "Define color function stubs -- FileTypeColor(mode os.FileMode) string, Reset() string, ColorEnabled(w io.Writer) bool, SetColorEnabled(enabled bool), ResetColorEnabled()"
      - id: R3
        text: "Define alignment function stubs -- PadRight(s string, width int) string, PadLeft(s string, width int) string, Columns(entries []string, termWidth int) [][]string"

    design_decisions:
      - id: D1
        text: "Package import path is github.com/petar-djukic/go-unix-utils/pkg/format"
      - id: D2
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for terminal detection. Import io and os from stdlib. Must not import any cmd/ package."
      - id: D3
        text: "All function bodies use panic(\"not implemented\") to satisfy return types -- this task creates the contract only, no implementation logic"

    acceptance_criteria:
      - id: AC1
        text: All exported types and functions listed in R1 through R3 are defined with correct signatures
      - id: AC2
        text: go build ./pkg/format/... compiles without errors
      - id: AC3
        text: No function body contains implementation logic -- all bodies are panic stubs only

- index: 1
  title: "pkg/sys srd002-sys R2.6, R3.1, R3.2, R3.3"
  dependency: -1
  description: |
