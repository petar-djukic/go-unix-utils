      - docs/specs/software-requirements/srd002-sys.yaml (requirements R2.6, R3.1, R3.2, R3.3)
      - pkg/sys/ (existing package source files -- read all .go files to understand current state before modifying)

    files:
      - path: pkg/sys/stat.go
        action: modify
        note: Extend file metadata functionality per applicable requirements
      - path: pkg/sys/terminal.go
        action: modify
        note: Extend terminal functions per applicable requirements
      - path: pkg/sys/sigpipe.go
        action: modify
        note: Extend signal handling per applicable requirements

    requirements:
      - id: R1
        text: "Implement srd002-sys requirement R2.6 as specified in the SRD. Read the SRD to understand the full specification."
      - id: R2
        text: "Implement srd002-sys requirement R3.1 as specified in the SRD. Read the SRD to understand the full specification."
      - id: R3
        text: "Implement srd002-sys requirement R3.2 as specified in the SRD. Read the SRD to understand the full specification."
      - id: R4
        text: "Implement srd002-sys requirement R3.3 as specified in the SRD. Read the SRD to understand the full specification."

    design_decisions:
      - id: D1
        text: "Use golang.org/x/sys/unix for Darwin syscall access where Go stdlib is insufficient"
      - id: D2
        text: "Maintain existing file organization in pkg/sys/ -- modify files in place, do not reorganize or rename existing code"
      - id: D3
        text: "Must not import any cmd/ package or any other pkg/ package"

    acceptance_criteria:
      - id: AC1
        text: All four SRD requirements (R2.6, R3.1, R3.2, R3.3) are implemented per their acceptance criteria in the SRD
      - id: AC2
        text: go build ./pkg/sys/... compiles without errors
      - id: AC3
        text: go vet ./pkg/sys/... reports no issues
      - id: AC4
        text: Existing functionality from previously implemented requirements is preserved -- no regressions

