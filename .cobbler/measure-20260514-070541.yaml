- index: 0
  title: "[stitch] cmd/dirname: core path extraction and setup (srd016-dirname R1.1-R1.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd016-dirname.yaml (full SRD -- focus on requirements R1.1 through R1.3)
      - docs/specs/test-suites/test-rel-02.0.yaml (test cases for dirname)
      - docs/specs/use-cases/rel02.0-uc005-dirname.yaml (use case for dirname)
      - pkg/sys/ (InstallSIGPIPEHandler pattern)
      - pkg/testutils/ (DiffTest, RunDiffTests, BuildBinary)

    files:
      - path: cmd/dirname/main.go
        action: create
        note: dirname utility -- main function, flag parsing skeleton, core path extraction
      - path: cmd/dirname/dirname_test.go
        action: create
        note: differential tests against gdirname reference binary

    requirements:
      - id: R1
        text: "Implement srd016-dirname R1.1 -- core dirname behavior that extracts the directory component from a pathname"
      - id: R2
        text: "Implement srd016-dirname R1.2 -- handle trailing slash stripping before directory extraction"
      - id: R3
        text: "Implement srd016-dirname R1.3 -- when path contains no slash, return dot (.)"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project SIGPIPE protocol"
      - id: D2
        text: "Use differential testing pattern -- BuildBinary(t, \".\"), exec.LookPath(\"gdirname\"), RunDiffTests"
      - id: D3
        text: "Skip tests if gdirname is not in PATH using t.Skip"
      - id: D4
        text: "Set LC_ALL=C in test environment per project convention"

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/dirname/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/dirname/ reports no issues"
      - id: AC3
        text: "go test ./cmd/dirname/ -count=1 passes (skips if gdirname not found)"
      - id: AC4
        text: "dirname /usr/bin outputs /usr"
      - id: AC5
        text: "dirname with a path containing no slash outputs dot"

- index: 1
  title: "[stitch] cmd/dirname: operand handling and flags (srd016-dirname R1.4-R1.5, R2.1-R2.2)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd016-dirname.yaml (requirements R1.4, R1.5, R2.1, R2.2)
      - cmd/dirname/main.go (existing implementation from prior task)
      - cmd/dirname/dirname_test.go (existing differential tests from prior task)

    files:
      - path: cmd/dirname/main.go
        action: modify
        note: add root path handling, multi-argument support, --zero flag, end-of-options
      - path: cmd/dirname/dirname_test.go
        action: modify
        note: add differential test cases for R1.4, R1.5, R2.1, R2.2

    requirements:
      - id: R1
        text: "Implement srd016-dirname R1.4 -- dirname of root path (/) returns /"
      - id: R2
        text: "Implement srd016-dirname R1.5 -- support multiple pathname operands, one output per line"
      - id: R3
        text: "Implement srd016-dirname R2.1 -- --zero / -z flag for NUL-terminated output instead of newline"
      - id: R4
        text: "Implement srd016-dirname R2.2 -- end-of-options marker (--) stops flag parsing"

    design_decisions:
      - id: D1
        text: "Process each operand independently, printing one dirname result per line (or NUL-terminated with -z)"
      - id: D2
        text: "After --, treat all subsequent arguments as operands even if they start with a dash"

    acceptance_criteria:
      - id: AC1
        text: "dirname / outputs /"
      - id: AC2
        text: "dirname with multiple arguments outputs one result per line"
      - id: AC3
        text: "dirname -z outputs NUL-terminated results instead of newline-terminated"
      - id: AC4
        text: "dirname -- --help treats --help as a pathname operand"
      - id: AC5
        text: "go test ./cmd/dirname/ -count=1 passes with new test cases"

