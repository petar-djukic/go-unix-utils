- index: 2
  title: "[stitch] cmd/numfmt: srd071 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd071-numfmt.yaml (requirements R1.1, R1.2, R1.3, R1.4 -- read the full SRD for context on the numfmt utility)
      - docs/ARCHITECTURE.yaml (shared protocols section -- differential testing pattern and SIGPIPE handling)
      - pkg/testutils/ (differential testing framework -- understand DiffTest, RunDiffTests, BuildBinary)
      - pkg/sys/ (for InstallSIGPIPEHandler)

    files:
      - path: cmd/numfmt/main.go
        action: create
        note: numfmt implementation covering srd071 R1.1-R1.4
      - path: cmd/numfmt/numfmt_test.go
        action: create
        note: Differential tests for numfmt comparing against gnumfmt

    requirements:
      - id: R1
        text: Implement srd071 requirement R1.1 in cmd/numfmt per the SRD specification
      - id: R2
        text: Implement srd071 requirement R1.2 in cmd/numfmt per the SRD specification
      - id: R3
        text: Implement srd071 requirement R1.3 in cmd/numfmt per the SRD specification
      - id: R4
        text: Implement srd071 requirement R1.4 in cmd/numfmt per the SRD specification

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior."
      - id: D2
        text: "Use the differential testing pattern: testutils.BuildBinary(t, \".\") for the Go binary, exec.LookPath(\"gnumfmt\") for the reference binary, t.Skip if reference not found."
      - id: D3
        text: All differential test cases set LC_ALL=C in the Env field.
      - id: D4
        text: "Package is cmd/numfmt with package main. Implementation in main.go, tests in numfmt_test.go."

    acceptance_criteria:
      - id: AC1
        text: srd071 R1.1 is implemented and has at least one differential test case exercising it
      - id: AC2
        text: srd071 R1.2 is implemented and has at least one differential test case exercising it
      - id: AC3
        text: srd071 R1.3 is implemented and has at least one differential test case exercising it
      - id: AC4
        text: srd071 R1.4 is implemented and has at least one differential test case exercising it
      - id: AC5
        text: go build ./cmd/numfmt/ succeeds with no errors
      - id: AC6
        text: go vet ./cmd/numfmt/ reports no issues
      - id: AC7
        text: go test ./cmd/numfmt/... -count=1 passes (or skips gracefully if gnumfmt reference binary is not installed)
      - id: AC8
        text: main() calls sys.InstallSIGPIPEHandler() before any stdout writes

