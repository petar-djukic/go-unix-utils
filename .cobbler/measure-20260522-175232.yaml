- index: 0
  title: "[stitch] cmd/fmt: srd070 R10.1, R11.1, R12.1"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd070-fmt.yaml (requirements R10.1, R11.1, R12.1 -- read the full SRD for context)
      - cmd/fmt/main.go (existing implementation to extend)
      - cmd/fmt/fmt_test.go (existing differential tests to extend)
      - pkg/testutils/ (differential testing framework -- understand DiffTest and RunDiffTests)

    files:
      - path: cmd/fmt/main.go
        action: modify
        note: Add functionality for srd070 requirements R10.1, R11.1, R12.1
      - path: cmd/fmt/fmt_test.go
        action: modify
        note: Add differential test cases covering R10.1, R11.1, R12.1

    requirements:
      - id: R1
        text: Implement srd070 requirement R10.1 in cmd/fmt per the SRD specification
      - id: R2
        text: Implement srd070 requirement R11.1 in cmd/fmt per the SRD specification
      - id: R3
        text: Implement srd070 requirement R12.1 in cmd/fmt per the SRD specification

    design_decisions:
      - id: D1
        text: Extend the existing cmd/fmt implementation -- do not rewrite or restructure existing code. Add only the logic needed for R10.1, R11.1, R12.1.
      - id: D2
        text: Use the differential testing pattern with pkg/testutils.RunDiffTests comparing against the gfmt reference binary. All test cases set LC_ALL=C.
      - id: D3
        text: Skip differential tests if the reference binary gfmt is not found via exec.LookPath (t.Skip pattern).

    acceptance_criteria:
      - id: AC1
        text: srd070 R10.1 is implemented and has at least one differential test case exercising it
      - id: AC2
        text: srd070 R11.1 is implemented and has at least one differential test case exercising it
      - id: AC3
        text: srd070 R12.1 is implemented and has at least one differential test case exercising it
      - id: AC4
        text: go build ./cmd/fmt/ succeeds with no errors
      - id: AC5
        text: go vet ./cmd/fmt/ reports no issues
      - id: AC6
        text: go test ./cmd/fmt/... -count=1 passes (or skips gracefully if gfmt reference binary is not installed)

