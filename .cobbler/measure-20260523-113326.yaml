- index: 0
  title: "[stitch] Implement cmd/truncate core file size operations (srd083 R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd083-truncate.yaml (SRD for truncate -- read requirements R1.1 through R1.4)
      - pkg/sizeparse/ (size string parsing with unit suffixes -- truncate uses SIZE with K/M/G suffixes)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern -- all cmd/ utilities must call InstallSIGPIPEHandler)
      - cmd/stat/main.go (reference implementation of a similar file-metadata utility in this project)

    files:
      - path: cmd/truncate/main.go
        action: create
        note: truncate command implementation -- core file truncation with --size flag and argument parsing

    requirements:
      - id: R1
        text: Implement srd083 R1.1 -- parse command-line flags and positional arguments per the SRD
      - id: R2
        text: Implement srd083 R1.2 -- set file size to the exact value specified by --size
      - id: R3
        text: Implement srd083 R1.3 -- create files that do not exist when specified as arguments
      - id: R4
        text: Implement srd083 R1.4 -- support --no-create (-c) to suppress file creation for nonexistent files

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main per project convention
      - id: D2
        text: Use pkg/sizeparse.Parse or ParseWithOptions for --size argument parsing with unit suffixes
      - id: D3
        text: Use os.Truncate for setting file size after creating/opening the file
      - id: D4
        text: Exit codes and error messages must match GNU truncate behavior per the SRD

    acceptance_criteria:
      - id: AC1
        text: cmd/truncate/main.go compiles with "go build ./cmd/truncate/"
      - id: AC2
        text: "go vet ./cmd/truncate/" passes with no warnings
      - id: AC3
        text: Running the binary with --size=100 on a new file creates a 100-byte file
      - id: AC4
        text: Running the binary with --no-create on a nonexistent file does not create it
      - id: AC5
        text: All four SRD requirements (R1.1 through R1.4) are implemented

- index: 1
  title: "[stitch] Implement cmd/truncate relative operations and reference (srd083 R2.1, R2.2, R3.1, R3.2)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd083-truncate.yaml (SRD for truncate -- read requirements R2.1, R2.2, R3.1, R3.2)
      - cmd/truncate/main.go (existing core implementation from prior task)
      - pkg/sizeparse/ (size string parsing with unit suffixes)

    files:
      - path: cmd/truncate/main.go
        action: modify
        note: Add relative size operations (+/- prefixes), --reference flag, and error handling

    requirements:
      - id: R1
        text: Implement srd083 R2.1 -- support relative size operations with +/- prefixes that grow or shrink the file relative to its current size
      - id: R2
        text: Implement srd083 R2.2 -- support --reference (-r) to use another file's size as the base for size operations
      - id: R3
        text: Implement srd083 R3.1 -- report errors for invalid size specifications and unreadable reference files with GNU-compatible messages
      - id: R4
        text: Implement srd083 R3.2 -- process multiple file arguments, continuing on error per GNU behavior, with exit code reflecting whether any error occurred

    design_decisions:
      - id: D1
        text: Relative sizes (+/-) are parsed from the --size value prefix before delegating unit parsing to sizeparse
      - id: D2
        text: When --reference is combined with --size, the size is relative to the reference file's size
      - id: D3
        text: Errors on individual files do not stop processing of remaining files -- exit code is nonzero if any file failed

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/truncate/" compiles with no errors
      - id: AC2
        text: "go vet ./cmd/truncate/" passes with no warnings
      - id: AC3
        text: Running with --size=+100 on a 50-byte file produces a 150-byte file
      - id: AC4
        text: Running with --reference=ref --size=+0 sets target to the reference file's size
      - id: AC5
        text: Running with an invalid --size value prints an error to stderr and exits nonzero
      - id: AC6
        text: Running with multiple files where one is invalid processes the valid files and exits nonzero

