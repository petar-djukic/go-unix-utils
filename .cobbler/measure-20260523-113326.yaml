- index: 3
  title: "[stitch] Implement cmd/truncate differential tests (srd083 R1.1, R1.2, R1.3, R1.4, R2.1, R2.2, R3.1, R3.2, R3.3)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd083-truncate.yaml (full SRD -- all requirements must have test coverage)
      - cmd/truncate/main.go (implementation under test)
      - pkg/testutils/ (differential testing harness -- DiffTest struct and RunDiffTests function)
      - cmd/stat/stat_test.go (reference test file for a similar file-metadata utility)

    files:
      - path: cmd/truncate/truncate_test.go
        action: create
        note: Differential tests comparing Go truncate against gtruncate from Homebrew GNU coreutils

    requirements:
      - id: R1
        text: Create TestDiff using testutils.BuildBinary(t, ".") and exec.LookPath("gtruncate") with t.Skip if reference binary not found
      - id: R2
        text: Write DiffTest cases covering all srd083 requirements R1.1 through R3.3 -- exact size, relative size (+/-), --reference, --no-create, multiple files, and error conditions
      - id: R3
        text: Verify exit code, stdout, and stderr match between Go and GNU binaries for each test case
      - id: R4
        text: Test edge cases including zero-byte truncation, nonexistent files with and without --no-create, and invalid --size values

    design_decisions:
      - id: D1
        text: Use testutils.RunDiffTests for all differential test cases per project convention
      - id: D2
        text: Reference binary is gtruncate (Homebrew GNU coreutils with g-prefix)
      - id: D3
        text: Set LC_ALL=C in test environment per project convention
      - id: D4
        text: Create temp files and directories in t.TempDir() for test fixtures -- do not leave test artifacts

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/truncate/ -count=1" passes (or skips gracefully if gtruncate not found)
      - id: AC2
        text: Tests cover exact size, relative size (+/-), --reference, --no-create, multi-file processing, and error scenarios
      - id: AC3
        text: All test cases use the DiffTest/RunDiffTests pattern from pkg/testutils
      - id: AC4
        text: "go vet ./cmd/truncate/" passes with no warnings