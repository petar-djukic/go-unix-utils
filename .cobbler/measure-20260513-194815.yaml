        action: create
        note: cat command implementation -- basic file concatenation and stdin handling

    requirements:
      - id: R1
        text: Implement srd006-cat R1.1 -- read named file(s) and write contents to stdout
      - id: R2
        text: Implement srd006-cat R1.2 -- read from stdin when no files given or when filename is "-"
      - id: R3
        text: Implement srd006-cat R1.3 -- concatenate multiple files in argument order
      - id: R4
        text: Implement srd006-cat R1.4 -- exit status on success

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at start of main per project SIGPIPE protocol
      - id: D2
        text: Build with go build -o bin/cat ./cmd/cat/ per CLAUDE.md convention

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/cat ./cmd/cat/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/cat/ passes with no warnings
      - id: AC3
        text: bin/cat reads named files and writes their contents to stdout in argument order
      - id: AC4
        text: bin/cat reads from stdin when invoked with no arguments or with "-" as filename

- index: 2
  title: "[stitch] cmd/cat error handling and line numbering (srd006-cat R1.5, R2.1, R2.2, R2.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd006-cat.yaml (cat command requirements, focus on R1.5, R2.1-R2.3)
      - cmd/cat/main.go (existing basic concatenation implementation)

    files:
      - path: cmd/cat/main.go
        action: modify
        note: Add error handling, -n, -b, and -s flags

    requirements:
      - id: R1
        text: Implement srd006-cat R1.5 -- error handling with stderr messages and non-zero exit on failure
      - id: R2
        text: Implement srd006-cat R2.1 -- -n flag to number all output lines
      - id: R3
        text: Implement srd006-cat R2.2 -- -b flag to number non-blank output lines
      - id: R4
        text: Implement srd006-cat R2.3 -- -s flag to squeeze consecutive blank lines

    design_decisions:
      - id: D1
        text: Error messages go to stderr per srd006-cat requirements
      - id: D2
        text: Follow exact line numbering format specified in srd006-cat R2.1 and R2.2

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/cat ./cmd/cat/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/cat/ passes with no warnings
      - id: AC3
        text: bin/cat -n numbers all output lines sequentially starting from 1
      - id: AC4
        text: bin/cat prints error to stderr and returns non-zero exit when a named file does not exist

