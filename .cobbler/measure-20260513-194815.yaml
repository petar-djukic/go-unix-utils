- index: 0
  title: "[stitch] cmd/version core implementation (srd059-version R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd059-version.yaml (version command requirements)
      - pkg/sys/sigpipe.go (SIGPIPE handler pattern used by all cmd/ utilities)

    files:
      - path: cmd/version/main.go
        action: create
        note: Version command binary implementation

    requirements:
      - id: R1
        text: Implement srd059-version R1.1 -- version string output to stdout
      - id: R2
        text: Implement srd059-version R1.2 -- exit code behavior
      - id: R3
        text: Implement srd059-version R1.3 -- flag parsing and handling
      - id: R4
        text: Implement srd059-version R1.4 -- output format

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at start of main per project SIGPIPE protocol
      - id: D2
        text: Build with go build -o bin/version ./cmd/version/ per CLAUDE.md convention

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/version ./cmd/version/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/version/ passes with no warnings
      - id: AC3
        text: Binary outputs version information to stdout and exits 0
      - id: AC4
        text: All behavior matches srd059-version R1.1 through R1.4

- index: 1
