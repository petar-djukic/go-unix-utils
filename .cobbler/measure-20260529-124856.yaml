- index: 0
  title: "[stitch] cmd/pr implementation (srd110-pr R2.1, R2.2, R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd110-pr.yaml (requirements R2.1, R2.2, R2.3)
      - cmd/pr/main.go (existing implementation to extend)
      - cmd/pr/pr_test.go (existing differential tests to extend)
      - pkg/testutils/ (RunDiffTests differential testing framework)

    files:
      - path: cmd/pr/main.go
        action: modify
        note: Implement srd110-pr R2.1, R2.2, R2.3
      - path: cmd/pr/pr_test.go
        action: modify
        note: Add differential test cases for R2.1, R2.2, R2.3

    requirements:
      - id: R1
        text: "Implement srd110-pr requirement R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd110-pr requirement R2.2 as specified in the SRD"
      - id: R3
        text: "Implement srd110-pr requirement R2.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Follow existing patterns in cmd/pr/main.go for new functionality"
      - id: D2
        text: "Use pkg/testutils.RunDiffTests for all differential test cases"
      - id: D3
        text: "Set LC_ALL=C in test environments per project convention"

    acceptance_criteria:
      - id: AC1
        text: "Requirements R2.1, R2.2, R2.3 implemented per SRD acceptance criteria"
      - id: AC2
        text: "go build ./cmd/pr/ succeeds with no errors"
      - id: AC3
        text: "go test ./cmd/pr/... -count=1 passes (or skips gracefully if reference binary not found)"
      - id: AC4
        text: "go vet ./cmd/pr/ reports no issues"

