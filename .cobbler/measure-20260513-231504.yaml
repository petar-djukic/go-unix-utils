- index: 0
  title: "[stitch] cmd/sponge: remaining requirements (srd007-sponge R6.1-R6.2)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd007-sponge.yaml (R6.1, R6.2 -- the requirements to implement)
      - cmd/sponge/main.go (existing sponge implementation to extend)
      - cmd/sponge/sponge_test.go (existing sponge differential tests to extend)

    files:
      - path: cmd/sponge/main.go
        action: modify
        note: Implement R6.1 and R6.2 behavior
      - path: cmd/sponge/sponge_test.go
        action: modify
        note: Add differential test cases for R6.1 and R6.2

    requirements:
      - id: R1
        text: "Implement srd007-sponge R6.1 per the SRD specification"
      - id: R2
        text: "Implement srd007-sponge R6.2 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Follow the existing implementation patterns in cmd/sponge/main.go"
      - id: D2
        text: "Use the same reference binary and differential test pattern as existing cmd/sponge/sponge_test.go"
      - id: D3
        text: "Ensure sys.InstallSIGPIPEHandler() is called at the start of main"

    acceptance_criteria:
      - id: AC1
        text: "srd007-sponge R6.1 behavior implemented and verified by differential test"
      - id: AC2
        text: "srd007-sponge R6.2 behavior implemented and verified by differential test"
      - id: AC3
        text: "go test ./cmd/sponge/... -count=1 passes"
      - id: AC4
        text: "go vet ./cmd/sponge/... reports no issues"

- index: 1
  title: "[stitch] cmd/basename: core path stripping (srd015-basename R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd015-basename.yaml (full SRD; implement R1.1-R1.4)
      - CLAUDE.md (project conventions for SIGPIPE handling, build instructions)
      - pkg/sys/ (InstallSIGPIPEHandler for SIGPIPE handling)

    files:
      - path: cmd/basename/main.go
        action: create
        note: "basename utility: strips directory and optional suffix from file paths"

    requirements:
      - id: R1
        text: "Implement srd015-basename R1.1 per the SRD specification"
      - id: R2
        text: "Implement srd015-basename R1.2 per the SRD specification"
      - id: R3
        text: "Implement srd015-basename R1.3 per the SRD specification"
      - id: R4
        text: "Implement srd015-basename R1.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior"
      - id: D2
        text: "Package is package main in cmd/basename/, binary output to bin/basename"

    acceptance_criteria:
      - id: AC1
        text: "cmd/basename/main.go compiles: go build -o bin/basename ./cmd/basename/"
      - id: AC2
        text: "go vet ./cmd/basename/... reports no issues"
      - id: AC3
        text: "R1.1-R1.4 behaviors implemented per the SRD"

