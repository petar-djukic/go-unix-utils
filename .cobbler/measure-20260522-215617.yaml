    required_reading:
      - docs/specs/software-requirements/srd077-cksum.yaml (R2.1, R2.2, R2.3, R3.1 specifications)
      - cmd/cksum/main.go (existing implementation covering R1.1-R1.4)
      - cmd/cksum/cksum_test.go (existing differential tests)
      - pkg/hashutil/ (shared hash utility library for algorithm support)
      - docs/ARCHITECTURE.yaml (shared_protocols section for differential testing pattern)

    files:
      - path: cmd/cksum/main.go
        action: modify
        note: Add functionality for srd077 R2.1, R2.2, R2.3, R3.1
      - path: cmd/cksum/cksum_test.go
        action: modify
        note: Add differential test cases for R2.1, R2.2, R2.3, R3.1

    requirements:
      - id: R1
        text: Implement srd077-cksum requirement R2.1 per the specification
      - id: R2
        text: Implement srd077-cksum requirement R2.2 per the specification
      - id: R3
        text: Implement srd077-cksum requirement R2.3 per the specification
      - id: R4
        text: Implement srd077-cksum requirement R3.1 per the specification

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main per project convention
      - id: D2
        text: Follow the differential testing pattern from ARCHITECTURE.yaml shared_protocols -- use testutils.BuildBinary, exec.LookPath for gcksum, t.Skip if reference binary not found
      - id: D3
