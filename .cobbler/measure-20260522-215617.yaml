        text: go build ./cmd/cksum/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/cksum/ reports no issues
      - id: AC3
        text: go test ./cmd/cksum/ -count=1 passes (both existing and new test cases)
      - id: AC4
        text: New differential test cases cover the functionality specified by R2.1, R2.2, R2.3, R3.1

