- index: 0
  title: "[stitch] cmd/df: implement srd106 R1.1, R1.2, R1.3, R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd106-df.yaml (SRD for df -- read requirements R1.1, R1.2, R1.3, R1.4)
      - pkg/testutils/ (DiffTest, RunDiffTests, BuildBinary -- differential testing framework)
      - pkg/sys/ (InstallSIGPIPEHandler -- SIGPIPE handling for stdout writers)
      - pkg/format/ (HumanSize, HumanSizeOpts -- human-readable size formatting if needed by R1.x)
      - cmd/du/main.go (reference: filesystem utility pattern using sys and format packages)
      - cmd/du/du_test.go (reference: differential testing pattern for a filesystem utility)

    files:
      - path: cmd/df/main.go
        action: create
        note: "df implementation -- filesystem disk space usage reporting"
      - path: cmd/df/df_test.go
        action: create
        note: "Differential tests against gdf reference binary"

    requirements:
      - id: R1
        text: "Implement srd106 requirement R1.1 per the SRD"
      - id: R2
        text: "Implement srd106 requirement R1.2 per the SRD"
      - id: R3
        text: "Implement srd106 requirement R1.3 per the SRD"
      - id: R4
        text: "Implement srd106 requirement R1.4 per the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() per shared protocol"
      - id: D2
        text: "Use testutils.BuildBinary(t, \".\") and testutils.RunDiffTests for differential testing against gdf"
      - id: D3
        text: "Set LC_ALL=C in all test DiffTest.Env entries per project protocol"
      - id: D4
        text: "Call exec.LookPath(\"gdf\") and t.Skip if gdf is not found per graceful-skip protocol"

    acceptance_criteria:
      - id: AC1
        text: "cmd/df/main.go compiles: go build ./cmd/df/"
      - id: AC2
        text: "Differential tests pass: go test ./cmd/df/ -count=1"
      - id: AC3
        text: "SRD requirements R1.1, R1.2, R1.3, R1.4 each have at least one differential test case"
      - id: AC4
        text: "go vet ./cmd/df/ reports no issues"

