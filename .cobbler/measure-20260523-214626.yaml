- index: 0
  title: "[stitch] Implement cmd/chown recursive traversal and symlink handling (srd091 R2.1, R2.2, R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd091-chown.yaml (full SRD -- focus on requirements R2.1, R2.2, R2.3)
      - cmd/chown/main.go (existing implementation covering R1.1 through R1.4)
      - cmd/chgrp/main.go (sibling utility with recursive traversal and symlink handling for reference)

    files:
      - path: cmd/chown/main.go
        action: modify
        note: Add recursive ownership change (-R) with symlink traversal options (-H, -L, -P)
      - path: cmd/chown/chown_test.go
        action: modify
        note: Add differential test cases for recursive and symlink behavior

    requirements:
      - id: R1
        text: "Implement srd091 R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd091 R2.2 as specified in the SRD"
      - id: R3
        text: "Implement srd091 R2.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "All cmd/ utilities call sys.InstallSIGPIPEHandler() at the start of main per shared protocol"
      - id: D2
        text: "Reference binary for differential testing is gchown (Homebrew coreutils g-prefix convention)"
      - id: D3
        text: "Differential tests use pkg/testutils.RunDiffTests to compare against gchown with LC_ALL=C"

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/chown/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/chown/ passes with no warnings"
      - id: AC3
        text: "go test ./cmd/chown/ -count=1 passes -- differential tests for R2.1, R2.2, R2.3 match gchown output"

