- index: 1
  title: "cmd/pathchk: differential tests for srd103 R2.1, R2.2, R2.3"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd103-pathchk.yaml (full SRD -- test requirements R2.1, R2.2, R2.3)
      - cmd/pathchk/main.go (implementation to test -- created in prior task)
      - CLAUDE.md (differential testing pattern, BuildBinary usage, LookPath skip convention)
      - pkg/testutils/difftest.go (DiffTest struct, RunDiffTests function)

    files:
      - path: cmd/pathchk/pathchk_test.go
        action: create
        note: differential tests comparing Go pathchk against gpathchk reference binary

    requirements:
      - id: R1
        text: "Write differential tests covering srd103-pathchk R2.1 -- test cases exercise the behavior specified in that requirement"
      - id: R2
        text: "Write differential tests covering srd103-pathchk R2.2 -- test cases exercise the behavior specified in that requirement"
      - id: R3
        text: "Write differential tests covering srd103-pathchk R2.3 -- test cases exercise the behavior specified in that requirement"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary and exec.LookPath(\"gpathchk\") for the reference binary"
      - id: D2
        text: "Call t.Skip if gpathchk is not found in PATH -- tests must pass on machines without Homebrew GNU binaries"
      - id: D3
        text: "Define tests as []testutils.DiffTest and run via testutils.RunDiffTests(t, goBin, refBin, tests)"
      - id: D4
        text: "Set LC_ALL=C in test environment to ensure consistent behavior between Go and GNU binaries"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/pathchk/... -count=1 passes (or skips gracefully if gpathchk not found)"
      - id: AC2
        text: "Tests cover all behavior specified in srd103-pathchk R2.1, R2.2, R2.3 with concrete inputs and expected outcomes"
      - id: AC3
        text: "TestDiff function follows the differential testing pattern from CLAUDE.md"

