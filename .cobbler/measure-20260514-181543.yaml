- index: 0
  title: "[stitch] cmd/ls: features implementation (srd008-ls R3.4-R3.7)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd008-ls.yaml (requirements R3.4, R3.5, R3.6, R3.7)
      - cmd/ls/main.go (existing ls implementation -- extend, do not rewrite)
      - cmd/ls/ls_test.go (existing differential tests -- add new test cases)
      - pkg/sys/fileinfo.go (FileInfo struct used for file metadata)
      - pkg/format/humansize.go (HumanSize formatting used by ls)
      - pkg/format/color.go (color output support)

    files:
      - path: cmd/ls/main.go
        action: modify
        note: Add functionality for srd008-ls R3.4-R3.7
      - path: cmd/ls/ls_test.go
        action: modify
        note: Add differential test cases exercising R3.4-R3.7

    requirements:
      - id: R1
        text: "Implement srd008-ls requirement R3.4 -- read the SRD for the full specification of this requirement and implement all acceptance criteria"
      - id: R2
        text: "Implement srd008-ls requirement R3.5 -- read the SRD for the full specification of this requirement and implement all acceptance criteria"
      - id: R3
        text: "Implement srd008-ls requirement R3.6 -- read the SRD for the full specification of this requirement and implement all acceptance criteria"
      - id: R4
        text: "Implement srd008-ls requirement R3.7 -- read the SRD for the full specification of this requirement and implement all acceptance criteria"

    design_decisions:
      - id: D1
        text: "Extend the existing cmd/ls/main.go implementation. Do not restructure or rewrite existing code -- add the new features incrementally on top of what is already there."
      - id: D2
        text: "Use pkg/sys.Stat and pkg/sys.Lstat for file metadata. Use pkg/format for output formatting, color, and column alignment. Do not duplicate syscall or formatting logic in cmd/ls/."
      - id: D3
        text: "Add differential test cases using the existing testutils.RunDiffTests pattern. The reference binary is gls (exec.LookPath). Skip if reference binary is not found. Set LC_ALL=C in test environment."
      - id: D4
        text: "Call sys.InstallSIGPIPEHandler() at the start of main if not already present."

    acceptance_criteria:
      - id: AC1
        text: "srd008-ls requirements R3.4, R3.5, R3.6, and R3.7 are fully implemented per their SRD acceptance criteria"
      - id: AC2
        text: "Differential test cases added for each new feature, covering the flag/behavior specified in each requirement"
      - id: AC3
        text: "go build ./cmd/ls/ succeeds with no errors"
      - id: AC4
        text: "go test ./cmd/ls/... -count=1 passes (tests skip gracefully if gls reference binary is not in PATH)"
      - id: AC5
        text: "go vet ./cmd/ls/ reports no issues"

