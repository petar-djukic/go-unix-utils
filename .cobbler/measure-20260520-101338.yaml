- index: 0
  title: "[stitch] srd040-printenv R1.1, R1.2, R1.3, R2.1"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd040-printenv.yaml (full SRD -- implement only R1.1, R1.2, R1.3, R2.1)
      - docs/ARCHITECTURE.yaml (shared_protocols section for differential testing and SIGPIPE patterns)
      - pkg/sys/ (InstallSIGPIPEHandler usage)
      - pkg/testutils/ (BuildBinary and RunDiffTests API for differential tests)

    files:
      - path: cmd/printenv/main.go
        action: create
        note: printenv utility -- core variable printing and initial flag parsing
      - path: cmd/printenv/printenv_test.go
        action: create
        note: differential tests against gprintenv for R1.1, R1.2, R1.3, R2.1

    requirements:
      - id: R1
        text: "Implement srd040-printenv R1.1 per the SRD"
      - id: R2
        text: "Implement srd040-printenv R1.2 per the SRD"
      - id: R3
        text: "Implement srd040-printenv R1.3 per the SRD"
      - id: R4
        text: "Implement srd040-printenv R2.1 per the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the SIGPIPE shared protocol in ARCHITECTURE.yaml"
      - id: D2
        text: "Use gprintenv as the reference binary name in differential tests (Homebrew g-prefix convention)"
      - id: D3
        text: "Use exec.LookPath for gprintenv and t.Skip if not found, per the graceful-skip shared protocol"

    acceptance_criteria:
      - id: AC1
        text: "cmd/printenv/main.go compiles with go build -o bin/printenv ./cmd/printenv/"
      - id: AC2
        text: "go vet ./cmd/printenv/... passes with no warnings"
      - id: AC3
        text: "Differential tests for R1.1, R1.2, R1.3, R2.1 pass against gprintenv when the reference binary is available"
      - id: AC4
        text: "Tests skip gracefully when gprintenv is not in PATH"

