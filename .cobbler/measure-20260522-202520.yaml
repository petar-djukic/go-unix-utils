- index: 0
  title: "cmd/sha224sum: implement srd074 R3.1, R3.2, R4.1, R4.2"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd074-sha224sum.yaml (requirements R3.1, R3.2, R4.1, R4.2)
      - pkg/hashutil/ (shared checksum library -- HashConfig, DigestFiles, VerifyChecksums, FormatGNU, FormatBSDTag, ParseChecksumLine)
      - cmd/sha224sum/main.go (existing implementation from earlier tasks covering R1/R2 -- extend this file)
      - cmd/md5sum/main.go (reference implementation of a checksum utility using pkg/hashutil, if it exists)
      - cmd/sha256sum/main.go (reference implementation of a checksum utility using pkg/hashutil, if it exists)

    files:
      - path: cmd/sha224sum/main.go
        action: modify
        note: Add functionality for srd074 R3.1, R3.2, R4.1, R4.2 to existing sha224sum implementation

    requirements:
      - id: R1
        text: "Implement srd074 R3.1 -- read the SRD for the exact requirement text and implement it in cmd/sha224sum/main.go"
      - id: R2
        text: "Implement srd074 R3.2 -- read the SRD for the exact requirement text and implement it in cmd/sha224sum/main.go"
      - id: R3
        text: "Implement srd074 R4.1 -- read the SRD for the exact requirement text and implement it in cmd/sha224sum/main.go"
      - id: R4
        text: "Implement srd074 R4.2 -- read the SRD for the exact requirement text and implement it in cmd/sha224sum/main.go"

    design_decisions:
      - id: D1
        text: "Use pkg/hashutil.HashConfig with crypto/sha256.New224 as the hash constructor and DigestLen 28 (224 bits / 8)"
      - id: D2
        text: "Delegate file hashing to pkg/hashutil.DigestFiles and checksum verification to pkg/hashutil.VerifyChecksums -- do not reimplement checksum logic in cmd/"
      - id: D3
        text: "Follow the same structure as cmd/md5sum or cmd/sha256sum if they exist -- sha224sum is a thin wrapper around pkg/hashutil with SHA-224 configuration"
      - id: D4
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() per project SIGPIPE protocol"

    acceptance_criteria:
      - id: AC1
        text: "cmd/sha224sum/main.go compiles: go build -o bin/sha224sum ./cmd/sha224sum/"
      - id: AC2
        text: "go vet ./cmd/sha224sum/ passes with no warnings"
      - id: AC3
        text: "All functionality specified in srd074 R3.1, R3.2, R4.1, R4.2 is implemented"
      - id: AC4
        text: "No checksum computation logic is duplicated from pkg/hashutil -- all hashing uses hashutil.ComputeDigest or hashutil.DigestFiles"

- index: 1
  title: "cmd/sha224sum: differential tests srd074 R4.3"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd074-sha224sum.yaml (requirement R4.3 and acceptance criteria)
      - cmd/sha224sum/main.go (implementation to test)
      - pkg/testutils/ (DiffTest struct, RunDiffTests, BuildBinary functions)
      - cmd/md5sum/md5sum_test.go (reference test file for a checksum utility, if it exists)
      - cmd/sha256sum/sha256sum_test.go (reference test file for a checksum utility, if it exists)

    files:
      - path: cmd/sha224sum/sha224sum_test.go
        action: create
        note: Differential tests comparing Go sha224sum against gsha224sum reference binary

    requirements:
      - id: R1
        text: "Implement srd074 R4.3 -- read the SRD for the exact requirement text and implement differential tests in cmd/sha224sum/sha224sum_test.go"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary and exec.LookPath(\"gsha224sum\") for the reference binary"
      - id: D2
        text: "Call t.Skip if gsha224sum is not found in PATH -- tests must pass on machines without Homebrew GNU binaries"
      - id: D3
        text: "Define tests as []testutils.DiffTest and pass to testutils.RunDiffTests per the project differential testing protocol"
      - id: D4
        text: "Cover all flag combinations and modes implemented in main.go -- hash mode, check mode, binary/text mode, BSD tag format, error cases"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/sha224sum/ -count=1 compiles and runs (skipping if gsha224sum not in PATH)"
      - id: AC2
        text: "Tests cover the functionality from srd074 R4.3"
      - id: AC3
        text: "Tests use testutils.RunDiffTests, not manual output comparison"
      - id: AC4
        text: "Tests skip gracefully when reference binary gsha224sum is not installed"

