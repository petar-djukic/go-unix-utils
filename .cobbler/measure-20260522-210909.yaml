- index: 0
  title: "cmd/b2sum implementation -- srd076 R1.1, R1.2, R1.3, R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd076-b2sum.yaml (R1.1, R1.2, R1.3, R1.4 -- core BLAKE2b hashing requirements)
      - pkg/hashutil/ (shared hash infrastructure -- HashConfig, DigestFiles, FormatGNU, ComputeDigest)
      - cmd/md5sum/main.go (reference pattern for hashutil-based checksum utility)
      - cmd/sha256sum/main.go (second reference for checksum utility structure)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler)
      - CLAUDE.md (project conventions and build instructions)

    files:
      - path: cmd/b2sum/main.go
        action: create
        note: BLAKE2b checksum utility using pkg/hashutil

    requirements:
      - id: R1
        text: "Implement srd076 R1.1 as specified in the SRD -- core BLAKE2b digest computation for file arguments using pkg/hashutil.DigestFiles with a HashConfig wrapping the BLAKE2b hash constructor"
      - id: R2
        text: "Implement srd076 R1.2 as specified in the SRD -- read from stdin when no file arguments are provided, using the '-' filename convention consistent with other checksum utilities"
      - id: R3
        text: "Implement srd076 R1.3 as specified in the SRD -- output digest in the correct default format via pkg/hashutil formatting functions"
      - id: R4
        text: "Implement srd076 R1.4 as specified in the SRD -- support binary and text mode flags for input mode selection"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D2
        text: "Use pkg/hashutil.HashConfig with NewHash set to the BLAKE2b constructor and DigestLen set per the SRD default digest length -- delegate all digest computation to pkg/hashutil"
      - id: D3
        text: "Delegate file iteration and output formatting to pkg/hashutil.DigestFiles -- do not reimplement digest computation or output formatting in cmd/b2sum"
      - id: D4
        text: "Follow the same flag parsing and main() structure as cmd/md5sum/main.go and cmd/sha256sum/main.go"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/b2sum ./cmd/b2sum/ succeeds with no errors"
      - id: AC2
        text: "go vet ./cmd/b2sum/ passes with no warnings"
      - id: AC3
        text: "Running bin/b2sum on a file produces a BLAKE2b digest in the format specified by srd076 R1.3"
      - id: AC4
        text: "Running echo test | bin/b2sum reads from stdin and outputs a digest line"
      - id: AC5
        text: "Binary and text mode flags are accepted without error and produce correct output"

- index: 1
  title: "cmd/b2sum tests -- srd076 R1.1, R1.2, R1.3, R1.4"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd076-b2sum.yaml (R1.1, R1.2, R1.3, R1.4 -- test coverage targets)
      - cmd/b2sum/main.go (implementation to test from previous task)
      - pkg/testutils/ (differential testing framework -- BuildBinary, RunDiffTests, DiffTest)
      - cmd/md5sum/md5sum_test.go (reference pattern for checksum differential tests)
      - cmd/sha256sum/sha256sum_test.go (second reference for checksum test structure)
      - CLAUDE.md (project conventions for testing)

    files:
      - path: cmd/b2sum/b2sum_test.go
        action: create
        note: Differential tests for core BLAKE2b hashing against gb2sum

    requirements:
      - id: R1
        text: "Add differential test cases for srd076 R1.1 -- file digest computation must match gb2sum output byte-for-byte"
      - id: R2
        text: "Add differential test cases for srd076 R1.2 -- stdin input must produce the same output as gb2sum with stdin"
      - id: R3
        text: "Add differential test cases for srd076 R1.3 -- output format must match gb2sum default format exactly"
      - id: R4
        text: "Add differential test cases for srd076 R1.4 -- binary and text mode flags must produce same output as gb2sum with the same flags"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, '.') to compile cmd/b2sum and exec.LookPath('gb2sum') for the reference binary"
      - id: D2
        text: "Call t.Skip if gb2sum is not found in PATH -- tests must pass on machines without Homebrew GNU binaries"
      - id: D3
        text: "Set LC_ALL=C in test environment via DiffTest.Env field"
      - id: D4
        text: "Name the test function TestDiff following project convention"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/b2sum/ -count=1 passes (or skips gracefully if gb2sum is not in PATH)"
      - id: AC2
        text: "Test function is named TestDiff following project convention"
      - id: AC3
        text: "At least one DiffTest case per requirement -- file digest, stdin input, output format, binary/text mode"
      - id: AC4
        text: "All test cases use testutils.RunDiffTests for differential comparison against gb2sum"

- index: 2
  title: "cmd/b2sum implementation -- srd076 R2.1, R2.2, R2.3, R3.1"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd076-b2sum.yaml (R2.1, R2.2, R2.3, R3.1 -- output format options and check mode)
      - cmd/b2sum/main.go (existing implementation from previous task to extend)
      - pkg/hashutil/ (FormatBSDTag, VerifyChecksums, CheckOptions, ParseChecksumLine)
      - cmd/sha256sum/main.go (reference for --tag and --check flag implementation patterns)

    files:
      - path: cmd/b2sum/main.go
        action: modify
        note: Add BSD tag format, variable digest length, and check mode verification

    requirements:
      - id: R1
        text: "Implement srd076 R2.1 as specified in the SRD -- BSD-style tagged output format via pkg/hashutil.FormatBSDTag"
      - id: R2
        text: "Implement srd076 R2.2 as specified in the SRD -- variable BLAKE2b digest length flag that adjusts HashConfig.DigestLen and the BLAKE2b constructor initialization"
      - id: R3
        text: "Implement srd076 R2.3 as specified in the SRD -- multiple file argument processing with correct output per file"
      - id: R4
        text: "Implement srd076 R3.1 as specified in the SRD -- check mode that reads checksums from a file and verifies each entry using pkg/hashutil.VerifyChecksums"

    design_decisions:
      - id: D1
        text: "Use pkg/hashutil.FormatBSDTag for tagged output -- do not format BSD tag lines manually"
      - id: D2
        text: "When the digest length flag is specified, create a new HashConfig with the adjusted DigestLen and a BLAKE2b constructor initialized to that output length"
      - id: D3
        text: "Use pkg/hashutil.VerifyChecksums for check mode -- pass CheckOptions populated from command-line flags"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/b2sum ./cmd/b2sum/ succeeds with no errors"
      - id: AC2
        text: "go vet ./cmd/b2sum/ passes with no warnings"
      - id: AC3
        text: "Tag output flag produces BSD-style output matching the format specified in srd076 R2.1"
      - id: AC4
        text: "Variable digest length flag produces a digest of the specified bit length"
      - id: AC5
        text: "Check mode reads a checksum file and reports verification results per entry"

