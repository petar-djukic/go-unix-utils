- index: 0
  title: "cmd/sha256sum core hashing implementation (srd032 R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd032-sha256sum.yaml (full SRD -- read all requirements)
      - pkg/hashutil/ (shared checksum protocol library -- read all .go files for HashConfig, DigestFiles, FormatGNU API)
      - cmd/md5sum/main.go (reference implementation -- follow this pattern exactly)
      - pkg/sys/ (InstallSIGPIPEHandler function)

    files:
      - path: cmd/sha256sum/main.go
        action: create
        note: sha256sum utility -- core hashing, file I/O, output format

    requirements:
      - id: R1
        text: "Implement srd032 R1.1 -- compute SHA-256 digest for each file argument using pkg/hashutil.DigestFiles with crypto/sha256.New as the hash function and DigestLen 32"
      - id: R2
        text: "Implement srd032 R1.2 -- output digest in GNU two-space format for text mode and asterisk format for binary mode via pkg/hashutil.FormatGNU"
      - id: R3
        text: "Implement srd032 R1.3 -- read from stdin when no file arguments are given or when '-' is specified as a filename"
      - id: R4
        text: "Implement srd032 R1.4 -- support -b/--binary and -t/--text mode flags; default to text mode"

    design_decisions:
      - id: D1
        text: "Create hashutil.HashConfig with Algorithm 'SHA256', NewHash crypto/sha256.New, DigestLen 32"
      - id: D2
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention for all cmd/ utilities"
      - id: D3
        text: "Follow the same flag parsing and control flow pattern as cmd/md5sum/main.go -- sha256sum is structurally identical to md5sum except for the hash function and algorithm name"
      - id: D4
        text: "Import path for hashutil is github.com/petar-djukic/go-unix-utils/pkg/hashutil; for sys is github.com/petar-djukic/go-unix-utils/pkg/sys"

    acceptance_criteria:
      - id: AC1
        text: "cmd/sha256sum/main.go compiles with go build -o bin/sha256sum ./cmd/sha256sum/"
      - id: AC2
        text: "Running bin/sha256sum on a file produces the correct SHA-256 digest in GNU two-space format"
      - id: AC3
        text: "Running echo hello | bin/sha256sum reads from stdin and produces the correct digest"
      - id: AC4
        text: "The -b flag produces binary-mode output with asterisk before filename"
      - id: AC5
        text: "sys.InstallSIGPIPEHandler() is called at the start of main()"

- index: 1
  title: "cmd/sha256sum check mode and tag format (srd032 R2.1, R2.2, R2.3, R3.1)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd032-sha256sum.yaml (full SRD -- R2.1 through R2.3 and R3.1)
      - cmd/sha256sum/main.go (implementation from previous task -- add check mode and tag format)
      - pkg/hashutil/ (VerifyChecksums, CheckOptions, FormatBSDTag API)
      - cmd/md5sum/main.go (reference for check mode and tag format pattern)

    files:
      - path: cmd/sha256sum/main.go
        action: modify
        note: add --check mode, verification reporting flags, and BSD tag format

    requirements:
      - id: R1
        text: "Implement srd032 R2.1 -- add --check/-c flag that reads checksums from a file and verifies each one using pkg/hashutil.VerifyChecksums"
      - id: R2
        text: "Implement srd032 R2.2 -- print OK or FAILED for each verified file during check mode"
      - id: R3
        text: "Implement srd032 R2.3 -- support --warn, --quiet, and --status flags in check mode using pkg/hashutil.CheckOptions"
      - id: R4
        text: "Implement srd032 R3.1 -- add --tag flag to output digests in BSD tag format using pkg/hashutil.FormatBSDTag with algorithm name 'SHA256'"

    design_decisions:
      - id: D1
        text: "Map --warn to CheckOptions.Warn, --quiet to CheckOptions.Quiet, --status to CheckOptions.Status"
      - id: D2
        text: "Follow the same check-mode and tag-format control flow pattern as cmd/md5sum/main.go"

    acceptance_criteria:
      - id: AC1
        text: "bin/sha256sum --check reads a checksum file and prints OK/FAILED per entry"
      - id: AC2
        text: "bin/sha256sum --tag outputs in BSD tag format: SHA256 (filename) = digest"
      - id: AC3
        text: "--quiet suppresses OK lines during check; --status suppresses all output and uses exit code only"
      - id: AC4
        text: "go vet ./cmd/sha256sum/ passes with no errors"

- index: 2
  title: "cmd/sha256sum completion (srd032 R3.2, R4.1, R4.2, R4.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd032-sha256sum.yaml (full SRD -- R3.2, R4.1 through R4.3)
      - cmd/sha256sum/main.go (implementation from previous tasks -- add remaining flags and error handling)
      - cmd/md5sum/main.go (reference for help/version output and error handling pattern)

    files:
      - path: cmd/sha256sum/main.go
        action: modify
        note: add NUL-delimited output, exit codes, help/version, and error handling

    requirements:
      - id: R1
        text: "Implement srd032 R3.2 -- add --zero/-z flag for NUL-delimited output lines instead of newline-delimited"
      - id: R2
        text: "Implement srd032 R4.1 -- exit 0 on success, exit 1 when any file fails to hash or any checksum verification fails"
      - id: R3
        text: "Implement srd032 R4.2 -- support --help and --version flags with standard GNU-style output"
      - id: R4
        text: "Implement srd032 R4.3 -- handle file access errors gracefully: print error to stderr, continue processing remaining files, and set non-zero exit code"

    design_decisions:
      - id: D1
        text: "Use os.Exit for final exit code, collecting errors across all files processed via the return value of hashutil.DigestFiles"
      - id: D2
        text: "Follow the same --help and --version output format as cmd/md5sum"

    acceptance_criteria:
      - id: AC1
        text: "bin/sha256sum --zero outputs NUL-terminated lines"
      - id: AC2
        text: "bin/sha256sum exits 1 when a specified file does not exist, after printing an error to stderr"
      - id: AC3
        text: "bin/sha256sum --help prints usage information to stdout and exits 0"
      - id: AC4
        text: "bin/sha256sum --version prints version information to stdout and exits 0"
      - id: AC5
        text: "go build -o bin/sha256sum ./cmd/sha256sum/ and go vet ./cmd/sha256sum/ both pass"

- index: 3
  title: "cmd/sha256sum differential tests (srd032 R1.1, R1.2, R1.3, R1.4)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd032-sha256sum.yaml (full SRD -- requirements being tested)
      - cmd/sha256sum/main.go (implementation to test)
      - cmd/md5sum/md5sum_test.go (reference test pattern -- follow this structure)
      - pkg/testutils/ (DiffTest, RunDiffTests, BuildBinary API -- read all .go files)

    files:
      - path: cmd/sha256sum/sha256sum_test.go
        action: create
        note: differential tests comparing Go sha256sum against gsha256sum

    requirements:
      - id: R1
        text: "Test srd032 R1.1 -- differential test cases for hashing a single file and multiple files, comparing output against gsha256sum"
      - id: R2
        text: "Test srd032 R1.2 -- differential test cases verifying GNU two-space output format in both text and binary modes"
      - id: R3
        text: "Test srd032 R1.3 -- differential test cases for stdin input (no args) and '-' filename argument"
      - id: R4
        text: "Test srd032 R1.4 -- differential test cases for -b/--binary and -t/--text flag combinations"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, '.') to compile cmd/sha256sum and exec.LookPath('gsha256sum') for the reference binary"
      - id: D2
        text: "Call t.Skip if gsha256sum is not found in PATH per project convention"
      - id: D3
        text: "Define test cases as []testutils.DiffTest with Name, Args, Stdin, and Env fields"
      - id: D4
        text: "Set LC_ALL=C in Env for all test cases per project convention"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/sha256sum/ -count=1 passes when gsha256sum is available in PATH"
      - id: AC2
        text: "Tests skip gracefully with t.Skip when gsha256sum is not in PATH"
      - id: AC3
        text: "Test file includes at least one DiffTest case per requirement (R1.1 through R1.4)"
      - id: AC4
        text: "All test cases include LC_ALL=C in the Env field"