- index: 2
  title: "[stitch] cmd/sha224sum: srd074 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd074-sha224sum.yaml (SRD for sha224sum -- read requirements R1.1 through R1.4)
      - pkg/hashutil/ (shared hash utility library -- use HashConfig, ComputeDigest, DigestFiles, FormatGNU, FormatBSDTag)
      - cmd/sha256sum/main.go (reference implementation of a nearly identical checksum utility -- follow its structure)
      - cmd/sha256sum/sha256sum_test.go (reference differential tests for a similar utility)
      - pkg/testutils/ (differential testing harness)
      - pkg/sys/ (SIGPIPE handler)

    files:
      - path: cmd/sha224sum/main.go
        action: create
        note: SHA-224 checksum utility using pkg/hashutil with crypto/sha256.New224
      - path: cmd/sha224sum/sha224sum_test.go
        action: create
        note: Differential tests against gsha224sum reference binary

    requirements:
      - id: R1
        text: Implement srd074-sha224sum requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd074-sha224sum requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd074-sha224sum requirement R1.3 as specified in the SRD
      - id: R4
        text: Implement srd074-sha224sum requirement R1.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Use pkg/hashutil.HashConfig with crypto/sha256.New224 as the hash function and digest length 28 (224 bits)
      - id: D2
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior
      - id: D3
        text: Use testutils.RunDiffTests for differential testing against gsha224sum reference binary
      - id: D4
        text: Follow the same structure as cmd/sha256sum -- sha224sum and sha256sum share the same protocol and differ only in hash algorithm and digest length

    acceptance_criteria:
      - id: AC1
        text: cmd/sha224sum/main.go created with R1.1-R1.4 requirements implemented
      - id: AC2
        text: cmd/sha224sum/sha224sum_test.go created with differential tests for R1 requirements
      - id: AC3
        text: go build -o bin/sha224sum ./cmd/sha224sum/ succeeds with no errors
      - id: AC4
        text: go test ./cmd/sha224sum/... -count=1 passes (skips gracefully if gsha224sum not in PATH)
      - id: AC5
        text: go vet ./cmd/sha224sum/ reports no issues

