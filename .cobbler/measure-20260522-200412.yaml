- index: 0
  title: "[stitch] cmd/printf: srd073 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd073-printf.yaml (SRD for printf -- read requirements R3.1 through R3.4)
      - cmd/printf/main.go (existing implementation covering R1.1-R2.4 -- extend with R3 requirements)
      - cmd/printf/printf_test.go (existing differential tests -- add tests for R3 requirements)
      - pkg/testutils/ (differential testing harness used by all cmd/ tests)
      - pkg/sys/ (SIGPIPE handler -- already called in main, no changes needed)

    files:
      - path: cmd/printf/main.go
        action: modify
        note: Add functionality specified by srd073 R3.1-R3.4
      - path: cmd/printf/printf_test.go
        action: modify
        note: Add differential test cases for R3.1-R3.4

    requirements:
      - id: R1
        text: Implement srd073-printf requirement R3.1 as specified in the SRD
      - id: R2
        text: Implement srd073-printf requirement R3.2 as specified in the SRD
      - id: R3
        text: Implement srd073-printf requirement R3.3 as specified in the SRD
      - id: R4
        text: Implement srd073-printf requirement R3.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Extend the existing cmd/printf implementation -- do not rewrite or reorganize existing code that covers R1 and R2
      - id: D2
        text: Use the established differential testing pattern with testutils.RunDiffTests comparing against gprintf reference binary
      - id: D3
        text: Derive all implementation details from srd073-printf.yaml -- do not invent behavior not specified in the SRD

    acceptance_criteria:
      - id: AC1
        text: All four requirements R3.1-R3.4 from srd073-printf are implemented in cmd/printf/main.go
      - id: AC2
        text: Differential tests added to cmd/printf/printf_test.go for each R3 requirement
      - id: AC3
        text: go build ./cmd/printf/ succeeds with no errors
      - id: AC4
        text: go test ./cmd/printf/... -count=1 passes (skips gracefully if gprintf not in PATH)
      - id: AC5
        text: go vet ./cmd/printf/ reports no issues

