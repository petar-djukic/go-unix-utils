- index: 0
  title: "[stitch] srd039-env R1.1, R1.2, R1.3, R2.1 (implementation)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd039-env.yaml (SRD for env -- focus on R1.1, R1.2, R1.3, R2.1)
      - pkg/testutils/difftest.go (differential testing pattern -- DiffTest struct and RunDiffTests)
      - pkg/sys/sigpipe.go (SIGPIPE handler -- call InstallSIGPIPEHandler at start of main)
      - CLAUDE.md (project conventions for building and testing)

    files:
      - path: cmd/env/main.go
        action: create
        note: env utility implementation covering R1.1, R1.2, R1.3, R2.1
      - path: cmd/env/env_test.go
        action: create
        note: differential tests for R1.1, R1.2, R1.3, R2.1

    requirements:
      - id: R1
        text: "Implement srd039-env R1.1 per the SRD acceptance criteria"
      - id: R2
        text: "Implement srd039-env R1.2 per the SRD acceptance criteria"
      - id: R3
        text: "Implement srd039-env R1.3 per the SRD acceptance criteria"
      - id: R4
        text: "Implement srd039-env R2.1 per the SRD acceptance criteria"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main"
      - id: D2
        text: "Use the differential testing pattern from pkg/testutils with reference binary genv via exec.LookPath"
      - id: D3
        text: "Call t.Skip if reference binary genv is not found in PATH"
      - id: D4
        text: "Set LC_ALL=C in all differential test environments"

    acceptance_criteria:
      - id: AC1
        text: "go build ./cmd/env/ compiles without errors"
      - id: AC2
        text: "go vet ./cmd/env/ reports no issues"
      - id: AC3
        text: "go test ./cmd/env/ -count=1 passes (with t.Skip if reference binary genv not found)"
      - id: AC4
        text: "All srd039-env R1.1, R1.2, R1.3, R2.1 acceptance criteria from the SRD are satisfied"

