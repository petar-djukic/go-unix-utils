- index: 3
  title: "cmd/unlink differential tests (srd038 R1.1, R1.2, R1.3, R2.1)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd038-unlink.yaml (full SRD -- test cases should cover all requirements)
      - cmd/unlink/main.go (the implementation under test)
      - pkg/testutils/ (DiffTest struct, RunDiffTests, BuildBinary -- read all exported types and functions)
      - cmd/basename/basename_test.go (reference differential test pattern for a simple cmd/ utility)

    files:
      - path: cmd/unlink/unlink_test.go
        action: create
        note: Differential tests comparing Go unlink binary against gunlink Homebrew reference binary

    requirements:
      - id: R1
        text: "Create TestDiff function using testutils.BuildBinary to compile the Go binary and exec.LookPath to find the gunlink reference binary"
      - id: R2
        text: "Write differential test cases for srd038 R1.1 -- core unlink operation on a regular file"
      - id: R3
        text: "Write differential test cases for srd038 R1.2 -- argument count validation (zero args, extra args)"
      - id: R4
        text: "Write differential test cases for srd038 R1.3 -- exit code behavior for success and failure"

    design_decisions:
      - id: D1
        text: "Use testutils.RunDiffTests with a []testutils.DiffTest slice per the shared differential testing protocol in ARCHITECTURE.yaml"
      - id: D2
        text: "Skip the entire test with t.Skip if gunlink is not found in PATH via exec.LookPath -- tests must pass on machines without Homebrew GNU binaries"
      - id: D3
        text: "Create temporary files and directories in t.TempDir() for test fixtures -- each test case manages its own fixture setup"
      - id: D4
        text: "Set LC_ALL=C in the Env field of each DiffTest to ensure consistent output between Go and reference binaries"

    acceptance_criteria:
      - id: AC1
        text: "cmd/unlink/unlink_test.go exists and compiles"
      - id: AC2
        text: "go test ./cmd/unlink/ -count=1 passes when gunlink is available, or skips gracefully when not found"
      - id: AC3
        text: "Test cases cover core unlink operation, argument validation, and exit code behavior"
      - id: AC4
        text: "Test follows the graceful skip pattern -- t.Skip when reference binary gunlink is not in PATH"