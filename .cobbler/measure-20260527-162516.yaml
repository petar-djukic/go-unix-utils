- index: 0
  title: "[stitch] cmd/dir: implement srd107 R2.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd107-dir.yaml (R2.4 requirement details)
      - cmd/dir/main.go (existing implementation -- R1.1-R1.5, R2.1-R2.3 already implemented)

    files:
      - path: cmd/dir/main.go
        action: modify
        note: Add R2.4 functionality to existing dir implementation

    requirements:
      - id: R1
        text: "Implement srd107 R2.4 as specified in the SRD, extending the existing cmd/dir implementation"

    design_decisions:
      - id: D1
        text: "Extend the existing cmd/dir/main.go -- do not rewrite or restructure code for R1.1-R1.5, R2.1-R2.3"
      - id: D2
        text: "Preserve the existing sys.InstallSIGPIPEHandler() call at the start of main"
      - id: D3
        text: "dir is equivalent to ls -C -b -- maintain this equivalence when adding R2.4"

    acceptance_criteria:
      - id: AC1
        text: "cmd/dir/main.go compiles with go build -o bin/dir ./cmd/dir/"
      - id: AC2
        text: "R2.4 behavior matches the SRD specification"
      - id: AC3
        text: "Existing functionality for R1.1-R1.5, R2.1-R2.3 is preserved unchanged"
      - id: AC4
        text: "go vet ./cmd/dir/ reports no issues"

- index: 1
  title: "[stitch] cmd/dir: test srd107 R2.4"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd107-dir.yaml (R2.4 requirement and acceptance criteria)
      - cmd/dir/main.go (implementation to test)
      - cmd/dir/dir_test.go (existing tests to extend)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests API)

    files:
      - path: cmd/dir/dir_test.go
        action: modify
        note: Add differential test cases for R2.4

    requirements:
      - id: R1
        text: "Add differential test cases to cmd/dir/dir_test.go that verify srd107 R2.4 behavior against the gdir reference binary"

    design_decisions:
      - id: D1
        text: "Use testutils.RunDiffTests with testutils.BuildBinary(t, \".\") for the Go binary and exec.LookPath(\"gdir\") for the reference binary"
      - id: D2
        text: "Call t.Skip if the gdir reference binary is not found in PATH"
      - id: D3
        text: "Add test cases to the existing []testutils.DiffTest slice -- do not create a separate test function"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/dir/ -count=1 passes (or skips if gdir not installed)"
      - id: AC2
        text: "New test cases exercise the R2.4 behavior specified in the SRD"
      - id: AC3
        text: "Existing test cases for R1.1-R1.5, R2.1-R2.3 are preserved unchanged"
      - id: AC4
        text: "Tests set LC_ALL=C in the environment"

