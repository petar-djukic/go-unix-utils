- index: 0
  title: "[stitch] Implement cmd/pinky core functionality (srd098 R1.1, R1.2, R1.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd098-pinky.yaml (full SRD -- implements R1.1, R1.2, R1.3)
      - cmd/users/main.go (utmpx reading pattern reference -- same release, same database)
      - cmd/users/users_test.go (differential testing pattern reference)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function signatures)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler for SIGPIPE handling)

    files:
      - path: cmd/pinky/main.go
        action: create
        note: pinky utility -- core user lookup with GECOS field display via utmpx

    requirements:
      - id: R1
        text: "Implement srd098-pinky R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd098-pinky R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd098-pinky R1.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D2
        text: "Read utmpx database for login session data, following the same pattern used in cmd/users"
      - id: D3
        text: "Reference binary is gpinky from Homebrew GNU coreutils"

    acceptance_criteria:
      - id: AC1
        text: "cmd/pinky/main.go compiles with go build -o bin/pinky ./cmd/pinky/"
      - id: AC2
        text: "go vet ./cmd/pinky/ passes with no warnings"
      - id: AC3
        text: "srd098 R1.1, R1.2, R1.3 are implemented as specified in the SRD"

