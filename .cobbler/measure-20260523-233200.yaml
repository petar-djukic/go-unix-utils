- index: 2
  title: "[stitch] Implement cmd/pinky error handling and differential tests (srd098 R3.1, R3.2, R3.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd098-pinky.yaml (full SRD -- implements R3.1, R3.2, R3.3)
      - cmd/pinky/main.go (existing implementation from prior tasks)
      - cmd/users/users_test.go (differential testing pattern -- same utmpx-based utility)
      - pkg/testutils/difftest.go (DiffTest struct, RunDiffTests, BuildBinary)

    files:
      - path: cmd/pinky/main.go
        action: modify
        note: Add error handling paths and edge case coverage
      - path: cmd/pinky/pinky_test.go
        action: create
        note: Differential tests comparing output against gpinky reference binary

    requirements:
      - id: R1
        text: "Implement srd098-pinky R3.1 as specified in the SRD"
      - id: R2
        text: "Implement srd098-pinky R3.2 as specified in the SRD"
      - id: R3
        text: "Implement srd098-pinky R3.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary under test"
      - id: D2
        text: "Use exec.LookPath(\"gpinky\") for the reference binary; call t.Skip if not found"
      - id: D3
        text: "Set LC_ALL=C in test environment via DiffTest.Env for deterministic output comparison"
      - id: D4
        text: "Use testutils.RunDiffTests to compare stdout, stderr, and exit code against gpinky"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/pinky/ -count=1 passes (or skips gracefully if gpinky not in PATH)"
      - id: AC2
        text: "go vet ./cmd/pinky/ passes with no warnings"
      - id: AC3
        text: "Differential tests cover core functionality, formatting modes, and error cases"
      - id: AC4
        text: "srd098 R3.1, R3.2, R3.3 are implemented as specified in the SRD"

