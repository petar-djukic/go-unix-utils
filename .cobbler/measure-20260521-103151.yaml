- index: 0
  title: "[stitch] cmd/touch: srd062 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd062-touch.yaml (touch SRD -- requirements R1.1 through R1.4)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- differential testing and SIGPIPE patterns)
      - pkg/sys/sys.go (InstallSIGPIPEHandler usage)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function)

    files:
      - path: cmd/touch/main.go
        action: create
        note: touch utility implementation covering srd062 R1.1-R1.4
      - path: cmd/touch/touch_test.go
        action: create
        note: differential tests for srd062 R1.1-R1.4

    requirements:
      - id: R1
        text: "Implement srd062 R1.1 per the SRD specification"
      - id: R2
        text: "Implement srd062 R1.2 per the SRD specification"
      - id: R3
        text: "Implement srd062 R1.3 per the SRD specification"
      - id: R4
        text: "Implement srd062 R1.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils SIGPIPE behavior"
      - id: D2
        text: "Use testutils.BuildBinary and testutils.RunDiffTests for differential testing against gtouch"
      - id: D3
        text: "Call exec.LookPath(\"gtouch\") and t.Skip if the reference binary is not found"
      - id: D4
        text: "Set LC_ALL=C in test environment for deterministic output comparison"

    acceptance_criteria:
      - id: AC1
        text: "cmd/touch/main.go compiles with go build -o bin/touch ./cmd/touch/"
      - id: AC2
        text: "cmd/touch/touch_test.go passes with go test ./cmd/touch/... -count=1"
      - id: AC3
        text: "go vet ./cmd/touch/... reports no issues"
      - id: AC4
        text: "Differential tests compare touch output against gtouch for all R1.1-R1.4 scenarios"
      - id: AC5
        text: "Tests skip gracefully when gtouch is not installed"

