- index: 0
  title: "cmd/install srd101-install R1.1, R1.2, R1.3, R1.4 (implementation)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd101-install.yaml (requirements R1.1 through R1.4)
      - docs/ARCHITECTURE.yaml (shared_protocols section for SIGPIPE and differential testing patterns)
      - pkg/sys/sys.go (FileInfo, Stat, Lstat for file metadata)
      - CLAUDE.md (build instructions and SIGPIPE handler requirement)

    files:
      - path: cmd/install/main.go
        action: create
        note: "install utility -- initial implementation covering srd101-install R1.1 through R1.4"

    requirements:
      - id: R1
        text: "Implement srd101-install R1.1 as specified in the SRD. Read the SRD to determine the exact requirement."
      - id: R2
        text: "Implement srd101-install R1.2 as specified in the SRD. Read the SRD to determine the exact requirement."
      - id: R3
        text: "Implement srd101-install R1.3 as specified in the SRD. Read the SRD to determine the exact requirement."
      - id: R4
        text: "Implement srd101-install R1.4 as specified in the SRD. Read the SRD to determine the exact requirement."

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main() per the shared SIGPIPE protocol in ARCHITECTURE.yaml"
      - id: D2
        text: "Use go build -o bin/install ./cmd/install/ to verify compilation. The bin/ directory is git-ignored."
      - id: D3
        text: "Use standard library os, io, and filepath packages for file operations. Import pkg/sys only if the SRD requires extended file metadata (Stat, Lstat, FileInfo)."
      - id: D4
        text: "This is the first of three implementation tasks for cmd/install. Implement only R1.1-R1.4. Later tasks will add R2.x and R3.x requirements."

    acceptance_criteria:
      - id: AC1
        text: "cmd/install/main.go exists and compiles with go vet ./cmd/install/..."
      - id: AC2
        text: "go build -o bin/install ./cmd/install/ succeeds without errors"
      - id: AC3
        text: "All four SRD requirements R1.1, R1.2, R1.3, and R1.4 from srd101-install are implemented"
      - id: AC4
        text: "The main function calls sys.InstallSIGPIPEHandler() before any other logic"

