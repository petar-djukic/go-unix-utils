- index: 0
  title: "[stitch] cmd/numfmt: srd071 R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd071-numfmt.yaml (R3.1-R3.4 requirements)
      - cmd/numfmt/main.go (existing implementation covering R1.1-R2.4)
      - cmd/numfmt/numfmt_test.go (existing differential tests)
      - pkg/sys/sys.go (SIGPIPE handler usage)

    files:
      - path: cmd/numfmt/main.go
        action: modify
        note: Add R3.1-R3.4 functionality to existing numfmt implementation
      - path: cmd/numfmt/numfmt_test.go
        action: modify
        note: Add differential tests for R3.1-R3.4

    requirements:
      - id: R1
        text: Implement srd071 R3.1 per the SRD specification
      - id: R2
        text: Implement srd071 R3.2 per the SRD specification
      - id: R3
        text: Implement srd071 R3.3 per the SRD specification
      - id: R4
        text: Implement srd071 R3.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Extend the existing numfmt implementation -- do not rewrite existing R1.1-R2.4 code
      - id: D2
        text: Use the differential testing pattern with gnumfmt as the reference binary
      - id: D3
        text: Call sys.InstallSIGPIPEHandler() at the start of main if not already present

    acceptance_criteria:
      - id: AC1
        text: go build ./cmd/numfmt/ compiles without errors
      - id: AC2
        text: go test ./cmd/numfmt/... -count=1 passes
      - id: AC3
        text: All R3.1-R3.4 requirements from srd071-numfmt are implemented
      - id: AC4
        text: Differential tests cover R3.1-R3.4 behavior against gnumfmt

