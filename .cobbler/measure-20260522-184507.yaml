- index: 2
  title: "[stitch] cmd/od: srd072 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd072-od.yaml (R1.1-R1.4 requirements)
      - pkg/sys/sys.go (SIGPIPE handler)
      - pkg/testutils/difftest.go (differential testing framework)

    files:
      - path: cmd/od/main.go
        action: create
        note: od utility -- dump files in octal and other formats
      - path: cmd/od/od_test.go
        action: create
        note: Differential tests for R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd072 R1.1 per the SRD specification
      - id: R2
        text: Implement srd072 R1.2 per the SRD specification
      - id: R3
        text: Implement srd072 R1.3 per the SRD specification
      - id: R4
        text: Implement srd072 R1.4 per the SRD specification

    design_decisions:
      - id: D1
        text: Use the differential testing pattern with god as the reference binary via exec.LookPath
      - id: D2
        text: Call sys.InstallSIGPIPEHandler() at the start of main
      - id: D3
        text: Skip tests with t.Skip if the reference binary god is not found in PATH

    acceptance_criteria:
      - id: AC1
        text: go build ./cmd/od/ compiles without errors
      - id: AC2
        text: go test ./cmd/od/... -count=1 passes
      - id: AC3
        text: All R1.1-R1.4 requirements from srd072-od are implemented
      - id: AC4
        text: Differential tests cover R1.1-R1.4 behavior against god

