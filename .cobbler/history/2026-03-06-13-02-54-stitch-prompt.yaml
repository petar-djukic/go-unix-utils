            17 | func TestDiff(t *testing.T) {
            18 | 	t.Parallel()
            20 | 	goBin := testutils.BuildBinary(t, ".")
            22 | 	// Graceful skip if gexpand is not in PATH.
            23 | 	refBin, err := exec.LookPath("gexpand")
            24 | 	if err != nil {
            25 | 		t.Skipf("reference binary gexpand not in PATH: %v", err)
            26 | 	}
            28 | 	tests := []testutils.DiffTest{
            29 | 		// R1.1: Default tab expansion — tab at column 2 expands to 7 spaces.
            30 | 		{
            31 | 			Name:  "expand_default_single_tab",
            32 | 			Stdin: []byte("a\tb\n"),
            33 | 			Env:   []string{"LC_ALL=C"},
            34 | 		},
            35 | 		// R1.1, R1.2: Two consecutive tabs each advance to the next tab stop.
            36 | 		{
            37 | 			Name:  "expand_multiple_tabs",
            38 | 			Stdin: []byte("\t\tx\n"),
            39 | 			Env:   []string{"LC_ALL=C"},
            40 | 		},
            41 | 		// R1.3: Input with no tabs passes through unchanged.
            42 | 		{
            43 | 			Name:  "expand_no_tabs",
            44 | 			Stdin: []byte("hello world\n"),
            45 | 			Env:   []string{"LC_ALL=C"},
            46 | 		},
