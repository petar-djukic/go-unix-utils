            5 | package testutils
            7 | import (
            8 | 	"bytes"
            9 | 	"fmt"
            10 | 	"os"
            11 | 	"os/exec"
            12 | 	"path/filepath"
            13 | 	"testing"
            14 | )
            16 | // NormalizeFunc transforms output bytes before comparison.
            17 | type NormalizeFunc = func([]byte) []byte
            19 | // DiffTest defines a single differential test case.
            20 | type DiffTest struct {
            21 | 	Name          string
            22 | 	Args          []string
            23 | 	Stdin         []byte
            24 | 	Env           []string
            25 | 	WorkDir       string
            26 | 	ExitCode      int
            27 | 	Normalize     []NormalizeFunc
            28 | 	ExpectedFiles map[string][]byte
            29 | }
            31 | // BuildBinary compiles the Go package at dir and returns the path to the binary.
            32 | func BuildBinary(t *testing.T, dir string) string {
            33 | 	t.Helper()
            34 | 	absDir, err := filepath.Abs(dir)
            35 | 	if err != nil {
            36 | 		t.Fatalf("abs path: %v", err)
            37 | 	}
            38 | 	binName := filepath.Base(absDir)
            39 | 	tmpDir := t.TempDir()
            40 | 	binPath := filepath.Join(tmpDir, binName)
            41 | 	cmd := exec.Command("go", "build", "-o", binPath, ".")
            42 | 	cmd.Dir = absDir
            43 | 	out, err := cmd.CombinedOutput()
            44 | 	if err != nil {
            45 | 		t.Fatalf("build %s: %v\n%s", dir, err, out)
            46 | 	}
            47 | 	return binPath
            48 | }
            50 | // RunDiffTests runs each test case against both binaries and compares outputs.
            51 | func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) {
            52 | 	t.Helper()
            53 | 	for _, tc := range tests {
            54 | 		t.Run(tc.Name, func(t *testing.T) {
            55 | 			t.Parallel()
            56 | 			goOut, goErr, goExit := runBinary(goBinary, tc)
            57 | 			refOut, refErr, refExit := runBinary(refBinary, tc)
            59 | 			// Apply normalizers.
            60 | 			for _, fn := range tc.Normalize {
            61 | 				goOut = fn(goOut)
            62 | 				refOut = fn(refOut)
            63 | 				goErr = fn(goErr)
            64 | 				refErr = fn(refErr)
            65 | 			}
            67 | 			if goExit != refExit {
            68 | 				t.Errorf("exit code: go=%d ref=%d\nargs: %v\ngo stdout: %q\nref stdout: %q\ngo stderr: %q\nref stderr: %q",
            69 | 					goExit, refExit, tc.Args, goOut, refOut, goErr, refErr)
            70 | 			}
            71 | 			if !bytes.Equal(goOut, refOut) {
            72 | 				t.Errorf("stdout mismatch:\nargs: %v\ngo:  %q\nref: %q", tc.Args, goOut, refOut)
            73 | 			}
            74 | 			if !bytes.Equal(goErr, refErr) {
            75 | 				t.Errorf("stderr mismatch:\nargs: %v\ngo:  %q\nref: %q", tc.Args, goErr, refErr)
            76 | 			}
            77 | 		})
            78 | 	}
            79 | }
            81 | // runBinary executes a binary with the given test case parameters.
            82 | func runBinary(bin string, tc DiffTest) (stdout, stderr []byte, exitCode int) {
            83 | 	cmd := exec.Command(bin, tc.Args...)
            84 | 	if tc.Stdin != nil {
            85 | 		cmd.Stdin = bytes.NewReader(tc.Stdin)
            86 | 	}
            87 | 	if tc.WorkDir != "" {
            88 | 		cmd.Dir = tc.WorkDir
            89 | 	}
            90 | 	cmd.Env = append(os.Environ(), tc.Env...)
            92 | 	var outBuf, errBuf bytes.Buffer
            93 | 	cmd.Stdout = &outBuf
            94 | 	cmd.Stderr = &errBuf
            96 | 	err := cmd.Run()
            97 | 	exitCode = 0
            98 | 	if err != nil {
            99 | 		if exitErr, ok := err.(*exec.ExitError); ok {
            100 | 			exitCode = exitErr.ExitCode()
            101 | 		} else {
            102 | 			exitCode = -1
            103 | 			fmt.Fprintf(&errBuf, "exec error: %v", err)
            104 | 		}
            105 | 	}
            106 | 	return outBuf.Bytes(), errBuf.Bytes(), exitCode
            107 | }
