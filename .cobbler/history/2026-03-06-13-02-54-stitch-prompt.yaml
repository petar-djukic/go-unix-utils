        - file: cmd/expand/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the expand utility (prd024-expand R1-R3).
            5 | // expand converts tab characters to spaces, reading from files or stdin,
            6 | // with configurable tab stop positions via the -t flag.
            7 | package main
            9 | import (
            10 | 	"bufio"
            11 | 	"fmt"
            12 | 	"io"
            13 | 	"os"
            14 | 	"strconv"
            15 | 	"strings"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            18 | )
            20 | // defaultTabStop is the default tab stop interval.
            21 | const defaultTabStop = 8
            23 | func main() {
            24 | 	// R3.4: Handle SIGPIPE gracefully.
            25 | 	sys.InstallSIGPIPEHandler()
            27 | 	var tabStops []int
            28 | 	initialOnly := false
            30 | 	args := os.Args[1:]
            31 | 	var files []string
            33 | 	// Manual flag parsing to match GNU expand behavior.
            34 | 	i := 0
            35 | 	for i < len(args) {
            36 | 		arg := args[i]
            37 | 		if arg == "--" {
            38 | 			files = append(files, args[i+1:]...)
            39 | 			break
            40 | 		}
            41 | 		if arg == "--help" {
            42 | 			fmt.Println("Usage: expand [OPTION]... [FILE]...")
            43 | 			fmt.Println("Convert tabs in each FILE to spaces, writing to standard output.")
            44 | 			fmt.Println()
            45 | 			fmt.Println("  -i, --initial       do not convert tabs after non blanks")
            46 | 			fmt.Println("  -t, --tabs=N        have tabs N characters apart, not 8")
            47 | 			fmt.Println("  -t, --tabs=LIST     use comma separated list of tab positions")
            48 | 			fmt.Println("      --help          display this help and exit")
            49 | 			fmt.Println("      --version       output version information and exit")
            50 | 			os.Exit(0)
            51 | 		}
            52 | 		if arg == "--version" {
            53 | 			fmt.Println("expand (go-unix-utils) 0.1")
            54 | 			os.Exit(0)
            55 | 		}
            56 | 		if arg == "--initial" {
            57 | 			initialOnly = true
            58 | 			i++
            59 | 			continue
            60 | 		}
            61 | 		if strings.HasPrefix(arg, "--tabs=") {
            62 | 			val := arg[len("--tabs="):]
            63 | 			tabStops = parseTabStops(val)
            64 | 			i++
            65 | 			continue
            66 | 		}
            67 | 		if arg == "--tabs" {
            68 | 			i++
            69 | 			if i >= len(args) {
            70 | 				fmt.Fprintf(os.Stderr, "expand: option '--tabs' requires an argument\n")
            71 | 				os.Exit(1)
            72 | 			}
            73 | 			tabStops = parseTabStops(args[i])
            74 | 			i++
            75 | 			continue
            76 | 		}
            77 | 		if len(arg) == 0 || arg[0] != '-' || arg == "-" {
            78 | 			files = append(files, arg)
            79 | 			i++
            80 | 			continue
            81 | 		}
            83 | 		// Parse short flags from the argument.
            84 | 		j := 1
            85 | 		for j < len(arg) {
            86 | 			switch arg[j] {
            87 | 			case 'i':
            88 | 				// R3: -i converts only leading tabs.
            89 | 				initialOnly = true
            90 | 				j++
            91 | 			case 't':
            92 | 				// R2: -t sets tab stops.
            93 | 				val := arg[j+1:]
            94 | 				if val == "" {
            95 | 					i++
            96 | 					if i >= len(args) {
            97 | 						fmt.Fprintf(os.Stderr, "expand: option requires an argument -- 't'\n")
            98 | 						os.Exit(1)
            99 | 					}
            100 | 					val = args[i]
            101 | 				}
            102 | 				tabStops = parseTabStops(val)
            103 | 				j = len(arg) // consumed rest of arg
            104 | 			default:
            105 | 				fmt.Fprintf(os.Stderr, "expand: invalid option -- '%c'\n", arg[j])
            106 | 				os.Exit(1)
            107 | 			}
            108 | 		}
            109 | 		i++
            110 | 	}
            112 | 	// R1.1: Read stdin when no file arguments are given.
            113 | 	if len(files) == 0 {
            114 | 		files = []string{"-"}
            115 | 	}
            117 | 	// Build effective tab stop configuration.
            118 | 	if len(tabStops) == 0 {
            119 | 		tabStops = []int{defaultTabStop}
            120 | 	}
            122 | 	exitCode := 0
            123 | 	w := bufio.NewWriter(os.Stdout)
            125 | 	for _, file := range files {
            126 | 		r, err := openInput(file)
            127 | 		if err != nil {
            128 | 			// R3.2: Print error to stderr, continue processing remaining files.
            129 | 			fmt.Fprintf(os.Stderr, "expand: %v\n", err)
            130 | 			exitCode = 1
            131 | 			continue
            132 | 		}
            134 | 		if err := expandInput(r, w, tabStops, initialOnly); err != nil {
            135 | 			// R3.3: Exit 1 on write error.
            136 | 			os.Exit(1)
            137 | 		}
            139 | 		if closer, ok := r.(io.Closer); ok && file != "-" {
            140 | 			_ = closer.Close() // best-effort close
            141 | 		}
            142 | 	}
            144 | 	if err := w.Flush(); err != nil {
            145 | 		os.Exit(1)
            146 | 	}
            148 | 	os.Exit(exitCode)
            149 | }
            151 | // openInput returns a reader for the named file, or stdin if name is "-".
            152 | func openInput(name string) (io.Reader, error) {
            153 | 	if name == "-" {
            154 | 		return os.Stdin, nil
            155 | 	}
            156 | 	return os.Open(name)
            157 | }
            159 | // parseTabStops parses a tab stop specification: either a single number
            160 | // (uniform interval) or a comma-separated list of absolute positions.
            161 | func parseTabStops(s string) []int {
            162 | 	parts := strings.Split(s, ",")
            163 | 	stops := make([]int, 0, len(parts))
            164 | 	for _, p := range parts {
            165 | 		p = strings.TrimSpace(p)
            166 | 		n, err := strconv.Atoi(p)
            167 | 		if err != nil || n <= 0 {
            168 | 			fmt.Fprintf(os.Stderr, "expand: tab size contains invalid character(s): '%s'\n", s)
            169 | 			os.Exit(1)
            170 | 		}
            171 | 		stops = append(stops, n)
            172 | 	}
            173 | 	return stops
            174 | }
            176 | // nextTabStop returns the next tab stop column position given the current column
            177 | // (0-indexed) and the tab stop configuration.
            178 | // R2.1: Single value means uniform interval.
            179 | // R2.2: Multiple values are absolute positions; past the last stop, a tab becomes one space.
            180 | // R2.4: Single value in list behaves as uniform interval.
            181 | func nextTabStop(col int, stops []int) int {
            182 | 	if len(stops) == 1 {
            183 | 		// Uniform interval.
            184 | 		interval := stops[0]
            185 | 		return col + (interval - col%interval)
            186 | 	}
            187 | 	// Absolute positions (1-indexed in spec, but we work 0-indexed internally).
            188 | 	// The stops are given as 1-indexed column positions.
            189 | 	for _, s := range stops {
            190 | 		pos := s - 1 // convert to 0-indexed
            191 | 		if pos > col {
            192 | 			return pos
            193 | 		}
            194 | 	}
            195 | 	// R2.2: Past the last explicit stop, tab becomes one space.
            196 | 	return col + 1
            197 | }
            199 | // expandInput reads from r and writes tab-expanded output to w.
            200 | func expandInput(r io.Reader, w *bufio.Writer, stops []int, initialOnly bool) error {
            201 | 	br := bufio.NewReader(r)
            202 | 	col := 0
            203 | 	pastInitial := false
            205 | 	for {
            206 | 		b, err := br.ReadByte()
            207 | 		if err != nil {
            208 | 			if err == io.EOF {
            209 | 				return nil
            210 | 			}
            211 | 			return err
            212 | 		}
            214 | 		switch {
            215 | 		case b == '\n':
            216 | 			// R1.4: Newline resets column position.
            217 | 			if writeErr := w.WriteByte('\n'); writeErr != nil {
            218 | 				return writeErr
            219 | 			}
            220 | 			col = 0
            221 | 			pastInitial = false
            223 | 		case b == '\t' && !(initialOnly && pastInitial):
            224 | 			// R1.1, R1.2: Replace tab with spaces to reach next tab stop.
            225 | 			next := nextTabStop(col, stops)
            226 | 			spaces := next - col
            227 | 			for range spaces {
            228 | 				if writeErr := w.WriteByte(' '); writeErr != nil {
            229 | 					return writeErr
            230 | 				}
            231 | 			}
            232 | 			col = next
            234 | 		default:
            235 | 			// R1.3: Non-tab characters pass through unchanged.
            236 | 			if writeErr := w.WriteByte(b); writeErr != nil {
            237 | 				return writeErr
            238 | 			}
            239 | 			col++
            240 | 			// Track whether we've passed leading blanks for -i mode.
            241 | 			if b != ' ' && b != '\t' {
            242 | 				pastInitial = true
            243 | 			}
            244 | 		}
            245 | 	}
            246 | }
