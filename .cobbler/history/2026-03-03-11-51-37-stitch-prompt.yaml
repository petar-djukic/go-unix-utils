            166 | }
            168 | // ---------------------------------------------------------------------------
            169 | // R3: buildEnv and setEnvVar (prd001-testutils R3, ARCHITECTURE DD6)
            170 | // ---------------------------------------------------------------------------
            172 | func TestBuildEnv(t *testing.T) {
            173 | 	tests := []struct {
            174 | 		name    string
            175 | 		testEnv []string
            176 | 		key     string
            177 | 		want    string
            178 | 	}{
            179 | 		{
