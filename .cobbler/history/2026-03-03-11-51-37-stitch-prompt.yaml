            17 | // testBinPath is the default testbin binary (all ldflags defaults empty).
            18 | // testBinAltPath has ldflags-injected defaults for divergence testing:
            19 | //
            20 | //	defaultStdout="alt-stdout", defaultStderr="alt-stderr", defaultExitCode="1"
            21 | var (
