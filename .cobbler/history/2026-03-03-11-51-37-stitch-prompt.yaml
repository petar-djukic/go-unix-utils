            150 | 	if !bytes.Contains(out, []byte("divergence")) {
            151 | 		t.Fatalf("expected divergence message, got:\n%s", out)
            152 | 	}
            153 | }
            155 | // runExpectFail re-executes the named test as a subprocess and expects it to
            156 | // fail. It returns the combined stdout+stderr from the subprocess.
            157 | func runExpectFail(t *testing.T, testName string) []byte {
            158 | 	t.Helper()
            159 | 	cmd := exec.Command(os.Args[0], "-test.run=^"+testName+"$", "-test.v")
