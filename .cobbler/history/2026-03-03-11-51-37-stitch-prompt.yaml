            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // cmd/wc counts lines, words, and bytes in files or stdin, matching GNU wc
            5 | // output format under LC_ALL=C.
            6 | //
            7 | // Implements prd005-wc R1, R2, R3, R4, R5, R6.
            8 | package main
            10 | import (
            11 | 	"bufio"
            12 | 	"fmt"
            13 | 	"io"
            14 | 	"os"
            15 | 	"strings"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            18 | )
            20 | const progName = "wc"
            22 | type config struct {
            23 | 	lines      bool
            24 | 	words      bool
            25 | 	bytes      bool
            26 | 	chars      bool
            27 | 	maxLineLen bool
            28 | 	totalMode  string
            29 | 	files0From string
            30 | }
            32 | type fileCounts struct {
            33 | 	lines  int64
            34 | 	words  int64
            35 | 	bytes  int64
            36 | 	chars  int64
            37 | 	maxLen int64
            38 | }
            40 | func main() {
            41 | 	sys.InstallSIGPIPEHandler()
            43 | 	cfg, files := parseArgs(os.Args[1:])
            45 | 	// Default: no flags means lines + words + bytes (prd005-wc R1.1).
            46 | 	if !cfg.lines && !cfg.words && !cfg.bytes && !cfg.chars && !cfg.maxLineLen {
            47 | 		cfg.lines = true
            48 | 		cfg.words = true
            49 | 		cfg.bytes = true
            50 | 	}
            52 | 	// -m takes precedence over -c when both given (prd005-wc R2.3).
            53 | 	if cfg.chars && cfg.bytes {
            54 | 		cfg.bytes = false
            55 | 	}
            57 | 	// Handle --files0-from (prd005-wc R4.4).
            58 | 	if cfg.files0From != "" {
            59 | 		if len(files) > 0 {
            60 | 			fmt.Fprintf(os.Stderr, "%s: file operands cannot be combined with --files0-from\n", progName)
            61 | 			os.Exit(1)
            62 | 		}
            63 | 		var err error
            64 | 		files, err = readFiles0From(cfg.files0From)
            65 | 		if err != nil {
            66 | 			fmt.Fprintf(os.Stderr, "%s: %v\n", progName, err)
            67 | 			os.Exit(1)
            68 | 		}
            69 | 	}
            71 | 	// No files → read stdin (prd005-wc R1.2).
            72 | 	if len(files) == 0 {
            73 | 		files = []string{""}
            74 | 	}
            76 | 	numWidth := computeNumberWidth(files)
            77 | 	out := bufio.NewWriter(os.Stdout)
            78 | 	showPerFile, showTotal := totalPolicy(cfg.totalMode, len(files))
            80 | 	var total fileCounts
            81 | 	exitCode := 0
            83 | 	for _, file := range files {
            84 | 		c, name, err := processFile(file)
            85 | 		if err != nil {
            86 | 			fmt.Fprintf(os.Stderr, "%s: %s\n", progName, err)
            87 | 			exitCode = 1
            88 | 			continue
            89 | 		}
            91 | 		total.lines += c.lines
            92 | 		total.words += c.words
            93 | 		total.bytes += c.bytes
            94 | 		total.chars += c.chars
            95 | 		if c.maxLen > total.maxLen {
            96 | 			total.maxLen = c.maxLen
            97 | 		}
            99 | 		if showPerFile {
            100 | 			printLine(out, cfg, c, name, numWidth)
            101 | 		}
            102 | 	}
            104 | 	if showTotal {
            105 | 		printLine(out, cfg, total, "total", numWidth)
            106 | 	}
            108 | 	if err := out.Flush(); err != nil {
            109 | 		os.Exit(1) // prd005-wc R6.3
            110 | 	}
            112 | 	os.Exit(exitCode)
            113 | }
            115 | // parseArgs parses GNU-style flags including combined short flags (-lwc)
            116 | // and long flags with = or space-separated values.
            117 | func parseArgs(args []string) (config, []string) {
            118 | 	var cfg config
            119 | 	var files []string
            121 | 	for i := 0; i < len(args); i++ {
            122 | 		arg := args[i]
            124 | 		if arg == "--" {
            125 | 			files = append(files, args[i+1:]...)
            126 | 			break
            127 | 		}
            129 | 		if arg == "-" || !strings.HasPrefix(arg, "-") {
            130 | 			files = append(files, arg)
            131 | 			continue
            132 | 		}
            134 | 		if strings.HasPrefix(arg, "--") {
            135 | 			name, value, hasValue := strings.Cut(arg[2:], "=")
            136 | 			switch name {
            137 | 			case "lines":
            138 | 				cfg.lines = true
            139 | 			case "words":
            140 | 				cfg.words = true
            141 | 			case "bytes":
            142 | 				cfg.bytes = true
            143 | 			case "chars":
            144 | 				cfg.chars = true
            145 | 			case "max-line-length":
            146 | 				cfg.maxLineLen = true
            147 | 			case "total":
            148 | 				if hasValue {
            149 | 					cfg.totalMode = value
            150 | 				} else if i+1 < len(args) {
            151 | 					i++
            152 | 					cfg.totalMode = args[i]
            153 | 				}
            154 | 			case "files0-from":
            155 | 				if hasValue {
            156 | 					cfg.files0From = value
            157 | 				} else if i+1 < len(args) {
            158 | 					i++
            159 | 					cfg.files0From = args[i]
            160 | 				}
            161 | 			default:
            162 | 				fmt.Fprintf(os.Stderr, "%s: unrecognized option '--%s'\n", progName, name)
            163 | 				os.Exit(1)
            164 | 			}
            165 | 			continue
            166 | 		}
            168 | 		// Short flags may be combined: -lwc means -l -w -c.
            169 | 		for _, ch := range arg[1:] {
            170 | 			switch ch {
            171 | 			case 'l':
            172 | 				cfg.lines = true
            173 | 			case 'w':
            174 | 				cfg.words = true
            175 | 			case 'c':
            176 | 				cfg.bytes = true
            177 | 			case 'm':
            178 | 				cfg.chars = true
            179 | 			case 'L':
            180 | 				cfg.maxLineLen = true
            181 | 			default:
            182 | 				fmt.Fprintf(os.Stderr, "%s: invalid option -- '%c'\n", progName, ch)
            183 | 				os.Exit(1)
            184 | 			}
            185 | 		}
            186 | 	}
            188 | 	return cfg, files
            189 | }
            191 | // computeNumberWidth determines the minimum field width for count columns.
            192 | // When all files are regular and stat-able, the width is the digit count of
            193 | // their combined size. Otherwise the default width is 7, matching GNU wc.
            194 | func computeNumberWidth(files []string) int {
            195 | 	var totalSize int64
            197 | 	for _, f := range files {
            198 | 		if f == "" || f == "-" {
            199 | 			return 7
            200 | 		}
            201 | 		info, err := os.Stat(f)
            202 | 		if err != nil || !info.Mode().IsRegular() {
            203 | 			return 7
            204 | 		}
            205 | 		totalSize += info.Size()
            206 | 	}
            208 | 	width := 1
            209 | 	for n := totalSize; n >= 10; n /= 10 {
            210 | 		width++
            211 | 	}
            212 | 	return width
            213 | }
            215 | // totalPolicy decides whether per-file lines and a total line are printed
            216 | // based on --total mode and file count (prd005-wc R3.3).
            217 | func totalPolicy(mode string, nfiles int) (showPerFile, showTotal bool) {
            218 | 	switch mode {
            219 | 	case "always":
            220 | 		return true, true
            221 | 	case "only":
            222 | 		return false, true
            223 | 	case "never":
            224 | 		return true, false
            225 | 	default: // "auto" or ""
            226 | 		return true, nfiles > 1
            227 | 	}
            228 | }
            230 | // processFile opens and counts a single input. An empty path means implicit
            231 | // stdin (no filename in output); "-" means explicit stdin with "-" as label.
            232 | func processFile(path string) (fileCounts, string, error) {
            233 | 	if path == "" {
            234 | 		c, err := countInput(os.Stdin)
            235 | 		return c, "", err
            236 | 	}
            238 | 	if path == "-" {
            239 | 		c, err := countInput(os.Stdin)
            240 | 		return c, "-", err
            241 | 	}
            243 | 	f, err := os.Open(path)
            244 | 	if err != nil {
            245 | 		if pe, ok := err.(*os.PathError); ok {
            246 | 			return fileCounts{}, path, fmt.Errorf("%s: %v", path, pe.Err)
            247 | 		}
            248 | 		return fileCounts{}, path, err
            249 | 	}
            250 | 	defer f.Close()
            252 | 	c, err := countInput(f)
            253 | 	if err != nil {
            254 | 		return c, path, fmt.Errorf("%s: %v", path, err)
            255 | 	}
            257 | 	return c, path, nil
            258 | }
            260 | // countInput reads all bytes from r and computes line, word, byte, char, and
            261 | // max-line-length counts. Word detection uses byte-oriented C-locale isspace
            262 | // semantics (design decision D3). Under LC_ALL=C chars equal bytes (R5.2).
            263 | // Max line length uses tab expansion to the next multiple of 8 (R2.5).
            264 | func countInput(r io.Reader) (fileCounts, error) {
            265 | 	var c fileCounts
            266 | 	buf := make([]byte, 32*1024)
            267 | 	inWord := false
            268 | 	var linePos int64
            270 | 	for {
            271 | 		n, err := r.Read(buf)
            272 | 		for i := 0; i < n; i++ {
            273 | 			b := buf[i]
            274 | 			c.bytes++
            275 | 			c.chars++ // LC_ALL=C: each byte is one character (R5.2)
            277 | 			switch b {
            278 | 			case '\n':
            279 | 				c.lines++
            280 | 				if linePos > c.maxLen {
            281 | 					c.maxLen = linePos
            282 | 				}
            283 | 				linePos = 0
            284 | 				if inWord {
            285 | 					c.words++
            286 | 					inWord = false
            287 | 				}
            288 | 			case '\r', '\f':
            289 | 				if linePos > c.maxLen {
            290 | 					c.maxLen = linePos
            291 | 				}
            292 | 				linePos = 0
            293 | 				if inWord {
            294 | 					c.words++
            295 | 					inWord = false
            296 | 				}
            297 | 			case '\t':
            298 | 				linePos += 8 - (linePos % 8)
            299 | 				if inWord {
            300 | 					c.words++
            301 | 					inWord = false
            302 | 				}
            303 | 			case ' ':
            304 | 				linePos++
            305 | 				if inWord {
            306 | 					c.words++
            307 | 					inWord = false
            308 | 				}
            309 | 			case '\v':
            310 | 				if inWord {
            311 | 					c.words++
            312 | 					inWord = false
            313 | 				}
            314 | 			default:
            315 | 				// Printable ASCII (0x20-0x7E) advances display position.
            316 | 				// 0x20 (space) is handled above; default sees 0x21-0x7E.
            317 | 				// Non-printable and high bytes contribute to words but not
            318 | 				// display width, matching GNU wc under LC_ALL=C.
            319 | 				if b >= 0x20 && b <= 0x7E {
            320 | 					linePos++
            321 | 				}
            322 | 				inWord = true
            323 | 			}
            324 | 		}
            326 | 		if err == io.EOF {
            327 | 			break
            328 | 		}
            329 | 		if err != nil {
            330 | 			return c, err
            331 | 		}
            332 | 	}
            334 | 	// Final word with no trailing whitespace.
            335 | 	if inWord {
            336 | 		c.words++
            337 | 	}
            339 | 	// Final line segment with no trailing newline.
            340 | 	if linePos > c.maxLen {
            341 | 		c.maxLen = linePos
            342 | 	}
            344 | 	return c, nil
            345 | }
            347 | // printLine writes one output line: the requested counts right-justified in
            348 | // fixed-width columns followed by the filename (prd005-wc R2.6, R3.1).
            349 | func printLine(w *bufio.Writer, cfg config, c fileCounts, name string, width int) {
            350 | 	first := true
            351 | 	field := func(v int64) {
            352 | 		if first {
            353 | 			fmt.Fprintf(w, "%*d", width, v)
            354 | 			first = false
            355 | 		} else {
            356 | 			fmt.Fprintf(w, " %*d", width, v)
            357 | 		}
            358 | 	}
            360 | 	// Fixed output column order: lines, words, chars/bytes, max-line-length
            361 | 	// (prd005-wc R2.6).
            362 | 	if cfg.lines {
            363 | 		field(c.lines)
            364 | 	}
            365 | 	if cfg.words {
            366 | 		field(c.words)
            367 | 	}
            368 | 	if cfg.chars {
            369 | 		field(c.chars)
            370 | 	} else if cfg.bytes {
            371 | 		field(c.bytes)
            372 | 	}
            373 | 	if cfg.maxLineLen {
            374 | 		field(c.maxLen)
            375 | 	}
            377 | 	if name != "" {
            378 | 		fmt.Fprintf(w, " %s", name)
            379 | 	}
            380 | 	fmt.Fprint(w, "\n")
            381 | }
            383 | // readFiles0From reads NUL-delimited filenames from path (or stdin when
            384 | // path is "-") for --files0-from support (prd005-wc R4.4).
            385 | func readFiles0From(path string) ([]string, error) {
            386 | 	var r io.ReadCloser
            387 | 	if path == "-" {
            388 | 		r = io.NopCloser(os.Stdin)
            389 | 	} else {
            390 | 		f, err := os.Open(path)
            391 | 		if err != nil {
            392 | 			return nil, err
            393 | 		}
            394 | 		r = f
            395 | 	}
            396 | 	defer r.Close()
            398 | 	data, err := io.ReadAll(r)
            399 | 	if err != nil {
            400 | 		return nil, err
            401 | 	}
            403 | 	var files []string
            404 | 	for _, name := range strings.Split(string(data), "\x00") {
            405 | 		if name != "" {
            406 | 			files = append(files, name)
            407 | 		}
            408 | 	}
            409 | 	return files, nil
            410 | }
