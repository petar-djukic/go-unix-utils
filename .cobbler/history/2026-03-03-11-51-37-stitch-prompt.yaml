            51 | 	if err := buildHelper(testBinPath, ""); err != nil {
            52 | 		fmt.Fprintf(os.Stderr, "building testbin: %v\n", err)
            53 | 		os.RemoveAll(tmpDir) // best-effort cleanup
            54 | 		os.Exit(1)
            55 | 	}
            57 | 	testBinAltPath = filepath.Join(tmpDir, "testbin-alt")
            58 | 	if err := buildHelper(testBinAltPath, altLdflags); err != nil {
            59 | 		fmt.Fprintf(os.Stderr, "building testbin-alt: %v\n", err)
            60 | 		os.RemoveAll(tmpDir) // best-effort cleanup
            61 | 		os.Exit(1)
            62 | 	}
