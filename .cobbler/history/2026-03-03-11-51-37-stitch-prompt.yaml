            104 | // ---------------------------------------------------------------------------
            105 | // R2: RunDiffTests detects divergence in stdout, stderr, or exit code
            106 | //     (prd001-testutils R2, R3)
            107 | //
            108 | // These tests use the subprocess pattern: the test re-executes itself with
            109 | // TESTUTIL_EXPECT_FAIL=1, enters the divergent branch, and the outer test
            110 | // verifies the subprocess failed with a "divergence" message.
            111 | // ---------------------------------------------------------------------------
            113 | func TestRunDiffTests_DivergentStdout(t *testing.T) {
            114 | 	if os.Getenv(expectFailEnv) == "1" {
            115 | 		// Subprocess: only stdout differs (stderr and exit overridden to match).
            116 | 		RunDiffTests(t, testBinPath, testBinAltPath, nil, []DiffTest{
            117 | 			{Name: "div-stdout", Args: []string{"--stderr", "", "--exit-code", "0"}},
            118 | 		})
            119 | 		return
            120 | 	}
            121 | 	out := runExpectFail(t, "TestRunDiffTests_DivergentStdout")
            122 | 	if !bytes.Contains(out, []byte("divergence")) {
            123 | 		t.Fatalf("expected divergence message, got:\n%s", out)
            124 | 	}
            125 | }
            127 | func TestRunDiffTests_DivergentStderr(t *testing.T) {
            128 | 	if os.Getenv(expectFailEnv) == "1" {
            129 | 		// Subprocess: only stderr differs (stdout and exit overridden to match).
            130 | 		RunDiffTests(t, testBinPath, testBinAltPath, nil, []DiffTest{
            131 | 			{Name: "div-stderr", Args: []string{"--stdout", "", "--exit-code", "0"}},
            132 | 		})
            133 | 		return
            134 | 	}
            135 | 	out := runExpectFail(t, "TestRunDiffTests_DivergentStderr")
            136 | 	if !bytes.Contains(out, []byte("divergence")) {
            137 | 		t.Fatalf("expected divergence message, got:\n%s", out)
            138 | 	}
            139 | }
            141 | func TestRunDiffTests_DivergentExitCode(t *testing.T) {
            142 | 	if os.Getenv(expectFailEnv) == "1" {
            143 | 		// Subprocess: only exit code differs (stdout and stderr overridden to match).
            144 | 		RunDiffTests(t, testBinPath, testBinAltPath, nil, []DiffTest{
            145 | 			{Name: "div-exit", Args: []string{"--stdout", "", "--stderr", ""}},
            146 | 		})
            147 | 		return
            148 | 	}
