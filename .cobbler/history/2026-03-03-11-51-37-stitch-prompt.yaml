            33 | const altLdflags = "-X main.defaultStdout=alt-stdout -X main.defaultStderr=alt-stderr -X main.defaultExitCode=1"
            35 | func TestMain(m *testing.M) {
            36 | 	// When running as a subprocess for divergence tests, reuse pre-built
            37 | 	// binaries passed via environment variables to avoid rebuilding.
            38 | 	if path := os.Getenv("TESTBIN_PATH"); path != "" {
