            72 | // buildHelper compiles testdata/testbin with optional ldflags to outputPath.
            73 | func buildHelper(outputPath, ldflags string) error {
            74 | 	args := []string{"build", "-o", outputPath}
            75 | 	if ldflags != "" {
            76 | 		args = append(args, "-ldflags", ldflags)
            77 | 	}
            78 | 	args = append(args, "./testdata/testbin")
            79 | 	cmd := exec.Command("go", args...)
            80 | 	out, err := cmd.CombinedOutput()
            81 | 	if err != nil {
            82 | 		return fmt.Errorf("%s: %s", err, out)
            83 | 	}
            84 | 	return nil
            85 | }
            87 | // ---------------------------------------------------------------------------
            88 | // R1: RunDiffTests passes when both binaries produce identical output
            89 | //     (prd001-testutils R2)
            90 | // ---------------------------------------------------------------------------
            92 | func TestRunDiffTests_MatchingOutput(t *testing.T) {
            93 | 	tests := []DiffTest{
            94 | 		{Name: "empty-output"},
            95 | 		{Name: "stdout-only", Args: []string{"--stdout", "hello\n"}},
            96 | 		{Name: "stderr-only", Args: []string{"--stderr", "warning\n"}},
            97 | 		{Name: "combined", Args: []string{"--stdout", "out\n", "--stderr", "err\n"}},
            98 | 		{Name: "nonzero-exit", Args: []string{"--exit-code", "2"}},
