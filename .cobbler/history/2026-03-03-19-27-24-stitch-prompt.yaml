        - file: pkg/format/color_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for prd003-format R2.1-R2.4: FileTypeColor, Reset, ColorEnabled,
            5 | // SetColorEnabled, ResetColorEnabled.
            7 | package format_test
            9 | import (
            10 | 	"bytes"
            11 | 	"os"
            12 | 	"testing"
            14 | 	"github.com/petar-djukic/go-unix-utils/pkg/format"
            15 | )
            17 | // ANSI escape constants matching GNU ls LS_COLORS defaults (prd003 R2.4).
            18 | const (
            19 | 	ansiBlue       = "\033[34m"   // directory
            20 | 	ansiCyan       = "\033[36m"   // symlink
            21 | 	ansiGreen      = "\033[32m"   // executable
            22 | 	ansiYellowBold = "\033[33;1m" // block device, char device
            23 | 	ansiMagenta    = "\033[35m"   // socket
            24 | 	ansiYellow     = "\033[33m"   // pipe
            25 | 	ansiReset      = "\033[0m"    // regular / reset
            26 | )
            28 | // TestFileTypeColor_AllEightTypes verifies that FileTypeColor returns the
            29 | // correct ANSI escape sequence for each of the eight GNU ls file types.
            30 | // R2.1, R2.4: color lookup for directory, symlink, executable, block device,
            31 | // char device, socket, pipe, and regular file.
            32 | func TestFileTypeColor_AllEightTypes(t *testing.T) {
            33 | 	format.SetColorEnabled(true)
            34 | 	defer format.ResetColorEnabled()
            36 | 	tests := []struct {
            37 | 		name string
            38 | 		mode os.FileMode
            39 | 		want string
            40 | 	}{
            41 | 		{"directory", os.ModeDir, ansiBlue},
            42 | 		{"symlink", os.ModeSymlink, ansiCyan},
            43 | 		{"executable", 0o755, ansiGreen},
            44 | 		{"block_device", os.ModeDevice, ansiYellowBold},
            45 | 		{"char_device", os.ModeDevice | os.ModeCharDevice, ansiYellowBold},
            46 | 		{"socket", os.ModeSocket, ansiMagenta},
            47 | 		{"pipe", os.ModeNamedPipe, ansiYellow},
            48 | 		{"regular", 0o644, ansiReset},
            49 | 	}
            50 | 	for _, tc := range tests {
            51 | 		t.Run(tc.name, func(t *testing.T) {
            52 | 			got := format.FileTypeColor(tc.mode)
            53 | 			if got != tc.want {
            54 | 				t.Errorf("FileTypeColor(%v) = %q, want %q", tc.mode, got, tc.want)
            55 | 			}
            56 | 		})
            57 | 	}
            58 | }
            60 | // TestFileTypeColor_ColorDisabled verifies that FileTypeColor returns empty
            61 | // strings for all file types when color output is disabled.
            62 | // R2.1, R2.6: empty strings when SetColorEnabled(false) is active.
            63 | func TestFileTypeColor_ColorDisabled(t *testing.T) {
            64 | 	format.SetColorEnabled(false)
            65 | 	defer format.ResetColorEnabled()
            67 | 	modes := []struct {
            68 | 		name string
            69 | 		mode os.FileMode
            70 | 	}{
            71 | 		{"directory", os.ModeDir},
            72 | 		{"symlink", os.ModeSymlink},
            73 | 		{"executable", 0o755},
            74 | 		{"block_device", os.ModeDevice},
            75 | 		{"char_device", os.ModeDevice | os.ModeCharDevice},
            76 | 		{"socket", os.ModeSocket},
            77 | 		{"pipe", os.ModeNamedPipe},
            78 | 		{"regular", 0o644},
            79 | 	}
            80 | 	for _, tc := range modes {
            81 | 		t.Run(tc.name, func(t *testing.T) {
            82 | 			got := format.FileTypeColor(tc.mode)
            83 | 			if got != "" {
            84 | 				t.Errorf("FileTypeColor(%v) with color disabled = %q, want empty string", tc.mode, got)
            85 | 			}
            86 | 		})
            87 | 	}
            88 | }
            90 | // TestReset_ColorEnabled verifies that Reset returns the ANSI reset sequence
            91 | // when color output is enabled.
            92 | // R2.2: reset sequence for terminating color output.
            93 | func TestReset_ColorEnabled(t *testing.T) {
            94 | 	format.SetColorEnabled(true)
            95 | 	defer format.ResetColorEnabled()
            97 | 	got := format.Reset()
            98 | 	if got != ansiReset {
            99 | 		t.Errorf("Reset() with color enabled = %q, want %q", got, ansiReset)
            100 | 	}
            101 | }
            103 | // TestReset_ColorDisabled verifies that Reset returns an empty string when
            104 | // color output is disabled.
            105 | // R2.2, R2.6: empty string when SetColorEnabled(false) is active.
            106 | func TestReset_ColorDisabled(t *testing.T) {
            107 | 	format.SetColorEnabled(false)
            108 | 	defer format.ResetColorEnabled()
            110 | 	got := format.Reset()
            111 | 	if got != "" {
            112 | 		t.Errorf("Reset() with color disabled = %q, want empty string", got)
            113 | 	}
            114 | }
            116 | // TestColorEnabled_NonFileWriter verifies that ColorEnabled returns false
            117 | // when passed an io.Writer that is not backed by *os.File.
            118 | // R2.3: type assertion to *os.File fails, returns false.
            119 | func TestColorEnabled_NonFileWriter(t *testing.T) {
            120 | 	t.Parallel()
            122 | 	var buf bytes.Buffer
            123 | 	got := format.ColorEnabled(&buf)
            124 | 	if got {
            125 | 		t.Error("ColorEnabled(bytes.Buffer) = true, want false")
            126 | 	}
            127 | }
            129 | // TestColorEnabled_OsFile verifies that ColorEnabled exercises the *os.File
            130 | // TTY detection path. os.Stderr in a test runner is typically not a TTY
            131 | // (piped by the test harness), so we expect false. The important check is
            132 | // that the code path through the ioctl is reached without panic or error.
            133 | // R2.3: automatic TTY detection via TIOCGWINSZ ioctl.
            134 | func TestColorEnabled_OsFile(t *testing.T) {
            135 | 	t.Parallel()
            137 | 	// os.Stderr is an *os.File, so the type assertion succeeds and the
            138 | 	// ioctl path is exercised. In CI/test environments this is typically
            139 | 	// not a TTY, so the result should be false.
            140 | 	got := format.ColorEnabled(os.Stderr)
            141 | 	if got {
            142 | 		t.Error("ColorEnabled(os.Stderr) in test runner = true, want false")
            143 | 	}
            144 | }
            146 | // TestColorEnabled_Pipe verifies that ColorEnabled returns false for a pipe
            147 | // file descriptor (not a terminal).
            148 | // R2.3: pipes are non-terminal descriptors.
            149 | func TestColorEnabled_Pipe(t *testing.T) {
            150 | 	t.Parallel()
            152 | 	r, w, err := os.Pipe()
            153 | 	if err != nil {
            154 | 		t.Fatalf("os.Pipe() failed: %v", err)
            155 | 	}
            156 | 	defer r.Close()
            157 | 	defer w.Close()
            159 | 	if format.ColorEnabled(r) {
            160 | 		t.Error("ColorEnabled(pipe read end) = true, want false")
            161 | 	}
            162 | 	if format.ColorEnabled(w) {
            163 | 		t.Error("ColorEnabled(pipe write end) = true, want false")
            164 | 	}
            165 | }
            167 | // TestSetColorEnabled_Override verifies that SetColorEnabled overrides
            168 | // automatic TTY detection for both true and false values, and that
            169 | // ResetColorEnabled reverts to automatic detection.
            170 | // R2.6, R2.7: process-global override and revert.
            171 | func TestSetColorEnabled_Override(t *testing.T) {
            172 | 	// Force color on — FileTypeColor should return ANSI codes even though
            173 | 	// stdout is not a TTY in the test runner.
            174 | 	format.SetColorEnabled(true)
            175 | 	got := format.FileTypeColor(os.ModeDir)
            176 | 	if got != ansiBlue {
            177 | 		t.Errorf("FileTypeColor(dir) with SetColorEnabled(true) = %q, want %q", got, ansiBlue)
            178 | 	}
            180 | 	// Force color off — FileTypeColor should return empty strings.
            181 | 	format.SetColorEnabled(false)
            182 | 	got = format.FileTypeColor(os.ModeDir)
            183 | 	if got != "" {
            184 | 		t.Errorf("FileTypeColor(dir) with SetColorEnabled(false) = %q, want empty string", got)
            185 | 	}
            187 | 	// Revert to automatic detection.
            188 | 	format.ResetColorEnabled()
            189 | 	// After reset, color depends on TTY status. In a test runner stdout is
            190 | 	// typically a pipe, so FileTypeColor should return empty.
            191 | 	got = format.FileTypeColor(os.ModeDir)
            192 | 	if got != "" {
            193 | 		t.Errorf("FileTypeColor(dir) after ResetColorEnabled = %q, want empty string (non-TTY)", got)
            194 | 	}
            195 | }
            197 | // TestColorConstants_GNUDefaults verifies that the ANSI escape sequences
            198 | // returned by FileTypeColor match the GNU ls LS_COLORS defaults exactly.
            199 | // R2.4: blue=34, cyan=36, green=32, yellow bold=33;1, magenta=35, yellow=33.
            200 | func TestColorConstants_GNUDefaults(t *testing.T) {
            201 | 	format.SetColorEnabled(true)
            202 | 	defer format.ResetColorEnabled()
            204 | 	tests := []struct {
            205 | 		name     string
            206 | 		mode     os.FileMode
            207 | 		wantAnsi string
            208 | 		desc     string
            209 | 	}{
            210 | 		{"directory", os.ModeDir, "\033[34m", "directory must be blue (34)"},
            211 | 		{"symlink", os.ModeSymlink, "\033[36m", "symlink must be cyan (36)"},
            212 | 		{"executable", 0o755, "\033[32m", "executable must be green (32)"},
            213 | 		{"block_device", os.ModeDevice, "\033[33;1m", "block device must be yellow bold (33;1)"},
            214 | 		{"char_device", os.ModeDevice | os.ModeCharDevice, "\033[33;1m", "char device must be yellow bold (33;1)"},
            215 | 		{"socket", os.ModeSocket, "\033[35m", "socket must be magenta (35)"},
            216 | 		{"pipe", os.ModeNamedPipe, "\033[33m", "pipe must be yellow (33)"},
            217 | 		{"regular", 0o644, "\033[0m", "regular must be reset (0)"},
            218 | 	}
            219 | 	for _, tc := range tests {
            220 | 		t.Run(tc.name, func(t *testing.T) {
            221 | 			got := format.FileTypeColor(tc.mode)
            222 | 			if got != tc.wantAnsi {
            223 | 				t.Errorf("%s: FileTypeColor(%v) = %q, want %q", tc.desc, tc.mode, got, tc.wantAnsi)
            224 | 			}
            225 | 		})
            226 | 	}
            227 | }
        - file: pkg/format/column_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for prd003-format R1.1-R1.4: Columns, PadRight, PadLeft, displayWidth.
            6 | package format_test
            8 | import (
            9 | 	"reflect"
            10 | 	"testing"
            12 | 	"github.com/petar-djukic/go-unix-utils/pkg/format"
            13 | )
            15 | // TestColumns_EmptySlice verifies that Columns returns nil for an empty input.
            16 | // R1.1: zero entries produce no grid.
            17 | func TestColumns_EmptySlice(t *testing.T) {
            18 | 	t.Parallel()
            20 | 	got := format.Columns(nil, 80)
            21 | 	if got != nil {
            22 | 		t.Errorf("Columns(nil, 80) = %v, want nil", got)
            23 | 	}
            25 | 	got = format.Columns([]string{}, 80)
            26 | 	if got != nil {
            27 | 		t.Errorf("Columns([]string{}, 80) = %v, want nil", got)
            28 | 	}
            29 | }
            31 | // TestColumns_SingleEntry verifies that a single entry produces a one-row,
            32 | // one-column grid regardless of terminal width.
            33 | // R1.1: single entry always fits in one column.
            34 | func TestColumns_SingleEntry(t *testing.T) {
            35 | 	t.Parallel()
            37 | 	got := format.Columns([]string{"hello"}, 80)
            38 | 	want := [][]string{{"hello"}}
            39 | 	if !reflect.DeepEqual(got, want) {
            40 | 		t.Errorf("Columns([hello], 80) = %v, want %v", got, want)
            41 | 	}
            42 | }
            44 | // TestColumns_RowMajorOrder verifies that entries are placed left-to-right,
            45 | // top-to-bottom (row-major order).
            46 | // R1.1, R1.4: row-major distribution across columns.
            47 | func TestColumns_RowMajorOrder(t *testing.T) {
            48 | 	t.Parallel()
            50 | 	// Four short entries with a wide terminal should fit in one row.
            51 | 	entries := []string{"a", "b", "c", "d"}
            52 | 	// Each entry is 1 char wide. 4 columns: 1 + 2 + 1 + 2 + 1 + 2 + 1 = 10
            53 | 	// (3 gaps of 2 spaces between 4 columns = 6, plus 4 chars = 10).
            54 | 	got := format.Columns(entries, 80)
            55 | 	// Should be a single row with all entries.
            56 | 	want := [][]string{{"a", "b", "c", "d"}}
            57 | 	if !reflect.DeepEqual(got, want) {
            58 | 		t.Errorf("Columns([a,b,c,d], 80) = %v, want %v", got, want)
            59 | 	}
            60 | }
            62 | // TestColumns_MultipleRows verifies distribution across multiple rows when
            63 | // entries do not all fit on one row.
            64 | // R1.1, R1.4: maximise columns, row-major layout.
            65 | func TestColumns_MultipleRows(t *testing.T) {
            66 | 	t.Parallel()
            68 | 	// 6 entries, each 8 chars wide. With columnGap=2, each column costs 10
            69 | 	// chars (except the last which costs 8). 3 columns: 10+10+8=28, fits in 30.
            70 | 	// 4 columns: 10+10+10+8=38, does not fit in 30.
            71 | 	entries := []string{"aaaaaaaa", "bbbbbbbb", "cccccccc", "dddddddd", "eeeeeeee", "ffffffff"}
            72 | 	got := format.Columns(entries, 30)
            73 | 	// 3 columns, 2 rows, row-major:
            74 | 	// Row 0: entries[0], entries[1], entries[2]
            75 | 	// Row 1: entries[3], entries[4], entries[5]
            76 | 	want := [][]string{
            77 | 		{"aaaaaaaa", "bbbbbbbb", "cccccccc"},
            78 | 		{"dddddddd", "eeeeeeee", "ffffffff"},
            79 | 	}
            80 | 	if !reflect.DeepEqual(got, want) {
            81 | 		t.Errorf("Columns(6 entries, 30) = %v, want %v", got, want)
            82 | 	}
            83 | }
            85 | // TestColumns_SingleColumnFallback verifies that entries too wide for two
            86 | // columns fall back to single-column layout.
            87 | // R1.1: single-column fallback when no multi-column layout fits.
            88 | func TestColumns_SingleColumnFallback(t *testing.T) {
            89 | 	t.Parallel()
            91 | 	// Two entries each 10 chars wide. Two columns need 10+2+10=22 chars.
            92 | 	// With termWidth=20, two columns do not fit; single-column fallback.
            93 | 	entries := []string{"aaaaaaaaaa", "bbbbbbbbbb"}
            94 | 	got := format.Columns(entries, 20)
            95 | 	want := [][]string{
            96 | 		{"aaaaaaaaaa"},
            97 | 		{"bbbbbbbbbb"},
            98 | 	}
            99 | 	if !reflect.DeepEqual(got, want) {
            100 | 		t.Errorf("Columns(2 wide entries, 20) = %v, want %v", got, want)
            101 | 	}
            102 | }
            104 | // TestColumns_ExactFit verifies that entries exactly filling the terminal
            105 | // width use the maximum number of columns.
            106 | // R1.1, R1.4: per-column width with exact fit.
            107 | func TestColumns_ExactFit(t *testing.T) {
            108 | 	t.Parallel()
            110 | 	// 3 entries: widths 5, 5, 5. Three columns: 5+2+5+2+5=19.
            111 | 	entries := []string{"abcde", "fghij", "klmno"}
            112 | 	got := format.Columns(entries, 19)
            113 | 	// Should fit in one row of 3 columns.
            114 | 	want := [][]string{{"abcde", "fghij", "klmno"}}
            115 | 	if !reflect.DeepEqual(got, want) {
            116 | 		t.Errorf("Columns(3x5-char, 19) = %v, want %v", got, want)
            117 | 	}
            118 | }
            120 | // TestColumns_PerColumnWidth verifies that column widths are determined by
            121 | // the longest entry in each column, not the global maximum.
            122 | // R1.4: per-column max display widths.
            123 | func TestColumns_PerColumnWidth(t *testing.T) {
            124 | 	t.Parallel()
            126 | 	// 4 entries with varying widths. Row-major with 2 columns:
            127 | 	// Col 0: max(len("ab"), len("abcdef")) = 6
            128 | 	// Col 1: max(len("cde"), len("gh")) = 3
            129 | 	// Total: 6 + 2 + 3 = 11, fits in termWidth=11.
            130 | 	// With 4 columns: 2+2+3+2+6+2+2 = too wide — try 3 columns too.
            131 | 	// 3 columns (2 rows): Row0=[ab, cde, abcdef], Row1=[gh]
            132 | 	// Col0: max(2,2)=2, Col1: max(3,0)=3, Col2: max(6,0)=6 => 2+2+3+2+6=15 > 11.
            133 | 	// 2 columns: Col0: max(2,6)=6, Col1: max(3,2)=3 => 6+2+3=11 fits.
            134 | 	entries := []string{"ab", "cde", "abcdef", "gh"}
            135 | 	got := format.Columns(entries, 11)
            136 | 	want := [][]string{
            137 | 		{"ab", "cde"},
            138 | 		{"abcdef", "gh"},
            139 | 	}
            140 | 	if !reflect.DeepEqual(got, want) {
            141 | 		t.Errorf("Columns(varying widths, 11) = %v, want %v", got, want)
            142 | 	}
            143 | }
            145 | // TestColumns_UnevenLastRow verifies that the last row may have fewer entries
            146 | // than other rows when entries don't divide evenly by column count.
            147 | // R1.1: incomplete last row.
            148 | func TestColumns_UnevenLastRow(t *testing.T) {
            149 | 	t.Parallel()
