            153 | 	// Row 0: entries[0..3] = [aaa, bbb, ccc, ddd]
            154 | 	// Row 1: entries[4]    = [eee]
            155 | 	entries := []string{"aaa", "bbb", "ccc", "ddd", "eee"}
            156 | 	got := format.Columns(entries, 18)
            157 | 	want := [][]string{
            158 | 		{"aaa", "bbb", "ccc", "ddd"},
            159 | 		{"eee"},
            160 | 	}
            161 | 	if !reflect.DeepEqual(got, want) {
            162 | 		t.Errorf("Columns(5x3-char, 18) = %v, want %v", got, want)
            163 | 	}
            164 | }
