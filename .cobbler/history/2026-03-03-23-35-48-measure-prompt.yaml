            22 | )
            24 | // DefaultTimeout is the maximum duration for a single binary invocation.
            25 | // R2.3: configurable timeout with 10-second default.
            26 | var DefaultTimeout = 10 * time.Second
            28 | // timestampPlaceholder is the fixed string that replaces timestamps during normalization.
            29 | const timestampPlaceholder = "<TIMESTAMP>"
            31 | // maxStdinReport is the maximum number of stdin bytes shown in failure reports.
            32 | // R3.5: stdin content truncated to 256 bytes if longer.
            33 | const maxStdinReport = 256
            35 | // NormalizeFunc transforms raw output bytes before comparison.
            36 | // R1.4: named type alias for normalization functions.
            37 | type NormalizeFunc = func([]byte) []byte
            39 | // DiffTest defines a single differential test case with fields for input
            40 | // arguments, stdin, environment, expected exit code, and expected output.
            41 | // R1.1: all fields per prd001-testutils specification.
            42 | type DiffTest struct {
            43 | 	// Name is the subtest name used with t.Run; required.
            44 | 	Name string
            45 | 	// Args are command-line arguments passed to both binaries.
            46 | 	Args []string
            47 | 	// Stdin provides input data. nil means both binaries receive EOF immediately.
            48 | 	// An empty non-nil slice ([]byte{}) produces no bytes but represents an open
            49 | 	// stdin that is immediately closed (R1.2).
            50 | 	Stdin []byte
            51 | 	// Env specifies environment variable overrides as KEY=VALUE pairs. nil means
            52 | 	// use defaults only (LC_ALL=C). Non-nil entries are merged into the inherited
            53 | 	// environment: matching keys are overridden, new keys are added (R1.3).
            54 | 	Env []string
            55 | 	// WorkDir sets the working directory for both binaries. Empty means a per-test
            56 | 	// temporary directory created via t.TempDir() (R2.5).
            57 | 	WorkDir string
