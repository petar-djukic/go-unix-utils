        - file: pkg/format/column.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"strings"
            8 | 	"unicode/utf8"
            9 | )
            11 | // columnGap is the number of spaces inserted between adjacent columns.
            12 | const columnGap = 2
            14 | // Columns distributes entries into the maximum number of columns that fit
            15 | // within termWidth characters. Entries are placed in row-major order (left to
            16 | // right, top to bottom). Each column width is determined by the longest entry
            17 | // in that column, not the global maximum.
            18 | // R1.1, R1.4: multi-column layout matching ls column-layout behavior.
            19 | func Columns(entries []string, termWidth int) [][]string {
            20 | 	n := len(entries)
            21 | 	if n == 0 {
            22 | 		return nil
            23 | 	}
            25 | 	// Try from n columns down to 2; single-column is the fallback.
            26 | 	for numCols := n; numCols > 1; numCols-- {
            27 | 		numRows := (n + numCols - 1) / numCols
            29 | 		// R1.4: compute per-column max display widths using row-major distribution.
            30 | 		colWidths := make([]int, numCols)
            31 | 		for i, entry := range entries {
            32 | 			col := i % numCols
            33 | 			w := displayWidth(entry)
            34 | 			if w > colWidths[col] {
            35 | 				colWidths[col] = w
            36 | 			}
            37 | 		}
            39 | 		// Total width including gaps between columns.
            40 | 		total := 0
            41 | 		for c, cw := range colWidths {
            42 | 			total += cw
            43 | 			if c < numCols-1 {
            44 | 				total += columnGap
            45 | 			}
            46 | 		}
            48 | 		if total <= termWidth {
            49 | 			grid := make([][]string, numRows)
            50 | 			for r := 0; r < numRows; r++ {
            51 | 				row := make([]string, 0, numCols)
            52 | 				for c := 0; c < numCols; c++ {
            53 | 					idx := r*numCols + c
            54 | 					if idx < n {
            55 | 						row = append(row, entries[idx])
            56 | 					}
            57 | 				}
            58 | 				grid[r] = row
            59 | 			}
            60 | 			return grid
            61 | 		}
            62 | 	}
            64 | 	// Single-column fallback: one entry per row.
            65 | 	grid := make([][]string, n)
            66 | 	for i, e := range entries {
            67 | 		grid[i] = []string{e}
            68 | 	}
            69 | 	return grid
            70 | }
            72 | // PadRight returns s padded with trailing spaces to the specified display width.
            73 | // If s is already at least width runes wide, it is returned unchanged.
            74 | // R1.2: left-aligned field padding within a fixed-width column.
            75 | func PadRight(s string, width int) string {
            76 | 	dw := displayWidth(s)
            77 | 	if dw >= width {
            78 | 		return s
            79 | 	}
            80 | 	return s + strings.Repeat(" ", width-dw)
            81 | }
            83 | // PadLeft returns s padded with leading spaces to the specified display width.
            84 | // If s is already at least width runes wide, it is returned unchanged.
            85 | // R1.2: right-aligned field padding within a fixed-width column.
            86 | func PadLeft(s string, width int) string {
            87 | 	dw := displayWidth(s)
            88 | 	if dw >= width {
            89 | 		return s
            90 | 	}
            91 | 	return strings.Repeat(" ", width-dw) + s
            92 | }
            94 | // displayWidth returns the display width of s in terminal columns, computed as
            95 | // the rune count. East-Asian full-width character handling is deferred per
            96 | // prd003-format; rune count is sufficient for ASCII-dominant utility output.
            97 | // R1.3: display width via rune count, not byte count.
            98 | func displayWidth(s string) int {
            99 | 	return utf8.RuneCountInString(s)
            100 | }
