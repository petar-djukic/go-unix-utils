          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the ls utility for listing directory contents.
            5 | //
            6 | // Implements prd008-ls (R1.1, R1.2, R1.3, R1.4, R3.1, R3.2, R4.1, R4.2, R4.3, R4.4, R6.1, R6.2, R7.1).
            7 | // This implementation provides multi-column output when stdout is a terminal,
            8 | // one-per-line output when piped, -1 and -C flag support, alphabetical
            9 | // sorting under LC_ALL=C, hidden-file filtering (-a, -A), multi-argument
            10 | // headers, and non-directory file argument handling.
            11 | package main
            13 | import (
            14 | 	"bufio"
            15 | 	"errors"
            16 | 	"flag"
            17 | 	"fmt"
            18 | 	"os"
            19 | 	"os/signal"
            20 | 	"sort"
            21 | 	"syscall"
            22 | 	"unicode/utf8"
            24 | 	"github.com/petar-djukic/go-unix-utils/pkg/format"
            25 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            26 | )
            28 | // defaultTermWidth is the fallback terminal width used when -C is given but
            29 | // TerminalWidth returns an error (stdout is not a terminal).
            30 | const defaultTermWidth = 80
            32 | // columnGap is the number of spaces between adjacent columns, matching the
            33 | // gap used by pkg/format.Columns when computing layout.
            34 | const columnGap = 2
            36 | // options holds the parsed command-line flags for ls.
            37 | type options struct {
            38 | 	showAll       bool // -a: show all entries including . and ..
            39 | 	showAlmostAll bool // -A: show entries starting with . except . and ..
            40 | 	singleColumn  bool // -1: force single-column output
            41 | 	forceColumns  bool // -C: force multi-column output
            42 | }
            44 | // showHidden returns true when hidden entries should be included.
            45 | // R3.4: when both -a and -A are given, the last one on the command line
            46 | // takes precedence. Since Go's flag package uses last-wins semantics for
            47 | // repeated flags, the values here reflect the final state.
            48 | // However, with separate bool flags, both may be true if both are given.
            49 | // We resolve: -a takes precedence over -A when both are set, matching the
            50 | // behavior where -a is the broader filter.
            51 | func (o *options) showHidden() bool {
            52 | 	return o.showAll || o.showAlmostAll
            53 | }
            55 | func (o *options) includeDotAndDotDot() bool {
            56 | 	return o.showAll
            57 | }
            59 | // lsEntry pairs an entry name with its file type mode for color rendering.
            60 | // D2: avoids a separate stat call at render time by capturing the mode during collection.
            61 | type lsEntry struct {
            62 | 	Name string
            63 | 	Mode os.FileMode
            64 | }
            66 | // reportError writes an ls-style error message to stderr.
            67 | // R6.2: per-path error messages to stderr.
            68 | func reportError(path string, err error) {
            69 | 	var pathErr *os.PathError
            70 | 	if errors.As(err, &pathErr) {
            71 | 		fmt.Fprintf(os.Stderr, "ls: %s: %v\n", path, pathErr.Err)
            72 | 	} else {
            73 | 		fmt.Fprintf(os.Stderr, "ls: %s: %v\n", path, err)
            74 | 	}
            75 | }
            77 | // collectEntries reads directory entries, applies filtering and sorting,
            78 | // and returns the sorted lsEntry slice with file type modes.
            79 | // R1.3: entries sorted in C locale byte order.
            80 | // R1.4: entries starting with "." excluded unless -a or -A is given.
            81 | // D2: captures os.DirEntry.Type() during collection for color rendering.
            82 | func collectEntries(dirPath string, opts *options) ([]lsEntry, error) {
            83 | 	entries, err := os.ReadDir(dirPath)
            84 | 	if err != nil {
            85 | 		return nil, err
            86 | 	}
            88 | 	result := make([]lsEntry, 0, len(entries))
            89 | 	for _, e := range entries {
            90 | 		name := e.Name()
            91 | 		if !opts.showHidden() && len(name) > 0 && name[0] == '.' {
            92 | 			continue
            93 | 		}
            94 | 		if opts.showAlmostAll && !opts.showAll {
            95 | 			// -A: include dotfiles but exclude . and ..
            96 | 			if name == "." || name == ".." {
            97 | 				continue
            98 | 			}
            99 | 		}
            100 | 		result = append(result, lsEntry{Name: name, Mode: e.Type()})
            101 | 	}
            103 | 	// R3.1: -a includes . and .. in the listing.
            104 | 	if opts.includeDotAndDotDot() {
            105 | 		result = append(result, lsEntry{Name: ".", Mode: os.ModeDir})
            106 | 		result = append(result, lsEntry{Name: "..", Mode: os.ModeDir})
            107 | 	}
            109 | 	sort.Slice(result, func(i, j int) bool {
            110 | 		return result[i].Name < result[j].Name
            111 | 	})
