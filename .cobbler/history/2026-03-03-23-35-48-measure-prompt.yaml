            278 | 		out.Close()
            279 | 		return fmt.Errorf("copying to %s: %w", dst, err)
            280 | 	}
            281 | 	if err := out.Close(); err != nil {
            282 | 		return fmt.Errorf("closing %s: %w", dst, err)
