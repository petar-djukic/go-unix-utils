            220 | 		multiColumn = false
            221 | 	} else if opts.forceColumns {
            222 | 		multiColumn = true
            223 | 		if w, err := sys.TerminalWidth(int(os.Stdout.Fd())); err == nil {
            224 | 			termWidth = w
            225 | 		}
            226 | 	} else {
            227 | 		// R1.1/R1.2: multi-column when stdout is a terminal, single-column otherwise.
            228 | 		if w, err := sys.TerminalWidth(int(os.Stdout.Fd())); err == nil {
            229 | 			multiColumn = true
            230 | 			termWidth = w
            231 | 		}
            232 | 	}
