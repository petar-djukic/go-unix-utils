          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Differential tests for cat core I/O, error handling, line numbering,
            5 | // squeeze, end markers, cross-boundary squeeze, non-printing display,
            6 | // and flag aliases.
            7 | //
            8 | // Implements prd006-cat R1.1, R1.2, R2.1, R2.3, R3.1, R3.2, R4.1, R4.2,
            9 | // R4.3, R4.4, R4.5, R4.6, R4.7, R4.8, R5.2, R5.3.
            10 | package main
            12 | import (
            13 | 	"bytes"
            14 | 	"fmt"
            15 | 	"os"
            16 | 	"os/exec"
            17 | 	"path/filepath"
            18 | 	"testing"
            20 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            21 | )
            23 | // goBinary is the path to the compiled Go cat binary. Set by TestMain.
            24 | var goBinary string
            26 | // refBinary is the path to the GNU gcat reference binary. Set by TestMain.
            27 | var refBinary string
            29 | // TestMain builds the Go cat binary and locates the gcat reference binary.
            30 | // D2: skip all tests if gcat is not on PATH.
            31 | // D3: build Go cat binary into a temporary directory.
            32 | func TestMain(m *testing.M) {
            33 | 	ref, err := exec.LookPath("gcat")
            34 | 	if err != nil {
            35 | 		fmt.Fprintln(os.Stderr, "gcat not found on PATH; skipping cat differential tests")
            36 | 		os.Exit(0)
            37 | 	}
            38 | 	refBinary = ref
            40 | 	binDir, err := os.MkdirTemp("", "cat-test-*")
            41 | 	if err != nil {
            42 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            43 | 		os.Exit(1)
            44 | 	}
            46 | 	goBinary = filepath.Join(binDir, "cat")
            47 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            48 | 	if out, err := cmd.CombinedOutput(); err != nil {
            49 | 		fmt.Fprintf(os.Stderr, "building Go cat binary: %v\n%s", err, out)
            50 | 		os.RemoveAll(binDir) // best-effort cleanup
            51 | 		os.Exit(1)
            52 | 	}
            54 | 	code := m.Run()
            55 | 	os.RemoveAll(binDir) // best-effort cleanup
            56 | 	os.Exit(code)
            57 | }
            59 | // writeTestFile creates a file with the given content in dir.
            60 | func writeTestFile(t *testing.T, dir, name, content string) {
            61 | 	t.Helper()
            62 | 	if err := os.WriteFile(filepath.Join(dir, name), []byte(content), 0o644); err != nil {
            63 | 		t.Fatalf("writing test file %s: %v", name, err)
            64 | 	}
            65 | }
            67 | // normalizeProgramName replaces "gcat: " with "cat: " in output so stderr
            68 | // from the GNU reference binary and the Go binary can be compared.
            69 | func normalizeProgramName(data []byte) []byte {
            70 | 	return bytes.ReplaceAll(data, []byte("gcat: "), []byte("cat: "))
            71 | }
