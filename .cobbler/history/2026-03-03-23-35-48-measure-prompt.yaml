            106 | 						return nil, nil, serr
            107 | 					}
            108 | 					spill = sf
            109 | 					if _, werr := spill.Write(buf); werr != nil {
            110 | 						return nil, spill, fmt.Errorf("writing to temp file: %w", werr)
            111 | 					}
            112 | 					buf = nil
            113 | 				}
            114 | 			}
            115 | 		}
            116 | 		if err != nil {
            117 | 			if err == io.EOF {
