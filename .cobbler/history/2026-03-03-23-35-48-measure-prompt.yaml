            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the false utility that exits with code 1 unconditionally.
            5 | //
            6 | // Implements prd013-false (R1, R2, R3, R4).
            7 | package main
            9 | import (
            10 | 	"fmt"
            11 | 	"os"
            12 | 	"os/signal"
            13 | 	"syscall"
            14 | )
            16 | // version is set at build time via -ldflags "-X main.version=<tag>".
            17 | // R2.2: defaults to "dev" when the linker variable is not set.
            18 | var version = "dev"
            20 | func main() {
            21 | 	// R3.1: handle SIGPIPE by exiting cleanly with code 0.
            22 | 	sigpipe := make(chan os.Signal, 1)
            23 | 	signal.Notify(sigpipe, syscall.SIGPIPE)
            24 | 	go func() {
            25 | 		<-sigpipe
            26 | 		os.Exit(0)
            27 | 	}()
            29 | 	// R2: check for --help and --version flags.
            30 | 	// R4.2, R4.3: --help and --version override the default exit code to 0.
            31 | 	for _, arg := range os.Args[1:] {
            32 | 		switch arg {
            33 | 		case "--help":
            34 | 			// R2.1: print usage summary to stdout and exit 0.
            35 | 			fmt.Fprintln(os.Stdout, "Usage: false [ignored command line arguments]")
            36 | 			fmt.Fprintln(os.Stdout, "  or:  false OPTION")
            37 | 			fmt.Fprintln(os.Stdout, "Exit with a status code indicating failure.")
            38 | 			fmt.Fprintln(os.Stdout)
            39 | 			fmt.Fprintln(os.Stdout, "      --help     display this help and exit")
            40 | 			fmt.Fprintln(os.Stdout, "      --version  output version information and exit")
            41 | 			os.Exit(0)
            42 | 		case "--version":
            43 | 			// R2.2: print version string to stdout and exit 0.
            44 | 			fmt.Fprintln(os.Stdout, version)
            45 | 			os.Exit(0)
            46 | 		}
            47 | 	}
            49 | 	// R1.1, R1.2, R1.3: exit 1 with no output.
            50 | 	// R1.5, R4.1: non-flag arguments are silently ignored; exit is always 1.
            51 | 	os.Exit(1)
            52 | }
