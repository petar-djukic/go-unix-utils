            86 | // soak reads all of stdin into memory, spilling to a temp file if the buffer
            87 | // exceeds spillThreshold. R1.1, R1.2, R1.3, R1.4.
            88 | func soak() ([]byte, *os.File, error) {
            89 | 	buf := make([]byte, 0, initialBufferSize)
            90 | 	chunk := make([]byte, initialBufferSize)
