            198 | 	colorFlag := flag.String("color", "auto", "colorize output: auto, always, never")
            199 | 	flag.Parse()
            201 | 	// R4.1, R4.2, R4.3: configure color mode based on --color flag.
            202 | 	switch *colorFlag {
            203 | 	case "always":
            204 | 		format.SetColorEnabled(true)
            205 | 	case "never":
            206 | 		format.SetColorEnabled(false)
            207 | 	case "auto":
            208 | 		// R4.2: pkg/format detects TTY automatically via colorActive.
            209 | 	default:
