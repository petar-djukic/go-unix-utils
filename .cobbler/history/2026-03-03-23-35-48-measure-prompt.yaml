            241 | 	exitCode := 0
            243 | 	// Separate file arguments from directory arguments, preserving order.
            244 | 	// R2: non-directory files print their name as a single line without a header.
            245 | 	// R5: file arguments receive color based on os.Lstat mode.
            246 | 	var fileArgs []lsEntry
            247 | 	var dirArgs []string
            249 | 	for _, arg := range args {
            250 | 		info, err := os.Lstat(arg)
            251 | 		if err != nil {
            252 | 			reportError(arg, err)
            253 | 			exitCode = 1
            254 | 			continue
            255 | 		}
            256 | 		if info.IsDir() {
            257 | 			dirArgs = append(dirArgs, arg)
            258 | 		} else {
            259 | 			fileArgs = append(fileArgs, lsEntry{Name: arg, Mode: info.Mode()})
            260 | 		}
            261 | 	}
            263 | 	needSeparator := false
