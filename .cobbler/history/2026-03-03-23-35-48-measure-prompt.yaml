        - file: cmd/wc/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the wc utility for counting lines, words, and bytes.
            5 | //
            6 | // Implements prd005-wc (R1.1, R1.2, R1.3, R1.4).
            7 | package main
            9 | import (
            10 | 	"bufio"
            11 | 	"errors"
            12 | 	"flag"
            13 | 	"fmt"
            14 | 	"io"
            15 | 	"os"
            16 | 	"os/signal"
            17 | 	"syscall"
            18 | )
            20 | // options holds the parsed command-line flags for wc.
            21 | type options struct {
            22 | 	lines bool
            23 | 	words bool
            24 | 	bytes bool
            25 | }
            27 | // counts holds the accumulated counts for a single input.
            28 | type counts struct {
            29 | 	lines int64
            30 | 	words int64
            31 | 	bytes int64
            32 | }
            34 | // reportError writes a wc-style error message to stderr.
            35 | // R6.2: per-file error messages to stderr.
            36 | func reportError(name string, err error) {
            37 | 	var pathErr *os.PathError
            38 | 	if errors.As(err, &pathErr) {
            39 | 		fmt.Fprintf(os.Stderr, "wc: %s: %v\n", pathErr.Path, pathErr.Err)
            40 | 	} else {
            41 | 		fmt.Fprintf(os.Stderr, "wc: %s: %v\n", name, err)
            42 | 	}
            43 | }
            45 | // computeWidth determines the output column width by examining file sizes.
            46 | // Files that cannot be stat'd (including stdin) default to width 7, matching
            47 | // GNU wc behavior.
            48 | func computeWidth(files []string) int {
            49 | 	width := 1
            50 | 	for _, name := range files {
            51 | 		if name == "-" {
            52 | 			if width < 7 {
            53 | 				width = 7
            54 | 			}
            55 | 			continue
            56 | 		}
            57 | 		info, err := os.Stat(name)
            58 | 		if err != nil {
            59 | 			if width < 7 {
            60 | 				width = 7
            61 | 			}
            62 | 			continue
            63 | 		}
            64 | 		w := digitCount(info.Size())
            65 | 		if w > width {
            66 | 			width = w
            67 | 		}
            68 | 	}
            69 | 	return width
            70 | }
            72 | // digitCount returns the number of decimal digits needed to display n.
            73 | func digitCount(n int64) int {
            74 | 	if n <= 0 {
            75 | 		return 1
            76 | 	}
            77 | 	count := 0
            78 | 	for n > 0 {
            79 | 		count++
            80 | 		n /= 10
            81 | 	}
            82 | 	return count
            83 | }
            85 | // countFile processes a single file or stdin and returns its counts.
            86 | // R1.2: "-" means stdin.
            87 | func countFile(name string) (counts, error) {
            88 | 	if name == "-" {
            89 | 		return countInput(os.Stdin)
            90 | 	}
            91 | 	f, err := os.Open(name)
            92 | 	if err != nil {
            93 | 		return counts{}, err
            94 | 	}
            95 | 	defer f.Close()
            96 | 	return countInput(f)
            97 | }
            99 | // countInput reads from r and returns line, word, and byte counts.
            100 | // R1.1: lines are newline characters, words are maximal non-whitespace sequences.
            101 | func countInput(r io.Reader) (counts, error) {
            102 | 	var c counts
            103 | 	buf := make([]byte, 32*1024)
            104 | 	inWord := false
            105 | 	for {
            106 | 		n, err := r.Read(buf)
            107 | 		c.bytes += int64(n)
            108 | 		for _, b := range buf[:n] {
            109 | 			if b == '\n' {
            110 | 				c.lines++
            111 | 			}
            112 | 			if isByteSpace(b) {
            113 | 				inWord = false
            114 | 			} else if !inWord {
            115 | 				c.words++
            116 | 				inWord = true
            117 | 			}
            118 | 		}
            119 | 		if err != nil {
            120 | 			if err == io.EOF {
            121 | 				return c, nil
            122 | 			}
            123 | 			return c, err
            124 | 		}
            125 | 	}
            126 | }
            128 | // isByteSpace reports whether b is an ASCII whitespace character,
            129 | // matching C isspace() under LC_ALL=C.
            130 | func isByteSpace(b byte) bool {
            131 | 	switch b {
            132 | 	case ' ', '\t', '\n', '\v', '\f', '\r':
            133 | 		return true
            134 | 	}
            135 | 	return false
            136 | }
            138 | // printLine writes a single output line with the requested counts.
            139 | // R1.3: counts are right-justified, followed by the filename.
            140 | // R2.6: column order is lines, words, bytes.
            141 | func printLine(w *bufio.Writer, c counts, name string, showName bool, opts *options, width int) {
            142 | 	first := true
            143 | 	writeField := func(val int64) {
            144 | 		if !first {
            145 | 			w.WriteByte(' ')
            146 | 		}
            147 | 		fmt.Fprintf(w, "%*d", width, val)
            148 | 		first = false
            149 | 	}
            151 | 	if opts.lines {
            152 | 		writeField(c.lines)
            153 | 	}
            154 | 	if opts.words {
            155 | 		writeField(c.words)
            156 | 	}
            157 | 	if opts.bytes {
            158 | 		writeField(c.bytes)
            159 | 	}
            161 | 	if showName {
            162 | 		fmt.Fprintf(w, " %s", name)
            163 | 	}
            164 | 	w.WriteByte('\n')
            165 | }
            167 | func main() {
            168 | 	// R5.1: handle SIGPIPE by exiting cleanly.
            169 | 	sigpipe := make(chan os.Signal, 1)
            170 | 	signal.Notify(sigpipe, syscall.SIGPIPE)
            171 | 	go func() {
            172 | 		<-sigpipe
            173 | 		os.Exit(0)
            174 | 	}()
            176 | 	var opts options
            177 | 	flag.BoolVar(&opts.lines, "l", false, "count lines")
            178 | 	flag.BoolVar(&opts.words, "w", false, "count words")
            179 | 	flag.BoolVar(&opts.bytes, "c", false, "count bytes")
            180 | 	flag.Parse()
            182 | 	// R1.1: default mode prints lines, words, and bytes.
            183 | 	if !opts.lines && !opts.words && !opts.bytes {
            184 | 		opts.lines = true
            185 | 		opts.words = true
            186 | 		opts.bytes = true
            187 | 	}
            189 | 	// R1.2: read from stdin when no file arguments are given.
            190 | 	args := flag.Args()
            191 | 	showNames := len(args) > 0
            192 | 	if len(args) == 0 {
            193 | 		args = []string{"-"}
            194 | 	}
            196 | 	// Pre-compute column width from file sizes.
            197 | 	width := computeWidth(args)
            199 | 	out := bufio.NewWriter(os.Stdout)
            200 | 	exitCode := 0
            201 | 	var total counts
            203 | 	for _, name := range args {
            204 | 		c, err := countFile(name)
            205 | 		if err != nil {
            206 | 			reportError(name, err)
            207 | 			exitCode = 1
            208 | 			continue
            209 | 		}
            210 | 		printLine(out, c, name, showNames, &opts, width)
            211 | 		total.lines += c.lines
            212 | 		total.words += c.words
            213 | 		total.bytes += c.bytes
            214 | 	}
            216 | 	// R1.4: print total when more than one file is given.
            217 | 	if len(args) > 1 {
            218 | 		printLine(out, total, "total", true, &opts, width)
            219 | 	}
            221 | 	// R6.3: detect write errors on final flush.
            222 | 	if err := out.Flush(); err != nil {
            223 | 		exitCode = 1
            224 | 	}
            226 | 	os.Exit(exitCode)
            227 | }
