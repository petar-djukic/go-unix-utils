            43 | 	goBinary = filepath.Join(binDir, "wc")
            44 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            45 | 	if out, err := cmd.CombinedOutput(); err != nil {
            46 | 		fmt.Fprintf(os.Stderr, "building Go wc binary: %v\n%s", err, out)
