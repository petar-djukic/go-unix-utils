            266 | 	// R2: file arguments print as single lines without headers.
            267 | 	// R5: file type color applied via format.FileTypeColor.
            268 | 	for _, e := range fileArgs {
            269 | 		colorCode := format.FileTypeColor(e.Mode)
            270 | 		resetCode := format.Reset()
            271 | 		if _, err := fmt.Fprintf(out, "%s%s%s\n", colorCode, e.Name, resetCode); err != nil {
            272 | 			exitCode = 1
            273 | 		}
            274 | 		needSeparator = true
            275 | 	}
            277 | 	// R2: when listing more than one directory, print headers.
            278 | 	// Headers are also printed when there are file arguments mixed with directories.
            279 | 	showHeaders := len(dirArgs) > 1 || (len(fileArgs) > 0 && len(dirArgs) > 0)
            281 | 	for _, dirPath := range dirArgs {
            282 | 		// R2: blank line between groups.
            283 | 		if needSeparator {
            284 | 			fmt.Fprintln(out)
            285 | 		}
            286 | 		needSeparator = true
            288 | 		if showHeaders {
            289 | 			fmt.Fprintf(out, "%s:\n", dirPath)
            290 | 		}
            292 | 		// D3: collect filtered and sorted entries, then render in the
            293 | 		// appropriate output mode.
            294 | 		entries, err := collectEntries(dirPath, &opts)
            295 | 		if err != nil {
            296 | 			reportError(dirPath, err)
            297 | 			exitCode = 1
            298 | 			continue
            299 | 		}
            301 | 		if multiColumn && len(entries) > 0 {
            302 | 			if err := writeMultiColumn(out, entries, termWidth); err != nil {
            303 | 				exitCode = 1
            304 | 			}
            305 | 		} else {
            306 | 			if err := writeSingleColumn(out, entries); err != nil {
            307 | 				exitCode = 1
            308 | 			}
            309 | 		}
            310 | 	}
            312 | 	// R5: detect write errors on final flush.
            313 | 	if err := out.Flush(); err != nil {
            314 | 		exitCode = 1
            315 | 	}
            317 | 	os.Exit(exitCode)
            318 | }
