            117 | // R1.1: multi-column output via terminal width detection.
            118 | // R4: color wrapping applied at render time after layout computation.
            119 | // D3: layout computed from plain names; color codes applied after padding.
            120 | func writeMultiColumn(w *bufio.Writer, entries []lsEntry, termWidth int) error {
