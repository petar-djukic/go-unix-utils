            6 | //
            7 | // Implements prd001-testutils (R1-R5).
            8 | package testutils
            10 | import (
            11 | 	"bytes"
            12 | 	"context"
            13 | 	"errors"
            14 | 	"fmt"
            15 | 	"os"
            16 | 	"os/exec"
            17 | 	"path/filepath"
