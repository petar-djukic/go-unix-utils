            260 | }
            262 | // TimestampNormalizer replaces common strftime-formatted timestamps with a
            263 | // fixed placeholder so that differential tests pass despite wall-clock
            264 | // differences between binary invocations.
            265 | //
            266 | // Recognized patterns:
            267 | //   - "Mon DD HH:MM:SS" (e.g., "Feb 19 12:34:56") — syslog/ts default format
            268 | //   - "YYYY-MM-DD HH:MM:SS" (e.g., "2026-02-19 12:34:56") — ISO-like format
            269 | //
            270 | // Implements: prd001-testutils R4.2
            271 | func TimestampNormalizer(data []byte) []byte {
            272 | 	s := string(data)
            274 | 	// Replace "Mon DD HH:MM:SS" pattern (e.g., "Feb 19 12:34:56").
            275 | 	s = replaceTimestampSyslog(s)
            277 | 	// Replace "YYYY-MM-DD HH:MM:SS" pattern.
            278 | 	s = replaceTimestampISO(s)
            280 | 	return []byte(s)
            281 | }
            283 | // timestampPlaceholder is the fixed string that replaces normalized timestamps.
            284 | const timestampPlaceholder = "<TIMESTAMP>"
            286 | // months lists abbreviated month names for syslog timestamp matching.
            287 | var months = []string{
            288 | 	"Jan", "Feb", "Mar", "Apr", "May", "Jun",
            289 | 	"Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
            290 | }
            292 | // replaceTimestampSyslog replaces "Mon DD HH:MM:SS" patterns.
            293 | func replaceTimestampSyslog(s string) string {
            294 | 	for _, mon := range months {
            295 | 		for {
            296 | 			idx := strings.Index(s, mon+" ")
            297 | 			if idx < 0 {
            298 | 				break
            299 | 			}
            300 | 			// Expect "Mon DD HH:MM:SS" = 3 + 1 + 2 + 1 + 8 = 15 chars.
            301 | 			end := idx + 15
            302 | 			if end > len(s) {
            303 | 				break
            304 | 			}
            305 | 			candidate := s[idx:end]
            306 | 			if isValidSyslogTimestamp(candidate) {
            307 | 				s = s[:idx] + timestampPlaceholder + s[end:]
            308 | 			} else {
            309 | 				// Avoid infinite loop: advance past this occurrence.
            310 | 				break
            311 | 			}
            312 | 		}
            313 | 	}
            314 | 	return s
            315 | }
            317 | // isValidSyslogTimestamp checks if s matches "Mon DD HH:MM:SS" format.
            318 | func isValidSyslogTimestamp(s string) bool {
            319 | 	if len(s) != 15 {
            320 | 		return false
            321 | 	}
            322 | 	// s[0:3] = month abbreviation (already matched by caller).
            323 | 	if s[3] != ' ' {
            324 | 		return false
            325 | 	}
            326 | 	// s[4:6] = day: digit or space + digit.
            327 | 	if !isDigitOrSpace(s[4]) || !isDigit(s[5]) {
            328 | 		return false
            329 | 	}
            330 | 	if s[6] != ' ' {
            331 | 		return false
            332 | 	}
            333 | 	// s[7:15] = "HH:MM:SS"
            334 | 	return isDigit(s[7]) && isDigit(s[8]) && s[9] == ':' &&
            335 | 		isDigit(s[10]) && isDigit(s[11]) && s[12] == ':' &&
            336 | 		isDigit(s[13]) && isDigit(s[14])
            337 | }
            339 | // replaceTimestampISO replaces "YYYY-MM-DD HH:MM:SS" patterns.
            340 | func replaceTimestampISO(s string) string {
            341 | 	for {
            342 | 		idx := findISOTimestamp(s)
            343 | 		if idx < 0 {
            344 | 			break
            345 | 		}
            346 | 		// "YYYY-MM-DD HH:MM:SS" = 19 chars.
            347 | 		end := idx + 19
            348 | 		s = s[:idx] + timestampPlaceholder + s[end:]
            349 | 	}
            350 | 	return s
            351 | }
            353 | // findISOTimestamp returns the index of the first "YYYY-MM-DD HH:MM:SS"
            354 | // pattern in s, or -1 if none found.
            355 | func findISOTimestamp(s string) int {
            356 | 	// Minimum length is 19 chars.
            357 | 	for i := 0; i+19 <= len(s); i++ {
            358 | 		if isDigit(s[i]) && isDigit(s[i+1]) && isDigit(s[i+2]) && isDigit(s[i+3]) &&
            359 | 			s[i+4] == '-' && isDigit(s[i+5]) && isDigit(s[i+6]) &&
            360 | 			s[i+7] == '-' && isDigit(s[i+8]) && isDigit(s[i+9]) &&
            361 | 			s[i+10] == ' ' &&
            362 | 			isDigit(s[i+11]) && isDigit(s[i+12]) && s[i+13] == ':' &&
            363 | 			isDigit(s[i+14]) && isDigit(s[i+15]) && s[i+16] == ':' &&
            364 | 			isDigit(s[i+17]) && isDigit(s[i+18]) {
            365 | 			return i
            366 | 		}
            367 | 	}
            368 | 	return -1
            369 | }
            371 | // isDigit reports whether b is an ASCII digit.
            372 | func isDigit(b byte) bool {
            373 | 	return b >= '0' && b <= '9'
            374 | }
            376 | // isDigitOrSpace reports whether b is an ASCII digit or a space.
            377 | func isDigitOrSpace(b byte) bool {
            378 | 	return isDigit(b) || b == ' '
            379 | }
            381 | // truncateStdin returns a display-safe representation of stdin, truncated to
            382 | // stdinMaxDisplay bytes if longer.
            383 | func truncateStdin(stdin []byte) string {
            384 | 	if stdin == nil {
            385 | 		return "<nil>"
            386 | 	}
            387 | 	if len(stdin) <= stdinMaxDisplay {
            388 | 		return fmt.Sprintf("%q", stdin)
            389 | 	}
            390 | 	return fmt.Sprintf("%q... (%d bytes total)", stdin[:stdinMaxDisplay], len(stdin))
            391 | }
            393 | // checkExpectedFiles verifies that files written by the Go binary match the
            394 | // expected content specified in DiffTest.ExpectedFiles.
            395 | //
            396 | // Implements: prd001-testutils R5.1, R5.2
            397 | func checkExpectedFiles(t *testing.T, tc DiffTest, workDir string) {
            398 | 	t.Helper()
            400 | 	for relPath, expected := range tc.ExpectedFiles {
            401 | 		absPath := filepath.Join(workDir, relPath)
            402 | 		actual, err := os.ReadFile(absPath)
            403 | 		if err != nil {
            404 | 			t.Errorf("expected file %s: %v", relPath, err)
            405 | 			continue
            406 | 		}
            407 | 		if !bytes.Equal(expected, actual) {
            408 | 			t.Errorf("file content divergence for %s\n"+
            409 | 				"expected: %q\n"+
            410 | 				"actual:   %q",
            411 | 				relPath, expected, actual,
            412 | 			)
            413 | 		}
            414 | 	}
            415 | }
