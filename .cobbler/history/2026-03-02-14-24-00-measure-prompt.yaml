            15 | // captureOutput replaces os.Stdout and os.Stderr with pipes, calls fn, and
            16 | // returns whatever fn wrote to each stream.
            17 | func captureOutput(t *testing.T, fn func()) (string, string) {
            18 | 	t.Helper()
            20 | 	outR, outW, err := os.Pipe()
            21 | 	if err != nil {
            22 | 		t.Fatalf("os.Pipe for stdout: %v", err)
            23 | 	}
            24 | 	errR, errW, err := os.Pipe()
            25 | 	if err != nil {
            26 | 		outR.Close()
            27 | 		outW.Close()
            28 | 		t.Fatalf("os.Pipe for stderr: %v", err)
            29 | 	}
            31 | 	origOut := os.Stdout
            32 | 	origErr := os.Stderr
            33 | 	os.Stdout = outW
            34 | 	os.Stderr = errW
            36 | 	fn()
            38 | 	outW.Close()
            39 | 	errW.Close()
            40 | 	os.Stdout = origOut
            41 | 	os.Stderr = origErr
            43 | 	outBytes, err := io.ReadAll(outR)
            44 | 	outR.Close()
            45 | 	if err != nil {
            46 | 		t.Fatalf("reading stdout pipe: %v", err)
            47 | 	}
            48 | 	errBytes, err := io.ReadAll(errR)
            49 | 	errR.Close()
            50 | 	if err != nil {
            51 | 		t.Fatalf("reading stderr pipe: %v", err)
            52 | 	}
            54 | 	return string(outBytes), string(errBytes)
            55 | }
            57 | func TestRun(t *testing.T) {
            58 | 	tests := []struct {
            59 | 		name       string
            60 | 		args       []string
            61 | 		setVersion string
            62 | 		wantCode   int
            63 | 		wantStdout string
            64 | 		wantStderr string
            65 | 	}{
            66 | 		// prd011-magefiles R1.1: no arguments prints version string to stdout, exits 0.
            67 | 		{
            68 | 			name:       "no args prints version string",
            69 | 			args:       []string{},
            70 | 			setVersion: "v1.20260301.1",
            71 | 			wantCode:   0,
            72 | 			wantStdout: "v1.20260301.1\n",
            73 | 		},
            74 | 		// prd011-magefiles R1.2: default version is "dev" when linker variable is not set.
            75 | 		{
            76 | 			name:       "default version is dev",
            77 | 			args:       []string{},
            78 | 			wantCode:   0,
            79 | 			wantStdout: "dev\n",
            80 | 		},
            81 | 		// prd011-magefiles R1.4: --version flag prints version string, exits 0.
            82 | 		{
            83 | 			name:       "--version flag prints version",
            84 | 			args:       []string{"--version"},
            85 | 			wantCode:   0,
            86 | 			wantStdout: "dev\n",
            87 | 		},
            88 | 		// prd011-magefiles R1.4: -v flag prints version string, exits 0.
            89 | 		{
            90 | 			name:       "-v flag prints version",
            91 | 			args:       []string{"-v"},
            92 | 			wantCode:   0,
            93 | 			wantStdout: "dev\n",
            94 | 		},
            95 | 		// prd011-magefiles R1.5: unrecognized argument prints usage to stderr, exits 2.
            96 | 		{
            97 | 			name:       "unrecognized arg prints usage to stderr",
            98 | 			args:       []string{"--bogus"},
            99 | 			wantCode:   2,
            100 | 			wantStderr: "usage: version [--version | -v]\n",
            101 | 		},
            102 | 	}
            104 | 	for _, tt := range tests {
            105 | 		t.Run(tt.name, func(t *testing.T) {
            106 | 			origVersion := version
            107 | 			if tt.setVersion != "" {
