            76 | }
            78 | // binaryResult holds captured output from a single binary invocation.
            79 | type binaryResult struct {
            80 | 	Stdout   []byte
            81 | 	Stderr   []byte
            82 | 	ExitCode int
            83 | }
            85 | // fileDiffTimeout is the maximum duration each binary invocation may run.
            86 | const fileDiffTimeout = 10 * time.Second
            88 | // runFileDiffTests runs each fileDiffTest as a named subtest.
            89 | func runFileDiffTests(t *testing.T, tests []fileDiffTest) {
            90 | 	t.Helper()
            91 | 	for _, tc := range tests {
            92 | 		t.Run(tc.Name, func(t *testing.T) {
            93 | 			t.Helper()
            94 | 			runSingleFileDiffTest(t, tc)
            95 | 		})
            96 | 	}
            97 | }
            99 | // runSingleFileDiffTest executes both binaries in separate directories with
            100 | // identical pre-conditions and compares output files, stderr, and exit code.
            101 | func runSingleFileDiffTest(t *testing.T, tc fileDiffTest) {
            102 | 	t.Helper()
            104 | 	refDir := t.TempDir()
            105 | 	goDir := t.TempDir()
            107 | 	// Set up identical pre-existing files in both directories.
            108 | 	for name, setup := range tc.PreFiles {
            109 | 		for _, dir := range []string{refDir, goDir} {
            110 | 			path := filepath.Join(dir, name)
            111 | 			if err := os.WriteFile(path, setup.Content, setup.Mode); err != nil {
            112 | 				t.Fatalf("writing pre-file %s: %v", name, err)
            113 | 			}
            114 | 		}
            115 | 	}
            117 | 	env := buildTestEnv()
            119 | 	refResult := execBinary(t, refBinaryPath, tc.Args, tc.Stdin, env, refDir)
            120 | 	goResult := execBinary(t, goBinaryPath, tc.Args, tc.Stdin, env, goDir)
            122 | 	failed := false
            124 | 	// Compare exit codes.
            125 | 	if refResult.ExitCode != goResult.ExitCode {
            126 | 		failed = true
            127 | 	}
            129 | 	// Compare stderr.
            130 | 	if !tc.SkipStderrMatch {
            131 | 		if !bytes.Equal(refResult.Stderr, goResult.Stderr) {
            132 | 			failed = true
            133 | 		}
            134 | 	} else {
            135 | 		// For error tests, verify both produce stderr or both produce none.
            136 | 		if (len(refResult.Stderr) > 0) != (len(goResult.Stderr) > 0) {
            137 | 			failed = true
            138 | 		}
            139 | 	}
            141 | 	// Compare output files byte-for-byte.
            142 | 	for _, name := range tc.CheckFiles {
            143 | 		refPath := filepath.Join(refDir, name)
            144 | 		goPath := filepath.Join(goDir, name)
            146 | 		refContent, refErr := os.ReadFile(refPath)
            147 | 		goContent, goErr := os.ReadFile(goPath)
            149 | 		if refErr != nil && goErr != nil {
            150 | 			continue // both failed to create the file — consistent
            151 | 		}
            152 | 		if (refErr != nil) != (goErr != nil) {
            153 | 			failed = true
            154 | 			t.Errorf("file %s existence divergence: ref err=%v, go err=%v", name, refErr, goErr)
            155 | 			continue
            156 | 		}
            157 | 		if !bytes.Equal(refContent, goContent) {
            158 | 			failed = true
            159 | 			t.Errorf("file content divergence for %s\nref: %q\ngo:  %q", name, refContent, goContent)
            160 | 		}
            161 | 	}
            163 | 	if failed {
            164 | 		t.Errorf("divergence detected\n"+
            165 | 			"args:       %v\n"+
            166 | 			"ref stderr: %q\n"+
            167 | 			"go  stderr: %q\n"+
            168 | 			"ref exit:   %d\n"+
            169 | 			"go  exit:   %d",
            170 | 			tc.Args,
            171 | 			refResult.Stderr,
            172 | 			goResult.Stderr,
            173 | 			refResult.ExitCode,
            174 | 			goResult.ExitCode,
            175 | 		)
            176 | 	}
            177 | }
            179 | // buildTestEnv constructs the environment for binary invocations with LC_ALL=C.
            180 | func buildTestEnv() []string {
            181 | 	env := os.Environ()
            182 | 	for i, e := range env {
            183 | 		if strings.HasPrefix(e, "LC_ALL=") {
            184 | 			env[i] = "LC_ALL=C"
            185 | 			return env
            186 | 		}
            187 | 	}
            188 | 	return append(env, "LC_ALL=C")
            189 | }
            191 | // execBinary runs a binary with the given arguments, stdin, environment, and
            192 | // working directory, capturing stdout, stderr, and exit code.
            193 | func execBinary(t *testing.T, binPath string, args []string, stdin []byte, env []string, workDir string) binaryResult {
            194 | 	t.Helper()
            196 | 	ctx, cancel := context.WithTimeout(context.Background(), fileDiffTimeout)
            197 | 	defer cancel()
            199 | 	cmd := exec.CommandContext(ctx, binPath, args...)
            200 | 	cmd.Env = env
            201 | 	cmd.Dir = workDir
            203 | 	if stdin != nil {
            204 | 		cmd.Stdin = bytes.NewReader(stdin)
            205 | 	}
            207 | 	var stdout, stderr bytes.Buffer
            208 | 	cmd.Stdout = &stdout
            209 | 	cmd.Stderr = &stderr
            211 | 	err := cmd.Run()
            213 | 	exitCode := 0
            214 | 	if err != nil {
            215 | 		if ctx.Err() == context.DeadlineExceeded {
            216 | 			t.Fatalf("binary %s timed out after %v", binPath, fileDiffTimeout)
            217 | 		}
            218 | 		if exitErr, ok := err.(*exec.ExitError); ok {
            219 | 			exitCode = exitErr.ExitCode()
            220 | 		} else {
            221 | 			t.Fatalf("executing %s: %v", binPath, err)
            222 | 		}
            223 | 	}
            225 | 	return binaryResult{
            226 | 		Stdout:   stdout.Bytes(),
            227 | 		Stderr:   stderr.Bytes(),
            228 | 		ExitCode: exitCode,
            229 | 	}
            230 | }
