            26 | func TestMain(m *testing.M) {
            27 | 	// Locate GNU reference binary.
            28 | 	ref, err := exec.LookPath("gcat")
            29 | 	if err != nil {
            30 | 		fmt.Println("gcat not found; skipping cat differential tests")
            31 | 		os.Exit(0)
            32 | 	}
            33 | 	refBinaryPath = ref
            35 | 	// Build the Go cat binary to a temp directory.
            36 | 	tmpDir, err := os.MkdirTemp("", "cat-test-*")
            37 | 	if err != nil {
            38 | 		panic("creating temp dir: " + err.Error())
            39 | 	}
            41 | 	goBinaryPath = filepath.Join(tmpDir, "cat")
            42 | 	cmd := exec.Command("go", "build", "-o", goBinaryPath, ".")
            43 | 	cmd.Dir = filepath.Join(".")
            44 | 	if out, err := cmd.CombinedOutput(); err != nil {
            45 | 		os.RemoveAll(tmpDir)
            46 | 		panic(fmt.Sprintf("building cat binary: %v\n%s", err, out))
            47 | 	}
            49 | 	code := m.Run()
            50 | 	os.RemoveAll(tmpDir) // best-effort cleanup
            51 | 	os.Exit(code)
            52 | }
