            4 | // Package main implements the version command, which prints the repository's
            5 | // version tag to stdout and exits 0.
            6 | //
            7 | // The version string is injected at build time via:
            8 | //
            9 | //	go build -ldflags "-X main.version=<tag>" ./cmd/version/
            10 | //
            11 | // When the linker variable is not set (development builds), the binary prints
            12 | // "dev".
            13 | //
            14 | // Implements: prd011-magefiles R1.1, R1.2, R1.4, R1.5
            15 | package main
            17 | import (
            18 | 	"fmt"
            19 | 	"os"
            20 | )
            22 | // version is set at build time via -ldflags "-X main.version=<tag>".
            23 | // When not set, defaults to "dev" for development builds.
            24 | //
            25 | // Implements: prd011-magefiles R1.2, R1.5
            26 | var version = "dev"
            28 | func main() {
            29 | 	os.Exit(run(os.Args[1:]))
            30 | }
            32 | // run parses arguments and prints version information. Returns the exit code.
            33 | func run(args []string) int {
            34 | 	if len(args) == 0 {
            35 | 		fmt.Println(version)
            36 | 		return 0
            37 | 	}
            39 | 	switch args[0] {
            40 | 	case "--version", "-v":
            41 | 		fmt.Println(version)
            42 | 		return 0
            43 | 	default:
            44 | 		fmt.Fprintf(os.Stderr, "usage: version [--version | -v]\n")
            45 | 		return 2
            46 | 	}
            47 | }
