            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Unit tests for the version command.
            5 | //
            6 | // Implements: prd011-magefiles R1.1, R1.2, R1.4, R1.5
            7 | package main
            9 | import (
            10 | 	"io"
            11 | 	"os"
            12 | 	"testing"
