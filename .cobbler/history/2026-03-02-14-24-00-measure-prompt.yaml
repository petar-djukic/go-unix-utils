          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"io"
            8 | 	"os"
            9 | 	"sync"
            11 | 	"golang.org/x/sys/unix"
            12 | )
            14 | // ANSI color escape sequences matching GNU ls LS_COLORS defaults
            15 | // (prd003-format R2.4).
            16 | const (
            17 | 	colorDirectory = "\033[34m"    // blue
            18 | 	colorSymlink   = "\033[36m"    // cyan
            19 | 	colorExec      = "\033[32m"    // green
            20 | 	colorBlockDev  = "\033[33;1m"  // yellow bold
            21 | 	colorCharDev   = "\033[33;1m"  // yellow bold
            22 | 	colorSocket    = "\033[35m"    // magenta
            23 | 	colorPipe      = "\033[33m"    // yellow
            24 | 	colorReset     = "\033[0m"
            25 | )
            27 | // colorOverride tracks whether color output is forced on/off.
            28 | var (
            29 | 	colorMu       sync.Mutex
            30 | 	colorOverride *bool // nil = auto, non-nil = forced value
            31 | )
            33 | // SetColorEnabled overrides automatic TTY detection. When set to true,
            34 | // FileTypeColor and Reset return ANSI sequences regardless of TTY status.
            35 | // When set to false, they return empty strings regardless. The override is
            36 | // process-global.
            37 | //
            38 | // Implements: prd003-format R2.6
            39 | func SetColorEnabled(enabled bool) {
            40 | 	colorMu.Lock()
            41 | 	defer colorMu.Unlock()
            42 | 	colorOverride = &enabled
            43 | }
            45 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting
            46 | // to automatic TTY detection via ColorEnabled.
            47 | //
            48 | // Implements: prd003-format R2.7
            49 | func ResetColorEnabled() {
            50 | 	colorMu.Lock()
            51 | 	defer colorMu.Unlock()
            52 | 	colorOverride = nil
            53 | }
            55 | // isColorEnabled returns the effective color state: forced value if set,
            56 | // otherwise automatic TTY detection on w.
            57 | func isColorEnabled(w io.Writer) bool {
            58 | 	colorMu.Lock()
            59 | 	override := colorOverride
            60 | 	colorMu.Unlock()
            62 | 	if override != nil {
            63 | 		return *override
            64 | 	}
            65 | 	return ColorEnabled(w)
            66 | }
            68 | // ColorEnabled returns true only when w is a TTY. It attempts a type
            69 | // assertion to *os.File; if that fails it returns false. Otherwise it
            70 | // checks whether the file descriptor is a terminal.
            71 | //
            72 | // Implements: prd003-format R2.3
            73 | func ColorEnabled(w io.Writer) bool {
            74 | 	f, ok := w.(*os.File)
            75 | 	if !ok {
            76 | 		return false
            77 | 	}
            78 | 	return isTerminal(f.Fd())
            79 | }
            81 | // isTerminal checks whether fd is a terminal using the TIOCGWINSZ ioctl.
            82 | func isTerminal(fd uintptr) bool {
            83 | 	_, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            84 | 	return err == nil
            85 | }
            87 | // FileTypeColor returns the ANSI escape sequence for the given file mode's
            88 | // type. Returns an empty string for regular files or when color is disabled.
            89 | // The caller should pass os.Stdout (or the active output writer) to enable
            90 | // automatic TTY detection; alternatively, use SetColorEnabled to force
            91 | // color on or off.
            92 | //
            93 | // Implements: prd003-format R2.1, R2.4
            94 | func FileTypeColor(mode os.FileMode) string {
            95 | 	if !isColorEnabled(os.Stdout) {
            96 | 		return ""
            97 | 	}
            98 | 	return fileTypeColorCode(mode)
            99 | }
            101 | // fileTypeColorCode returns the raw ANSI color code for the file type
            102 | // without checking whether color is enabled.
            103 | func fileTypeColorCode(mode os.FileMode) string {
            104 | 	switch {
            105 | 	case mode&os.ModeDir != 0:
            106 | 		return colorDirectory
            107 | 	case mode&os.ModeSymlink != 0:
            108 | 		return colorSymlink
            109 | 	case mode&os.ModeDevice != 0 && mode&os.ModeCharDevice != 0:
            110 | 		return colorCharDev
            111 | 	case mode&os.ModeDevice != 0:
            112 | 		return colorBlockDev
            113 | 	case mode&os.ModeSocket != 0:
            114 | 		return colorSocket
            115 | 	case mode&os.ModeNamedPipe != 0:
            116 | 		return colorPipe
            117 | 	case mode&0o111 != 0:
            118 | 		return colorExec
            119 | 	default:
            120 | 		return ""
            121 | 	}
            122 | }
            124 | // Reset returns the ANSI reset sequence when color is enabled, or an empty
            125 | // string when color is disabled.
            126 | //
            127 | // Implements: prd003-format R2.2
            128 | func Reset() string {
            129 | 	if !isColorEnabled(os.Stdout) {
            130 | 		return ""
            131 | 	}
            132 | 	return colorReset
            133 | }
