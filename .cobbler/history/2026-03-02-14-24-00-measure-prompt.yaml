          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the wc command, which counts lines, words, bytes,
            5 | // characters, and maximum line length from files or stdin.
            6 | //
            7 | // Implements: prd005-wc R1, R2, R3, R4, R5, R6
            8 | package main
            10 | import (
            11 | 	"bufio"
            12 | 	"flag"
            13 | 	"fmt"
            14 | 	"io"
            15 | 	"os"
            16 | 	"strings"
            17 | 	"unicode"
            18 | 	"unicode/utf8"
            19 | )
            21 | func main() {
            22 | 	os.Exit(run(os.Args[1:]))
            23 | }
            25 | // counts holds the counting results for a single input.
            26 | type counts struct {
            27 | 	lines   int64
            28 | 	words   int64
            29 | 	bytes   int64
            30 | 	chars   int64
            31 | 	maxLine int64
            32 | }
            34 | // run parses flags and processes inputs. Returns 0 on success, 1 on error.
            35 | //
            36 | // Implements: prd005-wc R1, R2, R3, R4, R6
            37 | func run(args []string) int {
            38 | 	fs := flag.NewFlagSet("wc", flag.ContinueOnError)
            39 | 	fs.SetOutput(os.Stderr)
            41 | 	var (
            42 | 		flagLines   = fs.Bool("l", false, "print the newline counts")
            43 | 		flagWords   = fs.Bool("w", false, "print the word counts")
            44 | 		flagBytes   = fs.Bool("c", false, "print the byte counts")
            45 | 		flagChars   = fs.Bool("m", false, "print the character counts")
            46 | 		flagMaxLine = fs.Bool("L", false, "print the maximum display width")
            47 | 		totalMode   = fs.String("total", "auto", "when to print a line with total counts")
            48 | 		files0From  = fs.String("files0-from", "", "read NUL-delimited file names from FILE")
            49 | 	)
            51 | 	if err := fs.Parse(args); err != nil {
            52 | 		return 1
            53 | 	}
            55 | 	// Determine which counts to display (R1.1, R2.6).
            56 | 	showLines := *flagLines
            57 | 	showWords := *flagWords
            58 | 	showBytes := *flagBytes
            59 | 	showChars := *flagChars
            60 | 	showMaxLine := *flagMaxLine
            62 | 	// Default: lines, words, bytes (R1.1).
            63 | 	if !showLines && !showWords && !showBytes && !showChars && !showMaxLine {
            64 | 		showLines = true
            65 | 		showWords = true
            66 | 		showBytes = true
            67 | 	}
            69 | 	// -m overrides -c display (R2.3).
            70 | 	if showChars && showBytes {
            71 | 		showBytes = false
            72 | 	}
            74 | 	// Validate --total (R3.3).
            75 | 	switch *totalMode {
            76 | 	case "auto", "always", "only", "never":
            77 | 		// valid
            78 | 	default:
            79 | 		fmt.Fprintf(os.Stderr, "wc: invalid argument '%s' for '--total'\n", *totalMode)
            80 | 		return 1
            81 | 	}
            83 | 	// Collect input files.
            84 | 	files := fs.Args()
            86 | 	// Handle --files0-from (R4.4).
            87 | 	if *files0From != "" {
            88 | 		extra, err := readFiles0From(*files0From)
            89 | 		if err != nil {
            90 | 			fmt.Fprintf(os.Stderr, "wc: %v\n", err)
            91 | 			return 1
            92 | 		}
            93 | 		files = append(files, extra...)
            94 | 	}
            96 | 	// No files: read from stdin (R1.2).
            97 | 	stdinMode := len(files) == 0
            98 | 	if stdinMode {
            99 | 		files = []string{"-"}
            100 | 	}
            102 | 	// Pre-compute field width from file sizes (R3.1).
            103 | 	fieldWidth := computeFieldWidth(files, stdinMode)
            105 | 	// Determine total printing mode (R3.3).
            106 | 	printPerFile := true
            107 | 	printTotal := false
            108 | 	switch *totalMode {
            109 | 	case "auto":
            110 | 		printTotal = len(files) > 1
            111 | 	case "always":
            112 | 		printTotal = true
            113 | 	case "only":
            114 | 		printTotal = true
            115 | 		printPerFile = false
            116 | 	case "never":
            117 | 		// never
            118 | 	}
            120 | 	// Process each input in order.
            121 | 	var total counts
            122 | 	exitCode := 0
            124 | 	for _, file := range files {
            125 | 		var c counts
            126 | 		var err error
            128 | 		if file == "-" {
            129 | 			c, err = countInput(os.Stdin)
            130 | 		} else {
            131 | 			var f *os.File
            132 | 			f, err = os.Open(file)
            133 | 			if err != nil {
            134 | 				printFileError(file, err)
            135 | 				exitCode = 1
            136 | 				continue
            137 | 			}
            138 | 			c, err = countInput(f)
            139 | 			f.Close()
            140 | 		}
            142 | 		if err != nil {
            143 | 			printFileError(file, err)
            144 | 			exitCode = 1
            145 | 		}
            147 | 		// Accumulate totals (R3.2).
            148 | 		total.lines += c.lines
            149 | 		total.words += c.words
            150 | 		total.bytes += c.bytes
            151 | 		total.chars += c.chars
            152 | 		if c.maxLine > total.maxLine {
            153 | 			total.maxLine = c.maxLine
            154 | 		}
            156 | 		// Print per-file result.
            157 | 		if printPerFile {
            158 | 			name := file
            159 | 			if file == "-" && stdinMode {
            160 | 				name = "" // No filename for implicit stdin (R1.3).
            161 | 			}
            162 | 			printLine(c, name, fieldWidth, showLines, showWords, showBytes, showChars, showMaxLine)
            163 | 		}
            164 | 	}
            166 | 	// Print total line (R1.4, R3.2).
            167 | 	if printTotal {
            168 | 		printLine(total, "total", fieldWidth, showLines, showWords, showBytes, showChars, showMaxLine)
            169 | 	}
            171 | 	return exitCode
            172 | }
            174 | // readFiles0From reads NUL-delimited filenames from path. When path is "-",
            175 | // reads from stdin (R4.4).
            176 | func readFiles0From(path string) ([]string, error) {
            177 | 	var r io.Reader
            178 | 	if path == "-" {
            179 | 		r = os.Stdin
            180 | 	} else {
            181 | 		f, err := os.Open(path)
            182 | 		if err != nil {
            183 | 			return nil, err
            184 | 		}
            185 | 		defer f.Close()
            186 | 		r = f
            187 | 	}
            189 | 	data, err := io.ReadAll(r)
            190 | 	if err != nil {
            191 | 		return nil, err
            192 | 	}
            194 | 	var files []string
            195 | 	for _, p := range strings.Split(string(data), "\x00") {
            196 | 		if p != "" {
            197 | 			files = append(files, p)
            198 | 		}
            199 | 	}
            200 | 	return files, nil
            201 | }
            203 | // computeFieldWidth returns the column width for numeric output. For stdin-only
            204 | // input, returns 1 (minimal padding). For file arguments, computes based on the
            205 | // total file size across all named files, matching GNU wc's pre-counting width
            206 | // calculation.
            207 | func computeFieldWidth(files []string, stdinMode bool) int {
            208 | 	if stdinMode {
            209 | 		return 1
            210 | 	}
            212 | 	var totalSize int64
            213 | 	for _, file := range files {
            214 | 		if file == "-" {
            215 | 			continue
            216 | 		}
            217 | 		info, err := os.Stat(file)
            218 | 		if err != nil {
            219 | 			continue
            220 | 		}
            221 | 		totalSize += info.Size()
            222 | 	}
            224 | 	w := numWidth(totalSize)
            225 | 	if w < 1 {
            226 | 		w = 1
            227 | 	}
            228 | 	return w
            229 | }
            231 | // countInput reads all data from r and counts lines, words, bytes, characters,
            232 | // and maximum line length in a single pass (R2.1-R2.5). Handles binary input
            233 | // without panicking (R4.2).
            234 | func countInput(r io.Reader) (counts, error) {
            235 | 	var c counts
            236 | 	br := bufio.NewReader(r)
            238 | 	inWord := false
            239 | 	var lineWidth int64
            241 | 	for {
            242 | 		ru, size, err := br.ReadRune()
            243 | 		if err == io.EOF {
            244 | 			break
            245 | 		}
            246 | 		if err != nil {
            247 | 			return c, err
            248 | 		}
            250 | 		c.bytes += int64(size)
            252 | 		// Invalid UTF-8 byte: counts as one character (R2.4).
            253 | 		if ru == utf8.RuneError && size == 1 {
            254 | 			c.chars++
            255 | 			if !inWord {
            256 | 				inWord = true
            257 | 				c.words++
            258 | 			}
            259 | 			lineWidth++
            260 | 			continue
            261 | 		}
            263 | 		c.chars++
            265 | 		// Word boundary detection (R2.2): unicode.IsSpace determines whitespace.
            266 | 		// Line width tracking for -L (R2.5): tab-expanded display columns.
            267 | 		switch {
            268 | 		case ru == '\n':
            269 | 			c.lines++
            270 | 			if lineWidth > c.maxLine {
            271 | 				c.maxLine = lineWidth
            272 | 			}
            273 | 			lineWidth = 0
            274 | 			inWord = false
            276 | 		case ru == '\t':
            277 | 			// Tab advances to next multiple of 8 (R2.5).
            278 | 			lineWidth = (lineWidth/8 + 1) * 8
            279 | 			inWord = false
            281 | 		case unicode.IsSpace(ru):
            282 | 			inWord = false
            283 | 			lineWidth++
            285 | 		default:
            286 | 			if !inWord {
            287 | 				inWord = true
            288 | 				c.words++
            289 | 			}
            290 | 			lineWidth++
            291 | 		}
            292 | 	}
            294 | 	// Handle final line without trailing newline (R2.5).
            295 | 	if lineWidth > c.maxLine {
            296 | 		c.maxLine = lineWidth
            297 | 	}
            299 | 	return c, nil
            300 | }
            302 | // printLine writes a single output line with counts and optional filename.
            303 | // Count order: lines, words, chars/bytes, max-line-length (R2.6).
            304 | func printLine(c counts, name string, width int, showLines, showWords, showBytes, showChars, showMaxLine bool) {
            305 | 	first := true
            306 | 	field := func(val int64) {
            307 | 		if first {
            308 | 			fmt.Printf("%*d", width, val)
            309 | 			first = false
            310 | 		} else {
            311 | 			fmt.Printf(" %*d", width, val)
            312 | 		}
            313 | 	}
            315 | 	if showLines {
            316 | 		field(c.lines)
            317 | 	}
            318 | 	if showWords {
            319 | 		field(c.words)
            320 | 	}
            321 | 	if showChars {
            322 | 		field(c.chars)
            323 | 	} else if showBytes {
            324 | 		field(c.bytes)
            325 | 	}
            326 | 	if showMaxLine {
            327 | 		field(c.maxLine)
            328 | 	}
            330 | 	if name != "" {
            331 | 		fmt.Printf(" %s", name)
            332 | 	}
            333 | 	fmt.Println()
            334 | }
            336 | // printFileError writes a file access error to stderr (R6.2).
            337 | func printFileError(file string, err error) {
            338 | 	if pe, ok := err.(*os.PathError); ok {
            339 | 		fmt.Fprintf(os.Stderr, "wc: %s: %s\n", pe.Path, pe.Err)
            340 | 	} else {
            341 | 		fmt.Fprintf(os.Stderr, "wc: %s: %v\n", file, err)
            342 | 	}
            343 | }
            345 | // numWidth returns the number of decimal digits needed to represent n.
            346 | func numWidth(n int64) int {
            347 | 	if n <= 0 {
            348 | 		return 1
            349 | 	}
            350 | 	w := 0
            351 | 	for n > 0 {
            352 | 		w++
            353 | 		n /= 10
            354 | 	}
            355 | 	return w
            356 | }
