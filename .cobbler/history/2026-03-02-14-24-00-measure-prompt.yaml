        - file: pkg/format/column.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"strings"
            8 | 	"unicode/utf8"
            9 | )
            11 | // displayWidth returns the display width of a string in rune count.
            12 | // East-asian full-width characters are deferred; rune count is sufficient
            13 | // for ASCII-dominant utility output (prd003-format R1.3).
            14 | func displayWidth(s string) int {
            15 | 	return utf8.RuneCountInString(s)
            16 | }
            18 | // PadRight pads s with trailing spaces to reach the specified display width.
            19 | // If s is already wider than width, it is returned unchanged.
            20 | //
            21 | // Implements: prd003-format R1.2
            22 | func PadRight(s string, width int) string {
            23 | 	w := displayWidth(s)
            24 | 	if w >= width {
            25 | 		return s
            26 | 	}
            27 | 	return s + strings.Repeat(" ", width-w)
            28 | }
            30 | // PadLeft pads s with leading spaces to reach the specified display width.
            31 | // If s is already wider than width, it is returned unchanged.
            32 | //
            33 | // Implements: prd003-format R1.2
            34 | func PadLeft(s string, width int) string {
            35 | 	w := displayWidth(s)
            36 | 	if w >= width {
            37 | 		return s
            38 | 	}
            39 | 	return strings.Repeat(" ", width-w) + s
            40 | }
            42 | // Columns distributes entries into the maximum number of columns that fit
            43 | // within termWidth. Column widths are computed from the longest entry in each
            44 | // column, not the global maximum, matching ls multi-column layout behavior.
            45 | // A minimum gap of 2 spaces separates columns.
            46 | //
            47 | // Returns nil if entries is empty.
            48 | //
            49 | // Implements: prd003-format R1.1, R1.4
            50 | func Columns(entries []string, termWidth int) [][]string {
            51 | 	if len(entries) == 0 {
            52 | 		return nil
            53 | 	}
            55 | 	const columnGap = 2
            57 | 	// Try from maxCols down to 1 to find the maximum that fits.
            58 | 	maxCols := len(entries)
            59 | 	if maxCols < 1 {
            60 | 		maxCols = 1
            61 | 	}
            63 | 	for numCols := maxCols; numCols >= 1; numCols-- {
            64 | 		numRows := (len(entries) + numCols - 1) / numCols
            66 | 		// Compute width of each column (longest entry in that column).
            67 | 		colWidths := make([]int, numCols)
            68 | 		for col := 0; col < numCols; col++ {
            69 | 			for row := 0; row < numRows; row++ {
            70 | 				idx := col*numRows + row
            71 | 				if idx >= len(entries) {
            72 | 					continue
            73 | 				}
            74 | 				w := displayWidth(entries[idx])
            75 | 				if w > colWidths[col] {
            76 | 					colWidths[col] = w
            77 | 				}
            78 | 			}
            79 | 		}
            81 | 		// Check if total width fits within termWidth.
            82 | 		totalWidth := 0
            83 | 		for i, cw := range colWidths {
            84 | 			totalWidth += cw
            85 | 			if i < numCols-1 {
            86 | 				totalWidth += columnGap
            87 | 			}
            88 | 		}
            90 | 		if totalWidth <= termWidth {
            91 | 			// Build the grid.
            92 | 			grid := make([][]string, numRows)
            93 | 			for row := 0; row < numRows; row++ {
            94 | 				var rowEntries []string
            95 | 				for col := 0; col < numCols; col++ {
            96 | 					idx := col*numRows + row
            97 | 					if idx >= len(entries) {
            98 | 						break
            99 | 					}
            100 | 					rowEntries = append(rowEntries, entries[idx])
            101 | 				}
            102 | 				grid[row] = rowEntries
            103 | 			}
            104 | 			return grid
            105 | 		}
            106 | 	}
            108 | 	// Fallback: one entry per row.
            109 | 	grid := make([][]string, len(entries))
            110 | 	for i, e := range entries {
            111 | 		grid[i] = []string{e}
            112 | 	}
            113 | 	return grid
            114 | }
