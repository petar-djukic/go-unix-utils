        - file: cmd/cat/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the cat command, which concatenates and displays files.
            5 | // It reads named files or stdin and writes to stdout, optionally applying line
            6 | // numbering, blank-line squeezing, and non-printing character display.
            7 | //
            8 | // Implements: prd006-cat R1, R2, R3, R4, R5
            9 | package main
            11 | import (
            12 | 	"bufio"
            13 | 	"flag"
            14 | 	"fmt"
            15 | 	"io"
            16 | 	"os"
            17 | 	"os/signal"
            18 | 	"syscall"
            19 | )
            21 | func main() {
            22 | 	os.Exit(run(os.Args[1:]))
            23 | }
            25 | // options holds the parsed flag configuration for a cat invocation.
            26 | type options struct {
            27 | 	numberAll      bool // -n: number all output lines
            28 | 	numberNonblank bool // -b: number non-blank lines only (overrides -n)
            29 | 	squeeze        bool // -s: squeeze consecutive blank lines
            30 | 	showEnds       bool // -E: show $ at end of lines
            31 | 	showTabs       bool // -T: show tabs as ^I
            32 | 	showNonprint   bool // -v: show non-printing characters
            33 | }
            35 | // needsTransform reports whether any output transformation is active.
            36 | func (o *options) needsTransform() bool {
            37 | 	return o.numberAll || o.numberNonblank || o.squeeze ||
            38 | 		o.showEnds || o.showTabs || o.showNonprint
            39 | }
            41 | // catState holds mutable state that persists across files during a single
            42 | // cat invocation.
            43 | type catState struct {
            44 | 	lineNum     int  // next line number to assign
            45 | 	blankCount  int  // consecutive blank lines seen (for -s)
            46 | 	atLineStart bool // whether next byte starts a new line
            47 | }
            49 | // run parses flags and processes inputs. Returns 0 on success, 1 on error.
            50 | //
            51 | // Implements: prd006-cat R1, R2, R4, R5
            52 | func run(args []string) int {
            53 | 	// Install SIGPIPE handler (R5.4).
            54 | 	installSIGPIPEHandler()
            56 | 	fs := flag.NewFlagSet("cat", flag.ContinueOnError)
            57 | 	fs.SetOutput(os.Stderr)
            59 | 	var (
            60 | 		flagNumber   = fs.Bool("n", false, "number all output lines")
            61 | 		flagNumberNB = fs.Bool("b", false, "number non-blank output lines, overrides -n")
            62 | 		flagSqueeze  = fs.Bool("s", false, "squeeze consecutive blank output lines")
            63 | 		flagNonprint = fs.Bool("v", false, "display non-printing characters")
            64 | 		flagEnds     = fs.Bool("E", false, "display $ at end of each line")
            65 | 		flagTabs     = fs.Bool("T", false, "display TAB characters as ^I")
            66 | 		flagAll      = fs.Bool("A", false, "equivalent to -vET")
            67 | 		flagEndNP    = fs.Bool("e", false, "equivalent to -vE")
            68 | 		flagTabNP    = fs.Bool("t", false, "equivalent to -vT")
            69 | 	)
            71 | 	// -u is accepted but ignored (R4.8).
            72 | 	fs.Bool("u", false, "(ignored)")
            74 | 	if err := fs.Parse(args); err != nil {
            75 | 		return 1
            76 | 	}
            78 | 	// Build options, expanding combination flags (R4.5, R4.6, R4.7).
            79 | 	opts := &options{
            80 | 		numberAll:      *flagNumber,
            81 | 		numberNonblank: *flagNumberNB,
            82 | 		squeeze:        *flagSqueeze,
            83 | 		showEnds:       *flagEnds,
            84 | 		showTabs:       *flagTabs,
            85 | 		showNonprint:   *flagNonprint,
            86 | 	}
            88 | 	if *flagAll {
            89 | 		opts.showNonprint = true
            90 | 		opts.showEnds = true
            91 | 		opts.showTabs = true
            92 | 	}
            93 | 	if *flagEndNP {
            94 | 		opts.showNonprint = true
            95 | 		opts.showEnds = true
            96 | 	}
            97 | 	if *flagTabNP {
            98 | 		opts.showNonprint = true
            99 | 		opts.showTabs = true
            100 | 	}
            102 | 	// -b overrides -n (R2.3).
            103 | 	if opts.numberNonblank {
            104 | 		opts.numberAll = false
            105 | 	}
            107 | 	// Collect input files (R1.1, R1.2).
            108 | 	files := fs.Args()
            109 | 	if len(files) == 0 {
            110 | 		files = []string{"-"}
            111 | 	}
            113 | 	// Process each input in order (R1.1, R1.3).
            114 | 	exitCode := 0
            115 | 	st := &catState{lineNum: 1, atLineStart: true}
            116 | 	w := bufio.NewWriter(os.Stdout)
            118 | 	for _, file := range files {
            119 | 		var r io.Reader
            120 | 		var f *os.File
            122 | 		if file == "-" {
            123 | 			r = os.Stdin
            124 | 		} else {
            125 | 			var err error
            126 | 			f, err = os.Open(file)
            127 | 			if err != nil {
            128 | 				printFileError(file, err)
            129 | 				exitCode = 1
            130 | 				continue
            131 | 			}
            132 | 			r = f
            133 | 		}
            135 | 		var err error
            136 | 		if opts.needsTransform() {
            137 | 			err = processTransform(r, w, opts, st)
            138 | 		} else {
            139 | 			err = processSimple(r, w)
            140 | 		}
            142 | 		if f != nil {
            143 | 			f.Close()
            144 | 		}
            146 | 		if err != nil {
            147 | 			printFileError(file, err)
            148 | 			exitCode = 1
            149 | 		}
            150 | 	}
            152 | 	// Flush remaining buffered output (R5.3).
            153 | 	if err := w.Flush(); err != nil {
            154 | 		fmt.Fprintf(os.Stderr, "cat: write error: %v\n", err)
            155 | 		exitCode = 1
            156 | 	}
            158 | 	return exitCode
            159 | }
