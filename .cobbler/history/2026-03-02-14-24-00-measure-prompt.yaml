            109 | 				t.Errorf("PadLeft(%q, %d) = %q, want %q", tc.input, tc.width, got, tc.expect)
            110 | 			}
            111 | 		})
            112 | 	}
            113 | }
            115 | // --- Columns tests (prd003-format R1.1, R1.4) ---
            117 | func TestColumns(t *testing.T) {
            118 | 	tests := []struct {
            119 | 		name      string
            120 | 		entries   []string
            121 | 		termWidth int
            122 | 		check     func(t *testing.T, grid [][]string)
            123 | 	}{
            124 | 		{
            125 | 			name:      "empty-input-returns-nil",
            126 | 			entries:   []string{},
            127 | 			termWidth: 80,
            128 | 			check: func(t *testing.T, grid [][]string) {
            129 | 				if grid != nil {
            130 | 					t.Errorf("Columns(empty, 80) = %v, want nil", grid)
            131 | 				}
            132 | 			},
            133 | 		},
            134 | 		{
            135 | 			name:      "nil-input-returns-nil",
            136 | 			entries:   nil,
            137 | 			termWidth: 80,
            138 | 			check: func(t *testing.T, grid [][]string) {
            139 | 				if grid != nil {
            140 | 					t.Errorf("Columns(nil, 80) = %v, want nil", grid)
            141 | 				}
            142 | 			},
            143 | 		},
            144 | 		{
            145 | 			name:      "single-entry",
            146 | 			entries:   []string{"hello"},
            147 | 			termWidth: 80,
            148 | 			check: func(t *testing.T, grid [][]string) {
            149 | 				if len(grid) != 1 {
            150 | 					t.Fatalf("expected 1 row, got %d", len(grid))
            151 | 				}
            152 | 				if len(grid[0]) != 1 || grid[0][0] != "hello" {
            153 | 					t.Errorf("expected [[hello]], got %v", grid)
            154 | 				}
            155 | 			},
            156 | 		},
            157 | 		{
            158 | 			name:      "multiple-columns-fit",
            159 | 			entries:   []string{"a", "b", "c", "d"},
            160 | 			termWidth: 80,
            161 | 			check: func(t *testing.T, grid [][]string) {
            162 | 				if len(grid) == 0 {
            163 | 					t.Fatal("expected non-empty grid")
            164 | 				}
            165 | 				// With entries of width 1 and termWidth 80, all 4 should fit
            166 | 				// in a single row (4 entries * 1 char + 3 gaps * 2 = 10 <= 80).
            167 | 				if len(grid) != 1 {
            168 | 					t.Errorf("expected 1 row for 4 short entries in 80 cols, got %d rows", len(grid))
            169 | 				}
            170 | 			},
            171 | 		},
            172 | 		{
            173 | 			name:      "single-column-fallback",
            174 | 			entries:   []string{"very-long-entry-here", "another-long-entry!!"},
            175 | 			termWidth: 10,
            176 | 			check: func(t *testing.T, grid [][]string) {
            177 | 				// Each entry is 20 chars, termWidth is 10, so must fall back
            178 | 				// to one column.
            179 | 				if len(grid) != 2 {
            180 | 					t.Fatalf("expected 2 rows (single-column fallback), got %d", len(grid))
            181 | 				}
            182 | 				for i, row := range grid {
            183 | 					if len(row) != 1 {
            184 | 						t.Errorf("row %d: expected 1 column, got %d", i, len(row))
            185 | 					}
            186 | 				}
            187 | 			},
            188 | 		},
            189 | 		{
            190 | 			name: "20-entries-80-width",
            191 | 			entries: []string{
            192 | 				"README.md", "LICENSE", "go.mod", "go.sum", "main.go",
            193 | 				"config.yaml", "Makefile", "CHANGELOG", "setup.py", "app.js",
            194 | 				"index.html", "style.css", "test.go", "utils.go", "data.json",
            195 | 				"build.sh", "deploy.sh", "run.sh", "clean.sh", "init.sh",
            196 | 			},
            197 | 			termWidth: 80,
            198 | 			check: func(t *testing.T, grid [][]string) {
            199 | 				if grid == nil {
            200 | 					t.Fatal("expected non-nil grid for 20 entries")
            201 | 				}
            203 | 				// Verify all entries are present.
            204 | 				count := 0
            205 | 				for _, row := range grid {
            206 | 					count += len(row)
            207 | 				}
            208 | 				if count != 20 {
            209 | 					t.Errorf("expected 20 entries in grid, got %d", count)
            210 | 				}
            212 | 				// Verify each row fits within 80 columns (per-column widths + 2-space gaps).
            213 | 				// Reconstruct column widths from the grid.
            214 | 				numCols := 0
            215 | 				for _, row := range grid {
            216 | 					if len(row) > numCols {
            217 | 						numCols = len(row)
            218 | 					}
            219 | 				}
            220 | 				colWidths := make([]int, numCols)
            221 | 				for _, row := range grid {
            222 | 					for col, entry := range row {
            223 | 						w := len(entry) // ASCII entries, byte count == rune count
            224 | 						if w > colWidths[col] {
            225 | 							colWidths[col] = w
            226 | 						}
            227 | 					}
            228 | 				}
            229 | 				totalWidth := 0
            230 | 				for i, cw := range colWidths {
            231 | 					totalWidth += cw
            232 | 					if i < numCols-1 {
            233 | 						totalWidth += 2 // column gap
            234 | 					}
            235 | 				}
            236 | 				if totalWidth > 80 {
            237 | 					t.Errorf("total grid width %d exceeds termWidth 80", totalWidth)
            238 | 				}
            240 | 				// Verify column count is maximized (one more column would not fit).
            241 | 				if numCols > 1 {
            242 | 					// This is a sanity check; the implementation picks the max.
            243 | 					t.Logf("columns: %d, total width: %d", numCols, totalWidth)
            244 | 				}
            245 | 			},
            246 | 		},
            247 | 		{
            248 | 			name:      "column-order-is-down-then-across",
            249 | 			entries:   []string{"a", "b", "c", "d", "e", "f"},
            250 | 			termWidth: 80,
            251 | 			check: func(t *testing.T, grid [][]string) {
            252 | 				// With 6 very short entries and 80 width, all should fit in 1 row
            253 | 				// or be laid out column-first. Verify entries appear in the grid.
            254 | 				count := 0
            255 | 				for _, row := range grid {
            256 | 					count += len(row)
            257 | 				}
            258 | 				if count != 6 {
            259 | 					t.Errorf("expected 6 entries, got %d", count)
            260 | 				}
            261 | 			},
            262 | 		},
            263 | 	}
            265 | 	for _, tc := range tests {
            266 | 		t.Run(tc.name, func(t *testing.T) {
            267 | 			grid := Columns(tc.entries, tc.termWidth)
            268 | 			tc.check(t, grid)
            269 | 		})
            270 | 	}
            271 | }
        - file: pkg/format/size.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package format provides output formatting shared across utilities including
            5 | // human-readable size conversion, column alignment, and ANSI color output.
            6 | //
            7 | // Implements: prd003-format R1, R2, R3
            8 | package format
            10 | import (
            11 | 	"fmt"
            12 | 	"math"
            13 | )
            15 | // HumanSizeOpts configures the unit system for HumanSize.
            16 | type HumanSizeOpts struct {
            17 | 	// Binary selects 1024-based units with suffixes K/M/G/T/P/E (default).
            18 | 	// When false, uses 1000-based SI units with suffixes kB/MB/GB/TB.
            19 | 	Binary bool
            20 | }
            22 | var (
            23 | 	binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            24 | 	siSuffixes     = []string{"", "kB", "MB", "GB", "TB"}
            25 | )
            27 | // HumanSize converts a byte count to a human-readable string matching GNU
            28 | // coreutils human_readable() behavior.
            29 | //
            30 | // Implements: prd003-format R3.1, R3.2, R3.3, R3.4
            31 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            32 | 	if bytes == 0 {
            33 | 		return "0"
            34 | 	}
            36 | 	var base float64
            37 | 	var suffixes []string
            38 | 	if opts.Binary {
            39 | 		base = 1024
            40 | 		suffixes = binarySuffixes
            41 | 	} else {
            42 | 		base = 1000
            43 | 		suffixes = siSuffixes
            44 | 	}
            46 | 	value := float64(bytes)
            47 | 	for i, suffix := range suffixes {
            48 | 		next := value / base
            49 | 		if next < 1 || i == len(suffixes)-1 {
            50 | 			return formatValue(value, suffix)
            51 | 		}
            52 | 		value = next
            53 | 	}
            55 | 	// Unreachable: the loop always returns.
            56 | 	last := suffixes[len(suffixes)-1]
            57 | 	return formatValue(value, last)
            58 | }
            60 | // formatValue formats a numeric value with its unit suffix following GNU
            61 | // coreutils conventions: no suffix (bytes) uses integer format; values < 10
            62 | // at a scaled unit show one decimal place; values >= 10 show integer format.
            63 | func formatValue(value float64, suffix string) string {
            64 | 	if suffix == "" {
            65 | 		return fmt.Sprintf("%d", int64(value))
            66 | 	}
            67 | 	if value < 10 {
            68 | 		return fmt.Sprintf("%.1f%s", value, suffix)
            69 | 	}
            70 | 	return fmt.Sprintf("%d%s", int64(math.Round(value)), suffix)
            71 | }
