            66 | func TestPadLeft(t *testing.T) {
            67 | 	tests := []struct {
            68 | 		name   string
            69 | 		input  string
            70 | 		width  int
            71 | 		expect string
            72 | 	}{
            73 | 		{
            74 | 			name:   "shorter-than-width",
            75 | 			input:  "abc",
            76 | 			width:  10,
            77 | 			expect: "       abc",
            78 | 		},
            79 | 		{
            80 | 			name:   "equal-to-width",
            81 | 			input:  "abcde",
            82 | 			width:  5,
            83 | 			expect: "abcde",
            84 | 		},
            85 | 		{
            86 | 			name:   "wider-than-width",
            87 | 			input:  "abcdefgh",
            88 | 			width:  5,
            89 | 			expect: "abcdefgh",
            90 | 		},
            91 | 		{
            92 | 			name:   "empty-string",
