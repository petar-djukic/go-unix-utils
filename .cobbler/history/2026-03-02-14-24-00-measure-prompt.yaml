            241 | 	if err := os.Chmod(tmpOutPath, mode); err != nil {
            242 | 		return fmt.Errorf("setting permissions: %v", err)
            243 | 	}
            245 | 	// Atomic rename (R2.1).
            246 | 	if err := os.Rename(tmpOutPath, outFile); err != nil {
            247 | 		// Cross-device fallback (R2.2).
            248 | 		if copyErr := copyFile(tmpOutPath, outFile, mode); copyErr != nil {
            249 | 			return copyErr
            250 | 		}
            251 | 		os.Remove(tmpOutPath) // clean up temp after successful copy
            252 | 	}
            254 | 	success = true
            255 | 	return nil
            256 | }
            258 | // prependExistingContent copies the existing content of outFile into dst.
            259 | // If outFile does not exist, this is a no-op (R3.2).
            260 | //
            261 | // Implements: prd007-sponge R3.1, R3.3
            262 | func prependExistingContent(dst *os.File, outFile string) error {
            263 | 	src, err := os.Open(outFile)
            264 | 	if err != nil {
            265 | 		if os.IsNotExist(err) {
            266 | 			return nil // R3.2: non-existent file, behave as default mode.
            267 | 		}
            268 | 		return fmt.Errorf("%s: %v", outFile, err)
            269 | 	}
            270 | 	defer src.Close()
            272 | 	if _, err := io.Copy(dst, src); err != nil {
            273 | 		return fmt.Errorf("reading %s: %v", outFile, err)
            274 | 	}
            276 | 	return nil
            277 | }
            279 | // writeStdinContent writes the buffered stdin content to dst, reading from
            280 | // either the in-memory buffer or the spill temp file.
            281 | func writeStdinContent(dst *os.File, buf []byte, spillPath string) error {
            282 | 	if buf != nil {
            283 | 		if _, err := dst.Write(buf); err != nil {
            284 | 			return fmt.Errorf("writing output: %v", err)
            285 | 		}
            286 | 		return nil
            287 | 	}
            289 | 	if spillPath == "" {
            290 | 		return nil
            291 | 	}
            293 | 	src, err := os.Open(spillPath)
            294 | 	if err != nil {
            295 | 		return fmt.Errorf("opening temp file: %v", err)
            296 | 	}
            297 | 	defer src.Close()
            299 | 	if _, err := io.Copy(dst, src); err != nil {
            300 | 		return fmt.Errorf("writing output: %v", err)
            301 | 	}
            303 | 	return nil
            304 | }
            306 | // copyFile copies src to dst with the given file mode. Used as fallback
            307 | // when atomic rename fails due to cross-device move.
            308 | //
            309 | // Implements: prd007-sponge R2.2
            310 | func copyFile(src, dst string, mode os.FileMode) error {
            311 | 	in, err := os.Open(src)
            312 | 	if err != nil {
            313 | 		return fmt.Errorf("opening source: %v", err)
            314 | 	}
            315 | 	defer in.Close()
            317 | 	out, err := os.OpenFile(dst, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, mode)
            318 | 	if err != nil {
            319 | 		return fmt.Errorf("%s: %v", dst, err)
            320 | 	}
            322 | 	if _, err := io.Copy(out, in); err != nil {
            323 | 		out.Close()
            324 | 		return fmt.Errorf("writing %s: %v", dst, err)
            325 | 	}
            327 | 	if err := out.Close(); err != nil {
            328 | 		return fmt.Errorf("closing %s: %v", dst, err)
            329 | 	}
            331 | 	return nil
            332 | }
            334 | // installCleanupHandler registers signal handlers that delete the temp file
            335 | // before exiting. Handles SIGINT, SIGTERM, SIGHUP, and SIGPIPE.
            336 | //
            337 | // Implements: prd007-sponge R1.5
            338 | func installCleanupHandler(tmpPath string) {
            339 | 	c := make(chan os.Signal, 1)
            340 | 	signal.Notify(c, syscall.SIGINT, syscall.SIGTERM, syscall.SIGHUP, syscall.SIGPIPE)
            341 | 	go func() {
            342 | 		<-c
            343 | 		os.Remove(tmpPath) // best-effort cleanup
            344 | 		os.Exit(1)
            345 | 	}()
            346 | }
            348 | // cleanupSpill removes the spill temp file if it exists.
            349 | //
            350 | // Implements: prd007-sponge R5.4
            351 | func cleanupSpill(path string) {
            352 | 	if path != "" {
            353 | 		os.Remove(path) // best-effort; file may already be renamed or deleted
            354 | 	}
            355 | }
