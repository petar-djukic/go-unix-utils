            59 | // --- File-output differential test infrastructure (D3) ---
            61 | // fileDiffTest defines a differential test case for file-output utilities
            62 | // where both binaries write to files rather than stdout.
            63 | type fileDiffTest struct {
            64 | 	Name            string               // subtest name
            65 | 	Args            []string             // command-line arguments
            66 | 	Stdin           []byte               // stdin content
            67 | 	PreFiles        map[string]fileSetup // files to create before running each binary
            68 | 	CheckFiles      []string             // filenames to compare after running
            69 | 	SkipStderrMatch bool                 // skip exact stderr comparison for implementation-specific error messages
            70 | }
            72 | // fileSetup describes a pre-existing file to create before running a binary.
            73 | type fileSetup struct {
            74 | 	Content []byte
