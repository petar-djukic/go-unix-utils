                - name: elapsed_since_start_mode
                  description: -s mode; timestamps show time elapsed since ts started, increasing monotonically.
                  inputs:
                    args: ["-s"]
                    stdin: "a\nb\nc\n"
                    env: []
                  normalization: TimestampNormalizer replaces HH:MM:SS elapsed prefix with "ELAPSED"
                  expected:
                    exit_code: 0
