                    stderr: ""
                  traces:
                    - prd006-cat R3.1
                - name: cat_show_nonprinting
                  description: -v displays non-printing characters with caret and M- notation.
                  inputs:
                    args: ["-v"]
                    stdin: "\\x01\\x09\\x1b\\x7f\\x80\\xff"
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout: "^A\\x09^[^?M-^@M-^?"
                    stderr: ""
                  traces:
                    - prd006-cat R4.1
                    - prd006-cat R4.2
                - name: cat_show_ends
                  description: -E appends "$" before each newline.
                  inputs:
                    args: ["-E"]
                    stdin: "line one\nline two\n"
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout: "line one$\nline two$\n"
                    stderr: ""
                  traces:
                    - prd006-cat R4.3
                - name: cat_show_tabs
                  description: -T displays tabs as "^I".
                  inputs:
                    args: ["-T"]
                    stdin: "col1\\tcol2\\tcol3\n"
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout: "col1^Icol2^Icol3\n"
                    stderr: ""
                  traces:
                    - prd006-cat R4.4
                - name: cat_show_all
                  description: -A is equivalent to -vET combined.
                  inputs:
                    args: ["-A"]
                    stdin: "\\x01\\thello\n"
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout: "^A^Ihello$\n"
                    stderr: ""
                  traces:
                    - prd006-cat R4.5
                - name: cat_flag_e
                  description: -e is equivalent to -vE (show non-printing and show ends).
                  inputs:
