                    stderr: ""
                  traces:
                    - prd006-cat R2.2
                    - prd006-cat R2.4
                - name: cat_squeeze_blanks
                  description: -s collapses consecutive blank lines to one.
                  inputs:
                    args: ["-s"]
                    stdin: "a\n\n\n\nb\n"
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
