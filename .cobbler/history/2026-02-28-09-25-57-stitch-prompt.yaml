                    stderr: ""
                  traces:
                    - prd004-ts R4.1
                    - prd004-ts R4.2
                - name: incremental_mode
                  description: -i mode; each timestamp shows time since the previous line.
                  inputs:
                    args: ["-i"]
                    stdin: "first\nsecond\nthird\n"
