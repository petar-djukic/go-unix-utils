                    stderr: ""
                  traces:
                    - prd004-ts R5.1
                    - prd004-ts R5.2
                - name: relative_mode_syslog_timestamp
                  description: -r mode converts a syslog-format timestamp in stdin to relative age.
                  inputs:
                    args: ["-r"]
