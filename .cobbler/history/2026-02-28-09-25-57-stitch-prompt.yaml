                    stdout_structure: two lines matching "TIMESTAMP hello", "TIMESTAMP world"
                    stderr: ""
                  traces:
                    - prd004-ts R2.1
                    - prd004-ts R2.2
                - name: subsecond_format_dotS
                  description: Subsecond extension %.S produces seconds with microsecond suffix.
                  inputs:
                    args: ["%.S"]
