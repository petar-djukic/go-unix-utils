    specs:
        product_requirements:
            - file: docs/specs/product-requirements/prd001-testutils.yaml
              id: prd001-testutils
              title: 'pkg/testutils: Differential Testing Harness'
              problem: |
                Every utility in go-unix-utils is verified by running the Go binary and the Homebrew
                GNU reference binary side by side and comparing their stdout, stderr, and exit code.
                Without a shared harness, each cmd/ package would duplicate the execution and comparison
                logic, the normalization hooks needed for non-deterministic output (timestamps in ts,
                path ordering in find), and the divergence reporting format. This duplication makes
                the verification layer fragile: a bug in one cmd/'s harness copy would produce
                different verification behavior than another cmd/'s copy.

                pkg/testutils is the acceptance gate for the entire pipeline. The mage-claude-orchestrator
                cannot declare a utility complete until its differential tests pass through this harness.
              goals:
                - G1: Provide a single execution function that runs a Go binary and a GNU reference binary with identical inputs and returns both outputs for comparison.
                - G2: Provide a comparison function that diffs stdout, stderr, and exit code and reports divergence with the triggering input.
                - G3: Provide a normalization hook mechanism so individual utilities can strip or replace non-deterministic output fields before comparison.
                - G4: Integrate with go test so that each cmd/ package can define test cases as data and call the harness from a standard TestXxx function.
              requirements:
                R1:
                    title: Test case data structure
                    items:
                        - R1.1: |
                            Must define DiffTest as the following named struct in package testutils:

                              type DiffTest struct {
                                  Name          string                 // subtest name used with t.Run; required
                                  Args          []string               // command-line arguments passed to both binaries
                                  Stdin         []byte                 // nil = no stdin (both binaries receive EOF immediately)
                                  Env           []string               // nil = inherit test process environment with no overrides; non-nil values are KEY=VALUE pairs that override or extend the inherited environment
                                  ExitCode      int                    // expected exit code for both binaries
                                  Normalize     []func([]byte) []byte  // applied in order to stdout and stderr of both binaries before comparison; nil or empty = no normalization
                                  ExpectedFiles map[string][]byte      // optional: path -> expected byte content after execution, for file-output utilities (sponge, cp)
                              }
                        - R1.2: DiffTest.Stdin nil means both binaries receive EOF immediately on stdin. An empty non-nil slice ([]byte{}) also produces no bytes but is semantically distinct (open stdin that is immediately closed).
                        - R1.3: DiffTest.Env nil means both binaries inherit the test process environment unchanged. When non-nil, the slice replaces (does not append to) the process environment for that invocation.
                        - R1.4: Must define type NormalizeFunc = func([]byte) []byte as a named type alias in package testutils. The Normalize field in DiffTest uses this element type. When the slice is nil or empty, no normalization is applied to stdout or stderr.
                R2:
                    title: Binary execution
                    items:
                        - R2.1: |
                            Must provide func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) that accepts the path to the Go binary under test (goBinary) and the GNU reference binary (refBinary), then runs each DiffTest as a named subtest via t.Run(test.Name, ...). Both binaries are invoked with identical Args, Stdin, and Env for each test case.
                        - R2.2: Must capture stdout, stderr, and exit code from each binary independently.
                        - R2.3: Must impose a configurable timeout on each binary invocation. The default timeout must be 10 seconds. The test fails if either binary exceeds the timeout.
                        - R2.4: Must not write any output to the test process stdout or stderr during a passing test run.
                        - R2.5: Must support passing a working directory to each binary invocation. When not specified, both binaries run in a per-test temporary directory created by the harness.
                R3:
                    title: Comparison and reporting
                    items:
                        - R3.1: Must apply the DiffTest.Normalize function (if non-nil) to both binaries' stdout and stderr before comparison.
                        - R3.2: Must compare normalized stdout byte-for-byte. Any difference must be reported as a test failure.
                        - R3.3: Must compare normalized stderr byte-for-byte. Any difference must be reported as a test failure.
                        - R3.4: Must compare exit codes exactly. A difference must be reported as a test failure.
                        - R3.5: 'Must report divergence with the following information in the failure message: the DiffTest args, the stdin content (truncated to 256 bytes if longer), the reference binary stdout, the Go binary stdout, the reference stderr, the Go stderr, and both exit codes.'
                        - R3.6: Must run each DiffTest as a named subtest (t.Run) so individual test case failures are identifiable in go test output.
                R4:
                    title: Normalization hooks
                    items:
                        - R4.1: Must allow per-DiffTest normalization via the Normalize field. The function receives the raw output bytes and returns the normalized bytes.
                        - R4.2: Must provide a built-in TimestampNormalizer that replaces common strftime timestamp patterns with a fixed placeholder string. This normalizer is used by cmd/ts tests.
                        - R4.3: 'Must allow normalizers to be composed: the harness must accept a slice of Normalize functions applied in order, not a single function. When the slice is nil or empty, no normalization is applied.'
                R5:
                    title: File-state comparison
                    items:
                        - R5.1: Must support utilities whose primary output is a file rather than stdout (sponge, cp, mv). For these, DiffTest must allow specifying expected file content after execution alongside expected stdout/stderr.
                        - R5.2: Must compare expected file content byte-for-byte and report divergence in the same format as stdout divergence.
              non_goals:
                - pkg/testutils does not build or compile the Go binaries under test.
                - pkg/testutils does not install or manage Homebrew reference binaries.
                - pkg/testutils does not produce test reports beyond standard go test output.
                - pkg/testutils does not implement retry logic; a failing test fails immediately.
                - pkg/testutils does not mock or stub the filesystem or OS for unit testing cmd/ packages.
              acceptance_criteria:
                - 'AC1: A cmd/ package can define a []DiffTest slice and call RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) from a TestXxx function with no other setup. RunDiffTests runs each DiffTest as a named subtest (t.Run(test.Name, ...)) and calls t.Fatal on the first divergence in any subtest.'
                - 'AC2: A passing test run produces no output. A failing test prints the triggering args, stdin, and both binaries'' stdout, stderr, and exit code.'
                - 'AC3: TimestampNormalizer replaces strftime-formatted timestamps (e.g., "Feb 19 12:34:56") with a fixed placeholder so that ts differential tests pass despite wall-clock differences.'
                - 'AC4: A DiffTest with a file expectation field correctly fails when the Go binary writes different content than the reference binary.'
                - 'AC5: A DiffTest that exceeds the timeout fails with a clear timeout message rather than hanging the test run.'
                - 'AC6: All pkg/testutils code compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd002-sys.yaml
              id: prd002-sys
              title: 'pkg/sys: Syscall Abstractions'
              problem: |
                Four utilities (ls, du, find, xargs) need OS-level capabilities that Go's standard
                library does not expose in a portable, stable form: terminal-width queries, extended
                file metadata (hard-link count, device and inode numbers, physical block counts),
                and signal handling for SIGPIPE and SIGWINCH. On Darwin and Linux these syscalls
                diverge in struct layout (st_mtimespec vs st_mtim, st_blocks interpretation) and
                available interfaces (TIOCGWINSZ ioctl). Without pkg/sys each cmd/ package would
                import syscall or golang.org/x/sys directly, duplicating the Darwin/Linux divergence
                handling and making it harder to test or audit the syscall surface.

                pkg/sys provides a stable, tested interface for these three capability areas. Each
                capability is driven by at least one concrete utility requirement derived from C source
                analysis (see dependency-map.yaml).
              goals:
                - G1: Provide a portable terminal-width query that works on Darwin and Linux without cgo.
                - G2: Expose extended file metadata (st_nlink, st_uid, st_gid, st_rdev, st_blocks, st_ino, st_dev) not available from os.FileInfo.
                - G3: Provide a SIGPIPE handler that suppresses the broken-pipe error when stdout is closed by a downstream consumer.
                - G4: Provide a SIGWINCH handler that calls a user-supplied callback when the terminal is resized.
              requirements:
                R1:
                    title: Terminal width and TTY detection
                    items:
                        - R1.1: Must provide func TerminalWidth() (int, error) that returns the current terminal column count by calling ioctl(TIOCGWINSZ) on stdout. Returns an error (not panic) when stdout is not a terminal or when ioctl fails.
                        - R1.2: Must use golang.org/x/sys/unix (the project's only external dependency) to perform the TIOCGWINSZ ioctl; must not shell out to tput or stty and must not import golang.org/x/term.
                        - R1.3: |
                            Must provide func IsTerminal(w io.Writer) bool that returns true when w is an *os.File whose file descriptor is a terminal, and false otherwise. Implementation: attempt a type assertion to *os.File; if it fails return false; call golang.org/x/sys/unix.IoctlGetWinsize(int(f.Fd()), unix.TIOCGWINSZ) and return err == nil. Returns false for pipes, regular files, bytes.Buffer, and any non-*os.File writer. Required by pkg/format to suppress color output when stdout is redirected.
                        - R1.4: 'Utility context — ls (ls.c:2281): ls uses struct winsize to determine column count for its default multi-column layout and for the -w/--width flag default.'
                R2:
                    title: Extended file metadata
                    items:
                        - R2.1: Must provide func Stat(path string) (*FileInfo, error) and func Lstat(path string) (*FileInfo, error). Stat follows symbolic links (equivalent to os.Stat); Lstat does not follow symbolic links (equivalent to os.Lstat). Both return a *FileInfo populated from syscall.Stat_t.
                        - R2.2: |
                            FileInfo must be defined as the following named struct in package sys:

                              type FileInfo struct {
                                  Mode    os.FileMode // file mode and type bits (from syscall.Stat_t.Mode)
                                  Size    int64       // apparent file size in bytes (st_size)
                                  Nlink   uint64      // hard-link count (st_nlink)
                                  Uid     uint32      // owner user ID (st_uid)
                                  Gid     uint32      // owner group ID (st_gid)
                                  Rdev    uint64      // device ID for special files (st_rdev)
                                  Dev     uint64      // device ID of the containing filesystem (st_dev)
                                  Ino     uint64      // inode number (st_ino)
                                  Blocks  int64       // number of 512-byte blocks allocated (st_blocks)
                                  Blksize int64       // preferred I/O block size (st_blksize)
                                  ModTime time.Time   // modification time (st_mtime / st_mtimespec)
                                  Sys     os.FileInfo // underlying os.FileInfo for os package compatibility
                              }
                        - R2.3: Must abstract the Darwin/Linux divergence in struct field names (st_mtimespec on Darwin vs st_mtim on Linux; st_blocks interpretation) so callers use a single API regardless of target platform.
                        - R2.4: 'Utility context — ls (ls.c:213, 371): ls needs Nlink, Uid, Gid, Rdev, Mode for -l format; Blocks for -s; Ino for -i.'
                        - R2.5: 'Utility context — du (du.c:554): du needs Dev and Ino for hard-link deduplication, and Blocks for physical block-count accumulation.'
                        - R2.6: 'Utility context — find (find/ftsfind.c:172): find predicates (-type, -size, -newer, -perm, -uid, -gid) require Mode, Size, ModTime, Uid, Gid, Nlink from the stat struct.'
                R3:
                    title: SIGPIPE handling
                    items:
                        - R3.1: |
                            Must provide func InstallSIGPIPEHandler() that installs a SIGPIPE handler causing the process to exit 0 when stdout or stderr is closed by a downstream consumer. Implementation: use signal.Notify(c, syscall.SIGPIPE) with a buffered channel of size 1; in a dedicated goroutine call os.Exit(0) when the channel receives. Must not use signal.Ignore so that deferred cleanup functions do not run on SIGPIPE (matching GNU behavior where SIGPIPE terminates silently).
                        - R3.2: InstallSIGPIPEHandler must be safe to call multiple times; only one goroutine per invocation is started.
                        - R3.3: 'Utility context — ls (ls.c:1600-1620): ls installs a SIGPIPE handler via sigaction so that piping ls output to head does not produce a broken-pipe error message. du, find, and xargs have the same requirement.'
                R4:
                    title: SIGWINCH handling
                    items:
                        - R4.1: |
                            Must provide func OnTerminalResize(callback func(width int)) that registers a SIGWINCH handler. When the terminal is resized, the handler calls TerminalWidth() and invokes the callback with the new width. If TerminalWidth() returns an error the callback is not invoked.
                        - R4.2: Must support multiple calls to OnTerminalResize; each registered callback must be called on resize. Callbacks are called in registration order.
                        - R4.3: 'Utility context — ls (ls.c:2281, SIGWINCH registration): ls re-queries terminal width on SIGWINCH to re-format output when the terminal window is resized during a long listing.'
              non_goals:
                - pkg/sys does not wrap all of syscall or golang.org/x/sys; it exposes only the surfaces required by the current utility batch.
                - pkg/sys does not provide file-watching or inotify/kqueue interfaces.
                - pkg/sys does not handle SIGUSR1/SIGUSR2 (find's debug output); those are deferred to the find PRD.
                - pkg/sys does not provide process-group or terminal control (TIOCGPGRP, tcsetpgrp); those are deferred to the xargs PRD.
              acceptance_criteria:
                - 'AC1: TerminalWidth() returns a positive integer when called in a test with a pseudo-terminal (golang.org/x/term''s test helpers or os.Pipe() as a TTY substitute is acceptable).'
                - 'AC2: Stat() and Lstat() on a known file return FileInfo with correct Nlink, Uid, Gid, Dev, Ino, and Blocks values as confirmed by running stat(1) on the same file.'
                - 'AC3: Lstat() on a symlink returns the symlink''s own st_mode (type bits show symlink), not the target''s mode.'
                - 'AC4: InstallSIGPIPEHandler() causes a process writing to a broken pipe to exit 0 rather than printing a write error.'
                - 'AC5: All pkg/sys code compiles on both darwin/arm64 and linux/amd64 with no build errors and no cgo.'
                - 'AC6: All pkg/sys code compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd003-format.yaml
              id: prd003-format
              title: 'pkg/format: Output Formatting'
              problem: |
                Both ls and du produce human-readable output that requires formatting logic beyond
                fmt.Sprintf: ls produces column-aligned tabular output with ANSI color codes for
                file types, and both ls and du convert raw byte counts to human-readable sizes
                (4.0K, 128M, 1.5G). Without pkg/format each cmd/ package would implement its own
                column width computation, ANSI escape handling, and unit conversion, producing
                inconsistent behavior across utilities and making differential test normalization
                harder.

                The formatting logic is driven by C source requirements in ls.c and du.c. Each
                capability is listed with its utility context so the API reflects real call sites,
                not speculation.
              goals:
                - G1: Provide a column-width computation and padding function for multi-column tabular output, matching ls column-layout behavior.
                - G2: Provide an ANSI color lookup and output function for file-type colorization, with automatic suppression when stdout is not a TTY.
                - G3: Provide a human-readable size conversion function matching GNU coreutils human_readable() behavior for both ls -h and du -h.
              requirements:
                R1:
                    title: Column alignment
                    items:
                        - R1.1: Must provide a Columns(entries []string, termWidth int) [][]string function that distributes entries into the maximum number of columns that fit within termWidth, using the longest entry in each column to determine column width.
                        - R1.2: Must provide a PadRight(s string, width int) string and PadLeft(s string, width int) string function for left- and right-aligned field padding within a fixed-width column.
                        - R1.3: 'Must treat multi-byte Unicode characters correctly: column width must be computed from display width (rune count or east-asian width), not byte count.'
                        - R1.4: 'Utility context — ls (ls.c multi-column layout): ls default output places filenames in as many columns as fit in the terminal width. Column widths are computed from the longest filename in each column, not the global maximum.'
                R2:
                    title: ANSI color
                    items:
                        - R2.1: Must provide a FileTypeColor(mode os.FileMode) string function that returns the ANSI escape sequence for a file's type (directory, symlink, executable, block device, character device, socket, pipe, regular file).
                        - R2.2: Must provide a Reset() string constant or function that returns the ANSI reset sequence ("\033[0m").
                        - R2.3: |
                            Must provide a ColorEnabled(w io.Writer) bool function that returns true only when w is a TTY. It must call pkg/sys.IsTerminal(w io.Writer) bool, which returns true when w is an *os.File whose file descriptor is a terminal (detected via golang.org/x/sys/unix.IoctlGetWinsize with TIOCGWINSZ), and false for pipes, regular files, and non-*os.File writers. When ColorEnabled returns false, FileTypeColor must return an empty string and Reset must return an empty string.
                        - R2.4: 'Must use the same color assignments as GNU ls LS_COLORS defaults: directory=34 (blue), symlink=36 (cyan), executable=32 (green), block device=33;1 (yellow bold), character device=33;1 (yellow bold), socket=35 (magenta), pipe=33 (yellow), regular=0 (reset/default).'
                        - R2.5: 'Utility context — ls (ls.c:103 includes dircolors.h, ls.c:273 get_color_indicator): ls outputs ANSI escapes before and after each filename in colorized mode. Color is suppressed when stdout is not a TTY or when --color=never is set.'
                R3:
                    title: Human-readable size conversion
                    items:
                        - R3.1: |
                            Must provide func HumanSize(bytes int64, opts HumanSizeOpts) string that converts a byte count to a human-readable string. HumanSizeOpts is defined as:

                              type HumanSizeOpts struct {
                                  Binary bool // true = 1024-based with suffixes K/M/G/T/P/E (default); false = SI 1000-based with suffixes kB/MB/GB/TB
                              }
                        - R3.2: |
                            When opts.Binary is true (the default zero value), use base 1024 and suffixes []string{"", "K", "M", "G", "T", "P", "E"}. When opts.Binary is false, use base 1000 and suffixes []string{"", "kB", "MB", "GB", "TB"}.
                        - R3.3: Must format the output to at most one decimal place when the value is not an integer at the chosen unit (e.g., 1536 bytes must produce "1.5K", not "2K").
                        - R3.4: Must return "0" for a zero byte count regardless of the unit mode.
                        - R3.5: 'Utility context — ls (ls.c -h flag, human_output_opts): ls -h shows file sizes in human-readable form in -l output. The same conversion applies to ls -s (block counts).'
                        - R3.6: 'Utility context — du (du.c:153 human_output_opts, du.c:442 human_readable()): du -h outputs directory sizes as human-readable strings. du uses the same binary/SI distinction as ls -h.'
              non_goals:
                - pkg/format does not read or parse LS_COLORS environment variables; it uses GNU ls defaults only.
                - pkg/format does not implement terminal hyperlinks (ls.c:210 mentions them as a feature but they are not in scope).
                - pkg/format does not provide a full table library; it provides only the column-alignment primitives needed by ls and du.
                - pkg/format does not handle color themes beyond the GNU ls defaults.
              acceptance_criteria:
                - 'AC1: Columns(entries, termWidth) with a list of 20 filenames and termWidth=80 produces the same column layout as gls --format=across for the same input.'
                - 'AC2: FileTypeColor returns the correct ANSI code for each of the eight file types listed in R2.4.'
                - 'AC3: ColorEnabled returns false when passed an io.Writer backed by an os.Pipe (not a TTY), and true when passed os.Stdout in a TTY test.'
                - 'AC4: HumanSize(1536, binary) returns "1.5K". HumanSize(1000000, SI) returns "1.0MB". HumanSize(0, binary) returns "0".'
                - 'AC5: All pkg/format code compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd004-ts.yaml
              id: prd004-ts
              title: 'cmd/ts: Timestamp Stdin Lines'
              problem: |
                Shell pipelines that process log output often need each line annotated with the time
                it arrived. The standard Unix tools offer no built-in way to prepend a timestamp to
                each stdin line. ts (from moreutils) fills this gap: it reads stdin line by line and
                writes each line to stdout prefixed with a strftime-formatted timestamp. The Go
                implementation must match the Homebrew reference binary (ts, installed by moreutils)
                byte-for-byte on all flag combinations, verified by differential testing via
                pkg/testutils.
              goals:
                - G1: Prepend a strftime timestamp to each stdin line with the default format "%b %d %H:%M:%S".
                - G2: Support custom strftime format strings including the ts-specific subsecond extensions %.S, %.s, and %.T.
                - G3: Support incremental and elapsed-time modes (-i and -s) that show time between lines or time since start.
                - G4: Support monotonic clock mode (-m) for timestamp sources that must not jump on wall-clock adjustments.
                - G5: Support relative-time conversion mode (-r) that rewrites existing timestamps in stdin to relative age strings.
              requirements:
                R1:
                    title: Default behavior (no flags)
                    items:
                        - R1.1: Must read stdin line by line (newline-delimited). Each line must be written to stdout prefixed by a timestamp and a single space.
                        - R1.2: The default timestamp format must be "%b %d %H:%M:%S" (strftime, e.g. "Feb 19 14:05:32"). The format must be evaluated at the time each line is received, not at startup.
                        - R1.3: Must flush stdout after each line so that downstream consumers receive timestamps in real time.
                        - R1.4: Must preserve the original newline at the end of each line; must not add an extra newline.
                        - R1.5: Must pass through partial lines (lines not terminated by a newline at EOF) with a timestamp prefix.
                        - R1.6: Exit code must be 0 after stdin is closed with EOF. Must not exit non-zero due to SIGPIPE when stdout is closed by a downstream consumer.
                R2:
                    title: Custom format string
                    items:
                        - R2.1: Must accept an optional positional argument specifying a custom strftime format string, e.g. "ts '%Y-%m-%dT%H:%M:%S'".
                        - R2.2: Must support all standard strftime(3) conversion specifications available on the target platform.
                        - R2.3: 'Must support three ts-specific subsecond extensions: %.S (seconds with microsecond suffix, e.g. "32.001234"), %.s (Unix epoch with microsecond suffix, e.g. "1708358732.001234"), %.T (HH:MM:SS with microsecond suffix, e.g. "14:05:32.001234"). These extensions require Time::HiRes in the Perl reference; the Go implementation must use time.Now() sub-nanosecond precision formatted to six decimal places.'
                        - R2.4: When a subsecond extension is used in the format string, must obtain both the second and microsecond components atomically from a single time sample per line.
                R3:
                    title: Incremental mode (-i)
                    items:
                        - R3.1: -i must change the timestamp to the time elapsed since the previous line was received. The first line's timestamp is the time elapsed since ts started.
                        - R3.2: The default format in -i mode must be "%H:%M:%S". The TZ environment must be set to GMT so that strftime on a delta-second value produces a correct elapsed string (e.g., 5 seconds since last line → "00:00:05").
                        - R3.3: A custom format argument overrides the -i default format. The TZ=GMT behavior still applies.
                        - R3.4: -i and -s are mutually exclusive; passing both must print a usage error to stderr and exit non-zero.
                R4:
                    title: Elapsed-since-start mode (-s)
                    items:
                        - R4.1: -s must change the timestamp to the time elapsed since ts started, increasing monotonically across lines (unlike -i which resets per line).
                        - R4.2: The default format in -s mode must be "%H:%M:%S" with TZ=GMT, same as -i.
                        - R4.3: A custom format argument overrides the -s default format.
                R5:
                    title: Monotonic clock mode (-m)
                    items:
                        - R5.1: -m must use the system's monotonic clock (CLOCK_MONOTONIC via time.Now() in Go, which automatically uses the monotonic reading) instead of the wall clock for timestamp sampling.
                        - R5.2: -m is compatible with all format modes (-i, -s, default) and with custom format strings including subsecond extensions.
                        - R5.3: When -m is active, the timestamp must not jump backwards or exhibit discontinuities if the wall clock is adjusted (e.g., by NTP) while ts is running.
                R6:
                    title: Relative-time conversion mode (-r)
                    items:
                        - R6.1: -r must scan each input line for known timestamp patterns and replace each match with a human-readable relative age string (e.g., "15m5s ago").
                        - R6.2: 'Must recognize the following timestamp patterns from the Perl source regex: syslog format ("Jan  5 14:30:00"), ISO-8601 ("2024-01-05T14:30:00.000Z"), RFC 2822 with optional day ("16 Jun 94 07:29:35 GMT"), lastlog format ("Mon Jan  5 14:30").'
                        - R6.3: When -r and a format string are both given, must convert matched timestamps to the specified format via strftime rather than to a relative string.
                        - R6.4: Lines with no recognizable timestamp must be passed through unchanged.
                        - R6.5: -r is mutually exclusive with -i and -s; passing both must print a usage error to stderr and exit non-zero.
                R7:
                    title: Exit codes and error handling
                    items:
                        - R7.1: Must exit 0 on clean EOF from stdin.
                        - R7.2: Must exit non-zero and print a usage message to stderr when an unrecognized flag is given.
                        - R7.3: Must exit non-zero when -r mode is requested but the timestamp parsing dependency (equivalent of Date::Parse) is unavailable. In the Go implementation this means the parsing library must be compiled in, so this condition cannot arise; document the invariant in the implementation.
                R8:
                    title: Environment
                    items:
                        - R8.1: Must respect the TZ environment variable to determine the local time zone for wall-clock timestamps (non -i/-s modes). Setting TZ=UTC must cause timestamps to be in UTC.
                        - R8.2: In -i and -s modes, must use TZ=GMT internally for elapsed-time formatting regardless of the user's TZ setting, matching the Perl source behavior.
                R9:
                    title: Differential testing
                    items:
                        - R9.1: |
                            Differential tests must use testutils.TimestampNormalizer (type func([]byte) []byte, defined in pkg/testutils) to replace wall-clock timestamps in output with a fixed placeholder before comparing Go and reference binary outputs. Pass it in the DiffTest.Normalize slice. The normalizer matches strftime-formatted patterns such as "Feb 19 14:05:32" and replaces them with a fixed string so that wall-clock differences do not cause test failures.
                        - R9.2: 'Tests must cover: default format, custom strftime format, -s mode, -i mode, -m mode (with monotonic normalization), multi-line stdin, empty stdin, and partial last line (no trailing newline).'
              non_goals:
                - cmd/ts does not implement egrep-style timestamp colorization.
                - cmd/ts does not read from files; it reads only from stdin.
                - cmd/ts does not support localized date parsing in -r mode (the Perl source explicitly notes this limitation).
                - cmd/ts does not implement --help or --version flags beyond a usage string on bad input.
              acceptance_criteria:
                - 'AC1: echo ''hello world'' | go run ./cmd/ts produces a line matching the pattern: ''<month> <day> <HH:MM:SS> hello world''.'
                - 'AC2: printf ''a\nb\nc\n'' | go run ./cmd/ts -s produces three lines with monotonically increasing elapsed timestamps.'
                - 'AC3: Differential test against ts reference binary passes with TimestampNormalizer applied for default, -s, and -i modes on a 10-line stdin input.'
                - 'AC4: ts with an invalid flag prints a usage message to stderr and exits non-zero.'
                - 'AC5: Empty stdin (immediate EOF) produces no output and exits 0.'
                - 'AC6: cmd/ts compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd005-wc.yaml
              id: prd005-wc
              title: 'cmd/wc: Count Lines, Words, and Bytes'
              problem: |
                Scripts and pipelines frequently need line, word, or byte counts from files or stdin.
                The macOS BSD wc differs from GNU wc in flag interactions and column alignment, making
                it an unreliable reference on macOS. The Go implementation must match the Homebrew GNU
                reference binary (gwc, installed by coreutils) byte-for-byte on all flag combinations
                and multi-file output, verified by differential testing via pkg/testutils.
              goals:
                - G1: Count newlines, words, and bytes from one or more files or stdin, matching GNU wc output format.
                - G2: Support the -c, -l, -m, -w, and -L flags and their combinations, including the default (no flags) behavior.
                - G3: Print a totals line when more than one file is given.
                - G4: Produce column-aligned output when counts from multiple files are printed.
              requirements:
                R1:
                    title: Default behavior (no flags)
                    items:
                        - R1.1: When no flags are given, must print line count, word count, and byte count (in that order) for each input, matching the wc.c default (print_lines = print_words = print_bytes = true; set at wc.c:862).
                        - R1.2: Must read from stdin when no file arguments are given. Must read from each named file in order when file arguments are given.
                        - R1.3: Output for each file must be on a single line with counts followed by the filename. For stdin input, no filename is printed.
                        - R1.4: When more than one file is given, must print a final "total" line with the sum of all counts.
                R2:
                    title: Flag behavior
                    items:
                        - R2.1: -l must count newline characters (not logical lines). A file with no trailing newline has a newline count equal to the number of complete lines.
                        - R2.2: -w must count words, where a word is a maximal sequence of non-whitespace characters. Whitespace is determined by the locale-sensitive isspace() equivalent in Go (unicode.IsSpace).
                        - R2.3: -c must count bytes. -c and -m are mutually exclusive in output but may be passed together; -m takes precedence when both are given (matching wc.c behavior where print_chars overrides print_bytes display).
                        - R2.4: -m must count characters (Unicode code points), not bytes. When the input is valid UTF-8, this is the rune count. When the input contains invalid UTF-8, each invalid byte counts as one character.
                        - R2.5: -L must print the length of the longest line in the input, measured in display columns (tab-expanded, treating each tab as advancing to the next multiple of 8). -L is independent of other flags and may be combined with any of them.
                        - R2.6: 'When flags are combined, must print each requested count in the order: lines (-l), words (-w), chars (-m) or bytes (-c), max-line-length (-L). This is the fixed output column order from wc.c:237-247, not the flag order given by the user.'
                R3:
                    title: Multi-file output and column alignment
                    items:
                        - R3.1: When multiple files are given, each line must right-align counts in columns wide enough for the largest count in that column across all files. This matches GNU wc's dynamic column-width behavior.
                        - R3.2: The total line must use the label "total" (not a filename). The counts in the total line must be the arithmetic sum of counts from all files.
                        - R3.3: Must support --total=auto (default), --total=always (print total even for one file), --total=only (print only the total, not per-file lines), and --total=never (never print total, even for multiple files).
                R4:
                    title: Stdin and special inputs
                    items:
                        - R4.1: Must treat "-" as a filename argument meaning stdin, consistent with POSIX convention.
                        - R4.2: Must handle binary input (arbitrary byte sequences) without corrupting output or panicking.
                        - R4.3: Must handle empty input (zero bytes) and produce "0 0 0" (or the selected subset of counts) correctly.
                        - R4.4: Must support --files0-from=FILE which reads NUL-delimited filenames from FILE and processes each. When FILE is "-", filenames are read from stdin.
                R5:
                    title: Locale handling
                    items:
                        - R5.1: Differential tests must set LC_ALL=C to avoid locale-dependent divergence between the Go and reference binary outputs for -m (character count). Document this constraint in the test suite.
                        - R5.2: Under LC_ALL=C, -m and -c must produce identical counts (each byte counts as one character). The Go implementation must produce the same result.
                R6:
                    title: Exit codes
                    items:
                        - R6.1: Must exit 0 when all inputs are processed successfully.
                        - R6.2: Must exit 1 when any input file cannot be opened or read. Must still process and print counts for the files that were successfully read before exiting 1.
                        - R6.3: Must exit 1 when a write error occurs on stdout.
              non_goals:
                - cmd/wc does not implement -c with block-size adjustments (those belong to du).
                - cmd/wc does not implement color output.
                - cmd/wc does not implement wide-character display-width handling for -L beyond tab expansion; East Asian wide characters are out of scope for the initial implementation.
              acceptance_criteria:
                - 'AC1: printf ''foo\nbar baz\n'' | go run ./cmd/wc produces ''2 3 12'', matching gwc on the same input.'
                - 'AC2: go run ./cmd/wc -l -w file1 file2 produces right-aligned counts and a correct ''total'' line, matching gwc output byte-for-byte.'
                - 'AC3: Differential test against gwc passes on default mode, -l, -w, -c, -m (with LC_ALL=C), -L, multi-file, and stdin modes.'
                - 'AC4: go run ./cmd/wc on a non-existent file prints an error to stderr, exits 1, and still processes any other files on the command line.'
                - 'AC5: Empty input produces ''0 0 0'' (default flags), matching gwc.'
                - 'AC6: cmd/wc compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd006-cat.yaml
              id: prd006-cat
              title: 'cmd/cat: Concatenate and Display Files'
              problem: |
                The macOS BSD cat differs from GNU cat in flag handling (-e, -t, and -v behavior) and
                in the treatment of non-printing characters. Scripts that rely on GNU cat's -A, -v,
                -E, and -T flags for diagnostic inspection of binary or control-character content will
                behave differently on macOS. The Go implementation must match the Homebrew GNU
                reference binary (gcat, installed by coreutils) byte-for-byte on all flag combinations
                including binary input, verified by differential testing via pkg/testutils.
              goals:
                - G1: Concatenate one or more files (or stdin) to stdout with no transformation by default.
                - G2: Support line-numbering flags (-n, -b) that prepend line numbers to output.
                - G3: Support the blank-squeezing flag (-s) that collapses consecutive blank lines into one.
                - G4: Support non-printing display flags (-v, -E, -T, -A, -e, -t) that make control characters and special bytes visible.
                - G5: Pass binary data through without corruption when no transformation flags are active.
              requirements:
                R1:
                    title: Default behavior (no flags)
                    items:
                        - R1.1: Must read each named file in argument order and write its contents verbatim to stdout.
                        - R1.2: Must read from stdin when no file arguments are given, or when "-" is given as a filename.
                        - R1.3: 'Must support concatenating multiple files: each file''s content is written in sequence with no separator.'
                        - R1.4: 'Must not corrupt binary input: output bytes must be identical to input bytes when no transformation flags are active.'
                        - R1.5: Must not add or remove newlines from the input.
                R2:
                    title: Line numbering (-n, -b)
                    items:
                        - R2.1: '-n must prepend a line number to every output line. The line number must be right-justified in a field of width 6, followed by a tab character and then the line content (format: "%6d\t%s"). Line numbering resets to 1 at the start of each cat invocation, not per file.'
                        - R2.2: -b must prepend a line number only to non-blank lines. Blank lines receive no number and no tab prefix. -b implies -n (activates line numbering) but overrides it by skipping blank lines.
                        - R2.3: When -b and -n are both given, -b takes precedence (blank lines are not numbered). This matches cat.c:602 where number_nonblank overrides number.
                        - R2.4: A blank line is a line containing only a newline character (zero non-newline bytes). Lines with spaces or tabs are not blank.
                R3:
                    title: Blank-line squeezing (-s)
                    items:
                        - R3.1: '-s must suppress repeated blank lines: when two or more consecutive blank lines appear in the output, only one must be written. The first blank line is written; subsequent consecutive blank lines are discarded.'
                        - R3.2: '-s must apply across file boundaries when multiple files are concatenated: if the last line of file A and the first line of file B are both blank, they count as consecutive blank lines.'
                        - R3.3: '-s is compatible with -n and -b. When combined, squeezing is applied before numbering: the suppressed blank lines do not consume line numbers.'
                R4:
                    title: Non-printing display (-v, -E, -T, -A, -e, -t)
                    items:
                        - R4.1: -v must display non-printing characters using caret notation and M- prefix. Control characters (0x00-0x1F except 0x09 tab and 0x0A newline) must be shown as ^X where X is the character 64 positions higher (e.g., 0x01 -> "^A", 0x1B -> "^["). Characters in the range 0x80-0x9F must be shown as "M-^X". Characters in the range 0xA0-0xFE must be shown as "M-X" where X is the character minus 0x80. The DEL character (0x7F) must be shown as "^?". 0xFF must be shown as "M-^?".
                        - R4.2: -v must not alter tab (0x09) or newline (0x0A) characters. Those are the two control characters exempted from -v display.
                        - R4.3: -E must append a "$" character before each newline in the output. The newline itself is still written after the "$".
                        - R4.4: -T must display tab characters (0x09) as the two-character sequence "^I" rather than the tab character itself.
                        - R4.5: -A is equivalent to -v -E -T combined. All three transformations are active simultaneously.
                        - R4.6: -e is equivalent to -v -E combined (show non-printing, show ends).
                        - R4.7: -t is equivalent to -v -T combined (show non-printing, show tabs).
                        - R4.8: '-u is accepted but has no effect (cat.c:616: "we provide the -u feature unconditionally"). The flag must not produce an error.'
                        - R4.9: 'Transformation flags are compatible with -n, -b, and -s. The order of application is: squeeze blanks (-s), then apply non-printing display (-v/-T), then append end-of-line marker (-E), then prepend line number (-n/-b).'
                R5:
                    title: Error handling and exit codes
                    items:
                        - R5.1: Must exit 0 when all inputs are processed successfully.
                        - R5.2: Must exit 1 when any input file cannot be opened. The error message must be written to stderr. cat must continue processing remaining file arguments after the error.
                        - R5.3: Must exit 1 when a write error occurs on stdout (e.g., SIGPIPE or full disk). The write error must be detected and reported; the process must not hang.
                        - R5.4: |
                            Must not exit non-zero due to SIGPIPE when stdout is closed by a downstream consumer. At startup, install a SIGPIPE handler: use signal.Notify(c, syscall.SIGPIPE) with a buffered channel of size 1; in a dedicated goroutine call os.Exit(0) when the channel receives. Do not use signal.Ignore (deferred cleanup functions must not run on SIGPIPE, matching GNU behavior).
              non_goals:
                - cmd/cat does not implement the FIONREAD ioctl optimization from cat.c:298; it uses standard io.Copy which is sufficient for correctness.
                - cmd/cat does not implement POSIX unbuffered output semantics for -u; the flag is accepted but ignored.
                - cmd/cat does not implement terminal line-editing or interactive mode.
                - cmd/cat does not detect when input and output refer to the same file and warn about it (GNU cat does; this is a diagnostic, not a correctness requirement).
              acceptance_criteria:
                - 'AC1: go run ./cmd/cat file1 file2 produces identical bytes to gcat file1 file2 for arbitrary file contents including binary.'
                - 'AC2: printf ''a\n\n\nb\n'' | go run ./cmd/cat -n produces numbered lines, matching gcat -n output byte-for-byte.'
                - 'AC3: printf ''a\n\n\nb\n'' | go run ./cmd/cat -s produces a single blank line between ''a'' and ''b'', matching gcat -s.'
                - 'AC4: printf ''\x01\x09\x1b\x7f\x80\xff'' | go run ./cmd/cat -v produces the correct caret and M- notation, matching gcat -v byte-for-byte.'
                - 'AC5: Differential test against gcat passes for all flag combinations: -n, -b, -s, -v, -E, -T, -A, -e, -t, and combinations thereof, on text and binary inputs.'
                - 'AC6: go run ./cmd/cat on a non-existent file prints an error to stderr, exits 1, and still processes any other files on the command line.'
                - 'AC7: cmd/cat compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd007-sponge.yaml
              id: prd007-sponge
              title: 'cmd/sponge: Soak Stdin and Write to File'
              problem: |
                Shell pipelines often need to process a file and write the result back to the same
                file. The naive form "cmd file | redirect > file" truncates the output file before
                cmd finishes reading it, producing empty or corrupt output. sponge (from moreutils)
                solves this by reading all of stdin into a buffer before opening the output file.
                Only after stdin is fully consumed does sponge write to the named file, making the
                idiom "cmd file | sponge file" safe.

                The Go implementation must match the Homebrew reference binary (sponge, installed by
                moreutils) byte-for-byte on all flag combinations and large-input behavior, verified
                by differential testing via pkg/testutils.
              goals:
                - G1: Read all of stdin into memory before opening the output file, guaranteeing that the output file is not opened until stdin is fully consumed.
                - G2: Write the buffered content to the named output file atomically via a temp-file rename, preserving the original file's permissions if it exists.
                - G3: Support append mode (-a) that prepends the original file content before the stdin content in the output.
                - G4: Support passthrough mode (no output filename) that writes buffered stdin to stdout.
                - G5: Handle large stdin inputs that exceed available memory by spilling to a temp file.
              requirements:
                R1:
                    title: Core soak-before-write contract
                    items:
                        - R1.1: Must read all bytes from stdin before opening or creating the output file. Opening the output file before stdin is closed violates the core contract and is not permitted.
                        - R1.2: Must buffer stdin in memory using a dynamically grown buffer starting at 8192 bytes, doubling on overflow, matching sponge.c:BUFF_SIZE and the realloc loop at sponge.c:313-324.
                        - R1.3: 'When the in-memory buffer would exceed the available memory threshold (derived from physmem_available() in the reference; in Go, use runtime.MemStats or a fixed fraction of RLIMIT_DATA), must spill the current buffer to a temp file and continue reading. The spill must be transparent: the final output is still a single concatenated byte stream.'
                        - R1.4: Must create the temp file in the directory specified by the TMPDIR environment variable, or "/tmp" if TMPDIR is not set. The temp file name must follow the pattern "sponge.XXXXXX" (mkstemp-style random suffix).
                        - R1.5: 'Must register a cleanup handler (atexit equivalent in Go: defer or os/signal) that deletes the temp file if the process exits or receives SIGINT, SIGTERM, SIGHUP, or SIGPIPE before the rename completes.'
                R2:
                    title: Output file handling
                    items:
                        - R2.1: When an output filename is given, must attempt an atomic rename of the temp file to the output filename when the output file is a regular file or does not yet exist (sponge.c:371-373).
                        - R2.2: When the rename fails (e.g., cross-device move), must fall back to a byte-for-byte copy of the temp file content to the output file, then delete the temp file.
                        - R2.3: When the output file already exists, must preserve its file mode (permissions) by reading the mode via lstat before writing and applying it to the output file via chmod (sponge.c:338-346). When the output file does not exist, must apply the default mode 0666 masked by the process umask.
                        - R2.4: 'Must use lstat (not stat) to check whether the output path exists and is a regular file (sponge.c:332-333). This matters when the output path is a symlink: sponge must replace the symlink target, not follow it blindly.'
                        - R2.5: The output file must never be in a partially-written state observable by other processes. Either the rename succeeds atomically or the copy completes before the old file is removed.
                R3:
                    title: Append mode (-a)
                    items:
                        - R3.1: '-a must cause sponge to prepend the existing content of the output file to the stdin content before writing. The result is: [original file content][stdin content] written to the output file.'
                        - R3.2: -a applies only when the output file already exists and is a regular file. When the output file does not exist, -a behaves identically to the default mode (creates a new file with stdin content).
                        - R3.3: The prepend operation must copy the original file content into the temp file first, then append the stdin buffer to the temp file (sponge.c:352-357). The original file must be read before the temp file is renamed over it.
                R4:
                    title: Passthrough mode (no output filename)
                    items:
                        - R4.1: When no output filename is given, must write the buffered stdin content to stdout after stdin is fully consumed.
                        - R4.2: In passthrough mode with large input (temp file spill), must seek the temp file to the beginning and copy its content to stdout (sponge.c:403-406).
                        - R4.3: In passthrough mode with small input (buffer fits in memory), must write the in-memory buffer directly to stdout without creating or reading a temp file (sponge.c:408-411).
                R5:
                    title: Exit codes and error handling
                    items:
                        - R5.1: Must exit 0 on success.
                        - R5.2: Must exit 1 when stdin cannot be read, when the temp file cannot be created or written, when the output file cannot be opened, or when the rename or copy fails. In all error cases, must print a descriptive error message to stderr via perror-equivalent before exiting.
                        - R5.3: Must exit 1 when memory allocation fails (buffer realloc). Must print an error and exit rather than panicking.
                        - R5.4: Must clean up the temp file on exit in all error paths. The temp file must not persist after the process exits, whether due to success or failure.
                R6:
                    title: Differential testing
                    items:
                        - R6.1: Differential tests must compare the content of the output file (not stdout) after both the Go binary and the reference binary have exited, using file-content comparison provided by pkg/testutils.
                        - R6.2: 'Tests must cover: small stdin (fits in memory), large stdin (forces temp file spill, tested with input larger than 1 MB), append mode, passthrough mode (no filename), output file does not exist, output file already exists (mode preservation), and the cross-device rename fallback (tested by placing the output file on a different filesystem from TMPDIR).'
              non_goals:
                - cmd/sponge does not implement interactive editing or prompt modes.
                - cmd/sponge does not implement a --buffer-size flag; the buffer size is determined automatically.
                - cmd/sponge does not follow symlinks for the output file path; it operates on the path as given.
                - cmd/sponge does not implement atomic writes for passthrough mode (stdout); atomicity applies only to named output files.
              acceptance_criteria:
                - 'AC1: seq 1 100 | go run ./cmd/sponge /tmp/out.txt && cat /tmp/out.txt produces 100 lines 1-100, confirming stdin was fully read before the file was opened.'
                - 'AC2: The soak-before-write contract is verifiable by the test harness creating a file, running ''cat file | sponge file'' and confirming the output equals the original input (not an empty file).'
                - 'AC3: printf ''appended\n'' | go run ./cmd/sponge -a /tmp/existing.txt prepends the original content of existing.txt before ''appended'', matching gsponge -a behavior.'
                - 'AC4: printf ''hello'' | go run ./cmd/sponge produces ''hello'' on stdout, matching gsponge with no filename.'
                - 'AC5: Differential test against sponge reference binary passes for small input, large input (1 MB+), append mode, and passthrough mode.'
                - 'AC6: cmd/sponge compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd008-ls.yaml
              id: prd008-ls
              title: 'cmd/ls: Core File Listing'
              problem: |
                ls is the most frequently used Unix utility, and its behavior varies between macOS BSD ls
                and GNU ls in column layout, color handling, long-format field widths, and human-readable
                size formatting. Scripts and interactive shells depend on exact output format for parsing
                and display. A Go implementation must match the Homebrew GNU reference binary (gls,
                installed by coreutils) byte-for-byte on all in-scope flag combinations, verified by
                differential testing via pkg/testutils.

                ls is the primary consumer of both pkg/sys and pkg/format. It requires terminal-width
                queries for multi-column layout, extended file metadata for long format, signal handling
                for SIGPIPE and SIGWINCH, column alignment for tabular output, ANSI color for file-type
                colorization, and human-readable size conversion. This PRD covers the core flag subset
                for rel02.0; extended flags are deferred to prd010-ls-extended.
              goals:
                - G1: List directory contents in multi-column, single-column, or long format, matching GNU ls output layout.
                - G2: Support filter flags (-a, -A, -d) to control which entries appear in the listing.
                - G3: Support colorized output via --color with automatic suppression when stdout is not a TTY.
                - G4: Support human-readable file sizes (-h) in long format, matching GNU ls -lh output.
                - G5: Produce correct exit codes (0, 1, 2) matching GNU ls exit-code contract.
              requirements:
                R1:
                    title: Default listing (multi-column and single-column)
                    items:
                        - R1.1: |
                            When stdout is a TTY and no format flag is given, must produce multi-column output sorted vertically (down columns, then across). Terminal width is obtained by calling pkg/sys.TerminalWidth() (int, error) — returns the current terminal column count via TIOCGWINSZ ioctl on stdout; returns an error when stdout is not a terminal. Entries are laid out by calling pkg/format.Columns(entries []string, termWidth int) [][]string — distributes entries into the maximum number of columns fitting within termWidth, with column widths computed as per-column maxima of entry lengths.
                        - R1.2: When stdout is not a TTY (pipe, file redirect) and no format flag is given, must produce single-column output with one entry per line. This matches GNU ls behavior (ls.c detects stdout is not a TTY and sets format to single-column).
                        - R1.3: Must sort entries in the C locale order (LC_COLLATE=C). Differential tests must set LC_ALL=C to eliminate locale-dependent sort divergence.
                        - R1.4: Must not list entries whose names start with "." unless -a or -A is given. This is the default filter behavior matching GNU ls.
                R2:
                    title: Single-column mode (-1) and long format (-l)
                    items:
                        - R2.1: -1 must produce single-column output with one entry per line regardless of whether stdout is a TTY. This overrides the default multi-column layout.
                        - R2a: |
                            -l flag skeleton and permission string. When -l is given, produce long-format output. Field order (left to right): permissions (10 chars), nlink, owner, group, size, mtime, name. Fields separated by a single space. Numeric fields (nlink, size) are right-aligned in columns wide enough for the largest value in the listing.

                            Permission string algorithm (10 characters):
                            - Position 0 (file type): 'd' for directory (fi.Mode&os.ModeDir != 0), 'l' for symlink (fi.Mode&os.ModeSymlink != 0), 'c' for char device (fi.Mode&os.ModeDevice != 0 && fi.Mode&os.ModeCharDevice != 0), 'b' for block device (fi.Mode&os.ModeDevice != 0 && fi.Mode&os.ModeCharDevice == 0), 'p' for FIFO (fi.Mode&os.ModeNamedPipe != 0), 's' for socket (fi.Mode&os.ModeSocket != 0), '-' for regular file.
                            - Positions 1-3 (owner rwx): 'r'/'- ' for bit 0o400, 'w'/'-' for 0o200, 'x'/'-' for 0o100. If setuid (fi.Mode&os.ModeSetuid != 0): replace 'x' with 's', or replace '-' with 'S'.
                            - Positions 4-6 (group rwx): bits 0o040, 0o020, 0o010. If setgid (fi.Mode&os.ModeSetgid != 0): replace 'x' with 's', or replace '-' with 'S'.
                            - Positions 7-9 (other rwx): bits 0o004, 0o002, 0o001. If sticky (fi.Mode&os.ModeSticky != 0): replace 'x' with 't', or replace '-' with 'T'.
                        - R2b: |
                            File metadata via pkg/sys.Lstat. Obtain metadata for each listed entry by calling pkg/sys.Lstat(path string) (*sys.FileInfo, error) — does not follow symbolic links; returns the symlink's own metadata when path is a symlink.

                            sys.FileInfo struct (embedded here for reference):
                              type FileInfo struct {
                                  Mode    os.FileMode // file mode and type bits
                                  Size    int64       // apparent file size in bytes (st_size)
                                  Nlink   uint64      // hard-link count (st_nlink)
                                  Uid     uint32      // owner user ID (st_uid)
                                  Gid     uint32      // owner group ID (st_gid)
                                  Rdev    uint64      // device ID for special files (st_rdev)
                                  Dev     uint64      // device ID of the containing filesystem (st_dev)
                                  Ino     uint64      // inode number (st_ino)
                                  Blocks  int64       // number of 512-byte blocks allocated (st_blocks)
                                  Blksize int64       // preferred I/O block size (st_blksize)
                                  ModTime time.Time   // modification time
                                  Sys     os.FileInfo // underlying os.FileInfo
                              }

                            In long format: print fi.Nlink (uint64) right-aligned; print fi.Size (int64, bytes) right-aligned. Both columns sized to the widest value across all listed entries.
                        - R2c: |
                            Owner and group name resolution in long format. Resolve owner name by calling os/user.LookupId(strconv.Itoa(int(fi.Uid))); on success use u.Username; on error (user not found or lookup fails) fall back to strconv.FormatUint(uint64(fi.Uid), 10). Resolve group name by calling os/user.LookupGroupId(strconv.Itoa(int(fi.Gid))); on success use g.Name; on error fall back to strconv.FormatUint(uint64(fi.Gid), 10). Owner and group fields are left-padded to column width for alignment.
                        - R2d: |
                            Modification time formatting in long format. Use fi.ModTime (time.Time from sys.FileInfo). If time.Since(fi.ModTime) < 6*30*24*time.Hour (approximately six months), format as fi.ModTime.Format("Jan _2 15:04"). Otherwise format as fi.ModTime.Format("Jan _2  2006"). Both patterns produce a 12-character field.
                        - R2e: |
                            Total block count line and symlink display. Before the directory listing, print "total N\n" where N = sum(fi.Blocks for all listed entries) / 2. The division converts 512-byte st_blocks units to 1K-block units matching GNU ls. N is a plain integer (no trailing suffix) unless -h is active (see R5).

                            Symlink display: when fi.Mode&os.ModeSymlink != 0, read the link target with os.Readlink(path) and append " -> " + target to the entry name field. Use Lstat (not Stat) so the symlink's own fi.Size and fi.Nlink are used, not the target's.
                R3:
                    title: Filter flags (-a, -A, -d)
                    items:
                        - R3.1: -a must include entries whose names start with "." including the special entries "." and ".." in the listing.
                        - R3.2: -A must include entries whose names start with "." except for "." and "..". -A is the "almost all" filter.
                        - R3.3: -d must list directory entries themselves rather than their contents. When a directory is given as an argument with -d, must print the directory name (or its long-format entry with -l) without descending into it.
                        - R3.4: When both -a and -A are given, the last one on the command line takes precedence, matching GNU ls behavior.
                R4:
                    title: Color output (--color)
                    items:
                        - R4.1: Must support --color=always, --color=auto, and --color=never. When --color is given without a value, it must default to "always".
                        - R4.2: |
                            --color=auto must colorize output only when stdout is a TTY. TTY detection: call pkg/sys.IsTerminal(os.Stdout) — returns true when os.Stdout's file descriptor is a terminal (detected via golang.org/x/sys/unix.IoctlGetWinsize with TIOCGWINSZ), false otherwise. When stdout is not a TTY, --color=auto must behave like --color=never.
                        - R4.3: |
                            Colorized output uses GNU LS_COLORS default color assignments. Implement color lookup directly in cmd/ls using the following table (do not call pkg/format.FileTypeColor):

                              File type         ANSI escape sequence
                              ---------         --------------------
                              directory         "\033[34m"   (blue)
                              symbolic link     "\033[36m"   (cyan)
                              executable file   "\033[32m"   (green)
                              block device      "\033[33;1m" (yellow bold)
                              character device  "\033[33;1m" (yellow bold)
                              socket            "\033[35m"   (magenta)
                              named pipe/FIFO   "\033[33m"   (yellow)
                              regular file      ""           (no color)
                              reset sequence    "\033[0m"

                            Executable detection: fi.Mode&0o111 != 0 (any execute bit set). Each entry name is wrapped as: colorCode + name + resetCode. When color is suppressed, both codes are empty strings so no ANSI sequences appear in output.
                        - R4.4: When --color=never or when color is suppressed (non-TTY with auto), must not emit any ANSI escape sequences in the output.
                R5:
                    title: Human-readable sizes (-h)
                    items:
                        - R5.1: |
                            -h must only take effect with -l (long format). When -h is given with -l, file sizes (fi.Size int64) must be displayed using the following binary HumanSize algorithm (do not call pkg/format.HumanSize):

                              func humanSize(n int64) string {
                                  if n == 0 { return "0" }
                                  suffixes := []string{"", "K", "M", "G", "T", "P", "E"}
                                  f := float64(n)
                                  i := 0
                                  for f >= 1024 && i < len(suffixes)-1 { f /= 1024; i++ }
                                  if i == 0 { return fmt.Sprintf("%d", n) }
                                  if f == float64(int64(f)) { return fmt.Sprintf("%d%s", int64(f), suffixes[i]) }
                                  return fmt.Sprintf("%.1f%s", f, suffixes[i])
                              }

                            Without -l, -h must have no visible effect on output.
                        - R5.2: -h must also apply to the "total N" block count line in long format. When -h is active, convert the total block count (sum(fi.Blocks)/2 as int64) to a human-readable string using the same binary algorithm before printing "total X\n".
                        - R5.3: Without -l, -h must have no visible effect on output.
                R6:
                    title: Exit codes
                    items:
                        - R6.1: Must exit 0 when all listed paths are accessed and output is written successfully.
                        - R6.2: Must exit 1 when a minor problem occurs, such as failing to access a file or directory given as an argument (e.g., permission denied, file not found). Must still list the remaining accessible entries before exiting. Must print a diagnostic to stderr for each inaccessible entry.
                        - R6.3: Must exit 2 when a serious problem occurs, such as an invalid command-line option. This matches GNU ls (ls.c:5638 exit(status) where status is set to EXIT_FAILURE=2 for bad options at ls.c:2026).
                R7:
                    title: Signal handling
                    items:
                        - R7.1: |
                            Must install a SIGPIPE handler at startup so that piping ls output to head or other truncating consumers does not produce a broken-pipe error message. Implementation: call pkg/sys.InstallSIGPIPEHandler() — this uses signal.Notify(c, syscall.SIGPIPE) with a buffered channel of size 1; a dedicated goroutine calls os.Exit(0) when the channel receives. Must not use signal.Ignore (deferred cleanup functions must not run on SIGPIPE, matching GNU ls behavior).
                        - R7.2: Must install a SIGWINCH handler via pkg/sys.OnTerminalResize(callback func(width int)) that re-queries the terminal width and updates the column layout. pkg/sys.OnTerminalResize registers a SIGWINCH listener that calls pkg/sys.TerminalWidth() and invokes the callback with the new width; multiple callbacks may be registered. This allows ls to adapt column layout if the terminal is resized during a long listing.
              non_goals:
                - -C (force multi-column), -x (sort across), -t (sort by mtime), -S (sort by size), -r (reverse sort), -U (unsorted), -v (version sort), -i (inode number), -s (block size), -n (numeric UID/GID), -R (recursive), -F (classify with indicator) are deferred to prd010-ls-extended.
                - --hyperlink (terminal hyperlinks) is out of scope for this project.
                - --dired (Emacs dired mode) is out of scope.
                - -Z (SELinux security context) is out of scope; this project does not target SELinux.
                - --quoting-style (filename quoting) is out of scope for this release.
                - --block-size unit suffixes beyond -h are out of scope for this release.
                - LS_COLORS environment variable parsing is out of scope; we use GNU default colors only (prd003-format non-goals).
                - ACL (access control list) display in long format (the "+" indicator) is out of scope.
              acceptance_criteria:
                - 'AC1: Default mode comparison -- gls and go run ./cmd/ls on a test directory produce identical multi-column output when run in a pseudo-TTY with the same terminal width. Differential test must set LC_ALL=C and --color=never.'
                - 'AC2: Single-column comparison -- gls -1 and go run ./cmd/ls -1 produce identical output on the same test directory.'
                - 'AC3: Long format comparison -- gls -l and go run ./cmd/ls -l produce identical output on the same test directory. Because mtime display depends on wall clock, differential tests must normalize the mtime column by replacing it with a fixed placeholder (e.g., "MTIME") before comparison. Because owner/group names may vary, tests must use a fixture where files are owned by the test user, or normalize owner/group fields.'
                - 'AC4: Color suppression -- gls --color=auto and go run ./cmd/ls --color=auto produce no ANSI escape sequences when stdout is piped (not a TTY).'
                - 'AC5: Human-readable sizes -- gls -lh and go run ./cmd/ls -lh produce identical size strings on a set of test files with known sizes (0 bytes, 1023 bytes, 1024 bytes, 1536 bytes, 1048576 bytes, 1073741824 bytes).'
                - 'AC6: Filter flags -- gls -a, gls -A, and gls -d produce identical output to the Go binary with the same flags on a test directory containing dotfiles and subdirectories.'
                - 'AC7: Exit codes -- the Go binary exits 1 when given a non-existent path argument and exits 2 when given an invalid option, matching gls behavior.'
                - 'AC8: cmd/ls compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd009-du.yaml
              id: prd009-du
              title: 'cmd/du: Recursive Directory Disk Usage'
              problem: |
                du reports disk usage for directories and files, but macOS BSD du and GNU du diverge in
                default block size (512-byte vs 1024-byte blocks), flag availability (-d vs --max-depth,
                --apparent-size absent in BSD du), and output formatting. Scripts that parse du output
                break when moving between platforms. The Go implementation must match the Homebrew GNU
                reference binary (gdu, installed by coreutils) byte-for-byte on all in-scope flag
                combinations, verified by differential testing via pkg/testutils.

                du requires pkg/sys for extended file metadata (st_blocks for physical block counts,
                st_dev and st_ino for hard-link deduplication) and pkg/format for human-readable size
                conversion (-h flag). These shared components are specified in prd002-sys and
                prd003-format respectively.
              goals:
                - G1: Report disk usage for directories by recursively accumulating block counts, matching GNU du default output.
                - G2: Support summary mode (-s) to print only the total for each argument.
                - G3: Support human-readable output (-h) matching GNU du -h formatting.
                - G4: Support all-files mode (-a) to report sizes for individual files, not just directories.
                - G5: Support depth limiting (-d N / --max-depth=N) to control recursion depth.
                - G6: Support grand total (-c) to print a cumulative total after all arguments.
                - G7: Support apparent size (--apparent-size) to report file size instead of block count.
              requirements:
                R1:
                    title: Default behavior
                    items:
                        - R1.1: Must recurse into each directory argument and print the accumulated size and path for each subdirectory and the directory itself. When no arguments are given, must default to the current directory (".").
                        - R1.2: |
                            Must report sizes in 1024-byte (1K) block units by default. Each entry's size is fi.Blocks / 2 where fi.Blocks (int64) is the number of 512-byte blocks allocated (st_blocks from syscall.Stat_t). Obtain metadata via pkg/sys.Stat(path string) (*sys.FileInfo, error) — follows symbolic links. sys.FileInfo.Blocks int64 holds the 512-byte block count.

                            sys.FileInfo struct (embedded for reference):
                              type FileInfo struct {
                                  Mode    os.FileMode
                                  Size    int64       // apparent file size in bytes (st_size)
                                  Nlink   uint64      // hard-link count (st_nlink)
                                  Uid     uint32      // owner user ID (st_uid)
                                  Gid     uint32      // owner group ID (st_gid)
                                  Rdev    uint64      // device ID for special files (st_rdev)
                                  Dev     uint64      // device ID of the containing filesystem (st_dev)
                                  Ino     uint64      // inode number (st_ino)
                                  Blocks  int64       // 512-byte blocks allocated (st_blocks)
                                  Blksize int64       // preferred I/O block size
                                  ModTime time.Time   // modification time
                                  Sys     os.FileInfo // underlying os.FileInfo
                              }
                        - R1.3: Must print one line per entry in the format "SIZE\tPATH\n" where SIZE is a right-aligned integer (no leading spaces) and PATH is the relative path as given by the directory traversal.
                        - R1.4: Must not follow symbolic links during traversal. Use pkg/sys.Lstat(path string) (*sys.FileInfo, error) — does not follow symbolic links; returns the symlink's own metadata. pkg/sys.Lstat has the same return type as pkg/sys.Stat (see R1.2 for sys.FileInfo definition).
                        - R1.5: Must process multiple directory arguments in the order given on the command line. Each argument is traversed independently.
                R2:
                    title: Flag behavior
                    items:
                        - R2.1: |
                            -h must display sizes as human-readable strings using binary mode (1024-based). Implement the following algorithm directly in cmd/du (do not call pkg/format.HumanSize):

                              func humanSize(n int64) string {
                                  if n == 0 { return "0" }
                                  suffixes := []string{"", "K", "M", "G", "T", "P", "E"}
                                  f := float64(n)
                                  i := 0
                                  for f >= 1024 && i < len(suffixes)-1 { f /= 1024; i++ }
                                  if i == 0 { return fmt.Sprintf("%d", n) }
                                  if f == float64(int64(f)) { return fmt.Sprintf("%d%s", int64(f), suffixes[i]) }
                                  return fmt.Sprintf("%.1f%s", f, suffixes[i])
                              }

                            -h applies to all output lines including the grand total line when -c is also given.
                        - R2.2: -s must print only one line per argument with the total size of that argument. When -s is given, subdirectory lines must not be printed. -s is equivalent to --max-depth=0.
                        - R2.3: -a must print a size line for every file encountered during traversal, not just directories. Without -a, only directory entries are printed (the default).
                        - R2.4: -d N (and the long form --max-depth=N) must limit the depth of reported entries. Depth 0 means only the argument itself (equivalent to -s). Depth 1 means the argument and its immediate children. Files and directories deeper than N are accumulated into their parent's total but not printed as separate lines.
                        - R2.5: -k must report sizes in 1024-byte blocks. Since 1K is already the default, -k has no visible effect but must be accepted without error for compatibility.
                        - R2.6: -m must report sizes in 1048576-byte (1M) blocks. Each entry's st_blocks value is converted from 512-byte blocks to 1M blocks, rounding up.
                        - R2.7: -c must print a grand total line after all arguments are processed. The grand total line has the format "SIZE\ttotal\n" where SIZE is the sum of all argument totals.
                        - R2.8: --apparent-size must report file sizes using st_size (the apparent file size in bytes) instead of st_blocks (the physical block allocation). The apparent size is then converted to the selected block unit (1K by default, or as overridden by -k, -m, or -h). Obtains st_size from the os.FileInfo.Size() method.
                R3:
                    title: Hard-link deduplication
                    items:
                        - R3.1: Must track files by their device number (st_dev) and inode number (st_ino) across the entire du invocation. A file that has already been counted (same st_dev and st_ino) must not be counted again. This prevents double-counting hard-linked files, matching GNU du behavior (du.c:554 inode tracking via hash table).
                        - R3.2: Must obtain dev and ino via pkg/sys.Stat or pkg/sys.Lstat (see R1.2 for sys.FileInfo). Use sys.FileInfo.Dev uint64 (device ID of the containing filesystem, st_dev) and sys.FileInfo.Ino uint64 (inode number, st_ino) as the deduplication key. The map is keyed by a struct{ Dev, Ino uint64 } pair.
                        - R3.3: Hard-link deduplication applies per du invocation, not per argument. A hard-linked file counted under one argument must not be counted again under a subsequent argument.
                R4:
                    title: Exit codes
                    items:
                        - R4.1: Must exit 0 when all arguments are traversed and reported successfully.
                        - R4.2: Must exit 1 when any error occurs during traversal (cannot stat a file, cannot read a directory, permission denied). Must print a diagnostic to stderr for each error and continue processing remaining entries and arguments before exiting.
                R5:
                    title: Signal handling
                    items:
                        - R5.1: Must install a SIGPIPE handler at startup by calling pkg/sys.InstallSIGPIPEHandler() so that piping du output to head or other truncating consumers does not produce a broken-pipe error message. InstallSIGPIPEHandler uses signal.Notify(c, syscall.SIGPIPE) with a buffered channel; a goroutine calls os.Exit(0) on receipt. Must not use signal.Ignore.
              non_goals:
                - --si (1000-based units) is out of scope; we support only binary (1024-based) human-readable output.
                - --exclude and --exclude-from pattern-based exclusion filters are out of scope.
                - -D / --dereference-args (dereference only command-line symlink arguments) is out of scope.
                - -L / --dereference (dereference all symlinks during traversal) is out of scope.
                - -l / --count-links (count hard-linked files multiple times) is out of scope.
                - --time (show modification time alongside size) is out of scope.
                - --inodes (count inodes instead of block usage) is out of scope.
                - -b / --bytes (equivalent to --apparent-size --block-size=1) is out of scope as a shorthand; --apparent-size with default 1K blocks is sufficient.
                - --block-size=SIZE with arbitrary unit suffixes is out of scope; only -k and -m are supported.
                - -0 / --null (NUL-terminated output) is out of scope.
              acceptance_criteria:
                - 'AC1: Default mode comparison -- gdu and go run ./cmd/du on a test directory fixture produce identical output. Differential tests must use -k to normalize block size and run both binaries on the same directory on the same filesystem.'
                - 'AC2: Summary mode -- gdu -s and go run ./cmd/du -s produce identical single-line output per argument on the same fixture.'
                - 'AC3: Human-readable sizes -- gdu -h and go run ./cmd/du -h produce identical size strings on a fixture with directories of known cumulative sizes.'
                - 'AC4: Hard-link deduplication -- a fixture containing one file hard-linked twice in different subdirectories produces the same total with gdu and the Go binary. The total must count the file''s blocks only once.'
                - 'AC5: Apparent size -- gdu --apparent-size and go run ./cmd/du --apparent-size produce identical output on a fixture containing a sparse file (where apparent size differs from block allocation).'
                - 'AC6: Depth limiting -- gdu -d 1 and go run ./cmd/du -d 1 produce identical output, showing only the top-level entries and the argument total.'
                - 'AC7: Grand total -- gdu -c dir1 dir2 and go run ./cmd/du -c dir1 dir2 produce identical output including the "total" line.'
                - 'AC8: Exit codes -- the Go binary exits 1 when given a non-existent directory argument and prints a diagnostic to stderr, matching gdu behavior.'
                - 'AC9: cmd/du compiles with no warnings under golangci-lint.'
            - file: docs/specs/product-requirements/prd010-ls-extended.yaml
              id: prd010-ls-extended
              title: 'cmd/ls: Extended Flags'
              problem: |
                prd008-ls covers the core flag subset for ls (default listing, -1, -l, -a, -A, -d, --color,
                -h). The extended flags add multi-column layout control (-C, -x), sort order options (-t,
                -S, -r, -U, -v), metadata display (-i, -s, -n), file type classification (-F), and
                recursive listing (-R). These flags require heavier interaction with pkg/format.Columns
                for layout control, pkg/sys.Stat for sort-by-metadata and inode/block display, and more
                complex output normalization in differential tests (inode numbers, block counts, and
                modification times all vary across test runs).

                We extend prd008-ls here. All requirements in prd008-ls remain in force; we add the
                extended flag behavior without repeating core requirements.
              goals:
                - G1: Support multi-column layout control flags (-C, -x) for forced columnar output with vertical or horizontal sorting.
                - G2: Support sort order flags (-t, -S, -r, -U, -v) to control entry ordering by time, size, version, or directory order.
                - G3: Support metadata display flags (-i, -s, -n) for inode numbers, block counts, and numeric user/group IDs.
                - G4: Support file type classification (-F) to append type indicators to entry names.
                - G5: Support recursive directory listing (-R) to list subdirectory contents.
              requirements:
                R1:
                    title: Multi-column layout (-C, -x)
                    items:
                        - R1.1: |
                            -C must force multi-column output regardless of whether stdout is a TTY. Layout uses pkg/format.Columns(entries []string, termWidth int) [][]string — distributes entries into the maximum number of columns fitting within termWidth, with column widths computed as per-column maxima. Terminal width is obtained via pkg/sys.TerminalWidth() (int, error) — returns current terminal column count via TIOCGWINSZ ioctl; returns error when stdout is not a terminal. When stdout is not a TTY, -C must use a default width of 80 columns (matching GNU ls behavior when stdout is not a TTY and -C is given without -w).
                        - R1.2: -C must sort entries vertically (down columns, then across to the next column). This is the same sort direction as the default multi-column mode in prd008-ls R1.1.
                        - R1.3: -x must produce multi-column output with entries sorted horizontally (across columns, then down to the next row). This differs from -C which sorts vertically.
                        - R1.4: -C and -x are mutually exclusive with -l and -1. If -l or -1 appears after -C or -x on the command line, it overrides the multi-column mode. If -C or -x appears after -l or -1, it overrides the long or single-column format. The last format flag wins, matching GNU ls behavior.
                R2:
                    title: Sort order (-t, -S, -r, -U, -v)
                    items:
                        - R2.1: |
                            -t must sort entries by modification time, newest first. Obtain metadata via pkg/sys.Lstat(path string) (*sys.FileInfo, error); use sys.FileInfo.ModTime time.Time for comparison (fi.ModTime.After(fj.ModTime) for newest-first ordering). Entries with the same modification time must be sorted by name in C locale order as a tiebreaker.
                        - R2.2: |
                            -S must sort entries by file size (st_size), largest first. Obtain file size from sys.FileInfo.Size int64 — apparent file size in bytes (st_size). Entries with the same size must be sorted by name in C locale order as a tiebreaker.
                        - R2.3: -r must reverse the current sort order. -r applies to whichever sort is active (name sort by default, -t for time, -S for size, -v for version). -r with the default sort produces reverse alphabetical order.
                        - R2.4: -U must disable sorting entirely and list entries in directory order (the order returned by readdir). -U overrides -t, -S, and -v. -r with -U has no defined effect (directory order is not reversible in a meaningful way), but must be accepted without error.
                        - R2.5: -v must sort entries using natural version sort semantics (strverscmp behavior). Runs of digits within filenames are compared numerically rather than lexicographically, so "file2" sorts before "file10". Must be implemented without external libraries.
                        - R2.6: When multiple sort flags are given, the last one on the command line takes precedence, matching GNU ls behavior.
                R3:
                    title: Metadata display (-i, -s, -n)
                    items:
                        - R3.1: |
                            -i must prepend the inode number of each entry before the entry name (or before the permissions in -l mode). Obtain the inode number via pkg/sys.Lstat(path string) (*sys.FileInfo, error) and read sys.FileInfo.Ino uint64 — inode number (st_ino). The inode number is right-aligned in a column wide enough for the largest inode in the listing.
                        - R3.2: |
                            -s must prepend the allocated block count for each entry before the entry name (or before the permissions in -l mode). Obtain the block count via pkg/sys.Lstat(path string) (*sys.FileInfo, error) and read sys.FileInfo.Blocks int64 — number of 512-byte blocks allocated (st_blocks). Report in 1024-byte block units: fi.Blocks / 2. The block count is right-aligned in a column wide enough for the largest count in the listing.
                        - R3.3: -s with -l must also modify the "total N" line to include block counts in the selected unit. The total is the sum of all listed entries' block allocations.
                        - R3.4: |
                            -n must activate long format (implies -l) and display numeric UID and GID instead of resolving owner and group names. Format UID as strconv.FormatUint(uint64(fi.Uid), 10) and GID as strconv.FormatUint(uint64(fi.Gid), 10), where fi.Uid uint32 and fi.Gid uint32 come from pkg/sys.Lstat. Do not call os/user.LookupId or os/user.LookupGroupId.
                        - R3.5: -i and -s may be combined. When both are given, inode is printed first, then block count, then the entry (or the long-format fields).
                R4:
                    title: File type classification (-F)
                    items:
                        - R4.1: -F must append a type indicator character after each entry name. The indicators are "/" for directories, "*" for executable regular files, "@" for symbolic links, "|" for named pipes (FIFOs), "=" for sockets. Regular non-executable files receive no indicator.
                        - R4.2: Executable is defined as having any execute bit set (owner, group, or other) in the file's permission mode.
                        - R4.3: -F must work with all output formats (-l, -1, -C, -x) and with color output. When color is enabled, the indicator character is printed after the ANSI reset sequence so it is not colorized.
                R5:
                    title: Recursive listing (-R)
                    items:
                        - R5.1: -R must recursively list the contents of each subdirectory encountered during the listing. Each subdirectory's contents are printed under a header line in the format "PATH:" followed by a blank line, then the directory contents, then a blank line before the next entry.
                        - R5.2: -R must respect the current format mode. With -l, each subdirectory's contents are listed in long format including the "total N" block line. With -C or default mode, each subdirectory's contents use multi-column layout.
                        - R5.3: -R must not follow symbolic links to directories. Only real subdirectories are recursed into.
                        - R5.4: -R must apply the current filter flags (-a, -A) to each subdirectory. Dotfiles in subdirectories are shown only if -a or -A is given.
                        - R5.5: -R must list directories in the same sort order as entries within a directory. If -t is active, subdirectories are recursed into in modification-time order.
                R6:
                    title: Flag interactions
                    items:
                        - R6.1: -n implies -l. When -n is given without -l, the output must be in long format with numeric UID/GID.
                        - R6.2: -C and -x are mutually exclusive with -l and -1. The last format flag on the command line wins (see R1.4).
                        - R6.3: -R with -l must produce a "total N" block line for each subdirectory listing, matching GNU ls -lR output.
                        - R6.4: -i, -s, and -F may all be combined with -R. Each subdirectory listing applies the same metadata display and classification options.
                        - R6.5: |
                            -h must apply to -s block counts when both -s and -h are given, converting block counts to human-readable form. Use the following binary HumanSize algorithm directly in cmd/ls (do not call pkg/format.HumanSize):

                              func humanSize(n int64) string {
                                  if n == 0 { return "0" }
                                  suffixes := []string{"", "K", "M", "G", "T", "P", "E"}
                                  f := float64(n)
                                  i := 0
                                  for f >= 1024 && i < len(suffixes)-1 { f /= 1024; i++ }
                                  if i == 0 { return fmt.Sprintf("%d", n) }
                                  if f == float64(int64(f)) { return fmt.Sprintf("%d%s", int64(f), suffixes[i]) }
                                  return fmt.Sprintf("%.1f%s", f, suffixes[i])
                              }
              non_goals:
                - --hyperlink (terminal hyperlinks) remains out of scope for this project.
                - --dired (Emacs dired mode) remains out of scope.
                - -Z (SELinux security context) remains out of scope.
                - --quoting-style (filename quoting) remains out of scope.
                - --block-size=SIZE with arbitrary unit suffixes remains out of scope.
                - LS_COLORS environment variable parsing remains out of scope.
                - ACL display in long format (the "+" indicator) remains out of scope.
                - --group-directories-first is out of scope for this release.
                - -w / --width (explicit width override) is out of scope; terminal width is queried via pkg/sys.
                - --sort=WORD (long-form sort option) is out of scope; only short flags (-t, -S, -r, -U, -v) are supported.
              acceptance_criteria:
                - 'AC1: Multi-column forced -- gls -C and go run ./cmd/ls -C produce identical column layout on a test fixture when both are given the same terminal width. Output must be piped (stdout not a TTY) to verify that -C forces multi-column even without a TTY.'
                - 'AC2: Horizontal sort -- gls -x and go run ./cmd/ls -x produce identical output on a fixture. Entries must be arranged across rows first, then down.'
                - 'AC3: Time sort -- gls -t and go run ./cmd/ls -t produce identical output on a fixture with files of known different modification times. Tests must create files with explicit mtimes to ensure deterministic ordering.'
                - 'AC4: Size sort -- gls -S and go run ./cmd/ls -S produce identical output on a fixture with files of known different sizes.'
                - 'AC5: Reverse sort -- gls -r and go run ./cmd/ls -r produce identical reverse-alphabetical output. gls -tr and the Go binary with -tr produce identical reverse-time output.'
                - 'AC6: Inode display -- gls -i and go run ./cmd/ls -i produce identical output when run on the same live fixture on the same filesystem (inode numbers match because both binaries stat the same files).'
                - 'AC7: Block count display -- gls -s and go run ./cmd/ls -s produce identical output. Differential tests must use the same filesystem to ensure block counts match.'
                - 'AC8: Numeric IDs -- gls -n and go run ./cmd/ls -n produce identical long-format output with numeric UID and GID instead of user/group names.'
                - 'AC9: Classify -- gls -F and go run ./cmd/ls -F produce identical output on a fixture containing a directory, a regular file, an executable, a symlink, and a named pipe.'
                - 'AC10: Recursive listing -- gls -R and go run ./cmd/ls -R produce identical output on a fixture with nested subdirectories, including the "path:" headers and blank-line separators.'
                - 'AC11: Version sort -- gls -v and go run ./cmd/ls -v produce identical output on a fixture containing files named file1, file2, file10, file20 (verifying numeric-aware sort).'
                - 'AC12: cmd/ls with extended flags compiles with no warnings under golangci-lint.'
        use_cases:
            - file: docs/specs/use-cases/rel01.0-uc001-ts.yaml
              id: rel01.0-uc001-ts
              title: Timestamp stdin lines via ts
              summary: |
                The operator runs a log-producing command piped through the Go ts binary. The binary
                reads stdin line by line and writes each line to stdout prefixed with a strftime
                timestamp. The differential testing harness then runs both the Go binary and the
                Homebrew reference binary (ts from moreutils) with the same stdin input and confirms
                that their outputs are identical after timestamp normalization.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd004-ts.yaml) and invokes do-work to produce
                a passing differential test for cmd/ts.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go ts binary with a known stdin input and a format flag.
                    Example: printf 'line1\nline2\nline3\n' | ./bin/ts '%H:%M:%S'
                - id: F2
                  step: |
                    cmd/ts reads each line from stdin. For each line, it calls time.Now() to get the
                    current time, formats it with the strftime-equivalent using the given format string,
                    and writes "<timestamp> <line>" to stdout.
                - id: F3
                  step: |
                    The output is three lines, each prefixed with an HH:MM:SS timestamp.
                - id: F4
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/ts and the
                    reference ts binary with the same stdin content, args, and environment.
                - id: F5
                  step: |
                    The harness applies the TimestampNormalizer from pkg/testutils to both outputs,
                    replacing the HH:MM:SS timestamp prefix with a fixed placeholder string
                    (e.g., "HH:MM:SS").
                - id: F6
                  step: |
                    The harness compares the normalized outputs byte-for-byte. Both binaries must
                    produce the same line structure: three lines each starting with the placeholder
                    followed by a space and the original line content.
                - id: F7
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports
                    the triggering args, both raw outputs, and both normalized outputs.
              touchpoints:
                - T1: cmd/ts — timestamp prefix logic, all flag modes (prd004-ts R1, R2, R3, R4, R5, R6, R7, R8)
                - T2: pkg/testutils — RunDiffTests, TimestampNormalizer, binary execution and comparison (prd001-testutils)
                - T3: Human Operator — triggers use case via do-work after prd004-ts is complete
              success_criteria:
                - criterion: cmd/ts compiles and ./bin/ts exists after mage build.
                  id: S1
                - criterion: |
                    printf 'line1\nline2\nline3\n' | ./bin/ts produces three lines each prefixed
                    with a timestamp in the default format "%b %d %H:%M:%S".
                  id: S2
                - criterion: |
                    The differential test for the default format mode passes: normalized output from
                    ./bin/ts matches normalized output from the reference ts binary on three-line stdin.
                  id: S3
                - criterion: |
                    The differential test for -s mode passes: elapsed timestamps increase monotonically
                    across lines and normalized outputs match.
                  id: S4
                - criterion: |
                    The differential test for -i mode passes: per-line incremental timestamps and
                    normalized outputs match.
                  id: S5
                - criterion: Empty stdin (immediate EOF) produces no output and exits 0 for both binaries.
                  id: S6
                - criterion: go test ./cmd/ts/... passes with no failures.
                  id: S7
              out_of_scope:
                - -r mode (relative timestamp conversion) is covered by tests in the test suite but is not the primary flow of this use case.
                - -m mode (monotonic clock) differential testing is noted in the test suite but excluded from the primary flow because the reference binary and Go binary may use different monotonic sources.
                - The use case does not cover cmd/ts code generation by the orchestrator; that is handled by the cobbler:stitch mage target.
              test_suite: test-rel01.0
            - file: docs/specs/use-cases/rel01.1-uc001-wc.yaml
              id: rel01.1-uc001-wc
              title: Count lines, words, and bytes via wc
              summary: |
                The operator runs the Go wc binary on one or more files or stdin. The binary counts
                lines, words, and bytes (or characters, or max line length) and writes formatted results
                to stdout. The differential testing harness then runs both the Go binary and the Homebrew
                reference binary (gwc from coreutils) with the same stdin, args, and environment and
                confirms that their outputs are identical byte-for-byte. No output normalization is
                needed because wc output consists of deterministic integer counts.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd005-wc.yaml) and invokes do-work to produce
                a passing differential test for cmd/wc.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go wc binary with stdin input or file arguments.
                    Example: printf 'foo\nbar baz\n' | ./bin/wc
                - id: F2
                  step: |
                    cmd/wc reads from stdin or the named files. For each input, it counts newlines (-l),
                    words (-w), bytes (-c), characters (-m), and max line length (-L) as requested by the
                    active flags. When no flags are given, it counts lines, words, and bytes.
                - id: F3
                  step: |
                    cmd/wc writes one line per input in the format "COUNT COUNT COUNT FILENAME" with
                    right-aligned columns. For stdin with no filename, the filename is omitted.
                - id: F4
                  step: |
                    When multiple files are given, cmd/wc prints a "total" line with the sum of all counts.
                - id: F5
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/wc and gwc with
                    the same stdin, args, and environment.
                - id: F6
                  step: |
                    The harness compares stdout byte-for-byte with no normalization. Both binaries must
                    produce identical count values and column alignment.
                - id: F7
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports the
                    triggering args, both outputs, and both exit codes.
              touchpoints:
                - T1: cmd/wc — line, word, byte, char, max-line-length counting, multi-file totals (prd005-wc R1, R2, R3, R4, R5, R6)
                - T2: pkg/testutils — RunDiffTests, binary execution and comparison
              success_criteria:
                - criterion: cmd/wc compiles and ./bin/wc exists after mage build.
                  id: S1
                - criterion: |
                    printf 'foo\nbar baz\n' | ./bin/wc produces '2 3 12' (matching gwc output format).
                  id: S2
                - criterion: |
                    The differential test for default mode passes: ./bin/wc and gwc produce identical
                    output on three-line stdin.
                  id: S3
                - criterion: |
                    The differential tests for -l, -w, and -c flags each pass: outputs match gwc
                    byte-for-byte.
                  id: S4
                - criterion: |
                    The differential test for -m with LC_ALL=C passes: character count matches byte
                    count under the C locale.
                  id: S5
                - criterion: |
                    The differential test for -L passes: max line length matches gwc on multi-line input
                    with varying line lengths.
                  id: S6
                - criterion: |
                    The differential test for multi-file with total line passes: right-aligned columns
                    and the "total" label match gwc output byte-for-byte.
                  id: S7
                - criterion: |
                    Empty stdin produces '0 0 0' for default flags, matching gwc.
                  id: S8
                - criterion: |
                    A non-existent file argument produces an error to stderr, exits 1, and still processes
                    other files on the command line, matching gwc behavior.
                  id: S9
              out_of_scope:
                - --files0-from is covered in the test suite but is not the primary flow of this use case.
                - --total=always and --total=only are covered in the test suite but are not part of the primary flow.
                - Binary input edge cases are covered in the test suite but are not the primary flow.
              test_suite: test-rel01.1
            - file: docs/specs/use-cases/rel01.1-uc002-cat.yaml
              id: rel01.1-uc002-cat
              title: Concatenate and display files via cat
              summary: |
                The operator runs the Go cat binary on one or more files or stdin. The binary concatenates
                input to stdout, optionally applying line numbering, blank-line squeezing, or non-printing
                character display. The differential testing harness then runs both the Go binary and the
                Homebrew reference binary (gcat from coreutils) with the same stdin, args, and environment
                and confirms that their outputs are identical byte-for-byte. No output normalization is
                needed because cat output is deterministic.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd006-cat.yaml) and invokes do-work to produce
                a passing differential test for cmd/cat.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go cat binary with file arguments or stdin.
                    Example: printf 'hello\nworld\n' | ./bin/cat -n
                - id: F2
                  step: |
                    cmd/cat reads from each named file in order (or stdin when no files are given or when
                    "-" is given). It applies the active transformations in order: squeeze blanks (-s),
                    non-printing display (-v/-T), end-of-line marker (-E), line number prefix (-n/-b).
                - id: F3
                  step: |
                    cmd/cat writes the transformed content to stdout. With no flags, output is the
                    verbatim concatenation of all inputs.
                - id: F4
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/cat and gcat
                    with the same stdin, args, and environment.
                - id: F5
                  step: |
                    The harness compares stdout byte-for-byte with no normalization. Both binaries must
                    produce identical output bytes.
                - id: F6
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports the
                    triggering args, both outputs, and both exit codes.
              touchpoints:
                - T1: cmd/cat — concatenation, line numbering, blank squeezing, non-printing display (prd006-cat R1, R2, R3, R4, R5)
                - T2: pkg/testutils — RunDiffTests, binary execution and comparison
              success_criteria:
                - criterion: cmd/cat compiles and ./bin/cat exists after mage build.
                  id: S1
                - criterion: |
                    ./bin/cat file1 file2 produces identical bytes to gcat file1 file2 for text files.
                  id: S2
                - criterion: |
                    The differential test for default mode passes: ./bin/cat and gcat produce identical
                    output on multi-file text input.
                  id: S3
                - criterion: |
                    The differential test for -n passes: line numbers match gcat output byte-for-byte
                    (format, width, tab separator).
                  id: S4
                - criterion: |
                    The differential test for -b passes: only non-blank lines are numbered, matching
                    gcat -b output.
                  id: S5
                - criterion: |
                    The differential test for -s passes: consecutive blank lines are collapsed to one,
                    matching gcat -s output.
                  id: S6
                - criterion: |
                    The differential test for -v passes: non-printing characters are displayed with
                    correct caret and M- notation, matching gcat -v byte-for-byte on binary input.
                  id: S7
                - criterion: |
                    The differential test for -A passes: combined -vET transformations match gcat -A
                    byte-for-byte.
                  id: S8
                - criterion: |
                    The differential test for multiple files passes: files are concatenated with no
                    separator, matching gcat output.
                  id: S9
                - criterion: |
                    A non-existent file argument produces an error to stderr, exits 1, and still
                    processes other files on the command line, matching gcat behavior.
                  id: S10
              out_of_scope:
                - FIONREAD ioctl optimization is not tested; correctness is the only requirement.
                - Same-file detection warning (cat reading from its own output) is not tested.
                - -u flag is accepted but has no observable effect; a test verifies acceptance only.
              test_suite: test-rel01.1
            - file: docs/specs/use-cases/rel01.1-uc003-sponge.yaml
              id: rel01.1-uc003-sponge
              title: Soak stdin and write to file via sponge
              summary: |
                The operator runs a pipeline that reads a file, transforms it, and pipes the result through
                the Go sponge binary back to the same file. sponge reads all of stdin before opening the
                output file, making the idiom "cmd file | sponge file" safe. The differential testing
                harness runs both the Go binary and the Homebrew reference binary (sponge from moreutils)
                with the same stdin and arguments, then compares the output file contents byte-for-byte.
                Unlike wc and cat, sponge verification uses file-content comparison, not stdout comparison.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd007-sponge.yaml) and invokes do-work to produce
                a passing differential test for cmd/sponge.
              flow:
                - id: F1
                  step: |
                    The operator runs a pipeline that pipes file content through the Go sponge binary back
                    to the same file. Example: cat data.txt | ./bin/sponge data.txt
                - id: F2
                  step: |
                    cmd/sponge reads all bytes from stdin into an in-memory buffer. If the buffer exceeds
                    the memory threshold, sponge spills to a temp file and continues reading. The output
                    file is not opened during this phase.
                - id: F3
                  step: |
                    After stdin reaches EOF, cmd/sponge opens the output file. If the output file already
                    exists, sponge reads its permissions for later restoration. In append mode (-a), sponge
                    prepends the original file content to the buffered stdin content.
                - id: F4
                  step: |
                    cmd/sponge writes the buffered content to a temp file, then atomically renames the temp
                    file to the output path. If the rename fails (cross-device), sponge falls back to a
                    byte-for-byte copy.
                - id: F5
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/sponge and the
                    reference sponge binary with the same stdin, args, and environment in isolated temp
                    directories.
                - id: F6
                  step: |
                    The harness compares the output file contents byte-for-byte using the file-state
                    comparison capability (prd001-testutils R5). Both binaries must produce identical
                    output file content.
                - id: F7
                  step: |
                    If the file contents match, the test passes. If they diverge, the harness reports the
                    triggering args, both file contents, and both exit codes.
              touchpoints:
                - T1: cmd/sponge — soak-before-write contract, atomic rename, append mode, passthrough (prd007-sponge R1, R2, R3, R4, R5)
                - T2: pkg/testutils — RunDiffTests, file-state comparison
              success_criteria:
                - criterion: cmd/sponge compiles and ./bin/sponge exists after mage build.
                  id: S1
                - criterion: |
                    The soak-before-write contract holds: "cat file | ./bin/sponge file" produces a file
                    containing the original content (not empty or truncated), confirming sponge did not
                    open the output file until stdin was fully consumed.
                  id: S2
                - criterion: |
                    Passthrough mode works: "printf 'hello' | ./bin/sponge" writes 'hello' to stdout,
                    matching the reference binary.
                  id: S3
                - criterion: |
                    Append mode works: "printf 'appended\n' | ./bin/sponge -a existing.txt" produces a
                    file containing [original content][appended\n], matching the reference binary.
                  id: S4
                - criterion: |
                    Large input (1 MB or more) triggers temp-file spill and produces correct output file
                    content, matching the reference binary.
                  id: S5
                - criterion: |
                    File permissions are preserved: an output file with mode 0640 retains that mode after
                    sponge overwrites it.
                  id: S6
                - criterion: |
                    The differential test passes for all modes: small stdin, large stdin, append, passthrough,
                    and soak-before-write contract.
                  id: S7
              out_of_scope:
                - Cross-device rename fallback is covered in the test suite but is not the primary flow.
                - SIGINT/SIGTERM cleanup behavior is specified in the PRD but is not directly testable in the differential harness; it is verified by manual inspection.
                - Memory threshold tuning is not tested; the spill path is exercised by the large-input test.
              test_suite: test-rel01.1
            - file: docs/specs/use-cases/rel02.0-uc001-ls.yaml
              id: rel02.0-uc001-ls
              title: List directory contents via ls (core flags)
              summary: |
                The operator runs the Go ls binary on a known fixture directory with core flags (default,
                -1, -l, -a, -A, -d, --color, -h). The differential testing harness runs both the Go binary
                and the Homebrew reference binary (gls from coreutils) with the same arguments and
                environment, applies an LsNormalizer to both outputs (replacing mtime columns with a fixed
                placeholder), and confirms that the normalized outputs are identical. All tests run with
                --color=never and LC_ALL=C to eliminate ANSI and locale variance.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd008-ls.yaml) and shared component PRDs
                (prd002-sys, prd003-format) and invokes do-work to produce a passing differential
                test for cmd/ls core flags.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go ls binary on a fixture directory with known file types,
                    sizes, and permissions. Example: ./bin/ls --color=never testdata/ls-fixture/
                - id: F2
                  step: |
                    cmd/ls reads the directory entries, queries terminal width via pkg/sys.TerminalWidth
                    (for default multi-column mode), and obtains file metadata via pkg/sys.Stat for long
                    format. It formats output via pkg/format.Columns (multi-column) or inline formatting
                    (long format with pkg/format.HumanSize for -h).
                - id: F3
                  step: |
                    cmd/ls writes the formatted listing to stdout. The format depends on the active flags:
                    multi-column (default TTY), single-column (default pipe or -1), or long format (-l).
                - id: F4
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/ls and gls with
                    the same arguments, environment (LC_ALL=C, --color=never), and working directory.
                - id: F5
                  step: |
                    The harness applies the LsNormalizer to both outputs. The LsNormalizer replaces the
                    modification time column in -l output (fields matching "Mon DD HH:MM" or "Mon DD  YYYY")
                    with the placeholder "MTIME". This eliminates wall-clock divergence between runs.
                - id: F6
                  step: |
                    The harness compares the normalized outputs byte-for-byte. Both binaries must produce
                    identical entry names, sort order, column layout, and field values (permissions,
                    hard-link count, owner, group, size).
                - id: F7
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports the
                    triggering args, both raw outputs, both normalized outputs, and both exit codes.
              touchpoints:
                - T1: cmd/ls — directory listing, format modes, filter flags, color, human sizes (prd008-ls R1, R2, R3, R4, R5, R6, R7)
                - T2: pkg/sys — TerminalWidth, Stat/Lstat, IsTerminal, InstallSIGPIPEHandler, OnTerminalResize (prd002-sys)
                - T3: pkg/format — Columns, FileTypeColor, HumanSize (prd003-format)
                - T4: pkg/testutils — RunDiffTests, LsNormalizer, binary execution and comparison
              success_criteria:
                - criterion: cmd/ls compiles and ./bin/ls exists after mage build.
                  id: S1
                - criterion: |
                    Default mode with stdout redirected (not a TTY) produces single-column output with
                    one entry per line, matching gls output on the same fixture.
                  id: S2
                - criterion: |
                    -l long format produces identical output to gls -l after MTIME normalization on the
                    same fixture directory.
                  id: S3
                - criterion: |
                    -a includes dotfiles (including . and ..) and matches gls -a output on a fixture
                    containing dotfiles.
                  id: S4
                - criterion: |
                    --color=never produces output with no ANSI escape sequences, matching gls --color=never
                    byte-for-byte.
                  id: S5
                - criterion: |
                    -lh produces human-readable file sizes that match gls -lh on files with known sizes.
                  id: S6
                - criterion: |
                    The differential test passes for all core flags: default (single-col redirect),
                    -1, -l, -lh, -a, -A, -d, --color=never. All tests use LC_ALL=C and --color=never
                    (except color-specific tests).
                  id: S7
              out_of_scope:
                - Default multi-column mode on a real TTY is difficult to test deterministically in the harness; we test -C explicitly in the ls extended use case (rel02.1).
                - Owner/group name normalization is not applied; tests use a fixture where files are owned by the test runner's UID/GID, ensuring consistency.
                - SIGWINCH behavior is specified in prd008-ls R7.2 but is not directly testable in the differential harness.
              test_suite: test-rel02.0
            - file: docs/specs/use-cases/rel02.0-uc002-du.yaml
              id: rel02.0-uc002-du
              title: Report recursive directory disk usage via du
              summary: |
                The operator runs the Go du binary on a fixture directory to report disk usage. The
                differential testing harness runs both the Go binary and the Homebrew reference binary
                (gdu from coreutils) on the same directory on the same filesystem with the same arguments
                and environment, and confirms that their outputs are identical byte-for-byte. Block counts
                are deterministic when both binaries stat the same files on the same filesystem. All tests
                use -k to pin output to 1024-byte blocks and eliminate platform block-size default variance.
              actor: Human Operator
              trigger: |
                The operator has completed the PRD (prd009-du.yaml) and shared component PRDs
                (prd002-sys, prd003-format) and invokes do-work to produce a passing differential
                test for cmd/du.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go du binary on a fixture directory with known file sizes and
                    directory structure. Example: ./bin/du -k testdata/du-fixture/
                - id: F2
                  step: |
                    cmd/du traverses the directory tree using os.ReadDir (or filepath.Walk), calling
                    pkg/sys.Lstat on each entry to obtain st_blocks for block counts and st_dev/st_ino
                    for hard-link deduplication. It accumulates block counts per directory.
                - id: F3
                  step: |
                    cmd/du writes one line per directory (or per file with -a) in the format
                    "SIZE\tPATH\n". With -h, sizes are formatted via pkg/format.HumanSize.
                - id: F4
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/du and gdu with
                    the same arguments, environment, and working directory.
                - id: F5
                  step: |
                    The harness compares stdout byte-for-byte with no normalization. Both binaries must
                    produce identical size values and path listings because they stat the same files on
                    the same filesystem.
                - id: F6
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports the
                    triggering args, both outputs, and both exit codes.
              touchpoints:
                - T1: cmd/du — recursive traversal, block accumulation, hard-link dedup, flag modes (prd009-du R1, R2, R3, R4, R5)
                - T2: pkg/sys — Stat/Lstat for st_blocks, st_dev, st_ino, InstallSIGPIPEHandler
                - T3: pkg/format — HumanSize for -h output
                - T4: pkg/testutils — RunDiffTests, binary execution and comparison
              success_criteria:
                - criterion: cmd/du compiles and ./bin/du exists after mage build.
                  id: S1
                - criterion: |
                    Default recursive mode produces one line per subdirectory and the root directory,
                    matching gdu -k output on the same fixture.
                  id: S2
                - criterion: |
                    -s summary mode produces one line per argument with the total size, matching gdu -sk
                    output.
                  id: S3
                - criterion: |
                    -a all-files mode produces one line per file and directory, matching gdu -ak output.
                  id: S4
                - criterion: |
                    -h human-readable mode produces size strings (K/M/G) that match gdu -h output on the
                    same fixture.
                  id: S5
                - criterion: |
                    -c grand total mode produces a "total" line after all arguments, matching gdu -ck output.
                  id: S6
                - criterion: |
                    Hard-link deduplication works: a fixture with two directory entries pointing to the same
                    inode produces a total that counts the file's blocks only once, matching gdu behavior.
                  id: S7
                - criterion: |
                    --apparent-size mode uses st_size instead of st_blocks, matching gdu --apparent-size
                    output.
                  id: S8
                - criterion: |
                    The differential test passes for all flag combinations: default -k, -sk, -ak, -h,
                    -ck, -d 1, --apparent-size, and missing path.
                  id: S9
              out_of_scope:
                - Cross-filesystem behavior (files on different mount points) is not tested in the differential harness; both binaries see the same single filesystem.
                - SIGPIPE handling is specified in prd009-du R5.1 but is not directly testable in the differential harness.
                - Sparse file creation depends on the filesystem; --apparent-size tests use a regular file with known size rather than a true sparse file.
              test_suite: test-rel02.0
            - file: docs/specs/use-cases/rel02.1-uc001-ls-extended.yaml
              id: rel02.1-uc001-ls-extended
              title: List directory contents via ls (extended flags)
              summary: |
                The operator runs the Go ls binary with extended flags (-C, -x, -t, -S, -r, -U, -v, -i,
                -s, -n, -F, -R) on a fixture directory. The differential testing harness runs both the Go
                binary and the Homebrew reference binary (gls from coreutils) with the same arguments and
                environment, applies an LsExtendedNormalizer (which extends the core LsNormalizer with
                mtime replacement across recursive subdirectory listings), and confirms that the normalized
                outputs are identical. All tests use LC_ALL=C and --color=never. Fixture files have
                controlled sizes, mtimes, and permissions to ensure deterministic sort order.
              actor: Human Operator
              trigger: |
                The operator has completed prd010-ls-extended.yaml (extended flags PRD) and the core
                ls PRD (prd008-ls.yaml) and invokes do-work to produce a passing differential test for
                cmd/ls extended flags.
              flow:
                - id: F1
                  step: |
                    The operator runs the Go ls binary with extended flags on a fixture directory with
                    controlled file sizes, mtimes, and types. Example: ./bin/ls -lR --color=never testdata/ls-fixture/
                - id: F2
                  step: |
                    cmd/ls reads directory entries and obtains file metadata via pkg/sys.Stat for sort-by-time
                    (-t), sort-by-size (-S), inode display (-i), and block count display (-s). It formats
                    multi-column output via pkg/format.Columns for -C and -x modes.
                - id: F3
                  step: |
                    For -R (recursive), cmd/ls descends into each subdirectory and prints a "path:" header
                    followed by the directory contents in the active format mode. Each subdirectory listing
                    applies the same flags (sort, filter, format, metadata).
                - id: F4
                  step: |
                    The differential testing harness (pkg/testutils) executes both ./bin/ls and gls with
                    the same arguments, environment (LC_ALL=C, --color=never), and working directory.
                - id: F5
                  step: |
                    The harness applies the LsExtendedNormalizer to both outputs. This normalizer replaces
                    all mtime fields (in long-format output and in recursive subdirectory listings) with the
                    placeholder "MTIME". Inode numbers and block counts are not normalized; both binaries
                    stat the same files on the same filesystem, producing identical values.
                - id: F6
                  step: |
                    The harness compares the normalized outputs byte-for-byte. Both binaries must produce
                    identical sort order, column layout, metadata values, type indicators, and recursive
                    subdirectory structure.
                - id: F7
                  step: |
                    If the outputs match, the test passes. If they diverge, the harness reports the
                    triggering args, both raw outputs, both normalized outputs, and both exit codes.
              touchpoints:
                - T1: cmd/ls — multi-column layout, sort order, metadata display, classify, recursive (prd010-ls-extended R1, R2, R3, R4, R5, R6)
                - T2: pkg/sys — TerminalWidth, Stat/Lstat for mtime, size, inode, blocks
                - T3: pkg/format — Columns for -C/-x, FileTypeColor, HumanSize for -s -h
                - T4: pkg/testutils — RunDiffTests, LsExtendedNormalizer
              success_criteria:
                - criterion: |
                    -C produces multi-column output even when stdout is piped, matching gls -C output on
                    the same fixture with a fixed column width.
                  id: S1
                - criterion: |
                    -x produces horizontal-sorted multi-column output, matching gls -x.
                  id: S2
                - criterion: |
                    -t sorts entries by modification time (newest first) on a fixture with files of known
                    distinct mtimes, matching gls -t output.
                  id: S3
                - criterion: |
                    -S sorts entries by size (largest first), matching gls -S output.
                  id: S4
                - criterion: |
                    -r reverses the sort order, matching gls -r output.
                  id: S5
                - criterion: |
                    -i prepends inode numbers to each entry, matching gls -i on the same fixture.
                  id: S6
                - criterion: |
                    -s prepends block counts to each entry, matching gls -s on the same fixture.
                  id: S7
                - criterion: |
                    -n produces long format with numeric UID/GID instead of names, matching gls -n after
                    MTIME normalization.
                  id: S8
                - criterion: |
                    -F appends type indicators (/, *, @, |, =) matching gls -F on a fixture with a
                    directory, executable, symlink, and named pipe.
                  id: S9
                - criterion: |
                    -R recursively lists subdirectories with "path:" headers and blank-line separators,
                    matching gls -R after MTIME normalization.
                  id: S10
                - criterion: |
                    The differential test passes for all extended flags: -C, -x, -t, -S, -r, -U, -v, -i,
                    -s, -n, -F, -R, and combinations (-Rl, -tr, -SF).
                  id: S11
              out_of_scope:
                - -v (version sort) test uses a simple fixture with files named file1, file2, file10; full strverscmp edge cases are not exercised in the differential test.
                - -U (unsorted) output order depends on filesystem directory order; both binaries produce the same order when reading the same directory, so comparison is valid but not a test of Go-specific behavior.
                - SIGWINCH and terminal resize behavior during -R recursive listing is not testable in the differential harness.
              test_suite: test-rel02.1
        test_suites:
            - file: docs/specs/test-suites/test-rel01.0.yaml
              id: test-rel01.0
              title: 'Test Suite: rel01.0 — ts timestamp stdin lines'
              release: rel01.0
              traces:
                - rel01.0-uc001-ts
                - prd004-ts R1
                - prd004-ts R2
                - prd004-ts R3
                - prd004-ts R4
                - prd004-ts R5
                - prd004-ts R6
                - prd004-ts R7
              preconditions:
                - ./bin/ts exists (built via mage build).
                - The reference binary ts is installed (brew install moreutils) and on PATH.
                - Tests are run via go test ./cmd/ts/... which invokes RunDiffTests from pkg/testutils.
                - TimestampNormalizer is applied to all tests whose output contains wall-clock timestamps.
                - All tests use LC_ALL=C and TZ=America/New_York (or a fixed known zone) to ensure consistent strftime output between runs.
              test_cases:
                - name: default_format_three_lines
                  description: Default format ("%b %d %H:%M:%S") with three-line stdin.
                  inputs:
                    args: []
                    stdin: "line1\nline2\nline3\n"
                    env: []
                  normalization: TimestampNormalizer replaces "%b %d %H:%M:%S"-matching prefixes with "TIMESTAMP"
                  expected:
                    exit_code: 0
                    stdout_structure: three lines, each matching "TIMESTAMP line1", "TIMESTAMP line2", "TIMESTAMP line3"
                    stderr: ""
                  traces:
                    - prd004-ts R1.1
                    - prd004-ts R1.2
                    - prd004-ts R1.4
                - name: default_format_empty_stdin
                  description: Empty stdin produces no output and exits 0.
                  inputs:
                    args: []
                    stdin: ""
                    env: []
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout: ""
                    stderr: ""
                  traces:
                    - prd004-ts R1.6
                - name: default_format_partial_last_line
                  description: Stdin with no trailing newline; partial line must be timestamped.
                  inputs:
                    args: []
                    stdin: "partial"
