            8 | package main
            10 | import (
            11 | 	"bytes"
            12 | 	"fmt"
            13 | 	"os"
            14 | 	"os/exec"
            15 | 	"path/filepath"
            16 | 	"testing"
            18 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            19 | )
            21 | // goBinary is the path to the compiled Go cat binary. Set by TestMain.
            22 | var goBinary string
            24 | // refBinary is the path to the GNU gcat reference binary. Set by TestMain.
            25 | var refBinary string
            27 | // TestMain builds the Go cat binary and locates the gcat reference binary.
            28 | // D2: skip all tests if gcat is not on PATH.
            29 | // D3: build Go cat binary into a temporary directory.
            30 | func TestMain(m *testing.M) {
            31 | 	ref, err := exec.LookPath("gcat")
            32 | 	if err != nil {
            33 | 		fmt.Fprintln(os.Stderr, "gcat not found on PATH; skipping cat differential tests")
            34 | 		os.Exit(0)
            35 | 	}
            36 | 	refBinary = ref
            38 | 	binDir, err := os.MkdirTemp("", "cat-test-*")
            39 | 	if err != nil {
            40 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            41 | 		os.Exit(1)
            42 | 	}
            44 | 	goBinary = filepath.Join(binDir, "cat")
            45 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            46 | 	if out, err := cmd.CombinedOutput(); err != nil {
            47 | 		fmt.Fprintf(os.Stderr, "building Go cat binary: %v\n%s", err, out)
            48 | 		os.RemoveAll(binDir) // best-effort cleanup
            49 | 		os.Exit(1)
            50 | 	}
            52 | 	code := m.Run()
            53 | 	os.RemoveAll(binDir) // best-effort cleanup
            54 | 	os.Exit(code)
            55 | }
            57 | // writeTestFile creates a file with the given content in dir.
            58 | func writeTestFile(t *testing.T, dir, name, content string) {
            59 | 	t.Helper()
            60 | 	if err := os.WriteFile(filepath.Join(dir, name), []byte(content), 0o644); err != nil {
            61 | 		t.Fatalf("writing test file %s: %v", name, err)
            62 | 	}
            63 | }
            65 | // normalizeProgramName replaces "gcat: " with "cat: " in output so stderr
            66 | // from the GNU reference binary and the Go binary can be compared.
            67 | func normalizeProgramName(data []byte) []byte {
            68 | 	return bytes.ReplaceAll(data, []byte("gcat: "), []byte("cat: "))
            69 | }
