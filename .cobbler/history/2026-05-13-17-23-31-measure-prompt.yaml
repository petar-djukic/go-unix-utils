        related_documents:
            - doc: docs/VISION.yaml
              purpose: Project goals, success criteria, risks, and explicit boundaries.
            - doc: docs/utilities.yaml
              purpose: Full catalog of 123 target utilities with difficulty and memory model profiles.
            - doc: docs/road-map.yaml
              purpose: Release schedule; current release and use case status.
            - doc: docs/engineering/eng01-spec-extraction.yaml
              purpose: Engineering guideline for extracting specifications from C/Perl source.
            - doc: configuration.yaml
              purpose: Orchestrator configuration for build, analysis, and generation targets.
        shared_protocols:
            - name: Differential testing
              description: |
                Every cmd/ package verifies its implementation by running the Go binary and the
                Homebrew GNU reference binary side by side and comparing stdout, stderr, and exit
                code via pkg/testutils.RunDiffTests. Test cases are defined as []testutils.DiffTest
                slices in <utility>_test.go files. The harness sets LC_ALL=C by default.
              pattern: |
                func TestDiff(t *testing.T) {
                    goBin := testutils.BuildBinary(t, ".")
                    refBin, err := exec.LookPath("g<utility>")
                    if err != nil { t.Skip("reference binary not found") }
                    tests := []testutils.DiffTest{ ... }
                    testutils.RunDiffTests(t, goBin, refBin, tests)
                }
            - name: Graceful skip on missing reference binary
              description: |
                All cmd/ test files call exec.LookPath for the Homebrew reference binary at the
                start of TestDiff and call t.Skip if it is not found. This allows the test suite
                to run on machines without Homebrew GNU binaries installed without reporting false
                failures. The binary is never installed by the test itself.
              pattern: |
                refBin, err := exec.LookPath("g<utility>")
                if err != nil { t.Skipf("reference binary g<utility> not in PATH: %v", err) }
            - name: SIGPIPE handling
              description: |
                All cmd/ utilities that write to stdout call pkg/sys.InstallSIGPIPEHandler() at
                the start of main. This ensures the process exits 0 when piped output is consumed
                by a downstream consumer that closes its stdin (e.g., head, grep -q), matching GNU
                coreutils behavior.
              pattern: |
                func main() {
                    sys.InstallSIGPIPEHandler()
                    ...
                }
        component_dependencies:
            - from: srd003-format
              to: srd002-sys
            - from: srd008-ls
              to: srd002-sys
            - from: srd008-ls
              to: srd003-format
            - from: srd009-du
              to: srd002-sys
            - from: srd009-du
              to: srd003-format
    roadmap:
        file: docs/road-map.yaml
        id: go-unix-utils-roadmap
        title: go-unix-utils Release Road Map
        releases:
            - version: "00.0"
              name: Batch 0 — foundational infrastructure
              status: spec_complete
              description: |
                Specify and verify the build lifecycle and shared library infrastructure that all
                subsequent releases depend on. This release covers magefiles/ (build, lint, clean,
                install targets and cmd/version), pkg/testutils (differential testing harness),
                pkg/sys (syscall abstractions), and pkg/format (output formatting). The cmd/version
                binary is the first compiled artifact and the smoke test for the build pipeline.
              use_cases:
                - id: rel00.0-uc001-magefiles
                  status: spec_complete
                - id: rel00.0-uc002-format
