        - file: cmd/cat/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // cmd/cat concatenates files and writes to stdout, optionally applying line
            5 | // numbering, blank-line squeezing, and non-printing character display, matching
            6 | // GNU cat output format under LC_ALL=C.
            7 | //
            8 | // Implements prd006-cat R1, R2, R3, R4, R5.
            9 | package main
            11 | import (
            12 | 	"bufio"
            13 | 	"fmt"
            14 | 	"io"
            15 | 	"os"
            16 | 	"strings"
            18 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            19 | )
            21 | const progName = "cat"
            23 | type config struct {
            24 | 	numberAll      bool // -n / --number
            25 | 	numberNonBlank bool // -b / --number-nonblank
            26 | 	showEnds       bool // -E / --show-ends
            27 | 	showTabs       bool // -T / --show-tabs
            28 | 	showNonPrint   bool // -v / --show-nonprinting
            29 | 	squeezeBlank   bool // -s / --squeeze-blank
            30 | }
            32 | type outputState struct {
            33 | 	lineNum     int64
            34 | 	blankCount  int
            35 | 	atLineStart bool
            36 | }
            38 | func main() {
            39 | 	sys.InstallSIGPIPEHandler()
            41 | 	cfg, files := parseArgs(os.Args[1:])
            43 | 	// No files means read stdin (prd006-cat R1.2).
            44 | 	if len(files) == 0 {
            45 | 		files = []string{"-"}
            46 | 	}
            48 | 	out := bufio.NewWriter(os.Stdout)
            49 | 	exitCode := 0
            50 | 	state := outputState{lineNum: 1, atLineStart: true}
            52 | 	for _, file := range files {
            53 | 		if err := processFile(out, cfg, file, &state); err != nil {
            54 | 			fmt.Fprintf(os.Stderr, "%s: %s\n", progName, err)
            55 | 			exitCode = 1
            56 | 		}
            57 | 	}
            59 | 	if err := out.Flush(); err != nil {
            60 | 		os.Exit(1) // prd006-cat R5.3
            61 | 	}
            63 | 	os.Exit(exitCode)
            64 | }
            66 | // parseArgs parses GNU-style flags including combined short flags (-vET)
            67 | // and long flags (--show-all). Cat flags do not take values.
            68 | func parseArgs(args []string) (config, []string) {
            69 | 	var cfg config
            70 | 	var files []string
            72 | 	for i := 0; i < len(args); i++ {
            73 | 		arg := args[i]
            75 | 		if arg == "--" {
            76 | 			files = append(files, args[i+1:]...)
            77 | 			break
            78 | 		}
            80 | 		if arg == "-" || !strings.HasPrefix(arg, "-") {
            81 | 			files = append(files, arg)
            82 | 			continue
            83 | 		}
            85 | 		if strings.HasPrefix(arg, "--") {
            86 | 			name := arg[2:]
            87 | 			switch name {
            88 | 			case "number":
            89 | 				cfg.numberAll = true
            90 | 			case "number-nonblank":
            91 | 				cfg.numberNonBlank = true
            92 | 			case "show-ends":
            93 | 				cfg.showEnds = true
            94 | 			case "show-tabs":
            95 | 				cfg.showTabs = true
            96 | 			case "show-nonprinting":
            97 | 				cfg.showNonPrint = true
            98 | 			case "squeeze-blank":
            99 | 				cfg.squeezeBlank = true
            100 | 			case "show-all":
            101 | 				cfg.showNonPrint = true
            102 | 				cfg.showEnds = true
            103 | 				cfg.showTabs = true
            104 | 			default:
            105 | 				fmt.Fprintf(os.Stderr, "%s: unrecognized option '--%s'\n", progName, name)
            106 | 				os.Exit(1)
            107 | 			}
            108 | 			continue
            109 | 		}
            111 | 		// Short flags may be combined: -vET means -v -E -T.
            112 | 		for _, ch := range arg[1:] {
            113 | 			switch ch {
            114 | 			case 'n':
            115 | 				cfg.numberAll = true
            116 | 			case 'b':
            117 | 				cfg.numberNonBlank = true
            118 | 			case 's':
            119 | 				cfg.squeezeBlank = true
            120 | 			case 'v':
            121 | 				cfg.showNonPrint = true
            122 | 			case 'E':
            123 | 				cfg.showEnds = true
            124 | 			case 'T':
            125 | 				cfg.showTabs = true
            126 | 			case 'A':
            127 | 				cfg.showNonPrint = true
            128 | 				cfg.showEnds = true
            129 | 				cfg.showTabs = true
            130 | 			case 'e':
            131 | 				cfg.showNonPrint = true
            132 | 				cfg.showEnds = true
            133 | 			case 't':
            134 | 				cfg.showNonPrint = true
            135 | 				cfg.showTabs = true
            136 | 			case 'u':
            137 | 				// Accepted but no effect (prd006-cat R4.8).
            138 | 			default:
            139 | 				fmt.Fprintf(os.Stderr, "%s: invalid option -- '%c'\n", progName, ch)
            140 | 				os.Exit(1)
            141 | 			}
            142 | 		}
            143 | 	}
            145 | 	return cfg, files
            146 | }
            148 | // needsTransformation reports whether any output transformation flag is active.
            149 | func needsTransformation(cfg config) bool {
            150 | 	return cfg.numberAll || cfg.numberNonBlank || cfg.showEnds ||
            151 | 		cfg.showTabs || cfg.showNonPrint || cfg.squeezeBlank
            152 | }
            154 | // processFile opens a single input and writes its content to out. The path "-"
            155 | // means stdin. State is carried across files for line numbering and blank
            156 | // squeezing (prd006-cat R3.2).
            157 | func processFile(out *bufio.Writer, cfg config, path string, state *outputState) error {
            158 | 	var r io.Reader
            159 | 	if path == "-" {
            160 | 		r = os.Stdin
            161 | 	} else {
            162 | 		f, err := os.Open(path)
            163 | 		if err != nil {
            164 | 			if pe, ok := err.(*os.PathError); ok {
            165 | 				return fmt.Errorf("%s: %v", path, pe.Err)
            166 | 			}
            167 | 			return err
            168 | 		}
            169 | 		defer f.Close()
            170 | 		r = f
            171 | 	}
            173 | 	if needsTransformation(cfg) {
            174 | 		return processInput(out, cfg, r, state)
            175 | 	}
            177 | 	_, err := io.Copy(out, r)
            178 | 	return err
            179 | }
            181 | // processInput reads bytes from r and applies the configured transformations.
            182 | // The order of application follows prd006-cat R4.9: squeeze blanks, then
            183 | // non-printing display, then end-of-line marker, then line number prefix.
            184 | func processInput(out *bufio.Writer, cfg config, r io.Reader, state *outputState) error {
            185 | 	buf := make([]byte, 32*1024)
            187 | 	for {
            188 | 		n, err := r.Read(buf)
            189 | 		for i := 0; i < n; i++ {
            190 | 			b := buf[i]
            192 | 			if state.atLineStart {
            193 | 				if b == '\n' {
            194 | 					// Blank line (prd006-cat R2.4).
            195 | 					if cfg.squeezeBlank && state.blankCount >= 1 {
            196 | 						continue
            197 | 					}
            198 | 					state.blankCount++
            200 | 					if cfg.numberAll && !cfg.numberNonBlank {
            201 | 						fmt.Fprintf(out, "%6d\t", state.lineNum)
            202 | 						state.lineNum++
            203 | 					}
            205 | 					if cfg.showEnds {
            206 | 						out.WriteByte('$')
            207 | 					}
            208 | 					out.WriteByte('\n')
            209 | 					continue
            210 | 				}
            212 | 				// Non-blank line.
            213 | 				state.blankCount = 0
            214 | 				if cfg.numberAll || cfg.numberNonBlank {
            215 | 					fmt.Fprintf(out, "%6d\t", state.lineNum)
            216 | 					state.lineNum++
            217 | 				}
            218 | 				state.atLineStart = false
            219 | 			}
            221 | 			if b == '\n' {
            222 | 				if cfg.showEnds {
            223 | 					out.WriteByte('$')
            224 | 				}
            225 | 				out.WriteByte('\n')
            226 | 				state.atLineStart = true
            227 | 			} else if b == '\t' {
            228 | 				if cfg.showTabs {
            229 | 					out.WriteByte('^')
            230 | 					out.WriteByte('I')
            231 | 				} else {
            232 | 					out.WriteByte('\t')
            233 | 				}
            234 | 			} else if cfg.showNonPrint {
            235 | 				writeNonPrint(out, b)
            236 | 			} else {
            237 | 				out.WriteByte(b)
            238 | 			}
            239 | 		}
            241 | 		if err == io.EOF {
            242 | 			return nil
            243 | 		}
            244 | 		if err != nil {
            245 | 			return err
            246 | 		}
            247 | 	}
            248 | }
            250 | // writeNonPrint writes byte b in caret and M- notation per prd006-cat R4.1.
            251 | // Under LC_ALL=C: 0x00-0x1F (except tab/newline handled earlier) -> ^X,
            252 | // 0x7F -> ^?, 0x80-0x9F -> M-^X, 0xA0-0xFE -> M-x, 0xFF -> M-^?.
            253 | func writeNonPrint(out *bufio.Writer, b byte) {
            254 | 	if b < 0x20 {
            255 | 		out.WriteByte('^')
            256 | 		out.WriteByte(b + 64)
            257 | 	} else if b == 0x7F {
            258 | 		out.WriteByte('^')
            259 | 		out.WriteByte('?')
            260 | 	} else if b >= 0x80 {
            261 | 		out.WriteByte('M')
            262 | 		out.WriteByte('-')
            263 | 		adj := b - 0x80
            264 | 		if adj < 0x20 {
            265 | 			out.WriteByte('^')
            266 | 			out.WriteByte(adj + 64)
            267 | 		} else if adj == 0x7F {
            268 | 			out.WriteByte('^')
            269 | 			out.WriteByte('?')
            270 | 		} else {
            271 | 			out.WriteByte(adj)
            272 | 		}
            273 | 	} else {
            274 | 		out.WriteByte(b)
            275 | 	}
            276 | }
