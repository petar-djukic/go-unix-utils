            179 | // soakStdin reads all of stdin into memory, spilling to a temp file if the
            180 | // buffer exceeds the memory threshold (R1.1, R1.2, R1.3). Returns either
            181 | // in-memory data (buf non-nil, tmpPath empty) or a temp file path (buf nil,
            182 | // tmpPath non-empty).
            183 | func soakStdin() ([]byte, string, error) {
            184 | 	threshold := memoryThreshold()
            185 | 	buf := make([]byte, 0, initialBufSize)
            186 | 	chunk := make([]byte, initialBufSize)
            187 | 	var tmpFile *os.File
            188 | 	var tmpPath string
            190 | 	for {
            191 | 		n, err := os.Stdin.Read(chunk)
            192 | 		if n > 0 {
            193 | 			if tmpFile != nil {
            194 | 				// Already spilling to temp file.
            195 | 				if _, werr := tmpFile.Write(chunk[:n]); werr != nil {
            196 | 					tmpFile.Close()
            197 | 					return nil, tmpPath, fmt.Errorf("writing to temp file: %w", werr)
            198 | 				}
            199 | 			} else {
            200 | 				buf = append(buf, chunk[:n]...)
            201 | 				if int64(len(buf)) > threshold {
            202 | 					// Spill to temp file (R1.3).
            203 | 					var cerr error
            204 | 					tmpFile, cerr = createTempFile()
            205 | 					if cerr != nil {
            206 | 						return nil, "", fmt.Errorf("creating temp file: %w", cerr)
            207 | 					}
            208 | 					tmpPath = tmpFile.Name()
            209 | 					registerTempFile(tmpPath)
            210 | 					if _, werr := tmpFile.Write(buf); werr != nil {
            211 | 						tmpFile.Close()
            212 | 						return nil, tmpPath, fmt.Errorf("writing to temp file: %w", werr)
            213 | 					}
            214 | 					buf = nil // Release memory.
            215 | 				}
            216 | 			}
            217 | 		}
            218 | 		if err == io.EOF {
            219 | 			if tmpFile != nil {
            220 | 				if cerr := tmpFile.Close(); cerr != nil {
            221 | 					return nil, tmpPath, fmt.Errorf("closing temp file: %w", cerr)
            222 | 				}
            223 | 				return nil, tmpPath, nil
            224 | 			}
            225 | 			return buf, "", nil
            226 | 		}
            227 | 		if err != nil {
            228 | 			if tmpFile != nil {
            229 | 				tmpFile.Close()
            230 | 			}
            231 | 			return nil, tmpPath, err
            232 | 		}
            233 | 	}
            234 | }
            236 | // writePassthrough writes buffered stdin to stdout (R4.1, R4.2, R4.3).
            237 | func writePassthrough(buf []byte, tmpPath string) error {
            238 | 	if tmpPath != "" {
            239 | 		// Large input was spilled to temp file (R4.2).
            240 | 		f, err := os.Open(tmpPath)
            241 | 		if err != nil {
            242 | 			return err
            243 | 		}
            244 | 		defer f.Close()
            245 | 		_, err = io.Copy(os.Stdout, f)
            246 | 		return err
            247 | 	}
            248 | 	// Small input in memory (R4.3).
            249 | 	_, err := os.Stdout.Write(buf)
            250 | 	return err
            251 | }
            253 | // writeToFile writes stdin content to the output file via a temp file for
            254 | // atomicity, optionally prepending original file content in append mode
            255 | // (R2, R3).
            256 | func writeToFile(cfg config, buf []byte, soakTmpPath, outputPath string) error {
            257 | 	// Read existing file metadata before any writes (R2.3, R2.4).
            258 | 	var origMode os.FileMode
            259 | 	fileExists := false
            260 | 	info, err := os.Lstat(outputPath)
            261 | 	if err == nil {
            262 | 		fileExists = true
            263 | 		origMode = info.Mode().Perm()
            264 | 	}
            266 | 	// When not in append mode and data is already in a soak temp file,
            267 | 	// reuse it directly to avoid an extra copy.
            268 | 	if !cfg.appendMode && soakTmpPath != "" {
            269 | 		return finishWrite(soakTmpPath, outputPath, origMode, fileExists)
            270 | 	}
            272 | 	// Create temp file for the final output content (R2.1).
            273 | 	tmpFile, err := createTempFile()
            274 | 	if err != nil {
            275 | 		return fmt.Errorf("%s: %v", outputPath, err)
            276 | 	}
            277 | 	tmpOutPath := tmpFile.Name()
            278 | 	registerTempFile(tmpOutPath)
            280 | 	// If append mode and file exists, copy original content first (R3.1, R3.3).
            281 | 	if cfg.appendMode && fileExists {
            282 | 		if err := copyOriginalContent(tmpFile, outputPath); err != nil {
            283 | 			tmpFile.Close()
            284 | 			return err
            285 | 		}
            286 | 	}
            288 | 	// Write stdin content to temp file.
            289 | 	if err := writeStdinContent(tmpFile, buf, soakTmpPath); err != nil {
            290 | 		tmpFile.Close()
            291 | 		return err
            292 | 	}
            294 | 	if err := tmpFile.Close(); err != nil {
            295 | 		return fmt.Errorf("%s: %v", outputPath, err)
            296 | 	}
            298 | 	return finishWrite(tmpOutPath, outputPath, origMode, fileExists)
            299 | }
            301 | // finishWrite applies permissions and renames the temp file to the output
            302 | // path, falling back to a byte-for-byte copy on cross-device failure
            303 | // (R2.1, R2.2, R2.3).
            304 | func finishWrite(tmpPath, outputPath string, origMode os.FileMode, fileExists bool) error {
            305 | 	mode := origMode
            306 | 	if !fileExists {
            307 | 		mode = defaultFileMode()
            308 | 	}
            310 | 	if err := os.Chmod(tmpPath, mode); err != nil {
            311 | 		return fmt.Errorf("%s: %v", outputPath, err)
            312 | 	}
            314 | 	if err := os.Rename(tmpPath, outputPath); err != nil {
            315 | 		// Cross-device fallback (R2.2).
            316 | 		if cpErr := copyFileContent(tmpPath, outputPath, mode); cpErr != nil {
            317 | 			return cpErr
            318 | 		}
            319 | 		os.Remove(tmpPath) // best-effort cleanup of temp after copy
            320 | 	}
            322 | 	unregisterTempFile(tmpPath)
            323 | 	return nil
            324 | }
            326 | // defaultFileMode returns 0666 masked by the process umask (R2.3).
            327 | func defaultFileMode() os.FileMode {
            328 | 	mask := syscall.Umask(0)
            329 | 	syscall.Umask(mask)
            330 | 	return 0666 &^ os.FileMode(mask)
            331 | }
            333 | // copyOriginalContent copies the existing output file content into dst for
            334 | // append mode (R3.3).
            335 | func copyOriginalContent(dst *os.File, srcPath string) error {
            336 | 	src, err := os.Open(srcPath)
            337 | 	if err != nil {
            338 | 		return fmt.Errorf("%s: %v", srcPath, err)
            339 | 	}
            340 | 	defer src.Close()
            341 | 	if _, err := io.Copy(dst, src); err != nil {
            342 | 		return fmt.Errorf("%s: %v", srcPath, err)
            343 | 	}
            344 | 	return nil
            345 | }
            347 | // writeStdinContent writes stdin data (from memory or soak temp file) to dst.
            348 | func writeStdinContent(dst *os.File, buf []byte, soakTmpPath string) error {
            349 | 	if soakTmpPath != "" {
            350 | 		src, err := os.Open(soakTmpPath)
            351 | 		if err != nil {
            352 | 			return err
            353 | 		}
            354 | 		defer src.Close()
            355 | 		_, err = io.Copy(dst, src)
            356 | 		return err
            357 | 	}
            358 | 	_, err := dst.Write(buf)
            359 | 	return err
            360 | }
            362 | // copyFileContent copies src to dst when rename fails (cross-device, R2.2).
            363 | func copyFileContent(srcPath, dstPath string, mode os.FileMode) error {
            364 | 	src, err := os.Open(srcPath)
            365 | 	if err != nil {
            366 | 		return fmt.Errorf("%s: %v", dstPath, err)
            367 | 	}
            368 | 	defer src.Close()
            370 | 	dst, err := os.OpenFile(dstPath, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, mode)
            371 | 	if err != nil {
            372 | 		return fmt.Errorf("%s: %v", dstPath, err)
            373 | 	}
            375 | 	if _, err := io.Copy(dst, src); err != nil {
            376 | 		dst.Close()
            377 | 		return fmt.Errorf("%s: %v", dstPath, err)
            378 | 	}
            380 | 	return dst.Close()
            381 | }
