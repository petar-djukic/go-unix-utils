            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package testutils provides a differential testing harness for verifying Go
            5 | // utility implementations against GNU reference binaries.
            6 | //
            7 | // Implements prd001-testutils R1, R2, R3, R4.
            8 | package testutils
            10 | import (
            11 | 	"bytes"
            12 | 	"context"
            13 | 	"os"
            14 | 	"os/exec"
            15 | 	"strings"
            16 | 	"testing"
            17 | 	"time"
            18 | )
            20 | // defaultTimeout is the per-binary execution timeout (prd001-testutils R2.3).
            21 | const defaultTimeout = 10 * time.Second
            23 | // DiffTest represents a single differential test case per ARCHITECTURE.yaml.
            24 | // Both the Go binary under test and the GNU reference binary are invoked with
            25 | // identical Args, Stdin, and Env for each test case.
            26 | type DiffTest struct {
            27 | 	// Name is the subtest name used with t.Run.
            28 | 	Name string
            29 | 	// Args are command-line arguments passed to both binaries.
            30 | 	Args []string
            31 | 	// Stdin is standard input content sent to both binaries. Empty means no stdin.
            32 | 	Stdin string
            33 | 	// Env holds KEY=VALUE pairs merged into the inherited environment.
            34 | 	// nil means defaults only (LC_ALL=C).
            35 | 	Env []string
            36 | }
            38 | // NormalizeFunc transforms output bytes before comparison. Normalization
            39 | // functions strip or replace non-deterministic output fields (timestamps,
            40 | // absolute paths) so that differential comparison succeeds despite expected
            41 | // variation.
            42 | type NormalizeFunc = func([]byte) []byte
            44 | // RunDiffTests executes each DiffTest as a named subtest, running both the Go
            45 | // binary and the reference GNU binary with identical inputs. It compares stdout,
            46 | // stderr, and exit code, reporting any divergence via t.Errorf.
            47 | //
            48 | // normalizers are applied in order to stdout and stderr of both binaries before
            49 | // comparison. Pass nil for no normalization.
            50 | //
            51 | // LC_ALL=C is prepended to the environment for both binaries unless overridden
            52 | // by DiffTest.Env (design decision DD6).
            53 | func RunDiffTests(t *testing.T, goBinary, refBinary string, normalizers []NormalizeFunc, tests []DiffTest) {
            54 | 	t.Helper()
            56 | 	for _, tc := range tests {
            57 | 		t.Run(tc.Name, func(t *testing.T) {
            58 | 			t.Helper()
            60 | 			env := buildEnv(tc.Env)
            62 | 			refStdout, refStderr, refExit := runBinary(t, refBinary, tc.Args, tc.Stdin, env)
            63 | 			goStdout, goStderr, goExit := runBinary(t, goBinary, tc.Args, tc.Stdin, env)
            65 | 			for _, fn := range normalizers {
            66 | 				refStdout = fn(refStdout)
            67 | 				goStdout = fn(goStdout)
            68 | 				refStderr = fn(refStderr)
            69 | 				goStderr = fn(goStderr)
            70 | 			}
            72 | 			if !bytes.Equal(refStdout, goStdout) || !bytes.Equal(refStderr, goStderr) || refExit != goExit {
            73 | 				t.Errorf("divergence for %q\n"+
            74 | 					"  args:        %v\n"+
            75 | 					"  stdin:       %q\n"+
            76 | 					"  ref stdout:  %q\n"+
            77 | 					"  go  stdout:  %q\n"+
            78 | 					"  ref stderr:  %q\n"+
            79 | 					"  go  stderr:  %q\n"+
            80 | 					"  ref exit:    %d\n"+
            81 | 					"  go  exit:    %d",
            82 | 					tc.Name, tc.Args, tc.Stdin,
            83 | 					refStdout, goStdout,
            84 | 					refStderr, goStderr,
            85 | 					refExit, goExit,
            86 | 				)
            87 | 			}
            88 | 		})
            89 | 	}
            90 | }
            92 | // buildEnv constructs the environment for binary execution. It starts with the
            93 | // current process environment, sets LC_ALL=C as a default, then merges any
            94 | // per-test overrides from DiffTest.Env.
            95 | func buildEnv(testEnv []string) []string {
            96 | 	env := os.Environ()
            97 | 	env = setEnvVar(env, "LC_ALL", "C")
            99 | 	for _, kv := range testEnv {
            100 | 		if k, v, ok := strings.Cut(kv, "="); ok {
            101 | 			env = setEnvVar(env, k, v)
            102 | 		}
            103 | 	}
            105 | 	return env
            106 | }
            108 | // setEnvVar sets key=value in the environment slice, replacing an existing entry
            109 | // for the same key or appending if not present.
            110 | func setEnvVar(env []string, key, value string) []string {
            111 | 	prefix := key + "="
            112 | 	for i, e := range env {
            113 | 		if strings.HasPrefix(e, prefix) {
            114 | 			env[i] = prefix + value
            115 | 			return env
            116 | 		}
            117 | 	}
            119 | 	return append(env, prefix+value)
            120 | }
            122 | // runBinary executes a binary with the given arguments, stdin, and environment,
            123 | // returning its stdout, stderr, and exit code.
            124 | func runBinary(t *testing.T, binary string, args []string, stdin string, env []string) (stdout, stderr []byte, exitCode int) {
            125 | 	t.Helper()
            127 | 	ctx, cancel := context.WithTimeout(context.Background(), defaultTimeout)
            128 | 	defer cancel()
            130 | 	cmd := exec.CommandContext(ctx, binary, args...)
            131 | 	cmd.Env = env
            133 | 	if stdin != "" {
            134 | 		cmd.Stdin = strings.NewReader(stdin)
            135 | 	}
            137 | 	var outBuf, errBuf bytes.Buffer
            138 | 	cmd.Stdout = &outBuf
            139 | 	cmd.Stderr = &errBuf
            141 | 	err := cmd.Run()
            143 | 	stdout = outBuf.Bytes()
            144 | 	stderr = errBuf.Bytes()
            146 | 	if ctx.Err() == context.DeadlineExceeded {
            147 | 		t.Fatalf("timeout executing %s with args %v", binary, args)
            148 | 	}
            150 | 	if err != nil {
            151 | 		if exitErr, ok := err.(*exec.ExitError); ok {
            152 | 			exitCode = exitErr.ExitCode()
            153 | 		} else {
            154 | 			t.Fatalf("failed to execute %s: %v", binary, err)
            155 | 		}
            156 | 	}
            158 | 	return stdout, stderr, exitCode
            159 | }
