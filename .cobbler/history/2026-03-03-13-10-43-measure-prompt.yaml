            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // cmd/sponge reads all of stdin into a buffer before writing to the output
            5 | // file, enabling safe in-place file modification in pipelines like
            6 | // "cmd file | sponge file". Optionally appends to the output file with -a.
            7 | //
            8 | // Implements prd007-sponge R1, R2, R3, R4, R5.
            9 | package main
            11 | import (
            12 | 	"fmt"
            13 | 	"io"
            14 | 	"os"
            15 | 	"os/signal"
            16 | 	"strings"
            17 | 	"sync"
            18 | 	"syscall"
            20 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            21 | )
            23 | const (
            24 | 	progName       = "sponge"
            25 | 	initialBufSize = 8192
            26 | )
            28 | type config struct {
            29 | 	appendMode bool // -a
            30 | }
            32 | var (
            33 | 	tempMu    sync.Mutex
            34 | 	tempPaths []string
            35 | )
            37 | func main() {
            38 | 	sys.InstallSIGPIPEHandler()
            39 | 	installCleanupHandler()
            41 | 	cfg, outputFile := parseArgs(os.Args[1:])
            43 | 	// Phase 1: Read all of stdin before touching the output file (R1.1).
            44 | 	buf, soakTmpPath, err := soakStdin()
            45 | 	if err != nil {
            46 | 		fmt.Fprintf(os.Stderr, "%s: %s\n", progName, err)
            47 | 		cleanupAllTempFiles()
            48 | 		os.Exit(1)
            49 | 	}
            51 | 	// Phase 2: Write output.
            52 | 	if outputFile == "" {
            53 | 		// Passthrough mode: write to stdout (R4).
            54 | 		if err := writePassthrough(buf, soakTmpPath); err != nil {
            55 | 			fmt.Fprintf(os.Stderr, "%s: %s\n", progName, err)
            56 | 			cleanupAllTempFiles()
            57 | 			os.Exit(1)
            58 | 		}
            59 | 	} else {
            60 | 		// File output mode (R2, R3).
            61 | 		if err := writeToFile(cfg, buf, soakTmpPath, outputFile); err != nil {
            62 | 			fmt.Fprintf(os.Stderr, "%s: %s\n", progName, err)
            63 | 			cleanupAllTempFiles()
            64 | 			os.Exit(1)
            65 | 		}
            66 | 	}
            68 | 	cleanupAllTempFiles()
            69 | }
            71 | // parseArgs parses sponge flags. Only -a (append) is supported.
            72 | // Uses manual parsing matching cmd/cat and cmd/wc patterns.
            73 | func parseArgs(args []string) (config, string) {
            74 | 	var cfg config
            75 | 	var files []string
            77 | 	for i := 0; i < len(args); i++ {
            78 | 		arg := args[i]
            80 | 		if arg == "--" {
            81 | 			files = append(files, args[i+1:]...)
            82 | 			break
            83 | 		}
            85 | 		if arg == "-" || !strings.HasPrefix(arg, "-") {
            86 | 			files = append(files, arg)
            87 | 			continue
            88 | 		}
            90 | 		if strings.HasPrefix(arg, "--") {
            91 | 			name := arg[2:]
            92 | 			fmt.Fprintf(os.Stderr, "%s: unrecognized option '--%s'\n", progName, name)
            93 | 			os.Exit(1)
            94 | 		}
            96 | 		// Short flags may be combined.
            97 | 		for _, ch := range arg[1:] {
            98 | 			switch ch {
            99 | 			case 'a':
            100 | 				cfg.appendMode = true
            101 | 			default:
            102 | 				fmt.Fprintf(os.Stderr, "%s: invalid option -- '%c'\n", progName, ch)
            103 | 				os.Exit(1)
            104 | 			}
            105 | 		}
            106 | 	}
            108 | 	var outputFile string
            109 | 	if len(files) > 0 {
            110 | 		outputFile = files[0]
            111 | 	}
            113 | 	return cfg, outputFile
            114 | }
            116 | // registerTempFile adds a path to the global cleanup list.
            117 | func registerTempFile(path string) {
            118 | 	tempMu.Lock()
            119 | 	tempPaths = append(tempPaths, path)
            120 | 	tempMu.Unlock()
            121 | }
            123 | // unregisterTempFile removes a path from the global cleanup list after a
            124 | // successful rename so it is not deleted again.
            125 | func unregisterTempFile(path string) {
            126 | 	tempMu.Lock()
            127 | 	for i, p := range tempPaths {
            128 | 		if p == path {
            129 | 			tempPaths = append(tempPaths[:i], tempPaths[i+1:]...)
            130 | 			break
            131 | 		}
            132 | 	}
            133 | 	tempMu.Unlock()
            134 | }
            136 | // cleanupAllTempFiles removes all registered temp files (R5.4).
            137 | func cleanupAllTempFiles() {
            138 | 	tempMu.Lock()
            139 | 	paths := tempPaths
            140 | 	tempPaths = nil
            141 | 	tempMu.Unlock()
            142 | 	for _, p := range paths {
            143 | 		os.Remove(p) // best-effort cleanup
            144 | 	}
            145 | }
            147 | // installCleanupHandler registers signal handlers to clean up temp files
            148 | // on SIGINT, SIGTERM, and SIGHUP (R1.5).
            149 | func installCleanupHandler() {
