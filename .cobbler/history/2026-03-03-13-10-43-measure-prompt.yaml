            159 | // memoryThreshold returns the byte count above which stdin is spilled to a
            160 | // temp file. Uses a quarter of RLIMIT_DATA when finite, otherwise 256 MB
            161 | // (R1.3).
            162 | func memoryThreshold() int64 {
            163 | 	var rlim syscall.Rlimit
            164 | 	if err := syscall.Getrlimit(syscall.RLIMIT_DATA, &rlim); err == nil && rlim.Cur > 0 && rlim.Cur < 1<<62 {
            165 | 		return int64(rlim.Cur / 4)
