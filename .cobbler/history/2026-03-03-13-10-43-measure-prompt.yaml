        - file: pkg/format/color.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"io"
            8 | 	"os"
            9 | 	"sync"
            11 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            12 | )
            14 | // ANSI escape sequence prefix and suffix used to construct color codes
            15 | // (prd003-format R2.1, R2.2).
            16 | const (
            17 | 	ansiEsc   = "\033["
            18 | 	ansiReset = "\033[0m"
            19 | )
            21 | // File-type ANSI color codes matching GNU ls LS_COLORS defaults
            22 | // (prd003-format R2.4).
            23 | const (
            24 | 	colorDirectory = "34"   // blue
            25 | 	colorSymlink   = "36"   // cyan
            26 | 	colorExec      = "32"   // green
            27 | 	colorBlockDev  = "33;1" // yellow bold
            28 | 	colorCharDev   = "33;1" // yellow bold
            29 | 	colorSocket    = "35"   // magenta
            30 | 	colorPipe      = "33"   // yellow
            31 | 	colorRegular   = "0"    // reset/default
            32 | )
            34 | // colorOverride tracks the process-global override set by SetColorEnabled
            35 | // (prd003-format R2.6, R2.7).
            36 | var (
            37 | 	colorMu       sync.Mutex
            38 | 	colorOverride *bool // nil = automatic detection; non-nil = forced value
            39 | )
            41 | // FileTypeColor returns the ANSI escape sequence for a file's type, matching
            42 | // GNU ls LS_COLORS defaults (prd003-format R2.1, R2.4). The returned string
            43 | // includes the full escape prefix (e.g., "\033[34m" for directories). Returns
            44 | // an empty string when color output is disabled via SetColorEnabled(false) or
            45 | // when automatic detection determines the output is not a TTY.
            46 | //
            47 | // Supported file types: directory, symlink, executable regular file, block
            48 | // device, character device, socket, named pipe (FIFO), and regular file.
            49 | func FileTypeColor(mode os.FileMode) string {
            50 | 	if !isColorActive() {
            51 | 		return ""
            52 | 	}
            54 | 	code := fileTypeCode(mode)
            55 | 	return ansiEsc + code + "m"
            56 | }
            58 | // fileTypeCode returns the raw ANSI color code string for the given file mode
            59 | // (prd003-format R2.4).
            60 | func fileTypeCode(mode os.FileMode) string {
            61 | 	switch {
            62 | 	case mode&os.ModeDir != 0:
            63 | 		return colorDirectory
            64 | 	case mode&os.ModeSymlink != 0:
            65 | 		return colorSymlink
            66 | 	case mode&os.ModeDevice != 0 && mode&os.ModeCharDevice != 0:
            67 | 		return colorCharDev
            68 | 	case mode&os.ModeDevice != 0:
            69 | 		return colorBlockDev
            70 | 	case mode&os.ModeSocket != 0:
            71 | 		return colorSocket
            72 | 	case mode&os.ModeNamedPipe != 0:
            73 | 		return colorPipe
            74 | 	case mode.IsRegular() && mode&0o111 != 0:
            75 | 		return colorExec
            76 | 	default:
            77 | 		return colorRegular
            78 | 	}
            79 | }
            81 | // Reset returns the ANSI reset sequence ("\033[0m") when color output is
            82 | // enabled, or an empty string when disabled (prd003-format R2.2).
            83 | func Reset() string {
            84 | 	if !isColorActive() {
            85 | 		return ""
            86 | 	}
            87 | 	return ansiReset
            88 | }
            90 | // ColorEnabled reports whether ANSI color output should be used for w. It
            91 | // returns true only when w is backed by a TTY file descriptor, as detected by
            92 | // pkg/sys.IsTerminal (prd003-format R2.3). If w does not implement a type
            93 | // assertion to *os.File, it returns false.
            94 | func ColorEnabled(w io.Writer) bool {
            95 | 	f, ok := w.(*os.File)
            96 | 	if !ok {
            97 | 		return false
            98 | 	}
            99 | 	return sys.IsTerminal(f.Fd())
            100 | }
            102 | // SetColorEnabled overrides automatic TTY detection for FileTypeColor and
            103 | // Reset. When enabled is true, ANSI sequences are returned regardless of
            104 | // whether stdout is a TTY. When false, empty strings are returned regardless.
            105 | // The override is process-global (prd003-format R2.6).
            106 | func SetColorEnabled(enabled bool) {
            107 | 	colorMu.Lock()
            108 | 	defer colorMu.Unlock()
            109 | 	colorOverride = &enabled
            110 | }
            112 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting to
            113 | // automatic TTY detection via ColorEnabled (prd003-format R2.7).
            114 | func ResetColorEnabled() {
            115 | 	colorMu.Lock()
            116 | 	defer colorMu.Unlock()
            117 | 	colorOverride = nil
            118 | }
            120 | // isColorActive returns true when color output is enabled. It checks the
            121 | // process-global override first; if no override is set, it falls back to
            122 | // automatic TTY detection on os.Stdout (prd003-format R2.3, R2.6).
            123 | func isColorActive() bool {
            124 | 	colorMu.Lock()
            125 | 	override := colorOverride
            126 | 	colorMu.Unlock()
            128 | 	if override != nil {
            129 | 		return *override
            130 | 	}
            131 | 	return ColorEnabled(os.Stdout)
            132 | }
        - file: pkg/format/columns.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"strings"
            8 | 	"unicode/utf8"
            9 | )
            11 | // columnGap is the number of spaces between adjacent columns in grid output.
            12 | const columnGap = 2
            14 | // Columns distributes entries into the maximum number of columns that fit
            15 | // within termWidth, using the longest entry in each column to determine column
            16 | // width (prd003-format R1.1, R1.4). Entries are ordered column-major: they
            17 | // fill down the first column, then the second, matching GNU ls default layout.
            18 | // Returns nil for empty input.
            19 | func Columns(entries []string, termWidth int) [][]string {
            20 | 	n := len(entries)
            21 | 	if n == 0 {
            22 | 		return nil
            23 | 	}
            25 | 	bestCols := 1
            27 | 	for numCols := n; numCols >= 1; numCols-- {
            28 | 		numRows := (n + numCols - 1) / numCols
            30 | 		colWidths := make([]int, numCols)
            31 | 		for i, entry := range entries {
            32 | 			col := i / numRows
            33 | 			w := utf8.RuneCountInString(entry)
            34 | 			if w > colWidths[col] {
            35 | 				colWidths[col] = w
            36 | 			}
            37 | 		}
            39 | 		total := 0
            40 | 		for _, w := range colWidths {
            41 | 			total += w
            42 | 		}
            43 | 		if numCols > 1 {
            44 | 			total += columnGap * (numCols - 1)
            45 | 		}
            47 | 		if total <= termWidth {
            48 | 			bestCols = numCols
            49 | 			break
            50 | 		}
            51 | 	}
            53 | 	numRows := (n + bestCols - 1) / bestCols
            54 | 	rows := make([][]string, numRows)
            55 | 	for r := 0; r < numRows; r++ {
            56 | 		row := make([]string, 0, bestCols)
            57 | 		for c := 0; c < bestCols; c++ {
            58 | 			idx := c*numRows + r
            59 | 			if idx < n {
            60 | 				row = append(row, entries[idx])
            61 | 			}
            62 | 		}
            63 | 		rows[r] = row
            64 | 	}
            65 | 	return rows
            66 | }
            68 | // PadRight pads s with trailing spaces to the specified display width using
            69 | // rune count (prd003-format R1.2, R1.3). If s is already at least width runes
            70 | // wide, it is returned unchanged.
            71 | func PadRight(s string, width int) string {
            72 | 	runeCount := utf8.RuneCountInString(s)
            73 | 	if runeCount >= width {
            74 | 		return s
            75 | 	}
            76 | 	return s + strings.Repeat(" ", width-runeCount)
            77 | }
            79 | // PadLeft pads s with leading spaces to the specified display width using
            80 | // rune count (prd003-format R1.2, R1.3). If s is already at least width runes
            81 | // wide, it is returned unchanged.
            82 | func PadLeft(s string, width int) string {
            83 | 	runeCount := utf8.RuneCountInString(s)
            84 | 	if runeCount >= width {
            85 | 		return s
            86 | 	}
            87 | 	return strings.Repeat(" ", width-runeCount) + s
            88 | }
        - file: pkg/format/columns_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for Columns, PadRight, and PadLeft (prd003-format R1.1, R1.2, R1.3, R1.4).
            5 | package format
            7 | import (
            8 | 	"testing"
            9 | )
            11 | func TestColumns(t *testing.T) {
            12 | 	tests := []struct {
            13 | 		name      string
            14 | 		entries   []string
            15 | 		termWidth int
            16 | 		want      [][]string
            17 | 	}{
            18 | 		{
            19 | 			name:      "empty input returns nil",
            20 | 			entries:   []string{},
            21 | 			termWidth: 80,
            22 | 			want:      nil,
            23 | 		},
            24 | 		{
            25 | 			name:      "single entry",
            26 | 			entries:   []string{"hello"},
            27 | 			termWidth: 80,
            28 | 			want:      [][]string{{"hello"}},
            29 | 		},
            30 | 		{
            31 | 			name:    "all entries fit in one row",
            32 | 			entries: []string{"a", "bb", "ccc"},
            33 | 			// 3 cols, 1 row: colWidths=[1,2,3], total=1+2+3+2*2=10 <= 80
            34 | 			termWidth: 80,
            35 | 			want:      [][]string{{"a", "bb", "ccc"}},
            36 | 		},
            37 | 		{
            38 | 			name:    "entries wider than terminal force single column",
            39 | 			entries: []string{"abcdef", "ghijkl", "mnopqr"},
            40 | 			// Each entry is 6 chars, wider than termWidth=5.
            41 | 			// Even 2 cols: 6+6+2=14 > 5. Falls to 1 col.
            42 | 			termWidth: 5,
            43 | 			want:      [][]string{{"abcdef"}, {"ghijkl"}, {"mnopqr"}},
            44 | 		},
            45 | 		{
            46 | 			name:    "column-major ordering two columns",
            47 | 			entries: []string{"a", "bb", "ccc", "d", "ee"},
            48 | 			// numCols=2, numRows=3
            49 | 			// col 0: a(1), bb(2), ccc(3) -> width=3
            50 | 			// col 1: d(1), ee(2) -> width=2
            51 | 			// total = 3+2+2 = 7 <= 10
            52 | 			// Row 0: entries[0]="a", entries[3]="d"
            53 | 			// Row 1: entries[1]="bb", entries[4]="ee"
            54 | 			// Row 2: entries[2]="ccc"
            55 | 			termWidth: 10,
            56 | 			want: [][]string{
            57 | 				{"a", "d"},
            58 | 				{"bb", "ee"},
            59 | 				{"ccc"},
            60 | 			},
            61 | 		},
            62 | 		{
            63 | 			name:    "column-major ordering three columns",
            64 | 			entries: []string{"aa", "bb", "cc", "dd", "ee", "ff"},
            65 | 			// numCols=3, numRows=2: colWidths=[2,2,2], total=6+2*2=10 <= 10
            66 | 			// Row 0: entries[0]="aa", entries[2]="cc", entries[4]="ee"
            67 | 			// Row 1: entries[1]="bb", entries[3]="dd", entries[5]="ff"
            68 | 			termWidth: 10,
            69 | 			want: [][]string{
            70 | 				{"aa", "cc", "ee"},
            71 | 				{"bb", "dd", "ff"},
            72 | 			},
            73 | 		},
            74 | 		{
            75 | 			name:    "uneven last column",
            76 | 			entries: []string{"alpha", "beta", "gamma", "delta"},
            77 | 			// 4 entries all fit in 1 row: widths=[5,4,5,5], total=19+2*3=25 <= 80
            78 | 			termWidth: 80,
            79 | 			want:      [][]string{{"alpha", "beta", "gamma", "delta"}},
            80 | 		},
            81 | 		{
            82 | 			name:    "exact fit at terminal width",
            83 | 			entries: []string{"abc", "def"},
            84 | 			// 2 cols, 1 row: total = 3+3+2 = 8 <= 8
            85 | 			termWidth: 8,
            86 | 			want:      [][]string{{"abc", "def"}},
            87 | 		},
            88 | 		{
            89 | 			name:    "one char too narrow forces fewer columns",
            90 | 			entries: []string{"abc", "def"},
            91 | 			// 2 cols, 1 row: total = 3+3+2 = 8 > 7
            92 | 			// 1 col, 2 rows: total = 3 <= 7
            93 | 			termWidth: 7,
            94 | 			want:      [][]string{{"abc"}, {"def"}},
            95 | 		},
            96 | 	}
            98 | 	for _, tt := range tests {
            99 | 		t.Run(tt.name, func(t *testing.T) {
            100 | 			got := Columns(tt.entries, tt.termWidth)
            101 | 			if tt.want == nil {
            102 | 				if got != nil {
            103 | 					t.Errorf("Columns() = %v; want nil", got)
            104 | 				}
            105 | 				return
            106 | 			}
            107 | 			if len(got) != len(tt.want) {
            108 | 				t.Fatalf("Columns() returned %d rows; want %d", len(got), len(tt.want))
            109 | 			}
            110 | 			for r, wantRow := range tt.want {
            111 | 				gotRow := got[r]
            112 | 				if len(gotRow) != len(wantRow) {
            113 | 					t.Errorf("row %d: got %d entries %v; want %d entries %v", r, len(gotRow), gotRow, len(wantRow), wantRow)
            114 | 					continue
            115 | 				}
            116 | 				for c, wantVal := range wantRow {
            117 | 					if gotRow[c] != wantVal {
            118 | 						t.Errorf("row %d col %d: got %q; want %q", r, c, gotRow[c], wantVal)
            119 | 					}
            120 | 				}
            121 | 			}
            122 | 		})
            123 | 	}
            124 | }
            126 | func TestPadRight(t *testing.T) {
            127 | 	tests := []struct {
