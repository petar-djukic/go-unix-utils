            167 | 	return 256 * 1024 * 1024
            168 | }
            170 | // createTempFile creates a temp file in TMPDIR or /tmp (R1.4).
            171 | func createTempFile() (*os.File, error) {
            172 | 	dir := os.Getenv("TMPDIR")
