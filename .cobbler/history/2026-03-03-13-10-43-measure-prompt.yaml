            192 | // runFileOutputTest runs both the Go and reference sponge binaries with
            193 | // identical inputs and an output file argument, then compares the resulting
            194 | // output files byte-for-byte and stderr/exit code.
            195 | func runFileOutputTest(t *testing.T, tc fileOutputCase) {
            196 | 	t.Helper()
            198 | 	// Create isolated directories for each binary.
            199 | 	goDir := t.TempDir()
            200 | 	refDir := t.TempDir()
            202 | 	goOutFile := filepath.Join(goDir, "out.txt")
            203 | 	refOutFile := filepath.Join(refDir, "out.txt")
            205 | 	// Pre-populate output files if needed.
            206 | 	if tc.existingContent != nil {
            207 | 		if err := os.WriteFile(goOutFile, []byte(*tc.existingContent), 0o644); err != nil {
            208 | 			t.Fatalf("writing go output file: %v", err)
            209 | 		}
            210 | 		if err := os.WriteFile(refOutFile, []byte(*tc.existingContent), 0o644); err != nil {
            211 | 			t.Fatalf("writing ref output file: %v", err)
            212 | 		}
            213 | 	}
            215 | 	env := buildTestEnv()
            217 | 	// Build args: flags + output filename.
            218 | 	goArgs := append(append([]string{}, tc.args...), goOutFile)
            219 | 	refArgs := append(append([]string{}, tc.args...), refOutFile)
            221 | 	goStderr, goExit := runSponge(t, goBinaryPath, goArgs, tc.stdin, env)
            222 | 	refStderr, refExit := runSponge(t, refBinaryPath, refArgs, tc.stdin, env)
            224 | 	// Compare exit codes.
            225 | 	if refExit != goExit {
            226 | 		t.Errorf("exit code divergence: ref=%d go=%d", refExit, goExit)
            227 | 	}
            229 | 	// Compare stderr.
            230 | 	if !bytes.Equal(refStderr, goStderr) {
            231 | 		t.Errorf("stderr divergence:\n  ref: %q\n  go:  %q", refStderr, goStderr)
            232 | 	}
            234 | 	// Compare output file contents.
            235 | 	goContent, goReadErr := os.ReadFile(goOutFile)
            236 | 	refContent, refReadErr := os.ReadFile(refOutFile)
            238 | 	if (goReadErr == nil) != (refReadErr == nil) {
            239 | 		t.Fatalf("output file existence divergence: ref err=%v, go err=%v", refReadErr, goReadErr)
            240 | 	}
            242 | 	if goReadErr == nil && !bytes.Equal(refContent, goContent) {
            243 | 		t.Errorf("output file content divergence:\n  ref: %q\n  go:  %q", refContent, goContent)
            244 | 	}
            245 | }
            247 | // buildTestEnv constructs the environment with LC_ALL=C (ARCHITECTURE.yaml DD6).
            248 | func buildTestEnv() []string {
            249 | 	env := os.Environ()
            250 | 	prefix := "LC_ALL="
            251 | 	for i, e := range env {
            252 | 		if strings.HasPrefix(e, prefix) {
            253 | 			env[i] = prefix + "C"
            254 | 			return env
            255 | 		}
            256 | 	}
            257 | 	return append(env, prefix+"C")
            258 | }
            260 | // runSponge executes a sponge binary and returns its stderr and exit code.
            261 | func runSponge(t *testing.T, binary string, args []string, stdin string, env []string) (stderr []byte, exitCode int) {
            262 | 	t.Helper()
            264 | 	ctx, cancel := context.WithTimeout(context.Background(), fileOutputTimeout)
            265 | 	defer cancel()
            267 | 	cmd := exec.CommandContext(ctx, binary, args...)
            268 | 	cmd.Env = env
            270 | 	if stdin != "" {
            271 | 		cmd.Stdin = strings.NewReader(stdin)
            272 | 	}
            274 | 	var errBuf bytes.Buffer
            275 | 	cmd.Stderr = &errBuf
            277 | 	err := cmd.Run()
            278 | 	stderr = errBuf.Bytes()
            280 | 	if ctx.Err() == context.DeadlineExceeded {
            281 | 		t.Fatalf("timeout executing %s with args %v", binary, args)
            282 | 	}
            284 | 	if err != nil {
            285 | 		if exitErr, ok := err.(*exec.ExitError); ok {
            286 | 			exitCode = exitErr.ExitCode()
            287 | 		} else {
            288 | 			t.Fatalf("failed to execute %s: %v", binary, err)
            289 | 		}
            290 | 	}
            292 | 	return stderr, exitCode
            293 | }
