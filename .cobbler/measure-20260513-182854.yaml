- index: 0
  title: "srd003-format: pkg/format (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd003-format.yaml (full SRD for output formatting)
      - docs/ARCHITECTURE.yaml (pkg/format component description and dependencies)
      - pkg/sys/ (format depends on sys for terminal detection via IsTerminal)

    files:
      - path: pkg/format/humansize.go
        action: create
        note: "HumanSizeOpts struct and HumanSize function stub"
      - path: pkg/format/color.go
        action: create
        note: "FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled stubs"
      - path: pkg/format/columns.go
        action: create
        note: "PadRight, PadLeft, Columns function stubs"

    requirements:
      - id: R1
        text: "Define HumanSizeOpts struct with Binary bool field, and stub HumanSize function: func HumanSize(bytes int64, opts HumanSizeOpts) string"
      - id: R2
        text: "Define color function stubs: func FileTypeColor(mode os.FileMode) string, func Reset() string, func ColorEnabled(w io.Writer) bool, func SetColorEnabled(enabled bool), func ResetColorEnabled()"
      - id: R3
        text: "Define alignment function stubs: func PadRight(s string, width int) string, func PadLeft(s string, width int) string, func Columns(entries []string, termWidth int) [][]string"

    design_decisions:
      - id: D1
        text: "Package name is format. Source files are humansize.go, color.go, columns.go -- not format.go (P7 naming convention)"
      - id: D2
        text: "Stub implementations return zero values: HumanSize returns empty string, ColorEnabled returns false, PadRight/PadLeft return s unchanged, Columns returns nil"
      - id: D3
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for terminal detection in ColorEnabled. Import io and os as needed by function signatures"
      - id: D4
        text: "Must not import any cmd/ package"

    acceptance_criteria:
      - id: AC1
        text: "go build ./pkg/format/... succeeds with no errors"
      - id: AC2
        text: "go vet ./pkg/format/... reports no issues"
      - id: AC3
        text: "All 10 exported symbols present: HumanSizeOpts (struct), HumanSize, FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled, PadRight, PadLeft, Columns (functions)"
      - id: AC4
        text: "No imports of cmd/ packages or pkg/ packages other than pkg/sys"

