- index: 0
  title: "cmd/tsort: core sort and I/O (srd102 R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd102-tsort.yaml (requirements R1.1-R1.4 -- the primary specification)
      - cmd/basename/main.go (reference for cmd/ package structure, flag parsing, and SIGPIPE pattern)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage)

    files:
      - path: cmd/tsort/main.go
        action: create
        note: tsort utility -- topological sort of a directed acyclic graph

    requirements:
      - id: R1
        text: "Implement srd102-tsort R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd102-tsort R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd102-tsort R1.3 as specified in the SRD"
      - id: R4
        text: "Implement srd102-tsort R1.4 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project SIGPIPE protocol"
      - id: D2
        text: "Import path is github.com/petar-djukic/go-unix-utils/pkg/sys for the SIGPIPE handler"
      - id: D3
        text: "Build output to bin/tsort using go build -o bin/tsort ./cmd/tsort/"

    acceptance_criteria:
      - id: AC1
        text: "cmd/tsort/main.go exists and compiles with go build ./cmd/tsort/"
      - id: AC2
        text: "go vet ./cmd/tsort/ passes with no warnings"
      - id: AC3
        text: "All srd102-tsort requirements R1.1 through R1.4 are implemented"
      - id: AC4
        text: "tsort reads input pairs and outputs nodes in topological order to stdout"

- index: 1
  title: "cmd/tsort: error handling and cycles (srd102 R2.1-R2.3)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd102-tsort.yaml (requirements R2.1-R2.3 -- error handling and cycle detection)
      - cmd/tsort/main.go (existing implementation from prior task -- R1.1-R1.4 already implemented)

    files:
      - path: cmd/tsort/main.go
        action: modify
        note: Add cycle detection, error reporting, and edge case handling

    requirements:
      - id: R1
        text: "Implement srd102-tsort R2.1 as specified in the SRD"
      - id: R2
        text: "Implement srd102-tsort R2.2 as specified in the SRD"
      - id: R3
        text: "Implement srd102-tsort R2.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Error messages go to stderr, matching GNU tsort behavior"
      - id: D2
        text: "Preserve existing R1.1-R1.4 implementation while adding error handling paths"

    acceptance_criteria:
      - id: AC1
        text: "cmd/tsort/main.go compiles with go build ./cmd/tsort/"
      - id: AC2
        text: "go vet ./cmd/tsort/ passes with no warnings"
      - id: AC3
        text: "All srd102-tsort requirements R2.1 through R2.3 are implemented"
      - id: AC4
        text: "Cycle detection reports errors to stderr and sets appropriate exit code"

- index: 2
  title: "cmd/tsort: differential tests (srd102 R1.1-R2.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd102-tsort.yaml (all requirements R1.1-R2.3 -- test cases must cover full specification)
      - cmd/tsort/main.go (implementation under test)
      - cmd/basename/basename_test.go (reference for differential test file structure)
      - pkg/testutils/difftest.go (DiffTest struct, RunDiffTests, BuildBinary API)

    files:
      - path: cmd/tsort/tsort_test.go
        action: create
        note: Differential tests comparing Go tsort against GNU gtsort

    requirements:
      - id: R1
        text: "Write differential tests covering srd102-tsort R1.1 through R1.4 (core sort and I/O)"
      - id: R2
        text: "Write differential tests covering srd102-tsort R2.1 through R2.3 (error handling and cycles)"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary under test"
      - id: D2
        text: "Reference binary is gtsort, looked up via exec.LookPath(\"gtsort\"); skip if not found"
      - id: D3
        text: "Set LC_ALL=C in test environment per project differential testing protocol"
      - id: D4
        text: "Test cases are []testutils.DiffTest slices passed to testutils.RunDiffTests"

    acceptance_criteria:
      - id: AC1
        text: "cmd/tsort/tsort_test.go exists and compiles with go test -c ./cmd/tsort/"
      - id: AC2
        text: "Tests skip gracefully when gtsort reference binary is not in PATH"
      - id: AC3
        text: "At least one test case per srd102 requirement group (R1.x and R2.x)"
      - id: AC4
        text: "go test ./cmd/tsort/ -count=1 passes (or skips if gtsort not available)"

