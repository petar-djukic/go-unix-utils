- index: 2
  title: "[stitch] cmd/rm: srd058 (contract)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd058-rm.yaml (full SRD for rm -- read all requirements to understand the complete interface)
      - cmd/mv/main.go (reference for cmd/ package structure and flag parsing pattern in this project)
      - cmd/mv/mv_test.go (reference for differential test skeleton pattern)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests pattern)

    files:
      - path: cmd/rm/main.go
        action: create
        note: Package main stub with sys.InstallSIGPIPEHandler, flag definitions, and function signatures as stubs
      - path: cmd/rm/rm_test.go
        action: create
        note: TestDiff skeleton with BuildBinary, LookPath for grm, and empty DiffTest slice

    requirements:
      - id: R1
        text: Create cmd/rm/main.go with package main, all import statements, flag variable declarations for all flags defined in srd058-rm, and func main() calling sys.InstallSIGPIPEHandler() followed by stub logic
      - id: R2
        text: Define internal function signatures (not bodies) for the primary operations described in srd058-rm -- each function has a comment noting which R-items it will implement
      - id: R3
        text: Create cmd/rm/rm_test.go with TestDiff function skeleton using testutils.BuildBinary and exec.LookPath("grm") with t.Skip fallback and an empty tests slice

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() as the first statement in main()
      - id: D2
        text: Use the standard flag package for option parsing, matching the pattern in other cmd/ packages
      - id: D3
        text: Stub functions should compile but print "not implemented" and os.Exit(1) so the binary builds but fails gracefully
      - id: D4
        text: Use exec.LookPath("grm") for the GNU reference binary name

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/rm ./cmd/rm/ succeeds with no errors"
      - id: AC2
        text: "go vet ./cmd/rm/ reports no issues"
      - id: AC3
        text: "go test ./cmd/rm/... -count=1 passes (TestDiff skips if grm not found, otherwise runs with empty test slice)"
      - id: AC4
        text: All flags from srd058-rm are declared as variables (even if not yet wired to logic)
      - id: AC5
        text: Internal function signatures cover the operations needed by R1.1 through R4.4

