- index: 0
  title: "[stitch] cmd/dircolors (srd109-dircolors R3.4, R3.5)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd109-dircolors.yaml (SRD -- focus on requirements R3.4 and R3.5)
      - cmd/dircolors/main.go (existing implementation to extend)
      - cmd/dircolors/dircolors_test.go (existing differential tests to extend)
      - docs/specs/test-suites/test-rel-13.0.yaml (test suite for release 13.0)

    files:
      - path: cmd/dircolors/main.go
        action: modify
        note: Extend implementation to satisfy srd109-dircolors R3.4 and R3.5
      - path: cmd/dircolors/dircolors_test.go
        action: modify
        note: Add differential test cases exercising R3.4 and R3.5 behavior

    requirements:
      - id: R1
        text: "Implement srd109-dircolors R3.4 as specified in the SRD"
      - id: R2
        text: "Implement srd109-dircolors R3.5 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Follow the existing cmd/dircolors code structure and patterns"
      - id: D2
        text: "Reference binary is gdircolors from Homebrew coreutils, looked up via exec.LookPath"
      - id: D3
        text: "Differential tests use testutils.RunDiffTests with LC_ALL=C"
      - id: D4
        text: "Skip tests gracefully with t.Skip if gdircolors is not found in PATH"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/dircolors ./cmd/dircolors/ succeeds"
      - id: AC2
        text: "go vet ./cmd/dircolors/... reports no issues"
      - id: AC3
        text: "go test ./cmd/dircolors/... -count=1 passes (or skips gracefully if gdircolors is not installed)"
      - id: AC4
        text: "srd109-dircolors R3.4 behavior is implemented and verified by differential test"
      - id: AC5
        text: "srd109-dircolors R3.5 behavior is implemented and verified by differential test"

- index: 1
  title: "[stitch] cmd/chronic implementation (srd112-chronic R1.1, R1.2, R1.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd112-chronic.yaml (SRD -- focus on requirements R1.1, R1.2, R1.3)
      - docs/specs/use-cases/rel14.0-uc001-chronic.yaml (use case for chronic)
      - pkg/sys/ (InstallSIGPIPEHandler pattern for SIGPIPE handling)

    files:
      - path: cmd/chronic/main.go
        action: create
        note: "chronic utility -- runs a command and suppresses output unless it fails"

    requirements:
      - id: R1
        text: "Implement srd112-chronic R1.1 as specified in the SRD"
      - id: R2
        text: "Implement srd112-chronic R1.2 as specified in the SRD"
      - id: R3
        text: "Implement srd112-chronic R1.3 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main"
      - id: D2
        text: "chronic is a moreutils utility that runs a command silently unless it fails -- read the SRD for exact behavior including exit code handling and verbose mode"
      - id: D3
        text: "Use os/exec to run the child command and capture stdout and stderr"
      - id: D4
        text: "Build output is bin/chronic -- use go build -o bin/chronic ./cmd/chronic/"

    acceptance_criteria:
      - id: AC1
        text: "go build -o bin/chronic ./cmd/chronic/ succeeds"
      - id: AC2
        text: "go vet ./cmd/chronic/... reports no issues"
      - id: AC3
        text: "srd112-chronic R1.1 is implemented as specified"
      - id: AC4
        text: "srd112-chronic R1.2 is implemented as specified"
      - id: AC5
        text: "srd112-chronic R1.3 is implemented as specified"

