- index: 2
  title: "[stitch] cmd/pr tests (srd110-pr R3.1, R4.1, R4.2, R4.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd110-pr.yaml (pr SRD -- requirements and acceptance criteria for test case derivation)
      - docs/specs/test-suites/test-rel-15.0.yaml (test suite for release 15.0)
      - cmd/pr/main.go (pr implementation to test)
      - pkg/testutils/difftest.go (DiffTest struct, RunDiffTests, BuildBinary)
      - cmd/nl/nl_test.go (reference test file for a text formatting utility)

    files:
      - path: cmd/pr/pr_test.go
        action: create
        note: Differential tests for pr covering R3.1, R4.1, R4.2, R4.3

    requirements:
      - id: R1
        text: Write differential tests verifying srd110-pr R3.1 acceptance criteria against gpr reference binary
      - id: R2
        text: Write differential tests verifying srd110-pr R4.1 acceptance criteria against gpr reference binary
      - id: R3
        text: Write differential tests verifying srd110-pr R4.2 acceptance criteria against gpr reference binary
      - id: R4
        text: Write differential tests verifying srd110-pr R4.3 acceptance criteria against gpr reference binary

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the pr binary under test"
      - id: D2
        text: "Use exec.LookPath(\"gpr\") to find the GNU reference binary; call t.Skip if not found"
      - id: D3
        text: "Use testutils.RunDiffTests(t, goBin, refBin, tests) for all differential test cases"
      - id: D4
        text: Set LC_ALL=C in test environment via DiffTest.Env to ensure locale-independent comparison
      - id: D5
        text: Create temporary test input files in t.TempDir() for tests that require file arguments

    acceptance_criteria:
      - id: AC1
        text: cmd/pr/pr_test.go compiles without errors
      - id: AC2
        text: go test ./cmd/pr/ -count=1 passes (or skips gracefully if gpr not in PATH)
      - id: AC3
        text: Test cases cover all acceptance criteria for R3.1, R4.1, R4.2, R4.3 from the SRD
      - id: AC4
        text: Tests skip gracefully when reference binary gpr is not found via exec.LookPath

