- index: 0
  title: "[stitch] cmd/pr implementation (srd110-pr R3.1, R4.1, R4.2, R4.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd110-pr.yaml (pr SRD -- requirements, acceptance criteria, and design decisions)
      - docs/specs/use-cases/rel15.0-uc003-pr.yaml (pr use case with end-to-end execution paths)
      - pkg/sys/sys.go (InstallSIGPIPEHandler pattern)
      - cmd/nl/main.go (reference implementation of a text formatting utility with line numbering and section handling)
      - cmd/fmt/main.go (reference implementation of a paragraph reformatter)

    files:
      - path: cmd/pr/main.go
        action: create
        note: pr utility implementation covering SRD requirements R3.1, R4.1, R4.2, R4.3

    requirements:
      - id: R1
        text: Implement srd110-pr requirement R3.1 as specified in the SRD
      - id: R2
        text: Implement srd110-pr requirement R4.1 as specified in the SRD
      - id: R3
        text: Implement srd110-pr requirement R4.2 as specified in the SRD
      - id: R4
        text: Implement srd110-pr requirement R4.3 as specified in the SRD

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils SIGPIPE behavior
      - id: D2
        text: "Import path for sys package: github.com/petar-djukic/go-unix-utils/pkg/sys"
      - id: D3
        text: Follow all design decisions specified in srd110-pr.yaml for the implemented requirements
      - id: D4
        text: The binary must be buildable with go build -o bin/pr ./cmd/pr/

    acceptance_criteria:
      - id: AC1
        text: cmd/pr/main.go compiles without errors (go build ./cmd/pr/)
      - id: AC2
        text: go vet ./cmd/pr/ reports no issues
      - id: AC3
        text: R3.1 acceptance criteria from srd110-pr.yaml are satisfied
      - id: AC4
        text: R4.1 acceptance criteria from srd110-pr.yaml are satisfied
      - id: AC5
        text: R4.2 acceptance criteria from srd110-pr.yaml are satisfied
      - id: AC6
        text: R4.3 acceptance criteria from srd110-pr.yaml are satisfied

