- index: 2
  title: "cmd/tsort differential tests (srd102-tsort R1.2, R1.3, R1.4)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd102-tsort.yaml (requirements R1.2, R1.3, R1.4 for test case design)
      - cmd/tsort/main.go (implementation under test)
      - cmd/tsort/tsort_test.go (existing test file if present)
      - pkg/testutils/ (RunDiffTests, BuildBinary, DiffTest struct)

    files:
      - path: cmd/tsort/tsort_test.go
        action: modify
        note: "Add differential test cases covering R1.2, R1.3, R1.4 behaviors"

    requirements:
      - id: R1
        text: "Add differential test cases exercising srd102-tsort R1.2 behaviors against the GNU gtsort reference binary"
      - id: R2
        text: "Add differential test cases exercising srd102-tsort R1.3 behaviors against the GNU gtsort reference binary"
      - id: R3
        text: "Add differential test cases exercising srd102-tsort R1.4 behaviors against the GNU gtsort reference binary"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile cmd/tsort and exec.LookPath(\"gtsort\") for the reference binary"
      - id: D2
        text: "Call t.Skip if gtsort is not found in PATH per project convention"
      - id: D3
        text: "Define test cases as []testutils.DiffTest and pass to testutils.RunDiffTests"
      - id: D4
        text: "Set LC_ALL=C in test environment per project convention"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/tsort/ -count=1 passes when gtsort is available, or skips gracefully when it is not"
      - id: AC2
        text: "Test cases cover all behaviors specified in srd102-tsort R1.2, R1.3, R1.4"
      - id: AC3
        text: "Tests follow the differential testing pattern: BuildBinary, LookPath, RunDiffTests"

