- index: 0
  title: "[stitch] cmd/sponge: implement sponge utility (srd007-sponge R1.5, R2.1-R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd007-sponge.yaml (full SRD -- read all requirements, focus on R1.5, R2.1, R2.2, R2.3)
      - pkg/sys/ (InstallSIGPIPEHandler usage pattern for cmd/ utilities)

    files:
      - path: cmd/sponge/main.go
        action: create
        note: sponge utility implementation -- core stdin-to-file buffering

    requirements:
      - id: R1
        text: Implement srd007-sponge requirement R1.5
      - id: R2
        text: Implement srd007-sponge requirement R2.1
      - id: R3
        text: Implement srd007-sponge requirement R2.2
      - id: R4
        text: Implement srd007-sponge requirement R2.3

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU behavior when piped to consumers that close stdin early
      - id: D2
        text: Build binary with go build -o bin/sponge ./cmd/sponge/
      - id: D3
        text: Import pkg/sys as "github.com/petar-djukic/go-unix-utils/pkg/sys"

    acceptance_criteria:
      - id: AC1
        text: cmd/sponge/main.go exists and compiles with go build -o bin/sponge ./cmd/sponge/
      - id: AC2
        text: go vet ./cmd/sponge/... passes with no warnings
      - id: AC3
        text: srd007-sponge requirements R1.5, R2.1, R2.2, R2.3 are implemented per the SRD acceptance criteria
      - id: AC4
        text: The binary is a single main package with no test code

