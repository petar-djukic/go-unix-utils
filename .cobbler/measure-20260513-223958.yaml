- index: 2
  title: "[stitch] cmd/sponge: differential tests (srd007-sponge R3.3, R4.1-R4.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd007-sponge.yaml (full SRD -- read all requirements, focus on R3.3, R4.1, R4.2, R4.3)
      - cmd/sponge/main.go (implementation under test)
      - pkg/testutils/ (DiffTest struct, RunDiffTests function, BuildBinary function)

    files:
      - path: cmd/sponge/sponge_test.go
        action: create
        note: differential tests comparing Go sponge against Homebrew moreutils reference binary

    requirements:
      - id: R1
        text: Implement srd007-sponge requirement R3.3
      - id: R2
        text: Implement srd007-sponge requirement R4.1
      - id: R3
        text: Implement srd007-sponge requirement R4.2
      - id: R4
        text: Implement srd007-sponge requirement R4.3

    design_decisions:
      - id: D1
        text: "Use the standard differential testing pattern: goBin := testutils.BuildBinary(t, \".\") for the Go binary, exec.LookPath for the reference binary"
      - id: D2
        text: Call t.Skip if the reference binary is not found so tests pass on machines without Homebrew moreutils installed
      - id: D3
        text: Structure tests as []testutils.DiffTest slices passed to testutils.RunDiffTests
      - id: D4
        text: "Check the SRD for the exact reference binary name -- moreutils binaries may or may not use a g-prefix depending on the Homebrew installation"

    acceptance_criteria:
      - id: AC1
        text: cmd/sponge/sponge_test.go exists and compiles
      - id: AC2
        text: go test ./cmd/sponge/... -count=1 passes (or skips gracefully if reference binary not found)
      - id: AC3
        text: srd007-sponge requirements R3.3, R4.1, R4.2, R4.3 are covered by test cases
      - id: AC4
        text: Tests use the RunDiffTests pattern from pkg/testutils

