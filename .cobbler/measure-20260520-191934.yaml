- index: 0
  title: "[stitch] cmd/sort: srd053 R4.2-R4.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd053-sort.yaml (requirement group R4 -- R4.2, R4.3, R4.4)
      - cmd/sort/main.go (existing implementation from earlier requirement groups R1-R4.1)
      - cmd/sort/sort_test.go (existing differential tests)
      - pkg/testutils/ (RunDiffTests pattern and DiffTest struct)
      - CLAUDE.md (project rules, build commands, differential testing pattern)

    files:
      - path: cmd/sort/main.go
        action: modify
        note: Add functionality for srd053 requirements R4.2, R4.3, R4.4
      - path: cmd/sort/sort_test.go
        action: modify
        note: Add differential test cases covering R4.2, R4.3, R4.4

    requirements:
      - id: R1
        text: "Implement srd053-sort requirement R4.2 per the SRD specification"
      - id: R2
        text: "Implement srd053-sort requirement R4.3 per the SRD specification"
      - id: R3
        text: "Implement srd053-sort requirement R4.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D2
        text: "Use testutils.RunDiffTests with gsort as the reference binary for differential testing"
      - id: D3
        text: "Skip tests with t.Skip if gsort is not found via exec.LookPath"
      - id: D4
        text: "Set LC_ALL=C in test environment to match GNU reference binary collation behavior"
      - id: D5
        text: "Build binary with testutils.BuildBinary(t, \".\") -- do not create temporary Go programs outside the module"

    acceptance_criteria:
      - id: AC1
        text: "srd053 R4.2 behavior implemented and matching gsort output"
      - id: AC2
        text: "srd053 R4.3 behavior implemented and matching gsort output"
      - id: AC3
        text: "srd053 R4.4 behavior implemented and matching gsort output"
      - id: AC4
        text: "go build ./cmd/sort/ compiles without errors"
      - id: AC5
        text: "go test ./cmd/sort/ -count=1 passes (or skips gracefully if gsort not installed)"

