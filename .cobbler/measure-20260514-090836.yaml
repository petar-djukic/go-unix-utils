- index: 0
  title: "[stitch] cmd/seq: basic sequence generation and argument forms (srd019-seq R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd019-seq.yaml (seq SRD with all requirements and acceptance criteria)
      - cmd/head/main.go (reference pattern for cmd/ package structure, flag parsing, SIGPIPE handler, error handling)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage)

    files:
      - path: cmd/seq/main.go
        action: create
        note: "seq utility -- basic argument parsing and sequence generation with three positional forms"

    requirements:
      - id: R1
        text: "Implement srd019-seq R1.1: parse the single-argument form (seq LAST) and generate a sequence from 1 to LAST with increment 1"
      - id: R2
        text: "Implement srd019-seq R1.2: parse the two-argument form (seq FIRST LAST) and generate a sequence from FIRST to LAST with increment 1"
      - id: R3
        text: "Implement srd019-seq R1.3: parse the three-argument form (seq FIRST INCREMENT LAST) and generate a sequence from FIRST to LAST stepping by INCREMENT"
      - id: R4
        text: "Implement srd019-seq R1.4: default output prints one number per line terminated by a newline; the final line is also terminated by a newline"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the project shared protocol for all cmd/ utilities that write to stdout"
      - id: D2
        text: "Write sequence output to os.Stdout via a bufio.Writer; flush before exit"
      - id: D3
        text: "Parse all flags (-f, -s, -w, --help, --version) in this initial task even if their behavior is implemented in later tasks, so the argument parser is complete from the start"

    acceptance_criteria:
      - id: AC1
        text: "cmd/seq/main.go compiles with: go build -o bin/seq ./cmd/seq/"
      - id: AC2
        text: "seq 5 outputs lines: 1, 2, 3, 4, 5 (one per line, each terminated by newline)"
      - id: AC3
        text: "seq 3 7 outputs lines: 3, 4, 5, 6, 7"
      - id: AC4
        text: "seq 1 3 10 outputs lines: 1, 4, 7, 10"
      - id: AC5
        text: "go vet ./cmd/seq/... passes with no errors"

- index: 1
  title: "[stitch] cmd/seq: format string, separator, and help flags (srd019-seq R1.5, R2.1-R2.3)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd019-seq.yaml (seq SRD with all requirements and acceptance criteria)
      - cmd/seq/main.go (existing implementation with basic sequence generation from previous task)

    files:
      - path: cmd/seq/main.go
        action: modify
        note: "Add --help/--version flags, -f format string, auto-detected default format, and -s separator"

    requirements:
      - id: R1
        text: "Implement srd019-seq R1.5: --help prints usage information to stdout and exits 0; --version prints version information to stdout and exits 0"
      - id: R2
        text: "Implement srd019-seq R2.1: -f FORMAT applies a printf-style format string containing exactly one floating-point conversion (%e, %f, %g, or variants) to each output number"
      - id: R3
        text: "Implement srd019-seq R2.2: when -f is not specified, auto-detect the default output format from the arguments using the widest precision among FIRST, INCREMENT, and LAST"
      - id: R4
        text: "Implement srd019-seq R2.3: -s STRING sets the separator between consecutive output numbers; default separator is newline; a final newline is always printed after the last number"

    design_decisions:
      - id: D1
        text: "Validate that the -f format string contains exactly one numeric conversion specifier; reject with an error if it contains zero or more than one"
      - id: D2
        text: "Auto-detect precision by counting decimal digits in each argument string representation and using the maximum"

    acceptance_criteria:
      - id: AC1
        text: "seq -f '%04g' 3 outputs lines: 0001, 0002, 0003"
      - id: AC2
        text: "seq -s ', ' 3 outputs: '1, 2, 3' followed by a newline"
      - id: AC3
        text: "seq -s '' 3 outputs: 123 followed by a newline"
      - id: AC4
        text: "seq --help prints usage to stdout and exits 0"
      - id: AC5
        text: "seq --version prints version info to stdout and exits 0"
      - id: AC6
        text: "go vet ./cmd/seq/... passes with no errors"

- index: 2
  title: "[stitch] cmd/seq: equal-width padding and number precision (srd019-seq R2.4, R3.1-R3.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd019-seq.yaml (seq SRD with all requirements and acceptance criteria)
      - cmd/seq/main.go (existing implementation with format and separator support from previous tasks)

    files:
      - path: cmd/seq/main.go
        action: modify
        note: "Add -w equal-width zero-padding, floating-point precision handling, integer optimization, and negative number support"

    requirements:
      - id: R1
        text: "Implement srd019-seq R2.4: -w flag pads all output numbers with leading zeros so they have equal width; width is determined by the widest endpoint string representation including any minus sign and decimal point"
      - id: R2
        text: "Implement srd019-seq R3.1: when arguments contain decimal points, output preserves the maximum decimal precision from all arguments"
      - id: R3
        text: "Implement srd019-seq R3.2: when all arguments are integers (no decimal point), output numbers as integers with no decimal point unless -f overrides"
      - id: R4
        text: "Implement srd019-seq R3.3: negative numbers and negative increments work correctly; decreasing sequences (e.g., seq 5 -1 1) produce output in descending order"

    design_decisions:
      - id: D1
        text: "Equal-width calculation uses the string representation of the formatted FIRST and LAST values to determine pad width"
      - id: D2
        text: "When -w and -f are both specified, -f takes precedence per GNU seq behavior"

    acceptance_criteria:
      - id: AC1
        text: "seq -w 1 10 outputs: 01, 02, 03, 04, 05, 06, 07, 08, 09, 10 (one per line)"
      - id: AC2
        text: "seq -w 5 -1 1 outputs: 5, 4, 3, 2, 1 (one per line, no padding needed since all same width)"
      - id: AC3
        text: "seq 0.5 0.5 2.0 outputs: 0.5, 1.0, 1.5, 2.0 (one per line, preserving one decimal place)"
      - id: AC4
        text: "seq 5 outputs: 1, 2, 3, 4, 5 with no decimal points (integer arguments produce integer output)"
      - id: AC5
        text: "seq 5 -1 1 outputs: 5, 4, 3, 2, 1 (descending sequence)"
      - id: AC6
        text: "go vet ./cmd/seq/... passes with no errors"

- index: 3
  title: "[stitch] cmd/seq: edge cases and error handling (srd019-seq R3.4, R4.1-R4.3)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd019-seq.yaml (seq SRD with all requirements and acceptance criteria)
      - cmd/seq/main.go (existing implementation with all formatting and precision features from previous tasks)

    files:
      - path: cmd/seq/main.go
        action: modify
        note: "Handle large sequences, invalid arguments, argument count validation, and exit code behavior"

    requirements:
      - id: R1
        text: "Implement srd019-seq R3.4: large sequences (e.g., seq 1 1000000) produce output via streaming without buffering all numbers in memory"
      - id: R2
        text: "Implement srd019-seq R4.1: non-numeric arguments produce an error message to stderr identifying the invalid argument and exit code 1"
      - id: R3
        text: "Implement srd019-seq R4.2: wrong number of positional arguments (zero or more than three) produces a usage error message to stderr and exit code 1"
      - id: R4
        text: "Implement srd019-seq R4.3: exit code is 0 on successful sequence generation; exit code is 1 on any error including invalid arguments, invalid format strings, and argument count violations"

    design_decisions:
      - id: D1
        text: "Error messages are written to stderr; sequence output is written to stdout"
      - id: D2
        text: "Error message format matches GNU seq: 'seq: invalid floating point argument: XYZ' for bad numbers"
      - id: D3
        text: "Use os.Exit(1) for error exits after writing the error message; do not use log.Fatal (it adds a timestamp)"

    acceptance_criteria:
      - id: AC1
        text: "seq abc writes an error to stderr mentioning the invalid argument and exits 1"
      - id: AC2
        text: "seq with no arguments writes a usage error to stderr and exits 1"
      - id: AC3
        text: "seq 1 2 3 4 (four positional arguments) writes a usage error to stderr and exits 1"
      - id: AC4
        text: "seq 1 0 10 (zero increment) writes an error to stderr and exits 1"
      - id: AC5
        text: "Successful runs exit 0; all error conditions exit 1"
      - id: AC6
        text: "go vet ./cmd/seq/... passes with no errors"