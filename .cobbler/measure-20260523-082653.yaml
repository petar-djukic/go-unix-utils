- index: 0
  title: "Implement cmd/link (srd084 R2.1, R2.2, R2.3)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd084-link.yaml (requirements R2.1, R2.2, R2.3)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler pattern used by all cmd/ utilities)
      - cmd/unlink/main.go (reference pattern for a similar simple syscall wrapper)

    files:
      - path: cmd/link/main.go
        action: create
        note: link utility -- creates hard link via link(2) system call

    requirements:
      - id: R1
        text: "Implement srd084 R2.1 -- create a hard link from FILE1 to FILE2 using the link(2) system call (os.Link in Go)"
      - id: R2
        text: "Implement srd084 R2.2 -- validate exactly two operands are provided and print usage error to stderr with exit code 1 otherwise"
      - id: R3
        text: "Implement srd084 R2.3 -- report link(2) failure to stderr with the failing path and system error message, exit 1"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project SIGPIPE protocol"
      - id: D2
        text: "Use os.Link(oldname, newname) which wraps the link(2) system call"
      - id: D3
        text: "Match GNU coreutils link error message format for differential test compatibility"
      - id: D4
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for SIGPIPE handling"

    acceptance_criteria:
      - id: AC1
        text: "cmd/link/main.go compiles with go build -o bin/link ./cmd/link/"
      - id: AC2
        text: "go vet ./cmd/link/ reports no issues"
      - id: AC3
        text: "Running bin/link on two valid file paths creates a hard link (same inode)"
      - id: AC4
        text: "Running bin/link with fewer or more than 2 arguments prints error to stderr and exits 1"
      - id: AC5
        text: "Running bin/link with a nonexistent source file prints error to stderr and exits 1"

- index: 1
  title: "Differential tests for cmd/link (srd084 R2.1, R2.2, R2.3)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd084-link.yaml (requirements R2.1, R2.2, R2.3 -- test coverage targets)
      - cmd/link/main.go (implementation under test)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests function)
      - cmd/unlink/unlink_test.go (reference pattern for differential tests of a simple utility)

    files:
      - path: cmd/link/link_test.go
        action: create
        note: differential tests comparing cmd/link against glink reference binary

    requirements:
      - id: R1
        text: "Test srd084 R2.1 -- verify link creates a hard link with identical inode, matching glink behavior"
      - id: R2
        text: "Test srd084 R2.2 -- verify error output and exit code for wrong argument count matches glink"
      - id: R3
        text: "Test srd084 R2.3 -- verify error messages and exit codes for link(2) failures match glink"

    design_decisions:
      - id: D1
        text: "Use testutils.BuildBinary(t, \".\") to compile the Go binary from within the module"
      - id: D2
        text: "Use exec.LookPath(\"glink\") and t.Skip if the reference binary is not found"
      - id: D3
        text: "Follow the RunDiffTests pattern with []testutils.DiffTest test cases"
      - id: D4
        text: "Create temporary files and directories in t.TempDir() for link test operations"
      - id: D5
        text: "Set LC_ALL=C in test environment per project differential testing protocol"

    acceptance_criteria:
      - id: AC1
        text: "go test ./cmd/link/ -count=1 passes when glink is available"
      - id: AC2
        text: "Tests skip gracefully with t.Skip when glink is not in PATH"
      - id: AC3
        text: "Test cases cover -- successful link creation, zero arguments, one argument, three arguments, and nonexistent source file"
      - id: AC4
        text: "Stdout, stderr, and exit codes match glink output for every test case"

- index: 2
  title: "Implement cmd/sync core (srd085 R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd085-sync.yaml (requirements R1.1, R1.2, R1.3, R1.4)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler pattern used by all cmd/ utilities)
      - cmd/touch/main.go (reference pattern for a utility that opens files and performs syscalls)

    files:
      - path: cmd/sync/main.go
        action: create
        note: sync utility -- flush filesystem caches with per-file and per-filesystem modes

    requirements:
      - id: R1
        text: "Implement srd085 R1.1 -- default sync with no arguments calls sync(2) to flush all filesystem caches"
      - id: R2
        text: "Implement srd085 R1.2 -- when file operands are given without flags, call fsync(2) on each file"
      - id: R3
        text: "Implement srd085 R1.3 -- --data flag calls fdatasync(2) to sync file data without metadata"
      - id: R4
        text: "Implement srd085 R1.4 -- --file-system flag calls syncfs(2) on the filesystem containing each file"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per project SIGPIPE protocol"
      - id: D2
        text: "Use syscall.Sync() for no-argument invocation"
      - id: D3
        text: "Open each file operand with os.Open(), defer Close(), then call syscall.Fsync(fd), syscall.Fdatasync(fd), or unix.Syncfs(fd) depending on flags"
      - id: D4
        text: "Import golang.org/x/sys/unix for Syncfs which is not in the Go standard library syscall package"
      - id: D5
        text: "Import github.com/petar-djukic/go-unix-utils/pkg/sys for SIGPIPE handling"

    acceptance_criteria:
      - id: AC1
        text: "cmd/sync/main.go compiles with go build -o bin/sync ./cmd/sync/"
      - id: AC2
        text: "go vet ./cmd/sync/ reports no issues"
      - id: AC3
        text: "Running bin/sync with no arguments completes without error (flushes all caches)"
      - id: AC4
        text: "Running bin/sync FILE calls fsync on the named file"
      - id: AC5
        text: "Running bin/sync --data FILE calls fdatasync on the named file"
      - id: AC6
        text: "Running bin/sync --file-system FILE calls syncfs on the filesystem containing the file"

- index: 3
  title: "Implement cmd/sync error handling and flags (srd085 R2.1, R2.2, R2.3)"
  dependency: 2
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd085-sync.yaml (requirements R2.1, R2.2, R2.3)
      - cmd/sync/main.go (core implementation to extend with error handling)

    files:
      - path: cmd/sync/main.go
        action: modify
        note: add error handling, --help, --version, and edge case behavior

    requirements:
      - id: R1
        text: "Implement srd085 R2.1 -- report errors to stderr for files that cannot be opened or synced, include filename and system error"
      - id: R2
        text: "Implement srd085 R2.2 -- exit 0 when all operations succeed, exit 1 when any operation fails, continue processing remaining files after errors"
      - id: R3
        text: "Implement srd085 R2.3 -- handle --help (print usage to stdout, exit 0) and --version (print version to stdout, exit 0)"

    design_decisions:
      - id: D1
        text: "Print errors to stderr in GNU coreutils format -- 'sync: error message' -- for differential test compatibility"
      - id: D2
        text: "Track a boolean error flag across all file operands; set it on any failure but continue processing"
      - id: D3
        text: "Match GNU coreutils --help and --version output format"

    acceptance_criteria:
      - id: AC1
        text: "sync reports errors to stderr for files that cannot be opened, including the filename"
      - id: AC2
        text: "sync exits 1 when any file operation fails, 0 when all succeed"
      - id: AC3
        text: "sync continues processing remaining files after encountering an error"
      - id: AC4
        text: "sync --help prints usage information to stdout and exits 0"
      - id: AC5
        text: "sync --version prints version to stdout and exits 0"
      - id: AC6
        text: "go vet ./cmd/sync/ reports no issues after modifications"