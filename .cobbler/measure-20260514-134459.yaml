- index: 2
  title: "[stitch] cmd/ls: basic listing and default output (srd008-ls R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd008-ls.yaml (SRD for ls -- focus on requirements R1.1, R1.2, R1.3, R1.4)
      - pkg/sys/stat.go (Stat/Lstat for file metadata)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler pattern)
      - pkg/format/humansize.go (HumanSize for size formatting)
      - pkg/format/color.go (color output support)
      - pkg/testutils/difftest.go (RunDiffTests pattern for differential testing)
      - cmd/hostname/main.go (reference pattern for a simple cmd/ package structure)

    files:
      - path: cmd/ls/main.go
        action: create
        note: Initial ls implementation covering R1.1-R1.4
      - path: cmd/ls/ls_test.go
        action: create
        note: Differential tests for R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd008-ls requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd008-ls requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd008-ls requirement R1.3 as specified in the SRD
      - id: R4
        text: Implement srd008-ls requirement R1.4 as specified in the SRD
      - id: R5
        text: Add differential test cases for R1.1-R1.4 using testutils.RunDiffTests against the gls reference binary

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils behavior when piped
      - id: D2
        text: Use pkg/sys.Lstat for file metadata to correctly handle symlinks
      - id: D3
        text: Use testutils.RunDiffTests with the gls reference binary for differential testing
      - id: D4
        text: Call exec.LookPath("gls") and t.Skip if the reference binary is not found
      - id: D5
        text: Set LC_ALL=C in all differential test environments to ensure consistent sort order and output

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/ls ./cmd/ls/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/ls/ passes with no warnings
      - id: AC3
        text: go test ./cmd/ls/ -count=1 passes (including differential tests for R1.1-R1.4)
      - id: AC4
        text: Output matches gls reference binary for all R1.1-R1.4 test scenarios
      - id: AC5
        text: Binary builds to bin/ls (not left in working directory)

