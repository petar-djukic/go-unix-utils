- index: 0
  title: "[stitch] cmd/version (srd011-magefiles R5.1, srd059-version R1.5)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd011-magefiles.yaml (R5.1 requirement specification)
      - docs/specs/software-requirements/srd059-version.yaml (R1.5 requirement specification)
      - cmd/version/main.go (existing implementation -- prior task completed srd011-magefiles R1.1, R2.1, R3.1, R4.1)

    files:
      - path: cmd/version/main.go
        action: modify
        note: Extend version binary to satisfy srd011-magefiles R5.1 and srd059-version R1.5

    requirements:
      - id: R1
        text: "Implement srd011-magefiles R5.1 as specified in the SRD"
      - id: R2
        text: "Implement srd059-version R1.5 as specified in the SRD"

    design_decisions:
      - id: D1
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per the shared SIGPIPE protocol"
      - id: D2
        text: "Build output goes to bin/version via go build -o bin/version ./cmd/version/"

    acceptance_criteria:
      - id: AC1
        text: "go vet ./cmd/version/ passes with no errors"
      - id: AC2
        text: "go build -o bin/version ./cmd/version/ succeeds"
      - id: AC3
        text: "srd011-magefiles R5.1 acceptance criteria are met per the SRD"
      - id: AC4
        text: "srd059-version R1.5 acceptance criteria are met per the SRD"

