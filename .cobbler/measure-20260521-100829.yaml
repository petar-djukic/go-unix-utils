- index: 0
  title: "[stitch] cmd/expr: srd066 R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd066-expr.yaml (SRD for expr -- read requirements R1.1 through R1.4)
      - pkg/sys/ (InstallSIGPIPEHandler usage pattern)
      - pkg/testutils/ (DiffTest, RunDiffTests, BuildBinary usage pattern)

    files:
      - path: cmd/expr/main.go
        action: create
        note: expr implementation -- expression evaluation with arithmetic, comparison, and string operations
      - path: cmd/expr/expr_test.go
        action: create
        note: differential tests against gexpr reference binary

    requirements:
      - id: R1
        text: Implement srd066 requirement R1.1 as specified in the SRD
      - id: R2
        text: Implement srd066 requirement R1.2 as specified in the SRD
      - id: R3
        text: Implement srd066 requirement R1.3 as specified in the SRD
      - id: R4
        text: Implement srd066 requirement R1.4 as specified in the SRD

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main() to match GNU coreutils behavior when piped to consumers that close stdin early
      - id: D2
        text: Use pkg/testutils.RunDiffTests with gexpr as the reference binary for differential testing
      - id: D3
        text: Use exec.LookPath("gexpr") and t.Skip if the reference binary is not found -- tests must pass on machines without Homebrew GNU binaries

    acceptance_criteria:
      - id: AC1
        text: go build -o bin/expr ./cmd/expr/ succeeds with no errors
      - id: AC2
        text: go vet ./cmd/expr/... passes with no warnings
      - id: AC3
        text: go test ./cmd/expr/... -count=1 passes (or skips gracefully if gexpr not in PATH)
      - id: AC4
        text: All four SRD requirements R1.1-R1.4 are implemented and exercised by differential tests

