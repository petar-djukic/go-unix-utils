- index: 0
  title: "Implement cmd/base64 encoding mode (srd080-base64 R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd080-base64.yaml (full SRD -- requirements R1.1 through R1.4)
      - pkg/encutil/ (encoding utility library -- read all .go files for EncoderConfig, Encode, OpenInput exports)
      - pkg/sys/ (SIGPIPE handler -- read all .go files for InstallSIGPIPEHandler)

    files:
      - path: cmd/base64/main.go
        action: create
        note: base64 utility -- encoding mode with flag parsing, wrap control, stdin/file input

    requirements:
      - id: R1
        text: "Implement srd080-base64 R1.1 -- parse command-line flags for -w/--wrap column width and --help/--version"
      - id: R2
        text: "Implement srd080-base64 R1.2 -- encode stdin or file arguments to Base64 and write to stdout"
      - id: R3
        text: "Implement srd080-base64 R1.3 -- wrap encoded output at column 76 by default, configurable via -w; -w 0 disables wrapping"
      - id: R4
        text: "Implement srd080-base64 R1.4 -- read from stdin when no file arguments are given or when the file argument is '-'"

    design_decisions:
      - id: D1
        text: "Use pkg/encutil.Encode with an EncoderConfig whose Encode field is set to standard Base64 encoding and WrapCol is set from the -w flag (default 76)"
      - id: D2
        text: "Use pkg/encutil.OpenInput for file/stdin handling"
      - id: D3
        text: "Call pkg/sys.InstallSIGPIPEHandler() at the start of main per project convention"

    acceptance_criteria:
      - id: AC1
        text: "cmd/base64/main.go compiles with go build -o bin/base64 ./cmd/base64/"
      - id: AC2
        text: "echo 'hello' | go run ./cmd/base64/ produces valid Base64 output"
      - id: AC3
        text: "Default wrap column is 76; -w 0 disables line wrapping"
      - id: AC4
        text: "File arguments and stdin (no args or '-') both work as input"
      - id: AC5
        text: "go vet ./cmd/base64/ passes with no warnings"

- index: 1
  title: "Add decode mode to cmd/base64 (srd080-base64 R2.1-R2.4)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd080-base64.yaml (full SRD -- requirements R2.1 through R2.4)
      - cmd/base64/main.go (existing encoding implementation)
      - pkg/encutil/ (encoding utility library -- read all .go files for DecoderConfig, Decode exports)

    files:
      - path: cmd/base64/main.go
        action: modify
        note: add -d/--decode flag, ignore-garbage option, decode validation, and error reporting

    requirements:
      - id: R1
        text: "Implement srd080-base64 R2.1 -- add -d/--decode flag to switch from encode mode to decode mode"
      - id: R2
        text: "Implement srd080-base64 R2.2 -- decode Base64 input back to binary data on stdout"
      - id: R3
        text: "Implement srd080-base64 R2.3 -- add -i/--ignore-garbage flag to skip non-Base64-alphabet characters during decode"
      - id: R4
        text: "Implement srd080-base64 R2.4 -- report errors to stderr when input contains invalid Base64 during decode (without -i)"

    design_decisions:
      - id: D1
        text: "Use pkg/encutil.Decode with a DecoderConfig whose IgnoreGarbage field is set from the -i flag"

    acceptance_criteria:
      - id: AC1
        text: "echo 'aGVsbG8K' | go run ./cmd/base64/ -d produces 'hello'"
      - id: AC2
        text: "-i flag causes non-Base64 characters to be silently skipped during decode"
      - id: AC3
        text: "Invalid Base64 input without -i produces an error message on stderr and exits non-zero"
      - id: AC4
        text: "go vet ./cmd/base64/ passes with no warnings"

- index: 2
  title: "Error handling and multi-file support for cmd/base64 (srd080-base64 R3.1-R3.3)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd080-base64.yaml (full SRD -- requirements R3.1 through R3.3)
      - cmd/base64/main.go (existing implementation with encode and decode modes)

    files:
      - path: cmd/base64/main.go
        action: modify
        note: finalize exit codes, GNU-style error messages, and multi-file sequential processing

    requirements:
      - id: R1
        text: "Implement srd080-base64 R3.1 -- exit 0 on success, exit 1 on any failure"
      - id: R2
        text: "Implement srd080-base64 R3.2 -- print error messages to stderr in GNU coreutils format: 'base64: DESCRIPTION'"
      - id: R3
        text: "Implement srd080-base64 R3.3 -- process multiple file arguments sequentially, concatenating their content as input"

    design_decisions:
      - id: D1
        text: "Error messages use GNU format: program name, colon, space, then the error description"

    acceptance_criteria:
      - id: AC1
        text: "Successful encode or decode exits with code 0"
      - id: AC2
        text: "Failed decode of invalid input exits with code 1"
      - id: AC3
        text: "Error messages appear on stderr with 'base64: ' prefix matching GNU coreutils format"
      - id: AC4
        text: "Multiple file arguments are processed sequentially as concatenated input"
      - id: AC5
        text: "go build -o bin/base64 ./cmd/base64/ && go vet ./cmd/base64/ both pass"

- index: 3
  title: "Implement cmd/basenc encoding mode (srd081-basenc R1.1-R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd081-basenc.yaml (full SRD -- requirements R1.1 through R1.4)
      - pkg/encutil/ (encoding utility library -- read all .go files for EncoderConfig, Encode, OpenInput exports)
      - pkg/sys/ (SIGPIPE handler -- read all .go files for InstallSIGPIPEHandler)

    files:
      - path: cmd/basenc/main.go
        action: create
        note: basenc utility -- multi-encoding support with algorithm selection flags

    requirements:
      - id: R1
        text: "Implement srd081-basenc R1.1 -- parse encoding algorithm selection flags (--base64, --base64url, --base32, --base32hex, --base16, --z85) and -w/--wrap"
      - id: R2
        text: "Implement srd081-basenc R1.2 -- encode stdin or file arguments using the selected encoding algorithm"
      - id: R3
        text: "Implement srd081-basenc R1.3 -- wrap encoded output at column 76 by default, configurable via -w; -w 0 disables wrapping"
      - id: R4
        text: "Implement srd081-basenc R1.4 -- read from stdin when no file arguments are given or when the file argument is '-'"

    design_decisions:
      - id: D1
        text: "Use pkg/encutil.Encode with algorithm-specific EncoderConfig -- select the Encode function based on which --base* flag is specified"
      - id: D2
        text: "Use pkg/encutil.OpenInput for file/stdin handling"
      - id: D3
        text: "Call pkg/sys.InstallSIGPIPEHandler() at the start of main per project convention"
      - id: D4
        text: "Exactly one encoding flag must be specified -- error to stderr and exit 1 if zero or more than one encoding flag is given"

    acceptance_criteria:
      - id: AC1
        text: "cmd/basenc/main.go compiles with go build -o bin/basenc ./cmd/basenc/"
      - id: AC2
        text: "echo 'hello' | go run ./cmd/basenc/ --base64 produces Base64 encoded output"
      - id: AC3
        text: "All six encoding modes (--base64, --base64url, --base32, --base32hex, --base16, --z85) produce correct output"
      - id: AC4
        text: "Missing or multiple encoding flags produce an error on stderr and exit 1"
      - id: AC5
        text: "go vet ./cmd/basenc/ passes with no warnings"