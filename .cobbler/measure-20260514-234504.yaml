- index: 0
  title: "[stitch] cmd/fold: implement srd023-fold R1.1-R1.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd023-fold.yaml (SRD for fold utility -- read all requirements, focus on R1.1-R1.4)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests for differential testing)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler for SIGPIPE handling)

    files:
      - path: cmd/fold/main.go
        action: create
        note: fold utility main implementation covering srd023-fold R1.1-R1.4
      - path: cmd/fold/fold_test.go
        action: create
        note: differential tests for srd023-fold R1.1-R1.4

    requirements:
      - id: R1
        text: Implement srd023-fold requirement R1.1
      - id: R2
        text: Implement srd023-fold requirement R1.2
      - id: R3
        text: Implement srd023-fold requirement R1.3
      - id: R4
        text: Implement srd023-fold requirement R1.4

    design_decisions:
      - id: D1
        text: Call sys.InstallSIGPIPEHandler() at the start of main to match GNU coreutils behavior when piped
      - id: D2
        text: Use testutils.BuildBinary(t, ".") and testutils.RunDiffTests for differential testing against the gfold reference binary
      - id: D3
        text: Call exec.LookPath("gfold") and t.Skip if the reference binary is not found
      - id: D4
        text: Set LC_ALL=C in test Env to ensure consistent output comparison

    acceptance_criteria:
      - id: AC1
        text: cmd/fold/main.go compiles without errors -- go build -o bin/fold ./cmd/fold/
      - id: AC2
        text: All differential tests pass -- go test ./cmd/fold/ -count=1
      - id: AC3
        text: go vet ./cmd/fold/ reports no issues
      - id: AC4
        text: SRD requirements R1.1 through R1.4 are implemented with corresponding test cases

