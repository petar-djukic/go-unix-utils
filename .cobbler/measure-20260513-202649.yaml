- index: 0
  title: "[stitch] pkg/hashutil types and contracts (srd086-hashutil R1.1, R1.2, R1.3, R1.4)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd086-hashutil.yaml (full SRD for hashutil package)
      - docs/ARCHITECTURE.yaml (pkg/ component structure and import constraints)
      - pkg/sys/sys.go (reference for pkg/ package structure conventions)

    files:
      - path: pkg/hashutil/hashutil.go
        action: create
        note: "HashConfig, CheckOptions types; FormatGNU, FormatBSDTag, ComputeDigest, ParseChecksumLine, VerifyChecksums, DigestFiles function signatures as stubs"

    requirements:
      - id: R1
        text: "Define HashConfig struct with fields: Algorithm string, NewHash func() hash.Hash, DigestLen int per srd086-hashutil R1.1"
      - id: R2
        text: "Define CheckOptions struct with fields: Warn bool, Quiet bool, Status bool per srd086-hashutil R1.2"
      - id: R3
        text: "Define FormatGNU(digest, filename string, binary bool) string and FormatBSDTag(algorithm, filename, digest string) string function signatures returning placeholder values per srd086-hashutil R1.3"
      - id: R4
        text: "Define ComputeDigest, ParseChecksumLine, VerifyChecksums, DigestFiles function signatures returning placeholder values per srd086-hashutil R1.4"

    design_decisions:
      - id: D1
        text: "Package path is pkg/hashutil/hashutil.go. The package name is hashutil."
      - id: D2
        text: "All exported function signatures match the contract exactly: FormatGNU(digest, filename string, binary bool) string; FormatBSDTag(algorithm, filename, digest string) string; ComputeDigest(r io.Reader, cfg HashConfig) (string, error); ParseChecksumLine(line string, cfg HashConfig) (filename, expectedDigest string, binary bool, err error); VerifyChecksums(checksumFile string, cfg HashConfig, opts CheckOptions, stdout, stderr io.Writer) (bool, error); DigestFiles(files []string, cfg HashConfig, binary, tag bool, stdout, stderr io.Writer) int"
      - id: D3
        text: "Imports allowed: hash, io, os, fmt, encoding/hex, bufio, strings, regexp. Must not import any cmd/ package or any other pkg/ package."
      - id: D4
        text: "Stub functions should return zero values. This is a contract task -- full implementation follows in subsequent tasks."

    acceptance_criteria:
      - id: AC1
        text: "pkg/hashutil/hashutil.go exists and compiles with go vet ./pkg/hashutil/..."
      - id: AC2
        text: "HashConfig and CheckOptions structs are exported with all specified fields"
      - id: AC3
        text: "All six exported functions have correct signatures matching the contract"
      - id: AC4
        text: "No imports from cmd/ or other pkg/ packages"

- index: 1
  title: "[stitch] pkg/hashutil formatting and digest computation (srd086-hashutil R2.1, R2.2, R2.3)"
  dependency: 0
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd086-hashutil.yaml (full SRD for hashutil package)
      - pkg/hashutil/hashutil.go (contract types and function signatures from task 0)

    files:
      - path: pkg/hashutil/hashutil.go
        action: modify
        note: "Implement FormatGNU, FormatBSDTag, ComputeDigest, ParseChecksumLine"

    requirements:
      - id: R1
        text: "Implement FormatGNU to produce GNU two-space format: for text mode output 'DIGEST  FILENAME', for binary mode output 'DIGEST *FILENAME' per srd086-hashutil R2.1"
      - id: R2
        text: "Implement FormatBSDTag to produce BSD tag format: 'ALGORITHM (FILENAME) = DIGEST' per srd086-hashutil R2.2"
      - id: R3
        text: "Implement ComputeDigest to read all bytes from r, hash them using cfg.NewHash(), and return the hex-encoded digest string per srd086-hashutil R2.3"

    design_decisions:
      - id: D1
        text: "ComputeDigest reads the io.Reader in chunks using io.Copy into the hash, then hex-encodes the Sum result"
      - id: D2
        text: "FormatGNU uses two spaces between digest and filename for text mode, asterisk prefix on filename for binary mode"

    acceptance_criteria:
      - id: AC1
        text: "FormatGNU returns 'digest  filename' for text mode and 'digest *filename' for binary mode"
      - id: AC2
        text: "FormatBSDTag returns 'ALGORITHM (filename) = digest'"
      - id: AC3
        text: "ComputeDigest returns correct hex digest for any hash function provided via HashConfig.NewHash"
      - id: AC4
        text: "go vet ./pkg/hashutil/... passes with no errors"

- index: 2
  title: "[stitch] pkg/hashutil checksum parsing, verification, and file digesting (srd086-hashutil R3.1, R3.2)"
  dependency: 1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd086-hashutil.yaml (full SRD for hashutil package)
      - pkg/hashutil/hashutil.go (types and formatting functions from tasks 0-1)

    files:
      - path: pkg/hashutil/hashutil.go
        action: modify
        note: "Implement ParseChecksumLine, VerifyChecksums, DigestFiles"

    requirements:
      - id: R1
        text: "Implement ParseChecksumLine to parse both GNU format ('DIGEST  FILENAME' and 'DIGEST *FILENAME') and BSD tag format ('ALGORITHM (FILENAME) = DIGEST') lines, returning filename, expected digest, binary flag, and error per srd086-hashutil R3.1"
      - id: R2
        text: "Implement VerifyChecksums to read a checksum file line by line, parse each line with ParseChecksumLine, compute the digest of each referenced file, compare against the expected digest, and report results (OK/FAILED) to stdout/stderr respecting CheckOptions (Warn, Quiet, Status flags). Implement DigestFiles to compute and print digests for a list of files using FormatGNU or FormatBSDTag based on the tag flag, reading from stdin when files list contains '-' per srd086-hashutil R3.2"

    design_decisions:
      - id: D1
        text: "ParseChecksumLine uses regexp to detect GNU vs BSD tag format and extract fields accordingly"
      - id: D2
        text: "VerifyChecksums returns (allOK bool, err error) where allOK is false if any file failed verification"
      - id: D3
        text: "DigestFiles returns an int exit code: 0 if all files digested successfully, 1 if any file could not be read"
      - id: D4
        text: "When files list contains '-', read from os.Stdin and use '-' as the filename in output"

    acceptance_criteria:
      - id: AC1
        text: "ParseChecksumLine correctly parses GNU text, GNU binary, and BSD tag format lines"
      - id: AC2
        text: "VerifyChecksums reads checksum file, computes digests, compares, and prints OK/FAILED per line"
      - id: AC3
        text: "DigestFiles computes and prints digests for each file in the list, supporting stdin via '-'"
      - id: AC4
        text: "go vet ./pkg/hashutil/... passes with no errors"
      - id: AC5
        text: "CheckOptions.Quiet suppresses OK lines, Warn prints warnings for malformed lines, Status suppresses all output and uses exit code only"

- index: 3
  title: "[stitch] cmd/version binary (srd011-magefiles R1.1, R2.1, R3.1, R4.1)"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd011-magefiles.yaml (SRD for magefiles and cmd/version)
      - docs/specs/software-requirements/srd059-version.yaml (SRD for version command)
      - docs/ARCHITECTURE.yaml (cmd/ component structure and SIGPIPE protocol)
      - pkg/sys/sys.go (InstallSIGPIPEHandler function for SIGPIPE handling)

    files:
      - path: cmd/version/main.go
        action: create
        note: "Version binary that prints version information"
      - path: cmd/version/version_test.go
        action: create
        note: "Tests for version binary"

    requirements:
      - id: R1
        text: "Create cmd/version/main.go that prints the project version string to stdout and exits 0 per srd011-magefiles R1.1"
      - id: R2
        text: "Call sys.InstallSIGPIPEHandler() at the start of main per srd011-magefiles R2.1"
      - id: R3
        text: "Version string is set via Go linker flags (-ldflags -X) with a default fallback value of 'dev' when not set per srd011-magefiles R3.1"
      - id: R4
        text: "Print version string followed by a newline to stdout per srd011-magefiles R4.1"

    design_decisions:
      - id: D1
        text: "Use a package-level var version = 'dev' that is overwritten by -ldflags '-X main.version=VALUE' at build time"
      - id: D2
        text: "Output format is the version string followed by a newline, nothing else"
      - id: D3
        text: "Test builds the binary with testutils.BuildBinary and verifies the output contains 'dev' when no ldflags are set. If testutils is not available, test directly with go build and exec.Command."

    acceptance_criteria:
      - id: AC1
        text: "cmd/version/main.go compiles with go build -o bin/version ./cmd/version/"
      - id: AC2
        text: "Running bin/version prints 'dev' followed by a newline when built without ldflags"
      - id: AC3
        text: "sys.InstallSIGPIPEHandler() is called at the start of main"
      - id: AC4
        text: "go test ./cmd/version/... -count=1 passes"