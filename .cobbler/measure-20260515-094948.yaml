- index: 0
  title: "[stitch] cmd/fold: implement srd023-fold R3.1-R3.4"
  dependency: -1
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd023-fold.yaml (requirements R3.1-R3.4)
      - cmd/fold/main.go (existing implementation from prior requirements R1-R2)
      - cmd/fold/fold_test.go (existing differential tests from prior requirements)
      - pkg/testutils/ (differential testing framework -- RunDiffTests, BuildBinary, DiffTest)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler for SIGPIPE handling)

    files:
      - path: cmd/fold/main.go
        action: modify
        note: Add functionality for srd023-fold R3.1-R3.4
      - path: cmd/fold/fold_test.go
        action: modify
        note: Add differential test cases for R3.1-R3.4

    requirements:
      - id: R1
        text: "Implement srd023-fold requirement R3.1 per the SRD specification"
      - id: R2
        text: "Implement srd023-fold requirement R3.2 per the SRD specification"
      - id: R3
        text: "Implement srd023-fold requirement R3.3 per the SRD specification"
      - id: R4
        text: "Implement srd023-fold requirement R3.4 per the SRD specification"

    design_decisions:
      - id: D1
        text: "Use pkg/testutils.RunDiffTests to compare output against the gfold reference binary installed via Homebrew"
      - id: D2
        text: "Call exec.LookPath(\"gfold\") at the start of TestDiff and t.Skip if the reference binary is not found"
      - id: D3
        text: "Ensure main() calls pkg/sys.InstallSIGPIPEHandler() before any stdout writes"
      - id: D4
        text: "Set LC_ALL=C in differential test environment to ensure consistent behavior between Go and GNU implementations"

    acceptance_criteria:
      - id: AC1
        text: "srd023-fold R3.1 is implemented and covered by at least one differential test case"
      - id: AC2
        text: "srd023-fold R3.2 is implemented and covered by at least one differential test case"
      - id: AC3
        text: "srd023-fold R3.3 is implemented and covered by at least one differential test case"
      - id: AC4
        text: "srd023-fold R3.4 is implemented and covered by at least one differential test case"
      - id: AC5
        text: "go build ./cmd/fold/ compiles without errors"
      - id: AC6
        text: "go test ./cmd/fold/ -count=1 passes (or skips gracefully if gfold is not installed)"

