    requirements:
      - id: R1
        text: |
          Implement numeric sequence generation per prd-seq. seq accepts one, two, or three
          operands: "seq LAST" prints 1 to LAST, "seq FIRST LAST" prints FIRST to LAST,
          "seq FIRST INCREMENT LAST" prints FIRST to LAST stepping by INCREMENT. All operands
          are floating-point. Default separator is newline. Output ends with a trailing newline.
      - id: R2
        text: |
          Implement the -s (--separator) flag per prd-seq. When -s STRING is given, use STRING
          as the separator between numbers instead of newline. The final number is still followed
          by a newline, not the separator.
      - id: R3
        text: |
          Implement the -w (--equal-width) flag per prd-seq. When -w is given, pad all numbers
          with leading zeros so they all have equal width. Width is determined by the widest
          endpoint (FIRST or LAST). The -w flag is ignored when -f is also specified.
      - id: R4
        text: |
          Implement the -f (--format) flag per prd-seq. When -f FORMAT is given, use FORMAT
          as a printf-style format string for each number. FORMAT must contain exactly one
          %e, %f, %g, %a, %A, %E, %F, or %G conversion (with optional width/precision).
          Invalid formats produce an error to stderr and exit 1.

    design_decisions:
      - id: D1
        text: |
          Call sys.InstallSIGPIPEHandler() at the start of main per the SIGPIPE handling
          shared protocol in ARCHITECTURE.yaml. This ensures seq exits cleanly when piped
          to head or other consumers that close stdin early.
      - id: D2
