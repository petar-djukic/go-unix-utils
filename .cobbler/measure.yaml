        text: "File named signal.go in pkg/sys -- derived from the architecture capability name 'Signal handling (SIGPIPE, SIGHUP, SIGWINCH)' listed under the pkg/sys component in ARCHITECTURE.yaml."
      - id: D2
        text: "InstallSIGPIPEHandler takes no parameters and exits with code 0. InstallCleanupHandler takes a func() parameter and exits with code 1 after calling it. These signatures match the two distinct signal handling patterns used across cmd/ utilities: broken-pipe tolerance (exit 0) and resource cleanup on termination (exit 1)."

