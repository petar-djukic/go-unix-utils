      - path: pkg/sys/stat.go
        action: create
        note: Platform-independent file metadata types and stat/lstat wrapper functions
      - path: pkg/sys/stat_darwin.go
        action: create
        note: Darwin-specific Stat_t field access (Mtimespec, Blocks)
      - path: pkg/sys/stat_linux.go
        action: create
        note: Linux-specific Stat_t field access (Mtim, Blocks)
      - path: pkg/sys/signal.go
