        text: "Implement IsTerminal(fd uintptr) bool that reports whether a file descriptor refers to a terminal, using the TIOCGWINSZ ioctl. A successful ioctl indicates a terminal; any error indicates non-terminal. This matches the detection technique already used locally in pkg/format/color.go (lines 164-168). Implements prd002-sys R1."
      - id: R2
        text: "Implement GetWinSize(fd uintptr) (WinSize, error) that returns the terminal dimensions (rows and columns) by reading the TIOCGWINSZ ioctl result into a WinSize struct. Return an error if the fd is not a terminal. Implements prd002-sys R1."
      - id: R3
        text: "Export a WinSize struct with Rows and Cols fields (both uint16), following the same exported-struct pattern as FileMetadata in stat.go. The struct layout matches C struct winsize. Implements prd002-sys R1."
      - id: R4
        text: "Use the same copyright header, SPDX identifier, and Implements comment style as the existing stat.go file. The Implements comment should reference prd002-sys (R1)."

    design_decisions:
      - id: D1
        text: "Use a single terminal.go file without platform-specific build tags. Unlike stat.go (which needs separate Darwin/Linux files because syscall.Stat_t field names diverge), the TIOCGWINSZ ioctl and struct winsize layout are identical on Darwin and Linux. Go's syscall.TIOCGWINSZ constant is available on both platforms."
      - id: D2
        text: "Use syscall.Syscall with syscall.SYS_IOCTL and syscall.TIOCGWINSZ, matching the technique in pkg/format/color.go lines 164-168. Use unsafe.Pointer to pass the winsize buffer."
      - id: D3
        text: "Follow the existing pkg/sys API style: functions take primitive arguments (uintptr for fd), return exported structs, and wrap errors with context using fmt.Errorf."

    acceptance_criteria:
      - id: AC1
        text: "pkg/sys/terminal.go exists with the copyright header, SPDX identifier, package sys declaration, and Implements comment referencing prd002-sys (R1)."
      - id: AC2
        text: "WinSize struct is exported with Rows (uint16) and Cols (uint16) fields."
      - id: AC3
        text: "IsTerminal(fd uintptr) bool is exported and returns true when fd refers to a terminal."
      - id: AC4
        text: "GetWinSize(fd uintptr) (WinSize, error) is exported and returns terminal dimensions or an error for non-terminal fds."
      - id: AC5
        text: "go build ./pkg/sys/ succeeds on both darwin and linux with no compilation errors."
