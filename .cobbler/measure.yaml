          testing. Call exec.LookPath("gseq") and t.Skip if not found, per the graceful
          skip shared protocol.
      - id: D3
        text: |
          Parse operands as float64 using strconv.ParseFloat. Use big.Float or careful
          epsilon comparison only if needed for format precision. Match GNU seq behavior
          for integer-valued floats (print without decimal point when no -f is given).
      - id: D4
        text: |
          Exit codes: 0 on success, 1 on usage error (invalid format, missing operands,
          zero increment). Write errors to stderr. Match GNU seq error message style.

