  title: prd001-testutils R2, R3, R4 -- unit tests for differential test harness
  description: |-
    deliverable_type: code

    required_reading:
      - pkg/testutils/difftest.go (implementation under test -- RunDiffTest, RunDiffTests, TimestampNormalizer, ComposeNormalizers, buildEnv, ExpectedFiles)
      - docs/specs/product-requirements/prd001-testutils.yaml (requirement definitions for R2, R3, R4, R5)

    files:
      - path: pkg/testutils/difftest_test.go
        action: create
        note: Unit tests for RunDiffTest, normalization, environment handling, file-state comparison
      - path: pkg/testutils/testdata/echobin/main.go
        action: create
        note: Configurable test helper binary -- echoes stdin to stdout, supports -exit N for exit code, -stderr MSG for stderr output, -writefile PATH to write stdin to a file
      - path: pkg/testutils/testdata/fixedbin/main.go
        action: create
        note: Divergent test helper binary -- always prints a fixed string to stdout regardless of input, used as the mismatched binary in divergence tests

    requirements:
      - id: R1
        text: "Test binary execution and match detection via RunDiffTest: when the same binary (echobin) is used as both goBinary and refBinary with identical inputs, DiffResult.Match must be true and Divergences must be empty (prd001-testutils R2.1, R2.3, R2.5)"
      - id: R2
        text: "Test divergence detection: when goBinary (fixedbin) and refBinary (echobin) produce different stdout, stderr, or exit codes for the same args/stdin, DiffResult.Match must be false and Divergences must list the divergent streams by name (prd001-testutils R3.2, R3.3, R3.4, R3.5)"
      - id: R3
        text: "Test normalization hooks: TimestampNormalizer replaces strftime-formatted timestamps (e.g. 'Feb 19 12:34:56', '2026-02-19 12:34:56') with the fixed placeholder string, ComposeNormalizers chains multiple functions in order, and custom Normalize functions in DiffTest are applied to both binaries' output before comparison (prd001-testutils R4.1, R4.2, R4.3, R4.4)"
      - id: R4
        text: "Test environment construction and file-state comparison: RunDiffTest sets LC_ALL=C in the environment by default, user-provided Env entries in DiffTest override matching keys and add new ones, and ExpectedFiles entries are checked against files written by the binary in the working directory (prd001-testutils R2.6, R5.1, R5.2)"

    design_decisions:
      - id: D1
        text: "Create two test helper binaries under pkg/testutils/testdata/. echobin is configurable: no flags echoes stdin to stdout; -exit N sets exit code; -stderr MSG writes MSG to stderr; -writefile PATH writes stdin to PATH in the working directory. fixedbin always prints a fixed string to stdout and exits 0, providing predictable divergence from echobin. Build both in TestMain using exec.Command('go', 'build', ...) into a shared temp directory."
      - id: D2
        text: "Test RunDiffTest (the standalone function returning DiffResult and error) directly rather than RunDiffTests. RunDiffTests is a thin wrapper around runSingleDiffTest that calls t.Fatalf on divergence -- it does not need separate test coverage."
      - id: D3
        text: "Test buildEnv indirectly: echobin supports a -printenv KEY flag that prints the value of the named environment variable to stdout. Pass Env entries in DiffTest and verify the binary's stdout contains the expected value. This avoids testing unexported functions directly."

    acceptance_criteria:
      - id: AC1
        text: "go test ./pkg/testutils/... passes with zero failures"
      - id: AC2
        text: "At least one test verifies DiffResult.Match is true when both binaries produce identical output for the same stdin and args"
      - id: AC3
        text: "At least one test verifies DiffResult.Match is false with Divergences containing 'stdout' when goBinary and refBinary produce different stdout"
      - id: AC4
        text: "At least one test verifies DiffResult.Match is false with Divergences containing 'exit code' when goBinary and refBinary exit with different codes"
      - id: AC5
        text: "At least one test verifies TimestampNormalizer replaces a known timestamp pattern with the '<TIMESTAMP>' placeholder"
      - id: AC6
        text: "At least one test verifies LC_ALL=C is set in the environment passed to binaries by default"
  dependency: -1
