        text: "The -i flag causes SIGINT to be ignored"
      - id: AC6
        text: "--output-error with mode values warn, warn-nopipe, exit, exit-nopipe behaves as specified"
      - id: AC7
        text: "golangci-lint runs clean on cmd/tee/"
