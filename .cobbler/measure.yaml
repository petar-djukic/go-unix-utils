    requirements:
      - id: R1
        text: |
          Implement the unexpand utility that converts leading blanks (spaces) to tabs,
          reading from files or stdin. Default behavior converts only leading sequences of
          blanks. With -a/--all, convert all sequences of two or more blanks at tab stops.
          Match GNU unexpand behavior for all flags per the PRD.
      - id: R2
        text: |
          Support --first-only (default behavior -- only convert leading blanks), -a/--all
          (convert all suitable blank sequences), and -t/--tabs=N or --tabs=LIST for custom
          tab stop positions. When -t is given, -a is implied. Match GNU unexpand flag
          semantics exactly.
      - id: R3
        text: |
          Handle multiple input files and stdin (when no files given or "-" is specified).
          Process each line independently. Preserve trailing content after last tab stop.
          Write to stdout. Exit 0 on success, exit non-zero on error with diagnostic to stderr.
      - id: R4
        text: |
          Write differential tests using pkg/testutils.RunDiffTests comparing the Go binary
          against the Homebrew reference binary "gunexpand". Skip gracefully if gunexpand is
          not in PATH (exec.LookPath + t.Skip). Set LC_ALL=C in test environment. Cover:
          default (leading-only), -a flag, -t with single value, -t with comma-separated list,
          stdin input, multiple files, lines with no blanks, lines with mixed tabs and spaces.

    design_decisions:
      - id: D1
        text: |
          Call pkg/sys.InstallSIGPIPEHandler() at the start of main() per the shared protocol
          in ARCHITECTURE.yaml. All cmd/ utilities that write to stdout must do this.
      - id: D2
        text: |
          Use the same differential test pattern as cmd/expand: build binary with
          testutils.BuildBinary, look up "gunexpand" via exec.LookPath, skip if not found,
          define []testutils.DiffTest slice, call testutils.RunDiffTests.
      - id: D3
        text: |
          Do NOT install any packages in the test or build. The reference binary "gunexpand"
          must already be in PATH or the test skips gracefully.
      - id: D4
        text: |
          Use flag or manual argument parsing consistent with cmd/expand. Support both
          short (-a, -t) and long (--all, --first-only, --tabs) flag forms. Use --help
          and --version following GNU conventions.

