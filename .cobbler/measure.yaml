    required_reading:
      - docs/specs/product-requirements/ (find PRDs for basename and dirname)
      - docs/specs/use-cases/rel02.0-uc004-basename.yaml (use case for basename)
      - docs/specs/use-cases/rel02.0-uc005-dirname.yaml (use case for dirname)
      - docs/specs/test-suites/test-rel-02.0.yaml (test suite for rel02.0)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- differential testing pattern, SIGPIPE handling)
      - pkg/sys/sigpipe.go (InstallSIGPIPEHandler usage)
      - pkg/testutils/difftest.go (DiffTest struct and RunDiffTests signature)
      - cmd/true/main.go (reference for trivial utility structure in this project)
      - cmd/yes/main.go (reference for flag parsing and SIGPIPE handling pattern)

    files:
      - path: cmd/basename/main.go
        action: create
        note: basename implementation with flag parsing and path manipulation
      - path: cmd/basename/basename_test.go
        action: create
        note: differential tests against gbasename reference binary
      - path: cmd/dirname/main.go
        action: create
        note: dirname implementation with flag parsing and path manipulation
      - path: cmd/dirname/dirname_test.go
        action: create
        note: differential tests against gdirname reference binary

    requirements:
      - id: R1
        text: |
          Implement cmd/basename per its PRD requirements. basename strips directory
          components from a file path and optionally removes a trailing suffix.
          Support flags: -a/--multiple (treat every operand as a name), -s/--suffix
          SUFFIX (remove trailing SUFFIX), -z/--zero (NUL-terminate output instead
          of newline). With a single NAME and optional SUFFIX operand (legacy syntax),
          strip the directory prefix and remove SUFFIX if present. With -a, process
          multiple NAME operands. Print --help and --version per GNU conventions.
      - id: R2
        text: |
          Implement cmd/dirname per its PRD requirements. dirname strips the last
          component from each file path, printing the parent directory. Support flag:
          -z/--zero (NUL-terminate output instead of newline). Process multiple
          operands, printing one result per input. Print --help and --version per
          GNU conventions.
      - id: R3
        text: |
          Write differential tests for both utilities. Each test file defines a
          TestDiff function that builds the Go binary via testutils.BuildBinary,
          looks up the reference binary (gbasename / gdirname) via exec.LookPath
          with t.Skip if not found, defines []testutils.DiffTest cases covering
          flag combinations and edge cases, and calls testutils.RunDiffTests.
      - id: R4
        text: |
          Both utilities must call sys.InstallSIGPIPEHandler() at the start of
          main, matching the project-wide shared protocol for stdout-writing
          utilities. Exit code 0 on success, non-zero on error, matching GNU
          behavior.

    design_decisions:
      - id: D1
        text: |
          Use Go's filepath.Base and filepath.Dir as the starting point for path
          stripping, but verify edge-case parity with GNU (e.g., trailing slashes,
          empty string, "//"). Adjust behavior to match GNU reference binary output
          exactly -- filepath.Base("") returns "." in Go which matches GNU, but
          double-check slash handling.
      - id: D2
        text: |
          Use the same flag parsing approach as cmd/yes and cmd/true -- standard
          library flag package or manual argument parsing, whichever matches the
          existing cmd/ pattern. Read cmd/yes/main.go to confirm the convention.
      - id: D3
        text: |
          Reference binary names are gbasename and gdirname (Homebrew GNU coreutils
          g-prefix convention). Use exec.LookPath with t.Skip for graceful skip
          per the shared protocol.

    acceptance_criteria:
      - id: AC1
        text: cmd/basename/main.go compiles with no errors or lint warnings
      - id: AC2
