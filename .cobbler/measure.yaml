- index: 0
  title: Implement magefiles core build targets -- rel00.0-uc001-magefiles
  description: |-
    deliverable_type: code

    required_reading:
      - docs/ARCHITECTURE.yaml (magefiles component description, interfaces section for mage target specifications, technology choices for Mage)
      - docs/specs/use-cases/rel00.0-uc001-magefiles.yaml (use case specification for magefiles)
      - docs/specs/test-suites/test-rel-00.0.yaml (test expectations for release 00.0)
      - configuration.yaml (orchestrator configuration consumed by magefiles)
      - go.mod (module path and existing dependencies)

    files:
      - path: magefiles/build.go
        action: create
        note: "Build and Lint mage targets as exported functions"
      - path: magefiles/stats.go
        action: create
        note: "Stats namespace type with Loc method for stats:loc target"
      - path: magefiles/init.go
        action: create
        note: "Init mage target for project directory setup"
      - path: go.mod
        action: modify
        note: "Add mage dependency if not already present"

    requirements:
      - id: R1
        text: "Implement Build target that discovers all subdirectories under cmd/ using os.ReadDir and compiles each to bin/<directory-name> using go build. Create bin/ directory if it does not exist."
      - id: R2
        text: "Implement Lint target that runs golangci-lint on ./cmd/... and ./pkg/... via os/exec and returns a non-nil error if the linter is not installed or if linting fails."
      - id: R3
        text: "Implement Init target that ensures the bin/ output directory exists and validates that go.mod is present in the project root."
      - id: R4
        text: "Implement Stats namespace with Loc method that walks Go source files under cmd/ and pkg/, counts production lines and test lines separately, walks docs/ for .yaml and .md files to count words, and prints a summary table to stdout."

    design_decisions:
      - id: D1
        text: "Use Mage conventions per ARCHITECTURE.yaml technology choices: exported functions in magefiles/ become top-level targets, a type with exported methods creates a namespace (e.g., Stats type with Loc method becomes stats:loc)."
      - id: D2
        text: "Build target discovers cmd/ subdirectories dynamically using os.ReadDir, not a hardcoded list, because cmd/ grows as utilities are added per road-map.yaml."
      - id: D3
        text: "All magefiles use the //go:build mage build constraint tag per Mage conventions."

    acceptance_criteria:
      - id: AC1
        text: "mage build compiles all cmd/ packages and places output binaries in bin/"
      - id: AC2
        text: "mage lint invokes golangci-lint on cmd/ and pkg/ trees and returns non-nil error on lint failure"
      - id: AC3
        text: "mage init creates the bin/ directory if it does not exist"
      - id: AC4
        text: "mage stats:loc prints production .go line count, test .go line count, and docs word count as a formatted table"
      - id: AC5
        text: "All files in magefiles/ compile without errors: go vet ./magefiles/... exits 0"
