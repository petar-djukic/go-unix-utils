      - cmd/cat/main.go (reference pattern for options struct, flag.Parse scaffolding, SIGPIPE handler, reportError helper)
      - cmd/sponge/main.go (reference pattern for single-file utility structure, signal setup, exit code management)
      - pkg/sys/fileinfo.go (Lstat API returning FileMetadata with Blocks() for 512-byte block count)
      - pkg/format/size.go (HumanSize API -- note the interface for future -h flag support but do not use in this task)

    files:
      - path: cmd/du/main.go
        action: create
        note: Core du implementation -- directory traversal, block counting, default output, error handling

    requirements:
      - id: R1
        text: "Implement depth-first directory traversal that walks each argument path recursively using os.ReadDir for directory listing. For each entry, call pkg/sys.Lstat to obtain the 512-byte block count via FileMetadata.Blocks(). Accumulate block counts bottom-up so each directory total includes all descendant files and subdirectories. Corresponds to the du PRD core traversal requirement -- read the PRD and reference the exact requirement ID in code comments."
      - id: R2
        text: "Implement default output format: print one line per directory (not per regular file) in the format '<size>\\t<path>\\n' where size is the cumulative allocated block count converted from 512-byte st_blocks to 1024-byte display units using integer ceiling division: displayBlocks = (rawBlocks + 1) / 2. Corresponds to the du PRD output format requirement."
      - id: R3
        text: "Implement argument handling: accept zero or more file or directory paths as positional arguments after flag parsing. When no arguments are given, default to '.'. When a path is a regular file (not a directory), print its own block count as a single line. When a path is a directory, traverse it recursively printing per-directory subtotals. Process all arguments in command-line order. Corresponds to the du PRD argument handling requirement."
      - id: R4
        text: "Implement error handling and exit codes: for nonexistent or permission-denied paths, print 'du: <path>: <error>' to stderr matching GNU du message format and continue processing remaining arguments and directory entries. Exit with code 0 when all paths succeed, exit with code 1 when any path produces an error. Handle SIGPIPE by exiting with code 0 using the same goroutine pattern as cmd/cat. Corresponds to the du PRD error handling and exit code requirement."

    design_decisions:
      - id: D1
        text: "Use pkg/sys.Lstat (not os.Lstat or raw syscall) for obtaining block counts. This follows the architecture design decision DD3 -- common syscall logic belongs in pkg/sys. Use os.ReadDir for directory listing and DirEntry.Type() for file type detection to avoid a second stat call per directory entry since os.ReadDir uses d_type from the dirent on both Darwin and Linux."
      - id: D2
        text: "Follow the cmd/cat implementation pattern: define an options struct for parsed flags (initially empty or with placeholder fields for future flags), use the standard library flag package for argument parsing, handle SIGPIPE via signal.Notify in a background goroutine, and use a dedicated reportError helper for consistent stderr formatting. Match the copyright header and package comment style from cmd/cat/main.go."
      - id: D3
        text: "This task implements only the default du behavior (print per-directory totals in 1024-byte blocks). Provide an options struct and flag.Parse call as scaffolding so subsequent tasks can add flags (-a, -s, -h, -c, -k, --max-depth, -L, -x, --apparent-size, --exclude) without restructuring the main function. Do not implement any optional flags in this task."

    acceptance_criteria:
      - id: AC1
        text: "cmd/du/main.go exists and compiles without errors via 'go build ./cmd/du/'."
      - id: AC2
        text: "Running the du binary with a directory argument prints one '<size>\\t<path>' line per subdirectory plus the argument directory itself, with sizes in 1024-byte block units."
      - id: AC3
        text: "Running du with a regular file argument prints exactly one line with the file's allocated block count in 1024-byte units followed by a tab and the file path."
      - id: AC4
