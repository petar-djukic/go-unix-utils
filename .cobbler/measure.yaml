- index: 0
  title: 'pkg/testutils: DiffTest struct and differential test runner -- rel00.0-uc004-testutils'
  description: |-
    deliverable_type: code

    required_reading:
      - docs/ARCHITECTURE.yaml (pkg/testutils component section and Design Decision 2)
      - docs/specs/product-requirements/ (find and read the testutils PRD in this directory)
      - docs/specs/use-cases/rel00.0-uc004-testutils.yaml
      - docs/specs/test-suites/test-rel-00.0.yaml (testutils test suite section)

    files:
      - path: pkg/testutils/difftest.go
        action: create
        note: DiffTest struct definition and differential test runner function

    requirements:
      - id: R1
        text: Define the DiffTest struct with fields for command-line arguments, stdin input, environment variables, expected exit code, and optional expected stdout/stderr content, as specified in the testutils PRD
      - id: R2
        text: Implement a runner function that executes both the Go binary under test and the GNU reference binary with identical stdin, arguments, and environment, then captures stdout, stderr, and exit code from each
      - id: R3
        text: Compare stdout, stderr, and exit code between the two binaries byte-for-byte by default, reporting divergences with the input that triggered them, the expected output (reference binary), and the actual output (Go binary)
      - id: R4
        text: Support configurable normalization hooks that transform output before comparison to handle known acceptable differences such as timestamps or path prefixes

    design_decisions:
      - id: D1
        text: "Primary file is difftest.go, named after the primary exported type DiffTest (project convention: name source files after the primary exported type, not the package name)"
      - id: D2
        text: Byte-for-byte comparison is the default mode per ARCHITECTURE.yaml Design Decision 2; normalization hooks are opt-in per test case
      - id: D3
        text: Both binaries receive identical stdin, arguments, and environment variables as specified in the ARCHITECTURE.yaml pkg/testutils capabilities

    acceptance_criteria:
      - id: AC1
        text: pkg/testutils/difftest.go exists and declares package testutils
      - id: AC2
        text: DiffTest struct is exported and contains all fields necessary to define a differential test case
      - id: AC3
        text: Runner function is exported and executes two binaries with matching inputs, returning structured comparison results
      - id: AC4
        text: Normalization hooks can be configured per DiffTest instance and are applied before comparison
      - id: AC5
        text: "go build ./pkg/testutils/ succeeds with no errors"
