        action: create
        note: PRD for the true utility
      - path: docs/specs/product-requirements/prd013-false.yaml
        action: create
        note: PRD for the false utility

    required_sections:
      - "Problem: why a formal specification is needed for this utility"
      - "Goals: numbered goals (G1, G2, ...)"
      - "Requirements: numbered requirements (R1.1, R1.2, ...) covering all flags, exit codes, and stream behaviors"
      - "Non-Goals: what is out of scope for this utility"
      - "Acceptance Criteria: checkable outcomes matching requirements"

    requirements:
      - id: R1
        text: |
          Write a complete PRD for the true utility (prd012-true.yaml). The PRD
          must cover: unconditional exit with code 0, --help flag printing usage
          to stdout and exiting 0, --version flag printing version string to stdout
          and exiting 0, SIGPIPE signal handling (exit cleanly), and the fact that
          true reads no stdin and produces no stdout in normal operation.
      - id: R2
        text: |
          Write a complete PRD for the false utility (prd013-false.yaml). The PRD
          must cover: unconditional exit with code 1, --help flag printing usage
          to stdout and exiting 0, --version flag printing version string to stdout
          and exiting 0, SIGPIPE signal handling (exit cleanly), and the fact that
          false reads no stdin and produces no stdout in normal operation.
      - id: R3
        text: |
          Both PRDs must follow the existing PRD format used by prd005-wc.yaml and
          prd006-cat.yaml. Requirements must be numbered (R1.1, R1.2, ...) and
          acceptance criteria must be checkable and map to requirements. Goals must
          be numbered (G1, G2, ...).

    design_decisions:
      - id: D1
        text: |
          Use the same YAML PRD format structure as existing PRDs in the project.
          Read prd005-wc.yaml or prd006-cat.yaml first to establish the format,
          then create new PRDs matching that structure exactly.
      - id: D2
        text: |
          true and false are the two simplest GNU coreutils utilities. Their PRDs
          should be minimal but complete -- covering exit code, flag handling
          (--help, --version), signal handling (SIGPIPE), and explicitly stating
          that no stdin/stdout I/O occurs in normal operation.
      - id: D3
        text: |
          The reference binaries for differential testing are gtrue and gfalse
          (Homebrew GNU coreutils with g- prefix). Note this in the PRD so the
          test suite and implementation know which reference binary to use.

    acceptance_criteria:
      - id: AC1
        text: docs/specs/product-requirements/prd012-true.yaml exists and contains all required sections (Problem, Goals, Requirements, Non-Goals, Acceptance Criteria)
      - id: AC2
        text: docs/specs/product-requirements/prd013-false.yaml exists and contains all required sections (Problem, Goals, Requirements, Non-Goals, Acceptance Criteria)
