      - id: R2
        text: "Implement differential tests for file output mode (prd007-sponge R1, R2): sponge reads all of stdin then writes to a named output file via atomic rename. Since both binaries write to files rather than stdout, run each binary in a separate temporary directory with identical pre-conditions (same stdin bytes, same pre-existing files, same arguments), then compare the resulting output file contents byte-for-byte along with stderr and exit code."
      - id: R3
        text: "Implement differential tests for append mode (prd007-sponge R3): the -a flag causes sponge to append stdin content after any existing file content. Test appending to an existing file with content and appending to a non-existent file (which should behave like default write mode)."
