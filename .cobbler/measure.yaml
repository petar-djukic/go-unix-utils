    requirements:
      - id: R1
        text: |
          Implement TestMain that compiles cmd/wc to a temporary binary via
          "go build -o <tmppath> ." and locates the GNU reference binary gwc
          via exec.LookPath("gwc"). If gwc is not found, print a skip message
          and exit 0 so the test suite is skipped rather than failed. Clean up
          the temporary binary after all tests complete.
      - id: R2
        text: |
          Differential tests for default counting mode (lines, words, bytes
          with no flags) and each individual counting flag (-l, -w, -c, -m, -L)
          using both file input and stdin input, per prd005-wc R1 and R2. Include
          at least one flag combination test (e.g., -lw) to verify multi-flag
          output ordering per prd005-wc R2.6.
      - id: R3
        text: |
          Differential tests for flag interaction where -m overrides -c display
          per prd005-wc R2.3, all four --total modes (auto, always, only, never)
          per prd005-wc R3.3, and field width formatting with multiple files per
          prd005-wc R3.1.
      - id: R4
        text: |
          Differential tests for error paths and special input: missing file
          produces stderr message and exit code 1 per prd005-wc R6, --files0-from
          reads NUL-delimited file list per prd005-wc R4.4, and binary input
          (bytes with values > 127) does not panic per prd005-wc R4.2.

    design_decisions:
      - id: D1
        text: |
          Use pkg/testutils.RunDiffTests as the sole test driver. Each test case
          is a testutils.DiffTest struct with Name, Args, Stdin, and optional Env
          fields. Do not test internal functions directly -- this file tests the
          compiled binary only via the differential harness.
      - id: D2
        text: |
          The reference binary is gwc (GNU wc installed via Homebrew). Locate it
          with exec.LookPath("gwc"). If not found, print a skip message via
          fmt.Println and call os.Exit(0) in TestMain so the entire test file is
          skipped on machines without GNU coreutils installed.
      - id: D3
        text: |
          All tests inherit LC_ALL=C from the testutils.buildEnv default. Do not
          set locale overrides. This matches ARCHITECTURE design decision DD6
          (LC_ALL=C for current roadmap).
      - id: D4
        text: |
          Create temporary test input files inside each test function using
          t.TempDir(). Write known content to files so that expected counts are
          deterministic. Pass the temp directory as DiffTest.WorkDir so both
          binaries resolve relative file paths identically.

