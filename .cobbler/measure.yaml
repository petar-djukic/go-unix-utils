          (ioctl constants, Stat_t field access, signal constants). This is the
          only permitted external dependency per ARCHITECTURE.yaml technology
          choices. No cmd/ package may import golang.org/x/sys directly --
          they import pkg/sys/ as the abstraction layer.
      - id: D2
        text: |
