  title: cmd/sponge differential tests -- prd007-sponge R6, prd001-testutils R5
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/product-requirements/prd007-sponge.yaml (R6 differential testing requirements)
      - docs/specs/product-requirements/prd001-testutils.yaml (R1-R3 harness API, R5 file-state comparison)
      - docs/specs/test-suites/test-rel01.1.yaml (sponge test case definitions -- 8 cases)
      - docs/specs/use-cases/rel01.1-uc003-sponge.yaml (use case flow and success criteria)
      - cmd/sponge/main.go (implementation under test)
      - pkg/testutils/difftest.go (harness: DiffTest struct, RunDiffTests, FileExpectation, executeBinary)
      - pkg/testutils/normalize.go (NormalizeFunc, ComposeNormalizers)
      - cmd/cat/cat_test.go (pattern reference for TestMain, fixture setup, and RunDiffTests usage)
      - cmd/wc/wc_test.go (pattern reference for file-based test fixtures with WorkDir)

    files:
      - path: cmd/sponge/sponge_test.go
        action: create
        note: "Differential tests for cmd/sponge exercising all 8 sponge test cases from test-rel01.1.yaml"

    requirements:
      - id: R1
        text: |
          Implement TestMain following the pattern in cmd/cat/cat_test.go: build the Go sponge
          binary into a temp directory via "go build -o <path> .", locate the Homebrew reference
          binary "sponge" (brew install moreutils) via exec.LookPath("sponge"), and set
          package-level goBinary and refBinary variables. Clean up the temp directory after
          m.Run(). Per prd007-sponge R6 and sources.yaml (moreutils utilities are not g-prefixed).
      - id: R2
        text: |
          Implement a runFileDiffTest helper function for file-output test cases. The standard
          RunDiffTests harness runs both binaries in the same working directory, so the reference
          binary would overwrite the Go binary's output file. The helper must: (a) create two
          isolated temp directories with identical fixture files via a setupFixture callback,
          (b) run the Go binary in directory 1 with the given stdin, args, and env using
          exec.CommandContext with a 10-second timeout, (c) run the reference binary in directory
          2 with identical inputs, (d) compare stdout and stderr from both binaries byte-for-byte,
          (e) compare exit codes, (f) read the output file from both directories and compare their
          content byte-for-byte, (g) on divergence report: args, stdin (truncated to 256 bytes),
          both file contents, both stdouts, both stderrs, and both exit codes. Per prd007-sponge
          R6.1 and prd001-testutils R5.1-R5.2.
      - id: R3
        text: |
          Implement three basic file-output test cases using runFileDiffTest:
          (a) sponge_small_stdin_to_file -- generate 100 lines ("1\n" through "100\n") as stdin,
          args ["outfile.txt"], no fixture setup needed. Traces prd007-sponge R1.1, R1.2, R2.1.
          (b) sponge_soak_before_write -- create fixture data.txt containing "line1\nline2\nline3\n"
          in both directories, stdin is the same content, args ["data.txt"]. Output file must not
          be empty or truncated. Traces prd007-sponge R1.1, R2.5.
          (c) sponge_empty_stdin -- empty stdin ([]byte{}), args ["empty_out.txt"], no fixture.
          Output file should be zero bytes. Traces prd007-sponge R1.1, R2.1.
      - id: R4
        text: |
          Implement sponge_passthrough_stdout test case using RunDiffTests from pkg/testutils
          (standard stdout comparison). Stdin is []byte("hello world\n"), args is nil (no output
          filename). Both binaries should write stdin content to stdout. Per test-rel01.1.yaml
          sponge_passthrough_stdout, tracing prd007-sponge R4.1, R4.3.
      - id: R5
        text: |
          Implement two append-mode test cases using runFileDiffTest:
          (a) sponge_append_mode -- create fixture existing.txt containing "original line\n" in
          both directories. Stdin "appended line\n", args ["-a", "existing.txt"]. Output files
          should contain "original line\nappended line\n". Traces prd007-sponge R3.1, R3.3.
          (b) sponge_append_mode_no_existing_file -- no fixture, stdin "new content\n", args
          ["-a", "newfile.txt"]. Output files should contain "new content\n". Traces
          prd007-sponge R3.2.
      - id: R6
        text: |
          Implement sponge_large_stdin test case using runFileDiffTest: generate a payload of
          1,048,576+ bytes using bytes.Repeat of a known pattern as stdin, args ["large_out.txt"],
          no fixture. Compare output file content from both directories. This exercises the
          temp-file spill path. Per test-rel01.1.yaml sponge_large_stdin, tracing prd007-sponge
          R1.3, R1.4.
      - id: R7
        text: |
          Implement sponge_output_file_exists_mode test case using runFileDiffTest: create fixture
          protected.txt with os.WriteFile using mode 0640 and content "old content\n" in both
          directories. Stdin "new content\n", args ["protected.txt"]. Compare output file content
          from both directories AND verify the file mode is 0640 in both directories using
          os.Stat. Per test-rel01.1.yaml sponge_output_file_exists_mode, tracing prd007-sponge
          R2.3.

    design_decisions:
      - id: D1
        text: |
          Per prd007-sponge R6.1: "Differential tests must compare the content of the output file
          (not stdout) after both the Go binary and the reference binary have exited." The standard
          RunDiffTests harness runs both binaries sequentially in the same working directory, which
          means the reference binary would overwrite the Go binary's output file. File-output test
          cases use a custom runFileDiffTest helper that creates two isolated temp directories --
          one per binary -- with identical fixtures, runs each binary in its own directory, and
          compares the output files from both directories.
      - id: D2
        text: |
          Per test-rel01.1.yaml preconditions: "each test creates an isolated temp directory" and
          "Comparison is on output file content (prd001-testutils R5) for tests with an output
          filename. Passthrough mode tests compare stdout byte-for-byte." Use RunDiffTests from
          pkg/testutils for the passthrough test only; use runFileDiffTest for all seven
          file-output tests.
      - id: D3
        text: |
          Per sources.yaml moreutils section: "Installs without g-prefix (ts, sponge, pee, vidir,
          chronic) because these utilities do not conflict with any macOS built-ins." The reference
          binary is located via exec.LookPath("sponge"), not "gsponge".
      - id: D4
        text: |
          Follow the TestMain pattern from cmd/cat/cat_test.go: build Go binary into os.MkdirTemp,
          locate reference binary via exec.LookPath, run m.Run(), clean up with os.RemoveAll. Tests
          skip gracefully with t.Skip when either binary is unavailable.
      - id: D5
        text: |
          Per test-rel01.1.yaml preconditions: "All tests use LC_ALL=C to eliminate locale-dependent
          divergence." Set baseEnv to []string{"LC_ALL=C"} and pass it to all test cases.

    acceptance_criteria:
      - id: AC1
        text: |
          All 8 sponge test cases from test-rel01.1.yaml are implemented: sponge_small_stdin_to_file,
          sponge_soak_before_write, sponge_passthrough_stdout, sponge_append_mode,
          sponge_append_mode_no_existing_file, sponge_large_stdin, sponge_output_file_exists_mode,
          sponge_empty_stdin.
      - id: AC2
        text: |
          File-output test cases run each binary in an isolated temp directory and compare the
          output file content from both directories byte-for-byte.
      - id: AC3
        text: |
          The passthrough test (sponge_passthrough_stdout) uses RunDiffTests from pkg/testutils
          with standard stdout comparison.
      - id: AC4
        text: |
          The permission preservation test (sponge_output_file_exists_mode) verifies that the
          output file mode is 0640 after both binaries execute.
      - id: AC5
        text: |
          cmd/sponge/sponge_test.go compiles with no warnings under golangci-lint.
      - id: AC6
        text: |
          Tests skip gracefully with t.Skip when the Go binary cannot be built or the reference
          sponge binary is not found on PATH.
