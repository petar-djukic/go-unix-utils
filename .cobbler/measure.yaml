  title: 'cmd/tee implementation: rel02.1-uc001-tee core functionality'
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/use-cases/rel02.1-uc001-tee.yaml (use case with PRD traceability)
      - docs/specs/test-suites/test-rel-02.1.yaml (expected test inputs and outputs)
      - docs/ARCHITECTURE.yaml (shared_protocols section for differential testing and SIGPIPE patterns)
      - pkg/sys/ (InstallSIGPIPEHandler API -- call at start of main)
      - cmd/true/main.go (reference for minimal cmd/ structure and flag parsing conventions)
      - cmd/basename/main.go (reference for flag parsing and --version/--help pattern)

    files:
      - path: cmd/tee/main.go
        action: create
        note: tee utility implementation -- stdin to stdout and files

    requirements:
      - id: R1
        text: |
          Read all of stdin and write it to stdout and to each file argument
          simultaneously. Use io.MultiWriter to fan out writes. Exit 0 on
          success, exit 1 on any write error. When no file arguments are given,
          tee copies stdin to stdout only.
      - id: R2
        text: |
          Implement the -a/--append flag. When set, open output files with
          O_APPEND instead of O_TRUNC. Default behavior (no -a) truncates
          and overwrites each file.
      - id: R3
        text: |
          Implement the -i/--ignore-interrupts flag. When set, install a
          signal handler that ignores SIGINT (signal.Ignore(syscall.SIGINT)).
          Without -i, tee uses default SIGINT behavior.
      - id: R4
        text: |
          Implement --output-error with optional mode argument. Modes:
          "warn" (warn on error to any output, continue), "warn-nopipe"
          (warn on error to any output not a pipe, continue),
          "exit" (exit on error to any output), "exit-nopipe" (exit on
          error to any output not a pipe). When --output-error is given
          without a mode value, default to "warn". Without --output-error
          at all, tee diagnoses errors writing to any output except pipes
          and exits after all inputs are processed if any error occurred.

    design_decisions:
      - id: D1
        text: |
          Call sys.InstallSIGPIPEHandler() at the start of main per the
          shared SIGPIPE protocol in ARCHITECTURE.yaml. This ensures tee
          exits cleanly when downstream consumers close their stdin.
      - id: D2
        text: |
          Use flag parsing conventions consistent with the existing cmd/
          packages (see cmd/basename or cmd/true for reference). Support
          both short (-a, -i) and long (--append, --ignore-interrupts,
          --output-error) flag forms. Implement --version and --help
          following the same pattern as other cmd/ utilities.
      - id: D3
        text: |
          Use os.OpenFile with appropriate flags (O_WRONLY|O_CREATE and
          either O_TRUNC or O_APPEND) for each output file. Close all
          files after stdin is fully consumed. Collect errors and report
          them to stderr as "tee: <filename>: <error>".
      - id: D4
        text: |
          Read stdin in a loop using a fixed buffer (e.g., 32 KB) and
          write each chunk to all outputs. Do not read all of stdin into
          memory at once. This matches GNU tee behavior for large inputs.

    acceptance_criteria:
      - id: AC1
        text: cmd/tee/main.go compiles with "go build ./cmd/tee/"
      - id: AC2
        text: "echo hello | go run ./cmd/tee/ prints hello to stdout"
      - id: AC3
        text: "echo hello | go run ./cmd/tee/ /tmp/tee_test.txt writes hello to both stdout and /tmp/tee_test.txt"
      - id: AC4
        text: "The -a flag appends to existing files instead of truncating"
