  title: pkg/testutils DiffTest struct and runner -- rel00.0-uc004-testutils
  description: |-
    deliverable_type: code

    required_reading:
      - docs/ARCHITECTURE.yaml (pkg/testutils component, DiffTest data structure definition, DD2 differential testing, DD6 locale handling)
      - docs/specs/product-requirements/ (find the testutils PRD -- filename matches prd*testutils*.yaml)
      - docs/specs/use-cases/rel00.0-uc004-testutils.yaml (use case for this task)
      - docs/specs/test-suites/test-rel-00.0.yaml (test suite covering rel00.0 use cases)
      - go.mod (module path for import references)

    files:
      - path: pkg/testutils/difftest.go
        action: create
        note: DiffTest struct, DiffResult type, RunDiffTests public API, normalization hook type
      - path: pkg/testutils/runner.go
        action: create
        note: Internal binary execution, output capture, comparison, and divergence reporting

    requirements:
      - id: R1
        text: |
          Define the DiffTest struct in pkg/testutils/ with fields for input
          arguments ([]string), stdin (string or io.Reader), environment variables
          ([]string), expected exit code (int), and a test name (string), per the
          ARCHITECTURE.yaml data structures section which specifies "DiffTest: Go
          struct in pkg/testutils/ defining a single differential test case with
          fields for input arguments, stdin, environment, expected exit code, and
          expected output."
      - id: R2
        text: |
          Implement a runner function that executes both the Go binary under test
          and the reference GNU binary with identical stdin, arguments, and
          environment. Capture stdout, stderr, and exit code from each execution.
          Use os/exec to invoke both binaries.
      - id: R3
        text: |
          Compare stdout, stderr, and exit code between the Go binary and the
          reference binary. When any of the three diverge, report a test failure
          that includes the input arguments that triggered the divergence, the
          expected output (from the reference binary), and the actual output
          (from the Go binary).
      - id: R4
        text: |
          Support normalization hooks -- caller-provided functions with signature
          func(string) string -- applied to stdout and stderr before comparison,
          for known acceptable differences such as timestamps or binary name in
          error messages.

    design_decisions:
      - id: D1
        text: |
          Primary type is DiffTest; primary source file is difftest.go per
          ARCHITECTURE.yaml file naming convention (testutils/testutils.go is
          explicitly forbidden; file is named after the primary exported type).
      - id: D2
        text: |
          The runner is a test helper called from _test.go files in cmd/ packages.
          It accepts a *testing.T for failure reporting. Each DiffTest case runs
          as a t.Run subtest named after the DiffTest.Name field so failures are
          individually identifiable.
      - id: D3
        text: |
          Set LC_ALL=C in the environment for every binary execution per
          ARCHITECTURE.yaml DD6 (all differential tests run with LC_ALL=C so Go
          and reference binary outputs agree). Merge LC_ALL=C with any
          caller-provided environment variables, with LC_ALL=C taking precedence.

    acceptance_criteria:
      - id: AC1
        text: |
          DiffTest struct is exported from pkg/testutils with all fields described
          in ARCHITECTURE.yaml (input arguments, stdin, environment, expected exit
          code, test name).
      - id: AC2
        text: |
          RunDiffTests is an exported function that accepts *testing.T, the Go
          binary path, the reference binary path, an optional slice of
          normalization functions, and a slice of DiffTest cases.
      - id: AC3
        text: |
          When stdout, stderr, or exit code diverge between the two binaries, the
          test failure message includes the input arguments, the expected value
          (reference binary), and the actual value (Go binary).
      - id: AC4
        text: |
          Package compiles cleanly -- go build ./pkg/testutils/... and
          go vet ./pkg/testutils/... produce no errors.
