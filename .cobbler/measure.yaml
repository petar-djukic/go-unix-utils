  title: 'cmd/du: Implement core directory traversal and disk usage reporting (prd008-du R1, R2, R3, R5)'
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/product-requirements/prd008-du.yaml (PRD for du -- all requirements, flags, exit codes, edge cases; if path not found, locate the du PRD in docs/specs/product-requirements/)
      - docs/specs/use-cases/rel01.3-uc001-du.yaml (end-to-end execution path for du)
      - docs/ARCHITECTURE.yaml (cmd/ component pattern, pkg/sys/ for file metadata, pkg/format/ for size formatting)
      - cmd/wc/main.go (reference pattern for main/run structure, flag.NewFlagSet with ContinueOnError, error formatting to stderr, exit code handling)
      - cmd/cat/main.go (reference pattern for installSIGPIPEHandler using signal.Notify on syscall.SIGPIPE)
      - pkg/sys/fileinfo.go (Lstat function returning FileInfo with Blocks int64 field -- 512-byte units from st_blocks)
      - pkg/sys/fileinfo_linux.go (fillFromStat showing how Blocks is populated from syscall.Stat_t)
      - pkg/format/size.go (HumanSize function with HumanSizeOpts{Binary: true} for -h flag output)

    files:
      - path: cmd/du/main.go
        action: create
        note: "du command: recursive directory traversal, block accumulation, size display flags (-h, -k, -b), aggregation flags (-s, -c, -a, -d), error handling, SIGPIPE handler"

    requirements:
      - id: R1
        text: "Implement recursive directory traversal that walks each argument path depth-first using os.ReadDir + pkg/sys.Lstat, accumulates disk usage from the Blocks field (st_blocks in 512-byte units), and reports per-directory totals to stdout in the format '<size>\\t<path>\\n'. Default size unit is 1024-byte blocks (Blocks * 512 / 1024, rounded up with ceiling division). When no arguments are given, default to '.'. Use the same main()/run(args []string) int/os.Exit(run(os.Args[1:])) pattern as cmd/wc and cmd/cat. Each directory total includes its own allocation plus all descendants. Implements prd008-du R1."
      - id: R2
        text: "Implement size display flags: -h (human-readable output via pkg/format.HumanSize with HumanSizeOpts{Binary: true}, converting from bytes = Blocks * 512), -k (1024-byte blocks -- this is the default), -b combined with --apparent-size (use apparent file size FileInfo.Size in bytes instead of disk allocation Blocks * 512). When -h is active, pass the byte value to HumanSize and print the result instead of a numeric block count. Implements prd008-du R2."
      - id: R3
        text: "Implement aggregation and filtering flags: -s/--summarize (display only a total for each command-line argument, equivalent to -d 0), -c/--total (print a grand total line labeled 'total' after processing all arguments), -a/--all (write size counts for all files not just directories), -d/--max-depth=N (print the total for a directory only if it is N or fewer levels below the command-line argument; 0 means only the argument itself). Implements prd008-du R3."
      - id: R4
        text: "Implement error handling and signal management: exit 0 when all arguments succeed, exit 1 if any error occurs (permission denied, nonexistent path, read failure). Print errors to stderr in the format 'du: <path>: <error>' using os.PathError unwrapping (same pattern as cmd/wc printFileError and cmd/cat printFileError). Continue processing remaining arguments and subdirectories after per-entry errors. Install SIGPIPE handler using signal.Notify on syscall.SIGPIPE that calls os.Exit(0) (same pattern as cmd/cat installSIGPIPEHandler). Implements prd008-du R5."

    design_decisions:
      - id: D1
        text: "Follow the run(args []string) int entry point pattern from cmd/wc and cmd/cat. Parse flags with flag.NewFlagSet('du', flag.ContinueOnError) with fs.SetOutput(os.Stderr)."
      - id: D2
        text: "Use manual recursion with os.ReadDir + pkg/sys.Lstat rather than filepath.WalkDir. This enables bottom-up size accumulation where each directory's total includes all descendants, matching GNU du's depth-first reporting order (children printed before parent)."
      - id: D3
        text: "Use pkg/format.HumanSize(bytes, HumanSizeOpts{Binary: true}) for -h flag. Do not reimplement size formatting. Import pkg/sys for Lstat and pkg/format for HumanSize -- these are the only internal package dependencies."
      - id: D4
        text: "Differential tests against GNU reference binary 'gdu' (Homebrew coreutils) will be implemented in a separate du_test.go task. This task produces only cmd/du/main.go. The reference binary name 'gdu' follows the g-prefix convention used by cmd/wc (gwc) and cmd/cat (gcat)."

    acceptance_criteria:
      - id: AC1
        text: "cmd/du/main.go exists and compiles with 'go build ./cmd/du/' producing a working binary with no errors."
      - id: AC2
        text: "Running the binary with no flags on a directory produces tab-separated 1024-byte block counts and paths on stdout, one line per directory, with children printed before parents (depth-first order)."
      - id: AC3
        text: "Flags -h, -k, -b, -s, -c, -a, and -d are all accepted by the flag parser and produce correctly formatted output: -h uses pkg/format.HumanSize, -s suppresses per-subdirectory output, -c appends a total line, -a includes files, -d limits output depth."
      - id: AC4
        text: "The binary exits 0 on success and 1 on any error. Errors are written to stderr in 'du: <path>: <message>' format. Permission-denied on a subdirectory reports the error and continues traversal of remaining entries without halting."
