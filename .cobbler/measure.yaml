      - cmd/head/main.go (reference for a simple stream-processing utility -- match code style and structure)
      - pkg/sys/ (InstallSIGPIPEHandler usage)

    files:
      - path: cmd/cut/main.go
        action: create
        note: "cut utility implementation: flag parsing, range parsing, field/byte/character selection, multi-file processing"

    requirements:
      - id: R1
        text: |
          Implement the three selection modes from the cut PRD: byte selection (-b),
          character selection (-c), and field selection (-f). Parse range specifications
          (N, N-M, N-, -M) and comma-separated lists. Exactly one of -b, -c, -f is
          required; error if none or more than one is given.
      - id: R2
        text: |
          Implement delimiter and output control from the cut PRD: input delimiter (-d,
          default TAB for -f mode), suppress lines without delimiters (-s, only with -f),
          and output delimiter (--output-delimiter, defaults to input delimiter). For -b
          and -c modes, -d and -s are errors.
      - id: R3
        text: |
          Implement file handling: read from files listed on the command line, or stdin
          if no files given or file is "-". Concatenate output across files in order.
          Support "--" to end option parsing.
      - id: R4
        text: |
          Implement exit codes, --version, --help, SIGPIPE handling, and error reporting.
          Exit 0 on success, 1 on error. Call pkg/sys.InstallSIGPIPEHandler() at the
          start of main(). Write errors to stderr with "cut: " prefix. Support
          --complement flag to invert the selected range.

    design_decisions:
      - id: D1
        text: |
          Follow the shared_protocols SIGPIPE pattern from ARCHITECTURE.yaml:
          call sys.InstallSIGPIPEHandler() at the start of main().
      - id: D2
        text: |
          Match the code style and structure of cmd/head/main.go or another existing
          simple stream utility. Use flag or pflag consistent with existing cmd/ packages.
      - id: D3
        text: |
          Range parsing produces a sorted, merged list of 1-based column/byte/field
          indices. Process each input line by selecting the specified positions and
          joining with the output delimiter.
      - id: D4
        text: |
          Do NOT create tests in this task. Tests will be a separate task. Do NOT
          install any packages -- use only the Go standard library plus pkg/sys.

    acceptance_criteria:
      - id: AC1
        text: "cmd/cut/main.go exists and compiles: `go build ./cmd/cut/` succeeds with no errors."
      - id: AC2
        text: "All three selection modes work: `echo 'a:b:c' | go run ./cmd/cut/ -d: -f2` prints 'b'."
      - id: AC3
        text: "Range parsing handles N, N-M, N-, -M, and comma-separated lists correctly."
      - id: AC4
        text: "--complement inverts the selection. -s suppresses lines without delimiter in -f mode."
      - id: AC5
        text: "Multiple files are processed in order; stdin is used when no files are given."
      - id: AC6
        text: "Exit code is 0 on success, 1 on errors. Errors are written to stderr with 'cut: ' prefix."
      - id: AC7
