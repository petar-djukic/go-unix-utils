  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/product-requirements/prd008-du.yaml (du product requirements document -- if this exact path does not exist, search docs/specs/product-requirements/ for the du PRD by looking for files containing "du" in the filename)
