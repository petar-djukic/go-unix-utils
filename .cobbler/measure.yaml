  title: 'prd008-ls: Add --color flag to ls (auto/always/never)'
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/product-requirements/prd008-ls.yaml (full ls PRD -- identify the color-related sub-requirements for ls extended)
      - docs/specs/use-cases/rel04.1-uc001-ls-extended.yaml (ls extended use case -- verify --color is in scope)
      - cmd/ls/main.go (existing ls implementation -- this file will be modified to add color support)
      - pkg/format/color.go (color infrastructure: FileTypeColor, Reset, SetColorEnabled, ColorEnabled, ResetColorEnabled)
      - pkg/format/column.go (Columns layout and PadRight -- understand width computation for multi-column mode)

    files:
      - path: cmd/ls/main.go
        action: modify
        note: Add --color flag, entry mode tracking, and color-aware output rendering

    requirements:
      - id: R1
        text: "Add a --color flag to ls accepting values auto, always, and never. auto is the default: color is enabled when stdout is a terminal and disabled when piped. always forces color on regardless of terminal status. never forces color off. Parse the flag using flag.String with default value auto."
      - id: R2
        text: "When --color=always, call format.SetColorEnabled(true) before any output. When --color=never, call format.SetColorEnabled(false). When --color=auto (default), do not call SetColorEnabled -- pkg/format will detect TTY status automatically via its internal colorActive function."
      - id: R3
        text: "For each entry in a directory listing, obtain the file type mode from os.DirEntry.Type() and wrap the entry name with format.FileTypeColor(mode) as prefix and format.Reset() as suffix when color is active. When color is inactive, FileTypeColor and Reset return empty strings so no ANSI codes appear."
      - id: R4
        text: "In multi-column output mode, compute the grid layout using plain (un-colored) names so format.Columns and format.PadRight calculate column widths based on display width, not byte width including ANSI escape sequences. Apply color wrapping at render time after padding."
      - id: R5
        text: "Non-directory file arguments listed before directory contents also receive file type color. Use os.Lstat on each file argument to obtain its os.FileMode for color lookup via format.FileTypeColor."

    design_decisions:
      - id: D1
        text: "Use the existing pkg/format color infrastructure (FileTypeColor, Reset, SetColorEnabled) per ARCHITECTURE.yaml component pkg/format. Do not implement color logic directly in cmd/ls. The color assignments (blue for directories, cyan for symlinks, green for executables, yellow bold for devices, magenta for sockets, yellow for pipes, reset for regular files) are defined in pkg/format/color.go and match GNU ls LS_COLORS defaults."
      - id: D2
        text: "Extend collectEntries to return both entry names and their file type modes. Introduce a struct type (e.g., lsEntry with Name string and Mode os.FileMode fields) to pair each entry name with its type. Obtain the mode from os.DirEntry.Type() during collection, avoiding a separate stat call at render time."
      - id: D3
        text: "Separate layout computation from color rendering: writeMultiColumn receives plain names for grid layout via format.Columns, then applies color codes when writing each cell to the output. This ensures ANSI escape sequences do not corrupt column alignment or padding calculations."

    acceptance_criteria:
      - id: AC1
        text: "cmd/ls/main.go compiles with no errors after modification."
      - id: AC2
        text: "Running the compiled ls binary with --color=always on a directory containing files and subdirectories produces ANSI escape codes in stdout matching the file type colors defined in pkg/format/color.go."
      - id: AC3
        text: "Running ls with --color=never on a directory produces stdout with no ANSI escape codes."
      - id: AC4
        text: "Running ls with --color=auto (or no --color flag) uses TTY detection: color codes appear when stdout is a terminal and are absent when stdout is piped."
      - id: AC5
        text: "Multi-column output with --color=always has correct column alignment -- entries are padded to the same column widths as without color, with the only difference being ANSI escape sequences wrapping entry names."
      - id: AC6
        text: "All existing differential tests in cmd/ls/ls_test.go pass without modification. The tests run with stdout piped to a buffer (not a terminal), so auto mode produces no color codes and stdout matches the reference binary byte-for-byte."
