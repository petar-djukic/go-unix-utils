      - path: cmd/head/head_test.go
        action: create
        note: differential tests against ghead reference binary

    requirements:
      - id: R1
        text: |
          Implement default behavior: read from stdin or named files and output
          the first 10 lines of each input. When no files are given, read stdin.
          When "-" is given as a filename, read stdin at that position.
      - id: R2
        text: |
          Implement -n (--lines) flag to output the first N lines instead of 10.
          Support the -N shorthand (e.g. head -5). When N is prefixed with "-",
          output all but the last N lines. Match GNU head semantics exactly.
      - id: R3
        text: |
          Implement -c (--bytes) flag to output the first N bytes instead of lines.
          Support K suffixes (b=512, kB=1000, K=1024, MB=1000*1000, M=1024*1024,
          and so on) per GNU coreutils convention. When N is prefixed with "-",
          output all but the last N bytes. -c and -n are mutually exclusive; last
          flag wins.
      - id: R4
        text: |
          Implement multi-file header behavior: when more than one file is given,
          print "==> filename <==" before each file's output, with a blank line
          between files. -q (--quiet/--silent) suppresses headers. -v (--verbose)
          forces headers even for a single file. Match GNU head header format exactly.

    design_decisions:
      - id: D1
        text: |
          Call pkg/sys.InstallSIGPIPEHandler() at the start of main() so the
          process exits cleanly when piped to a downstream consumer that closes
          stdin (e.g. head | head). This matches the shared protocol in
          ARCHITECTURE.yaml.
      - id: D2
        text: |
          Differential tests use pkg/testutils.BuildBinary to compile the Go binary
          and exec.LookPath("ghead") for the reference binary. If ghead is not found,
          call t.Skip per the graceful-skip shared protocol. All tests set LC_ALL=C.
      - id: D3
        text: |
          Use os.Exit(1) when any file cannot be opened, but continue processing
          remaining files (matching GNU head behavior). Print the error to stderr
          in the format "head: <filename>: <error>".
      - id: D4
        text: |
          Parse flags manually or with the flag package. Support both --lines=N and
          --lines N (space-separated) forms, plus the -N shorthand for -n N. The
          last of -n/-c wins when both are specified.

    acceptance_criteria:
      - id: AC1
        text: cmd/head/main.go compiles with no errors via "go build ./cmd/head/"
      - id: AC2
        text: "go vet ./cmd/head/..." reports no issues
      - id: AC3
