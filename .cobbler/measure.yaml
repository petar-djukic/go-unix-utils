        text: |
          Implement human-readable size formatting that converts byte counts to
          human-readable strings matching GNU coreutils --human-readable output format.
          Support both 1024-based (IEC) and 1000-based (SI) unit systems. The exact
          function signatures, unit suffixes, rounding rules, and edge-case behavior
          (zero bytes, negative values, exact multiples) must follow the format PRD.
          Read the PRD before implementing.
      - id: R2
        text: |
          Implement column alignment for tabular output. Support right-aligned
          numeric columns and left-aligned text columns for multi-row data. Accept
          a representation of rows and columns and produce formatted output with
          consistent column widths. This capability is used by wc (right-aligned
          counts) and du (right-aligned sizes with left-aligned paths). Follow the
          format PRD for the exact API.
      - id: R3
        text: |
          Create doc.go with package documentation following the pattern in
          pkg/sys/doc.go. Include the copyright header, SPDX license identifier,
          a doc comment describing the package purpose and listing implemented
          PRD requirement IDs, and the package declaration.
      - id: R4
        text: |
          All exported functions and types must have GoDoc comments. Use only the
          Go standard library -- no external dependencies beyond what is already
          in go.mod. Follow the project file naming convention: name each source
          file after its primary exported functionality (e.g., size.go for size
          formatting, columns.go for column alignment), not after the package name.

    design_decisions:
      - id: D1
        text: |
          Follow the copyright header pattern from pkg/sys/doc.go verbatim:
          line 1 is "// Copyright (c) 2026 Petar Djukic. All rights reserved."
          and line 2 is "// SPDX-License-Identifier: MIT". A blank line separates
          the copyright from the package doc comment.
      - id: D2
        text: |
          pkg/format/ uses only the Go standard library (fmt, strings, math,
          strconv as needed). It does NOT depend on golang.org/x/sys or any other
          external module. This is per ARCHITECTURE.yaml technology choices which
          list golang.org/x/sys as the only external dependency, scoped to pkg/sys/.
      - id: D3
        text: |
          ANSI color output is NOT in scope for this task. Only implement
          human-readable size formatting (R1) and column alignment (R2). Color
          support is an ARCHITECTURE.yaml capability for pkg/format/ but its
          primary consumer (ls) is deferred to rel99.0. It will be added in a
