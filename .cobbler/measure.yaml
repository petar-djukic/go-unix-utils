  title: pkg/sys file metadata -- Stat and Lstat platform abstraction
  description: |-
    deliverable_type: code

    required_reading:
      - docs/ARCHITECTURE.yaml (pkg/sys/ component description, design decisions, technology choices for golang.org/x/sys)
      - docs/specs/product-requirements/prd002-sys.yaml (full PRD for pkg/sys -- read for exact requirement IDs and field specifications)
      - docs/specs/use-cases/rel00.0-uc003-sys.yaml (use case for pkg/sys)
      - go.mod (verify golang.org/x/sys dependency is declared)
      - pkg/format/color.go (reference for package style, copyright header, SPDX identifier, and PRD-reference comment conventions)

    files:
      - path: pkg/sys/stat.go
        action: create
        note: Platform-independent FileMetadata struct and public Stat/Lstat functions
      - path: pkg/sys/stat_darwin.go
        action: create
        note: Darwin-specific Stat_t field extraction using build tag
      - path: pkg/sys/stat_linux.go
        action: create
        note: Linux-specific Stat_t field extraction using build tag

    requirements:
      - id: R1
        text: "Define an exported FileMetadata struct in pkg/sys/stat.go with platform-independent fields covering the stat metadata that diverges between Darwin and Linux: modification time (time.Time), access time (time.Time), block count (int64), block size (int64), device number (uint64), inode number (uint64), hard link count (uint64), UID (uint32), GID (uint32). This struct abstracts the Stat_t field-name divergence so cmd/ packages never import platform-specific syscall types."
      - id: R2
        text: "Implement an exported Stat(path string) (FileMetadata, error) function that calls os.Stat, extracts the underlying *syscall.Stat_t via FileInfo.Sys(), and delegates to an unexported extractMetadata function (defined in platform files) to populate FileMetadata. Return a wrapped error if os.Stat fails or the Sys() type assertion fails."
      - id: R3
        text: "Implement an exported Lstat(path string) (FileMetadata, error) function with identical logic to Stat but calling os.Lstat so symlinks are not followed. Reuse the same extractMetadata platform function."
      - id: R4
        text: "Isolate platform-specific Stat_t field access into stat_darwin.go (//go:build darwin) and stat_linux.go (//go:build linux). Each file implements extractMetadata(*syscall.Stat_t) FileMetadata. On Darwin, read Mtimespec/Atimespec for timestamps. On Linux, read Mtim/Atim. Both platforms read Blocks, Blksize, Dev, Ino, Nlink, Uid, Gid from their respective Stat_t field names."

    design_decisions:
      - id: D1
        text: "stat.go contains no build tags. Only stat_darwin.go and stat_linux.go carry build constraints. stat.go defines the struct and public API; platform files supply extractMetadata."
      - id: D2
        text: "Follow the copyright header, SPDX license identifier, and PRD-reference comment style established in pkg/format/color.go -- e.g., '// Implements: prd002-sys (RN)' at the package doc comment level."
      - id: D3
        text: "Use the standard library syscall.Stat_t (obtained via FileInfo.Sys()) for field access. Import golang.org/x/sys/unix only if the PRD or go.mod indicates it is needed for fields not available in the standard syscall package."

    acceptance_criteria:
      - id: AC1
        text: "FileMetadata struct is exported from package sys with all nine fields listed in R1."
      - id: AC2
        text: "Stat() and Lstat() functions are exported and return (FileMetadata, error). Both compile without errors when building for the current platform."
      - id: AC3
        text: "stat_darwin.go has //go:build darwin and stat_linux.go has //go:build linux. Neither platform file imports the other's types."
      - id: AC4
        text: "go vet ./pkg/sys/... passes with no errors on the current platform."
      - id: AC5
        text: "Copyright header, SPDX identifier, and PRD-reference comments are present in all three files, matching the style in pkg/format/color.go."
