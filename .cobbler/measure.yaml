  title: 'pkg/format: implement HumanSize, color, and column alignment (srd003-format)'
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd003-format.yaml (full SRD for format)
      - docs/ARCHITECTURE.yaml (pkg/format component description)
      - pkg/sys/ (IsTerminal used by ColorEnabled)

    files:
      - path: pkg/format/humansize.go
        action: create
        note: HumanSizeOpts struct and HumanSize function
      - path: pkg/format/color.go
        action: create
        note: FileTypeColor, Reset, ColorEnabled, SetColorEnabled, ResetColorEnabled
      - path: pkg/format/pad.go
        action: create
        note: PadRight, PadLeft, Columns functions

    requirements:
      - id: R1
        text: |
          Define HumanSizeOpts struct with Binary bool field. Implement HumanSize(bytes int64,
          opts HumanSizeOpts) string. When Binary is true, use 1024-based units (K, M, G, T)
          matching GNU coreutils -h output. When Binary is false, use 1000-based units (kB,
          MB, GB, TB) matching GNU coreutils --si output. Format values to match GNU output
          precision (e.g., "4.0K", "1.2M").
      - id: R2
        text: |
          Implement FileTypeColor(mode os.FileMode) string returning the ANSI escape sequence
          for the given file type (directory=blue, symlink=cyan, executable=green, etc.
          matching default GNU LS_COLORS). Implement Reset() string returning the ANSI reset
          sequence. Implement ColorEnabled(w io.Writer) bool that returns true when w is a
          terminal (using pkg/sys.IsTerminal). Implement SetColorEnabled(enabled bool) and
          ResetColorEnabled() for manual override of color state.
      - id: R3
        text: |
          Implement PadRight(s string, width int) string that right-pads s with spaces to
          the given width. Implement PadLeft(s string, width int) string that left-pads s
          with spaces to the given width. If s is already wider than width, return s
          unchanged.
      - id: R4
        text: |
          Implement Columns(entries []string, termWidth int) [][]string that arranges entries
          into columns fitting within termWidth, using the same column-filling algorithm as
          GNU ls -C (fill columns top-to-bottom, then left-to-right). Each column is padded
          to the width of its widest entry plus 2 spaces.

    design_decisions:
      - id: D1
        text: |
          The package is github.com/petar-djukic/go-unix-utils/pkg/format. It imports
          pkg/sys for IsTerminal. It must not import any cmd/ package.
      - id: D2
        text: |
          ColorEnabled uses a package-level variable that can be overridden by SetColorEnabled.
          ResetColorEnabled restores the auto-detect behavior based on IsTerminal.
      - id: D3
        text: |
          HumanSize output must match GNU coreutils formatting exactly -- values below 10
          show one decimal place (e.g., "4.0K"), values at 10 or above show no decimal
          for whole numbers.

    acceptance_criteria:
      - id: AC1
        text: "go build ./pkg/format/... compiles without errors"
      - id: AC2
        text: "go vet ./pkg/format/... reports no issues"
      - id: AC3
        text: HumanSize produces GNU-compatible output for both binary and SI modes
      - id: AC4
        text: FileTypeColor returns correct ANSI codes for directories, symlinks, executables
      - id: AC5
        text: PadRight and PadLeft pad correctly and handle strings wider than width
      - id: AC6
        text: Columns arranges entries into columns fitting the given terminal width
