      - path: pkg/sys/terminal.go
        action: create
        note: Terminal size query via TIOCGWINSZ ioctl

    requirements:
      - id: R1
        text: |
          Implement file metadata abstraction that wraps os.Stat and os.Lstat,
          providing platform-independent access to modification time (time.Time)
          and disk block count (int64). Use build-tagged source files to abstract
          the st_mtimespec (Darwin) vs st_mtim (Linux) and st_blocks divergence
          in syscall.Stat_t. Anchor to the file metadata requirements in the
          pkg/sys PRD found via required_reading.
      - id: R2
        text: |
          Implement signal handling utilities for SIGPIPE, SIGHUP, and SIGWINCH.
          Provide functions to install a handler channel for a given set of
          signals and to reset signal disposition to the default. Anchor to
          the signal handling requirements in the pkg/sys PRD.
      - id: R3
        text: |
          Implement terminal size query using the TIOCGWINSZ ioctl via
          golang.org/x/sys/unix. Return terminal dimensions as rows and
          columns. Anchor to the terminal query requirements in the pkg/sys PRD.
      - id: R4
        text: |
          Structure the package with Go build constraints (//go:build darwin,
          //go:build linux) for all platform-specific files. The
          platform-independent API must be importable by cmd/ packages without
          those packages importing golang.org/x/sys directly.

