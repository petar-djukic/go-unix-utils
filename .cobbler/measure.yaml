  description: |-
    deliverable_type: documentation
    format_rule: prd-format

    required_reading:
      - docs/specs/product-requirements/prd005-wc.yaml (PRD format and structure reference)
      - docs/specs/product-requirements/prd006-cat.yaml (PRD format and structure reference)
      - docs/ARCHITECTURE.yaml (project structure, naming conventions, design decisions)
      - docs/VISION.yaml (project goals, success criteria, scope boundaries)

    files:
