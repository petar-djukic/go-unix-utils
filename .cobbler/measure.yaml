    files:
      - path: cmd/du/du_test.go
        action: create
        note: Differential tests for cmd/du against GNU reference binary gdu

    requirements:
      - id: R1
        text: |
          Implement differential tests for default recursive disk usage behavior
          (prd009-du R1). Test cases: single directory argument with subdirectories
          and files, multiple directory arguments processed in order, single regular
          file argument. Create a temporary directory tree with at least two levels
          of subdirectories and multiple files of known content so both binaries
          operate on identical filesystem state.
      - id: R2
        text: |
          Implement differential tests for size mode and output format flags
          (prd009-du R2). Test cases: -h (human-readable binary), --si
          (human-readable SI), -k (kilobyte blocks, default), -m (megabyte blocks),
          -b/--apparent-size, --block-size=N, -s/--summarize, -a/--all, -c/--total,
          -d N/--max-depth=N, -0/--null.
      - id: R3
        text: |
          Implement differential tests for traversal behavior (prd009-du R3). Test
          cases: hard-link deduplication (create two hard links to the same file via
          os.Link, verify size counted once), symlink handling with -L/--dereference
          vs default -P behavior, combined short flags (-sh, -sc, -ah).
      - id: R4
        text: |
          Implement differential tests for error handling and exit codes
          (prd009-du R4). Test cases: nonexistent path returns exit code 1,
          nonexistent path mixed with valid path returns exit code 1 but still
          prints valid output, -- flag terminator with a filename that resembles
          a flag (e.g., a file named "-s").

    design_decisions:
      - id: D1
        text: |
          Follow TestMain pattern from cmd/cat/cat_test.go and cmd/wc/wc_test.go:
          build Go binary with exec.Command("go", "build", "-o", goBinaryPath, "."),
          locate reference binary gdu via exec.LookPath("gdu"), skip all tests with
          os.Exit(0) if gdu is not found. Package declaration is "package main".
          Use the same goBinaryPath/refBinaryPath package-level variable pattern.
      - id: D2
        text: |
          Use pkg/testutils.RunDiffTests for all test functions. Each test function
          creates a []testutils.DiffTest slice and passes goBinaryPath, refBinaryPath,
          nil normalizers, and the test slice. No custom normalizers are needed
          because both binaries operate on the same filesystem paths and produce
          deterministic size output for the same files.
      - id: D3
        text: |
          Create filesystem fixtures in t.TempDir() within each test function. Build
          directory trees with os.MkdirAll, regular files with os.WriteFile, hard
          links with os.Link, and symlinks with os.Symlink. Both binaries receive
          the same absolute temp directory paths as arguments, so output paths match
          exactly. Use known file content to ensure reproducible block allocation.

    acceptance_criteria:
      - id: AC1
        text: cmd/du/du_test.go compiles without errors via "go vet ./cmd/du/..."
      - id: AC2
        text: |
          All test functions use testutils.RunDiffTests for stdout, stderr, and
          exit code comparison against the gdu reference binary
      - id: AC3
        text: |
          TestMain builds the Go du binary and locates the gdu reference binary,
          skipping gracefully with os.Exit(0) when gdu is not found on PATH
      - id: AC4
        text: |
          Tests cover all short and long flag forms: -a/--all, -s/--summarize,
          -c/--total, -h/--human-readable, --si, -k, -m, -b/--apparent-size,
          -L/--dereference, -P, -0/--null, -d N/--max-depth=N, --block-size=N,
          and -- flag terminator
      - id: AC5
        text: |
          At least one test exercises hard-link deduplication by creating a hard
