  title: Implement pkg/sys file metadata and terminal size abstractions (rel00.0-uc003)
  description: |-
    deliverable_type: code

    required_reading:
      - docs/ARCHITECTURE.yaml (pkg/sys component -- responsibilities, capabilities, technology choices section for golang.org/x/sys)
      - "docs/specs/product-requirements/ (glob for prd*sys*.yaml -- read the PRD for pkg/sys to identify requirement IDs and struct shapes)"
      - "docs/specs/use-cases/ (glob for *uc*sys*.yaml -- read the use case for pkg/sys)"
      - pkg/testutils/difftest.go (coding style reference -- copyright header, SPDX identifier, package doc comment with Implements tag)
      - go.mod (check if golang.org/x/sys dependency already exists; add it if not)

    files:
      - path: pkg/sys/fileinfo.go
        action: create
        note: "FileInfo struct with platform-independent fields (ModTime, AccessTime, Blocks, BlockSize, underlying os.FileInfo); Stat and Lstat functions returning (*FileInfo, error)"
      - path: pkg/sys/fileinfo_darwin.go
        action: create
        note: "Darwin-specific extraction from syscall.Stat_t (Mtimespec, Atimespec, Blocks fields)"
      - path: pkg/sys/fileinfo_linux.go
        action: create
        note: "Linux-specific extraction from syscall.Stat_t (Mtim, Atim, Blocks fields)"
      - path: pkg/sys/terminal.go
        action: create
        note: "WinSize struct and TerminalSize function using TIOCGWINSZ ioctl"
      - path: pkg/sys/doc.go
        action: create
        note: "Package documentation with Implements tag referencing PRD requirement IDs"

    requirements:
      - id: R1
        text: |
          Define a FileInfo struct that exposes modification time (time.Time), access time
          (time.Time), block count (int64), and block size (int64) with consistent field names
          across Darwin and Linux. Include the original os.FileInfo so callers can access standard
          fields (Name, Size, Mode, IsDir). Implement Stat(path string) (*FileInfo, error) and
          Lstat(path string) (*FileInfo, error) that call os.Stat/os.Lstat, extract the underlying
          syscall.Stat_t via a platform-specific helper, and populate all FileInfo fields.
      - id: R2
        text: |
          Implement TerminalSize(fd uintptr) (*WinSize, error) that queries terminal dimensions
          via the TIOCGWINSZ ioctl using golang.org/x/sys/unix. WinSize must have Width (columns)
          and Height (rows) fields, both uint16. Return a descriptive error when fd is not a
          terminal.
      - id: R3
        text: |
          Isolate all platform-specific Stat_t field access into build-tagged files:
          fileinfo_darwin.go with //go:build darwin and fileinfo_linux.go with //go:build linux.
          Each platform file implements an extractFileInfo function that takes a syscall.Stat_t
          pointer and returns the platform-specific time and block fields. The shared fileinfo.go
          and terminal.go must not import platform-specific packages directly.
      - id: R4
        text: |
          Use golang.org/x/sys/unix for ioctl operations and TIOCGWINSZ constant. If go.mod does
          not already include golang.org/x/sys, add it via go get. Do not use the deprecated
          syscall package where golang.org/x/sys/unix provides the equivalent.

    design_decisions:
      - id: D1
        text: "golang.org/x/sys is the only approved external dependency per ARCHITECTURE.yaml. cmd/ packages must not import golang.org/x/sys directly -- they import pkg/sys as the abstraction layer."
      - id: D2
        text: "Primary source files named after their primary exported type per project convention: fileinfo.go for FileInfo, terminal.go for WinSize. Platform-specific files use _darwin/_linux suffixes."
      - id: D3
        text: "Follow coding style from pkg/testutils/difftest.go: copyright header with year and author, SPDX-License-Identifier: MIT, package doc comment, Implements comment referencing PRD requirement IDs."

    acceptance_criteria:
      - id: AC1
        text: "pkg/sys/fileinfo.go exports FileInfo struct, Stat function, and Lstat function with documented signatures"
      - id: AC2
        text: "pkg/sys/fileinfo_darwin.go has //go:build darwin tag and extracts Mtimespec, Atimespec, and Blocks from Darwin Stat_t"
      - id: AC3
        text: "pkg/sys/fileinfo_linux.go has //go:build linux tag and extracts Mtim, Atim, and Blocks from Linux Stat_t"
      - id: AC4
        text: "pkg/sys/terminal.go exports WinSize struct and TerminalSize function"
      - id: AC5
        text: "go build ./pkg/sys/ succeeds with no errors on the current platform"
      - id: AC6
        text: "go vet ./pkg/sys/ reports no issues"
