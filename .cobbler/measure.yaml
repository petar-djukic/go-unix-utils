  title: 'pkg/testutils: implement DiffTest, RunDiffTests, and normalizers (srd001-testutils)'
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd001-testutils.yaml (full SRD for testutils)
      - docs/ARCHITECTURE.yaml (shared_protocols section -- differential testing pattern)
      - CLAUDE.md (differential testing pattern and BuildBinary usage)

    files:
      - path: pkg/testutils/difftest.go
        action: create
        note: DiffTest struct, NormalizeFunc type, RunDiffTests, ComposeNormalizers, TimestampNormalizer
      - path: pkg/testutils/build.go
        action: create
        note: BuildBinary helper for compiling cmd/ packages in tests

    requirements:
      - id: R1
        text: |
          Define the DiffTest struct with fields: Name string, Args []string, Stdin []byte,
          Env []string, WorkDir string, ExitCode int, Normalize []NormalizeFunc,
          ExpectedFiles map[string][]byte. Define NormalizeFunc as func([]byte) []byte.
      - id: R2
        text: |
          Implement RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest).
          For each DiffTest, run both binaries with identical args, stdin, env, and working
          directory. Compare stdout, stderr, and exit code. If Normalize functions are
          provided, apply them to stdout and stderr before comparison. If ExpectedFiles is
          set, compare file contents after execution. Report differences using t.Errorf with
          the test name, input, expected output, and actual output.
      - id: R3
        text: |
          Implement ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc that chains
          multiple normalizers in order. Implement TimestampNormalizer as a package-level
          NormalizeFunc that replaces timestamp patterns with a fixed placeholder so
          time-dependent output can be compared.
      - id: R4
        text: |
          Implement BuildBinary(t *testing.T, dir string) string. Compile the Go package
          at the given directory within the module using "go build -o <tempdir>/<name> <dir>".
          Return the path to the compiled binary. Call t.Fatal if compilation fails. Register
          a t.Cleanup to remove the temporary binary. The function must work from within the
          Go module -- do not create temporary Go programs outside the module boundary.

    design_decisions:
      - id: D1
        text: |
          RunDiffTests sets LC_ALL=C in the environment for both binaries to ensure
          locale-independent output comparison, per ARCHITECTURE.yaml DD6.
      - id: D2
        text: |
          BuildBinary uses t.TempDir() for the output binary path and registers cleanup
          via t.Cleanup. It calls "go build" with the module-relative directory path.
      - id: D3
        text: |
          The package is github.com/petar-djukic/go-unix-utils/pkg/testutils. It must not
          import any cmd/ package or any other pkg/ package.
      - id: D4
        text: |
          RunDiffTests runs each test case as a subtest via t.Run(test.Name, ...) so
          failures are isolated and named.

    acceptance_criteria:
      - id: AC1
        text: "go build ./pkg/testutils/... compiles without errors"
      - id: AC2
        text: "go vet ./pkg/testutils/... reports no issues"
      - id: AC3
        text: DiffTest struct matches the contract signature exactly
      - id: AC4
        text: RunDiffTests runs both binaries and compares stdout, stderr, and exit code
      - id: AC5
        text: BuildBinary compiles a cmd/ package and returns the binary path
      - id: AC6
        text: ComposeNormalizers chains normalizers and TimestampNormalizer replaces timestamps
