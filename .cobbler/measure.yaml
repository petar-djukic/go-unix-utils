  title: Implement cmd/du main.go -- directory traversal and disk usage reporting (rel01.3-uc001-du)
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/use-cases/rel01.3-uc001-du.yaml (use case for du, references the PRD by name)
      - docs/specs/test-suites/test-rel-01.3.yaml (test suite for du with concrete test cases)
      - docs/specs/product-requirements/ (find the du PRD referenced from the use case above -- likely prd008-du.yaml or similar)
      - docs/ARCHITECTURE.yaml (cmd/ component, pkg/sys and pkg/format responsibilities, DD6 locale constraint)
      - cmd/wc/main.go (pattern for manual flag parsing with combined short flags, long flags, output formatting with bufio.Writer)
      - cmd/cat/main.go (pattern for manual flag parsing, processFile structure, error message format)
      - pkg/sys/stat.go (FileInfo struct -- Blocks field for disk usage, Lstat for symlink-safe metadata)
      - pkg/format/size.go (HumanSize function and HumanSizeOpts for -h and --si output)

    files:
      - path: cmd/du/main.go
        action: create
        note: "du implementation: flag parsing, recursive directory traversal, size accumulation, formatted output"

    requirements:
      - id: R1
        text: |
          Implement manual command-line flag parsing for du following the same
          pattern used in cmd/wc/main.go and cmd/cat/main.go: loop over
          os.Args[1:], handle combined short flags (e.g., -sh), long flags with
          -- prefix and = or space-separated values (e.g., --max-depth=3), and
          the -- flag terminator. Support the flags specified in the du PRD. At
          minimum support: -a (all entries not just directories), -s (summarize
          -- display only total for each argument), -c (produce grand total),
          -h (human-readable 1024-based), -k (1024-byte blocks), -d N /
          --max-depth=N (limit output depth), --si (1000-based human-readable),
          -L (dereference symlinks), -P (do not dereference, default), -0
          (null-terminated output), -b/--apparent-size (use apparent size not
          disk usage), and --block-size=SIZE.
      - id: R2
        text: |
          Implement recursive directory traversal that accumulates disk usage
          using pkg/sys.Lstat (or pkg/sys.Stat when -L is active) for file
          metadata. Calculate disk usage from FileInfo.Blocks * 512 (matching
          GNU du block-count semantics). Track visited inodes by dev+ino pair
          to avoid double-counting hard-linked files. Default output unit is
          1024-byte blocks. When -b/--apparent-size is active, use
          FileInfo.Size instead of Blocks.
      - id: R3
        text: |
          Implement output formatting matching GNU du: each line is the size
          value followed by a tab character followed by the path, terminated by
          newline (or NUL with -0). Use pkg/format.HumanSize with Binary=true
          for -h and Binary=false for --si. When -c is specified, print a grand
          total line with label "total". Output goes through bufio.Writer
          flushed before exit. When -s is active, print only the total for each
          top-level argument (suppress per-file output within directories).
          When --max-depth is active, suppress output for entries deeper than
          the specified level.
      - id: R4
        text: |
          Implement error handling matching GNU du: on permission denied,
          nonexistent path, or other I/O errors, print a diagnostic to stderr
          with "du: " prefix followed by path and system error message, then
          continue processing remaining arguments. Exit 0 on full success,
          exit 1 if any error occurred during traversal. Call
          sys.InstallSIGPIPEHandler() before any output. Flush bufio.Writer
          before os.Exit; exit 1 on flush failure.

    design_decisions:
      - id: D1
        text: |
          Use manual flag parsing (loop over os.Args[1:]) matching the pattern
          in cmd/wc and cmd/cat. Do not use the flag package. This matches the
          project convention for GNU-compatible flag handling with combined
          short flags.
      - id: D2
        text: |
          Use pkg/sys.Lstat (or pkg/sys.Stat with -L) for all file metadata
          rather than os.Lstat or raw syscall. pkg/sys provides the Blocks
          field from syscall.Stat_t and handles Darwin/Linux divergence in
          Stat_t field names (prd002-sys R2.3).
      - id: D3
        text: |
          Track visited files by dev+ino pair to avoid double-counting hard
          links. Use map[uint64]map[uint64]bool keyed by Dev then Ino. This
          matches GNU du behavior where each file's blocks are counted once
          regardless of hard link count.

    acceptance_criteria:
      - id: AC1
        text: cmd/du/main.go compiles successfully with "go build ./cmd/du/"
      - id: AC2
        text: "go vet ./cmd/du/" reports no issues
      - id: AC3
        text: |
          The implementation uses pkg/sys.Lstat (or pkg/sys.Stat for -L) for
          file metadata and pkg/format.HumanSize for -h/--si output -- no
          duplication of syscall wrapping or size formatting logic from pkg/
      - id: AC4
        text: |
          Error messages are written to stderr with "du: " prefix including
          the path and system error, and the program continues processing
          remaining arguments after each error
      - id: AC5
        text: |
          main() calls sys.InstallSIGPIPEHandler() before any output,
          matching the pattern established in cmd/wc and cmd/cat
      - id: AC6
        text: |
          Flag parsing supports combined short flags (-sh means -s -h),
          long flags with = separator (--max-depth=3), and the -- flag
          terminator, consistent with cmd/wc and cmd/cat patterns
      - id: AC7
        text: |
          Hard-linked files are counted only once by tracking dev+ino pairs
          across the traversal
  dependency: -1
