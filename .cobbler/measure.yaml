        text: "Use golang.org/x/sys/unix.IoctlGetWinsize in pkg/sys/terminal.go with the same //go:build darwin || linux tag as fileinfo.go. Unlike fileinfo.go which needs separate _darwin.go and _linux.go files for Stat_t field divergence, IoctlGetWinsize and Winsize have identical signatures on both platforms, so a single file with the shared build tag suffices."
      - id: D2
        text: "Determine output mode in main() before processing arguments: if -1 is set use single-column, if -C is set use multi-column, otherwise call pkg/sys.TerminalWidth(int(os.Stdout.Fd())) -- if it returns an error stdout is not a terminal and single-column is used."
