        - file: pkg/testutils/difftest.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package testutils provides a differential testing harness for go-unix-utils.
            5 | //
            6 | // It executes a Go binary and a GNU reference binary with identical inputs and
            7 | // compares stdout, stderr, and exit code. Divergences are reported as test
            8 | // failures via the standard testing package.
            9 | //
            10 | // Implements: prd001-testutils R1, R2, R3, R4, R5.
            11 | package testutils
            13 | import (
            14 | 	"bytes"
            15 | 	"context"
            16 | 	"errors"
            17 | 	"fmt"
            18 | 	"os"
            19 | 	"os/exec"
            20 | 	"path/filepath"
            21 | 	"regexp"
            22 | 	"strings"
            23 | 	"testing"
            24 | 	"time"
            25 | )
            27 | // defaultTimeout is the maximum time allowed for each binary invocation
            28 | // (prd001-testutils R2.3).
            29 | const defaultTimeout = 10 * time.Second
            31 | // maxStdinReport is the maximum number of stdin bytes shown in failure messages
            32 | // (prd001-testutils R3.5).
            33 | const maxStdinReport = 256
            35 | // timestampPlaceholder is the fixed string that replaces timestamps.
            36 | const timestampPlaceholder = "<TIMESTAMP>"
            38 | // NormalizeFunc transforms raw output bytes before comparison.
            39 | // Applied to both reference and Go binary output (prd001-testutils R1.4).
            40 | type NormalizeFunc = func([]byte) []byte
            42 | // DiffTest defines a single differential test case run against two binaries.
            43 | // See prd001-testutils R1 for field semantics.
            44 | type DiffTest struct {
            45 | 	// Name is the subtest name used with t.Run; required.
            46 | 	Name string
            47 | 	// Args are command-line arguments passed to both binaries.
            48 | 	Args []string
            49 | 	// Stdin is piped to both binaries. nil means both receive EOF immediately.
            50 | 	// An empty non-nil slice ([]byte{}) also produces no bytes but is
            51 | 	// semantically distinct (open stdin that is immediately closed).
            52 | 	Stdin []byte
            53 | 	// Env holds KEY=VALUE pairs merged into the inherited environment.
            54 | 	// nil means use defaults only (LC_ALL=C); non-nil pairs override or
            55 | 	// extend the inherited environment.
            56 | 	Env []string
            57 | 	// WorkDir is the working directory for both binaries. Empty means a
            58 | 	// per-test t.TempDir() is used.
            59 | 	WorkDir string
            60 | 	// ExitCode is the expected exit code for both binaries.
            61 | 	ExitCode int
            62 | 	// Normalize functions are applied in order to stdout and stderr of both
            63 | 	// binaries before comparison. nil or empty means no normalization.
            64 | 	Normalize []NormalizeFunc
            65 | 	// ExpectedFiles maps relative paths to expected byte content after
            66 | 	// execution. Used for file-output utilities (sponge, cp).
            67 | 	ExpectedFiles map[string][]byte
            68 | }
            70 | // RunDiffTests executes each DiffTest as a named subtest, invoking both
            71 | // goBinary and refBinary with identical inputs and comparing their outputs.
            72 | // See prd001-testutils R2, R3.
            73 | func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) {
            74 | 	t.Helper()
            76 | 	for _, tc := range tests {
            77 | 		t.Run(tc.Name, func(t *testing.T) {
            78 | 			t.Helper()
            79 | 			runSingleDiffTest(t, goBinary, refBinary, tc)
            80 | 		})
            81 | 	}
            82 | }
            84 | // ComposeNormalizers returns a single NormalizeFunc that applies the given
            85 | // functions in order (prd001-testutils R4.4).
            86 | func ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc {
            87 | 	return func(data []byte) []byte {
            88 | 		for _, fn := range fns {
            89 | 			data = fn(data)
            90 | 		}
            91 | 		return data
            92 | 	}
            93 | }
            95 | // timestampPattern matches common strftime timestamp formats:
            96 | //   - "Mon DD HH:MM:SS" (e.g., "Feb 19 12:34:56")
            97 | //   - "YYYY-MM-DD HH:MM:SS" (e.g., "2026-02-19 12:34:56")
            98 | //   - "HH:MM:SS" (e.g., "12:34:56")
            99 | var timestampPattern = regexp.MustCompile(
            100 | 	`(?:` +
            101 | 		`[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}` +
            102 | 		`|` +
            103 | 		`\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}` +
            104 | 		`|` +
            105 | 		`\d{2}:\d{2}:\d{2}` +
            106 | 		`)`,
            107 | )
            109 | // TimestampNormalizer replaces common strftime-formatted timestamps with a
            110 | // fixed placeholder string (prd001-testutils R4.2).
            111 | func TimestampNormalizer(data []byte) []byte {
            112 | 	return timestampPattern.ReplaceAll(data, []byte(timestampPlaceholder))
            113 | }
            115 | // runSingleDiffTest runs one DiffTest case against both binaries and reports
            116 | // divergence.
            117 | func runSingleDiffTest(t *testing.T, goBinary, refBinary string, tc DiffTest) {
            118 | 	t.Helper()
            120 | 	workDir := tc.WorkDir
            121 | 	if workDir == "" {
            122 | 		workDir = t.TempDir()
            123 | 	}
            125 | 	env := buildEnv(tc.Env)
            127 | 	refStdout, refStderr, refExit, err := runBinary(refBinary, tc.Args, tc.Stdin, env, workDir)
            128 | 	if err != nil {
            129 | 		t.Fatalf("reference binary failed to execute: %v", err)
            130 | 	}
            132 | 	goStdout, goStderr, goExit, err := runBinary(goBinary, tc.Args, tc.Stdin, env, workDir)
            133 | 	if err != nil {
            134 | 		t.Fatalf("Go binary failed to execute: %v", err)
            135 | 	}
            137 | 	// Apply normalization to both outputs (prd001-testutils R3.1, R4).
            138 | 	normRefStdout := applyNormalizers(refStdout, tc.Normalize)
            139 | 	normRefStderr := applyNormalizers(refStderr, tc.Normalize)
            140 | 	normGoStdout := applyNormalizers(goStdout, tc.Normalize)
            141 | 	normGoStderr := applyNormalizers(goStderr, tc.Normalize)
            143 | 	failed := !bytes.Equal(normRefStdout, normGoStdout) ||
            144 | 		!bytes.Equal(normRefStderr, normGoStderr) ||
            145 | 		refExit != goExit
            147 | 	if failed {
            148 | 		t.Fatalf("differential test divergence\n"+
            149 | 			"args:       %v\n"+
            150 | 			"stdin:      %s\n"+
            151 | 			"ref stdout: %s\n"+
            152 | 			"go  stdout: %s\n"+
            153 | 			"ref stderr: %s\n"+
            154 | 			"go  stderr: %s\n"+
            155 | 			"ref exit:   %d\n"+
            156 | 			"go  exit:   %d",
            157 | 			tc.Args,
            158 | 			truncateStdin(tc.Stdin),
            159 | 			normRefStdout,
            160 | 			normGoStdout,
            161 | 			normRefStderr,
            162 | 			normGoStderr,
            163 | 			refExit,
            164 | 			goExit,
            165 | 		)
            166 | 	}
            168 | 	// File-state comparison (prd001-testutils R5).
            169 | 	checkExpectedFiles(t, tc, workDir)
            170 | }
            172 | // runBinary executes a binary with the given arguments, stdin, environment, and
            173 | // working directory. Returns stdout, stderr, exit code, and any execution error.
            174 | func runBinary(binary string, args []string, stdin []byte, env []string, workDir string) (stdout, stderr []byte, exitCode int, err error) {
            175 | 	ctx, cancel := context.WithTimeout(context.Background(), defaultTimeout)
            176 | 	defer cancel()
            178 | 	cmd := exec.CommandContext(ctx, binary, args...)
            179 | 	cmd.Dir = workDir
            180 | 	cmd.Env = env
            182 | 	var stdoutBuf, stderrBuf bytes.Buffer
            183 | 	cmd.Stdout = &stdoutBuf
            184 | 	cmd.Stderr = &stderrBuf
            186 | 	if stdin != nil {
            187 | 		cmd.Stdin = bytes.NewReader(stdin)
            188 | 	}
            190 | 	runErr := cmd.Run()
            191 | 	stdout = stdoutBuf.Bytes()
            192 | 	stderr = stderrBuf.Bytes()
            194 | 	if runErr != nil {
            195 | 		if ctx.Err() == context.DeadlineExceeded {
            196 | 			return stdout, stderr, -1, fmt.Errorf("binary %s timed out after %v", binary, defaultTimeout)
            197 | 		}
            198 | 		var exitErr *exec.ExitError
            199 | 		if errors.As(runErr, &exitErr) {
            200 | 			return stdout, stderr, exitErr.ExitCode(), nil
            201 | 		}
            202 | 		return stdout, stderr, -1, fmt.Errorf("executing %s: %w", binary, runErr)
            203 | 	}
            205 | 	return stdout, stderr, 0, nil
            206 | }
            208 | // buildEnv constructs the environment for binary invocations. It inherits the
            209 | // test process environment, sets LC_ALL=C as default, then merges any
            210 | // DiffTest.Env overrides (prd001-testutils R2.6).
            211 | func buildEnv(testEnv []string) []string {
            212 | 	env := os.Environ()
            214 | 	// Set LC_ALL=C as default (prd001-testutils R2.6).
            215 | 	env = setEnvVar(env, "LC_ALL", "C")
            217 | 	// Merge test-specific overrides.
            218 | 	for _, kv := range testEnv {
            219 | 		parts := strings.SplitN(kv, "=", 2)
            220 | 		if len(parts) == 2 {
            221 | 			env = setEnvVar(env, parts[0], parts[1])
            222 | 		}
            223 | 	}
            225 | 	return env
            226 | }
            228 | // setEnvVar sets or replaces an environment variable in a slice.
            229 | func setEnvVar(env []string, key, value string) []string {
            230 | 	prefix := key + "="
            231 | 	for i, e := range env {
            232 | 		if strings.HasPrefix(e, prefix) {
            233 | 			env[i] = prefix + value
            234 | 			return env
            235 | 		}
            236 | 	}
            237 | 	return append(env, prefix+value)
            238 | }
            240 | // applyNormalizers applies each NormalizeFunc in order to the input bytes.
            241 | func applyNormalizers(data []byte, fns []NormalizeFunc) []byte {
            242 | 	for _, fn := range fns {
            243 | 		data = fn(data)
            244 | 	}
            245 | 	return data
            246 | }
            248 | // checkExpectedFiles verifies file-state after binary execution
            249 | // (prd001-testutils R5).
            250 | func checkExpectedFiles(t *testing.T, tc DiffTest, workDir string) {
            251 | 	t.Helper()
            253 | 	for relPath, expected := range tc.ExpectedFiles {
            254 | 		absPath := filepath.Join(workDir, relPath)
            255 | 		actual, err := os.ReadFile(absPath)
            256 | 		if err != nil {
            257 | 			t.Fatalf("expected file %s: %v", relPath, err)
            258 | 		}
            259 | 		if !bytes.Equal(expected, actual) {
            260 | 			t.Fatalf("file content divergence for %s\n"+
            261 | 				"expected: %s\n"+
            262 | 				"actual:   %s",
            263 | 				relPath, expected, actual)
            264 | 		}
            265 | 	}
            266 | }
            268 | // truncateStdin returns a display-safe representation of stdin, truncated to
            269 | // maxStdinReport bytes if longer (prd001-testutils R3.5).
            270 | func truncateStdin(stdin []byte) string {
            271 | 	if stdin == nil {
            272 | 		return "<nil>"
            273 | 	}
            274 | 	if len(stdin) > maxStdinReport {
            275 | 		return fmt.Sprintf("%s... (%d bytes total)", stdin[:maxStdinReport], len(stdin))
            276 | 	}
            277 | 	return string(stdin)
            278 | }
