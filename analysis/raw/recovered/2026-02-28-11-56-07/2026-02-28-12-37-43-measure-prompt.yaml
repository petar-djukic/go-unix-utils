            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // signal.go provides signal handling setup for SIGPIPE, SIGHUP, and SIGWINCH
            5 | // using Go's os/signal package.
            6 | //
            7 | // Implements: prd002-sys R3.1, R3.2, R4.1, R4.2.
            8 | package sys
            10 | import (
            11 | 	"os"
            12 | 	"os/signal"
            13 | 	"sync"
            14 | 	"syscall"
            15 | )
            17 | var sigpipeOnce sync.Once
            19 | // InstallSIGPIPEHandler installs a SIGPIPE handler causing the process to
            20 | // exit 0 when stdout or stderr is closed by a downstream consumer. Safe to
            21 | // call multiple times; only one handler goroutine is started.
            22 | //
            23 | // Implements: prd002-sys R3.1, R3.2.
            24 | func InstallSIGPIPEHandler() {
            25 | 	sigpipeOnce.Do(func() {
            26 | 		c := make(chan os.Signal, 1)
            27 | 		signal.Notify(c, syscall.SIGPIPE)
            28 | 		go func() {
            29 | 			<-c
            30 | 			os.Exit(0)
            31 | 		}()
            32 | 	})
            33 | }
            35 | // InstallSIGHUPHandler installs a SIGHUP handler that calls the provided
            36 | // callback when the signal is received. Each call registers a separate
            37 | // handler goroutine.
            38 | func InstallSIGHUPHandler(callback func()) {
            39 | 	c := make(chan os.Signal, 1)
            40 | 	signal.Notify(c, syscall.SIGHUP)
            41 | 	go func() {
            42 | 		<-c
            43 | 		callback()
            44 | 	}()
            45 | }
            47 | var (
            48 | 	resizeMu             sync.Mutex
            49 | 	resizeCallbacks      []func(width int)
            50 | 	resizeHandlerStarted bool
            51 | )
            53 | // OnTerminalResize registers a callback that is invoked with the new terminal
            54 | // width when the terminal is resized (SIGWINCH). Multiple calls register
            55 | // multiple callbacks; callbacks are called in registration order. If
            56 | // TerminalSize returns an error during resize, the callback is not invoked.
            57 | //
            58 | // Implements: prd002-sys R4.1, R4.2.
            59 | func OnTerminalResize(callback func(width int)) {
            60 | 	resizeMu.Lock()
            61 | 	defer resizeMu.Unlock()
            63 | 	resizeCallbacks = append(resizeCallbacks, callback)
            64 | 	if !resizeHandlerStarted {
            65 | 		resizeHandlerStarted = true
            66 | 		c := make(chan os.Signal, 1)
            67 | 		signal.Notify(c, syscall.SIGWINCH)
            68 | 		go func() {
            69 | 			for range c {
            70 | 				cols, _, err := TerminalSize(os.Stdout.Fd())
            71 | 				if err != nil {
            72 | 					continue
            73 | 				}
            74 | 				resizeMu.Lock()
            75 | 				cbs := make([]func(width int), len(resizeCallbacks))
            76 | 				copy(cbs, resizeCallbacks)
            77 | 				resizeMu.Unlock()
            78 | 				for _, cb := range cbs {
            79 | 					cb(cols)
            80 | 				}
            81 | 			}
            82 | 		}()
            83 | 	}
            84 | }
