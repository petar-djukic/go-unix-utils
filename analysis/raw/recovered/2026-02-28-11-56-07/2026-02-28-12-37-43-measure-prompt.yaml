            38 | }
            40 | func TestOnTerminalResize_MultipleCallbacks(t *testing.T) {
            41 | 	// Calling OnTerminalResize multiple times must register multiple callbacks
            42 | 	// in the resizeCallbacks slice (R4.2).
            43 | 	resizeMu.Lock()
            44 | 	initialLen := len(resizeCallbacks)
            45 | 	resizeMu.Unlock()
            47 | 	OnTerminalResize(func(width int) {})
