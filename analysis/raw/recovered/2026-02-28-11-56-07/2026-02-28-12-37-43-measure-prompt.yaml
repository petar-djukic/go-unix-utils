            4 | // terminal.go provides terminal size queries via TIOCGWINSZ ioctl and TTY
            5 | // detection using golang.org/x/sys/unix.
            6 | //
            7 | // Implements: prd002-sys R1.1, R1.2, R1.3.
            8 | package sys
            10 | import (
            11 | 	"fmt"
            12 | 	"os"
            14 | 	"golang.org/x/sys/unix"
            15 | )
            17 | // defaultCols is the fallback column count when stdout is not a terminal.
            18 | const defaultCols = 80
            20 | // defaultRows is the fallback row count when stdout is not a terminal.
            21 | const defaultRows = 24
            23 | // TerminalSize queries the terminal dimensions (columns, rows) for the given
            24 | // file descriptor via TIOCGWINSZ ioctl. Returns an error when fd does not
            25 | // refer to a terminal or the ioctl fails.
            26 | //
            27 | // Implements: prd002-sys R1.1, R1.2.
            28 | func TerminalSize(fd uintptr) (cols, rows int, err error) {
            29 | 	ws, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            30 | 	if err != nil {
            31 | 		return 0, 0, fmt.Errorf("querying terminal size: %w", err)
            32 | 	}
            33 | 	return int(ws.Col), int(ws.Row), nil
            34 | }
            36 | // TerminalWidth returns the current terminal column count by calling
            37 | // TerminalSize on stdout. Returns an error when stdout is not a terminal.
            38 | //
            39 | // Implements: prd002-sys R1.1.
            40 | func TerminalWidth() (int, error) {
            41 | 	cols, _, err := TerminalSize(os.Stdout.Fd())
            42 | 	return cols, err
            43 | }
            45 | // DefaultTerminalSize returns the terminal dimensions for stdout, falling back
            46 | // to 80 columns and 24 rows when stdout is not a terminal.
            47 | //
            48 | // Implements: prd002-sys R1.1.
            49 | func DefaultTerminalSize() (cols, rows int) {
            50 | 	c, r, err := TerminalSize(os.Stdout.Fd())
            51 | 	if err != nil {
            52 | 		return defaultCols, defaultRows
            53 | 	}
            54 | 	return c, r
            55 | }
            57 | // IsTerminal reports whether the given file descriptor refers to a terminal.
            58 | // Returns false for pipes, regular files, and non-terminal descriptors.
            59 | // Implementation calls IoctlGetWinsize and returns err == nil.
            60 | //
            61 | // Implements: prd002-sys R1.3.
            62 | func IsTerminal(fd uintptr) bool {
            63 | 	_, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            64 | 	return err == nil
            65 | }
