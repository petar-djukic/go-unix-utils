            20 | 	// Note: sigpipeOnce may already have fired from a prior test run in the
            21 | 	// same process; this test verifies the call does not panic regardless.
            22 | 	InstallSIGPIPEHandler()
            23 | }
            25 | func TestInstallSIGPIPEHandler_Idempotent(t *testing.T) {
