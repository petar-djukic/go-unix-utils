            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package format provides output formatting shared across go-unix-utils
            5 | // utilities: human-readable size conversion, ANSI color codes for file types,
            6 | // and column alignment for tabular output.
            7 | //
            8 | // Implements: prd003-format R1, R2, R3.
            9 | package format
            11 | import "fmt"
            13 | // HumanSizeOpts configures the behavior of HumanSize.
            14 | //
            15 | // Implements: prd003-format R3.1.
            16 | type HumanSizeOpts struct {
            17 | 	// Binary selects 1024-based conversion with suffixes K/M/G/T/P/E when true
            18 | 	// (the default zero value). When false, uses 1000-based SI conversion with
            19 | 	// suffixes kB/MB/GB/TB.
            20 | 	Binary bool
            21 | }
            23 | // binarySuffixes are the unit suffixes for 1024-based human-readable sizes.
            24 | var binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            26 | // siSuffixes are the unit suffixes for 1000-based SI human-readable sizes.
            27 | var siSuffixes = []string{"", "kB", "MB", "GB", "TB"}
            29 | // HumanSize converts a byte count to a human-readable string. The conversion
            30 | // base and suffixes are selected by opts.Binary.
            31 | //
            32 | // When opts.Binary is true, uses base 1024 with suffixes K/M/G/T/P/E.
            33 | // When opts.Binary is false, uses base 1000 with suffixes kB/MB/GB/TB.
            34 | //
            35 | // Output uses at most one decimal place when the value is not an integer at
            36 | // the chosen unit (e.g., 1536 bytes → "1.5K"). Returns "0" for zero bytes.
            37 | //
            38 | // Implements: prd003-format R3.1, R3.2, R3.3, R3.4.
            39 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            40 | 	if bytes == 0 {
            41 | 		return "0"
            42 | 	}
            44 | 	var base float64
            45 | 	var suffixes []string
            46 | 	if opts.Binary {
            47 | 		base = 1024
            48 | 		suffixes = binarySuffixes
            49 | 	} else {
            50 | 		base = 1000
            51 | 		suffixes = siSuffixes
            52 | 	}
            54 | 	val := float64(bytes)
            55 | 	for i := 0; i < len(suffixes)-1; i++ {
            56 | 		if val < base {
            57 | 			return formatValue(val, suffixes[i])
            58 | 		}
            59 | 		val /= base
            60 | 	}
            62 | 	return formatValue(val, suffixes[len(suffixes)-1])
            63 | }
            65 | // formatValue formats a floating-point value with its suffix. Uses one decimal
            66 | // place when the value is less than 10 and not an integer; otherwise uses no
            67 | // decimal places.
            68 | func formatValue(val float64, suffix string) string {
            69 | 	if suffix == "" {
            70 | 		return fmt.Sprintf("%d", int64(val))
            71 | 	}
            72 | 	if val < 10 {
            73 | 		// Use one decimal place for values under 10.
            74 | 		s := fmt.Sprintf("%.1f", val)
            75 | 		// Strip trailing ".0" to produce clean integers (e.g., "1.0K" stays
            76 | 		// as "1.0K" per GNU coreutils convention — GNU always shows one
            77 | 		// decimal when the value is < 10).
            78 | 		return s + suffix
            79 | 	}
            80 | 	return fmt.Sprintf("%d", int64(val)) + suffix
            81 | }
