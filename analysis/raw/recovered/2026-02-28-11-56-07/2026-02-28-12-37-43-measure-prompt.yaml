            19 | // TestRunDiffTests_PassCase verifies that RunDiffTests reports no divergence
            20 | // when both binaries produce identical output (prd001-testutils R2, R3).
            21 | func TestRunDiffTests_PassCase(t *testing.T) {
            22 | 	tests := []DiffTest{
            23 | 		{
            24 | 			Name:     "echo_hello",
            25 | 			Args:     []string{"hello"},
            26 | 			ExitCode: 0,
            27 | 		},
            28 | 		{
            29 | 			Name:     "echo_multiple_args",
            30 | 			Args:     []string{"hello", "world"},
            31 | 			ExitCode: 0,
            32 | 		},
            33 | 		{
            34 | 			Name:     "echo_no_args",
            35 | 			Args:     nil,
            36 | 			ExitCode: 0,
            37 | 		},
            38 | 	}
            40 | 	// Using /bin/echo as both binaries guarantees identical output.
            41 | 	RunDiffTests(t, "/bin/echo", "/bin/echo", tests)
            42 | }
            44 | // TestRunDiffTests_WithStdin verifies that stdin is piped identically to both
            45 | // binaries (prd001-testutils R2.1, R2.2).
            46 | func TestRunDiffTests_WithStdin(t *testing.T) {
            47 | 	tests := []DiffTest{
            48 | 		{
            49 | 			Name:     "cat_stdin",
            50 | 			Args:     []string{"-c", "cat"},
            51 | 			Stdin:    []byte("hello from stdin\n"),
            52 | 			ExitCode: 0,
            53 | 		},
            54 | 	}
            56 | 	// /bin/sh -c cat reads stdin and writes it to stdout.
            57 | 	RunDiffTests(t, "/bin/sh", "/bin/sh", tests)
            58 | }
            60 | // TestTimestampNormalizer verifies that all three timestamp formats are replaced
            61 | // with the placeholder string (prd001-testutils R4.2).
            62 | func TestTimestampNormalizer(t *testing.T) {
            63 | 	tests := []struct {
            64 | 		name     string
            65 | 		input    string
            66 | 		expected string
            67 | 	}{
            68 | 		{
            69 | 			name:     "month_day_time",
            70 | 			input:    "Feb 19 12:34:56 some event",
            71 | 			expected: "<TIMESTAMP> some event",
            72 | 		},
            73 | 		{
            74 | 			name:     "iso_datetime",
            75 | 			input:    "2026-02-19 12:34:56 some event",
            76 | 			expected: "<TIMESTAMP> some event",
            77 | 		},
            78 | 		{
            79 | 			name:     "time_only",
            80 | 			input:    "12:34:56 some event",
            81 | 			expected: "<TIMESTAMP> some event",
            82 | 		},
            83 | 		{
            84 | 			name:     "no_timestamp",
            85 | 			input:    "no timestamp here",
            86 | 			expected: "no timestamp here",
            87 | 		},
            88 | 		{
            89 | 			name:     "multiple_timestamps",
            90 | 			input:    "start 09:00:00 end 17:30:00",
            91 | 			expected: "start <TIMESTAMP> end <TIMESTAMP>",
            92 | 		},
            93 | 		{
            94 | 			name:     "empty_input",
            95 | 			input:    "",
            96 | 			expected: "",
            97 | 		},
            98 | 	}
            100 | 	for _, tt := range tests {
            101 | 		t.Run(tt.name, func(t *testing.T) {
            102 | 			got := string(TimestampNormalizer([]byte(tt.input)))
            103 | 			if got != tt.expected {
            104 | 				t.Errorf("TimestampNormalizer(%q) = %q, want %q", tt.input, got, tt.expected)
            105 | 			}
            106 | 		})
            107 | 	}
            108 | }
            110 | // TestComposeNormalizers verifies that composed normalizers are applied in
            111 | // left-to-right order (prd001-testutils R4.4).
            112 | func TestComposeNormalizers(t *testing.T) {
            113 | 	// First normalizer: replace "A" with "B".
            114 | 	replaceAtoB := func(data []byte) []byte {
            115 | 		return bytes.ReplaceAll(data, []byte("A"), []byte("B"))
            116 | 	}
            117 | 	// Second normalizer: replace "B" with "C".
            118 | 	replaceBtoC := func(data []byte) []byte {
            119 | 		return bytes.ReplaceAll(data, []byte("B"), []byte("C"))
            120 | 	}
            122 | 	t.Run("left_to_right_order", func(t *testing.T) {
            123 | 		// A -> B (first), then B -> C (second). Result: "C".
            124 | 		composed := ComposeNormalizers(replaceAtoB, replaceBtoC)
            125 | 		got := string(composed([]byte("A")))
            126 | 		if got != "C" {
            127 | 			t.Errorf("ComposeNormalizers(A->B, B->C)(\"A\") = %q, want %q", got, "C")
            128 | 		}
            129 | 	})
            131 | 	t.Run("reverse_order_differs", func(t *testing.T) {
            132 | 		// B -> C (first), then A -> B (second). "A" is unaffected by first, then A -> B.
            133 | 		composed := ComposeNormalizers(replaceBtoC, replaceAtoB)
            134 | 		got := string(composed([]byte("A")))
            135 | 		if got != "B" {
            136 | 			t.Errorf("ComposeNormalizers(B->C, A->B)(\"A\") = %q, want %q", got, "B")
            137 | 		}
            138 | 	})
            140 | 	t.Run("single_normalizer", func(t *testing.T) {
            141 | 		composed := ComposeNormalizers(replaceAtoB)
            142 | 		got := string(composed([]byte("A")))
            143 | 		if got != "B" {
            144 | 			t.Errorf("ComposeNormalizers(A->B)(\"A\") = %q, want %q", got, "B")
            145 | 		}
            146 | 	})
            148 | 	t.Run("no_normalizers", func(t *testing.T) {
            149 | 		composed := ComposeNormalizers()
            150 | 		got := string(composed([]byte("unchanged")))
            151 | 		if got != "unchanged" {
            152 | 			t.Errorf("ComposeNormalizers()(\"unchanged\") = %q, want %q", got, "unchanged")
            153 | 		}
            154 | 	})
            155 | }
            157 | // TestBuildEnv verifies that buildEnv sets LC_ALL=C by default and correctly
            158 | // merges DiffTest.Env overrides (prd001-testutils R2.6).
            159 | func TestBuildEnv(t *testing.T) {
            160 | 	t.Run("default_lc_all", func(t *testing.T) {
            161 | 		env := buildEnv(nil)
            162 | 		val := envValue(env, "LC_ALL")
            163 | 		if val != "C" {
            164 | 			t.Errorf("buildEnv(nil) LC_ALL = %q, want %q", val, "C")
            165 | 		}
            166 | 	})
            168 | 	t.Run("override_lc_all", func(t *testing.T) {
            169 | 		env := buildEnv([]string{"LC_ALL=en_US.UTF-8"})
            170 | 		val := envValue(env, "LC_ALL")
            171 | 		if val != "en_US.UTF-8" {
            172 | 			t.Errorf("buildEnv with LC_ALL override = %q, want %q", val, "en_US.UTF-8")
            173 | 		}
            174 | 	})
            176 | 	t.Run("add_new_var", func(t *testing.T) {
            177 | 		env := buildEnv([]string{"MY_TEST_VAR=hello"})
            178 | 		val := envValue(env, "MY_TEST_VAR")
            179 | 		if val != "hello" {
            180 | 			t.Errorf("buildEnv with new var MY_TEST_VAR = %q, want %q", val, "hello")
            181 | 		}
            182 | 		// LC_ALL=C should still be set.
            183 | 		lcVal := envValue(env, "LC_ALL")
            184 | 		if lcVal != "C" {
            185 | 			t.Errorf("buildEnv LC_ALL after adding new var = %q, want %q", lcVal, "C")
            186 | 		}
            187 | 	})
            189 | 	t.Run("later_override_wins", func(t *testing.T) {
            190 | 		env := buildEnv([]string{"MY_VAR=first", "MY_VAR=second"})
            191 | 		val := envValue(env, "MY_VAR")
            192 | 		if val != "second" {
            193 | 			t.Errorf("buildEnv with duplicate key MY_VAR = %q, want %q", val, "second")
            194 | 		}
            195 | 	})
            196 | }
            198 | // TestTruncateStdin verifies the display-safe representation of stdin content
            199 | // (prd001-testutils R3.5).
            200 | func TestTruncateStdin(t *testing.T) {
            201 | 	tests := []struct {
            202 | 		name     string
            203 | 		input    []byte
            204 | 		expected string
            205 | 	}{
            206 | 		{
            207 | 			name:     "nil_input",
            208 | 			input:    nil,
            209 | 			expected: "<nil>",
            210 | 		},
            211 | 		{
            212 | 			name:     "empty_input",
            213 | 			input:    []byte{},
            214 | 			expected: "",
            215 | 		},
            216 | 		{
            217 | 			name:     "short_input",
            218 | 			input:    []byte("hello world"),
            219 | 			expected: "hello world",
            220 | 		},
            221 | 		{
            222 | 			name:     "exactly_256_bytes",
            223 | 			input:    []byte(strings.Repeat("x", 256)),
            224 | 			expected: strings.Repeat("x", 256),
            225 | 		},
            226 | 		{
            227 | 			name:     "exceeds_256_bytes",
            228 | 			input:    []byte(strings.Repeat("y", 300)),
            229 | 			expected: strings.Repeat("y", 256) + "... (300 bytes total)",
            230 | 		},
            231 | 	}
            233 | 	for _, tt := range tests {
            234 | 		t.Run(tt.name, func(t *testing.T) {
            235 | 			got := truncateStdin(tt.input)
            236 | 			if got != tt.expected {
            237 | 				t.Errorf("truncateStdin(%d bytes) = %q, want %q",
            238 | 					len(tt.input), got, tt.expected)
            239 | 			}
            240 | 		})
            241 | 	}
            242 | }
            244 | // TestCheckExpectedFiles verifies file-state comparison after binary execution
            245 | // (prd001-testutils R5).
            246 | func TestCheckExpectedFiles(t *testing.T) {
            247 | 	t.Run("matching_file", func(t *testing.T) {
            248 | 		dir := t.TempDir()
            249 | 		// Write a file that matches the expectation.
            250 | 		writeTestFile(t, dir, "output.txt", []byte("expected content"))
            252 | 		tc := DiffTest{
            253 | 			Name: "matching",
            254 | 			ExpectedFiles: map[string][]byte{
            255 | 				"output.txt": []byte("expected content"),
            256 | 			},
            257 | 		}
            258 | 		// Should not fail.
            259 | 		checkExpectedFiles(t, tc, dir)
            260 | 	})
            262 | 	t.Run("nil_expected_files", func(t *testing.T) {
            263 | 		dir := t.TempDir()
            264 | 		tc := DiffTest{
            265 | 			Name:          "no_files",
            266 | 			ExpectedFiles: nil,
            267 | 		}
            268 | 		// Should not fail — nil map means no file checks.
            269 | 		checkExpectedFiles(t, tc, dir)
            270 | 	})
            271 | }
            273 | // envValue finds the value for a given key in an environment slice.
            274 | func envValue(env []string, key string) string {
            275 | 	prefix := key + "="
            276 | 	for _, e := range env {
            277 | 		if strings.HasPrefix(e, prefix) {
            278 | 			return e[len(prefix):]
            279 | 		}
            280 | 	}
            281 | 	return ""
            282 | }
            284 | // writeTestFile creates a file with the given content in dir.
            285 | func writeTestFile(t *testing.T, dir, name string, content []byte) {
            286 | 	t.Helper()
            287 | 	path := filepath.Join(dir, name)
            288 | 	if err := os.WriteFile(path, content, 0o644); err != nil {
            289 | 		t.Fatalf("writing test file %s: %v", name, err)
            290 | 	}
            291 | }
