            116 | func TestPadRight(t *testing.T) {
            117 | 	tests := []struct {
            118 | 		name     string
            119 | 		input    string
            120 | 		width    int
            121 | 		expected string
            122 | 	}{
            123 | 		{name: "ascii_pad", input: "abc", width: 10, expected: "abc       "},
            124 | 		{name: "exact_width_no_pad", input: "abcde", width: 5, expected: "abcde"},
            125 | 		{name: "longer_than_width_unchanged", input: "abcdefgh", width: 5, expected: "abcdefgh"},
            126 | 		{name: "empty_string_pads_fully", input: "", width: 4, expected: "    "},
