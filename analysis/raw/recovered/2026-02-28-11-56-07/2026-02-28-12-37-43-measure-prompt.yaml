            2 | // SPDX-License-Identifier: MIT
            4 | // color.go provides ANSI color codes for Unix file types following GNU ls
            5 | // LS_COLORS default assignments, with automatic TTY detection and manual
            6 | // override for --color=always and --color=never flags.
            7 | //
            8 | // Implements: prd003-format R2.1, R2.2, R2.3, R2.4, R2.5, R2.6, R2.7.
            9 | package format
            11 | import (
            12 | 	"io"
            13 | 	"os"
            14 | 	"sync"
            15 | )
            17 | // ANSI escape sequences for file types matching GNU ls LS_COLORS defaults
            18 | // (prd003-format R2.4).
            19 | const (
            20 | 	colorDirectory = "\033[34m"   // blue
            21 | 	colorSymlink   = "\033[36m"   // cyan
            22 | 	colorExec      = "\033[32m"   // green
            23 | 	colorBlockDev  = "\033[33;1m" // yellow bold
            24 | 	colorCharDev   = "\033[33;1m" // yellow bold
            25 | 	colorSocket    = "\033[35m"   // magenta
            26 | 	colorPipe      = "\033[33m"   // yellow
            27 | 	colorReset     = "\033[0m"
            28 | )
            30 | // colorOverride tracks the process-global color override state.
            31 | // nil means automatic TTY detection; non-nil means forced on/off.
            32 | var (
            33 | 	colorMu       sync.RWMutex
            34 | 	colorOverride *bool
            35 | )
            37 | // SetColorEnabled overrides automatic TTY detection for FileTypeColor and
            38 | // Reset. When set to true, ANSI sequences are returned regardless of TTY
            39 | // state. When false, empty strings are returned regardless.
            40 | //
            41 | // Implements: prd003-format R2.6.
            42 | func SetColorEnabled(enabled bool) {
            43 | 	colorMu.Lock()
            44 | 	defer colorMu.Unlock()
            45 | 	colorOverride = &enabled
            46 | }
            48 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting to
            49 | // automatic TTY detection via ColorEnabled.
            50 | //
            51 | // Implements: prd003-format R2.7.
            52 | func ResetColorEnabled() {
            53 | 	colorMu.Lock()
            54 | 	defer colorMu.Unlock()
            55 | 	colorOverride = nil
            56 | }
            58 | // colorEnabled returns whether color output is currently active, considering
            59 | // both the manual override and automatic detection against the given writer.
            60 | func colorEnabled(w io.Writer) bool {
            61 | 	colorMu.RLock()
            62 | 	defer colorMu.RUnlock()
            64 | 	if colorOverride != nil {
            65 | 		return *colorOverride
            66 | 	}
            67 | 	return ColorEnabled(w)
            68 | }
            70 | // isColorForced returns (forced bool, value bool). If forced is true, value
            71 | // is the override state. If forced is false, the caller should use automatic
            72 | // detection.
            73 | func isColorForced() (bool, bool) {
            74 | 	colorMu.RLock()
            75 | 	defer colorMu.RUnlock()
            77 | 	if colorOverride != nil {
            78 | 		return true, *colorOverride
            79 | 	}
            80 | 	return false, false
            81 | }
            83 | // ColorEnabled returns true only when w is backed by a terminal (TTY).
            84 | // It attempts a type assertion to *os.File; if that fails, returns false.
            85 | // For *os.File, it checks whether the file descriptor is a terminal.
            86 | //
            87 | // Note: This function does NOT consult the manual override set by
            88 | // SetColorEnabled. Use FileTypeColor and Reset which handle the override
            89 | // automatically.
            90 | //
            91 | // Implements: prd003-format R2.3.
            92 | func ColorEnabled(w io.Writer) bool {
            93 | 	f, ok := w.(*os.File)
            94 | 	if !ok {
            95 | 		return false
            96 | 	}
            97 | 	return isTerminal(f.Fd())
            98 | }
            100 | // isTerminal reports whether the given file descriptor is a terminal.
            101 | // This uses a simple ioctl approach without importing pkg/sys, per D1/D3.
            102 | // On non-terminal file descriptors (pipes, regular files), the ioctl fails
            103 | // and this returns false.
            104 | func isTerminal(fd uintptr) bool {
            105 | 	// We avoid importing pkg/sys per design decision D1. Instead we check
            106 | 	// if Stat on the fd indicates a character device, which is a reasonable
            107 | 	// heuristic. For the actual TTY check, we use the same approach as
            108 | 	// golang.org/x/term: attempt to get terminal state.
            109 | 	//
            110 | 	// However, per D3 we cannot import external deps. We use os.NewFile +
            111 | 	// Stat to check if it's a character device as an approximation.
            112 | 	f := os.NewFile(fd, "")
            113 | 	if f == nil {
            114 | 		return false
            115 | 	}
            116 | 	fi, err := f.Stat()
            117 | 	if err != nil {
            118 | 		return false
            119 | 	}
            120 | 	return fi.Mode()&os.ModeCharDevice != 0
            121 | }
            123 | // FileTypeColor returns the ANSI escape sequence for the given file mode's
            124 | // type. Returns an empty string when color is disabled (via SetColorEnabled
            125 | // or when the override is not set and automatic detection would apply — in
            126 | // that case callers should use the colorEnabled helper or set the override).
            127 | //
            128 | // When no override is set and this function is called directly, it returns
            129 | // the ANSI code unconditionally so that callers who have already checked
            130 | // ColorEnabled can use it. When an override IS set, the override is respected.
            131 | //
            132 | // Implements: prd003-format R2.1, R2.4.
            133 | func FileTypeColor(mode os.FileMode) string {
            134 | 	forced, value := isColorForced()
            135 | 	if forced && !value {
            136 | 		return ""
            137 | 	}
            139 | 	switch {
            140 | 	case mode&os.ModeDir != 0:
            141 | 		return colorDirectory
            142 | 	case mode&os.ModeSymlink != 0:
            143 | 		return colorSymlink
            144 | 	case mode&os.ModeDevice != 0 && mode&os.ModeCharDevice != 0:
            145 | 		return colorCharDev
            146 | 	case mode&os.ModeDevice != 0:
            147 | 		return colorBlockDev
            148 | 	case mode&os.ModeSocket != 0:
            149 | 		return colorSocket
            150 | 	case mode&os.ModeNamedPipe != 0:
            151 | 		return colorPipe
            152 | 	case mode&0111 != 0:
            153 | 		// Executable regular file.
            154 | 		return colorExec
            155 | 	default:
            156 | 		// Regular file with no special type — no color (prd003-format R2.4:
            157 | 		// regular=0, meaning reset/default). Return empty string; the caller
            158 | 		// wraps with Reset if needed.
            159 | 		return ""
            160 | 	}
            161 | }
            163 | // Reset returns the ANSI reset sequence ("\033[0m") when color is enabled,
            164 | // or an empty string when color is disabled.
            165 | //
            166 | // Implements: prd003-format R2.2.
            167 | func Reset() string {
            168 | 	forced, value := isColorForced()
            169 | 	if forced && !value {
            170 | 		return ""
            171 | 	}
            172 | 	return colorReset
            173 | }
