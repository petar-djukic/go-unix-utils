          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // columns.go provides column alignment for tabular output (ls -l style),
            5 | // accepting output width as a parameter. The caller obtains terminal width
            6 | // from pkg/sys or other sources (design decision D1).
            7 | //
            8 | // Implements: prd003-format R1.1, R1.2, R1.3, R1.4.
            9 | package format
            11 | import (
            12 | 	"strings"
            13 | 	"unicode/utf8"
            14 | )
            16 | // columnGap is the minimum number of spaces between columns.
            17 | const columnGap = 2
            19 | // Columns distributes entries into the maximum number of columns that fit
            20 | // within termWidth. Column widths are computed from the longest entry in each
            21 | // column, not the global maximum (prd003-format R1.1, R1.4).
            22 | //
            23 | // Returns a slice of rows, where each row is a slice of entries. Returns nil
            24 | // for empty input.
            25 | func Columns(entries []string, termWidth int) [][]string {
            26 | 	if len(entries) == 0 {
            27 | 		return nil
            28 | 	}
            30 | 	if termWidth <= 0 {
            31 | 		termWidth = 80
            32 | 	}
            34 | 	// Try increasing column counts from the maximum possible down to 1.
            35 | 	// The maximum number of columns is bounded by the entry count.
            36 | 	maxCols := len(entries)
            38 | 	for numCols := maxCols; numCols >= 1; numCols-- {
            39 | 		numRows := (len(entries) + numCols - 1) / numCols
            41 | 		// Compute per-column widths based on the longest entry in each column.
            42 | 		// Entries are laid out column-major (down then across), matching GNU ls.
            43 | 		colWidths := make([]int, numCols)
            44 | 		for col := 0; col < numCols; col++ {
            45 | 			for row := 0; row < numRows; row++ {
            46 | 				idx := col*numRows + row
            47 | 				if idx >= len(entries) {
            48 | 					continue
            49 | 				}
            50 | 				w := displayWidth(entries[idx])
            51 | 				if w > colWidths[col] {
            52 | 					colWidths[col] = w
            53 | 				}
            54 | 			}
            55 | 		}
            57 | 		// Check if this column layout fits within termWidth.
            58 | 		totalWidth := 0
            59 | 		for i, w := range colWidths {
            60 | 			totalWidth += w
            61 | 			if i < numCols-1 {
            62 | 				totalWidth += columnGap
            63 | 			}
            64 | 		}
            66 | 		if totalWidth <= termWidth {
            67 | 			// Build the result grid.
            68 | 			result := make([][]string, numRows)
            69 | 			for row := 0; row < numRows; row++ {
            70 | 				var rowEntries []string
            71 | 				for col := 0; col < numCols; col++ {
            72 | 					idx := col*numRows + row
            73 | 					if idx >= len(entries) {
            74 | 						continue
            75 | 					}
            76 | 					rowEntries = append(rowEntries, entries[idx])
            77 | 				}
            78 | 				result[row] = rowEntries
            79 | 			}
            80 | 			return result
            81 | 		}
            82 | 	}
            84 | 	// Fallback: one entry per row.
            85 | 	result := make([][]string, len(entries))
            86 | 	for i, e := range entries {
            87 | 		result[i] = []string{e}
            88 | 	}
            89 | 	return result
            90 | }
            92 | // PadRight returns s padded with trailing spaces to the specified display
            93 | // width. If s is already at least width runes wide, it is returned unchanged.
            94 | //
            95 | // Implements: prd003-format R1.2.
            96 | func PadRight(s string, width int) string {
            97 | 	w := displayWidth(s)
            98 | 	if w >= width {
            99 | 		return s
            100 | 	}
            101 | 	return s + strings.Repeat(" ", width-w)
            102 | }
            104 | // PadLeft returns s padded with leading spaces to the specified display
            105 | // width. If s is already at least width runes wide, it is returned unchanged.
            106 | //
            107 | // Implements: prd003-format R1.2.
            108 | func PadLeft(s string, width int) string {
            109 | 	w := displayWidth(s)
            110 | 	if w >= width {
            111 | 		return s
            112 | 	}
            113 | 	return strings.Repeat(" ", width-w) + s
            114 | }
            116 | // displayWidth returns the display width of s in columns. Uses rune count,
            117 | // not byte count, per prd003-format R1.3. East-asian full-width characters
            118 | // are not handled in the current roadmap; rune count is sufficient.
            119 | func displayWidth(s string) int {
            120 | 	return utf8.RuneCountInString(s)
            121 | }
