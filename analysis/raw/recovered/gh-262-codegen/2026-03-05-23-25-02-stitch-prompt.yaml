            4 | // Package testutils provides the differential testing harness used by cmd/
            5 | // packages to verify Go utility implementations against reference GNU binaries.
            6 | // Each test case executes two binaries with identical inputs and compares the
            7 | // Go binary's outputs against expected values.
            8 | //
            9 | // Implements: prd001-testutils
            10 | // Architecture: docs/ARCHITECTURE.yaml § pkg/testutils
            11 | package testutils
            13 | import (
            14 | 	"bytes"
            15 | 	"fmt"
            16 | 	"os"
            17 | 	"os/exec"
            18 | 	"testing"
            19 | )
            21 | // DiffTest defines a single differential test case. Both the reference binary
            22 | // (refBin) and the Go binary (goBin) are executed with identical inputs; the
            23 | // Go binary's outputs are compared against the expected Want* values.
            24 | //
            25 | // Implements prd001-testutils R1.
            26 | type DiffTest struct {
            27 | 	// Args are the command-line arguments passed to both binaries.
            28 | 	Args []string
            30 | 	// Stdin is content piped to stdin of both binaries.
            31 | 	// nil means both binaries receive EOF immediately.
            32 | 	Stdin []byte
            34 | 	// Env contains additional KEY=VALUE environment variable pairs merged
            35 | 	// into the inherited process environment. Matching keys are overridden;
            36 | 	// new keys are added.
            37 | 	Env []string
            39 | 	// WantExit is the expected exit code of the Go binary.
            40 | 	WantExit int
            42 | 	// WantStdout is the expected stdout output of the Go binary.
            43 | 	WantStdout []byte
            45 | 	// WantStderr is the expected stderr output of the Go binary.
            46 | 	WantStderr []byte
            48 | 	// NormStdout, when non-nil, is applied to the actual stdout before
            49 | 	// comparison, enabling normalization of acceptable differences (e.g.,
            50 | 	// stripping trailing newlines or timestamps).
            51 | 	NormStdout func([]byte) []byte
            53 | 	// NormStderr, when non-nil, is applied to the actual stderr before
            54 | 	// comparison.
            55 | 	NormStderr func([]byte) []byte
            56 | }
            58 | // Run executes refBin and goBin with identical inputs and reports divergence
            59 | // between the Go binary's outputs and the expected Want* values. t.Errorf is
            60 | // used (not t.Fatalf) so all three mismatch kinds — exit code, stdout, stderr
            61 | // — are reported in a single invocation without halting at the first failure.
            62 | //
            63 | // Implements prd001-testutils R2, R3.
            64 | func (tc DiffTest) Run(t *testing.T, refBin, goBin string) {
            65 | 	t.Helper()
            67 | 	env := append(os.Environ(), tc.Env...)
            69 | 	// Execute the reference binary. Its output is not compared against
            70 | 	// Want*; it is run to confirm the reference binary is reachable.
            71 | 	if _, err := runBinary(refBin, tc.Args, tc.Stdin, env); err != nil {
            72 | 		t.Fatalf("reference binary %s: %v", refBin, err)
            73 | 	}
            75 | 	// Execute the Go binary and capture its outputs.
            76 | 	res, err := runBinary(goBin, tc.Args, tc.Stdin, env)
            77 | 	if err != nil {
            78 | 		t.Fatalf("go binary %s: %v", goBin, err)
            79 | 	}
            81 | 	gotStdout := res.stdout
            82 | 	gotStderr := res.stderr
            83 | 	if tc.NormStdout != nil {
            84 | 		gotStdout = tc.NormStdout(gotStdout)
            85 | 	}
            86 | 	if tc.NormStderr != nil {
            87 | 		gotStderr = tc.NormStderr(gotStderr)
            88 | 	}
            90 | 	// R3: report each mismatch independently so all failures are visible.
            91 | 	if res.exitCode != tc.WantExit {
            92 | 		t.Errorf("%s: exit code = %d, want %d", goBin, res.exitCode, tc.WantExit)
            93 | 	}
            94 | 	if !bytes.Equal(gotStdout, tc.WantStdout) {
            95 | 		t.Errorf("%s: stdout = %q, want %q", goBin, gotStdout, tc.WantStdout)
            96 | 	}
            97 | 	if !bytes.Equal(gotStderr, tc.WantStderr) {
            98 | 		t.Errorf("%s: stderr = %q, want %q", goBin, gotStderr, tc.WantStderr)
            99 | 	}
            100 | }
            102 | // binaryResult holds the captured output of a single binary execution.
            103 | type binaryResult struct {
            104 | 	stdout   []byte
            105 | 	stderr   []byte
            106 | 	exitCode int
            107 | }
            109 | // runBinary executes the binary at path with the given arguments, stdin, and
            110 | // environment and returns the captured stdout, stderr, and exit code.
            111 | // It returns an error only when the binary cannot be started; a non-zero exit
            112 | // code is captured in the result, not treated as an error.
            113 | func runBinary(path string, args []string, stdin []byte, env []string) (binaryResult, error) {
            114 | 	var outBuf, errBuf bytes.Buffer
            115 | 	cmd := exec.Command(path, args...)
            116 | 	cmd.Stdin = bytes.NewReader(stdin)
            117 | 	cmd.Stdout = &outBuf
            118 | 	cmd.Stderr = &errBuf
            119 | 	cmd.Env = env
            121 | 	err := cmd.Run()
            122 | 	exitCode := 0
            123 | 	if err != nil {
            124 | 		exitErr, ok := err.(*exec.ExitError) //nolint:errorlint
            125 | 		if !ok {
            126 | 			return binaryResult{}, fmt.Errorf("starting %s: %w", path, err)
            127 | 		}
            128 | 		exitCode = exitErr.ExitCode()
            129 | 	}
            130 | 	return binaryResult{
            131 | 		stdout:   outBuf.Bytes(),
            132 | 		stderr:   errBuf.Bytes(),
            133 | 		exitCode: exitCode,
            134 | 	}, nil
            135 | }
        - file: pkg/testutils/difftest_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package testutils
            6 | import (
            7 | 	"bytes"
            8 | 	"fmt"
            9 | 	"os"
            10 | 	"os/exec"
            11 | 	"strings"
            12 | 	"testing"
            13 | )
            15 | // helperEnvKey controls stub binary behavior when the test binary is run
            16 | // as a subprocess by DiffTest.Run. When set, TestMain handles the named mode
            17 | // and exits immediately without running any tests.
            18 | const helperEnvKey = "GO_TESTUTILS_HELPER"
            20 | // innerTestEnvKey signals that TestRun_ExitCodeMismatch is running inside a
            21 | // subprocess spawned by the outer invocation of that same test function.
            22 | const innerTestEnvKey = "GO_TESTUTILS_INNER"
            24 | // TestMain intercepts runs where the test binary is used as a stub binary.
            25 | // When GO_TESTUTILS_HELPER is set, the binary acts as the named stub and
            26 | // exits immediately without running any tests.
            27 | func TestMain(m *testing.M) {
            28 | 	if mode := os.Getenv(helperEnvKey); mode != "" {
            29 | 		runHelper(mode)
            30 | 	}
            31 | 	os.Exit(m.Run())
            32 | }
            34 | // runHelper implements stub binary behavior for the named mode and always
            35 | // calls os.Exit, so it never returns to the caller.
            36 | func runHelper(mode string) {
            37 | 	switch mode {
            38 | 	case "noop":
            39 | 		os.Exit(0)
            40 | 	case "exit1":
            41 | 		os.Exit(1)
            42 | 	case "hello":
            43 | 		_, _ = fmt.Fprint(os.Stdout, "hello\n") // best-effort; exit 0 regardless
            44 | 		os.Exit(0)
            45 | 	default:
            46 | 		_, _ = fmt.Fprintf(os.Stderr, "unknown helper mode: %s\n", mode) // best-effort
            47 | 		os.Exit(2)
            48 | 	}
            49 | }
            51 | // TestRun_AllMatch verifies that Run does not call t.Errorf when exit code,
            52 | // stdout, and stderr all match the expected values (prd001-testutils R3, AC2).
            53 | func TestRun_AllMatch(t *testing.T) {
            54 | 	t.Parallel()
            56 | 	self := os.Args[0]
            57 | 	tc := DiffTest{
            58 | 		Env:        []string{helperEnvKey + "=hello"},
            59 | 		WantExit:   0,
            60 | 		WantStdout: []byte("hello\n"),
            61 | 		WantStderr: nil,
            62 | 	}
            63 | 	tc.Run(t, self, self)
            64 | }
            66 | // TestRun_ExitCodeMismatch verifies that Run calls t.Errorf with the expected
            67 | // and actual exit codes when the Go binary exit code does not match WantExit
            68 | // (prd001-testutils R3, AC3).
            69 | //
            70 | // Because calling Run with a mismatch causes t.Errorf (and fails the test),
            71 | // the mismatch case is executed inside a subprocess. The outer test verifies
            72 | // the subprocess exits non-zero and that the failure message contains both the
            73 | // expected code (0) and the actual code (1).
            74 | func TestRun_ExitCodeMismatch(t *testing.T) {
            75 | 	if os.Getenv(innerTestEnvKey) == "exit_mismatch" {
            76 | 		// Inner invocation: exercise the exit code mismatch path.
            77 | 		// t.Parallel is intentionally omitted here to avoid pausing a
            78 | 		// subprocess test that has no sibling parallel tests.
            79 | 		self := os.Args[0]
            80 | 		tc := DiffTest{
            81 | 			Env:        []string{helperEnvKey + "=exit1"},
            82 | 			WantExit:   0, // binary exits 1, want 0 → t.Errorf expected
            83 | 			WantStdout: nil,
            84 | 			WantStderr: nil,
            85 | 		}
            86 | 		tc.Run(t, self, self)
            87 | 		return
            88 | 	}
            90 | 	t.Parallel()
            92 | 	// Outer invocation: run the inner test as a subprocess and verify it fails.
            93 | 	cmd := exec.Command(os.Args[0], "-test.run=^TestRun_ExitCodeMismatch$", "-test.v")
            94 | 	cmd.Env = append(os.Environ(), innerTestEnvKey+"=exit_mismatch")
            95 | 	out, err := cmd.CombinedOutput()
            96 | 	if err == nil {
            97 | 		t.Errorf("expected inner test to fail with exit code mismatch, but it passed:\n%s", out)
            98 | 		return
            99 | 	}
            100 | 	output := string(out)
            101 | 	if !strings.Contains(output, "exit code = 1") {
            102 | 		t.Errorf("expected failure message to contain 'exit code = 1', got:\n%s", output)
            103 | 	}
            104 | 	if !strings.Contains(output, "want 0") {
            105 | 		t.Errorf("expected failure message to contain 'want 0', got:\n%s", output)
            106 | 	}
            107 | }
            109 | // TestRun_NormStdout verifies that a NormStdout hook that strips trailing
            110 | // newlines causes an otherwise-mismatched stdout comparison to pass (AC4).
            111 | // The Go binary writes "hello\n" but WantStdout is "hello"; NormStdout strips
            112 | // the trailing newline so the comparison succeeds without t.Errorf.
            113 | func TestRun_NormStdout(t *testing.T) {
            114 | 	t.Parallel()
            116 | 	self := os.Args[0]
            117 | 	tc := DiffTest{
            118 | 		Env:        []string{helperEnvKey + "=hello"},
            119 | 		WantExit:   0,
            120 | 		WantStdout: []byte("hello"), // no trailing newline
            121 | 		WantStderr: nil,
            122 | 		NormStdout: func(b []byte) []byte {
            123 | 			return bytes.TrimRight(b, "\n")
            124 | 		},
            125 | 	}
            126 | 	tc.Run(t, self, self)
            127 | }
