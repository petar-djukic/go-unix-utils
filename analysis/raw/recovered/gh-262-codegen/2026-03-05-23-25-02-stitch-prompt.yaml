            119 | // runSponge executes the Go sponge binary with the given args, stdin, and env.
            120 | // Returns stdout, stderr, and the exit code.
            121 | func runSponge(t *testing.T, args []string, stdin []byte, env []string) ([]byte, []byte, int) {
            122 | 	t.Helper()
            123 | 	var outBuf, errBuf bytes.Buffer
