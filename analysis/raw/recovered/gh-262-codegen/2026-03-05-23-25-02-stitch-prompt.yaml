            252 | 		}
            253 | 		files = append(files, f0files...)
            254 | 	}
            256 | 	// R1.2: when no file arguments, read from stdin.
            257 | 	// Empty string signals implicit stdin (no filename in output).
            258 | 	// Explicit "-" argument uses "-" as the display label.
            259 | 	if len(files) == 0 {
            260 | 		files = []string{""}
            261 | 	}
