        - file: pkg/format/columns.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package format provides shared output formatting for Unix utilities:
            5 | // column alignment (prd003-format R1), ANSI terminal colorization (R2),
            6 | // and human-readable size conversion (R3).
            7 | //
            8 | // Implements: prd003-format
            9 | // Architecture: docs/ARCHITECTURE.yaml § pkg/format
            10 | package format
            12 | import (
            13 | 	"strings"
            14 | 	"unicode/utf8"
            15 | )
            17 | // columnSep is the number of spaces inserted between adjacent columns,
            18 | // matching gls column layout.
            19 | const columnSep = 2
            21 | // displayWidth returns the number of runes in s, used as its display column
            22 | // width. East-Asian full-width characters are not distinguished; rune count
            23 | // is sufficient for ASCII-dominant utility output (prd003-format R1.3).
            24 | func displayWidth(s string) int {
            25 | 	return utf8.RuneCountInString(s)
            26 | }
            28 | // PadRight returns s right-padded with spaces to the given display width.
            29 | // If s already fills or exceeds width, it is returned unchanged.
            30 | // Implements prd003-format R1.2.
            31 | func PadRight(s string, width int) string {
            32 | 	n := displayWidth(s)
            33 | 	if n >= width {
            34 | 		return s
            35 | 	}
            36 | 	return s + strings.Repeat(" ", width-n)
            37 | }
            39 | // PadLeft returns s left-padded with spaces to the given display width.
            40 | // If s already fills or exceeds width, it is returned unchanged.
            41 | // Implements prd003-format R1.2.
            42 | func PadLeft(s string, width int) string {
            43 | 	n := displayWidth(s)
            44 | 	if n >= width {
            45 | 		return s
            46 | 	}
            47 | 	return strings.Repeat(" ", width-n) + s
            48 | }
            50 | // Columns distributes entries into the maximum number of columns that fit
            51 | // within termWidth terminal columns. Entries are arranged in row-major
            52 | // (left-to-right, top-to-bottom) order, matching gls --format=across
            53 | // behavior. Each column's width is the maximum display width of its entries.
            54 | // Returned cells are right-padded to their column width so the caller can
            55 | // join a row with a two-space separator and stay within termWidth.
            56 | // Implements prd003-format R1.1.
            57 | func Columns(entries []string, termWidth int) [][]string {
            58 | 	if len(entries) == 0 {
            59 | 		return nil
            60 | 	}
            62 | 	// Find the maximum column count whose total row width fits in termWidth.
            63 | 	// Try descending from len(entries) to 1; stop at the first fit.
            64 | 	bestCols := 1
            65 | 	for numCols := len(entries); numCols >= 1; numCols-- {
            66 | 		widths := colWidthsFor(entries, numCols)
            67 | 		total := columnSep * (numCols - 1)
            68 | 		for _, w := range widths {
            69 | 			total += w
            70 | 		}
            71 | 		if total <= termWidth {
            72 | 			bestCols = numCols
            73 | 			break
            74 | 		}
            75 | 	}
            77 | 	colWidths := colWidthsFor(entries, bestCols)
            78 | 	numRows := (len(entries) + bestCols - 1) / bestCols
            80 | 	grid := make([][]string, numRows)
            81 | 	for r := range grid {
            82 | 		grid[r] = make([]string, 0, bestCols)
            83 | 	}
            84 | 	for i, entry := range entries {
            85 | 		r := i / bestCols
            86 | 		c := i % bestCols
            87 | 		grid[r] = append(grid[r], PadRight(entry, colWidths[c]))
            88 | 	}
            89 | 	return grid
            90 | }
            92 | // colWidthsFor computes the maximum display width per column for a row-major
            93 | // layout with numCols columns.
            94 | func colWidthsFor(entries []string, numCols int) []int {
            95 | 	widths := make([]int, numCols)
            96 | 	for i, entry := range entries {
            97 | 		c := i % numCols
            98 | 		if w := displayWidth(entry); w > widths[c] {
            99 | 			widths[c] = w
            100 | 		}
            101 | 	}
            102 | 	return widths
            103 | }
