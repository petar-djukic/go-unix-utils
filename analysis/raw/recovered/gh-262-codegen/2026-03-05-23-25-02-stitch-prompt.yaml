            225 | 				}
            226 | 			}
            227 | 			continue
            228 | 		}
            230 | 		// Not a flag — it's a filename.
            231 | 		files = append(files, arg)
            232 | 	}
            234 | 	// R1.1: when no flags are given, default to lines + words + bytes.
            235 | 	if !explicitFlags {
            236 | 		cfg.printLines = true
            237 | 		cfg.printWords = true
            238 | 		cfg.printBytes = true
            239 | 	}
