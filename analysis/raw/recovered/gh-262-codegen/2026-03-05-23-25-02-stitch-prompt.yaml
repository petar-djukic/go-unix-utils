            7 | //
            8 | // Implements: prd005-wc R1-R6
            9 | // Architecture: docs/ARCHITECTURE.yaml § cmd/
            10 | package main
            12 | import (
            13 | 	"bufio"
            14 | 	"fmt"
            15 | 	"io"
            16 | 	"os"
            17 | 	"os/signal"
            18 | 	"strings"
            19 | 	"syscall"
            20 | 	"unicode"
            21 | 	"unicode/utf8"
