          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main tests cmd/cat via differential tests against the GNU reference
            5 | // binary (gcat from Homebrew coreutils on macOS, or cat on Linux).
            6 | //
            7 | // Implements: prd006-cat R1-R5
            8 | // Test suite: docs/specs/test-suites/test-rel01.1.yaml
            9 | // Architecture: docs/ARCHITECTURE.yaml § pkg/testutils
            10 | package main
            12 | import (
            13 | 	"bytes"
            14 | 	"fmt"
            15 | 	"os"
            16 | 	"os/exec"
            17 | 	"path/filepath"
            18 | 	"runtime"
            19 | 	"testing"
            21 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            22 | )
            24 | // goCat is the absolute path to the Go cat binary, built by TestMain.
            25 | var goCat string
            27 | // refCat is the absolute path to the GNU reference binary, resolved in TestMain.
            28 | var refCat string
            30 | // TestMain builds the Go cat binary once and locates the GNU reference binary
            31 | // before running any test. It uses os.Exit(m.Run()) as required by the testing
            32 | // package when TestMain is defined.
            33 | func TestMain(m *testing.M) {
            34 | 	var err error
            35 | 	goCat, err = buildGoCat()
            36 | 	if err != nil {
            37 | 		fmt.Fprintf(os.Stderr, "build cmd/cat: %v\n", err)
            38 | 		os.Exit(1)
            39 | 	}
            40 | 	refCat = resolveRefCat()
            41 | 	os.Exit(m.Run())
            42 | }
            44 | // buildGoCat compiles cmd/cat into bin/cat under the project root and returns
            45 | // the absolute path to the binary.
            46 | func buildGoCat() (string, error) {
            47 | 	cwd, err := os.Getwd()
            48 | 	if err != nil {
            49 | 		return "", fmt.Errorf("getwd: %w", err)
            50 | 	}
            51 | 	binDir := filepath.Join(cwd, "..", "..", "bin")
            52 | 	if err := os.MkdirAll(binDir, 0o755); err != nil {
            53 | 		return "", fmt.Errorf("mkdir bin: %w", err)
            54 | 	}
            55 | 	binPath := filepath.Join(binDir, "cat")
            56 | 	cmd := exec.Command("go", "build", "-o", binPath, ".")
            57 | 	cmd.Stdout = os.Stderr
            58 | 	cmd.Stderr = os.Stderr
            59 | 	if err := cmd.Run(); err != nil {
            60 | 		return "", err
            61 | 	}
            62 | 	return binPath, nil
            63 | }
            65 | // resolveRefCat locates the GNU cat reference binary. On macOS, Homebrew
            66 | // installs it as gcat. On Linux, the system cat is GNU cat.
            67 | func resolveRefCat() string {
            68 | 	primary, fallback := "gcat", "cat"
            69 | 	if runtime.GOOS == "linux" {
            70 | 		primary, fallback = "cat", "gcat"
            71 | 	}
            72 | 	for _, name := range []string{primary, fallback} {
            73 | 		if path, err := exec.LookPath(name); err == nil {
            74 | 			return path
            75 | 		}
            76 | 	}
            77 | 	return primary // leave DiffTest.Run to fail with a useful diagnostic
            78 | }
            80 | // lcEnv returns the environment slice applied to every test case.
            81 | // LC_ALL=C is required by ARCHITECTURE.yaml DD6 to eliminate locale divergence.
            82 | func lcEnv() []string {
            83 | 	return []string{"LC_ALL=C"}
            84 | }
            86 | // writeFile creates path with the given content. It is a test helper that
            87 | // registers a cleanup for the containing test.
            88 | func writeFile(t *testing.T, path, content string) {
            89 | 	t.Helper()
            90 | 	if err := os.WriteFile(path, []byte(content), 0o644); err != nil {
            91 | 		t.Fatalf("writeFile %s: %v", path, err)
            92 | 	}
            93 | }
            95 | // allBytes returns a slice containing all 256 byte values in ascending order.
            96 | func allBytes() []byte {
            97 | 	b := make([]byte, 256)
            98 | 	for i := range b {
            99 | 		b[i] = byte(i)
            100 | 	}
            101 | 	return b
            102 | }
            104 | // TestCat is a table-driven test covering stdin-based cat behaviors for all
            105 | // flags defined in prd006-cat R1-R4. File-system-dependent cases are covered
            106 | // by separate test functions below.
            107 | func TestCat(t *testing.T) {
            108 | 	t.Parallel()
            110 | 	tests := []struct {
            111 | 		name       string
            112 | 		args       []string
            113 | 		stdin      []byte
            114 | 		wantExit   int
            115 | 		wantStdout []byte
            116 | 	}{
            117 | 		// R1.2: no file arguments — read from stdin.
            118 | 		{
            119 | 			name:       "stdin_no_args",
            120 | 			args:       nil,
            121 | 			stdin:      []byte("from stdin\n"),
            122 | 			wantExit:   0,
            123 | 			wantStdout: []byte("from stdin\n"),
            124 | 		},
            125 | 		// R1.2: "-" as a filename reads from stdin.
            126 | 		{
            127 | 			name:       "stdin_dash",
            128 | 			args:       []string{"-"},
            129 | 			stdin:      []byte("from stdin\n"),
            130 | 			wantExit:   0,
            131 | 			wantStdout: []byte("from stdin\n"),
            132 | 		},
            133 | 		// R1.4: binary input (all 256 byte values) passes through without corruption.
            134 | 		{
            135 | 			name:       "binary_passthrough",
            136 | 			args:       nil,
            137 | 			stdin:      allBytes(),
            138 | 			wantExit:   0,
            139 | 			wantStdout: allBytes(),
            140 | 		},
            141 | 		// R2.1: -n prepends a right-justified 6-wide line number followed by a tab
            142 | 		// to every output line, including blank lines. Line numbering starts at 1.
            143 | 		{
            144 | 			name:       "flag_n",
            145 | 			args:       []string{"-n"},
            146 | 			stdin:      []byte("alpha\n\nbeta\n"),
            147 | 			wantExit:   0,
            148 | 			wantStdout: []byte("     1\talpha\n     2\t\n     3\tbeta\n"),
            149 | 		},
            150 | 		// R2.2, R2.4: -b numbers only non-blank lines; blank lines (a line
            151 | 		// containing only a newline) receive no prefix.
            152 | 		{
            153 | 			name:       "flag_b",
            154 | 			args:       []string{"-b"},
            155 | 			stdin:      []byte("first\n\n\nsecond\n"),
            156 | 			wantExit:   0,
            157 | 			wantStdout: []byte("     1\tfirst\n\n\n     2\tsecond\n"),
            158 | 		},
            159 | 		// R2.3: when -b and -n are both given, -b takes precedence and blank
            160 | 		// lines are not numbered.
            161 | 		{
            162 | 			name:       "flag_bn_b_takes_precedence",
            163 | 			args:       []string{"-b", "-n"},
            164 | 			stdin:      []byte("one\n\ntwo\n"),
            165 | 			wantExit:   0,
            166 | 			wantStdout: []byte("     1\tone\n\n     2\ttwo\n"),
            167 | 		},
            168 | 		// R3.1: -s collapses consecutive blank lines to a single blank line.
            169 | 		{
            170 | 			name:       "flag_s",
            171 | 			args:       []string{"-s"},
            172 | 			stdin:      []byte("a\n\n\n\nb\n"),
            173 | 			wantExit:   0,
            174 | 			wantStdout: []byte("a\n\nb\n"),
            175 | 		},
            176 | 		// R3.3, R4.9: -n -s combined — squeeze is applied before numbering so
            177 | 		// suppressed blank lines do not consume line numbers.
            178 | 		{
            179 | 			name:       "flag_ns_combined",
            180 | 			args:       []string{"-n", "-s"},
            181 | 			stdin:      []byte("a\n\n\n\nb\n"),
            182 | 			wantExit:   0,
            183 | 			wantStdout: []byte("     1\ta\n     2\t\n     3\tb\n"),
            184 | 		},
            185 | 		// R4.1, R4.2: -v displays non-printing bytes with caret/M- notation.
            186 | 		// Tab (0x09) and newline (0x0A) are exempted and pass through unchanged.
            187 | 		// Input bytes: SOH(0x01) TAB(0x09) ESC(0x1B) DEL(0x7F) 0x80 0xFF
            188 | 		{
            189 | 			name:       "flag_v_nonprinting",
            190 | 			args:       []string{"-v"},
            191 | 			stdin:      []byte{0x01, 0x09, 0x1B, 0x7F, 0x80, 0xFF},
            192 | 			wantExit:   0,
            193 | 			wantStdout: []byte("^A\t^[^?M-^@M-^?"),
            194 | 		},
            195 | 		// R4.3: -E appends "$" before each newline in the output.
            196 | 		{
            197 | 			name:       "flag_E",
            198 | 			args:       []string{"-E"},
            199 | 			stdin:      []byte("line one\nline two\n"),
            200 | 			wantExit:   0,
            201 | 			wantStdout: []byte("line one$\nline two$\n"),
            202 | 		},
            203 | 		// R4.4: -T displays tab characters as the two-character sequence "^I".
            204 | 		{
            205 | 			name:       "flag_T",
            206 | 			args:       []string{"-T"},
            207 | 			stdin:      []byte("col1\tcol2\tcol3\n"),
            208 | 			wantExit:   0,
            209 | 			wantStdout: []byte("col1^Icol2^Icol3\n"),
            210 | 		},
            211 | 		// R4.5: -A is equivalent to -v -E -T combined.
            212 | 		{
            213 | 			name:       "flag_A",
            214 | 			args:       []string{"-A"},
            215 | 			stdin:      []byte{0x01, '\t', 'h', 'e', 'l', 'l', 'o', '\n'},
            216 | 			wantExit:   0,
            217 | 			wantStdout: []byte("^A^Ihello$\n"),
            218 | 		},
            219 | 		// R4.6: -e is equivalent to -v -E (show non-printing and show ends).
            220 | 		{
            221 | 			name:       "flag_e",
            222 | 			args:       []string{"-e"},
            223 | 			stdin:      []byte{0x01, 'h', 'e', 'l', 'l', 'o', '\n'},
            224 | 			wantExit:   0,
            225 | 			wantStdout: []byte("^Ahello$\n"),
            226 | 		},
            227 | 		// R4.7: -t is equivalent to -v -T (show non-printing and show tabs).
            228 | 		{
            229 | 			name:       "flag_t",
            230 | 			args:       []string{"-t"},
            231 | 			stdin:      []byte{0x01, '\t', 'h', 'e', 'l', 'l', 'o', '\n'},
            232 | 			wantExit:   0,
            233 | 			wantStdout: []byte("^A^Ihello\n"),
            234 | 		},
            235 | 		// R4.8: -u is accepted without error and has no effect on output.
            236 | 		{
            237 | 			name:       "flag_u_accepted",
            238 | 			args:       []string{"-u"},
            239 | 			stdin:      []byte("test\n"),
            240 | 			wantExit:   0,
            241 | 			wantStdout: []byte("test\n"),
            242 | 		},
            243 | 	}
            245 | 	for _, tc := range tests {
            246 | 		tc := tc
            247 | 		t.Run(tc.name, func(t *testing.T) {
            248 | 			t.Parallel()
            249 | 			testutils.DiffTest{
            250 | 				Args:       tc.args,
            251 | 				Stdin:      tc.stdin,
            252 | 				Env:        lcEnv(),
            253 | 				WantExit:   tc.wantExit,
            254 | 				WantStdout: tc.wantStdout,
            255 | 				WantStderr: nil,
            256 | 			}.Run(t, refCat, goCat)
            257 | 		})
            258 | 	}
            259 | }
            261 | // TestCatDefaultPassthrough verifies that a named file's content is written
            262 | // verbatim to stdout with no transformation (prd006-cat R1.1, R1.5).
            263 | func TestCatDefaultPassthrough(t *testing.T) {
            264 | 	t.Parallel()
            266 | 	dir := t.TempDir()
            267 | 	file1 := filepath.Join(dir, "file1.txt")
            268 | 	writeFile(t, file1, "hello\nworld\n")
            270 | 	testutils.DiffTest{
