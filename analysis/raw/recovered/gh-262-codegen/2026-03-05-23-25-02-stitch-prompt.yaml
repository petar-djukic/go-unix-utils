            107 | 	return data
            108 | }
            110 | // allBytes returns a slice containing all 256 byte values in ascending order.
            111 | func allBytes() []byte {
            112 | 	b := make([]byte, 256)
            113 | 	for i := range b {
            114 | 		b[i] = byte(i)
