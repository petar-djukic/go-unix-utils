          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import "fmt"
            8 | // HumanSizeOpts configures the unit convention used by HumanSize.
            9 | // Implements prd003-format R3.1.
            10 | type HumanSizeOpts struct {
            11 | 	// Binary selects 1024-based conversion with K/M/G/T/P/E suffixes when
            12 | 	// true. When false, SI 1000-based conversion with kB/MB/GB/TB suffixes
            13 | 	// is used.
            14 | 	Binary bool
            15 | }
            17 | // binarySuffixes lists the unit suffixes for 1024-based conversion.
            18 | var binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"} //nolint:gochecknoglobals
            20 | // siSuffixes lists the unit suffixes for 1000-based (SI) conversion.
            21 | var siSuffixes = []string{"", "kB", "MB", "GB", "TB"} //nolint:gochecknoglobals
            23 | // HumanSize converts bytes to a human-readable string using the chosen unit
            24 | // convention. A zero byte count always returns "0". Values below the first
            25 | // unit threshold are returned as a plain decimal integer with no suffix.
            26 | // Larger values are formatted with exactly one decimal place and the
            27 | // appropriate suffix, e.g., "1.5K" or "2.0MB", matching GNU coreutils
            28 | // human_readable() output.
            29 | //
            30 | // Implements prd003-format R3.1–R3.6.
            31 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            32 | 	// R3.4: zero always returns "0" regardless of unit mode.
            33 | 	if bytes == 0 {
            34 | 		return "0"
            35 | 	}
            37 | 	var base float64
            38 | 	var suffixes []string
            39 | 	if opts.Binary {
            40 | 		base = 1024
            41 | 		suffixes = binarySuffixes
            42 | 	} else {
            43 | 		base = 1000
            44 | 		suffixes = siSuffixes
            45 | 	}
            47 | 	value := float64(bytes)
            48 | 	idx := 0
            49 | 	for idx < len(suffixes)-1 && value >= base {
            50 | 		value /= base
            51 | 		idx++
            52 | 	}
            54 | 	if idx == 0 {
            55 | 		// Value is below the first threshold: return a plain integer.
            56 | 		return fmt.Sprintf("%d", bytes)
            57 | 	}
            58 | 	// R3.3: one decimal place for all suffixed values.
            59 | 	return fmt.Sprintf("%.1f%s", value, suffixes[idx])
            60 | }
