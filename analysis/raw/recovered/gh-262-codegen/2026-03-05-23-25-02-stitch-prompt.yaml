            51 | 	Info os.FileInfo
            52 | }
            54 | // TerminalWidth returns the current terminal column count by calling
            55 | // ioctl(TIOCGWINSZ) on stdout. Returns an error when stdout is not a
            56 | // terminal or when the ioctl fails.
            57 | // Implements prd002-sys R1.1, R1.2.
            58 | func TerminalWidth() (int, error) {
            59 | 	ws, err := unix.IoctlGetWinsize(int(os.Stdout.Fd()), unix.TIOCGWINSZ)
            60 | 	if err != nil {
            61 | 		return 0, fmt.Errorf("TerminalWidth: ioctl TIOCGWINSZ: %w", err)
            62 | 	}
            63 | 	return int(ws.Col), nil
            64 | }
            66 | // IsTerminal reports whether the file descriptor refers to a terminal.
            67 | // Returns false for pipes, regular files, and non-terminal descriptors.
            68 | // The implementation calls IoctlGetWinsize; a successful ioctl indicates a TTY.
            69 | // Implements prd002-sys R1.3.
            70 | func IsTerminal(fd uintptr) bool {
            71 | 	_, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            72 | 	return err == nil
