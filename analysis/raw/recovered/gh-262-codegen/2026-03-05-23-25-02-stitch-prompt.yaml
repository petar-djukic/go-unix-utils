            24 | // progName is the program name used in error diagnostics (R6.2).
            25 | const progName = "wc"
            27 | // totalMode controls when the totals line is printed (R3.3).
            28 | type totalMode int
            30 | const (
            31 | 	totalAuto   totalMode = iota // print total when more than one file (default)
            32 | 	totalAlways                  // always print total, even for one file
            33 | 	totalOnly                    // print only the total line, not per-file lines
            34 | 	totalNever                   // never print total
            35 | )
            37 | // counts holds the accumulated counts for a single input source.
            38 | type counts struct {
            39 | 	lines      int64
            40 | 	words      int64
            41 | 	bytes      int64
            42 | 	chars      int64
            43 | 	maxLineLen int64
            44 | }
            46 | // add returns the element-wise sum of c and other.
            47 | func (c counts) add(other counts) counts {
            48 | 	c.lines += other.lines
            49 | 	c.words += other.words
            50 | 	c.bytes += other.bytes
            51 | 	c.chars += other.chars
            52 | 	if other.maxLineLen > c.maxLineLen {
            53 | 		c.maxLineLen = other.maxLineLen
            54 | 	}
            55 | 	return c
            56 | }
            58 | // wcConfig holds the resolved flag settings for a single wc invocation.
            59 | type wcConfig struct {
            60 | 	printLines   bool
            61 | 	printWords   bool
            62 | 	printBytes   bool
            63 | 	printChars   bool
            64 | 	printMaxLen  bool
            65 | 	totalMode    totalMode
            66 | 	files0From   string // --files0-from=FILE; empty means not used
            67 | }
            69 | func main() {
            70 | 	// R6.3 / R5.1 equivalent: SIGPIPE handler so piping to head exits cleanly.
            71 | 	sigCh := make(chan os.Signal, 1)
            72 | 	signal.Notify(sigCh, syscall.SIGPIPE)
            73 | 	go func() {
            74 | 		<-sigCh
            75 | 		os.Exit(0)
            76 | 	}()
            78 | 	cfg, files := parseFlags()
            80 | 	exitCode := 0
            81 | 	var results []fileResult
            83 | 	for _, name := range files {
