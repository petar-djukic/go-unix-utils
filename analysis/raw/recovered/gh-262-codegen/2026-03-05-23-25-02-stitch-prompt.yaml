            274 | 		WantStdout: []byte("hello\nworld\n"),
            275 | 		WantStderr: nil,
            276 | 	}.Run(t, refCat, goCat)
            277 | }
            279 | // TestCatMultipleFiles verifies that multiple named files are concatenated in
            280 | // argument order with no separator (prd006-cat R1.1, R1.3).
            281 | func TestCatMultipleFiles(t *testing.T) {
            282 | 	t.Parallel()
            284 | 	dir := t.TempDir()
            285 | 	file1 := filepath.Join(dir, "file1.txt")
            286 | 	file2 := filepath.Join(dir, "file2.txt")
            287 | 	writeFile(t, file1, "aaa\n")
            288 | 	writeFile(t, file2, "bbb\n")
            290 | 	testutils.DiffTest{
            291 | 		Args:       []string{file1, file2},
            292 | 		Env:        lcEnv(),
            293 | 		WantExit:   0,
            294 | 		WantStdout: []byte("aaa\nbbb\n"),
            295 | 		WantStderr: nil,
            296 | 	}.Run(t, refCat, goCat)
            297 | }
            299 | // TestCatSqueezeBlanksAcrossFiles verifies that -s applies blank-squeezing
            300 | // across file boundaries when multiple files are concatenated (prd006-cat R3.2).
            301 | func TestCatSqueezeBlanksAcrossFiles(t *testing.T) {
            302 | 	t.Parallel()
            304 | 	dir := t.TempDir()
