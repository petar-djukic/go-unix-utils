            23 | // goSponge is the absolute path to the Go sponge binary, built by TestMain.
            24 | var goSponge string
            26 | // refSponge is the absolute path to the reference sponge binary.
            27 | var refSponge string
            29 | // refSpongeFound reports whether the reference binary was found on PATH.
            30 | var refSpongeFound bool
            32 | // TestMain builds the Go sponge binary once and locates the reference binary
            33 | // before running any test. It uses os.Exit(m.Run()) as required by the testing
            34 | // package when TestMain is defined.
            35 | func TestMain(m *testing.M) {
            36 | 	var err error
            37 | 	goSponge, err = buildGoSponge()
            38 | 	if err != nil {
            39 | 		fmt.Fprintf(os.Stderr, "build cmd/sponge: %v\n", err)
            40 | 		os.Exit(1)
            41 | 	}
            42 | 	refSponge, refSpongeFound = resolveRefSponge()
            43 | 	os.Exit(m.Run())
            44 | }
            46 | // buildGoSponge compiles cmd/sponge into bin/sponge under the project root and
            47 | // returns the absolute path to the binary.
            48 | func buildGoSponge() (string, error) {
            49 | 	cwd, err := os.Getwd()
            50 | 	if err != nil {
            51 | 		return "", fmt.Errorf("getwd: %w", err)
            52 | 	}
            53 | 	binDir := filepath.Join(cwd, "..", "..", "bin")
            54 | 	if err := os.MkdirAll(binDir, 0o755); err != nil {
            55 | 		return "", fmt.Errorf("mkdir bin: %w", err)
            56 | 	}
            57 | 	binPath := filepath.Join(binDir, "sponge")
            58 | 	cmd := exec.Command("go", "build", "-o", binPath, ".")
            59 | 	cmd.Stdout = os.Stderr
            60 | 	cmd.Stderr = os.Stderr
            61 | 	if err := cmd.Run(); err != nil {
            62 | 		return "", err
            63 | 	}
            64 | 	return binPath, nil
            65 | }
            67 | // resolveRefSponge locates the reference sponge binary via exec.LookPath.
            68 | // Returns the path and true if found, or empty string and false if not.
            69 | func resolveRefSponge() (string, bool) {
            70 | 	path, err := exec.LookPath("sponge")
            71 | 	if err != nil {
            72 | 		return "", false
            73 | 	}
            74 | 	return path, true
            75 | }
            77 | // skipIfNoRef skips the test when the reference sponge binary is not found.
            78 | func skipIfNoRef(t *testing.T) {
