            75 | // InstallSIGPIPEHandler installs a SIGPIPE handler that exits 0 when a
            76 | // downstream consumer closes stdout or stderr. Uses signal.Notify (not
            77 | // signal.Ignore) so that deferred cleanup functions do not run on SIGPIPE,
            78 | // matching GNU behavior. Safe to call multiple times; each call starts one
            79 | // goroutine.
            80 | // Implements prd002-sys R1.5, R1.6.
            81 | func InstallSIGPIPEHandler() {
            82 | 	// R1.5: buffered channel of size 1; goroutine exits the process on receive.
            83 | 	c := make(chan os.Signal, 1)
            84 | 	signal.Notify(c, syscall.SIGPIPE)
            85 | 	go func() {
            86 | 		<-c
            87 | 		os.Exit(0)
            88 | 	}()
            89 | }
            91 | // resizeMu guards resizeCallbacks.
            92 | var resizeMu sync.Mutex //nolint:gochecknoglobals
            94 | // resizeCallbacks holds all callbacks registered via OnTerminalResize.
            95 | var resizeCallbacks []func(width int) //nolint:gochecknoglobals
            97 | // resizeOnce ensures the SIGWINCH goroutine is started exactly once.
            98 | var resizeOnce sync.Once //nolint:gochecknoglobals
            100 | // OnTerminalResize registers callback to be called with the new terminal
            101 | // width whenever the terminal is resized (SIGWINCH). Supports multiple
            102 | // calls; each registered callback is invoked in registration order.
            103 | // Implements prd002-sys R3.1, R3.2.
            104 | func OnTerminalResize(callback func(width int)) {
            105 | 	resizeMu.Lock()
            106 | 	resizeCallbacks = append(resizeCallbacks, callback)
            107 | 	resizeMu.Unlock()
            109 | 	resizeOnce.Do(func() {
            110 | 		c := make(chan os.Signal, 1)
            111 | 		signal.Notify(c, syscall.SIGWINCH)
            112 | 		go func() {
            113 | 			for range c {
            114 | 				width, err := TerminalWidth()
            115 | 				if err != nil {
            116 | 					// R3.1: do not invoke callbacks when TerminalWidth fails.
            117 | 					continue
            118 | 				}
            119 | 				resizeMu.Lock()
            120 | 				cbs := make([]func(width int), len(resizeCallbacks))
            121 | 				copy(cbs, resizeCallbacks)
            122 | 				resizeMu.Unlock()
            123 | 				for _, cb := range cbs {
            124 | 					cb(width)
            125 | 				}
            126 | 			}
            127 | 		}()
            128 | 	})
            129 | }
