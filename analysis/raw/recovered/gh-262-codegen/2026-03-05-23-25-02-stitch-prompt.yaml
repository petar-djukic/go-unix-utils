            25 | // colorState holds the process-global color override.
            26 | // nil means automatic TTY detection; non-nil forces the given value.
            27 | // Guarded by process-global convention: only SetColorEnabled and
            28 | // ResetColorEnabled write this variable (prd003-format R2.6, R2.7).
            29 | var colorState *bool //nolint:gochecknoglobals
            31 | // isTerminalFn checks whether a file descriptor refers to a terminal.
            32 | // It is a variable so tests can replace it without calling os.Pipe.
            33 | var isTerminalFn = defaultIsTerminal //nolint:gochecknoglobals
            35 | // defaultIsTerminal reports whether fd is a character device (which covers
            36 | // all interactive terminal pseudo-devices on Linux and Darwin).
            37 | func defaultIsTerminal(fd uintptr) bool {
            38 | 	var stat syscall.Stat_t
            39 | 	if err := syscall.Fstat(int(fd), &stat); err != nil {
            40 | 		return false
            41 | 	}
            42 | 	return stat.Mode&syscall.S_IFMT == syscall.S_IFCHR
            43 | }
            45 | // SetColorEnabled overrides automatic TTY detection for the process.
            46 | // When enabled is true, FileTypeColor and Reset return ANSI sequences
            47 | // regardless of whether the output is a TTY (supports --color=always).
            48 | // When enabled is false, they return empty strings (supports --color=never).
            49 | // Implements prd003-format R2.6.
            50 | func SetColorEnabled(enabled bool) {
            51 | 	colorState = &enabled
            52 | }
            54 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting
            55 | // to automatic TTY detection via ColorEnabled. Utilities must call this in
            56 | // deferred cleanup or test teardown to avoid leaking state.
            57 | // Implements prd003-format R2.7.
            58 | func ResetColorEnabled() {
            59 | 	colorState = nil
            60 | }
            62 | // ColorEnabled reports whether color output is enabled for the given writer.
            63 | // If an override has been set by SetColorEnabled, that value is returned.
            64 | // Otherwise it returns true only when w is an *os.File whose file descriptor
            65 | // refers to a terminal.
            66 | // Implements prd003-format R2.3.
            67 | func ColorEnabled(w io.Writer) bool {
            68 | 	if colorState != nil {
            69 | 		return *colorState
            70 | 	}
            71 | 	f, ok := w.(*os.File)
            72 | 	if !ok {
            73 | 		return false
            74 | 	}
            75 | 	return isTerminalFn(f.Fd())
            76 | }
            78 | // colorActive reports whether color output is currently active, using
            79 | // os.Stdout for automatic detection when no override is set.
            80 | func colorActive() bool {
            81 | 	return ColorEnabled(os.Stdout)
            82 | }
            84 | // FileTypeColor returns the ANSI escape sequence for the file type described
            85 | // by mode. It returns an empty string when color is disabled.
            86 | // Color assignments match GNU ls LS_COLORS defaults (prd003-format R2.1, R2.4).
            87 | func FileTypeColor(mode os.FileMode) string {
            88 | 	if !colorActive() {
            89 | 		return ""
            90 | 	}
            91 | 	switch {
            92 | 	case mode&os.ModeDir != 0:
            93 | 		return ansiDir
            94 | 	case mode&os.ModeSymlink != 0:
            95 | 		return ansiLink
            96 | 	case mode&os.ModeDevice != 0 && mode&os.ModeCharDevice != 0:
            97 | 		return ansiCharDev
            98 | 	case mode&os.ModeDevice != 0:
            99 | 		return ansiBlockDev
            100 | 	case mode&os.ModeSocket != 0:
            101 | 		return ansiSocket
            102 | 	case mode&os.ModeNamedPipe != 0:
            103 | 		return ansiPipe
            104 | 	case mode&0o111 != 0:
            105 | 		// Regular file with any execute permission bit set.
            106 | 		return ansiExec
            107 | 	default:
            108 | 		// Regular file: return reset sequence (GNU ls code 0).
            109 | 		return ansiReset
            110 | 	}
            111 | }
            113 | // Reset returns the ANSI terminal reset sequence ("\033[0m") when color is
            114 | // active, and an empty string otherwise.
            115 | // Implements prd003-format R2.2.
            116 | func Reset() string {
            117 | 	if !colorActive() {
            118 | 		return ""
            119 | 	}
            120 | 	return ansiReset
            121 | }
