            18 | 	fi.Nlink = uint64(st.Nlink)
            19 | 	fi.Uid = st.Uid
            20 | 	fi.Gid = st.Gid
            21 | 	fi.Rdev = uint64(st.Rdev)
            22 | 	fi.Dev = uint64(st.Dev)
            23 | 	fi.Ino = st.Ino
            24 | 	fi.Blocks = st.Blocks
            25 | 	fi.Blksize = int64(st.Blksize)
            26 | 	// R2.3: Darwin uses Mtimespec (not Mtim as on Linux).
