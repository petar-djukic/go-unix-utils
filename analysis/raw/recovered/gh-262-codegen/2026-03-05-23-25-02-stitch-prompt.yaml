            264 | }
            266 | // readFiles0From reads NUL-delimited filenames from the given path.
            267 | // When path is "-", filenames are read from stdin (R4.4).
            268 | func readFiles0From(path string) ([]string, error) {
            269 | 	var r io.Reader
            270 | 	if path == "-" {
            271 | 		r = os.Stdin
            272 | 	} else {
            273 | 		f, err := os.Open(path)
            274 | 		if err != nil {
            275 | 			return nil, fmt.Errorf("cannot open '%s' for reading: %w", path, sysErr(err))
            276 | 		}
            277 | 		defer func() { _ = f.Close() }() // best-effort cleanup
            278 | 		r = f
            279 | 	}
            281 | 	data, err := io.ReadAll(r)
            282 | 	if err != nil {
            283 | 		return nil, fmt.Errorf("reading files0-from: %w", err)
            284 | 	}
            286 | 	var files []string
            287 | 	for _, name := range strings.Split(string(data), "\x00") {
            288 | 		if name != "" {
            289 | 			files = append(files, name)
            290 | 		}
            291 | 	}
            292 | 	return files, nil
            293 | }
            295 | // countInput reads an input source and returns its counts.
            296 | // When name is "-" or "", stdin is read (R4.1).
            297 | func countInput(name string) (counts, error) {
            298 | 	var r io.Reader
            299 | 	if name == "-" || name == "" {
            300 | 		r = os.Stdin
            301 | 	} else {
            302 | 		f, err := os.Open(name)
            303 | 		if err != nil {
            304 | 			return counts{}, err
            305 | 		}
            306 | 		defer func() { _ = f.Close() }() // best-effort cleanup
            307 | 		r = f
            308 | 	}
            309 | 	return countReader(r)
            310 | }
            312 | // countReader counts lines, words, bytes, characters, and max line length
            313 | // from r in a single pass. A word is a maximal sequence of non-whitespace
            314 | // characters (R2.2). Line length is measured with tab expansion to the next
            315 | // multiple of 8 (R2.5).
            316 | func countReader(r io.Reader) (counts, error) {
            317 | 	var c counts
            318 | 	br := bufio.NewReader(r)
            319 | 	inWord := false
            320 | 	var lineLen int64
            322 | 	for {
            323 | 		buf := make([]byte, 32*1024)
            324 | 		n, err := br.Read(buf)
            325 | 		buf = buf[:n]
            326 | 		c.bytes += int64(n)
            328 | 		i := 0
            329 | 		for i < len(buf) {
            330 | 			ru, size := utf8.DecodeRune(buf[i:])
            331 | 			if ru == utf8.RuneError && size == 1 {
            332 | 				// R2.4: invalid byte counts as one character.
            333 | 				c.chars++
            334 | 				if inWord {
            335 | 					// Invalid byte is not whitespace; stay in word.
            336 | 				} else {
            337 | 					inWord = true
            338 | 					c.words++
            339 | 				}
            340 | 				lineLen++
            341 | 				i++
            342 | 				continue
            343 | 			}
            345 | 			c.chars++
            347 | 			if ru == '\n' {
            348 | 				c.lines++
            349 | 				if inWord {
            350 | 					inWord = false
            351 | 				}
            352 | 				// R2.5: end of line — check max.
            353 | 				if lineLen > c.maxLineLen {
            354 | 					c.maxLineLen = lineLen
            355 | 				}
            356 | 				lineLen = 0
            357 | 			} else if ru == '\t' {
            358 | 				// R2.5: tab advances to next multiple of 8.
            359 | 				lineLen = (lineLen/8 + 1) * 8
            360 | 				if inWord {
            361 | 					inWord = false
            362 | 				}
            363 | 			} else if unicode.IsSpace(ru) {
            364 | 				if inWord {
            365 | 					inWord = false
            366 | 				}
            367 | 				lineLen++
            368 | 			} else {
            369 | 				if !inWord {
            370 | 					inWord = true
            371 | 					c.words++
            372 | 				}
            373 | 				lineLen++
            374 | 			}
            376 | 			i += size
            377 | 		}
            379 | 		if err == io.EOF {
            380 | 			break
            381 | 		}
            382 | 		if err != nil {
            383 | 			return c, err
            384 | 		}
            385 | 	}
            387 | 	// R2.5: handle last line if it didn't end with newline.
            388 | 	if lineLen > c.maxLineLen {
            389 | 		c.maxLineLen = lineLen
            390 | 	}
            392 | 	return c, nil
            393 | }
            395 | // numberWidth returns the minimum field width for printing counts.
            396 | // It is the number of decimal digits in the largest count that will be printed,
            397 | // matching GNU wc's dynamic column-width behavior (R3.1).
            398 | func numberWidth(total counts, cfg wcConfig) int {
            399 | 	maxVal := int64(0)
            400 | 	if cfg.printLines && total.lines > maxVal {
            401 | 		maxVal = total.lines
            402 | 	}
            403 | 	if cfg.printWords && total.words > maxVal {
            404 | 		maxVal = total.words
            405 | 	}
            406 | 	if cfg.printBytes && total.bytes > maxVal {
            407 | 		maxVal = total.bytes
            408 | 	}
            409 | 	if cfg.printChars && total.chars > maxVal {
            410 | 		maxVal = total.chars
            411 | 	}
            412 | 	if cfg.printMaxLen && total.maxLineLen > maxVal {
            413 | 		maxVal = total.maxLineLen
            414 | 	}
            415 | 	w := 1
            416 | 	for maxVal >= 10 {
            417 | 		maxVal /= 10
            418 | 		w++
            419 | 	}
            420 | 	return w
            421 | }
            423 | // printCounts writes one output line with the requested counts and filename.
            424 | // Counts are right-justified to width columns (R3.1). The filename is omitted
            425 | // when name is "-" and it's the only input (stdin with no filename) (R1.3).
            426 | func printCounts(c counts, name string, width int, cfg wcConfig) {
            427 | 	var parts []string
            429 | 	if cfg.printLines {
            430 | 		parts = append(parts, fmt.Sprintf("%*d", width, c.lines))
            431 | 	}
            432 | 	if cfg.printWords {
            433 | 		parts = append(parts, fmt.Sprintf("%*d", width, c.words))
            434 | 	}
            435 | 	if cfg.printChars {
            436 | 		parts = append(parts, fmt.Sprintf("%*d", width, c.chars))
            437 | 	}
            438 | 	if cfg.printBytes {
            439 | 		parts = append(parts, fmt.Sprintf("%*d", width, c.bytes))
            440 | 	}
            441 | 	if cfg.printMaxLen {
            442 | 		parts = append(parts, fmt.Sprintf("%*d", width, c.maxLineLen))
            443 | 	}
            445 | 	line := strings.Join(parts, " ")
            447 | 	// R1.3: append filename. For stdin with no file arguments,
            448 | 	// the filename is omitted. For explicit "-" argument, the label is "-".
            449 | 	if name == "" {
            450 | 		fmt.Println(line)
            451 | 	} else {
            452 | 		fmt.Printf("%s %s\n", line, name)
            453 | 	}
            454 | }
            456 | // sysErr extracts the underlying system error from an os.PathError for
            457 | // cleaner diagnostic messages matching GNU wc format.
            458 | func sysErr(err error) error {
            459 | 	if pe, ok := err.(*os.PathError); ok { //nolint:errorlint
            460 | 		return pe.Err
            461 | 	}
            462 | 	return err
            463 | }
