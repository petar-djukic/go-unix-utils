            89 | 			// processing remaining files.
            90 | 			continue
            91 | 		}
            92 | 		results = append(results, fileResult{name: name, counts: c})
            93 | 	}
            94 | 	numArgs := len(files)
            96 | 	// Compute totals.
            97 | 	var total counts
            98 | 	for _, r := range results {
            99 | 		total = total.add(r.counts)
            100 | 	}
            102 | 	// Determine column width from the largest count that will be printed.
            103 | 	width := numberWidth(total, cfg)
            105 | 	// Print per-file lines unless --total=only.
            106 | 	if cfg.totalMode != totalOnly {
            107 | 		for _, r := range results {
            108 | 			printCounts(r.counts, r.name, width, cfg)
            109 | 		}
            110 | 	}
            112 | 	// Print total line per R3.3.
            113 | 	showTotal := false
            114 | 	switch cfg.totalMode {
            115 | 	case totalAuto:
            116 | 		showTotal = numArgs > 1
            117 | 	case totalAlways:
            118 | 		showTotal = true
            119 | 	case totalOnly:
            120 | 		showTotal = true
            121 | 	case totalNever:
            122 | 		showTotal = false
            123 | 	}
            124 | 	if showTotal {
            125 | 		printCounts(total, "total", width, cfg)
            126 | 	}
            128 | 	os.Exit(exitCode)
            129 | }
            131 | // fileResult pairs a filename with its counts.
            132 | type fileResult struct {
            133 | 	name   string
            134 | 	counts counts
            135 | }
            137 | // parseFlags parses command-line arguments manually to support GNU-style long
            138 | // flags (--total=VALUE, --files0-from=FILE) alongside single-character flags.
            139 | // Go's flag package does not support --key=value syntax natively, so we parse
            140 | // by hand to match GNU wc flag behavior.
            141 | func parseFlags() (wcConfig, []string) {
            142 | 	cfg := wcConfig{}
            143 | 	var files []string
            144 | 	explicitFlags := false
            146 | 	args := os.Args[1:]
            147 | 	for i := 0; i < len(args); i++ {
            148 | 		arg := args[i]
            150 | 		// "--" terminates flag parsing.
            151 | 		if arg == "--" {
            152 | 			files = append(files, args[i+1:]...)
            153 | 			break
            154 | 		}
            156 | 		// Long flags.
            157 | 		if strings.HasPrefix(arg, "--") {
            158 | 			if strings.HasPrefix(arg, "--total=") {
            159 | 				val := arg[len("--total="):]
            160 | 				switch val {
            161 | 				case "auto":
            162 | 					cfg.totalMode = totalAuto
            163 | 				case "always":
            164 | 					cfg.totalMode = totalAlways
            165 | 				case "only":
            166 | 					cfg.totalMode = totalOnly
            167 | 				case "never":
            168 | 					cfg.totalMode = totalNever
            169 | 				default:
            170 | 					fmt.Fprintf(os.Stderr, "%s: invalid argument '%s' for '--total'\n", progName, val)
            171 | 					os.Exit(1)
            172 | 				}
            173 | 				continue
            174 | 			}
            175 | 			if strings.HasPrefix(arg, "--files0-from=") {
            176 | 				cfg.files0From = arg[len("--files0-from="):]
            177 | 				continue
            178 | 			}
            179 | 			// Long flag aliases.
            180 | 			switch arg {
            181 | 			case "--lines":
            182 | 				cfg.printLines = true
            183 | 				explicitFlags = true
            184 | 			case "--words":
            185 | 				cfg.printWords = true
            186 | 				explicitFlags = true
            187 | 			case "--bytes":
            188 | 				cfg.printBytes = true
            189 | 				explicitFlags = true
            190 | 			case "--chars":
            191 | 				cfg.printChars = true
            192 | 				explicitFlags = true
            193 | 			case "--max-line-length":
            194 | 				cfg.printMaxLen = true
            195 | 				explicitFlags = true
            196 | 			default:
            197 | 				fmt.Fprintf(os.Stderr, "%s: unrecognized option '%s'\n", progName, arg)
            198 | 				os.Exit(1)
            199 | 			}
            200 | 			continue
            201 | 		}
            203 | 		// Short flags (may be combined: -lwc).
            204 | 		if len(arg) > 1 && arg[0] == '-' {
            205 | 			for _, ch := range arg[1:] {
            206 | 				switch ch {
            207 | 				case 'l':
            208 | 					cfg.printLines = true
            209 | 					explicitFlags = true
            210 | 				case 'w':
            211 | 					cfg.printWords = true
            212 | 					explicitFlags = true
            213 | 				case 'c':
            214 | 					cfg.printBytes = true
            215 | 					explicitFlags = true
            216 | 				case 'm':
            217 | 					cfg.printChars = true
            218 | 					explicitFlags = true
            219 | 				case 'L':
            220 | 					cfg.printMaxLen = true
            221 | 					explicitFlags = true
            222 | 				default:
            223 | 					fmt.Fprintf(os.Stderr, "%s: invalid option -- '%c'\n", progName, ch)
