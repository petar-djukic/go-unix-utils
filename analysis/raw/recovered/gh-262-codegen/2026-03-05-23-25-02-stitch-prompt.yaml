            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the cmd/sponge binary.
            5 | // Reads all of stdin into a buffer before writing any output, making the
            6 | // idiom "cmd file | sponge file" safe. Supports append mode (-a) and
            7 | // passthrough mode (no output filename).
            8 | //
            9 | // Implements: prd007-sponge R1-R5
            10 | // Architecture: docs/ARCHITECTURE.yaml § cmd/
            11 | package main
            13 | import (
            14 | 	"flag"
            15 | 	"fmt"
            16 | 	"io"
            17 | 	"os"
            18 | 	"os/signal"
            19 | 	"path/filepath"
            20 | 	"sync"
            21 | 	"syscall"
            22 | )
            24 | const (
            25 | 	// defaultFileMode is applied to new output files masked by umask (R2.3).
            26 | 	defaultFileMode os.FileMode = 0o666
            28 | 	// tempPattern is the temp file name pattern matching sponge.c mkstemp (R1.4).
            29 | 	tempPattern = "sponge.*"
            30 | )
            32 | // cleanupMu guards cleanupFile against concurrent access from the signal
            33 | // handler goroutine and the main goroutine (R1.5).
            34 | var cleanupMu sync.Mutex //nolint:gochecknoglobals
            36 | // cleanupFile is the path to the temp file that must be removed on exit (R1.5).
            37 | var cleanupFile string //nolint:gochecknoglobals
            39 | // registerCleanup records a temp file path for signal-handler cleanup (R1.5).
            40 | func registerCleanup(path string) {
            41 | 	cleanupMu.Lock()
            42 | 	cleanupFile = path
            43 | 	cleanupMu.Unlock()
            44 | }
            46 | // clearCleanup removes the registered cleanup path after a successful rename.
            47 | func clearCleanup() {
            48 | 	cleanupMu.Lock()
            49 | 	cleanupFile = ""
            50 | 	cleanupMu.Unlock()
            51 | }
            53 | // doCleanup removes the registered temp file if one exists.
            54 | func doCleanup() {
            55 | 	cleanupMu.Lock()
            56 | 	path := cleanupFile
            57 | 	cleanupFile = ""
            58 | 	cleanupMu.Unlock()
            59 | 	if path != "" {
            60 | 		_ = os.Remove(path) // best-effort cleanup
            61 | 	}
            62 | }
            64 | func main() {
            65 | 	// R1.5: Install signal handler to clean up temp file on SIGINT, SIGTERM,
            66 | 	// SIGHUP, or SIGPIPE before the rename completes.
            67 | 	sigCh := make(chan os.Signal, 1)
            68 | 	signal.Notify(sigCh, syscall.SIGINT, syscall.SIGTERM, syscall.SIGHUP, syscall.SIGPIPE)
            69 | 	go func() {
            70 | 		<-sigCh
            71 | 		doCleanup()
            72 | 		os.Exit(1)
            73 | 	}()
            75 | 	var appendMode bool
            76 | 	flag.BoolVar(&appendMode, "a", false, "append stdin to file")
            77 | 	flag.Parse()
            79 | 	args := flag.Args()
            80 | 	var outPath string
            81 | 	if len(args) > 0 {
            82 | 		outPath = args[0]
            83 | 	}
            85 | 	// R1.1, R1.2: Read all bytes from stdin before opening the output file.
            86 | 	data, err := io.ReadAll(os.Stdin)
            87 | 	if err != nil {
            88 | 		fmt.Fprintf(os.Stderr, "sponge: read error: %v\n", err)
            89 | 		os.Exit(1)
            90 | 	}
            92 | 	if outPath == "" {
            93 | 		// R4.1, R4.3: Passthrough mode — write buffered stdin to stdout.
            94 | 		if _, err := os.Stdout.Write(data); err != nil {
            95 | 			fmt.Fprintf(os.Stderr, "sponge: write error: %v\n", err)
            96 | 			os.Exit(1)
            97 | 		}
            98 | 		return
            99 | 	}
            101 | 	// R2: Write buffered content to the named output file.
            102 | 	if err := writeToFile(outPath, data, appendMode); err != nil {
            103 | 		fmt.Fprintf(os.Stderr, "sponge: %v\n", err)
            104 | 		os.Exit(1)
            105 | 	}
            106 | }
            108 | // writeToFile writes data to outPath via a temp file and atomic rename.
            109 | // When appendMode is true and outPath exists, the original file content is
            110 | // prepended to data (R3.1). File permissions are preserved via lstat (R2.3, R2.4).
            111 | func writeToFile(outPath string, data []byte, appendMode bool) error {
            112 | 	// R2.3, R2.4: Read existing file permissions via lstat.
            113 | 	mode := defaultFileMode
            114 | 	info, err := os.Lstat(outPath)
            115 | 	fileExists := err == nil
            117 | 	if fileExists && info.Mode().IsRegular() {
            118 | 		mode = info.Mode().Perm()
            119 | 	}
            121 | 	// R3.1, R3.3: In append mode, prepend the original file content.
            122 | 	if appendMode && fileExists {
            123 | 		original, err := os.ReadFile(outPath)
            124 | 		if err != nil {
            125 | 			return fmt.Errorf("reading %s for append: %w", outPath, err)
            126 | 		}
            127 | 		combined := make([]byte, 0, len(original)+len(data))
            128 | 		combined = append(combined, original...)
            129 | 		combined = append(combined, data...)
            130 | 		data = combined
            131 | 	}
            133 | 	// R2.1: Create temp file in the output directory for atomic rename.
            134 | 	dir := filepath.Dir(outPath)
            135 | 	tmpFile, err := os.CreateTemp(dir, tempPattern)
            136 | 	if err != nil {
            137 | 		return fmt.Errorf("creating temp file: %w", err)
            138 | 	}
            139 | 	tmpPath := tmpFile.Name()
            141 | 	// R1.5: Register for signal cleanup.
            142 | 	registerCleanup(tmpPath)
            144 | 	// Write content to temp file.
            145 | 	if _, err := tmpFile.Write(data); err != nil {
            146 | 		_ = tmpFile.Close() // best-effort cleanup
            147 | 		doCleanup()
            148 | 		return fmt.Errorf("writing temp file: %w", err)
            149 | 	}
            150 | 	if err := tmpFile.Close(); err != nil {
            151 | 		doCleanup()
            152 | 		return fmt.Errorf("closing temp file: %w", err)
            153 | 	}
            155 | 	// R2.3: Apply original file permissions to temp file.
            156 | 	if err := os.Chmod(tmpPath, mode); err != nil {
            157 | 		doCleanup()
            158 | 		return fmt.Errorf("setting permissions: %w", err)
            159 | 	}
            161 | 	// R2.1: Attempt atomic rename.
            162 | 	if err := os.Rename(tmpPath, outPath); err != nil {
            163 | 		// R2.2: Rename failed (e.g., cross-device); fall back to copy.
            164 | 		if cpErr := copyFile(tmpPath, outPath, mode); cpErr != nil {
            165 | 			doCleanup()
            166 | 			return fmt.Errorf("writing %s: %w", outPath, cpErr)
            167 | 		}
            168 | 		doCleanup()
            169 | 		return nil
            170 | 	}
            172 | 	// Rename succeeded; clear cleanup registration.
            173 | 	clearCleanup()
            174 | 	return nil
            175 | }
            177 | // copyFile copies the contents of src to dst with the given permissions.
            178 | // Used as a fallback when os.Rename fails across device boundaries (R2.2).
            179 | func copyFile(src, dst string, mode os.FileMode) error {
            180 | 	in, err := os.Open(src)
            181 | 	if err != nil {
            182 | 		return err
            183 | 	}
            184 | 	defer func() { _ = in.Close() }() // best-effort cleanup
            186 | 	out, err := os.OpenFile(dst, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, mode)
            187 | 	if err != nil {
            188 | 		return err
            189 | 	}
            191 | 	_, err = io.Copy(out, in)
            192 | 	if cerr := out.Close(); cerr != nil && err == nil {
            193 | 		err = cerr
            194 | 	}
            195 | 	return err
            196 | }
