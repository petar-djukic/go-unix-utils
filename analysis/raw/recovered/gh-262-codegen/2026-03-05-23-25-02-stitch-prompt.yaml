            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the cmd/cat binary.
            5 | // Concatenates files (or stdin) to stdout with optional line numbering,
            6 | // blank-line squeezing, and non-printing character display.
            7 | //
            8 | // Implements: prd006-cat R1-R5
            9 | // Architecture: docs/ARCHITECTURE.yaml § cmd/
            10 | package main
            12 | import (
            13 | 	"bufio"
            14 | 	"flag"
            15 | 	"fmt"
            16 | 	"io"
            17 | 	"os"
            18 | 	"os/signal"
            19 | 	"syscall"
            20 | )
            22 | // catConfig holds the resolved transformation settings for a single cat invocation.
            23 | // Alias flags (-A, -e, -t) are expanded into their component fields before construction.
            24 | type catConfig struct {
            25 | 	number          bool // -n: number all output lines (R2.1)
            26 | 	numberNonblank  bool // -b: number non-blank lines only; overrides -n (R2.2, R2.3)
            27 | 	squeezeBlank    bool // -s: suppress repeated blank lines (R3.1)
            28 | 	showNonprinting bool // -v: caret/M- notation for non-printing bytes (R4.1)
            29 | 	showEnds        bool // -E: append $ before each newline (R4.3)
            30 | 	showTabs        bool // -T: display tab as ^I (R4.4)
            31 | }
            33 | // catProcessor holds per-invocation mutable state shared across all file operands.
            34 | type catProcessor struct {
            35 | 	cfg       catConfig
            36 | 	lineNum   int  // 1-based line counter; resets only per invocation, not per file (R2.1)
            37 | 	prevBlank bool // true when the last written line was blank; enables -s across file boundaries (R3.2)
            38 | }
            40 | // newCatProcessor creates a catProcessor with lineNum initialized to 1.
            41 | func newCatProcessor(cfg catConfig) *catProcessor {
            42 | 	return &catProcessor{cfg: cfg, lineNum: 1}
            43 | }
            45 | // needsTransform reports whether any transformation flag is active.
            46 | // Returns false only when output is a verbatim byte-for-byte copy of input (R1.4).
            47 | func (p *catProcessor) needsTransform() bool {
            48 | 	return p.cfg.number || p.cfg.numberNonblank || p.cfg.squeezeBlank ||
            49 | 		p.cfg.showNonprinting || p.cfg.showEnds || p.cfg.showTabs
            50 | }
            52 | // processReader reads from r and writes to w, applying all active transformations.
            53 | // State (lineNum, prevBlank) persists across calls so successive file operands
            54 | // share line-numbering and blank-squeezing context (R2.1, R3.2).
            55 | func (p *catProcessor) processReader(r io.Reader, w *bufio.Writer) error {
            56 | 	if !p.needsTransform() {
            57 | 		// R1.4: fast path — byte-for-byte copy with no transformation.
            58 | 		_, err := io.Copy(w, r)
            59 | 		return err
            60 | 	}
            62 | 	br := bufio.NewReader(r)
            63 | 	for {
            64 | 		line, err := br.ReadBytes('\n')
            65 | 		if len(line) > 0 {
            66 | 			hasNewline := line[len(line)-1] == '\n'
            67 | 			content := line
            68 | 			if hasNewline {
            69 | 				content = line[:len(line)-1]
            70 | 			}
            71 | 			if werr := p.writeLine(content, hasNewline, w); werr != nil {
            72 | 				return werr
            73 | 			}
            74 | 		}
            75 | 		if err == io.EOF {
            76 | 			return nil
            77 | 		}
            78 | 		if err != nil {
            79 | 			return err
            80 | 		}
            81 | 	}
            82 | }
            84 | // writeLine applies all active transformations to one logical line and writes it to w.
            85 | // Transformations are applied in the order specified by R4.9:
            86 | // squeeze → non-printing/tab display → end-of-line marker → line number prefix.
            87 | //
            88 | // content holds the line bytes without the trailing newline.
            89 | // hasNewline reports whether the original input line had a trailing newline.
            90 | func (p *catProcessor) writeLine(content []byte, hasNewline bool, w *bufio.Writer) error {
            91 | 	isBlank := len(content) == 0 && hasNewline
            93 | 	// R3.1: discard the second and subsequent consecutive blank lines.
            94 | 	if p.cfg.squeezeBlank && isBlank && p.prevBlank {
            95 | 		return nil
            96 | 	}
            98 | 	// R2.1, R2.2, R2.3: write line number prefix.
            99 | 	// -b takes precedence over -n; blank lines are not numbered when -b is active.
            100 | 	if p.cfg.numberNonblank {
            101 | 		if !isBlank {
            102 | 			if _, err := fmt.Fprintf(w, "%6d\t", p.lineNum); err != nil {
            103 | 				return err
            104 | 			}
            105 | 			p.lineNum++
            106 | 		}
            107 | 	} else if p.cfg.number {
            108 | 		if _, err := fmt.Fprintf(w, "%6d\t", p.lineNum); err != nil {
            109 | 			return err
            110 | 		}
            111 | 		p.lineNum++
            112 | 	}
            114 | 	// Write content bytes with -v and -T transformations applied per byte.
            115 | 	for _, b := range content {
            116 | 		if err := p.writeTransformedByte(b, w); err != nil {
            117 | 			return err
            118 | 		}
            119 | 	}
            121 | 	// R4.3: append $ before the newline.
            122 | 	if hasNewline && p.cfg.showEnds {
            123 | 		if err := w.WriteByte('$'); err != nil {
            124 | 			return err
            125 | 		}
            126 | 	}
            128 | 	if hasNewline {
            129 | 		if err := w.WriteByte('\n'); err != nil {
            130 | 			return err
            131 | 		}
            132 | 	}
            134 | 	p.prevBlank = isBlank
            135 | 	return nil
            136 | }
            138 | // writeTransformedByte writes b to w, applying -T (R4.4) before -v (R4.1) so that
            139 | // tab handling is correct: with only -v active, tabs pass through unchanged (R4.2).
            140 | func (p *catProcessor) writeTransformedByte(b byte, w *bufio.Writer) error {
            141 | 	// R4.4: display tab as two-character sequence ^I when -T is active.
            142 | 	if b == '\t' && p.cfg.showTabs {
            143 | 		_, err := w.WriteString("^I")
            144 | 		return err
            145 | 	}
            147 | 	if p.cfg.showNonprinting {
            148 | 		switch {
            149 | 		case b == 0x7F:
            150 | 			// DEL -> ^? (R4.1)
            151 | 			_, err := w.WriteString("^?")
            152 | 			return err
            153 | 		case b < 0x20 && b != '\t':
            154 | 			// Control character (not tab): ^X where X = b+64 (R4.1).
            155 | 			// Newline (0x0A) is never present in content; only 0x00–0x1F
            156 | 			// excluding tab reaches this branch.
            157 | 			_, err := w.Write([]byte{'^', b + 64})
            158 | 			return err
            159 | 		case b >= 0x80 && b <= 0x9F:
            160 | 			// High control: M-^X where X = (b−0x80)+64 (R4.1).
            161 | 			_, err := w.Write([]byte{'M', '-', '^', b - 0x80 + 64})
            162 | 			return err
            163 | 		case b >= 0xA0 && b <= 0xFE:
            164 | 			// High printable: M-X where X = b−0x80 (R4.1).
            165 | 			_, err := w.Write([]byte{'M', '-', b - 0x80})
            166 | 			return err
            167 | 		case b == 0xFF:
            168 | 			// 0xFF -> M-^? (R4.1)
            169 | 			_, err := w.WriteString("M-^?")
            170 | 			return err
            171 | 		}
            172 | 	}
            174 | 	return w.WriteByte(b)
            175 | }
            177 | // processOperand processes one file operand. When operand is "-", stdin is read.
            178 | // On file open failure, the error is returned; the caller writes the diagnostic
            179 | // and continues with the next operand (R5.2).
            180 | func processOperand(proc *catProcessor, operand string, w *bufio.Writer) error {
            181 | 	if operand == "-" {
            182 | 		return proc.processReader(os.Stdin, w)
            183 | 	}
            184 | 	f, err := os.Open(operand)
            185 | 	if err != nil {
            186 | 		return err
            187 | 	}
            188 | 	defer func() {
            189 | 		_ = f.Close() // best-effort cleanup, error ignored
            190 | 	}()
            191 | 	return proc.processReader(f, w)
            192 | }
            194 | func main() {
            195 | 	// R5.4: install SIGPIPE handler so downstream pipe close exits 0, not nonzero.
            196 | 	// signal.Notify is used rather than signal.Ignore so that deferred functions
            197 | 	// do not run on SIGPIPE, matching GNU cat behavior.
            198 | 	sigCh := make(chan os.Signal, 1)
            199 | 	signal.Notify(sigCh, syscall.SIGPIPE)
            200 | 	go func() {
            201 | 		<-sigCh
            202 | 		os.Exit(0)
            203 | 	}()
            205 | 	// Define flags per prd006-cat R2, R3, R4.
            206 | 	var (
            207 | 		flagNumber     bool // -n
            208 | 		flagNonblank   bool // -b
            209 | 		flagSqueeze    bool // -s
            210 | 		flagShowVis    bool // -v
            211 | 		flagShowEnds   bool // -E
            212 | 		flagShowTabs   bool // -T
            213 | 		flagShowAll    bool // -A = -v -E -T (R4.5)
            214 | 		flagVisEnds    bool // -e = -v -E   (R4.6)
            215 | 		flagVisTabs    bool // -t = -v -T   (R4.7)
            216 | 		flagUnbuffered bool // -u: accepted, silently ignored (R4.8)
            217 | 	)
            219 | 	flag.BoolVar(&flagNumber, "n", false, "number all output lines")
            220 | 	flag.BoolVar(&flagNonblank, "b", false, "number non-blank output lines")
            221 | 	flag.BoolVar(&flagSqueeze, "s", false, "suppress repeated empty output lines")
            222 | 	flag.BoolVar(&flagShowVis, "v", false, "use caret and M- notation for non-printing characters")
            223 | 	flag.BoolVar(&flagShowEnds, "E", false, "display $ at end of each line")
            224 | 	flag.BoolVar(&flagShowTabs, "T", false, "display TAB characters as ^I")
            225 | 	flag.BoolVar(&flagShowAll, "A", false, "equivalent to -v -E -T")
            226 | 	flag.BoolVar(&flagVisEnds, "e", false, "equivalent to -v -E")
            227 | 	flag.BoolVar(&flagVisTabs, "t", false, "equivalent to -v -T")
            228 | 	flag.BoolVar(&flagUnbuffered, "u", false, "(ignored)")
            230 | 	flag.Parse()
            232 | 	// Expand alias flags into their component fields (R4.5, R4.6, R4.7).
            233 | 	cfg := catConfig{
            234 | 		number:          flagNumber,
            235 | 		numberNonblank:  flagNonblank,
            236 | 		squeezeBlank:    flagSqueeze,
            237 | 		showNonprinting: flagShowVis || flagShowAll || flagVisEnds || flagVisTabs,
            238 | 		showEnds:        flagShowEnds || flagShowAll || flagVisEnds,
            239 | 		showTabs:        flagShowTabs || flagShowAll || flagVisTabs,
            240 | 	}
            242 | 	out := bufio.NewWriter(os.Stdout)
            243 | 	proc := newCatProcessor(cfg)
            244 | 	exitCode := 0
            246 | 	args := flag.Args()
            247 | 	if len(args) == 0 {
            248 | 		// R1.2: no operands — read from stdin.
            249 | 		args = []string{"-"}
            250 | 	}
            252 | 	for _, arg := range args {
            253 | 		if err := processOperand(proc, arg, out); err != nil {
            254 | 			// R5.2: write error to stderr, continue with remaining operands.
            255 | 			fmt.Fprintf(os.Stderr, "cat: %s: %v\n", arg, err)
            256 | 			exitCode = 1
            257 | 		}
            258 | 	}
            260 | 	// R5.3: detect and report stdout write errors.
            261 | 	if err := out.Flush(); err != nil {
            262 | 		fmt.Fprintf(os.Stderr, "cat: write error: %v\n", err)
            263 | 		exitCode = 1
            264 | 	}
            266 | 	os.Exit(exitCode)
            267 | }
        - file: cmd/du/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the cmd/du binary.
            5 | // Reports disk usage for directories and files by recursively accumulating
            6 | // block counts, with support for summary mode, human-readable output,
            7 | // depth limiting, hard-link deduplication, and grand total reporting.
            8 | //
            9 | // Implements: prd009-du R1-R5
            10 | // Architecture: docs/ARCHITECTURE.yaml § cmd/
            11 | package main
            13 | import (
            14 | 	"flag"
            15 | 	"fmt"
            16 | 	"os"
            17 | 	"os/signal"
            18 | 	"syscall"
            19 | )
            21 | // progName is the program name used in error diagnostics (R4.2).
            22 | const progName = "du"
            24 | // fileKey identifies a unique file by device and inode for hard-link
            25 | // deduplication across the entire invocation (R3.1, R3.2, R3.3).
            26 | type fileKey struct {
            27 | 	Dev uint64
            28 | 	Ino uint64
            29 | }
            31 | // sizeMode determines how file sizes are displayed.
            32 | type sizeMode int
            34 | const (
            35 | 	modeKilo  sizeMode = iota // 1024-byte blocks (default, -k) (R1.2, R2.5)
            36 | 	modeMega                  // 1048576-byte blocks (-m) (R2.6)
            37 | 	modeHuman                 // human-readable K/M/G/T (-h) (R2.1)
            38 | 	modeBytes                 // apparent size in bytes (-b)
            39 | )
            41 | // humanSuffixes lists binary (1024-based) unit suffixes for -h output (R2.1).
            42 | var humanSuffixes = [...]string{"", "K", "M", "G", "T", "P", "E"} //nolint:gochecknoglobals
            44 | func main() {
            45 | 	// R5.1: SIGPIPE handler so piping to head exits cleanly.
            46 | 	sigCh := make(chan os.Signal, 1)
            47 | 	signal.Notify(sigCh, syscall.SIGPIPE)
            48 | 	go func() {
            49 | 		<-sigCh
            50 | 		os.Exit(0)
            51 | 	}()
            53 | 	var (
            54 | 		flagAll          bool
            55 | 		flagSummarize    bool
            56 | 		flagTotal        bool
            57 | 		flagMaxDepth     int
            58 | 		flagHuman        bool
            59 | 		flagKilo         bool
            60 | 		flagMega         bool
            61 | 		flagByteMode     bool
            62 | 		flagApparentSize bool
            63 | 	)
            65 | 	// Define flags per prd009-du R2.
            66 | 	flag.BoolVar(&flagAll, "a", false, "write counts for all files, not just directories")
            67 | 	flag.BoolVar(&flagAll, "all", false, "write counts for all files, not just directories")
            68 | 	flag.BoolVar(&flagSummarize, "s", false, "display only a total for each argument")
            69 | 	flag.BoolVar(&flagSummarize, "summarize", false, "display only a total for each argument")
            70 | 	flag.BoolVar(&flagTotal, "c", false, "produce a grand total")
            71 | 	flag.BoolVar(&flagTotal, "total", false, "produce a grand total")
            72 | 	flag.IntVar(&flagMaxDepth, "d", -1, "print total for directory depth N or fewer levels below the argument")
            73 | 	flag.IntVar(&flagMaxDepth, "max-depth", -1, "like -d")
            74 | 	flag.BoolVar(&flagHuman, "h", false, "print sizes in human readable format (K, M, G, T)")
            75 | 	flag.BoolVar(&flagHuman, "human-readable", false, "like -h")
            76 | 	flag.BoolVar(&flagKilo, "k", false, "like --block-size=1K (default)")
            77 | 	flag.BoolVar(&flagMega, "m", false, "like --block-size=1M")
            78 | 	flag.BoolVar(&flagByteMode, "b", false, "apparent size in bytes")
            79 | 	flag.BoolVar(&flagByteMode, "bytes", false, "like -b")
            80 | 	flag.BoolVar(&flagApparentSize, "apparent-size", false, "print apparent sizes rather than disk usage")
            81 | 	flag.Parse()
            83 | 	// R2.5: -k accepted for compatibility (1K blocks is already the default).
            84 | 	_ = flagKilo
            86 | 	// Resolve display mode. Priority: -b > -h > -m > -k.
            87 | 	mode := modeKilo
            88 | 	if flagMega {
            89 | 		mode = modeMega
            90 | 	}
            91 | 	if flagHuman {
            92 | 		mode = modeHuman
            93 | 	}
            94 | 	if flagByteMode {
            95 | 		mode = modeBytes
            96 | 		flagApparentSize = true
            97 | 	}
            99 | 	// R2.2: -s is equivalent to --max-depth=0.
            100 | 	maxDepth := flagMaxDepth
            101 | 	if flagSummarize {
            102 | 		maxDepth = 0
            103 | 	}
            105 | 	// R1.1: default to current directory when no arguments are given.
            106 | 	args := flag.Args()
            107 | 	if len(args) == 0 {
            108 | 		args = []string{"."}
            109 | 	}
            111 | 	// R3.3: deduplication map shared across all arguments.
            112 | 	seen := make(map[fileKey]bool)
            113 | 	exitCode := 0
            114 | 	var grandTotal int64
            116 | 	// R1.5: process arguments in command-line order.
            117 | 	for _, arg := range args {
            118 | 		total := processArg(arg, maxDepth, flagAll, flagApparentSize, mode, seen, &exitCode)
            119 | 		grandTotal += total
            120 | 	}
            122 | 	// R2.7: grand total line.
            123 | 	if flagTotal {
            124 | 		fmt.Printf("%s\ttotal\n", formatSize(grandTotal, mode))
            125 | 	}
            127 | 	os.Exit(exitCode)
            128 | }
            130 | // processArg processes a single command-line argument (file or directory) and
            131 | // returns its total size in bytes.
            132 | func processArg(path string, maxDepth int, all bool, apparentSize bool, mode sizeMode, seen map[fileKey]bool, exitCode *int) int64 {
            133 | 	fi, st, err := lstatFile(path)
            134 | 	if err != nil {
            135 | 		fmt.Fprintf(os.Stderr, "%s: cannot access '%s': %v\n", progName, path, sysErr(err))
            136 | 		*exitCode = 1
            137 | 		return 0
            138 | 	}
            140 | 	// Non-directory argument: print its size and return.
            141 | 	if !fi.IsDir() {
            142 | 		size := entryBytes(fi, st, apparentSize)
            143 | 		key := fileKey{Dev: uint64(st.Dev), Ino: st.Ino}
            144 | 		if seen[key] {
            145 | 			size = 0
            146 | 		} else {
            147 | 			seen[key] = true
            148 | 		}
            149 | 		fmt.Printf("%s\t%s\n", formatSize(size, mode), path)
            150 | 		return size
            151 | 	}
            153 | 	return walkDir(path, 0, maxDepth, all, apparentSize, mode, seen, exitCode)
            154 | }
            156 | // walkDir recursively processes a directory and returns its total size in bytes.
            157 | // Children are printed before the parent (bottom-up order, matching GNU du).
            158 | func walkDir(dirPath string, depth int, maxDepth int, all bool, apparentSize bool, mode sizeMode, seen map[fileKey]bool, exitCode *int) int64 {
            159 | 	var total int64
            161 | 	// R1.4: lstat the directory entry itself (do not follow symbolic links).
            162 | 	dirFI, dirSt, err := lstatFile(dirPath)
            163 | 	if err != nil {
            164 | 		fmt.Fprintf(os.Stderr, "%s: cannot access '%s': %v\n", progName, dirPath, sysErr(err))
            165 | 		*exitCode = 1
            166 | 		return 0
            167 | 	}
            168 | 	dirKey := fileKey{Dev: uint64(dirSt.Dev), Ino: dirSt.Ino}
            169 | 	if !seen[dirKey] {
            170 | 		seen[dirKey] = true
            171 | 		total += entryBytes(dirFI, dirSt, apparentSize)
            172 | 	}
            174 | 	// Read directory contents. Process whatever entries were read before any error.
            175 | 	entries, readErr := os.ReadDir(dirPath)
            176 | 	if readErr != nil {
            177 | 		fmt.Fprintf(os.Stderr, "%s: cannot read directory '%s': %v\n", progName, dirPath, sysErr(readErr))
            178 | 		*exitCode = 1
            179 | 	}
            181 | 	for _, entry := range entries {
            182 | 		childPath := joinPath(dirPath, entry.Name())
            184 | 		// R1.4: entry.IsDir() returns false for symlinks, so symlinks are not followed.
            185 | 		if entry.IsDir() {
            186 | 			childTotal := walkDir(childPath, depth+1, maxDepth, all, apparentSize, mode, seen, exitCode)
            187 | 			total += childTotal
            188 | 		} else {
            189 | 			childFI, childSt, err := lstatFile(childPath)
            190 | 			if err != nil {
            191 | 				fmt.Fprintf(os.Stderr, "%s: cannot access '%s': %v\n", progName, childPath, sysErr(err))
            192 | 				*exitCode = 1
            193 | 				continue
            194 | 			}
            195 | 			childKey := fileKey{Dev: uint64(childSt.Dev), Ino: childSt.Ino}
            196 | 			childSize := int64(0)
            197 | 			if !seen[childKey] {
            198 | 				seen[childKey] = true
            199 | 				childSize = entryBytes(childFI, childSt, apparentSize)
            200 | 			}
            201 | 			total += childSize
            203 | 			// R2.3: with -a, print a line for every file.
            204 | 			if all && canPrint(depth+1, maxDepth) {
            205 | 				fmt.Printf("%s\t%s\n", formatSize(childSize, mode), childPath)
            206 | 			}
            207 | 		}
            208 | 	}
            210 | 	// Print directory total after children.
            211 | 	if canPrint(depth, maxDepth) {
            212 | 		fmt.Printf("%s\t%s\n", formatSize(total, mode), dirPath)
            213 | 	}
            215 | 	return total
            216 | }
            218 | // lstatFile returns os.FileInfo and the underlying syscall.Stat_t for path
            219 | // without following symbolic links (R1.4, D2).
            220 | func lstatFile(path string) (os.FileInfo, *syscall.Stat_t, error) {
            221 | 	fi, err := os.Lstat(path)
            222 | 	if err != nil {
            223 | 		return nil, nil, err
            224 | 	}
            225 | 	st, ok := fi.Sys().(*syscall.Stat_t)
            226 | 	if !ok {
            227 | 		return nil, nil, fmt.Errorf("unexpected Sys() type for %s", path)
            228 | 	}
            229 | 	return fi, st, nil
            230 | }
            232 | // entryBytes returns the size contribution of a file in bytes.
            233 | // When apparentSize is true, uses fi.Size() (st_size); otherwise uses
            234 | // st.Blocks * 512 to report physical disk allocation (R1.2, R2.8).
            235 | func entryBytes(fi os.FileInfo, st *syscall.Stat_t, apparentSize bool) int64 {
            236 | 	if apparentSize {
            237 | 		return fi.Size()
            238 | 	}
            239 | 	return st.Blocks * 512
            240 | }
            242 | // canPrint reports whether an entry at the given depth should be printed.
            243 | // A negative maxDepth means no limit (R2.4).
            244 | func canPrint(depth int, maxDepth int) bool {
            245 | 	if maxDepth < 0 {
            246 | 		return true
            247 | 	}
            248 | 	return depth <= maxDepth
            249 | }
            251 | // joinPath constructs a child path preserving the parent directory's prefix form.
            252 | // This ensures "./subdir" paths when the argument is "." (matching GNU du).
            253 | func joinPath(dir, name string) string {
            254 | 	if len(dir) > 0 && dir[len(dir)-1] == '/' {
            255 | 		return dir + name
            256 | 	}
            257 | 	return dir + "/" + name
            258 | }
            260 | // formatSize converts a byte count to the display string for the given mode.
            261 | func formatSize(bytes int64, mode sizeMode) string {
            262 | 	switch mode {
            263 | 	case modeKilo:
            264 | 		return fmt.Sprintf("%d", ceilDiv(bytes, 1024))
            265 | 	case modeMega:
            266 | 		return fmt.Sprintf("%d", ceilDiv(bytes, 1048576))
            267 | 	case modeHuman:
            268 | 		return humanSize(bytes)
            269 | 	case modeBytes:
            270 | 		return fmt.Sprintf("%d", bytes)
            271 | 	default:
            272 | 		return fmt.Sprintf("%d", ceilDiv(bytes, 1024))
            273 | 	}
            274 | }
            276 | // ceilDiv returns the ceiling of a/b for non-negative a and positive b.
            277 | // Returns 0 when a is zero or negative.
            278 | func ceilDiv(a, b int64) int64 {
            279 | 	if a <= 0 {
            280 | 		return 0
            281 | 	}
            282 | 	return (a + b - 1) / b
            283 | }
            285 | // humanSize formats bytes as a human-readable string using binary (1024-based)
            286 | // units with suffixes K, M, G, T, P, E (R2.1).
            287 | func humanSize(bytes int64) string {
            288 | 	if bytes == 0 {
            289 | 		return "0"
            290 | 	}
            291 | 	const base = 1024.0
            292 | 	value := float64(bytes)
            293 | 	idx := 0
            294 | 	for idx < len(humanSuffixes)-1 && value >= base {
            295 | 		value /= base
            296 | 		idx++
            297 | 	}
            298 | 	if idx == 0 {
            299 | 		return fmt.Sprintf("%d", bytes)
            300 | 	}
            301 | 	// R2.1: one decimal place for all suffixed values.
            302 | 	return fmt.Sprintf("%.1f%s", value, humanSuffixes[idx])
            303 | }
            305 | // sysErr extracts the underlying system error from an os.PathError for
            306 | // cleaner diagnostic messages matching GNU du format.
            307 | func sysErr(err error) error {
            308 | 	if pe, ok := err.(*os.PathError); ok { //nolint:errorlint
            309 | 		return pe.Err
            310 | 	}
            311 | 	return err
            312 | }
