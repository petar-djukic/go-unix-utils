            27 | func TestMain(m *testing.M) {
            28 | 	// Locate GNU reference binary gwc (Homebrew coreutils).
            29 | 	refPath, err := exec.LookPath("gwc")
            30 | 	if err != nil {
            31 | 		fmt.Println("gwc not found on PATH; skipping wc differential tests")
            32 | 		os.Exit(0)
            33 | 	}
            34 | 	refBinaryPath = refPath
            36 | 	// Build the Go wc binary from the current package.
            37 | 	tmpDir, err := os.MkdirTemp("", "wc-test-*")
            38 | 	if err != nil {
            39 | 		fmt.Fprintf(os.Stderr, "creating temp dir: %v\n", err)
            40 | 		os.Exit(1)
            41 | 	}
            43 | 	goBinaryPath = filepath.Join(tmpDir, "wc")
            44 | 	cmd := exec.Command("go", "build", "-o", goBinaryPath, ".")
            45 | 	cmd.Stderr = os.Stderr
            46 | 	if err := cmd.Run(); err != nil {
            47 | 		fmt.Fprintf(os.Stderr, "building wc: %v\n", err)
            48 | 		os.RemoveAll(tmpDir)
            49 | 		os.Exit(1)
            50 | 	}
            52 | 	code := m.Run()
            53 | 	os.RemoveAll(tmpDir)
            54 | 	os.Exit(code)
            55 | }
