            4 | // Differential tests for cmd/cat against the GNU reference binary gcat.
            5 | //
            6 | // Implements prd006-cat R1, R2, R3, R4, R5 via differential testing
            7 | // using pkg/testutils.RunDiffTests.
            8 | package main
            10 | import (
            11 | 	"fmt"
            12 | 	"os"
            13 | 	"os/exec"
            14 | 	"path/filepath"
            15 | 	"testing"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            18 | )
            20 | // goBinaryPath is the path to the Go cat binary built in TestMain.
            21 | // refBinaryPath is the path to the GNU reference binary (gcat).
            22 | var (
            23 | 	goBinaryPath  string
            24 | 	refBinaryPath string
            25 | )
            27 | func TestMain(m *testing.M) {
            28 | 	// Locate GNU reference binary gcat (Homebrew coreutils).
            29 | 	refPath, err := exec.LookPath("gcat")
            30 | 	if err != nil {
            31 | 		fmt.Println("gcat not found on PATH; skipping cat differential tests")
            32 | 		os.Exit(0)
            33 | 	}
            34 | 	refBinaryPath = refPath
            36 | 	// Build the Go cat binary from the current package.
            37 | 	tmpDir, err := os.MkdirTemp("", "cat-test-*")
            38 | 	if err != nil {
            39 | 		fmt.Fprintf(os.Stderr, "creating temp dir: %v\n", err)
            40 | 		os.Exit(1)
            41 | 	}
            43 | 	goBinaryPath = filepath.Join(tmpDir, "cat")
            44 | 	cmd := exec.Command("go", "build", "-o", goBinaryPath, ".")
            45 | 	cmd.Stderr = os.Stderr
            46 | 	if err := cmd.Run(); err != nil {
            47 | 		fmt.Fprintf(os.Stderr, "building cat: %v\n", err)
            48 | 		os.RemoveAll(tmpDir)
            49 | 		os.Exit(1)
            50 | 	}
            52 | 	code := m.Run()
            53 | 	os.RemoveAll(tmpDir)
            54 | 	os.Exit(code)
            55 | }
