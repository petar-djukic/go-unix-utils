            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // cmd/du reports recursive directory disk usage, matching GNU du output
            5 | // format under LC_ALL=C.
            6 | //
            7 | // Implements prd009-du R1, R2, R3, R4, R5.
            8 | package main
            10 | import (
            11 | 	"bufio"
            12 | 	"fmt"
            13 | 	"os"
            14 | 	"strconv"
            15 | 	"strings"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/format"
            18 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            19 | )
            21 | const progName = "du"
            23 | // sizeMode determines how output sizes are formatted.
            24 | type sizeMode int
            26 | const (
            27 | 	sizeKiloBlocks  sizeMode = iota // default and -k: 1024-byte blocks
            28 | 	sizeMegaBlocks                  // -m: 1048576-byte blocks
            29 | 	sizeHumanBinary                 // -h: human-readable 1024-based
            30 | 	sizeHumanSI                     // --si: human-readable 1000-based
            31 | 	sizeCustomBlock                 // --block-size=N
            32 | )
            34 | type config struct {
            35 | 	allFiles     bool     // -a / --all
            36 | 	summarize    bool     // -s / --summarize
            37 | 	grandTotal   bool     // -c / --total
            38 | 	apparentSize bool     // -b / --apparent-size
            39 | 	derefLinks   bool     // -L / --dereference
            40 | 	nullTerm     bool     // -0 / --null
            41 | 	maxDepth     int      // -d N / --max-depth=N; -1 means unlimited
            42 | 	mode         sizeMode // output size mode
            43 | 	blockSize    int64    // custom block size for sizeCustomBlock
            44 | }
            46 | // inodeKey uniquely identifies a file for hard-link deduplication (prd009-du R3.2).
            47 | type inodeKey struct {
            48 | 	Dev uint64
            49 | 	Ino uint64
            50 | }
            52 | func main() {
            53 | 	sys.InstallSIGPIPEHandler() // prd009-du R5.1
            55 | 	cfg, args := parseArgs(os.Args[1:])
            57 | 	// -s is equivalent to --max-depth=0 (prd009-du R2.2).
            58 | 	if cfg.summarize && cfg.maxDepth < 0 {
            59 | 		cfg.maxDepth = 0
            60 | 	}
            62 | 	// Default to current directory (prd009-du R1.1).
            63 | 	if len(args) == 0 {
            64 | 		args = []string{"."}
            65 | 	}
            67 | 	out := bufio.NewWriter(os.Stdout)
            68 | 	seen := make(map[inodeKey]bool)
            69 | 	exitCode := 0
            70 | 	var grandTotal int64
            72 | 	// Process each argument in order (prd009-du R1.5).
            73 | 	for _, arg := range args {
            74 | 		total, hasErr := walkPath(out, cfg, arg, 0, seen)
            75 | 		if hasErr {
            76 | 			exitCode = 1
            77 | 		}
            78 | 		grandTotal += total
            79 | 	}
            81 | 	// Grand total line when -c is given (prd009-du R2.7).
            82 | 	if cfg.grandTotal {
            83 | 		printLine(out, cfg, grandTotal, "total")
            84 | 	}
            86 | 	if err := out.Flush(); err != nil {
            87 | 		os.Exit(1) // prd009-du R4
            88 | 	}
            89 | 	os.Exit(exitCode)
            90 | }
            92 | // parseArgs parses GNU-style flags including combined short flags (-sh)
            93 | // and long flags with = or space-separated values (--max-depth=3).
            94 | // Follows the manual parsing pattern from cmd/wc and cmd/cat.
            95 | func parseArgs(args []string) (config, []string) {
            96 | 	cfg := config{maxDepth: -1}
            97 | 	var files []string
            99 | 	for i := 0; i < len(args); i++ {
            100 | 		arg := args[i]
            102 | 		if arg == "--" {
            103 | 			files = append(files, args[i+1:]...)
            104 | 			break
            105 | 		}
            107 | 		if arg == "-" || !strings.HasPrefix(arg, "-") {
            108 | 			files = append(files, arg)
            109 | 			continue
            110 | 		}
            112 | 		if strings.HasPrefix(arg, "--") {
            113 | 			parseLongFlag(&cfg, arg[2:], args, &i)
            114 | 			continue
            115 | 		}
            117 | 		// Short flags may be combined: -sh means -s -h.
            118 | 		parseShortFlags(&cfg, arg[1:], args, &i)
            119 | 	}
            121 | 	return cfg, files
            122 | }
            124 | // parseLongFlag handles a single long flag (after stripping the -- prefix).
            125 | func parseLongFlag(cfg *config, raw string, args []string, i *int) {
            126 | 	name, value, hasValue := strings.Cut(raw, "=")
            127 | 	switch name {
            128 | 	case "all":
            129 | 		cfg.allFiles = true
            130 | 	case "summarize":
            131 | 		cfg.summarize = true
            132 | 	case "total":
            133 | 		cfg.grandTotal = true
            134 | 	case "human-readable":
            135 | 		cfg.mode = sizeHumanBinary
            136 | 	case "si":
            137 | 		cfg.mode = sizeHumanSI
            138 | 	case "apparent-size":
            139 | 		cfg.apparentSize = true
            140 | 	case "max-depth":
            141 | 		if hasValue {
            142 | 			cfg.maxDepth = parseDepth(value)
            143 | 		} else if *i+1 < len(args) {
            144 | 			*i++
            145 | 			cfg.maxDepth = parseDepth(args[*i])
            146 | 		}
            147 | 	case "block-size":
            148 | 		if hasValue {
            149 | 			cfg.blockSize = parseBlockSize(value)
            150 | 		} else if *i+1 < len(args) {
            151 | 			*i++
            152 | 			cfg.blockSize = parseBlockSize(args[*i])
            153 | 		}
            154 | 		cfg.mode = sizeCustomBlock
            155 | 	case "dereference":
            156 | 		cfg.derefLinks = true
            157 | 	case "null":
            158 | 		cfg.nullTerm = true
            159 | 	default:
            160 | 		fmt.Fprintf(os.Stderr, "%s: unrecognized option '--%s'\n", progName, name)
            161 | 		os.Exit(1)
            162 | 	}
            163 | }
            165 | // parseShortFlags processes combined short flags. When a flag requires a
            166 | // value (-d), the rest of the flag string is consumed as the value; if
            167 | // empty, the next argument is consumed.
            168 | func parseShortFlags(cfg *config, flags string, args []string, i *int) {
            169 | 	for j := 0; j < len(flags); j++ {
            170 | 		switch flags[j] {
            171 | 		case 'a':
            172 | 			cfg.allFiles = true
            173 | 		case 's':
            174 | 			cfg.summarize = true
            175 | 		case 'c':
            176 | 			cfg.grandTotal = true
            177 | 		case 'h':
            178 | 			cfg.mode = sizeHumanBinary
            179 | 		case 'k':
            180 | 			cfg.mode = sizeKiloBlocks
            181 | 		case 'm':
            182 | 			cfg.mode = sizeMegaBlocks
            183 | 		case 'b':
            184 | 			cfg.apparentSize = true
            185 | 		case 'L':
            186 | 			cfg.derefLinks = true
            187 | 		case 'P':
            188 | 			cfg.derefLinks = false
            189 | 		case '0':
            190 | 			cfg.nullTerm = true
            191 | 		case 'd':
            192 | 			rest := flags[j+1:]
            193 | 			if rest != "" {
            194 | 				cfg.maxDepth = parseDepth(rest)
            195 | 			} else if *i+1 < len(args) {
            196 | 				*i++
            197 | 				cfg.maxDepth = parseDepth(args[*i])
            198 | 			}
            199 | 			return // -d consumes the rest of the flag string
            200 | 		default:
            201 | 			fmt.Fprintf(os.Stderr, "%s: invalid option -- '%c'\n", progName, flags[j])
            202 | 			os.Exit(1)
            203 | 		}
            204 | 	}
            205 | }
            207 | // parseDepth parses a non-negative integer for --max-depth.
            208 | func parseDepth(s string) int {
            209 | 	n, err := strconv.Atoi(s)
            210 | 	if err != nil || n < 0 {
            211 | 		fmt.Fprintf(os.Stderr, "%s: invalid maximum depth '%s'\n", progName, s)
            212 | 		os.Exit(1)
            213 | 	}
            214 | 	return n
            215 | }
            217 | // parseBlockSize parses a positive integer for --block-size.
            218 | func parseBlockSize(s string) int64 {
            219 | 	n, err := strconv.ParseInt(s, 10, 64)
            220 | 	if err != nil || n <= 0 {
            221 | 		fmt.Fprintf(os.Stderr, "%s: invalid --block-size argument '%s'\n", progName, s)
            222 | 		os.Exit(1)
            223 | 	}
            224 | 	return n
            225 | }
            227 | // walkPath traverses a path and accumulates disk usage. For directories, it
            228 | // recurses into children and sums their sizes. Returns the total raw byte
            229 | // count and whether any error occurred during traversal.
            230 | func walkPath(out *bufio.Writer, cfg config, path string, depth int, seen map[inodeKey]bool) (int64, bool) {
            231 | 	fi, err := statPath(cfg, path)
            232 | 	if err != nil {
            233 | 		printStatError(path, err)
            234 | 		return 0, true
            235 | 	}
            237 | 	key := inodeKey{Dev: fi.Dev, Ino: fi.Ino}
            239 | 	// Non-directory entry.
            240 | 	if !fi.Mode.IsDir() {
            241 | 		size := rawSize(cfg, fi)
            242 | 		// Hard-link deduplication: count each inode once (prd009-du R3.1).
            243 | 		if seen[key] {
            244 | 			size = 0
            245 | 		} else {
            246 | 			seen[key] = true
            247 | 		}
            248 | 		if shouldPrint(cfg, depth, false) {
            249 | 			printLine(out, cfg, size, path)
            250 | 		}
            251 | 		return size, false
            252 | 	}
            254 | 	// Directory: detect cycles via seen set (relevant with -L).
            255 | 	if seen[key] {
            256 | 		return 0, false
            257 | 	}
            258 | 	seen[key] = true
            260 | 	size := rawSize(cfg, fi)
            262 | 	entries, err := os.ReadDir(path)
            263 | 	if err != nil {
            264 | 		printReadError(path, err)
            265 | 		if shouldPrint(cfg, depth, true) {
            266 | 			printLine(out, cfg, size, path)
            267 | 		}
            268 | 		return size, true
            269 | 	}
            271 | 	hasErr := false
            272 | 	for _, entry := range entries {
            273 | 		childPath := joinPath(path, entry.Name())
            274 | 		childSize, childErr := walkPath(out, cfg, childPath, depth+1, seen)
            275 | 		size += childSize
            276 | 		if childErr {
            277 | 			hasErr = true
            278 | 		}
            279 | 	}
            281 | 	// Directories are printed after their children (post-order, prd009-du R1.1).
            282 | 	if shouldPrint(cfg, depth, true) {
            283 | 		printLine(out, cfg, size, path)
            284 | 	}
            286 | 	return size, hasErr
            287 | }
            289 | // statPath returns file metadata using pkg/sys.Lstat (default) or
            290 | // pkg/sys.Stat when -L is active (prd009-du R1.4, design decision D2).
            291 | func statPath(cfg config, path string) (*sys.FileInfo, error) {
            292 | 	if cfg.derefLinks {
            293 | 		return sys.Stat(path)
            294 | 	}
            295 | 	return sys.Lstat(path)
            296 | }
            298 | // rawSize returns the raw byte count for a file entry. Uses fi.Blocks * 512
            299 | // for disk usage or fi.Size for apparent size (prd009-du R1.2, R2.8).
            300 | func rawSize(cfg config, fi *sys.FileInfo) int64 {
            301 | 	if cfg.apparentSize {
            302 | 		return fi.Size
            303 | 	}
            304 | 	return fi.Blocks * 512
            305 | }
            307 | // shouldPrint reports whether an entry at the given depth should produce
            308 | // output. Directories are always printed within the depth limit. Files
            309 | // require -a or must be a top-level argument (depth 0).
            310 | func shouldPrint(cfg config, depth int, isDir bool) bool {
            311 | 	if cfg.maxDepth >= 0 && depth > cfg.maxDepth {
            312 | 		return false
            313 | 	}
            314 | 	return isDir || cfg.allFiles || depth == 0
            315 | }
            317 | // formatSize converts raw bytes to the output string per the configured
            318 | // size mode (prd009-du R1.2, R2.1, R2.5, R2.6).
            319 | func formatSize(cfg config, bytes int64) string {
            320 | 	switch cfg.mode {
            321 | 	case sizeHumanBinary:
            322 | 		return format.HumanSize(bytes, format.HumanSizeOpts{Binary: true})
            323 | 	case sizeHumanSI:
            324 | 		return format.HumanSize(bytes, format.HumanSizeOpts{Binary: false})
            325 | 	case sizeMegaBlocks:
            326 | 		return strconv.FormatInt(ceilDiv(bytes, 1048576), 10)
            327 | 	case sizeCustomBlock:
            328 | 		return strconv.FormatInt(ceilDiv(bytes, cfg.blockSize), 10)
            329 | 	default: // sizeKiloBlocks
            330 | 		return strconv.FormatInt(ceilDiv(bytes, 1024), 10)
            331 | 	}
            332 | }
            334 | // ceilDiv returns the ceiling of a / b for positive values.
            335 | func ceilDiv(a, b int64) int64 {
            336 | 	if a <= 0 {
            337 | 		return 0
            338 | 	}
            339 | 	return (a + b - 1) / b
            340 | }
            342 | // printLine writes one output line: SIZE<tab>PATH<terminator>.
            343 | func printLine(out *bufio.Writer, cfg config, bytes int64, path string) {
            344 | 	size := formatSize(cfg, bytes)
            345 | 	fmt.Fprintf(out, "%s\t%s", size, path)
            346 | 	if cfg.nullTerm {
            347 | 		out.WriteByte(0)
            348 | 	} else {
            349 | 		out.WriteByte('\n')
            350 | 	}
            351 | }
            353 | // joinPath concatenates directory and entry name, preserving the original
            354 | // path format (e.g., "./sub" for "." arguments).
            355 | func joinPath(dir, name string) string {
            356 | 	if len(dir) > 0 && dir[len(dir)-1] == '/' {
            357 | 		return dir + name
            358 | 	}
            359 | 	return dir + "/" + name
            360 | }
            362 | // printStatError reports a stat error to stderr (prd009-du R4.2).
            363 | func printStatError(path string, err error) {
            364 | 	fmt.Fprintf(os.Stderr, "%s: cannot access '%s': %v\n", progName, path, extractSysError(err))
            365 | }
            367 | // printReadError reports a directory read error to stderr (prd009-du R4.2).
            368 | func printReadError(path string, err error) {
            369 | 	fmt.Fprintf(os.Stderr, "%s: cannot read directory '%s': %v\n", progName, path, extractSysError(err))
            370 | }
            372 | // extractSysError extracts the underlying system error from an os.PathError,
            373 | // removing the operation and path prefix that Go adds.
            374 | func extractSysError(err error) error {
            375 | 	if pe, ok := err.(*os.PathError); ok {
            376 | 		return pe.Err
            377 | 	}
            378 | 	return err
            379 | }
