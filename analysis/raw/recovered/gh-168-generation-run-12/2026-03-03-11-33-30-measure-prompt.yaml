        - file: pkg/sys/stat_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for Stat, Lstat, and FileInfo field population (prd002-sys R2.1, R2.2, R2.3).
            5 | package sys
            7 | import (
            8 | 	"os"
            9 | 	"path/filepath"
            10 | 	"testing"
            11 | 	"time"
            12 | )
            14 | // TestStat_RegularFile verifies that Stat returns a fully populated FileInfo
            15 | // for a regular file with known properties (prd002-sys R2.1, R2.2).
            16 | func TestStat_RegularFile(t *testing.T) {
            17 | 	dir := t.TempDir()
            18 | 	path := filepath.Join(dir, "testfile")
            19 | 	content := []byte("hello, stat\n")
            20 | 	if err := os.WriteFile(path, content, 0644); err != nil {
            21 | 		t.Fatalf("creating test file: %v", err)
            22 | 	}
            24 | 	fi, err := Stat(path)
            25 | 	if err != nil {
            26 | 		t.Fatalf("Stat(%q): %v", path, err)
            27 | 	}
            29 | 	// Mode: must be a regular file with 0644 permissions.
            30 | 	if !fi.Mode.IsRegular() {
            31 | 		t.Errorf("Mode.IsRegular() = false; expected true")
            32 | 	}
            33 | 	if perm := fi.Mode.Perm(); perm != 0644 {
            34 | 		t.Errorf("Mode.Perm() = %04o; expected 0644", perm)
            35 | 	}
            37 | 	// Size: must equal the written content length.
            38 | 	if fi.Size != int64(len(content)) {
            39 | 		t.Errorf("Size = %d; expected %d", fi.Size, len(content))
            40 | 	}
            42 | 	// Nlink: a freshly created regular file has exactly 1 hard link.
            43 | 	if fi.Nlink != 1 {
            44 | 		t.Errorf("Nlink = %d; expected 1", fi.Nlink)
            45 | 	}
            47 | 	// Uid/Gid: must match the current process (we created the file).
            48 | 	if fi.Uid != uint32(os.Getuid()) {
            49 | 		t.Errorf("Uid = %d; expected %d", fi.Uid, os.Getuid())
            50 | 	}
            51 | 	if fi.Gid != uint32(os.Getgid()) {
            52 | 		t.Errorf("Gid = %d; expected %d", fi.Gid, os.Getgid())
            53 | 	}
            55 | 	// Dev: must be nonzero (every filesystem has a device number).
            56 | 	if fi.Dev == 0 {
            57 | 		t.Error("Dev = 0; expected nonzero device ID")
            58 | 	}
            60 | 	// Ino: must be nonzero.
            61 | 	if fi.Ino == 0 {
            62 | 		t.Error("Ino = 0; expected nonzero inode number")
            63 | 	}
            65 | 	// Blocks: must be nonnegative (a 12-byte file still occupies at least one block).
            66 | 	if fi.Blocks < 0 {
            67 | 		t.Errorf("Blocks = %d; expected nonnegative", fi.Blocks)
            68 | 	}
            70 | 	// Blksize: must be positive.
            71 | 	if fi.Blksize <= 0 {
            72 | 		t.Errorf("Blksize = %d; expected positive", fi.Blksize)
            73 | 	}
            75 | 	// ModTime: must be recent (within the last 60 seconds).
            76 | 	if time.Since(fi.ModTime) > 60*time.Second {
            77 | 		t.Errorf("ModTime = %v; expected within the last 60 seconds", fi.ModTime)
            78 | 	}
            80 | 	// Info: the underlying os.FileInfo must be populated.
            81 | 	if fi.Info == nil {
            82 | 		t.Error("Info is nil; expected non-nil os.FileInfo")
            83 | 	}
            84 | 	if fi.Info.Name() != "testfile" {
            85 | 		t.Errorf("Info.Name() = %q; expected %q", fi.Info.Name(), "testfile")
            86 | 	}
            87 | }
            89 | // TestStat_HardLink verifies that Nlink increments when a hard link is created
            90 | // (prd002-sys R2.2).
            91 | func TestStat_HardLink(t *testing.T) {
            92 | 	dir := t.TempDir()
            93 | 	path := filepath.Join(dir, "original")
            94 | 	if err := os.WriteFile(path, []byte("data"), 0644); err != nil {
            95 | 		t.Fatalf("creating test file: %v", err)
            96 | 	}
            97 | 	link := filepath.Join(dir, "hardlink")
            98 | 	if err := os.Link(path, link); err != nil {
            99 | 		t.Fatalf("creating hard link: %v", err)
            100 | 	}
            102 | 	fi, err := Stat(path)
            103 | 	if err != nil {
            104 | 		t.Fatalf("Stat(%q): %v", path, err)
            105 | 	}
            106 | 	if fi.Nlink != 2 {
            107 | 		t.Errorf("Nlink = %d; expected 2 after creating one hard link", fi.Nlink)
            108 | 	}
