            4 | // Tests for SIGPIPE and SIGWINCH signal handling (prd002-sys R1.5, R1.6, R3.1, R3.2).
            5 | package sys
            7 | import (
            8 | 	"testing"
            9 | )
            11 | // TestInstallSIGPIPEHandler_NoPanic verifies that InstallSIGPIPEHandler can be
            12 | // called without panicking (prd002-sys R1.5).
            13 | func TestInstallSIGPIPEHandler_NoPanic(t *testing.T) {
            14 | 	// Calling InstallSIGPIPEHandler should not panic.
            15 | 	InstallSIGPIPEHandler()
            16 | }
            18 | // TestInstallSIGPIPEHandler_MultipleCallsSafe verifies that
            19 | // InstallSIGPIPEHandler is safe to call multiple times without panic or error
            20 | // (prd002-sys R1.6).
            21 | func TestInstallSIGPIPEHandler_MultipleCallsSafe(t *testing.T) {
            22 | 	for i := 0; i < 3; i++ {
            23 | 		InstallSIGPIPEHandler()
            24 | 	}
            25 | }
            27 | // TestOnTerminalResize_NoPanic verifies that OnTerminalResize can be called
            28 | // with a callback without panicking (prd002-sys R3.1).
            29 | func TestOnTerminalResize_NoPanic(t *testing.T) {
            30 | 	OnTerminalResize(func(width int) {
            31 | 		// no-op callback for registration test
            32 | 	})
            33 | }
            35 | // TestOnTerminalResize_MultipleRegistrations verifies that multiple callbacks
            36 | // can be registered without panic. The callback list grows with each call
            37 | // (prd002-sys R3.2).
            38 | func TestOnTerminalResize_MultipleRegistrations(t *testing.T) {
            39 | 	for i := 0; i < 3; i++ {
            40 | 		OnTerminalResize(func(width int) {
            41 | 			// no-op callback
            42 | 		})
            43 | 	}
            45 | 	// Verify that the global callback list has grown. We access the package-level
            46 | 	// resizeCallbacks slice (white-box test per design decision D3).
            47 | 	resizeMu.Lock()
            48 | 	count := len(resizeCallbacks)
            49 | 	resizeMu.Unlock()
            51 | 	// We cannot know the exact count because other tests may have registered
            52 | 	// callbacks, but we should have at least the 3 we just added plus the 1
            53 | 	// from TestOnTerminalResize_NoPanic.
            54 | 	if count < 4 {
            55 | 		t.Errorf("resizeCallbacks has %d entries; expected at least 4", count)
            56 | 	}
            57 | }
        - file: pkg/sys/stat.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package sys
            6 | import (
            7 | 	"fmt"
            8 | 	"os"
            9 | 	"syscall"
            10 | 	"time"
            11 | )
            13 | // FileInfo holds extended file metadata from syscall.Stat_t not available
            14 | // from os.FileInfo (prd002-sys R2.2).
            15 | type FileInfo struct {
            16 | 	Mode    os.FileMode // file mode and type bits (from syscall.Stat_t.Mode)
            17 | 	Size    int64       // apparent file size in bytes (st_size)
            18 | 	Nlink   uint64      // hard-link count (st_nlink)
            19 | 	Uid     uint32      // owner user ID (st_uid)
            20 | 	Gid     uint32      // owner group ID (st_gid)
            21 | 	Rdev    uint64      // device ID for special files (st_rdev)
            22 | 	Dev     uint64      // device ID of the containing filesystem (st_dev)
            23 | 	Ino     uint64      // inode number (st_ino)
            24 | 	Blocks  int64       // number of 512-byte blocks allocated (st_blocks)
            25 | 	Blksize int64       // preferred I/O block size (st_blksize)
            26 | 	ModTime time.Time   // modification time (st_mtime / st_mtimespec)
            27 | 	Info    os.FileInfo // underlying os.FileInfo for os package compatibility
            28 | }
            30 | // Stat returns extended file metadata for path, following symbolic links
            31 | // (prd002-sys R2.1).
            32 | func Stat(path string) (*FileInfo, error) {
            33 | 	info, err := os.Stat(path)
            34 | 	if err != nil {
            35 | 		return nil, err
            36 | 	}
            37 | 	return newFileInfo(info)
            38 | }
            40 | // Lstat returns extended file metadata for path without following symbolic
            41 | // links (prd002-sys R2.1).
            42 | func Lstat(path string) (*FileInfo, error) {
            43 | 	info, err := os.Lstat(path)
            44 | 	if err != nil {
            45 | 		return nil, err
            46 | 	}
            47 | 	return newFileInfo(info)
            48 | }
            50 | // newFileInfo extracts syscall.Stat_t from os.FileInfo and populates a
            51 | // FileInfo with platform-independent and platform-specific fields.
            52 | func newFileInfo(info os.FileInfo) (*FileInfo, error) {
            53 | 	st, ok := info.Sys().(*syscall.Stat_t)
            54 | 	if !ok {
            55 | 		return nil, fmt.Errorf("extracting syscall.Stat_t: unsupported platform")
            56 | 	}
            57 | 	fi := &FileInfo{
            58 | 		Mode: info.Mode(),
            59 | 		Size: info.Size(),
            60 | 		Info: info,
            61 | 	}
            62 | 	fillFromStat(fi, st)
            63 | 	return fi, nil
            64 | }
