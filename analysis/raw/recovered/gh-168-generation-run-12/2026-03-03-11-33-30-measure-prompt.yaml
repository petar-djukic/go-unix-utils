        - file: pkg/format/size.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"fmt"
            8 | 	"math"
            9 | )
            11 | // HumanSizeOpts configures the unit system for HumanSize (prd003-format R3.1).
            12 | type HumanSizeOpts struct {
            13 | 	// Binary selects 1024-based units with suffixes K/M/G/T/P/E when true,
            14 | 	// or 1000-based SI units with suffixes kB/MB/GB/TB when false.
            15 | 	Binary bool
            16 | }
            18 | // binarySuffixes are the unit suffixes for 1024-based size formatting
            19 | // (prd003-format R3.2).
            20 | var binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            22 | // siSuffixes are the unit suffixes for 1000-based SI size formatting
            23 | // (prd003-format R3.2).
            24 | var siSuffixes = []string{"", "kB", "MB", "GB", "TB"}
            26 | // HumanSize converts a byte count to a human-readable string matching GNU
            27 | // coreutils human_readable() behavior (prd003-format R3.1). Values below 10
            28 | // at the chosen unit are formatted with one decimal place; values at 10 or
            29 | // above use no decimal (prd003-format R3.3). Zero bytes returns "0"
            30 | // (prd003-format R3.4).
            31 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            32 | 	if bytes == 0 {
            33 | 		return "0"
            34 | 	}
            36 | 	var base float64
            37 | 	var suffixes []string
            38 | 	if opts.Binary {
            39 | 		base = 1024
            40 | 		suffixes = binarySuffixes
            41 | 	} else {
            42 | 		base = 1000
            43 | 		suffixes = siSuffixes
            44 | 	}
            46 | 	value := float64(bytes)
            47 | 	level := 0
            48 | 	for level < len(suffixes)-1 && math.Abs(value) >= base {
            49 | 		value /= base
            50 | 		level++
            51 | 	}
            53 | 	if level == 0 {
            54 | 		return fmt.Sprintf("%d", bytes)
            55 | 	}
            57 | 	if math.Abs(value) < 10 {
            58 | 		return fmt.Sprintf("%.1f%s", value, suffixes[level])
            59 | 	}
            60 | 	return fmt.Sprintf("%.0f%s", value, suffixes[level])
            61 | }
