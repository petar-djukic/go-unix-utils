        - file: pkg/sys/signal.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package sys
            6 | import (
            7 | 	"os"
            8 | 	"os/signal"
            9 | 	"sync"
            10 | 	"syscall"
            11 | )
            13 | // InstallSIGPIPEHandler installs a SIGPIPE handler that causes the process to
            14 | // exit 0 when stdout or stderr is closed by a downstream consumer. This matches
            15 | // GNU behavior where SIGPIPE terminates silently (prd002-sys R1.5, R1.6).
            16 | //
            17 | // Safe to call multiple times; each invocation starts exactly one goroutine.
            18 | func InstallSIGPIPEHandler() {
            19 | 	c := make(chan os.Signal, 1)
            20 | 	signal.Notify(c, syscall.SIGPIPE)
            21 | 	go func() {
            22 | 		<-c
            23 | 		os.Exit(0)
            24 | 	}()
            25 | }
            27 | var (
            28 | 	resizeMu        sync.Mutex
            29 | 	resizeCallbacks []func(width int)
            30 | 	resizeInstalled bool
            31 | )
            33 | // OnTerminalResize registers a callback invoked with the new terminal width
            34 | // when a SIGWINCH signal is received. Multiple callbacks may be registered;
            35 | // they are called in registration order. If TerminalWidth returns an error
            36 | // the callback is not invoked (prd002-sys R3.1, R3.2).
            37 | func OnTerminalResize(callback func(width int)) {
            38 | 	resizeMu.Lock()
            39 | 	defer resizeMu.Unlock()
            41 | 	resizeCallbacks = append(resizeCallbacks, callback)
            43 | 	if !resizeInstalled {
            44 | 		resizeInstalled = true
            45 | 		c := make(chan os.Signal, 1)
            46 | 		signal.Notify(c, syscall.SIGWINCH)
            47 | 		go func() {
            48 | 			for range c {
            49 | 				width, err := TerminalWidth()
            50 | 				if err != nil {
            51 | 					continue
            52 | 				}
            53 | 				resizeMu.Lock()
            54 | 				cbs := make([]func(width int), len(resizeCallbacks))
            55 | 				copy(cbs, resizeCallbacks)
            56 | 				resizeMu.Unlock()
            57 | 				for _, cb := range cbs {
            58 | 					cb(width)
            59 | 				}
            60 | 			}
            61 | 		}()
            62 | 	}
            63 | }
