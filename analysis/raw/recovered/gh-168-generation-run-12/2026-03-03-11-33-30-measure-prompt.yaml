            4 | // Package sys wraps Darwin and Linux syscalls and signal handling, providing a
            5 | // stable interface that cmd/ packages use to avoid platform-specific code in
            6 | // utility implementations. Only syscalls that have platform divergence between
            7 | // Darwin and Linux, or that Go's standard library does not expose cleanly,
            8 | // belong here.
            9 | //
            10 | // Implements prd002-sys R1, R2, R3.
