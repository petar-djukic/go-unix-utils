            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the sponge utility for soaking stdin and writing to a file.
            5 | //
            6 | // Implements prd007-sponge (R1-R5).
            7 | package main
            9 | import (
            10 | 	"flag"
            11 | 	"fmt"
            12 | 	"io"
            13 | 	"os"
            14 | 	"os/signal"
            15 | 	"syscall"
            16 | )
            18 | const (
            19 | 	// R1.2: initial buffer size matching sponge.c BUFF_SIZE.
            20 | 	initialBufferSize = 8192
            22 | 	// R1.3: memory threshold for spilling stdin to a temp file.
            23 | 	// Fixed threshold; the PRD permits "a fixed fraction of RLIMIT_DATA."
            24 | 	spillThreshold = 256 * 1024 * 1024
            26 | 	// permMask extracts permission and special bits from os.FileMode.
            27 | 	permMask = os.ModeSetuid | os.ModeSetgid | os.ModeSticky | os.ModePerm
            28 | )
            30 | // tempFiles tracks temp file paths for cleanup on signal or exit.
            31 | var tempFiles []string
            33 | func main() {
            34 | 	// R1.5: register cleanup handler for temp files on signals.
            35 | 	sigCh := make(chan os.Signal, 1)
            36 | 	signal.Notify(sigCh, syscall.SIGINT, syscall.SIGTERM, syscall.SIGHUP, syscall.SIGPIPE)
            37 | 	go func() {
            38 | 		<-sigCh
            39 | 		cleanupAll()
            40 | 		os.Exit(1)
            41 | 	}()
            43 | 	appendMode := flag.Bool("a", false, "append to the output file instead of truncating")
            44 | 	flag.Parse()
            46 | 	args := flag.Args()
            47 | 	if len(args) > 1 {
            48 | 		fmt.Fprintln(os.Stderr, "sponge: too many arguments")
            49 | 		os.Exit(1)
            50 | 	}
            52 | 	var outPath string
            53 | 	if len(args) == 1 {
            54 | 		outPath = args[0]
            55 | 	}
            57 | 	// R1.1: read all of stdin before opening the output file.
            58 | 	buf, spill, err := soak()
            59 | 	if err != nil {
            60 | 		fmt.Fprintf(os.Stderr, "sponge: %v\n", err)
            61 | 		closeFile(spill)
            62 | 		cleanupAll()
            63 | 		os.Exit(1)
            64 | 	}
            66 | 	var exitCode int
            67 | 	if outPath == "" {
            68 | 		// R4: passthrough mode -- write to stdout.
            69 | 		if err := passthrough(buf, spill); err != nil {
            70 | 			fmt.Fprintf(os.Stderr, "sponge: %v\n", err)
            71 | 			exitCode = 1
            72 | 		}
            73 | 	} else {
            74 | 		// R2, R3: write to named output file.
            75 | 		if err := writeFile(outPath, buf, spill, *appendMode); err != nil {
            76 | 			fmt.Fprintf(os.Stderr, "sponge: %v\n", err)
            77 | 			exitCode = 1
            78 | 		}
            79 | 	}
            81 | 	closeFile(spill)
            82 | 	cleanupAll()
            83 | 	os.Exit(exitCode)
            84 | }
            86 | // soak reads all of stdin into memory, spilling to a temp file if the buffer
            87 | // exceeds spillThreshold. R1.1, R1.2, R1.3, R1.4.
            88 | func soak() ([]byte, *os.File, error) {
            89 | 	buf := make([]byte, 0, initialBufferSize)
            90 | 	chunk := make([]byte, initialBufferSize)
            91 | 	var spill *os.File
            93 | 	for {
            94 | 		n, err := os.Stdin.Read(chunk)
            95 | 		if n > 0 {
            96 | 			if spill != nil {
            97 | 				if _, werr := spill.Write(chunk[:n]); werr != nil {
            98 | 					return nil, spill, fmt.Errorf("writing to temp file: %w", werr)
            99 | 				}
            100 | 			} else {
            101 | 				buf = append(buf, chunk[:n]...)
            102 | 				// R1.3: spill buffer to temp file when threshold exceeded.
            103 | 				if len(buf) > spillThreshold {
            104 | 					sf, serr := makeTempFile()
            105 | 					if serr != nil {
            106 | 						return nil, nil, serr
            107 | 					}
            108 | 					spill = sf
            109 | 					if _, werr := spill.Write(buf); werr != nil {
            110 | 						return nil, spill, fmt.Errorf("writing to temp file: %w", werr)
            111 | 					}
            112 | 					buf = nil
            113 | 				}
            114 | 			}
            115 | 		}
            116 | 		if err != nil {
            117 | 			if err == io.EOF {
            118 | 				return buf, spill, nil
            119 | 			}
            120 | 			return buf, spill, fmt.Errorf("reading stdin: %w", err)
            121 | 		}
            122 | 	}
            123 | }
            125 | // passthrough writes the soaked stdin to stdout. R4.1, R4.2, R4.3.
            126 | func passthrough(buf []byte, spill *os.File) error {
            127 | 	if spill != nil {
            128 | 		// R4.2: seek spill file to start and copy to stdout.
            129 | 		if _, err := spill.Seek(0, io.SeekStart); err != nil {
            130 | 			return fmt.Errorf("seeking temp file: %w", err)
            131 | 		}
            132 | 		if _, err := io.Copy(os.Stdout, spill); err != nil {
            133 | 			return fmt.Errorf("writing to stdout: %w", err)
            134 | 		}
            135 | 		return nil
            136 | 	}
            137 | 	// R4.3: write in-memory buffer directly to stdout.
            138 | 	if _, err := os.Stdout.Write(buf); err != nil {
            139 | 		return fmt.Errorf("writing to stdout: %w", err)
            140 | 	}
            141 | 	return nil
            142 | }
            144 | // writeFile writes the soaked stdin to the named output file, optionally
            145 | // appending to existing content. R2, R3.
            146 | func writeFile(outPath string, buf []byte, spill *os.File, appendMode bool) error {
            147 | 	// R2.4: lstat the output path.
            148 | 	existingMode, isRegular := lstatMode(outPath)
            150 | 	// Optimization: reuse spill file directly when no prepend is needed.
            151 | 	if spill != nil && !(appendMode && isRegular) {
            152 | 		return reuseSpill(spill, outPath, existingMode)
            153 | 	}
            155 | 	// Create a temp file for atomic output.
            156 | 	tmp, err := makeTempFile()
            157 | 	if err != nil {
            158 | 		return err
            159 | 	}
            161 | 	// R3.1, R3.3: in append mode, prepend original file content.
            162 | 	if appendMode && isRegular {
            163 | 		if err := copyOriginal(outPath, tmp); err != nil {
            164 | 			tmp.Close()
            165 | 			return err
            166 | 		}
            167 | 	}
            169 | 	// Write stdin content to the temp file.
            170 | 	if err := writeStdin(tmp, buf, spill); err != nil {
            171 | 		tmp.Close()
            172 | 		return err
            173 | 	}
            175 | 	tmpPath := tmp.Name()
            176 | 	if err := tmp.Close(); err != nil {
            177 | 		return fmt.Errorf("closing temp file: %w", err)
            178 | 	}
            180 | 	return atomicReplace(tmpPath, outPath, existingMode)
            181 | }
            183 | // lstatMode returns the file mode and whether the path is a regular file.
            184 | // R2.3, R2.4.
            185 | func lstatMode(path string) (os.FileMode, bool) {
            186 | 	info, err := os.Lstat(path)
            187 | 	if err != nil {
            188 | 		// R2.3: default mode for new files is 0666 masked by umask.
            189 | 		return defaultMode(), false
            190 | 	}
            191 | 	if !info.Mode().IsRegular() {
            192 | 		return defaultMode(), false
            193 | 	}
            194 | 	return info.Mode() & permMask, true
            195 | }
            197 | // defaultMode returns 0666 masked by the process umask. R2.3.
            198 | func defaultMode() os.FileMode {
            199 | 	mask := syscall.Umask(0)
            200 | 	syscall.Umask(mask)
            201 | 	return os.FileMode(0o666 &^ mask)
            202 | }
            204 | // reuseSpill closes the spill file and renames it directly to the output path.
            205 | // Used in non-append mode when stdin was spilled to a temp file.
            206 | func reuseSpill(spill *os.File, outPath string, mode os.FileMode) error {
            207 | 	spillPath := spill.Name()
            208 | 	if err := spill.Close(); err != nil {
            209 | 		return fmt.Errorf("closing temp file: %w", err)
            210 | 	}
            211 | 	return atomicReplace(spillPath, outPath, mode)
            212 | }
            214 | // copyOriginal copies the existing file content into the temp file. R3.3.
            215 | func copyOriginal(origPath string, dst *os.File) error {
            216 | 	src, err := os.Open(origPath)
            217 | 	if err != nil {
            218 | 		return fmt.Errorf("reading %s: %w", origPath, err)
            219 | 	}
            220 | 	defer src.Close()
            221 | 	if _, err := io.Copy(dst, src); err != nil {
            222 | 		return fmt.Errorf("copying %s: %w", origPath, err)
            223 | 	}
            224 | 	return nil
            225 | }
            227 | // writeStdin writes the soaked stdin content to the temp file from either
            228 | // the in-memory buffer or the spill file.
            229 | func writeStdin(dst *os.File, buf []byte, spill *os.File) error {
            230 | 	if spill != nil {
            231 | 		if _, err := spill.Seek(0, io.SeekStart); err != nil {
            232 | 			return fmt.Errorf("seeking temp file: %w", err)
            233 | 		}
            234 | 		if _, err := io.Copy(dst, spill); err != nil {
            235 | 			return fmt.Errorf("copying stdin: %w", err)
            236 | 		}
            237 | 		return nil
            238 | 	}
            239 | 	if len(buf) > 0 {
            240 | 		if _, err := dst.Write(buf); err != nil {
            241 | 			return fmt.Errorf("writing stdin: %w", err)
            242 | 		}
            243 | 	}
            244 | 	return nil
            245 | }
            247 | // atomicReplace sets permissions on src, then renames it to dst. Falls back
            248 | // to a byte-for-byte copy when the rename fails (e.g., cross-device).
            249 | // R2.1, R2.2, R2.3.
            250 | func atomicReplace(src, dst string, mode os.FileMode) error {
            251 | 	if err := os.Chmod(src, mode); err != nil {
            252 | 		return fmt.Errorf("setting permissions: %w", err)
            253 | 	}
            254 | 	// R2.5: untrack before rename so a signal handler won't delete the output.
            255 | 	untrackTemp(src)
            256 | 	if err := os.Rename(src, dst); err != nil {
            257 | 		// R2.2: cross-device fallback.
            258 | 		tempFiles = append(tempFiles, src)
            259 | 		return fallbackCopy(src, dst, mode)
            260 | 	}
            261 | 	return nil
            262 | }
            264 | // fallbackCopy copies src to dst and removes src. R2.2.
            265 | func fallbackCopy(src, dst string, mode os.FileMode) error {
            266 | 	in, err := os.Open(src)
            267 | 	if err != nil {
            268 | 		return fmt.Errorf("opening temp for copy: %w", err)
            269 | 	}
            270 | 	defer in.Close()
            272 | 	out, err := os.OpenFile(dst, os.O_WRONLY|os.O_CREATE|os.O_TRUNC, mode)
            273 | 	if err != nil {
            274 | 		return fmt.Errorf("opening %s: %w", dst, err)
            275 | 	}
            277 | 	if _, err := io.Copy(out, in); err != nil {
            278 | 		out.Close()
            279 | 		return fmt.Errorf("copying to %s: %w", dst, err)
            280 | 	}
            281 | 	if err := out.Close(); err != nil {
            282 | 		return fmt.Errorf("closing %s: %w", dst, err)
            283 | 	}
            285 | 	os.Remove(src) // best-effort cleanup of temp file
            286 | 	untrackTemp(src)
            287 | 	return nil
            288 | }
            290 | // makeTempFile creates a temp file in TMPDIR or /tmp and tracks it for
            291 | // cleanup. R1.4.
            292 | func makeTempFile() (*os.File, error) {
            293 | 	dir := os.Getenv("TMPDIR")
            294 | 	if dir == "" {
            295 | 		dir = "/tmp"
            296 | 	}
            297 | 	f, err := os.CreateTemp(dir, "sponge.")
            298 | 	if err != nil {
            299 | 		return nil, fmt.Errorf("creating temp file: %w", err)
            300 | 	}
            301 | 	tempFiles = append(tempFiles, f.Name())
            302 | 	return f, nil
            303 | }
            305 | // untrackTemp removes a path from the cleanup list.
            306 | func untrackTemp(path string) {
            307 | 	for i, p := range tempFiles {
            308 | 		if p == path {
            309 | 			tempFiles = append(tempFiles[:i], tempFiles[i+1:]...)
            310 | 			return
            311 | 		}
            312 | 	}
            313 | }
            315 | // cleanupAll removes all tracked temp files. R1.5, R5.4.
            316 | func cleanupAll() {
            317 | 	for _, p := range tempFiles {
            318 | 		os.Remove(p) // best-effort cleanup, error ignored
            319 | 	}
            320 | 	tempFiles = nil
            321 | }
            323 | // closeFile closes a file if non-nil. Used for best-effort cleanup.
            324 | func closeFile(f *os.File) {
            325 | 	if f != nil {
            326 | 		f.Close() // best-effort, error ignored on cleanup
            327 | 	}
            328 | }
