            19 | // Helper program source code constants. Each produces controlled stdout,
            20 | // stderr, and exit code for use as goBinary/refBinary inputs to RunDiffTests.
            22 | // noopSource produces no output and exits 0.
            23 | const noopSource = `package main
            25 | func main() {}
            26 | `
            28 | // stdoutHelloSource writes "hello\n" to stdout and exits 0.
            29 | const stdoutHelloSource = `package main
            31 | import "fmt"
            33 | func main() { fmt.Println("hello") }
            34 | `
            36 | // stdoutWorldSource writes "world\n" to stdout and exits 0.
            37 | const stdoutWorldSource = `package main
            39 | import "fmt"
            41 | func main() { fmt.Println("world") }
            42 | `
            44 | // stderrHelloSource writes "hello\n" to stderr and exits 0.
            45 | const stderrHelloSource = `package main
            47 | import (
            48 | 	"fmt"
            49 | 	"os"
            50 | )
            52 | func main() { fmt.Fprintln(os.Stderr, "hello") }
            53 | `
            55 | // stderrWorldSource writes "world\n" to stderr and exits 0.
            56 | const stderrWorldSource = `package main
            58 | import (
            59 | 	"fmt"
            60 | 	"os"
            61 | )
            63 | func main() { fmt.Fprintln(os.Stderr, "world") }
            64 | `
            66 | // exit1Source exits with code 1 and produces no output.
            67 | const exit1Source = `package main
            69 | import "os"
            71 | func main() { os.Exit(1) }
            72 | `
            74 | // binDir holds the path to compiled test helper binaries. Set by TestMain.
            75 | var binDir string
            77 | // helperBin returns the absolute path to a compiled test helper binary.
            78 | func helperBin(name string) string {
            79 | 	return filepath.Join(binDir, name)
            80 | }
            82 | // buildHelper compiles a Go source string into a named binary under binDir.
            83 | func buildHelper(name, source string) error {
            84 | 	srcDir, err := os.MkdirTemp("", "src-"+name+"-*")
            85 | 	if err != nil {
            86 | 		return fmt.Errorf("creating source dir: %w", err)
            87 | 	}
            88 | 	defer os.RemoveAll(srcDir) // best-effort cleanup
            90 | 	if err := os.WriteFile(filepath.Join(srcDir, "main.go"), []byte(source), 0o644); err != nil {
            91 | 		return fmt.Errorf("writing source: %w", err)
            92 | 	}
            94 | 	if err := os.WriteFile(filepath.Join(srcDir, "go.mod"), []byte("module helper\n\ngo 1.21\n"), 0o644); err != nil {
            95 | 		return fmt.Errorf("writing go.mod: %w", err)
            96 | 	}
            98 | 	outPath := filepath.Join(binDir, name)
            99 | 	cmd := exec.Command("go", "build", "-o", outPath, ".")
            100 | 	cmd.Dir = srcDir
            101 | 	if out, err := cmd.CombinedOutput(); err != nil {
            102 | 		return fmt.Errorf("compiling %s: %w\n%s", name, err, out)
            103 | 	}
            105 | 	return nil
            106 | }
            108 | // TestMain compiles test helper binaries before running tests. In subprocess
            109 | // mode (HELPER_BIN_DIR set), it reuses pre-built binaries from the parent.
            110 | func TestMain(m *testing.M) {
            111 | 	// Subprocess mode: reuse pre-built binaries from parent process.
            112 | 	if dir := os.Getenv("HELPER_BIN_DIR"); dir != "" {
            113 | 		binDir = dir
            114 | 		os.Exit(m.Run())
            115 | 	}
            117 | 	var err error
            118 | 	binDir, err = os.MkdirTemp("", "difftest-helpers-*")
            119 | 	if err != nil {
            120 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            121 | 		os.Exit(1)
            122 | 	}
            124 | 	helpers := []struct {
            125 | 		name   string
            126 | 		source string
            127 | 	}{
            128 | 		{"noop", noopSource},
            129 | 		{"stdout-hello", stdoutHelloSource},
            130 | 		{"stdout-world", stdoutWorldSource},
            131 | 		{"stderr-hello", stderrHelloSource},
            132 | 		{"stderr-world", stderrWorldSource},
            133 | 		{"exit1", exit1Source},
            134 | 	}
            136 | 	for _, h := range helpers {
            137 | 		if err := buildHelper(h.name, h.source); err != nil {
            138 | 			fmt.Fprintf(os.Stderr, "building helper %s: %v\n", h.name, err)
            139 | 			os.RemoveAll(binDir) // best-effort cleanup
            140 | 			os.Exit(1)
            141 | 		}
            142 | 	}
            144 | 	code := m.Run()
            145 | 	os.RemoveAll(binDir) // best-effort cleanup
            146 | 	os.Exit(code)
            147 | }
            149 | // TestRunDiffTests_Matching verifies R2.1, R3.2, R3.3, R3.4: RunDiffTests
            150 | // passes when both binaries produce identical stdout, stderr, and exit code.
            151 | func TestRunDiffTests_Matching(t *testing.T) {
            152 | 	t.Parallel()
            154 | 	tests := []struct {
            155 | 		name   string
            156 | 		goBin  string
            157 | 		refBin string
            158 | 	}{
            159 | 		{"no-output", helperBin("noop"), helperBin("noop")},
            160 | 		{"matching-stdout", helperBin("stdout-hello"), helperBin("stdout-hello")},
            161 | 		{"matching-stderr", helperBin("stderr-hello"), helperBin("stderr-hello")},
            162 | 		{"matching-exit-code", helperBin("exit1"), helperBin("exit1")},
            163 | 	}
            165 | 	for _, tc := range tests {
            166 | 		t.Run(tc.name, func(t *testing.T) {
            167 | 			t.Parallel()
            168 | 			testutils.RunDiffTests(t, tc.goBin, tc.refBin, []testutils.DiffTest{
            169 | 				{Name: "match"},
            170 | 			})
            171 | 		})
            172 | 	}
            173 | }
            175 | // TestRunDiffTests_StdoutDivergence verifies R3.2: RunDiffTests detects and
            176 | // reports stdout differences between the go and reference binaries.
            177 | func TestRunDiffTests_StdoutDivergence(t *testing.T) {
            178 | 	t.Parallel()
            180 | 	if os.Getenv("EXPECT_FAIL") == "stdout" {
            181 | 		testutils.RunDiffTests(t, helperBin("stdout-hello"), helperBin("stdout-world"), []testutils.DiffTest{
            182 | 			{Name: "detect-stdout-diff"},
            183 | 		})
            184 | 		return
            185 | 	}
            187 | 	out := runExpectingFailure(t, "stdout", "TestRunDiffTests_StdoutDivergence")
            188 | 	if !bytes.Contains(out, []byte("stdout differs")) {
            189 | 		t.Fatalf("expected stdout divergence in failure output, got:\n%s", out)
            190 | 	}
            191 | }
            193 | // TestRunDiffTests_StderrDivergence verifies R3.3: RunDiffTests detects and
            194 | // reports stderr differences between the go and reference binaries.
            195 | func TestRunDiffTests_StderrDivergence(t *testing.T) {
            196 | 	t.Parallel()
            198 | 	if os.Getenv("EXPECT_FAIL") == "stderr" {
            199 | 		testutils.RunDiffTests(t, helperBin("stderr-hello"), helperBin("stderr-world"), []testutils.DiffTest{
            200 | 			{Name: "detect-stderr-diff"},
            201 | 		})
            202 | 		return
            203 | 	}
            205 | 	out := runExpectingFailure(t, "stderr", "TestRunDiffTests_StderrDivergence")
            206 | 	if !bytes.Contains(out, []byte("stderr differs")) {
            207 | 		t.Fatalf("expected stderr divergence in failure output, got:\n%s", out)
            208 | 	}
            209 | }
            211 | // TestRunDiffTests_ExitCodeDivergence verifies R3.4: RunDiffTests detects and
            212 | // reports exit code differences between the go and reference binaries.
            213 | func TestRunDiffTests_ExitCodeDivergence(t *testing.T) {
            214 | 	t.Parallel()
            216 | 	if os.Getenv("EXPECT_FAIL") == "exitcode" {
            217 | 		testutils.RunDiffTests(t, helperBin("noop"), helperBin("exit1"), []testutils.DiffTest{
            218 | 			{Name: "detect-exitcode-diff"},
            219 | 		})
            220 | 		return
            221 | 	}
            223 | 	out := runExpectingFailure(t, "exitcode", "TestRunDiffTests_ExitCodeDivergence")
            224 | 	if !bytes.Contains(out, []byte("exit code:")) {
            225 | 		t.Fatalf("expected exit code divergence in failure output, got:\n%s", out)
            226 | 	}
            227 | }
            229 | // runExpectingFailure re-invokes the current test binary as a subprocess with
            230 | // EXPECT_FAIL set. It expects the subprocess to fail and returns its combined
            231 | // output. If the subprocess unexpectedly passes, the test fails.
            232 | func runExpectingFailure(t *testing.T, failType, testName string) []byte {
            233 | 	t.Helper()
            235 | 	cmd := exec.Command(os.Args[0], "-test.run=^"+testName+"$", "-test.v")
            236 | 	cmd.Env = append(os.Environ(),
            237 | 		"EXPECT_FAIL="+failType,
            238 | 		"HELPER_BIN_DIR="+binDir,
            239 | 	)
            241 | 	out, err := cmd.CombinedOutput()
            242 | 	if err == nil {
            243 | 		t.Fatalf("expected subprocess to fail for %s divergence, but it passed:\n%s", failType, out)
            244 | 	}
            246 | 	return out
            247 | }
