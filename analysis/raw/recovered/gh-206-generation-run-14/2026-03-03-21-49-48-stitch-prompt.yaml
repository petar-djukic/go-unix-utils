            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Differential tests for cat core I/O and error handling.
            5 | //
            6 | // Implements prd006-cat R1.1, R1.2, R5.2, R5.3.
            7 | package main
            9 | import (
            10 | 	"bytes"
            11 | 	"fmt"
            12 | 	"os"
            13 | 	"os/exec"
            14 | 	"path/filepath"
            15 | 	"testing"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            18 | )
            20 | // goBinary is the path to the compiled Go cat binary. Set by TestMain.
            21 | var goBinary string
            23 | // refBinary is the path to the GNU gcat reference binary. Set by TestMain.
            24 | var refBinary string
            26 | // TestMain builds the Go cat binary and locates the gcat reference binary.
            27 | // D2: skip all tests if gcat is not on PATH.
            28 | // D3: build Go cat binary into a temporary directory.
            29 | func TestMain(m *testing.M) {
            30 | 	ref, err := exec.LookPath("gcat")
            31 | 	if err != nil {
            32 | 		fmt.Fprintln(os.Stderr, "gcat not found on PATH; skipping cat differential tests")
            33 | 		os.Exit(0)
            34 | 	}
            35 | 	refBinary = ref
            37 | 	binDir, err := os.MkdirTemp("", "cat-test-*")
            38 | 	if err != nil {
            39 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            40 | 		os.Exit(1)
            41 | 	}
            43 | 	goBinary = filepath.Join(binDir, "cat")
            44 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            45 | 	if out, err := cmd.CombinedOutput(); err != nil {
            46 | 		fmt.Fprintf(os.Stderr, "building Go cat binary: %v\n%s", err, out)
            47 | 		os.RemoveAll(binDir) // best-effort cleanup
            48 | 		os.Exit(1)
            49 | 	}
            51 | 	code := m.Run()
            52 | 	os.RemoveAll(binDir) // best-effort cleanup
            53 | 	os.Exit(code)
            54 | }
            56 | // writeTestFile creates a file with the given content in dir.
            57 | func writeTestFile(t *testing.T, dir, name, content string) {
            58 | 	t.Helper()
            59 | 	if err := os.WriteFile(filepath.Join(dir, name), []byte(content), 0o644); err != nil {
            60 | 		t.Fatalf("writing test file %s: %v", name, err)
            61 | 	}
            62 | }
            64 | // normalizeProgramName replaces "gcat: " with "cat: " in output so stderr
            65 | // from the GNU reference binary and the Go binary can be compared.
            66 | func normalizeProgramName(data []byte) []byte {
            67 | 	return bytes.ReplaceAll(data, []byte("gcat: "), []byte("cat: "))
            68 | }
            70 | // TestCatFileRead verifies R1.1: cat reads named files in argument order
            71 | // and writes their contents to stdout.
            72 | func TestCatFileRead(t *testing.T) {
            73 | 	t.Parallel()
            75 | 	dir := t.TempDir()
            76 | 	writeTestFile(t, dir, "file1.txt", "hello\nworld\n")
            77 | 	writeTestFile(t, dir, "file2.txt", "foo\nbar\n")
            79 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            80 | 		{
            81 | 			Name:     "single-file",
            82 | 			Args:     []string{"file1.txt"},
            83 | 			WorkDir:  dir,
            84 | 			ExitCode: 0,
            85 | 		},
            86 | 		{
            87 | 			Name:     "multi-file-argument-order",
            88 | 			Args:     []string{"file1.txt", "file2.txt"},
            89 | 			WorkDir:  dir,
            90 | 			ExitCode: 0,
            91 | 		},
            92 | 	})
            93 | }
            95 | // TestCatStdinRead verifies R1.2: cat reads from stdin when no file arguments
            96 | // are given and when "-" appears as a file argument.
            97 | func TestCatStdinRead(t *testing.T) {
            98 | 	t.Parallel()
            100 | 	dir := t.TempDir()
            101 | 	writeTestFile(t, dir, "before.txt", "before\n")
            102 | 	writeTestFile(t, dir, "after.txt", "after\n")
            104 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            105 | 		{
            106 | 			Name:     "stdin-no-args",
            107 | 			Stdin:    []byte("from stdin\n"),
            108 | 			ExitCode: 0,
            109 | 		},
            110 | 		{
            111 | 			Name:     "stdin-dash-arg",
            112 | 			Args:     []string{"-"},
            113 | 			Stdin:    []byte("dash stdin\n"),
            114 | 			ExitCode: 0,
            115 | 		},
            116 | 		{
            117 | 			Name:     "stdin-dash-interspersed",
            118 | 			Args:     []string{"before.txt", "-", "after.txt"},
            119 | 			Stdin:    []byte("middle\n"),
            120 | 			WorkDir:  dir,
            121 | 			ExitCode: 0,
            122 | 		},
            123 | 	})
            124 | }
            126 | // TestCatErrorHandling verifies R5.2 and R5.3: cat writes error messages to
            127 | // stderr for nonexistent files, continues processing remaining arguments, and
            128 | // exits with code 1 when any file produces an error.
            129 | func TestCatErrorHandling(t *testing.T) {
            130 | 	t.Parallel()
            132 | 	dir := t.TempDir()
            133 | 	writeTestFile(t, dir, "real.txt", "data\n")
            135 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            136 | 		{
            137 | 			Name:      "nonexistent-file",
            138 | 			Args:      []string{"nonexistent.txt"},
            139 | 			WorkDir:   dir,
            140 | 			ExitCode:  1,
            141 | 			Normalize: []testutils.NormalizeFunc{normalizeProgramName},
