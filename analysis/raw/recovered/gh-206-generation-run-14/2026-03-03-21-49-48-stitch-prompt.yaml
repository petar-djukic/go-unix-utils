            4 | // Package format provides output formatting shared across utilities including
            5 | // human-readable size conversion, ANSI color output, and column alignment.
            6 | //
            7 | // Implements prd003-format (R1-R3).
            8 | package format
            10 | import (
            11 | 	"fmt"
            12 | 	"math"
            13 | )
            15 | // HumanSizeOpts configures the unit system for human-readable size conversion.
            16 | // R3.1: Binary selects between 1024-based and 1000-based unit systems.
            17 | type HumanSizeOpts struct {
            18 | 	// Binary selects 1024-based units with suffixes K/M/G/T/P/E when true
            19 | 	// (the default zero value). When false, selects 1000-based SI units with
            20 | 	// suffixes kB/MB/GB/TB.
            21 | 	Binary bool
            22 | }
            24 | // binarySuffixes are the unit suffixes for 1024-based conversion.
            25 | // R3.2: base-1024 suffixes.
            26 | var binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            28 | // siSuffixes are the unit suffixes for 1000-based SI conversion.
            29 | // R3.2: base-1000 suffixes.
            30 | var siSuffixes = []string{"", "kB", "MB", "GB", "TB"}
            32 | // HumanSize converts a byte count to a human-readable string using the unit
            33 | // system specified by opts. Values less than 10 at the chosen unit are formatted
            34 | // with one decimal place; values 10 or greater use no decimal place.
            35 | // R3.1-R3.4: human-readable size conversion matching GNU coreutils behavior.
            36 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            37 | 	// R3.4: zero returns "0" regardless of unit mode.
            38 | 	if bytes == 0 {
            39 | 		return "0"
            40 | 	}
            42 | 	var base float64
            43 | 	var suffixes []string
            44 | 	if opts.Binary {
            45 | 		base = 1024
            46 | 		suffixes = binarySuffixes
            47 | 	} else {
            48 | 		base = 1000
            49 | 		suffixes = siSuffixes
            50 | 	}
            52 | 	size := float64(bytes)
            53 | 	for i := 0; i < len(suffixes); i++ {
            54 | 		if i == len(suffixes)-1 || math.Abs(size) < base {
            55 | 			if suffixes[i] == "" {
            56 | 				return fmt.Sprintf("%d", bytes)
            57 | 			}
            58 | 			// R3.3: at most one decimal place when value is not integer.
            59 | 			if math.Abs(size) < 10 {
            60 | 				return fmt.Sprintf("%.1f%s", size, suffixes[i])
            61 | 			}
            62 | 			return fmt.Sprintf("%.0f%s", size, suffixes[i])
            63 | 		}
            64 | 		size /= base
            65 | 	}
            67 | 	return fmt.Sprintf("%d", bytes)
            68 | }
