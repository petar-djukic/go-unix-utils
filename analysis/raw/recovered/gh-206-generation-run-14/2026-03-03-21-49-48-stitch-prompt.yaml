            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for RunDiffTests core comparison: stdout, stderr, and exit code
            5 | // matching and divergence detection (prd001-testutils R2.1, R3.2, R3.3, R3.4, R3.6).
            6 | package testutils_test
            8 | import (
            9 | 	"bytes"
            10 | 	"fmt"
            11 | 	"os"
            12 | 	"os/exec"
