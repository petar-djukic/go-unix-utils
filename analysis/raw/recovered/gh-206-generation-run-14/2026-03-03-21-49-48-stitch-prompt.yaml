            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | //go:build darwin || linux
            6 | // Package sys wraps Darwin and Linux syscalls and signal handling. It provides
            7 | // a stable interface that cmd/ packages use to avoid platform-specific code in
            8 | // utility implementations.
            9 | //
            10 | // Implements prd002-sys (R2).
            11 | package sys
            13 | import (
            14 | 	"fmt"
            15 | 	"time"
            17 | 	"golang.org/x/sys/unix"
            18 | )
            20 | // FileMetadata provides platform-independent access to file metadata fields
            21 | // that diverge between Darwin and Linux (modification time from
            22 | // st_mtimespec/st_mtim, disk block count from st_blocks).
            23 | // R2.2, R2.3: abstracts Darwin/Linux stat struct divergence.
            24 | type FileMetadata struct {
            25 | 	modTime time.Time
            26 | 	blocks  int64
            27 | }
            29 | // ModTime returns the file's modification time extracted from the underlying
            30 | // platform-specific stat struct (st_mtimespec on Darwin, st_mtim on Linux).
            31 | // R2.2: modification time accessor.
            32 | func (m *FileMetadata) ModTime() time.Time {
            33 | 	return m.modTime
            34 | }
            36 | // Blocks returns the number of 512-byte blocks allocated for the file,
            37 | // extracted from st_blocks in the underlying stat struct.
            38 | // R2.2: disk block count accessor.
            39 | func (m *FileMetadata) Blocks() int64 {
            40 | 	return m.blocks
            41 | }
            43 | // Stat returns file metadata for the named file, following symbolic links.
            44 | // Equivalent to os.Stat but populates platform-specific fields via
            45 | // golang.org/x/sys/unix.
            46 | // R2.1: stat with symlink resolution.
            47 | func Stat(path string) (*FileMetadata, error) {
            48 | 	var stat unix.Stat_t
            49 | 	if err := unix.Stat(path, &stat); err != nil {
            50 | 		return nil, fmt.Errorf("stat %s: %w", path, err)
            51 | 	}
            52 | 	return newFileMetadata(&stat), nil
            53 | }
            55 | // Lstat returns file metadata for the named file without following symbolic
            56 | // links. Equivalent to os.Lstat but populates platform-specific fields via
            57 | // golang.org/x/sys/unix.
            58 | // R2.1: lstat without symlink resolution.
            59 | func Lstat(path string) (*FileMetadata, error) {
            60 | 	var stat unix.Stat_t
            61 | 	if err := unix.Lstat(path, &stat); err != nil {
            62 | 		return nil, fmt.Errorf("lstat %s: %w", path, err)
            63 | 	}
            64 | 	return newFileMetadata(&stat), nil
            65 | }
