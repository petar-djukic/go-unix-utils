            21 | // goBinary is the path to the compiled Go sponge binary. Set by TestMain.
            22 | var goBinary string
            24 | // refBinary is the path to the moreutils sponge reference binary. Set by TestMain.
            25 | var refBinary string
            27 | // TestMain builds the Go sponge binary and locates the sponge reference binary.
            28 | // D1: skip all tests if sponge is not on PATH.
            29 | // D2: moreutils binaries have no g- prefix; use exec.LookPath("sponge").
            30 | func TestMain(m *testing.M) {
            31 | 	ref, err := exec.LookPath("sponge")
            32 | 	if err != nil {
            33 | 		fmt.Fprintln(os.Stderr, "sponge not found on PATH; skipping sponge differential tests")
            34 | 		os.Exit(0)
            35 | 	}
            36 | 	refBinary = ref
            38 | 	binDir, err := os.MkdirTemp("", "sponge-test-*")
            39 | 	if err != nil {
            40 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            41 | 		os.Exit(1)
            42 | 	}
            44 | 	goBinary = filepath.Join(binDir, "sponge")
            45 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            46 | 	if out, err := cmd.CombinedOutput(); err != nil {
            47 | 		fmt.Fprintf(os.Stderr, "building Go sponge binary: %v\n%s", err, out)
            48 | 		os.RemoveAll(binDir) // best-effort cleanup
            49 | 		os.Exit(1)
            50 | 	}
            52 | 	code := m.Run()
            53 | 	os.RemoveAll(binDir) // best-effort cleanup
            54 | 	os.Exit(code)
            55 | }
