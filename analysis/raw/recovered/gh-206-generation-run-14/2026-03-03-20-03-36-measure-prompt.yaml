        - file: cmd/cat/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the cat utility for concatenating and displaying files.
            5 | //
            6 | // Implements prd006-cat (R1-R5).
            7 | package main
            9 | import (
            10 | 	"bufio"
            11 | 	"errors"
            12 | 	"flag"
            13 | 	"fmt"
            14 | 	"io"
            15 | 	"os"
            16 | 	"os/signal"
            17 | 	"syscall"
            18 | )
            20 | // options holds the parsed command-line flags for cat.
            21 | type options struct {
            22 | 	number          bool
            23 | 	numberNonblank  bool
            24 | 	squeeze         bool
            25 | 	showNonprinting bool
            26 | 	showEnds        bool
            27 | 	showTabs        bool
            28 | }
            30 | // needsLineProcessing reports whether any flag requiring line-by-line
            31 | // processing is active.
            32 | // D4: when false, io.Copy is used for zero-allocation passthrough.
            33 | func (o *options) needsLineProcessing() bool {
            34 | 	return o.number || o.numberNonblank || o.squeeze ||
            35 | 		o.showNonprinting || o.showEnds || o.showTabs
            36 | }
            38 | // catState carries mutable state across file boundaries.
            39 | type catState struct {
            40 | 	lineNumber int
            41 | 	// R3.2: prevBlank persists across files for cross-boundary squeeze.
            42 | 	prevBlank bool
            43 | }
            45 | func main() {
            46 | 	// R5.4: handle SIGPIPE by exiting cleanly.
            47 | 	sigpipe := make(chan os.Signal, 1)
            48 | 	signal.Notify(sigpipe, syscall.SIGPIPE)
            49 | 	go func() {
            50 | 		<-sigpipe
            51 | 		os.Exit(0)
            52 | 	}()
            54 | 	var opts options
            55 | 	flag.BoolVar(&opts.number, "n", false, "number all output lines")
            56 | 	flag.BoolVar(&opts.numberNonblank, "b", false, "number non-blank output lines")
            57 | 	flag.BoolVar(&opts.squeeze, "s", false, "squeeze consecutive blank lines")
            58 | 	flag.BoolVar(&opts.showNonprinting, "v", false, "show non-printing characters")
            59 | 	flag.BoolVar(&opts.showEnds, "E", false, "display $ at end of each line")
            60 | 	flag.BoolVar(&opts.showTabs, "T", false, "display TAB characters as ^I")
            62 | 	showAll := flag.Bool("A", false, "equivalent to -vET")
            63 | 	shortE := flag.Bool("e", false, "equivalent to -vE")
            64 | 	shortT := flag.Bool("t", false, "equivalent to -vT")
            65 | 	// R4.8: -u is accepted but has no effect.
            66 | 	_ = flag.Bool("u", false, "(ignored)")
            68 | 	flag.Parse()
            70 | 	// R4.5: -A is equivalent to -vET.
            71 | 	if *showAll {
            72 | 		opts.showNonprinting = true
            73 | 		opts.showEnds = true
            74 | 		opts.showTabs = true
            75 | 	}
            76 | 	// R4.6: -e is equivalent to -vE.
            77 | 	if *shortE {
            78 | 		opts.showNonprinting = true
            79 | 		opts.showEnds = true
            80 | 	}
            81 | 	// R4.7: -t is equivalent to -vT.
            82 | 	if *shortT {
            83 | 		opts.showNonprinting = true
            84 | 		opts.showTabs = true
            85 | 	}
            87 | 	// R2.3: -b overrides -n.
            88 | 	if opts.numberNonblank {
            89 | 		opts.number = false
            90 | 	}
            92 | 	// R1.2: read from stdin when no file arguments are given.
            93 | 	files := flag.Args()
            94 | 	if len(files) == 0 {
            95 | 		files = []string{"-"}
            96 | 	}
            98 | 	state := &catState{lineNumber: 1}
            99 | 	out := bufio.NewWriter(os.Stdout)
            100 | 	exitCode := 0
            102 | 	for _, name := range files {
            103 | 		if err := catFile(name, out, &opts, state); err != nil {
            104 | 			reportError(name, err)
            105 | 			exitCode = 1
            106 | 		}
            107 | 	}
            109 | 	// R5.3: detect write errors on final flush.
            110 | 	if err := out.Flush(); err != nil {
            111 | 		exitCode = 1
            112 | 	}
            114 | 	os.Exit(exitCode)
            115 | }
            117 | // reportError writes a cat-style error message to stderr.
            118 | // R5.2: per-file error messages to stderr.
            119 | func reportError(name string, err error) {
            120 | 	var pathErr *os.PathError
            121 | 	if errors.As(err, &pathErr) {
            122 | 		fmt.Fprintf(os.Stderr, "cat: %s: %v\n", pathErr.Path, pathErr.Err)
            123 | 	} else {
            124 | 		fmt.Fprintf(os.Stderr, "cat: %s: %v\n", name, err)
            125 | 	}
            126 | }
            128 | // catFile processes a single file argument. "-" means stdin.
            129 | // R1.1: reads named files in argument order.
            130 | // R1.2: reads from stdin when "-" appears as a file argument.
            131 | func catFile(name string, w *bufio.Writer, opts *options, state *catState) error {
            132 | 	var r io.Reader
            133 | 	if name == "-" {
            134 | 		r = os.Stdin
            135 | 	} else {
            136 | 		f, err := os.Open(name)
            137 | 		if err != nil {
            138 | 			return err
            139 | 		}
            140 | 		defer f.Close()
            141 | 		r = f
            142 | 	}
            144 | 	// D4: use io.Copy for zero-allocation passthrough when no flags are active.
            145 | 	if !opts.needsLineProcessing() {
            146 | 		_, err := io.Copy(w, r)
            147 | 		return err
            148 | 	}
            150 | 	return processLines(r, w, opts, state)
            151 | }
            153 | // processLines reads input line by line and applies the active transformations.
            154 | // R4.9: order is squeeze, non-printing display, end marker, line number.
            155 | func processLines(r io.Reader, w *bufio.Writer, opts *options, state *catState) error {
            156 | 	reader := bufio.NewReader(r)
            157 | 	for {
            158 | 		line, err := reader.ReadBytes('\n')
            159 | 		if len(line) > 0 {
            160 | 			if writeErr := writeLine(w, line, opts, state); writeErr != nil {
            161 | 				return writeErr
            162 | 			}
            163 | 		}
            164 | 		if err != nil {
            165 | 			if err == io.EOF {
            166 | 				return nil
            167 | 			}
            168 | 			return err
            169 | 		}
            170 | 	}
            171 | }
            173 | // writeLine applies squeeze, non-printing display, end markers, and line
            174 | // numbering to a single line. The line may or may not end with '\n'.
            175 | func writeLine(w *bufio.Writer, line []byte, opts *options, state *catState) error {
            176 | 	hasNewline := len(line) > 0 && line[len(line)-1] == '\n'
            177 | 	// R2.4: a blank line contains only a newline character.
            178 | 	isBlank := len(line) == 1 && line[0] == '\n'
            180 | 	// R3.1: squeeze consecutive blank lines.
            181 | 	if opts.squeeze && isBlank {
            182 | 		if state.prevBlank {
            183 | 			return nil
            184 | 		}
            185 | 		state.prevBlank = true
            186 | 	} else {
            187 | 		state.prevBlank = false
            188 | 	}
            190 | 	// R2.1, R2.2: prepend line number.
            191 | 	if opts.number || opts.numberNonblank {
            192 | 		if !(opts.numberNonblank && isBlank) {
            193 | 			if _, err := fmt.Fprintf(w, "%6d\t", state.lineNumber); err != nil {
            194 | 				return err
            195 | 			}
            196 | 			state.lineNumber++
            197 | 		}
            198 | 	}
            200 | 	// Process content bytes (everything except trailing newline).
            201 | 	content := line
            202 | 	if hasNewline {
            203 | 		content = line[:len(line)-1]
            204 | 	}
            206 | 	for _, b := range content {
            207 | 		if err := displayByte(w, b, opts); err != nil {
            208 | 			return err
            209 | 		}
            210 | 	}
            212 | 	// R4.3: append $ before newline when -E is active.
            213 | 	if hasNewline {
            214 | 		if opts.showEnds {
            215 | 			if err := w.WriteByte('$'); err != nil {
            216 | 				return err
            217 | 			}
            218 | 		}
            219 | 		if err := w.WriteByte('\n'); err != nil {
            220 | 			return err
            221 | 		}
            222 | 	}
            224 | 	return nil
            225 | }
            227 | // displayByte writes a single byte to the output, applying non-printing
            228 | // display (-v) and tab display (-T) transformations.
            229 | // R4.1: caret and M- notation for non-printing characters.
            230 | // R4.2: tab and newline exempt from -v (newline handled in writeLine).
            231 | // R4.4: tab displayed as ^I when -T is active.
            232 | func displayByte(w *bufio.Writer, b byte, opts *options) error {
            233 | 	if opts.showNonprinting {
            234 | 		if b >= 128 {
            235 | 			if _, err := w.WriteString("M-"); err != nil {
            236 | 				return err
            237 | 			}
            238 | 			b -= 128
            239 | 			// After M- prefix, all control chars use ^X notation without exemption.
            240 | 			if b < 32 {
            241 | 				if err := w.WriteByte('^'); err != nil {
            242 | 					return err
            243 | 				}
            244 | 				return w.WriteByte(b + 64)
            245 | 			}
            246 | 			if b == 127 {
            247 | 				if err := w.WriteByte('^'); err != nil {
            248 | 					return err
            249 | 				}
            250 | 				return w.WriteByte('?')
            251 | 			}
            252 | 			return w.WriteByte(b)
            253 | 		}
            254 | 		// Low bytes: tab exempt from -v unless -T is also active.
            255 | 		if b < 32 {
            256 | 			if b == '\t' && !opts.showTabs {
            257 | 				return w.WriteByte('\t')
            258 | 			}
            259 | 			if err := w.WriteByte('^'); err != nil {
            260 | 				return err
            261 | 			}
            262 | 			return w.WriteByte(b + 64)
            263 | 		}
            264 | 		if b == 127 {
            265 | 			if err := w.WriteByte('^'); err != nil {
            266 | 				return err
            267 | 			}
            268 | 			return w.WriteByte('?')
            269 | 		}
            270 | 		return w.WriteByte(b)
            271 | 	}
            273 | 	// R4.4: -T without -v only affects tabs.
            274 | 	if opts.showTabs && b == '\t' {
            275 | 		if err := w.WriteByte('^'); err != nil {
            276 | 			return err
            277 | 		}
            278 | 		return w.WriteByte('I')
            279 | 	}
            281 | 	return w.WriteByte(b)
            282 | }
        - file: pkg/format/color.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"io"
            8 | 	"os"
            9 | 	"sync"
            10 | 	"syscall"
            11 | 	"unsafe"
            12 | )
            14 | // ANSI escape sequences for file type colorization per GNU ls LS_COLORS defaults.
            15 | // R2.4: color assignments matching GNU ls defaults.
            16 | const (
            17 | 	colorDirectory  = "\033[34m"   // blue
            18 | 	colorSymlink    = "\033[36m"   // cyan
            19 | 	colorExecutable = "\033[32m"   // green
            20 | 	colorBlockDev   = "\033[33;1m" // yellow bold
            21 | 	colorCharDev    = "\033[33;1m" // yellow bold
            22 | 	colorSocket     = "\033[35m"   // magenta
            23 | 	colorPipe       = "\033[33m"   // yellow
            24 | 	colorRegular    = "\033[0m"    // reset/default
            25 | 	colorReset      = "\033[0m"    // reset sequence
            26 | )
            28 | // colorMu protects the colorOverride variable.
            29 | var colorMu sync.RWMutex
            31 | // colorOverride stores the process-global color override. A nil value means
            32 | // automatic TTY detection; a non-nil value forces color on or off.
            33 | // R2.6: process-global override for --color=always and --color=never.
            34 | var colorOverride *bool
            36 | // FileTypeColor returns the ANSI escape sequence for a file's type based on its
            37 | // mode bits. Returns an empty string when color output is disabled.
            38 | // R2.1, R2.4: color lookup for all eight GNU ls file types.
            39 | func FileTypeColor(mode os.FileMode) string {
            40 | 	if !colorActive() {
            41 | 		return ""
            42 | 	}
            43 | 	switch {
            44 | 	case mode.IsDir():
            45 | 		return colorDirectory
            46 | 	case mode&os.ModeSymlink != 0:
            47 | 		return colorSymlink
            48 | 	case mode&os.ModeDevice != 0 && mode&os.ModeCharDevice != 0:
            49 | 		return colorCharDev
            50 | 	case mode&os.ModeDevice != 0:
            51 | 		return colorBlockDev
            52 | 	case mode&os.ModeSocket != 0:
            53 | 		return colorSocket
            54 | 	case mode&os.ModeNamedPipe != 0:
            55 | 		return colorPipe
            56 | 	case mode.IsRegular() && mode.Perm()&0o111 != 0:
            57 | 		return colorExecutable
            58 | 	default:
            59 | 		return colorRegular
            60 | 	}
            61 | }
            63 | // Reset returns the ANSI reset escape sequence that terminates color output.
            64 | // Returns an empty string when color output is disabled.
            65 | // R2.2: reset sequence for terminating color output.
            66 | func Reset() string {
            67 | 	if !colorActive() {
            68 | 		return ""
            69 | 	}
            70 | 	return colorReset
            71 | }
            73 | // ColorEnabled reports whether the given io.Writer is backed by a terminal.
            74 | // It attempts a type assertion to *os.File; if that fails it returns false.
            75 | // Otherwise it checks whether the file descriptor is a terminal via the
            76 | // TIOCGWINSZ ioctl.
            77 | // R2.3: automatic TTY detection for color suppression on non-terminal output.
            78 | func ColorEnabled(w io.Writer) bool {
            79 | 	f, ok := w.(*os.File)
            80 | 	if !ok {
            81 | 		return false
            82 | 	}
            83 | 	return isTerminal(f.Fd())
            84 | }
            86 | // SetColorEnabled overrides the automatic TTY detection. When set to true,
            87 | // FileTypeColor and Reset return ANSI sequences regardless of TTY status.
            88 | // When set to false, they return empty strings regardless.
            89 | // R2.6: process-global override supporting --color=always and --color=never.
            90 | func SetColorEnabled(enabled bool) {
            91 | 	colorMu.Lock()
            92 | 	defer colorMu.Unlock()
            93 | 	colorOverride = &enabled
            94 | }
            96 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting to
            97 | // automatic TTY detection via ColorEnabled.
            98 | // R2.7: revert to automatic detection for test teardown and deferred cleanup.
            99 | func ResetColorEnabled() {
            100 | 	colorMu.Lock()
            101 | 	defer colorMu.Unlock()
            102 | 	colorOverride = nil
            103 | }
            105 | // colorActive reports whether color output is currently enabled, checking the
            106 | // process-global override first and falling back to automatic TTY detection on
            107 | // os.Stdout.
            108 | func colorActive() bool {
            109 | 	colorMu.RLock()
            110 | 	defer colorMu.RUnlock()
            111 | 	if colorOverride != nil {
            112 | 		return *colorOverride
            113 | 	}
            114 | 	return ColorEnabled(os.Stdout)
            115 | }
            117 | // isTerminal reports whether the file descriptor refers to a terminal.
            118 | // R2.3: detected via TIOCGWINSZ ioctl per prd003-format specification.
            119 | func isTerminal(fd uintptr) bool {
            120 | 	// winsize struct: Row, Col, Xpixel, Ypixel (4 × uint16 = 8 bytes).
            121 | 	var ws [8]byte
            122 | 	_, _, errno := syscall.Syscall(syscall.SYS_IOCTL, fd, uintptr(syscall.TIOCGWINSZ), uintptr(unsafe.Pointer(&ws[0]))) //nolint:gosec // ioctl with stack-allocated buffer is safe
            123 | 	return errno == 0
            124 | }
        - file: pkg/format/color_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Tests for prd003-format R2.1-R2.4: FileTypeColor, Reset, ColorEnabled,
            5 | // SetColorEnabled, ResetColorEnabled.
            7 | package format_test
            9 | import (
            10 | 	"bytes"
            11 | 	"os"
            12 | 	"testing"
            14 | 	"github.com/petar-djukic/go-unix-utils/pkg/format"
            15 | )
            17 | // ANSI escape constants matching GNU ls LS_COLORS defaults (prd003 R2.4).
            18 | const (
            19 | 	ansiBlue       = "\033[34m"   // directory
            20 | 	ansiCyan       = "\033[36m"   // symlink
            21 | 	ansiGreen      = "\033[32m"   // executable
            22 | 	ansiYellowBold = "\033[33;1m" // block device, char device
            23 | 	ansiMagenta    = "\033[35m"   // socket
            24 | 	ansiYellow     = "\033[33m"   // pipe
            25 | 	ansiReset      = "\033[0m"    // regular / reset
            26 | )
            28 | // TestFileTypeColor_AllEightTypes verifies that FileTypeColor returns the
            29 | // correct ANSI escape sequence for each of the eight GNU ls file types.
            30 | // R2.1, R2.4: color lookup for directory, symlink, executable, block device,
            31 | // char device, socket, pipe, and regular file.
            32 | func TestFileTypeColor_AllEightTypes(t *testing.T) {
            33 | 	format.SetColorEnabled(true)
            34 | 	defer format.ResetColorEnabled()
            36 | 	tests := []struct {
            37 | 		name string
            38 | 		mode os.FileMode
            39 | 		want string
            40 | 	}{
            41 | 		{"directory", os.ModeDir, ansiBlue},
            42 | 		{"symlink", os.ModeSymlink, ansiCyan},
            43 | 		{"executable", 0o755, ansiGreen},
            44 | 		{"block_device", os.ModeDevice, ansiYellowBold},
            45 | 		{"char_device", os.ModeDevice | os.ModeCharDevice, ansiYellowBold},
            46 | 		{"socket", os.ModeSocket, ansiMagenta},
            47 | 		{"pipe", os.ModeNamedPipe, ansiYellow},
            48 | 		{"regular", 0o644, ansiReset},
            49 | 	}
            50 | 	for _, tc := range tests {
            51 | 		t.Run(tc.name, func(t *testing.T) {
            52 | 			got := format.FileTypeColor(tc.mode)
            53 | 			if got != tc.want {
            54 | 				t.Errorf("FileTypeColor(%v) = %q, want %q", tc.mode, got, tc.want)
            55 | 			}
            56 | 		})
            57 | 	}
            58 | }
            60 | // TestFileTypeColor_ColorDisabled verifies that FileTypeColor returns empty
            61 | // strings for all file types when color output is disabled.
            62 | // R2.1, R2.6: empty strings when SetColorEnabled(false) is active.
            63 | func TestFileTypeColor_ColorDisabled(t *testing.T) {
            64 | 	format.SetColorEnabled(false)
            65 | 	defer format.ResetColorEnabled()
            67 | 	modes := []struct {
            68 | 		name string
            69 | 		mode os.FileMode
            70 | 	}{
            71 | 		{"directory", os.ModeDir},
            72 | 		{"symlink", os.ModeSymlink},
            73 | 		{"executable", 0o755},
            74 | 		{"block_device", os.ModeDevice},
            75 | 		{"char_device", os.ModeDevice | os.ModeCharDevice},
            76 | 		{"socket", os.ModeSocket},
            77 | 		{"pipe", os.ModeNamedPipe},
            78 | 		{"regular", 0o644},
            79 | 	}
            80 | 	for _, tc := range modes {
            81 | 		t.Run(tc.name, func(t *testing.T) {
            82 | 			got := format.FileTypeColor(tc.mode)
            83 | 			if got != "" {
            84 | 				t.Errorf("FileTypeColor(%v) with color disabled = %q, want empty string", tc.mode, got)
            85 | 			}
            86 | 		})
            87 | 	}
            88 | }
            90 | // TestReset_ColorEnabled verifies that Reset returns the ANSI reset sequence
            91 | // when color output is enabled.
            92 | // R2.2: reset sequence for terminating color output.
            93 | func TestReset_ColorEnabled(t *testing.T) {
            94 | 	format.SetColorEnabled(true)
            95 | 	defer format.ResetColorEnabled()
            97 | 	got := format.Reset()
            98 | 	if got != ansiReset {
            99 | 		t.Errorf("Reset() with color enabled = %q, want %q", got, ansiReset)
            100 | 	}
            101 | }
            103 | // TestReset_ColorDisabled verifies that Reset returns an empty string when
            104 | // color output is disabled.
            105 | // R2.2, R2.6: empty string when SetColorEnabled(false) is active.
            106 | func TestReset_ColorDisabled(t *testing.T) {
            107 | 	format.SetColorEnabled(false)
            108 | 	defer format.ResetColorEnabled()
            110 | 	got := format.Reset()
            111 | 	if got != "" {
            112 | 		t.Errorf("Reset() with color disabled = %q, want empty string", got)
            113 | 	}
            114 | }
            116 | // TestColorEnabled_NonFileWriter verifies that ColorEnabled returns false
