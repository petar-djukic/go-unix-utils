            162 | 					}
            163 | 					if !bytes.Equal(expected, actual) {
            164 | 						t.Fatalf("file content divergence: %s\n"+
            165 | 							"expected: %q\n"+
            166 | 							"actual:   %q",
            167 | 							relPath,
            168 | 							expected,
            169 | 							actual,
            170 | 						)
            171 | 					}
            172 | 				}
            173 | 			}
            174 | 		})
            175 | 	}
            176 | }
            178 | // runBinary executes a binary with the given arguments, stdin, environment, and
            179 | // working directory, returning the captured stdout, stderr, and exit code.
            180 | // R2.2: captures stdout, stderr, and exit code independently.
            181 | // R2.3: imposes DefaultTimeout on each invocation.
            182 | func runBinary(binary string, args []string, stdin []byte, env []string, workDir string) (*binResult, error) {
            183 | 	ctx, cancel := context.WithTimeout(context.Background(), DefaultTimeout)
            184 | 	defer cancel()
            186 | 	cmd := exec.CommandContext(ctx, binary, args...)
            187 | 	cmd.Dir = workDir
            188 | 	cmd.Env = env
            190 | 	var stdoutBuf, stderrBuf bytes.Buffer
            191 | 	cmd.Stdout = &stdoutBuf
            192 | 	cmd.Stderr = &stderrBuf
            194 | 	// R1.2: nil stdin means EOF immediately; non-nil provides the bytes.
            195 | 	if stdin != nil {
            196 | 		cmd.Stdin = bytes.NewReader(stdin)
            197 | 	}
            199 | 	runErr := cmd.Run()
            201 | 	// R2.3: check for timeout before inspecting exit code.
            202 | 	if ctx.Err() == context.DeadlineExceeded {
            203 | 		return nil, fmt.Errorf("binary %s exceeded timeout of %v", binary, DefaultTimeout)
            204 | 	}
            206 | 	code := 0
            207 | 	if runErr != nil {
            208 | 		var exitErr *exec.ExitError
            209 | 		if errors.As(runErr, &exitErr) {
            210 | 			code = exitErr.ExitCode()
            211 | 		} else {
            212 | 			return nil, fmt.Errorf("executing %s: %w", binary, runErr)
            213 | 		}
            214 | 	}
            216 | 	return &binResult{
            217 | 		stdout:   stdoutBuf.Bytes(),
            218 | 		stderr:   stderrBuf.Bytes(),
            219 | 		exitCode: code,
            220 | 	}, nil
            221 | }
            223 | // buildEnv constructs the environment for binary execution.
            224 | // R2.6: sets LC_ALL=C by default, then merges DiffTest.Env overrides.
            225 | func buildEnv(testEnv []string) []string {
            226 | 	env := os.Environ()
            227 | 	env = setEnvVar(env, "LC_ALL", "C")
            229 | 	for _, e := range testEnv {
            230 | 		k, v, ok := strings.Cut(e, "=")
            231 | 		if ok {
            232 | 			env = setEnvVar(env, k, v)
            233 | 		}
            234 | 	}
            236 | 	return env
            237 | }
            239 | // setEnvVar sets or replaces a KEY=VALUE pair in the environment slice.
            240 | func setEnvVar(env []string, key, value string) []string {
            241 | 	prefix := key + "="
            242 | 	for i, e := range env {
            243 | 		if strings.HasPrefix(e, prefix) {
            244 | 			env[i] = prefix + value
            245 | 			return env
            246 | 		}
            247 | 	}
            248 | 	return append(env, prefix+value)
            249 | }
            251 | // applyNormalizers applies each NormalizeFunc in order to the data.
            252 | // R4.1, R4.3: functions are applied in sequence.
            253 | func applyNormalizers(data []byte, fns []NormalizeFunc) []byte {
            254 | 	for _, fn := range fns {
            255 | 		data = fn(data)
            256 | 	}
            257 | 	return data
            258 | }
            260 | // ComposeNormalizers returns a single NormalizeFunc that applies the given
            261 | // functions in order.
            262 | // R4.4: convenience for combining multiple normalizers.
            263 | func ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc {
            264 | 	return func(data []byte) []byte {
            265 | 		for _, fn := range fns {
            266 | 			data = fn(data)
            267 | 		}
            268 | 		return data
            269 | 	}
            270 | }
            272 | // timestampPatterns matches common strftime timestamp formats used by ts and
            273 | // other utilities.
            274 | var timestampPatterns = []*regexp.Regexp{
            275 | 	// "Feb 19 12:34:56" — default ts format (%b %d %H:%M:%S)
            276 | 	regexp.MustCompile(`[A-Z][a-z]{2} [ \d]\d \d{2}:\d{2}:\d{2}`),
            277 | 	// "2024-02-19 12:34:56" — ISO-like (%Y-%m-%d %H:%M:%S)
            278 | 	regexp.MustCompile(`\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}`),
            279 | 	// "12:34:56" — time only (%H:%M:%S)
            280 | 	regexp.MustCompile(`\d{2}:\d{2}:\d{2}`),
            281 | }
            283 | // TimestampNormalizer replaces common strftime timestamp patterns with a fixed
            284 | // placeholder string. It handles syslog-style ("Feb 19 12:34:56"), ISO-style
            285 | // ("2024-02-19 12:34:56"), and time-only ("12:34:56") formats.
            286 | // R4.2: built-in normalizer for cmd/ts differential tests.
            287 | func TimestampNormalizer(data []byte) []byte {
            288 | 	result := data
            289 | 	for _, pat := range timestampPatterns {
            290 | 		result = pat.ReplaceAll(result, []byte(timestampPlaceholder))
            291 | 	}
            292 | 	return result
            293 | }
            295 | // truncateStdin returns a displayable representation of stdin, truncated to
            296 | // maxStdinReport bytes per R3.5.
            297 | func truncateStdin(stdin []byte) string {
            298 | 	if stdin == nil {
            299 | 		return "<nil>"
            300 | 	}
            301 | 	if len(stdin) <= maxStdinReport {
            302 | 		return fmt.Sprintf("%q", stdin)
            303 | 	}
            304 | 	return fmt.Sprintf("%q... (%d bytes total)", stdin[:maxStdinReport], len(stdin))
            305 | }
