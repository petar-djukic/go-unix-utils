            215 | 		{"socket", os.ModeSocket, "\033[35m", "socket must be magenta (35)"},
            216 | 		{"pipe", os.ModeNamedPipe, "\033[33m", "pipe must be yellow (33)"},
            217 | 		{"regular", 0o644, "\033[0m", "regular must be reset (0)"},
            218 | 	}
