            136 | 					"stdin: %s\n"+
            137 | 					"ref stdout: %q\n"+
            138 | 					"go  stdout: %q\n"+
            139 | 					"ref stderr: %q\n"+
            140 | 					"go  stderr: %q\n"+
            141 | 					"ref exit code: %d\n"+
            142 | 					"go  exit code: %d",
