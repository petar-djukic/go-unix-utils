            20 | // TestStat_RegularFile verifies that Stat returns correct FileMetadata for a
            21 | // regular file: ModTime within the last 60 seconds and Blocks >= 0.
            22 | // R2.1: stat with symlink resolution on a regular file.
            23 | // R2.2: ModTime and Blocks accessors.
            24 | func TestStat_RegularFile(t *testing.T) {
            25 | 	t.Parallel()
            27 | 	dir := t.TempDir()
            28 | 	path := filepath.Join(dir, "testfile")
            29 | 	if err := os.WriteFile(path, []byte("hello world\n"), 0o644); err != nil {
            30 | 		t.Fatalf("WriteFile: %v", err)
            31 | 	}
            33 | 	meta, err := sys.Stat(path)
            34 | 	if err != nil {
            35 | 		t.Fatalf("Stat(%q): %v", path, err)
            36 | 	}
            38 | 	// AC4: ModTime within the last 60 seconds.
            39 | 	if time.Since(meta.ModTime()) > 60*time.Second {
            40 | 		t.Errorf("ModTime() = %v, want within last 60 seconds", meta.ModTime())
            41 | 	}
            43 | 	// AC5: Blocks >= 0 for a non-empty regular file.
            44 | 	if meta.Blocks() < 0 {
            45 | 		t.Errorf("Blocks() = %d, want >= 0", meta.Blocks())
            46 | 	}
            47 | }
            49 | // TestStat_FollowsSymlink verifies that Stat on a symlink returns metadata of
            50 | // the target file, not the symlink itself. The target's mtime is set to 1 hour
            51 | // ago so it clearly differs from the symlink creation time.
            52 | // R2.1: stat follows symbolic links.
            53 | func TestStat_FollowsSymlink(t *testing.T) {
            54 | 	t.Parallel()
            56 | 	dir := t.TempDir()
            57 | 	target := filepath.Join(dir, "target")
            58 | 	if err := os.WriteFile(target, []byte("target content\n"), 0o644); err != nil {
            59 | 		t.Fatalf("WriteFile: %v", err)
            60 | 	}
            62 | 	// Set target mtime to 1 hour ago so it differs from symlink creation time.
            63 | 	past := time.Now().Add(-1 * time.Hour).Truncate(time.Second)
            64 | 	if err := os.Chtimes(target, past, past); err != nil {
            65 | 		t.Fatalf("Chtimes: %v", err)
            66 | 	}
            68 | 	link := filepath.Join(dir, "link")
            69 | 	if err := os.Symlink(target, link); err != nil {
            70 | 		t.Fatalf("Symlink: %v", err)
            71 | 	}
            73 | 	targetMeta, err := sys.Stat(target)
            74 | 	if err != nil {
            75 | 		t.Fatalf("Stat(target): %v", err)
            76 | 	}
            78 | 	// Stat on the symlink should follow it and return target metadata.
            79 | 	linkMeta, err := sys.Stat(link)
            80 | 	if err != nil {
            81 | 		t.Fatalf("Stat(link): %v", err)
            82 | 	}
            84 | 	if !linkMeta.ModTime().Equal(targetMeta.ModTime()) {
            85 | 		t.Errorf("Stat(link).ModTime() = %v, want %v (same as target)", linkMeta.ModTime(), targetMeta.ModTime())
            86 | 	}
            88 | 	if linkMeta.Blocks() != targetMeta.Blocks() {
            89 | 		t.Errorf("Stat(link).Blocks() = %d, want %d (same as target)", linkMeta.Blocks(), targetMeta.Blocks())
            90 | 	}
            91 | }
            93 | // TestLstat_Symlink verifies that Lstat returns metadata for the symlink itself
            94 | // without following it to the target. The target's mtime is set to 1 hour ago;
            95 | // the symlink's own mtime should be recent and differ from the target's.
            96 | // R2.1: lstat without symlink resolution.
            97 | func TestLstat_Symlink(t *testing.T) {
            98 | 	t.Parallel()
            100 | 	dir := t.TempDir()
            101 | 	target := filepath.Join(dir, "target")
            102 | 	if err := os.WriteFile(target, []byte("target content\n"), 0o644); err != nil {
            103 | 		t.Fatalf("WriteFile: %v", err)
            104 | 	}
            106 | 	// Set target mtime to 1 hour ago so it clearly differs from symlink creation.
            107 | 	past := time.Now().Add(-1 * time.Hour).Truncate(time.Second)
            108 | 	if err := os.Chtimes(target, past, past); err != nil {
            109 | 		t.Fatalf("Chtimes: %v", err)
            110 | 	}
            112 | 	link := filepath.Join(dir, "link")
            113 | 	if err := os.Symlink(target, link); err != nil {
            114 | 		t.Fatalf("Symlink: %v", err)
            115 | 	}
            117 | 	targetMeta, err := sys.Stat(target)
            118 | 	if err != nil {
            119 | 		t.Fatalf("Stat(target): %v", err)
            120 | 	}
            122 | 	// Lstat should return metadata of the symlink, not the target.
            123 | 	lstatMeta, err := sys.Lstat(link)
            124 | 	if err != nil {
            125 | 		t.Fatalf("Lstat(link): %v", err)
            126 | 	}
