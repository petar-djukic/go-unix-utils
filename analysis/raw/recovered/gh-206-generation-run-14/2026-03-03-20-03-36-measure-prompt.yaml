            40 | // arguments, stdin, environment, expected exit code, and expected output.
            41 | // R1.1: all fields per prd001-testutils specification.
            42 | type DiffTest struct {
            43 | 	// Name is the subtest name used with t.Run; required.
            44 | 	Name string
            45 | 	// Args are command-line arguments passed to both binaries.
            46 | 	Args []string
            47 | 	// Stdin provides input data. nil means both binaries receive EOF immediately.
            48 | 	// An empty non-nil slice ([]byte{}) produces no bytes but represents an open
