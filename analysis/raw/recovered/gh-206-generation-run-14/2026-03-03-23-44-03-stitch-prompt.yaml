        - file: cmd/du/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the du utility for reporting recursive directory
            5 | // disk usage.
            6 | //
            7 | // Implements prd009-du (R1.1, R1.2, R1.3, R1.4, R1.5, R4.1, R4.2, R5.1).
            8 | package main
            10 | import (
            11 | 	"errors"
            12 | 	"flag"
            13 | 	"fmt"
            14 | 	"os"
            15 | 	"os/signal"
            16 | 	"syscall"
            18 | 	"github.com/petar-djukic/go-unix-utils/pkg/sys"
            19 | )
            21 | // options holds the parsed command-line flags for du.
            22 | // D3: scaffolding for future flags (-a, -s, -h, -c, -k, -d, etc.).
            23 | type options struct{}
            25 | // reportError writes a du-style error message to stderr.
            26 | // R4.2: per-path error messages to stderr.
            27 | func reportError(path string, err error) {
            28 | 	var pathErr *os.PathError
            29 | 	if errors.As(err, &pathErr) {
            30 | 		fmt.Fprintf(os.Stderr, "du: %s: %v\n", path, pathErr.Err)
            31 | 	} else {
            32 | 		fmt.Fprintf(os.Stderr, "du: %s: %v\n", path, err)
            33 | 	}
            34 | }
            36 | // duArg processes a single command-line argument.
            37 | // R1.1: reads named paths in argument order.
            38 | // R1.5: each argument is traversed independently.
            39 | func duArg(arg string, opts *options) error {
            40 | 	info, err := os.Lstat(arg)
            41 | 	if err != nil {
            42 | 		reportError(arg, err)
            43 | 		return err
            44 | 	}
            46 | 	if !info.IsDir() {
            47 | 		// Non-directory argument: print its own block count as a single line.
            48 | 		meta, err := sys.Lstat(arg)
            49 | 		if err != nil {
            50 | 			reportError(arg, err)
            51 | 			return err
            52 | 		}
            53 | 		fmt.Printf("%d\t%s\n", displayBlocks(meta.Blocks()), arg)
            54 | 		return nil
            55 | 	}
            57 | 	// Directory: depth-first traversal printing per-directory subtotals.
            58 | 	_, hasErr := walkDir(arg, opts)
            59 | 	if hasErr {
            60 | 		return fmt.Errorf("errors during traversal of %s", arg)
            61 | 	}
            62 | 	return nil
            63 | }
            65 | // walkDir recursively traverses a directory, accumulating 512-byte block
            66 | // counts bottom-up. Returns the total raw block count for the subtree and
            67 | // whether any error occurred during traversal.
            68 | // R1.1: recurse into each directory and print accumulated size.
            69 | // R1.4: does not follow symbolic links (uses sys.Lstat and DirEntry.IsDir).
            70 | func walkDir(dirPath string, opts *options) (int64, bool) {
            71 | 	var totalBlocks int64
            72 | 	hasErr := false
            74 | 	// D1: use pkg/sys.Lstat to obtain the directory's own 512-byte block count.
            75 | 	meta, err := sys.Lstat(dirPath)
            76 | 	if err != nil {
            77 | 		reportError(dirPath, err)
            78 | 		return 0, true
            79 | 	}
            80 | 	totalBlocks += meta.Blocks()
            82 | 	// D1: use os.ReadDir for directory listing; DirEntry.IsDir() uses d_type
            83 | 	// from the dirent to avoid a second stat call per entry.
            84 | 	entries, readErr := os.ReadDir(dirPath)
            85 | 	if readErr != nil {
            86 | 		reportError(dirPath, readErr)
            87 | 		hasErr = true
            88 | 	}
            90 | 	for _, entry := range entries {
            91 | 		childPath := joinPath(dirPath, entry.Name())
            93 | 		if entry.IsDir() {
            94 | 			subtotal, childErr := walkDir(childPath, opts)
            95 | 			totalBlocks += subtotal
            96 | 			if childErr {
            97 | 				hasErr = true
            98 | 			}
            99 | 		} else {
            100 | 			// Non-directory: count blocks but do not print in default mode.
            101 | 			childMeta, err := sys.Lstat(childPath)
            102 | 			if err != nil {
            103 | 				reportError(childPath, err)
            104 | 				hasErr = true
            105 | 				continue
            106 | 			}
            107 | 			totalBlocks += childMeta.Blocks()
            108 | 		}
            109 | 	}
            111 | 	// R1.3: print SIZE\tPATH for this directory.
            112 | 	// R1.2: convert from 512-byte blocks to 1024-byte display units.
            113 | 	fmt.Printf("%d\t%s\n", displayBlocks(totalBlocks), dirPath)
            114 | 	return totalBlocks, hasErr
            115 | }
            117 | // joinPath constructs a child path by appending name to a directory path,
            118 | // preserving the argument prefix as given on the command line. Unlike
            119 | // filepath.Join, this does not clean the path (filepath.Join strips "./"
            120 | // prefixes, which changes du output).
            121 | func joinPath(dir, name string) string {
            122 | 	if dir[len(dir)-1] == '/' {
            123 | 		return dir + name
            124 | 	}
            125 | 	return dir + "/" + name
            126 | }
            128 | // displayBlocks converts a 512-byte block count to 1024-byte display units
            129 | // using integer ceiling division: (rawBlocks + 1) / 2.
            130 | // R1.2: 1024-byte block units by default.
            131 | func displayBlocks(rawBlocks int64) int64 {
            132 | 	return (rawBlocks + 1) / 2
            133 | }
            135 | func main() {
            136 | 	// R5.1: handle SIGPIPE by exiting cleanly.
            137 | 	sigpipe := make(chan os.Signal, 1)
            138 | 	signal.Notify(sigpipe, syscall.SIGPIPE)
            139 | 	go func() {
            140 | 		<-sigpipe
            141 | 		os.Exit(0)
            142 | 	}()
            144 | 	var opts options
            145 | 	flag.Parse()
            147 | 	// R1.5: process arguments in command-line order; default to ".".
            148 | 	args := flag.Args()
            149 | 	if len(args) == 0 {
            150 | 		args = []string{"."}
            151 | 	}
            153 | 	exitCode := 0
            154 | 	for _, arg := range args {
            155 | 		if err := duArg(arg, &opts); err != nil {
            156 | 			exitCode = 1
            157 | 		}
            158 | 	}
            160 | 	os.Exit(exitCode)
            161 | }
