            184 | 			ExitCode: 0,
            185 | 		},
            186 | 	})
            187 | }
            189 | // TestDuDefaultArgument verifies R1.5: when no arguments are given, du defaults
            190 | // to ".". Run both binaries with no arguments inside a temporary directory and
            191 | // verify identical output.
            192 | func TestDuDefaultArgument(t *testing.T) {
            193 | 	t.Parallel()
            195 | 	dir := t.TempDir()
            196 | 	buildDirTree(t, dir)
