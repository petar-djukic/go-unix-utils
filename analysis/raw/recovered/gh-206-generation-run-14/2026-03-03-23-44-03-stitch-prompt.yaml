            209 | func TestDuMultipleArguments(t *testing.T) {
            210 | 	t.Parallel()
            212 | 	dir := t.TempDir()
            213 | 	buildDirTree(t, dir)
            215 | 	sub := filepath.Join(dir, "sub")
