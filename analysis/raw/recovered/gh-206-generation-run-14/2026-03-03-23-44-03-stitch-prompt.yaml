            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Differential tests for du core disk usage reporting.
            5 | //
            6 | // Implements prd009-du R1.1, R1.2, R1.3, R1.5.
            7 | package main
            9 | import (
            10 | 	"bytes"
            11 | 	"fmt"
            12 | 	"os"
            13 | 	"os/exec"
            14 | 	"path/filepath"
            15 | 	"testing"
            17 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            18 | )
            20 | // goBinary is the path to the compiled Go du binary. Set by TestMain.
            21 | var goBinary string
            23 | // refBinary is the path to the GNU gdu reference binary. Set by TestMain.
            24 | var refBinary string
            26 | // TestMain builds the Go du binary and locates the gdu reference binary.
            27 | // D1: skip all tests if gdu is not on PATH.
            28 | // D1: build Go du binary into a temporary directory.
            29 | func TestMain(m *testing.M) {
            30 | 	ref, err := exec.LookPath("gdu")
            31 | 	if err != nil {
            32 | 		fmt.Fprintln(os.Stderr, "gdu not found on PATH; skipping du differential tests")
            33 | 		os.Exit(0)
            34 | 	}
            35 | 	refBinary = ref
            37 | 	binDir, err := os.MkdirTemp("", "du-test-*")
            38 | 	if err != nil {
            39 | 		fmt.Fprintf(os.Stderr, "creating bin dir: %v\n", err)
            40 | 		os.Exit(1)
            41 | 	}
            43 | 	goBinary = filepath.Join(binDir, "du")
            44 | 	cmd := exec.Command("go", "build", "-o", goBinary, ".")
            45 | 	if out, err := cmd.CombinedOutput(); err != nil {
            46 | 		fmt.Fprintf(os.Stderr, "building Go du binary: %v\n%s", err, out)
            47 | 		os.RemoveAll(binDir) // best-effort cleanup
            48 | 		os.Exit(1)
            49 | 	}
            51 | 	code := m.Run()
            52 | 	os.RemoveAll(binDir) // best-effort cleanup
            53 | 	os.Exit(code)
            54 | }
            56 | // writeTestFile creates a file with the given content in dir.
            57 | func writeTestFile(t *testing.T, dir, name, content string) {
            58 | 	t.Helper()
            59 | 	if err := os.WriteFile(filepath.Join(dir, name), []byte(content), 0o644); err != nil {
            60 | 		t.Fatalf("writing test file %s: %v", name, err)
            61 | 	}
            62 | }
            64 | // normalizeProgramName replaces "gdu: " with "du: " in output so stderr
            65 | // from the GNU reference binary and the Go binary can be compared.
            66 | func normalizeProgramName(data []byte) []byte {
            67 | 	return bytes.ReplaceAll(data, []byte("gdu: "), []byte("du: "))
            68 | }
            70 | // buildDirTree creates a two-level directory tree for testing recursive
            71 | // traversal. The tree has the structure:
            72 | //
            73 | //	root/
            74 | //	  file1.txt  (small file)
            75 | //	  sub/
            76 | //	    file2.txt  (small file)
            77 | //	    deep/
            78 | //	      file3.txt  (small file)
            79 | //
            80 | // D3: at least two levels of nesting to exercise walkDir recursion.
            81 | func buildDirTree(t *testing.T, root string) {
            82 | 	t.Helper()
            83 | 	sub := filepath.Join(root, "sub")
            84 | 	deep := filepath.Join(sub, "deep")
            85 | 	if err := os.MkdirAll(deep, 0o755); err != nil {
            86 | 		t.Fatalf("creating directory tree: %v", err)
            87 | 	}
            88 | 	writeTestFile(t, root, "file1.txt", "hello world\n")
            89 | 	writeTestFile(t, sub, "file2.txt", "second file content\n")
            90 | 	writeTestFile(t, deep, "file3.txt", "deep nested file\n")
            91 | }
            93 | // buildFlatDir creates a single directory containing only files (no
            94 | // subdirectories) for testing flat directory traversal.
            95 | //
            96 | //	root/
            97 | //	  a.txt
            98 | //	  b.txt
            99 | func buildFlatDir(t *testing.T, root string) {
            100 | 	t.Helper()
            101 | 	writeTestFile(t, root, "a.txt", "alpha\n")
            102 | 	writeTestFile(t, root, "b.txt", "bravo content here\n")
            103 | }
            105 | // TestDuFlatDirectory verifies R1.1 and R1.3: du on a directory containing
            106 | // only files (no subdirectories) prints a single line for the directory itself.
            107 | func TestDuFlatDirectory(t *testing.T) {
            108 | 	t.Parallel()
            110 | 	dir := t.TempDir()
            111 | 	buildFlatDir(t, dir)
            113 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            114 | 		{
            115 | 			Name:     "flat-directory",
            116 | 			Args:     []string{dir},
            117 | 			ExitCode: 0,
            118 | 		},
            119 | 	})
            120 | }
            122 | // TestDuRecursiveTraversal verifies R1.1: du recurses into each directory
            123 | // and prints accumulated size for each subdirectory and the directory itself.
            124 | // Also exercises R1.2 (block unit display) and R1.3 (SIZE\tPATH format)
            125 | // since RunDiffTests compares stdout byte-for-byte.
            126 | func TestDuRecursiveTraversal(t *testing.T) {
            127 | 	t.Parallel()
            129 | 	dir := t.TempDir()
            130 | 	buildDirTree(t, dir)
            132 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            133 | 		{
            134 | 			Name:     "recursive-directory-tree",
            135 | 			Args:     []string{dir},
            136 | 			ExitCode: 0,
            137 | 		},
            138 | 	})
            139 | }
            141 | // TestDuBlockUnits verifies R1.2: both binaries report identical block counts
            142 | // for the same directory tree, confirming the Go implementation's 512-to-1024
            143 | // block conversion matches the reference binary. The byte-for-byte stdout
            144 | // comparison in RunDiffTests confirms block counts agree.
            145 | func TestDuBlockUnits(t *testing.T) {
            146 | 	t.Parallel()
            148 | 	dir := t.TempDir()
            149 | 	buildDirTree(t, dir)
            151 | 	// Run on a subdirectory to verify block counts at a different tree level.
            152 | 	sub := filepath.Join(dir, "sub")
            154 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            155 | 		{
            156 | 			Name:     "block-units-subdirectory",
            157 | 			Args:     []string{sub},
            158 | 			ExitCode: 0,
            159 | 		},
            160 | 	})
            161 | }
            163 | // TestDuOutputFormat verifies R1.3: each output line is "SIZE\tPATH\n" for both
            164 | // directory and non-directory file arguments.
            165 | // D3: tests both directory and non-directory arguments to exercise both branches
            166 | // of duArg.
            167 | func TestDuOutputFormat(t *testing.T) {
            168 | 	t.Parallel()
            170 | 	dir := t.TempDir()
            171 | 	buildDirTree(t, dir)
            173 | 	filePath := filepath.Join(dir, "file1.txt")
            175 | 	testutils.RunDiffTests(t, goBinary, refBinary, []testutils.DiffTest{
            176 | 		{
            177 | 			Name:     "format-directory-arg",
            178 | 			Args:     []string{dir},
            179 | 			ExitCode: 0,
            180 | 		},
            181 | 		{
            182 | 			Name:     "format-non-directory-arg",
