                  inputs:
                    args: ["-lh", "--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: LsNormalizer replaces mtime column with MTIME placeholder
                  expected:
                    exit_code: 0
                    stdout_structure: long format with sizes like "1.0K", "1.5K", "1.0M" instead of byte counts
                    stderr: ""
                  traces:
                    - prd008-ls R5.1
                    - prd008-ls R5.2
                - name: ls_filter_all
                  description: -a includes all entries including . and .. and dotfiles.
                  inputs:
                    args: ["-a", "--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
