                    stderr: ""
                  traces:
                    - prd004-ts R1.1
                    - prd004-ts R1.2
                    - prd004-ts R1.4
                - name: default_format_empty_stdin
                  description: Empty stdin produces no output and exits 0.
                  inputs:
                    args: []
                    stdin: ""
                    env: []
