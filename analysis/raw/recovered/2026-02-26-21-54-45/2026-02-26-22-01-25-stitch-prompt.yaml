                - name: custom_strftime_format
                  description: Custom strftime format string "%Y-%m-%dT%H:%M:%S".
                  inputs:
                    args: ["%Y-%m-%dT%H:%M:%S"]
                    stdin: "hello\nworld\n"
                    env: []
                  normalization: TimestampNormalizer replaces ISO-8601 datetime prefix with "TIMESTAMP"
                  expected:
