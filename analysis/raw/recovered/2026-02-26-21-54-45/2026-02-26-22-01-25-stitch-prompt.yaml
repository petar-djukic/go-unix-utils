            - file: docs/specs/test-suites/test-rel02.0.yaml
              id: test-rel02.0
              title: 'Test Suite: rel02.0 — ls core and du specification and differential tests'
              release: rel02.0
              traces:
                - rel02.0-uc001-ls
                - rel02.0-uc002-du
                - prd008-ls R1
                - prd008-ls R2
                - prd008-ls R3
                - prd008-ls R4
                - prd008-ls R5
                - prd008-ls R6
                - prd008-ls R7
                - prd009-du R1
                - prd009-du R2
                - prd009-du R3
                - prd009-du R4
                - prd009-du R5
              preconditions:
                - Binaries exist under ./bin/ (built via mage build).
                - Reference binaries are installed via Homebrew gls (coreutils) and gdu (coreutils).
                - Tests are run via go test ./cmd/<utility>/... which invokes RunDiffTests from pkg/testutils.
                - All tests use LC_ALL=C to eliminate locale-dependent divergence.
                - 'ls: all differential tests use --color=never to eliminate ANSI escape variance (except color-specific structural tests).'
                - 'ls: for -l tests, the LsNormalizer replaces the mtime column with the placeholder MTIME before comparison.'
                - 'ls: tests use a fixture directory (testdata/ls-fixture/) containing regular files of known sizes, a subdirectory, dotfiles, a symbolic link, and files with known permissions.'
                - 'du: no normalization is applied; du output is deterministic when both binaries run on the same directory on the same filesystem.'
                - 'du: all block-count tests use -k to pin output to 1024-byte blocks and eliminate platform default divergence.'
                - 'du: tests use a fixture directory (testdata/du-fixture/) containing nested files of known sizes, a second subdirectory for multi-argument tests, and files of varied sizes.'
                - 'du: hard-link pairs are created in test setup (not committed) to test dedup. All files in the fixture are on the same filesystem as the test runner.'
              test_cases:
                - name: ls_default_single_col_redirect
                  description: No flags, stdout redirected (not a TTY); one entry per line in C locale order. stdout is a pipe (not TTY), so default format is single-column
                  inputs:
                    args: ["--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout_structure: one entry per line, sorted in C locale order, no dotfiles
                    stderr: ""
                  traces:
                    - prd008-ls R1.2
                    - prd008-ls R1.3
                    - prd008-ls R1.4
                - name: ls_default_multi_col_tty
                  description: Default on TTY (or forced with -C and --width=80); multi-column output. -C forces multi-column even without TTY; -w 80 sets column width
                  inputs:
                    args: ["-C", "--color=never", "-w", "80", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout_structure: entries arranged in columns fitting within 80 characters
                    stderr: ""
                  traces:
                    - prd008-ls R1.1
                - name: ls_single_col_flag
                  description: -1 forces single-column output regardless of TTY.
                  inputs:
                    args: ["-1", "--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: none
                  expected:
                    exit_code: 0
                    stdout_structure: one entry per line, sorted in C locale order
                    stderr: ""
                  traces:
                    - prd008-ls R2.1
                - name: ls_long_format
                  description: -l produces long format with permissions, nlink, owner, group, size, mtime, name.
                  inputs:
                    args: ["-l", "--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: LsNormalizer replaces mtime column with MTIME placeholder
                  expected:
                    exit_code: 0
                    stdout_structure: |
                        "total N" line followed by one long-format line per entry.
                        Each line has: type+perms, nlink, owner, group, size, MTIME, name.
                    stderr: ""
                  traces:
                    - prd008-ls R2.2
                    - prd008-ls R2.3
                    - prd008-ls R2.4
                    - prd008-ls R2.5
                    - prd008-ls R2.6
                    - prd008-ls R2.7
                    - prd008-ls R2.9
                - name: ls_long_format_symlink
                  description: -l on a directory containing a symlink shows "name -> target".
                  inputs:
                    args: ["-l", "--color=never", "testdata/ls-fixture/"]
                    stdin: null
                    env: ["LC_ALL=C"]
                  normalization: LsNormalizer replaces mtime column with MTIME placeholder
                  expected:
