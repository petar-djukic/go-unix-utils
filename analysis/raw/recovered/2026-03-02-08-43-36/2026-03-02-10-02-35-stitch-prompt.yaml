            13 | // WinSize holds terminal dimensions as reported by the TIOCGWINSZ ioctl.
            14 | // The struct layout matches C's struct winsize (rows and cols fields).
            15 | // (prd002-sys R1)
            16 | type WinSize struct {
            17 | 	Rows uint16 // terminal row count
            18 | 	Cols uint16 // terminal column count
            19 | }
            21 | // IsTerminal reports whether the file descriptor refers to a terminal.
            22 | // Detection uses the TIOCGWINSZ ioctl: a successful call indicates a terminal;
            23 | // any error indicates a non-terminal fd (pipe, regular file, etc.).
            24 | // (prd002-sys R1.3)
            25 | func IsTerminal(fd uintptr) bool {
            26 | 	var ws [8]byte // struct winsize: 4 x uint16 = 8 bytes
            27 | 	_, _, errno := syscall.Syscall(syscall.SYS_IOCTL, fd, syscall.TIOCGWINSZ, uintptr(unsafe.Pointer(&ws[0])))
            28 | 	return errno == 0
            29 | }
            31 | // GetWinSize returns the terminal dimensions (rows and columns) for the given
            32 | // file descriptor by reading the TIOCGWINSZ ioctl result. Returns an error if
            33 | // the fd is not a terminal.
            34 | // (prd002-sys R1)
            35 | func GetWinSize(fd uintptr) (WinSize, error) {
            36 | 	// C struct winsize: rows (uint16), cols (uint16), xpixel (uint16), ypixel (uint16).
            37 | 	type winsize struct {
            38 | 		rows   uint16
            39 | 		cols   uint16
            40 | 		xpixel uint16
            41 | 		ypixel uint16
            42 | 	}
            43 | 	var ws winsize
            44 | 	_, _, errno := syscall.Syscall(syscall.SYS_IOCTL, fd, syscall.TIOCGWINSZ, uintptr(unsafe.Pointer(&ws)))
            45 | 	if errno != 0 {
            46 | 		return WinSize{}, fmt.Errorf("get terminal size: %w", errno)
            47 | 	}
            48 | 	return WinSize{Rows: ws.rows, Cols: ws.cols}, nil
