          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Implements: prd003-format (R1)
            5 | package format
            7 | import (
            8 | 	"strings"
            9 | 	"unicode/utf8"
            10 | )
            12 | // columnSeparatorWidth is the number of spaces inserted between adjacent columns
            13 | // in tabular output, matching GNU ls column spacing. (prd003-format R1.1)
            14 | const columnSeparatorWidth = 2
            16 | // displayWidth returns the display width of s in terminal columns, computed as
            17 | // the rune count. East-asian full-width character handling is deferred; rune
            18 | // count is sufficient for ASCII-dominant utility output in the current roadmap.
            19 | // (prd003-format R1.3)
            20 | func displayWidth(s string) int {
            21 | 	return utf8.RuneCountInString(s)
            22 | }
            24 | // PadRight returns s padded with trailing spaces to the specified display width.
            25 | // If s is already at least width runes wide, it is returned unchanged. Width is
            26 | // measured in runes, not bytes, to handle multi-byte UTF-8 correctly.
            27 | // (prd003-format R1.2, R1.3)
            28 | func PadRight(s string, width int) string {
            29 | 	dw := displayWidth(s)
            30 | 	if dw >= width {
            31 | 		return s
            32 | 	}
            33 | 	return s + strings.Repeat(" ", width-dw)
            34 | }
            36 | // PadLeft returns s padded with leading spaces to the specified display width.
            37 | // If s is already at least width runes wide, it is returned unchanged. Width is
            38 | // measured in runes, not bytes, to handle multi-byte UTF-8 correctly.
            39 | // (prd003-format R1.2, R1.3)
            40 | func PadLeft(s string, width int) string {
            41 | 	dw := displayWidth(s)
            42 | 	if dw >= width {
            43 | 		return s
            44 | 	}
            45 | 	return strings.Repeat(" ", width-dw) + s
            46 | }
            48 | // Columns distributes entries into the maximum number of columns that fit within
            49 | // termWidth, using the longest entry in each column to determine column width.
            50 | // Entries are filled row-by-row (across layout, matching gls --format=across).
            51 | // Adjacent columns are separated by two spaces. Returns nil for empty input.
            52 | // (prd003-format R1.1, R1.4)
            53 | func Columns(entries []string, termWidth int) [][]string {
            54 | 	if len(entries) == 0 {
            55 | 		return nil
            56 | 	}
            58 | 	// Pre-compute display widths for all entries. (prd003-format R1.3)
            59 | 	widths := make([]int, len(entries))
            60 | 	for i, e := range entries {
            61 | 		widths[i] = displayWidth(e)
            62 | 	}
            64 | 	// Single entry: one column, one row.
            65 | 	if len(entries) == 1 {
            66 | 		return [][]string{{entries[0]}}
            67 | 	}
            69 | 	// Upper bound on column count: each column needs at least 1 character, and
            70 | 	// all but the last column need a 2-space separator.
            71 | 	maxCols := len(entries)
            72 | 	upperBound := (termWidth + columnSeparatorWidth) / (1 + columnSeparatorWidth)
            73 | 	if maxCols > upperBound {
            74 | 		maxCols = upperBound
            75 | 	}
            76 | 	if maxCols < 1 {
            77 | 		maxCols = 1
            78 | 	}
            80 | 	// Try from maximum possible columns down to 1. The first (highest) column
            81 | 	// count whose total width fits within termWidth is optimal. (prd003-format R1.1)
            82 | 	bestCols := 1
            83 | 	for nCols := maxCols; nCols >= 2; nCols-- {
            84 | 		colWidths := columnWidths(widths, nCols)
            85 | 		total := totalWidth(colWidths)
            86 | 		if total <= termWidth {
            87 | 			bestCols = nCols
            88 | 			break
            89 | 		}
            90 | 	}
            92 | 	// Build the result grid with across (row-by-row) distribution.
            93 | 	nRows := (len(entries) + bestCols - 1) / bestCols
            94 | 	result := make([][]string, nRows)
            95 | 	for r := 0; r < nRows; r++ {
            96 | 		row := make([]string, 0, bestCols)
            97 | 		for c := 0; c < bestCols; c++ {
            98 | 			idx := r*bestCols + c
            99 | 			if idx < len(entries) {
            100 | 				row = append(row, entries[idx])
            101 | 			}
            102 | 		}
            103 | 		result[r] = row
            104 | 	}
            105 | 	return result
            106 | }
            108 | // columnWidths computes the maximum display width of entries in each column
            109 | // for an across (row-by-row) distribution with nCols columns. (prd003-format R1.1)
            110 | func columnWidths(widths []int, nCols int) []int {
            111 | 	colW := make([]int, nCols)
            112 | 	for i, w := range widths {
            113 | 		col := i % nCols
            114 | 		if w > colW[col] {
            115 | 			colW[col] = w
            116 | 		}
            117 | 	}
            118 | 	return colW
            119 | }
            121 | // totalWidth returns the total display width of a column layout: the sum of all
            122 | // column widths plus two-space separators between adjacent columns.
            123 | // (prd003-format R1.1)
            124 | func totalWidth(colWidths []int) int {
            125 | 	total := 0
            126 | 	for i, w := range colWidths {
            127 | 		total += w
            128 | 		if i < len(colWidths)-1 {
            129 | 			total += columnSeparatorWidth
            130 | 		}
            131 | 	}
            132 | 	return total
            133 | }
