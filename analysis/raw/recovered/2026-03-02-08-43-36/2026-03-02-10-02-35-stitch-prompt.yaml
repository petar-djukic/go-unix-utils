            61 | // TimestampNormalizer replaces common strftime timestamp patterns with the fixed
            62 | // placeholder "<TIMESTAMP>". Used by cmd/ts tests to normalize wall-clock
            63 | // differences. (prd001-testutils R4.2)
            64 | var TimestampNormalizer NormalizeFunc = func(b []byte) []byte {
            65 | 	s := string(b)
            66 | 	for _, re := range timestampPatterns {
            67 | 		s = re.ReplaceAllString(s, "<TIMESTAMP>")
            68 | 	}
            69 | 	return []byte(s)
            70 | }
            72 | // timestampPatterns matches common strftime-formatted timestamps, ordered from
            73 | // most specific to least specific so longer matches are replaced first.
            74 | var timestampPatterns = []*regexp.Regexp{
            75 | 	// "%b %d %H:%M:%S" — e.g., "Feb 19 12:34:56"
            76 | 	regexp.MustCompile(`[A-Z][a-z]{2}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}`),
