          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package format provides output formatting shared across go-unix-utils utilities
            5 | // including column alignment, ANSI color output, and human-readable size conversion.
            6 | //
            7 | // Implements: prd003-format (R3)
            8 | package format
            10 | import "fmt"
            12 | // HumanSizeOpts configures the behavior of HumanSize.
            13 | // (prd003-format R3.1)
            14 | type HumanSizeOpts struct {
            15 | 	Binary bool // true = 1024-based with suffixes K/M/G/T/P/E; false = SI 1000-based with suffixes kB/MB/GB/TB
            16 | }
            18 | // binarySuffixes are the unit suffixes for 1024-based human-readable sizes.
            19 | // (prd003-format R3.2)
            20 | var binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            22 | // siSuffixes are the unit suffixes for 1000-based (SI) human-readable sizes.
            23 | // (prd003-format R3.2)
            24 | var siSuffixes = []string{"", "kB", "MB", "GB", "TB"}
            26 | // HumanSize converts a byte count to a human-readable string. When opts.Binary
            27 | // is true, it uses base 1024 with suffixes K/M/G/T/P/E. When opts.Binary is
            28 | // false, it uses base 1000 with suffixes kB/MB/GB/TB. Output uses at most one
            29 | // decimal place. Zero bytes returns "0" regardless of mode.
            30 | // (prd003-format R3.1, R3.2, R3.3, R3.4, R3.5, R3.6)
            31 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            32 | 	if bytes == 0 {
            33 | 		return "0"
            34 | 	}
            36 | 	base := 1000.0
            37 | 	suffixes := siSuffixes
            38 | 	if opts.Binary {
            39 | 		base = 1024.0
            40 | 		suffixes = binarySuffixes
            41 | 	}
            43 | 	value := float64(bytes)
            44 | 	for i, suffix := range suffixes {
            45 | 		if i == len(suffixes)-1 || value < base {
            46 | 			if suffix == "" {
            47 | 				return fmt.Sprintf("%d", int64(value))
            48 | 			}
            49 | 			return fmt.Sprintf("%.1f%s", value, suffix)
            50 | 		}
            51 | 		value /= base
            52 | 	}
            54 | 	// Unreachable: the loop always returns via the last-suffix or under-base check.
            55 | 	return "0"
            56 | }
