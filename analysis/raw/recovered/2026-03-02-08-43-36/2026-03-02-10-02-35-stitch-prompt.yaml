          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package testutils
            6 | import (
            7 | 	"bytes"
            8 | 	"context"
            9 | 	"errors"
            10 | 	"fmt"
            11 | 	"os"
            12 | 	"os/exec"
            13 | 	"path/filepath"
            14 | 	"strings"
            15 | 	"testing"
            16 | )
            18 | // runSingleDiffTest executes a single differential test case, running both
            19 | // binaries with identical inputs and comparing their outputs.
            20 | func runSingleDiffTest(t *testing.T, goBinary, refBinary string, tc DiffTest) {
            21 | 	t.Helper()
            23 | 	workDir := tc.WorkDir
            24 | 	if workDir == "" {
            25 | 		workDir = t.TempDir()
            26 | 	}
            28 | 	env := buildEnv(tc.Env)
            30 | 	// Run reference binary with its own timeout context. (prd001-testutils R2.1, R2.2, R2.3)
            31 | 	refCtx, refCancel := context.WithTimeout(context.Background(), DefaultTimeout)
            32 | 	defer refCancel()
            33 | 	refResult, err := runBinary(refCtx, refBinary, tc.Args, tc.Stdin, env, workDir)
            34 | 	if err != nil {
            35 | 		t.Fatalf("reference binary: %v", err)
            36 | 	}
            38 | 	// Run Go binary with its own timeout context. (prd001-testutils R2.1, R2.2, R2.3)
            39 | 	goCtx, goCancel := context.WithTimeout(context.Background(), DefaultTimeout)
            40 | 	defer goCancel()
            41 | 	goResult, err := runBinary(goCtx, goBinary, tc.Args, tc.Stdin, env, workDir)
            42 | 	if err != nil {
            43 | 		t.Fatalf("go binary: %v", err)
            44 | 	}
            46 | 	// Apply normalizers to stdout and stderr of both binaries. (prd001-testutils R3.1, R4.1, R4.3)
            47 | 	refStdout := applyNormalizers(refResult.stdout, tc.Normalize)
            48 | 	refStderr := applyNormalizers(refResult.stderr, tc.Normalize)
            49 | 	goStdout := applyNormalizers(goResult.stdout, tc.Normalize)
            50 | 	goStderr := applyNormalizers(goResult.stderr, tc.Normalize)
            52 | 	// Compare stdout, stderr, and exit code. (prd001-testutils R3.2, R3.3, R3.4)
            53 | 	if !bytes.Equal(refStdout, goStdout) || !bytes.Equal(refStderr, goStderr) || refResult.exitCode != goResult.exitCode {
            54 | 		t.Fatal(formatDivergence(tc, refStdout, goStdout, refStderr, goStderr, refResult.exitCode, goResult.exitCode))
            55 | 	}
            57 | 	// Compare expected files. (prd001-testutils R5.1, R5.2)
            58 | 	compareExpectedFiles(t, tc.ExpectedFiles, workDir)
            59 | }
            61 | // runBinary invokes a binary with the given arguments, stdin, environment,
            62 | // and working directory. It captures stdout, stderr, and exit code.
            63 | func runBinary(ctx context.Context, binary string, args []string, stdin []byte, env []string, workDir string) (diffResult, error) {
            64 | 	cmd := exec.CommandContext(ctx, binary, args...)
            65 | 	cmd.Dir = workDir
            66 | 	cmd.Env = env
            68 | 	var stdoutBuf, stderrBuf bytes.Buffer
            69 | 	cmd.Stdout = &stdoutBuf
            70 | 	cmd.Stderr = &stderrBuf
            72 | 	if stdin != nil {
            73 | 		cmd.Stdin = bytes.NewReader(stdin)
            74 | 	}
            76 | 	err := cmd.Run()
            77 | 	exitCode := 0
            78 | 	if err != nil {
            79 | 		if ctx.Err() != nil {
            80 | 			return diffResult{}, fmt.Errorf("binary %s timed out after %v", binary, DefaultTimeout)
            81 | 		}
            82 | 		var exitErr *exec.ExitError
            83 | 		if errors.As(err, &exitErr) {
            84 | 			exitCode = exitErr.ExitCode()
            85 | 		} else {
            86 | 			return diffResult{}, fmt.Errorf("executing %s: %w", binary, err)
            87 | 		}
            88 | 	}
            90 | 	return diffResult{
            91 | 		stdout:   stdoutBuf.Bytes(),
            92 | 		stderr:   stderrBuf.Bytes(),
            93 | 		exitCode: exitCode,
            94 | 	}, nil
            95 | }
            97 | // buildEnv constructs the environment for binary invocation. It starts with the
            98 | // current process environment, applies LC_ALL=C as the default, then merges any
            99 | // caller-provided KEY=VALUE pairs on top. (prd001-testutils R2.6)
            100 | func buildEnv(testEnv []string) []string {
            101 | 	env := os.Environ()
            102 | 	env = setEnvVar(env, "LC_ALL", "C")
            103 | 	for _, e := range testEnv {
            104 | 		if k, v, ok := strings.Cut(e, "="); ok {
            105 | 			env = setEnvVar(env, k, v)
            106 | 		}
            107 | 	}
            108 | 	return env
            109 | }
            111 | // setEnvVar sets or overrides an environment variable in the given slice.
            112 | func setEnvVar(env []string, key, value string) []string {
            113 | 	prefix := key + "="
            114 | 	for i, e := range env {
            115 | 		if strings.HasPrefix(e, prefix) {
            116 | 			env[i] = prefix + value
            117 | 			return env
            118 | 		}
            119 | 	}
            120 | 	return append(env, prefix+value)
            121 | }
            123 | // applyNormalizers applies each normalizer function in order to the given bytes.
            124 | func applyNormalizers(b []byte, fns []NormalizeFunc) []byte {
            125 | 	for _, fn := range fns {
            126 | 		b = fn(b)
            127 | 	}
            128 | 	return b
            129 | }
            131 | // maxStdinDisplay is the maximum number of stdin bytes shown in failure messages.
            132 | const maxStdinDisplay = 256
            134 | // formatDivergence builds a failure message that includes the triggering input
            135 | // and both binaries' outputs. (prd001-testutils R3.5)
            136 | func formatDivergence(tc DiffTest, refStdout, goStdout, refStderr, goStderr []byte, refExit, goExit int) string {
            137 | 	return fmt.Sprintf("divergence detected\n"+
            138 | 		"  args:       %v\n"+
            139 | 		"  stdin:      %s\n"+
            140 | 		"  ref stdout: %q\n"+
            141 | 		"  go  stdout: %q\n"+
            142 | 		"  ref stderr: %q\n"+
            143 | 		"  go  stderr: %q\n"+
            144 | 		"  ref exit:   %d\n"+
            145 | 		"  go  exit:   %d",
            146 | 		tc.Args,
            147 | 		truncateBytes(tc.Stdin, maxStdinDisplay),
            148 | 		refStdout,
            149 | 		goStdout,
            150 | 		refStderr,
            151 | 		goStderr,
            152 | 		refExit,
            153 | 		goExit,
            154 | 	)
            155 | }
            157 | // truncateBytes returns a quoted string representation of b, truncated to
            158 | // maxLen bytes if longer.
            159 | func truncateBytes(b []byte, maxLen int) string {
            160 | 	if b == nil {
            161 | 		return "<nil>"
            162 | 	}
            163 | 	if len(b) <= maxLen {
            164 | 		return fmt.Sprintf("%q", b)
            165 | 	}
            166 | 	return fmt.Sprintf("%q...(truncated, %d bytes total)", b[:maxLen], len(b))
            167 | }
            169 | // compareExpectedFiles checks that each expected file exists and has the correct
            170 | // content after binary execution. (prd001-testutils R5.1, R5.2)
            171 | func compareExpectedFiles(t *testing.T, expected map[string][]byte, workDir string) {
            172 | 	t.Helper()
            173 | 	if expected == nil {
            174 | 		return
            175 | 	}
            176 | 	for path, expectedContent := range expected {
            177 | 		fullPath := filepath.Join(workDir, path)
            178 | 		actual, err := os.ReadFile(fullPath)
            179 | 		if err != nil {
            180 | 			t.Fatalf("expected file %s: %v", path, err)
            181 | 		}
            182 | 		if !bytes.Equal(expectedContent, actual) {
            183 | 			t.Fatalf("file content divergence\n"+
            184 | 				"  file:     %s\n"+
            185 | 				"  expected: %q\n"+
            186 | 				"  actual:   %q",
            187 | 				path,
            188 | 				expectedContent,
            189 | 				actual,
            190 | 			)
            191 | 		}
            192 | 	}
            193 | }
