          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Implements: prd003-format (R2)
            5 | package format
            7 | import (
            8 | 	"io"
            9 | 	"os"
            10 | 	"sync"
            11 | 	"syscall"
            12 | 	"unsafe"
            13 | )
            15 | // ANSI SGR escape sequences for file types, matching GNU ls LS_COLORS defaults.
            16 | // (prd003-format R2.4)
            17 | const (
            18 | 	ansiReset    = "\033[0m"
            19 | 	ansiDir      = "\033[34m"    // blue
            20 | 	ansiSymlink  = "\033[36m"    // cyan
            21 | 	ansiExec     = "\033[32m"    // green
            22 | 	ansiBlock    = "\033[33;1m"  // yellow bold
            23 | 	ansiChar     = "\033[33;1m"  // yellow bold
            24 | 	ansiSocket   = "\033[35m"    // magenta
            25 | 	ansiPipe     = "\033[33m"    // yellow
            26 | 	ansiRegular  = "\033[0m"     // reset/default
            27 | 	ansiSetuid   = "\033[37;41m" // white on red
            28 | 	ansiSetgid   = "\033[30;43m" // black on yellow
            29 | 	ansiSticky   = "\033[37;44m" // white on blue
            30 | 	ansiOW       = "\033[34;42m" // blue on green (other-writable directory)
            31 | 	ansiStickyOW = "\033[30;42m" // black on green (sticky + other-writable directory)
            32 | )
            34 | // colorMode represents the three-state color override: auto-detect, forced on,
            35 | // or forced off. (prd003-format R2.6, R2.7)
            36 | type colorMode int
            38 | const (
            39 | 	colorAuto     colorMode = iota // detect via TTY check on stdout
            40 | 	colorForceOn                   // --color=always
            41 | 	colorForceOff                  // --color=never
            42 | )
            44 | var (
            45 | 	activeColorMode = colorAuto
            46 | 	colorMu         sync.Mutex
            47 | )
            49 | // FileTypeColor returns the ANSI escape sequence for the given file mode.
            50 | // Returns an empty string when color output is disabled. Checks permission-based
            51 | // overrides (setuid, setgid, sticky, other-writable) before file type.
            52 | // (prd003-format R2.1, R2.4, R2.6)
            53 | func FileTypeColor(mode os.FileMode) string {
            54 | 	if !colorActive() {
            55 | 		return ""
            56 | 	}
            58 | 	// Permission-based overrides have highest priority (per GNU ls).
            59 | 	if mode&os.ModeSetuid != 0 {
            60 | 		return ansiSetuid
            61 | 	}
            62 | 	if mode&os.ModeSetgid != 0 {
            63 | 		return ansiSetgid
            64 | 	}
            66 | 	// Directory variants with sticky and other-writable combinations.
            67 | 	if mode.IsDir() {
            68 | 		if mode&os.ModeSticky != 0 && mode&0002 != 0 {
            69 | 			return ansiStickyOW
            70 | 		}
            71 | 		if mode&0002 != 0 {
            72 | 			return ansiOW
            73 | 		}
            74 | 		if mode&os.ModeSticky != 0 {
            75 | 			return ansiSticky
            76 | 		}
            77 | 		return ansiDir
            78 | 	}
            80 | 	// File type determination.
            81 | 	typ := mode.Type()
            82 | 	switch {
            83 | 	case typ&os.ModeSymlink != 0:
            84 | 		return ansiSymlink
            85 | 	case typ&os.ModeNamedPipe != 0:
            86 | 		return ansiPipe
            87 | 	case typ&os.ModeSocket != 0:
            88 | 		return ansiSocket
            89 | 	case typ&os.ModeDevice != 0 && typ&os.ModeCharDevice != 0:
            90 | 		return ansiChar
            91 | 	case typ&os.ModeDevice != 0:
            92 | 		return ansiBlock
            93 | 	default:
            94 | 		// Regular file: check executable permission bits.
            95 | 		if mode&0111 != 0 {
            96 | 			return ansiExec
            97 | 		}
            98 | 		return ansiRegular
            99 | 	}
            100 | }
            102 | // Reset returns the ANSI SGR reset sequence ("\033[0m"), or an empty string
            103 | // when color output is disabled. (prd003-format R2.2, R2.6)
            104 | func Reset() string {
            105 | 	if !colorActive() {
            106 | 		return ""
            107 | 	}
            108 | 	return ansiReset
            109 | }
            111 | // ColorEnabled reports whether color output should be enabled for the given
            112 | // writer. Returns true only when w is backed by a terminal file descriptor.
            113 | // Non-*os.File writers (pipes, buffers) always return false.
            114 | // (prd003-format R2.3)
            115 | func ColorEnabled(w io.Writer) bool {
            116 | 	f, ok := w.(*os.File)
            117 | 	if !ok {
            118 | 		return false
            119 | 	}
            120 | 	return isTerminal(f.Fd())
            121 | }
            123 | // SetColorEnabled overrides automatic TTY detection. When enabled is true,
            124 | // FileTypeColor and Reset return ANSI sequences regardless of the output
            125 | // target. When enabled is false, they return empty strings regardless. The
            126 | // override is process-global. (prd003-format R2.6)
            127 | func SetColorEnabled(enabled bool) {
            128 | 	colorMu.Lock()
            129 | 	defer colorMu.Unlock()
            130 | 	if enabled {
            131 | 		activeColorMode = colorForceOn
            132 | 	} else {
            133 | 		activeColorMode = colorForceOff
            134 | 	}
            135 | }
            137 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting to
            138 | // automatic TTY detection via ColorEnabled. (prd003-format R2.7)
            139 | func ResetColorEnabled() {
            140 | 	colorMu.Lock()
            141 | 	defer colorMu.Unlock()
            142 | 	activeColorMode = colorAuto
            143 | }
            145 | // colorActive returns the effective color state: forced on/off if an override
            146 | // is set, otherwise auto-detect by checking whether stdout is a terminal.
            147 | func colorActive() bool {
            148 | 	colorMu.Lock()
            149 | 	mode := activeColorMode
            150 | 	colorMu.Unlock()
            151 | 	switch mode {
            152 | 	case colorForceOn:
            153 | 		return true
            154 | 	case colorForceOff:
            155 | 		return false
            156 | 	default:
            157 | 		return isTerminal(os.Stdout.Fd())
            158 | 	}
            159 | }
            161 | // isTerminal reports whether the file descriptor refers to a terminal, detected
            162 | // via the TIOCGWINSZ ioctl. This is a local implementation pending pkg/sys
            163 | // availability. (prd003-format R2.3)
            164 | func isTerminal(fd uintptr) bool {
            165 | 	// struct winsize: 4 x uint16 = 8 bytes.
            166 | 	var ws [8]byte
            167 | 	_, _, errno := syscall.Syscall(syscall.SYS_IOCTL, fd, syscall.TIOCGWINSZ, uintptr(unsafe.Pointer(&ws[0])))
            168 | 	return errno == 0
            169 | }
