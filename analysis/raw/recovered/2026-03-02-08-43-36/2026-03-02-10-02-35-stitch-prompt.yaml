            286 | // assertEnvContains checks that the env slice contains key=value.
            287 | func assertEnvContains(t *testing.T, env []string, key, value string) {
            288 | 	t.Helper()
            289 | 	target := key + "=" + value
            290 | 	for _, e := range env {
            291 | 		if e == target {
            292 | 			return
            293 | 		}
            294 | 	}
            295 | 	t.Fatalf("expected %s=%s in env, not found", key, value)
            296 | }
            298 | // countEnvKey counts how many entries in env start with key=.
            299 | func countEnvKey(env []string, key string) int {
            300 | 	prefix := key + "="
            301 | 	count := 0
            302 | 	for _, e := range env {
            303 | 		if strings.HasPrefix(e, prefix) {
            304 | 			count++
            305 | 		}
            306 | 	}
            307 | 	return count
            308 | }
context: |-
    Task ID: 93
