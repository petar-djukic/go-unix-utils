project_context:
    vision:
        file: docs/VISION.yaml
        id: go-unix-utils
        title: 'go-unix-utils: Specification-Driven Regeneration of Unix Utilities in Go'
        executive_summary: |
            go-unix-utils is an experiment in specification-driven development using classic Unix
            utilities as the test bed. We derive formal specifications from C source code, generate
            Go implementations from those specs using an AI coding agent, and verify parity against
            reference binaries through differential testing. The goal is not to ship utilities; it
            is to find where the methodology breaks down.
        problem: |
            Classic Unix utilities have no formal specifications accessible to implementers. Man
            pages omit edge cases, flag interactions, and exit-code contracts. Re-implementations
            built from documentation alone diverge in observable behavior -- they break scripts,
            pipelines, and tools that depend on precise semantics.

            Existing Go re-implementations treat utilities as isolated exercises. They lack shared
            infrastructure, behavioral contracts, and systematic verification. The result is
            utilities that work for common cases but fail on edge cases that production users
            encounter.
        what_this_does: |
            We run a four-stage pipeline for each utility. In the extraction stage, we clone the
            C source (coreutils, moreutils, grep, findutils) and analyze behavior directly from
            the source of truth. In the specification stage, a human operator uses the make-work
            and do-work Claude Code skills to produce two artifacts: a PRD (numbered requirements
            and acceptance criteria covering all flags, exit codes, and stream behaviors) and a
            use case (concrete end-to-end execution path through the system). Shared library
            components (pkg/) also receive PRDs when their requirements span multiple utilities.
            In the synthesis stage, the mage-claude-orchestrator library drives a Claude agent to
            generate idiomatic Go from the PRD. In the verification stage, a differential testing
            harness runs the Go binary and the Homebrew reference binary side by side and compares
            outputs.
        why_we_build_this: |
            We use GNU utilities as a stress test for the mage-claude-orchestrator code generation
            system. GNU utilities are an ideal subject: their behavior is authoritative (C source
            is public), their correctness is verifiable (differential testing against reference
            binaries), and they span a wide range of complexity -- from ts (trivial) to ls
            (hundreds of flags and edge cases). The human operator guides spec development through
            make-work and do-work skills; the orchestrator then takes over and generates Go code
            autonomously. We want to know where the system holds and where it fails: how much
            spec detail the orchestrator needs, how it handles complex flag interactions, and
            whether differential testing catches the gaps. The shared Go library (pkg/) is a
            by-product, not the goal.
        success_criteria:
            SC1: |
                Every utility passes differential tests against its Homebrew reference binary with 100% output parity on exit code, stdout, and stderr.
            SC2: |
                Every utility has a PRD that covers all flags, exit codes, and stream behaviors derived from C source.
            SC3: |
                Go binaries are idiomatic and compile with no warnings under standard linting (golangci-lint).
            SC4: |
                The shared pkg/ library is used by at least two utilities for common logic, with no duplication of syscall or formatting code across cmd/ packages.
            SC5: mage analyze passes with no broken references or missing fields.
            SC6: |
                We can characterize where mage-claude-orchestrator succeeds and fails: which utility complexity levels it handles autonomously, which require spec refinement by the human operator, and which it cannot complete without manual intervention.
        implementation_phases:
            - phase: "1"
              focus: 'Foundation: pipeline infrastructure, first utility (ts), shared pkg/ skeleton.'
              deliverables: Differential testing harness in pkg/testutils/, pkg/sys/ and pkg/format/ initial implementations, cmd/ts/ with PRD and passing differential tests.
            - phase: "2"
              focus: 'Moreutils: remaining moreutils tools (sponge, vidir, pee, chronic).'
              deliverables: PRD and Go implementation for sponge, vidir, pee, and chronic. Differential tests for each moreutils utility.
            - phase: "3"
              focus: 'Coreutils: high-complexity coreutils tools (ls, cat, cp, mv, wc, du).'
              deliverables: PRD and Go implementation for each coreutils utility. Shared formatting and syscall logic promoted to pkg/.
            - phase: "4"
              focus: 'Search Utilities: grep, egrep, fgrep (grep package) and find, xargs (findutils).'
              deliverables: PRD and Go implementations for all grep and findutils tools. Full differential test coverage for the search utility suite.
        risks:
            - risk: Platform divergence between GNU and macOS behavior.
              impact: high
              likelihood: medium
              mitigation: |
                We target Homebrew-installed GNU binaries (gls, gts, etc.) as the reference,
                not the macOS BSD built-ins. All tests run against the GNU reference binary,
                which is built from the same C source we use for spec extraction.
            - risk: C source complexity makes full behavioral extraction impractical for some utilities.
              impact: medium
              likelihood: medium
              mitigation: |
                We combine C source analysis with behavioral testing of the reference binary
                for edge cases. Specs note where behavior is observed rather than source-derived,
                and we include those observations as test inputs in the differential harness.
            - risk: Go standard library lacks POSIX syscall coverage on macOS.
              impact: medium
              likelihood: low
              mitigation: |
                We build pkg/sys/ as an abstraction layer over Darwin and Linux syscalls and
                use golang.org/x/sys for extended coverage where the standard library falls short.
            - risk: AI synthesis produces code that passes common cases but fails edge cases.
              impact: high
              likelihood: medium
              mitigation: |
                Differential testing is the gating check. Code cannot pass review until
                differential tests pass. Edge cases are explicit in the PRD and exercised
                as named test inputs in pkg/testutils/.
            - risk: Go has no locale-aware string collation (strcoll equivalent).
              impact: high
              likelihood: high
              mitigation: |
                The current roadmap (rel01.0 through rel02.1) avoids locale-sensitive utilities.
                All differential tests run with LC_ALL=C so Go and reference binary outputs agree.
                When locale-sensitive utilities (sort, join, comm) are scheduled, we will evaluate
                golang.org/x/text/collate as the implementation path. If it does not cover the
                required POSIX LC_COLLATE semantics, those utilities will be deferred or scoped
                to LC_ALL=C only.
        not:
            - This project is not a general-purpose Unix toolkit for production deployment.
            - We do not target BSD utilities or macOS built-ins as reference binaries.
            - We do not implement utilities outside coreutils, moreutils, grep, and findutils.
            - We do not implement stdbuf. It requires injecting a shared library via LD_PRELOAD, which is not possible in pure Go. stdbuf is the only moreutils utility excluded.
            - We do not target Windows.
            - Specs are not replacements for man pages; they capture implementer-relevant behavior.
            - We do not produce a drop-in replacement binary at a system path; binaries live in bin/.
            - We do not implement full POSIX locale-aware collation (LC_COLLATE) in the current roadmap. Utilities that require strcoll() semantics (sort, join, comm, uniq) are constrained to LC_ALL=C behavior for now. golang.org/x/text/collate is the planned path when locale-sensitive utilities are scheduled.
    architecture:
        file: docs/ARCHITECTURE.yaml
        id: go-unix-utils
        title: go-unix-utils Architecture
        overview:
            summary: |
                go-unix-utils is a pipeline from C-source-derived specifications to verified Go
                binaries. Each utility follows the same four-stage flow: extract, specify, synthesize,
                verify. The synthesis stage is driven by mage-claude-orchestrator, an automated code
                generation system. Specification development is human-guided. A shared pkg/ library
                accumulates common logic as utilities are added.
            lifecycle: |
                For each utility a human operator clones the C source repository, analyzes flags and
                edge cases, and uses the make-work and do-work Claude Code skills to produce two
                specification artifacts: a PRD (numbered requirements and acceptance criteria covering
                all flags, exit codes, and stream behaviors) and a use case (concrete end-to-end
                execution path through the system). The PRD is the primary input to code generation.
                Once the spec artifacts are complete, the human invokes the mage-claude-orchestrator
                via mage targets; the orchestrator drives a Claude agent to generate Go code in
                cmd/<utility>/ and runs the differential testing harness. If tests fail, the operator
                refines the PRD and the orchestrator re-generates.

                Shared library components (pkg/sys, pkg/format, pkg/testutils) may also have PRDs
                when their requirements are non-trivial and span multiple utilities.
            coordination_pattern: |
                The human operator owns the specification phase. The mage-claude-orchestrator owns
                the synthesis and verification phases. Mage targets (magefiles/orchestrator.go)
                expose the boundary between them: the operator calls mage targets to hand off to
                the orchestrator after the spec is ready. The differential testing harness in
                pkg/testutils/ is the shared acceptance criterion for both phases.
        interfaces:
            - name: Data Structures
              summary: |
                Specification artifacts and runtime data structures used across the pipeline.
              data_structures:
                - 'PRD (prd[NNN]-<utility>.yaml): per-utility product requirements document with numbered goals, requirements, and acceptance criteria.'
                - 'Use case (rel[NN].[N]-uc[NNN]-<utility>.yaml): per-utility use case describing a concrete end-to-end execution path through the system.'
                - 'DiffTest: Go struct in pkg/testutils/ defining a single differential test case with fields for input arguments, stdin, environment, expected exit code, and expected output.'
                - 'configuration.yaml: orchestrator configuration file at the project root consumed by magefiles/ to configure build, analysis, and generation targets.'
              operations:
                - 'mage build: compiles all cmd/ binaries to bin/.'
                - 'mage lint: runs golangci-lint on all Go source under cmd/ and pkg/.'
                - 'mage stats:loc: prints Go lines of code (production and test) and documentation word counts.'
                - 'mage analyze: runs cross-artifact consistency checks on docs/ (PRDs, use cases, test suites, roadmap).'
                - 'go test ./...: runs all tests including differential tests in each cmd/ package.'
            - name: Events
              summary: |
                Observable events emitted by the system during operation.
              operations:
                - 'Differential test failure: go test reports the divergence with the input that triggered it, the expected output (reference binary), and the actual output (Go binary).'
        components:
            - name: Human Operator
              responsibility: |
                Guides specification development for each utility. Clones the C source, analyzes
                flags and edge cases, and uses the make-work and do-work Claude Code skills to
                produce a PRD and a use case. Decides when the spec artifacts are complete enough
                to hand off to the orchestrator. Refines PRDs when orchestrator-generated code
                fails differential tests. Also authors PRDs for shared pkg/ components when their
                requirements warrant it.
              capabilities:
                - make-work skill breaks a utility into specification issues
                - do-work skill works through individual specification issues
                - C source analysis via cloned coreutils/moreutils/grep/findutils repositories
              references:
                - .claude/commands/
            - name: Specification Repository
              responsibility: |
                Holds the formal per-utility PRDs and use cases alongside this documentation suite.
                Serves as the source of truth for synthesis and verification. Shared library
                components (pkg/) may also have PRDs.
              capabilities:
                - One PRD per utility under docs/specs/product-requirements/ (plus PRDs for shared pkg/ components as needed)
                - One use case per utility under docs/specs/use-cases/
                - VISION.yaml and ARCHITECTURE.yaml project-level docs
                - Test suites under docs/specs/test-suites/
              references:
                - docs/
            - name: cmd/
              responsibility: |
                Holds the Go implementation of each utility. Each sub-package compiles to a
                standalone binary and contains its differential tests alongside the implementation.
                cmd/ grows as utilities are implemented following road-map.yaml. The full catalog
                of 123 target utilities (coreutils, moreutils, grep, findutils) is in
                docs/utilities.yaml; stdbuf is the only utility in those repos that is explicitly
                excluded (LD_PRELOAD injection not possible in pure Go).
              capabilities:
                - One package per utility, named cmd/<utility>/
                - Each package contains main.go (implementation) and <utility>_test.go (differential tests)
                - Active roadmap in road-map.yaml for current release and use case status
                - Full catalog in docs/utilities.yaml for difficulty, memory model, and implementation profile of each utility
              references:
                - cmd/
            - name: pkg/sys/
              responsibility: |
                Wraps Darwin and Linux syscalls and signal handling. Provides a stable interface
                that cmd/ packages use to avoid platform-specific code in utility implementations.
                Only syscalls that have platform divergence between Darwin and Linux, or that Go's
                standard library does not expose cleanly, belong here.
              capabilities:
                - Terminal size queries (TIOCGWINSZ ioctl)
                - Signal handling (SIGPIPE, SIGHUP, SIGWINCH)
                - File metadata (stat, lstat; abstracts st_mtimespec/st_mtim and st_blocks divergence)
                - Process group management (setpgid, killpg) for timeout and xargs -P
                - Process priority (setpriority) for nice and renice
              references:
                - pkg/sys/
            - name: pkg/format/
              responsibility: |
                Provides output formatting shared across utilities including table alignment,
                ANSI color output, and human-readable unit conversion (bytes to K/M/G).
              capabilities:
                - Column alignment for tabular output (ls -l style)
                - ANSI color codes for file types and permissions
                - Human-readable size formatting
              references:
                - pkg/format/
            - name: pkg/testutils/
              responsibility: |
                The differential testing harness. Executes a Go binary and a reference GNU binary
                with the same inputs and compares stdout, stderr, and exit code byte-for-byte or
                with configured normalization.
              capabilities:
                - Execute two binaries with identical stdin, arguments, and environment
                - Compare stdout, stderr, and exit code
                - Report divergence with the input, expected output, and actual output
                - Support normalization hooks for known acceptable differences (e.g., timestamps)
              references:
                - pkg/testutils/
            - name: magefiles/
              responsibility: |
                Mage build targets for the project. Wraps build, lint, test, stats, and analyze
                operations. Delegates to the mage-claude-orchestrator library, which drives Claude
                agents for code generation. This is the boundary between the human-guided spec
                phase and the automated synthesis phase.
              capabilities:
                - mage build compiles all binaries
                - mage lint runs golangci-lint
                - mage stats:loc prints LOC and doc word counts
                - mage analyze runs cross-artifact consistency checks
                - mage init initializes the project
                - mage credentials extracts Claude credentials from macOS Keychain
                - mage cobbler:measure and mage cobbler:stitch run the orchestrator generation cycle
              references:
                - magefiles/
        design_decisions:
            - id: 1
              title: C source as the specification source of truth
              decision: |
                We derive specs from the C source code of coreutils, moreutils, grep, and findutils
                rather than from man pages or documentation alone.
              benefits:
                - Captures edge cases and flag interactions not documented in man pages
                - Eliminates ambiguity about intended behavior
                - Enables completeness verification against the actual implementation
              alternatives_rejected:
                - 'Man-page-only specs: insufficient detail for edge cases and exit codes'
                - 'Behavioral-only extraction: slower, misses implementation intent for unexposed paths'
            - id: 2
              title: Differential testing as the primary verification mechanism
              decision: |
                We verify Go implementations by running them side by side with the Homebrew GNU
                reference binary and comparing outputs, not by writing unit tests against expected
                constants.
              benefits:
                - Tests against the actual reference, not a human's interpretation of it
                - Discovers regressions automatically when spec or code changes
                - Scales to any number of inputs without manual expected-output authoring
              alternatives_rejected:
                - 'Unit tests with hardcoded expectations: brittle, based on documentation assumptions'
                - 'Integration tests against a fixed corpus: does not verify against live GNU behavior'
            - id: 3
              title: Shared pkg/ library for Unix primitives
              decision: |
                Common logic (syscalls, formatting, I/O patterns) is promoted to pkg/ rather than
                duplicated across cmd/ packages.
              benefits:
                - Reduces duplication and inconsistency between utilities
                - Builds a reusable Go library of Unix primitives
                - Makes each cmd/ package focused on utility-specific logic
              alternatives_rejected:
                - 'Per-utility internal packages: promotes duplication across cmd/'
                - 'External formatting libraries: reduces control, increases supply-chain surface'
            - id: 4
              title: Homebrew GNU binaries as reference, not macOS built-ins
              decision: |
                On macOS we use gls, gts, and other g-prefixed Homebrew binaries as the reference,
                not the BSD-derived macOS built-ins.
              benefits:
                - GNU behavior is well-defined and derived from the same C source we clone
                - Avoids testing against BSD variants with different flag sets and semantics
                - Homebrew binaries are the same version as the cloned source
              alternatives_rejected:
                - 'macOS built-ins: BSD-derived, significant flag and behavior differences from GNU'
                - 'Building from source ourselves: adds complexity without benefit'
            - id: 5
              title: Human-guided specification, automated synthesis
              decision: |
                We split responsibility at the spec boundary. The human operator owns the PRD
                via make-work and do-work skills. The mage-claude-orchestrator owns code generation
                and testing from that point forward. The operator does not write Go; the orchestrator
                does not write PRDs.
              benefits:
                - Isolates the experiment variable so orchestrator quality is evaluated independently of spec quality
                - Human judgment is applied where it adds most value (behavioral analysis of C source)
                - Orchestrator failure modes are observable without confounding spec quality
              alternatives_rejected:
                - Fully automated pipeline (orchestrator writes specs too) conflates two failure modes
                - Fully manual pipeline (human writes Go) does not test the orchestrator at all
            - id: 7
              title: Generation scope excludes scaffolded and human-authored paths
              decision: |
                The code generation pipeline (measure + stitch) must not propose or execute
                tasks for the following paths. These are either scaffolded by cobbler-scaffold
                or human-authored content that the pipeline reads but does not write.

                magefiles/ -- provided by cobbler-scaffold's orchestrator library.
                orchestrator.go is auto-generated. The only code generation target in
                prd011-magefiles is cmd/version, which lives in cmd/version/.

                configuration.yaml -- consumed by cobbler-scaffold. Not a generation target.

                .cobbler/ -- scaffold working directory. Not a generation target.

                .claude/ -- Claude Code configuration. Not a generation target.

                docs/ -- specifications are human-authored. The pipeline reads docs/ as input
                but does not write to it.

                The generation pipeline targets only cmd/ and pkg/ directories.
              benefits:
                - Prevents measure from proposing tasks for scaffolded infrastructure
                - Avoids stitch timeouts caused by rewriting files that conflict with cobbler-scaffold
                - Single authoritative list of exclusions in the architecture document
              alternatives_rejected:
                - 'Per-component provided_by field: rejected by cobbler-scaffold ArchComponent schema (see cobbler-scaffold #430)'
                - 'Top-level generation_non_goals field: rejected by cobbler-scaffold ArchitectureDoc schema'
                - 'Include all PRDs in measure context to let non_goals speak for themselves: increases prompt size'
            - id: 6
              title: Locale handling deferred; LC_ALL=C for the current roadmap
              decision: |
                Go's standard library has no strcoll() equivalent. Utilities that require locale-aware
                string collation (sort, join, comm, uniq with locale ordering; ls sort order under
                non-C locales; grep character classes under LC_COLLATE) cannot be implemented with
                full POSIX locale semantics using only the Go standard library.

                For the current roadmap (rel01.0 through rel02.1), all implementations target
                LC_ALL=C behavior only. Every differential test that touches string comparison or
                character classification sets LC_ALL=C so the Go and reference binary outputs agree.
                This constraint is recorded as a precondition in each affected test suite.

                When locale-sensitive utilities are scheduled beyond rel02.1, we will evaluate
                golang.org/x/text/collate as the implementation path. If approved, the external
                dependency policy (currently golang.org/x/sys only) will be updated to permit
                golang.org/x/* packages. No other locale library will be considered; building CLDR
                tables in-house is out of scope.
              benefits:
                - Unblocks the current roadmap without requiring a policy change or new dependency
                - Makes the constraint explicit and testable rather than discovered mid-implementation
                - golang.org/x/text is the same vendor and trust tier as golang.org/x/sys
              alternatives_rejected:
                - 'Implement strcoll in-house using CLDR tables: out of scope, maintenance burden'
                - 'Allow any locale library: increases supply-chain surface beyond what the project accepts'
                - 'Silently test only LC_ALL=C without documenting the gap: hides a behavioral difference'
        technology_choices:
            - component: Language
              technology: Go
              purpose: Idiomatic systems programming language with strong standard library for I/O and OS operations.
            - component: Build
              technology: Mage
              purpose: Go-native build tool; targets are plain Go functions, no DSL to learn or maintain.
            - component: Lint
              technology: golangci-lint
              purpose: Comprehensive linting for idiomatic Go; integrated with the mage lint target.
            - component: Syscalls
              technology: golang.org/x/sys
              purpose: |
                The only external Go dependency in the current roadmap. Provides stable Darwin and
                Linux syscall coverage for Stat_t field access (field names diverge between
                platforms), ioctl constants (TIOCGWINSZ), and signal mask operations. pkg/sys wraps
                this into a single internal API; cmd/ packages do not import golang.org/x/sys
                directly. golang.org/x/text/collate is the planned addition when locale-sensitive
                utilities are scheduled (see DD6).
            - component: Reference binaries
              technology: Homebrew (GNU coreutils, moreutils, grep, findutils)
              purpose: Provides the reference binaries (gls, gts, etc.) used in differential testing.
            - component: Source extraction
              technology: Git (coreutils, moreutils, grep, findutils mirrors)
              purpose: Source repositories for C implementations used as spec extraction input.
            - component: Code generation
              technology: mage-claude-orchestrator (mesh-intelligence)
              purpose: Drives Claude agents for code generation from the PRD; provides the cobbler measure/stitch generation cycle.
            - component: Specification workflow
              technology: make-work / do-work (Claude Code skills)
              purpose: Human operator uses these skills to break utilities into specification issues and work through them systematically.
        project_structure:
            - path: docs/
              role: Specification and documentation suite (VISION, ARCHITECTURE, PRDs, use cases, test suites)
            - path: docs/VISION.yaml
              role: Project goals, success criteria, risks, and explicit boundaries
            - path: docs/ARCHITECTURE.yaml
              role: Component descriptions, design decisions, and technology choices
            - path: docs/utilities.yaml
              role: Full catalog of 123 target utilities with difficulty, memory model, and implementation profiles
            - path: docs/road-map.yaml
              role: Release schedule; maps use cases to releases with status
            - path: docs/specs/product-requirements/
              role: Per-utility PRDs; also PRDs for shared pkg/ components
            - path: docs/specs/use-cases/
              role: Per-utility use cases (concrete execution paths through the system)
            - path: docs/specs/test-suites/
              role: Per-use-case test suites with explicit inputs and expected outputs
            - path: docs/engineering/
              role: Engineering guidelines (conventions, practices, patterns above the code)
            - path: cmd/
