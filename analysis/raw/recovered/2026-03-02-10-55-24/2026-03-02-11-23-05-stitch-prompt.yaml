    source_code:
        - file: pkg/testutils/difftest.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package testutils provides the differential testing harness for go-unix-utils.
            5 | // It executes a Go binary and a GNU reference binary with identical inputs and
            6 | // compares stdout, stderr, and exit code. cmd/ packages import this package to
            7 | // define test cases as data without reimplementing the execution and comparison
            8 | // logic.
            9 | //
            10 | // Implements: prd001-testutils R1, R2, R3, R4, R5
            11 | package testutils
            13 | import (
            14 | 	"bytes"
            15 | 	"context"
            16 | 	"fmt"
            17 | 	"os"
            18 | 	"os/exec"
            19 | 	"path/filepath"
            20 | 	"strings"
            21 | 	"testing"
            22 | 	"time"
            23 | )
            25 | // defaultTimeout is the maximum duration each binary invocation may run before
            26 | // the harness kills it and fails the test.
            27 | //
            28 | // Implements: prd001-testutils R2.3
            29 | const defaultTimeout = 10 * time.Second
            31 | // NormalizeFunc transforms raw output bytes before comparison. Normalizers
            32 | // strip or replace non-deterministic fields (timestamps, PIDs, binary name
            33 | // references) so that known acceptable differences do not cause test failures.
            34 | //
            35 | // Implements: prd001-testutils R1.4
            36 | type NormalizeFunc = func([]byte) []byte
            38 | // DiffTest defines a single differential test case. The harness executes
            39 | // both the Go binary and the reference binary with identical Args, Stdin,
            40 | // and Env, then compares their outputs.
            41 | //
            42 | // Implements: prd001-testutils R1.1
            43 | type DiffTest struct {
            44 | 	Name          string            // subtest name used with t.Run; required
            45 | 	Args          []string          // command-line arguments passed to both binaries
            46 | 	Stdin         []byte            // nil = no stdin (both binaries receive EOF immediately)
            47 | 	Env           []string          // nil = use defaults only (LC_ALL=C); non-nil = KEY=VALUE pairs merged into inherited environment
            48 | 	WorkDir       string            // empty = per-test t.TempDir(); non-empty = use this directory for both binaries
            49 | 	ExitCode      int               // expected exit code for both binaries
            50 | 	Normalize     []NormalizeFunc   // applied in order to stdout and stderr of both binaries before comparison; nil or empty = no normalization
            51 | 	ExpectedFiles map[string][]byte // optional: path -> expected byte content after execution, for file-output utilities (sponge, cp)
            52 | }
            54 | // stdinMaxDisplay is the maximum number of stdin bytes shown in failure messages.
            55 | const stdinMaxDisplay = 256
            57 | // runResult holds captured output from a single binary invocation.
            58 | type runResult struct {
            59 | 	Stdout   []byte
            60 | 	Stderr   []byte
            61 | 	ExitCode int
            62 | }
            64 | // RunDiffTests runs each DiffTest as a named subtest, executing both goBinary
            65 | // and refBinary with identical inputs. Divergences in stdout, stderr, or exit
            66 | // code are reported via t.Errorf.
            67 | //
            68 | // Implements: prd001-testutils R2.1, R3.6
            69 | func RunDiffTests(t *testing.T, goBinary, refBinary string, tests []DiffTest) {
            70 | 	t.Helper()
            72 | 	for _, tc := range tests {
            73 | 		t.Run(tc.Name, func(t *testing.T) {
            74 | 			t.Helper()
            75 | 			runSingleDiffTest(t, goBinary, refBinary, tc)
            76 | 		})
            77 | 	}
            78 | }
            80 | // runSingleDiffTest executes both binaries for a single test case and compares
            81 | // the results.
            82 | func runSingleDiffTest(t *testing.T, goBinary, refBinary string, tc DiffTest) {
            83 | 	t.Helper()
            85 | 	workDir := tc.WorkDir
            86 | 	if workDir == "" {
            87 | 		workDir = t.TempDir()
            88 | 	}
            90 | 	env := buildEnv(tc.Env)
            92 | 	refResult, err := runBinary(refBinary, tc.Args, tc.Stdin, env, workDir)
            93 | 	if err != nil {
            94 | 		t.Fatalf("reference binary execution failed: %v", err)
            95 | 	}
            97 | 	goResult, err := runBinary(goBinary, tc.Args, tc.Stdin, env, workDir)
            98 | 	if err != nil {
            99 | 		t.Fatalf("go binary execution failed: %v", err)
            100 | 	}
            102 | 	refStdout := applyNormalizers(refResult.Stdout, tc.Normalize)
            103 | 	refStderr := applyNormalizers(refResult.Stderr, tc.Normalize)
            104 | 	goStdout := applyNormalizers(goResult.Stdout, tc.Normalize)
            105 | 	goStderr := applyNormalizers(goResult.Stderr, tc.Normalize)
            107 | 	failed := false
            109 | 	// Compare stdout (R3.2).
            110 | 	if !bytes.Equal(refStdout, goStdout) {
            111 | 		failed = true
            112 | 	}
            114 | 	// Compare stderr (R3.3).
            115 | 	if !bytes.Equal(refStderr, goStderr) {
            116 | 		failed = true
            117 | 	}
            119 | 	// Compare exit codes (R3.4).
            120 | 	if refResult.ExitCode != goResult.ExitCode {
            121 | 		failed = true
            122 | 	}
            124 | 	if failed {
            125 | 		t.Errorf("divergence detected\n"+
            126 | 			"args:        %v\n"+
            127 | 			"stdin:       %s\n"+
            128 | 			"ref stdout:  %q\n"+
            129 | 			"go  stdout:  %q\n"+
            130 | 			"ref stderr:  %q\n"+
            131 | 			"go  stderr:  %q\n"+
            132 | 			"ref exit:    %d\n"+
            133 | 			"go  exit:    %d",
            134 | 			tc.Args,
            135 | 			truncateStdin(tc.Stdin),
            136 | 			refStdout,
            137 | 			goStdout,
            138 | 			refStderr,
            139 | 			goStderr,
            140 | 			refResult.ExitCode,
            141 | 			goResult.ExitCode,
            142 | 		)
            143 | 	}
            145 | 	// File-state comparison (R5.1, R5.2).
            146 | 	if tc.ExpectedFiles != nil {
            147 | 		checkExpectedFiles(t, tc, workDir)
            148 | 	}
            149 | }
            151 | // buildEnv constructs the environment variable slice for binary invocations.
            152 | // It starts with the current process environment, applies LC_ALL=C as a
            153 | // default, then merges any DiffTest.Env entries on top.
            154 | //
            155 | // Implements: prd001-testutils R2.6, R1.3
            156 | func buildEnv(testEnv []string) []string {
            157 | 	base := os.Environ()
            158 | 	env := mergeEnv(base, []string{"LC_ALL=C"})
            159 | 	if testEnv != nil {
            160 | 		env = mergeEnv(env, testEnv)
            161 | 	}
            162 | 	return env
            163 | }
            165 | // mergeEnv merges override entries into base. For each override KEY=VALUE,
            166 | // if KEY exists in base it is replaced; otherwise the entry is appended.
            167 | func mergeEnv(base, overrides []string) []string {
            168 | 	result := make([]string, len(base))
            169 | 	copy(result, base)
            171 | 	for _, override := range overrides {
            172 | 		key := envKey(override)
            173 | 		found := false
            174 | 		for i, entry := range result {
            175 | 			if envKey(entry) == key {
            176 | 				result[i] = override
            177 | 				found = true
            178 | 				break
            179 | 			}
            180 | 		}
            181 | 		if !found {
            182 | 			result = append(result, override)
            183 | 		}
            184 | 	}
            185 | 	return result
            186 | }
            188 | // envKey extracts the key portion of a KEY=VALUE environment string.
            189 | func envKey(entry string) string {
            190 | 	if idx := strings.IndexByte(entry, '='); idx >= 0 {
            191 | 		return entry[:idx]
            192 | 	}
            193 | 	return entry
            194 | }
            196 | // runBinary executes a binary with the given arguments, stdin, environment,
            197 | // and working directory. It captures stdout, stderr, and exit code.
            198 | //
            199 | // Implements: prd001-testutils R2.2, R2.3, R2.5
            200 | func runBinary(binPath string, args []string, stdin []byte, env []string, workDir string) (*runResult, error) {
            201 | 	ctx, cancel := context.WithTimeout(context.Background(), defaultTimeout)
            202 | 	defer cancel()
            204 | 	cmd := exec.CommandContext(ctx, binPath, args...)
            205 | 	cmd.Env = env
            206 | 	cmd.Dir = workDir
            208 | 	if stdin != nil {
            209 | 		cmd.Stdin = bytes.NewReader(stdin)
            210 | 	}
            212 | 	var stdout, stderr bytes.Buffer
            213 | 	cmd.Stdout = &stdout
            214 | 	cmd.Stderr = &stderr
            216 | 	err := cmd.Run()
            218 | 	exitCode := 0
            219 | 	if err != nil {
            220 | 		if ctx.Err() == context.DeadlineExceeded {
            221 | 			return nil, fmt.Errorf("binary %s timed out after %v", binPath, defaultTimeout)
            222 | 		}
            223 | 		if exitErr, ok := err.(*exec.ExitError); ok {
            224 | 			exitCode = exitErr.ExitCode()
            225 | 		} else {
            226 | 			return nil, fmt.Errorf("executing %s: %w", binPath, err)
            227 | 		}
            228 | 	}
            230 | 	return &runResult{
            231 | 		Stdout:   stdout.Bytes(),
            232 | 		Stderr:   stderr.Bytes(),
            233 | 		ExitCode: exitCode,
            234 | 	}, nil
            235 | }
            237 | // applyNormalizers runs each NormalizeFunc in order on the input bytes.
            238 | // Returns the input unchanged when fns is nil or empty.
            239 | //
            240 | // Implements: prd001-testutils R3.1, R4.1, R4.3
            241 | func applyNormalizers(data []byte, fns []NormalizeFunc) []byte {
            242 | 	for _, fn := range fns {
            243 | 		data = fn(data)
            244 | 	}
            245 | 	return data
            246 | }
            248 | // ComposeNormalizers returns a single NormalizeFunc that applies the given
            249 | // functions in order. This is a convenience for cmd/ test files that combine
            250 | // multiple normalizers.
            251 | //
            252 | // Implements: prd001-testutils R4.4
            253 | func ComposeNormalizers(fns ...NormalizeFunc) NormalizeFunc {
            254 | 	return func(data []byte) []byte {
            255 | 		for _, fn := range fns {
            256 | 			data = fn(data)
            257 | 		}
            258 | 		return data
            259 | 	}
            260 | }
            262 | // TimestampNormalizer replaces common strftime-formatted timestamps with a
            263 | // fixed placeholder so that differential tests pass despite wall-clock
            264 | // differences between binary invocations.
            265 | //
            266 | // Recognized patterns:
            267 | //   - "Mon DD HH:MM:SS" (e.g., "Feb 19 12:34:56") — syslog/ts default format
            268 | //   - "YYYY-MM-DD HH:MM:SS" (e.g., "2026-02-19 12:34:56") — ISO-like format
            269 | //
            270 | // Implements: prd001-testutils R4.2
            271 | func TimestampNormalizer(data []byte) []byte {
            272 | 	s := string(data)
            274 | 	// Replace "Mon DD HH:MM:SS" pattern (e.g., "Feb 19 12:34:56").
            275 | 	s = replaceTimestampSyslog(s)
            277 | 	// Replace "YYYY-MM-DD HH:MM:SS" pattern.
            278 | 	s = replaceTimestampISO(s)
            280 | 	return []byte(s)
            281 | }
            283 | // timestampPlaceholder is the fixed string that replaces normalized timestamps.
            284 | const timestampPlaceholder = "<TIMESTAMP>"
            286 | // months lists abbreviated month names for syslog timestamp matching.
            287 | var months = []string{
            288 | 	"Jan", "Feb", "Mar", "Apr", "May", "Jun",
            289 | 	"Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
            290 | }
            292 | // replaceTimestampSyslog replaces "Mon DD HH:MM:SS" patterns.
            293 | func replaceTimestampSyslog(s string) string {
            294 | 	for _, mon := range months {
            295 | 		for {
            296 | 			idx := strings.Index(s, mon+" ")
            297 | 			if idx < 0 {
            298 | 				break
            299 | 			}
            300 | 			// Expect "Mon DD HH:MM:SS" = 3 + 1 + 2 + 1 + 8 = 15 chars.
            301 | 			end := idx + 15
            302 | 			if end > len(s) {
            303 | 				break
            304 | 			}
            305 | 			candidate := s[idx:end]
            306 | 			if isValidSyslogTimestamp(candidate) {
            307 | 				s = s[:idx] + timestampPlaceholder + s[end:]
            308 | 			} else {
            309 | 				// Avoid infinite loop: advance past this occurrence.
            310 | 				break
            311 | 			}
            312 | 		}
            313 | 	}
            314 | 	return s
            315 | }
            317 | // isValidSyslogTimestamp checks if s matches "Mon DD HH:MM:SS" format.
            318 | func isValidSyslogTimestamp(s string) bool {
            319 | 	if len(s) != 15 {
            320 | 		return false
            321 | 	}
            322 | 	// s[0:3] = month abbreviation (already matched by caller).
            323 | 	if s[3] != ' ' {
            324 | 		return false
            325 | 	}
            326 | 	// s[4:6] = day: digit or space + digit.
            327 | 	if !isDigitOrSpace(s[4]) || !isDigit(s[5]) {
            328 | 		return false
            329 | 	}
            330 | 	if s[6] != ' ' {
            331 | 		return false
            332 | 	}
            333 | 	// s[7:15] = "HH:MM:SS"
            334 | 	return isDigit(s[7]) && isDigit(s[8]) && s[9] == ':' &&
            335 | 		isDigit(s[10]) && isDigit(s[11]) && s[12] == ':' &&
            336 | 		isDigit(s[13]) && isDigit(s[14])
            337 | }
            339 | // replaceTimestampISO replaces "YYYY-MM-DD HH:MM:SS" patterns.
            340 | func replaceTimestampISO(s string) string {
            341 | 	for {
            342 | 		idx := findISOTimestamp(s)
            343 | 		if idx < 0 {
            344 | 			break
            345 | 		}
            346 | 		// "YYYY-MM-DD HH:MM:SS" = 19 chars.
            347 | 		end := idx + 19
            348 | 		s = s[:idx] + timestampPlaceholder + s[end:]
            349 | 	}
            350 | 	return s
            351 | }
            353 | // findISOTimestamp returns the index of the first "YYYY-MM-DD HH:MM:SS"
            354 | // pattern in s, or -1 if none found.
            355 | func findISOTimestamp(s string) int {
            356 | 	// Minimum length is 19 chars.
            357 | 	for i := 0; i+19 <= len(s); i++ {
            358 | 		if isDigit(s[i]) && isDigit(s[i+1]) && isDigit(s[i+2]) && isDigit(s[i+3]) &&
            359 | 			s[i+4] == '-' && isDigit(s[i+5]) && isDigit(s[i+6]) &&
            360 | 			s[i+7] == '-' && isDigit(s[i+8]) && isDigit(s[i+9]) &&
            361 | 			s[i+10] == ' ' &&
            362 | 			isDigit(s[i+11]) && isDigit(s[i+12]) && s[i+13] == ':' &&
            363 | 			isDigit(s[i+14]) && isDigit(s[i+15]) && s[i+16] == ':' &&
            364 | 			isDigit(s[i+17]) && isDigit(s[i+18]) {
            365 | 			return i
            366 | 		}
            367 | 	}
            368 | 	return -1
            369 | }
            371 | // isDigit reports whether b is an ASCII digit.
            372 | func isDigit(b byte) bool {
            373 | 	return b >= '0' && b <= '9'
            374 | }
            376 | // isDigitOrSpace reports whether b is an ASCII digit or a space.
            377 | func isDigitOrSpace(b byte) bool {
            378 | 	return isDigit(b) || b == ' '
            379 | }
            381 | // truncateStdin returns a display-safe representation of stdin, truncated to
            382 | // stdinMaxDisplay bytes if longer.
            383 | func truncateStdin(stdin []byte) string {
            384 | 	if stdin == nil {
            385 | 		return "<nil>"
            386 | 	}
            387 | 	if len(stdin) <= stdinMaxDisplay {
            388 | 		return fmt.Sprintf("%q", stdin)
            389 | 	}
            390 | 	return fmt.Sprintf("%q... (%d bytes total)", stdin[:stdinMaxDisplay], len(stdin))
            391 | }
            393 | // checkExpectedFiles verifies that files written by the Go binary match the
            394 | // expected content specified in DiffTest.ExpectedFiles.
            395 | //
            396 | // Implements: prd001-testutils R5.1, R5.2
            397 | func checkExpectedFiles(t *testing.T, tc DiffTest, workDir string) {
            398 | 	t.Helper()
            400 | 	for relPath, expected := range tc.ExpectedFiles {
            401 | 		absPath := filepath.Join(workDir, relPath)
            402 | 		actual, err := os.ReadFile(absPath)
            403 | 		if err != nil {
            404 | 			t.Errorf("expected file %s: %v", relPath, err)
            405 | 			continue
            406 | 		}
            407 | 		if !bytes.Equal(expected, actual) {
            408 | 			t.Errorf("file content divergence for %s\n"+
            409 | 				"expected: %q\n"+
            410 | 				"actual:   %q",
            411 | 				relPath, expected, actual,
            412 | 			)
            413 | 		}
            414 | 	}
            415 | }
context: |-
    Task ID: 101
    Type: task
    Title: pkg/testutils: tests for differential testing harness (prd001-testutils R2, R3, R4, R5)
execution_constitution:
    articles:
        - id: E1
          title: Specification-first
          rule: |
            Code must correspond to existing PRDs and architecture. Read the PRDs and
            ARCHITECTURE sections listed in Required Reading before writing code. Do
            not invent interfaces, types, or patterns not described in those docs.
        - id: E2
          title: Traceability
          rule: |
            Commit messages must mention which PRDs (or aspects) are implemented.
            Example: "Implement X (prd-feature-name R6-R7)". Where useful (package or
            top-of-file comments), list the implemented PRDs.
        - id: E3
          title: No scope creep
          rule: |
            Do NOT modify files outside the Files to Create/Modify list unless a
            requirement explicitly demands it. Do NOT add features, refactoring, or
            improvements beyond what the requirements specify. Complete the task as
            scoped, nothing more.
        - id: E4
          title: Session completion
          rule: |
            Work is complete when all files are written and tests pass. Do NOT run
            any git commands. Git operations (add, commit, status, init) are handled
            externally by the orchestrator.
        - id: E5
          title: Quality gates
          rule: |
            Every item in Acceptance Criteria must be verified. Run tests if the
            criteria require it. Do not skip any criterion.
    coding_standards:
        copyright_header: |
            Every Go file must start with the SPDX copyright header:
            // Copyright (c) 2026 Petar Djukic. All rights reserved.
            // SPDX-License-Identifier: MIT
        never_duplicate_code: |
            Before writing a function, search for existing code that does the same thing.
            When two pieces of code share logic, extract the common part. The threshold
            is two: if you write the same thing twice, extract it.
        design_patterns:
            - Strategy: Multiple implementations, caller picks one. Define interface, not if/else ladder.
            - Command: Encapsulate actions for queuing, undo, or composition.
            - Facade: Simplified interface to complex subsystem. No toggle parameters.
            - Factory: Centralized construction via NewXxx() functions.
            - Decorator: Add cross-cutting concerns (logging, timing) without modifying the wrapped object.
            - Adapter: Interface translation for foreign APIs.
        interfaces: |
            Introduce an interface when you have two concrete implementations or when
            you need to mock a dependency in tests. Do not create an interface for a
            single implementation "just in case." Accept interfaces as parameters;
            return concrete structs. Keep interfaces small: one to three methods.
        struct_and_function_design: |
            Each struct represents one concept. Each function does one thing. If a
            function takes more than three parameters, group related parameters into a
            config struct. If a function exceeds 40 lines, find a seam and split it.
        error_handling: |
            Handle errors at the point they occur. Use guard clauses: check err != nil
            and return early. Wrap errors with context: fmt.Errorf("doing X: %w", err).
            Never silently discard an error with _ unless the operation is best-effort
            cleanup (e.g., removing a temp file). When discarding, leave a comment.
        no_magic_strings: |
            Centralize all string literals that name external binaries, file paths,
            URLs, or repeated text. Binary names: const (e.g., binGit, binGo). Large
            prompts: embedded .tmpl templates. Never scatter raw string literals.
        project_structure: |
            cmd/: Entry points. Minimal: parse flags, wire dependencies, start.
            internal/: Private implementation. Not importable outside this module.
            pkg/: Shared public types and interfaces. No implementation.
            tests/: Integration tests.
            magefiles/: Build tooling. Flat directory. One file per concern.

            Align package structure to PRD component structure. Each major component
            maps to one package. Avoid package names like util, common, helpers.
        standard_packages:
            - "Build automation: magefile/mage"
            - "CLI framework: spf13/cobra"
            - "Configuration: spf13/viper"
            - "Testing assertions: stretchr/testify"
            - "YAML parsing: gopkg.in/yaml.v3"
            - "JSON handling: encoding/json (stdlib)"
        naming_conventions:
            exported: PascalCase (e.g., CupboardConfig)
            unexported: camelCase (e.g., cobblerConfig)
            cli_flags: kebab-case (e.g., --silence-agent)
            binary_constants: "bin prefix + PascalCase (e.g., binGit, binClaude)"
            factories: "New prefix (e.g., NewBackend())"
            interfaces: "Action or capability (e.g., Table, Reader)"
        concurrency: |
            Pass context.Context as the first parameter to any function that does I/O
            or may block. Never start a goroutine without a plan for how it exits. Use
            sync.WaitGroup or a done channel to manage lifetimes.
        testing: |
            Every exported function and every meaningful branch deserves a test. Use
            table-driven parameterized tests for similar cases. Extract shared setup
            into test helpers. Build reusable test utilities in a testutil package.
    traceability:
        before_implementing:
            - Identify related PRDs, ARCHITECTURE, use cases, test suites, guidelines, VISION
            - Read the relevant sections so behavior, data shapes, and contracts are clear
            - Implement so the code conforms to the requirements and design described
        commit_message: |
            Must mention which PRDs (or aspects) are being implemented. Prefer explicit:
            "Implement X (prd-feature-name, prd-component)" or "Add Y per prd-feature R12".
            If only parts touched, say so: "Implement operation X (prd-feature R8, R13)".
        code_comments: |
            At the top of a file or package doc, list implemented PRDs and architecture
            sections. Do not repeat this in every function; use file- or package-level
            comments only.
        reference_paths:
            - "Architecture: docs/ARCHITECTURE.yaml"
            - "PRDs: docs/specs/product-requirements/prd*.yaml"
            - "Use cases: docs/specs/use-cases/rel*-uc*-*.yaml"
            - "Test suites (YAML specs): docs/specs/test-suites/test-rel-*.yaml"
            - "Release tests (Go): tests/rel-*/rel-*_test.go"
            - "Engineering guidelines: docs/engineering/eng*.md"
            - "Vision: docs/VISION.yaml"
    session_completion:
        git_managed_externally: true # Do NOT run any git commands
        token_tracking: true # Log tokens used per issue
        workflow:
            - Run quality gates if code changed (tests, linters, builds)
            - Ensure all files are written and saved
            - Verify code compiles and tests pass
        critical_rules:
            - Do NOT run any git commands (add, commit, status, init, rm .git)
            - Git is managed externally by the orchestrator
            - Your job is to write code and verify it works
            - Do NOT use cupboard commands
    technology:
        primary_language: Go
        python_manager: pixi # Use pixi for Python, not pip/pip3 directly
        cli_framework: cobra
        build_system: mage
        yaml_library: gopkg.in/yaml.v3
        issue_tracker: cupboard
    git_conventions:
        note: Git is managed externally. Do NOT run any git commands.
    sections:
        - tag: articles
          title: Core Principles
          content: |
            Six principles govern the stitch phase: specification-first development,
            commit traceability, no scope creep, session completion via
            orchestrator-managed git, quality gate enforcement, and prohibition of
            magic test values.
        - tag: coding_standards
          title: Coding Standards
          content: |
            Go code follows the project's style guide: typed error handling, no magic
            strings, one concept per struct, and design patterns applied to eliminate
            conditional branching. Interfaces are introduced only when two concrete
            implementations exist.
        - tag: traceability
          title: Traceability
          content: |
            Before implementing, read the specified PRDs and architecture sections.
            Commit messages must cite PRDs. Add a PRD list to file or package comments
            where useful.
        - tag: session_completion
          title: Session Completion
          content: |
            Work is complete when all files are written and tests pass. Git operations
            are managed externally by the orchestrator; do not run any git commands.
        - tag: technology
          title: Technology Stack
          content: |
            The project uses Go with mage for build automation, cobra for CLI, viper
            for configuration, yaml.v3 for YAML parsing, and cupboard for issue
            tracking.
        - tag: git_conventions
          title: Git Conventions
          content: |
            Git is managed externally. Do not run any git commands during a stitch
            session; the orchestrator handles all staging, committing, and branching.
go_style_constitution:
    copyright_header: |
        Every Go file must start with the SPDX copyright header before the package
        declaration:

          // Copyright (c) 2026 Petar Djukic. All rights reserved.
          // SPDX-License-Identifier: MIT

        This applies to hand-written files (magefiles/) and generated files (cmd/,
        pkg/, internal/, tests/). The header must appear on lines 1-2, followed by a
        blank line, then the package clause.
    duplication: |
        Before writing a function, search for existing code that does the same thing.
        Before adding a field, check whether a struct already carries it. When two
        pieces of code share logic, extract the common part. Use struct embedding to
        share fields. Use helper functions to share behavior. Use interfaces to share
        contracts. The threshold is two: if you write the same thing twice, extract it.
    design_patterns:
        - name: Strategy
          description: |
            Use when multiple implementations of the same operation exist and the
            caller picks one. Define a small interface. Each implementation is a struct
            (or a function type) satisfying that interface. The caller selects at
            configuration time, not with if chains.
          symptoms: |
            A switch or if/else ladder choosing between behaviors, a function parameter
            named mode or kind, boolean flags that toggle logic branches.
        - name: Command
          description: |
            Use when an action needs to be stored, queued, undone, or composed. Each
            command is a struct with an Execute() method. Commands can carry undo logic,
            be chained into sequences, or be logged for replay.
          symptoms: |
            Inline exec.Command calls scattered across a function, repeated sequences of
            shell operations that differ only in arguments, actions that should be
            retryable or reversible.
        - name: Facade
          description: |
            Use when a caller should not know about the internal steps of a multi-step
            process. The facade exposes one method; internally it orchestrates several
            components. Do not add toggle parameters to a facade. If the caller needs to
            control sub-steps, they should use the components directly.
          symptoms: |
            A function that grew boolean parameters to skip internal steps, a caller that
            must call three functions in a specific order, an Init/Do/Cleanup pattern that
            keeps getting duplicated.
        - name: Factory
          description: |
            Use NewXxx() functions to construct objects. Return concrete types but accept
            interfaces as dependencies. Factories centralize validation and wiring so
            callers never construct partially initialized structs.
        - name: Decorator
          description: |
            Use to add cross-cutting concerns (logging, timing, retries) without
            modifying the wrapped object. In Go, the decorator accepts and returns the
            same interface. HTTP middleware is the canonical example.
          symptoms: |
            Logging or timing code copy-pasted around every call to an interface, optional
            behavior toggled by a boolean that wraps the real logic.
        - name: Builder
          description: |
            Use when an object has many optional fields and constructing it in one call is
            unwieldy. Prefer the Functional Options variant (WithXxx functions) for
            idiomatic Go over a mutable builder struct.
        - name: Adapter
          description: |
            Use when existing code does not satisfy the interface a consumer expects.
            Write a thin wrapper that translates the foreign API into the local interface.
            Do not modify the foreign code.
        - name: Observer
          description: |
            Use channels for asynchronous event notification between goroutines. One
            producer writes to a channel; multiple consumers listen. Prefer this over
            callback registration when the producer should not know about its consumers.
    interfaces: |
        Introduce an interface when you have two concrete implementations or when you
        need to mock a dependency in tests. Do not create an interface for a single
        implementation "just in case." Accept interfaces as parameters; return concrete
        structs. Keep interfaces small: one to three methods. A large interface is a
        sign that the abstraction is wrong. Split it into focused interfaces and compose
        them.

        Do not use interface{} or any as function parameters, return types, or struct
        fields. Every value must have a concrete type or a named interface. If a
        function needs to accept multiple types, define an interface that captures the
        shared behavior, or use generics with type constraints. Type assertions and
        type switches on interface{}/any are symptoms of a missing abstraction. The
        only acceptable uses are stdlib boundaries that require it (e.g., json.Marshal,
        fmt.Sprintf variadic args).
    struct_and_function_design: |
        Each struct represents one concept. Each function does one thing. If a function
        takes more than three parameters, group related parameters into a config struct.
        If a function exceeds 200 lines, find a seam and split it. Name structs and
        functions by what they represent or do, not by how they are called. Avoid
        generic names (Manager, Handler, Helper, Processor) unless the struct genuinely
        manages, handles, or processes a well-defined resource.
    error_handling: |
        Handle errors at the point they occur. Use guard clauses: check err != nil and
        return early so the main logic stays at minimal indentation. Wrap errors with
        context: fmt.Errorf("doing X: %w", err). Each wrap adds the "why" at that
        layer, producing a readable chain when the error surfaces. Never silently
        discard an error with _ unless the operation is best-effort cleanup (e.g.,
        removing a temp file after the real work succeeded). When discarding, leave a
        comment explaining why.
    no_magic_strings: |
        Centralize all string literals that name external binaries, file paths, URLs,
        or repeated text. Binary names: const (e.g., binGit, binGo). Paths, prefixes,
        module names: const. Shared CLI arg slices: var. Large prompts with variable
        interpolation: embedded .tmpl templates. Short messages with interpolation:
        fmt.Sprintf at the call site. Static messages or labels: const. When adding a
        new external command or path, define the constant first, then use it. Never
        scatter raw string literals across files.
    project_structure: |
        cmd/: Entry points. Minimal: parse flags, wire dependencies, start.
        internal/: Private implementation. Not importable outside this module. One
        package per component.
        pkg/: Shared public types and interfaces. No implementation. The contract layer
        between libraries.
        tests/: Integration tests.
        magefiles/: Build tooling. Flat directory (mage constraint). One file per
        concern.

        Align package structure to PRD component structure. Each major component maps
        to one package. Avoid package names like util, common, helpers. Name packages
        by domain: storage, auth, config.

        Define interfaces between major components. The pkg/ directory holds shared
        types and interface contracts. The internal/ directory holds implementations
        that satisfy those contracts.
    standard_packages:
        - "Build automation: magefile/mage"
        - "CLI framework: spf13/cobra"
        - "Configuration: spf13/viper"
        - "Observability: go.opentelemetry.io/otel"
        - "Testing assertions: stretchr/testify"
        - "SQL database access: database/sql (stdlib) + mattn/go-sqlite3"
        - "HTTP routing: net/http (stdlib) or chi"
        - "YAML parsing: gopkg.in/yaml.v3"
        - "JSON handling: encoding/json (stdlib)"
        - "UUID generation: google/uuid"
    struct_embedding: |
        When two or more consumers share configuration fields, extract a common struct
        and embed it. Provide a registerXxxFlags helper when the shared fields map to
        CLI flags. Do not duplicate fields across sibling structs.
    naming_conventions:
        - "Exported types and functions: PascalCase (e.g., CupboardConfig)"
        - "Unexported types and functions: camelCase (e.g., cobblerConfig)"
        - "CLI flags: kebab-case (e.g., --silence-agent)"
        - "Constants for binaries: bin prefix + PascalCase (e.g., binGit, binClaude)"
        - "Factory functions: New prefix (e.g., NewBackend())"
        - "Interface names: Action or capability (e.g., Table, Reader)"
    concurrency: |
        Pass context.Context as the first parameter to any function that does I/O or
        may block. Never start a goroutine without a plan for how it exits. Use
        sync.WaitGroup or a done channel to manage lifetimes.
    testing: |
        Every exported function and every meaningful branch deserves a test. Use
        table-driven parameterized tests for similar cases. Each row is one scenario
        with named inputs and expected outputs. Extract shared setup into test helpers.
        Build reusable test utilities in a testutil package. When writing tests, ask
        what inputs break assumptions: zero values, nil pointers, empty slices,
        duplicate keys, boundary lengths, concurrent access. If a bug could hide there,
        write a case for it.
    code_review_checklist:
        - "No duplicated logic exists that could be extracted into a shared function or struct."
        - "No magic strings remain: all binaries, paths, and repeated text are centralized."
        - "Every error is handled or explicitly discarded with a comment."
        - "Every struct has a single, nameable responsibility."
        - "No function exceeds 200 lines without a strong reason."
        - "Interfaces are small (one to three methods) and have at least two implementations or a testing need."
        - "No boolean parameters toggle behavior that should be a Strategy or Decorator."
        - "Config structs embed shared fields rather than duplicating them."
        - "context.Context is threaded through I/O paths."
        - "Tests cover the contract, not the implementation."
    sections:
        - tag: copyright_header
          title: Copyright Header
          content: |
            Every Go file must begin with the SPDX copyright header line.
        - tag: duplication
          title: Code Duplication
          content: |
            Search for existing code before writing a new function. Extract shared
            logic at the two-occurrence threshold — if you write the same thing twice,
            extract it.
        - tag: design_patterns
          title: Design Patterns
          content: |
            Six patterns apply: Strategy, Command, Facade, Factory, Decorator, and
            Adapter. Select patterns to eliminate if/else ladders and centralize
            construction logic.
        - tag: interfaces
          title: Interfaces
          content: |
            Introduce an interface only when two concrete implementations exist or a
            dependency must be mocked in tests. Accept interfaces as parameters;
            return concrete structs. Keep interfaces small: one to three methods.
        - tag: struct_and_function_design
          title: Struct and Function Design
          content: |
            Each struct represents one concept; each function does one thing. Group
            more than three parameters into a config struct. Split functions exceeding
            40 lines at a natural seam.
        - tag: error_handling
          title: Error Handling
          content: |
            Handle errors at the point they occur with guard clauses. Wrap errors with
            context using fmt.Errorf. Never silently discard an error except for
            best-effort cleanup, and always leave a comment when discarding.
        - tag: no_magic_strings
          title: No Magic Strings
          content: |
            Centralize all string literals for binary names, file paths, URLs, and
            repeated text as named constants. Never scatter raw string literals.
        - tag: project_structure
          title: Project Structure
          content: |
            cmd/ for entry points, internal/ for private implementation, pkg/ for
            public shared types, tests/ for integration tests, magefiles/ for build
            tooling. Align package structure to PRD component structure.
        - tag: standard_packages
          title: Standard Packages
          content: |
            Approved dependencies: mage for build automation, cobra for CLI, viper for
            configuration, testify for test assertions, yaml.v3 for YAML parsing, and
            encoding/json from the standard library.
        - tag: naming_conventions
          title: Naming Conventions
          content: |
            Exported names use CamelCase; unexported use camelCase. CLI flags use
            kebab-case. Binary constants use the binXxx prefix. Factories use NewXxx.
            Interfaces are named to describe behavior, not implementation.
        - tag: concurrency
          title: Concurrency
          content: |
            Use sync.Mutex for shared mutable state. Avoid global variables accessed
            from goroutines. Thread context.Context through all I/O paths.
        - tag: testing
          title: Testing
          content: |
            Write table-driven tests using t.Run subtests. Use testify assertions.
            Mock external dependencies via interfaces. Tests cover contract, not
            implementation; include edge cases, boundary lengths, and concurrent access.
        - tag: code_review_checklist
          title: Code Review Checklist
          content: |
            Before closing, verify: no duplicated logic, no magic strings, every error
            handled or discarded with a comment, single-responsibility structs,
            functions under 200 lines, small interfaces with at least two
            implementations, no boolean-toggle parameters, and tests covering the
            contract.
task: |
    Follow these steps in order. Complete each step before moving to the next.

    1. **Review provided context** — The project_context above contains all project documentation and source code. Review the files listed in Required Reading by finding them in the project_context. Only use tools to read files that are NOT already provided above.

    2. **Plan approach** — Before writing code, determine:
       - What exists already (interfaces, types, patterns in the source code above)
       - What patterns to follow (from the provided source code and execution_constitution)
       - What the acceptance criteria require

    3. **Implement** — Complete the work described in Requirements and Files to Create/Modify. Follow the Design Decisions. Do not deviate from the specified files unless a requirement makes it necessary.

    4. **Verify** — Check every item in Acceptance Criteria. Run tests if the criteria require it. Do not skip any criterion.
constraints: |
    - Do NOT read files already provided in project_context. They are already inline above.
    - Do NOT explore the filesystem. Do NOT run ls, find, tree, or similar commands.
    - Do NOT modify files outside the Files to Create/Modify list unless a requirement explicitly demands it.
    - Do NOT use cupboard commands. Task tracking is handled externally.
    - Do NOT invent interfaces, types, or patterns not described in the source code, Required Reading, or PRDs.
    - Do NOT add features, refactoring, or improvements beyond what the requirements specify.
    - Do NOT run any git commands. No git add, git commit, git init, git status, rm .git, or any other git operation. Git is managed externally by the orchestrator. Just write code and verify it compiles and passes tests.
description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/product-requirements/prd001-testutils.yaml (full requirements for the differential testing harness)
      - pkg/testutils/difftest.go (existing implementation to test)
      - docs/specs/test-suites/test-rel-00.0.yaml (test suite specification for release 00.0)

    files:
      - path: pkg/testutils/difftest_test.go
        action: create
        note: Unit tests for the differential testing harness covering execution, comparison, normalizers, and file-state verification

    requirements:
      - id: R1
        text: "Test RunDiffTests with two identical helper binaries that produce matching stdout, stderr, and exit code -- verify no divergence is reported. Also test with deliberately diverging binaries -- verify t.Errorf is called with the divergence details (prd001-testutils R2.1, R3.2, R3.3, R3.4, R3.6)"
      - id: R2
        text: "Test buildEnv merges LC_ALL=C into the environment by default and overlays DiffTest.Env entries on top, replacing existing keys and appending new ones (prd001-testutils R2.6, R1.3)"
      - id: R3
        text: "Test normalizer pipeline: applyNormalizers applies functions in order, TimestampNormalizer replaces syslog format (Mon DD HH:MM:SS) and ISO format (YYYY-MM-DD HH:MM:SS) with a fixed placeholder, ComposeNormalizers chains multiple normalizers into one (prd001-testutils R4.1, R4.2, R4.3, R4.4)"
      - id: R4
        text: "Test checkExpectedFiles verifies file content matches ExpectedFiles map entries and reports divergence for mismatched or missing files (prd001-testutils R5.1, R5.2)"

    design_decisions:
      - id: D1
        text: "Test file is difftest_test.go, mirroring the source file difftest.go per project file naming convention (P7)"
      - id: D2
        text: "For RunDiffTests integration tests, compile a minimal helper Go program (in TestMain or test setup) that echoes stdin to stdout and exits with a configurable exit code passed via argument. This avoids depending on any GNU reference binary for harness self-tests -- the architecture defines the harness as executing two binaries with identical inputs, so testing it requires controllable binaries"
      - id: D3
        text: "Normalizer tests (R3) and environment tests (R2) are pure function tests that call exported and unexported functions directly -- they do not require binary execution"

    acceptance_criteria:
      - id: AC1
        text: "pkg/testutils/difftest_test.go exists and compiles with no errors under go vet"
      - id: AC2
        text: "go test ./pkg/testutils/... passes with all tests green"
      - id: AC3
        text: "RunDiffTests is exercised with both matching outputs (no failure) and deliberately diverging outputs (failure reported with args, stdin, stdout, stderr, and exit code in the message)"
      - id: AC4
        text: "TimestampNormalizer correctly replaces both syslog (e.g. Feb 19 12:34:56) and ISO (e.g. 2026-02-19 12:34:56) timestamps with the placeholder string"
      - id: AC5
        text: "checkExpectedFiles detects matching file content (passes) and mismatched file content (reports error with expected vs actual)"
