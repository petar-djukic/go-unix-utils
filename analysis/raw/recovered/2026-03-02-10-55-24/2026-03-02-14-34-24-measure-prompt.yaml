            14 | // FileInfo holds extended file metadata from the underlying unix.Stat_t,
            15 | // exposing fields not available from os.FileInfo: hard-link count, device
            16 | // and inode numbers, physical block counts, and nanosecond-precision
            17 | // modification time. The struct abstracts Darwin/Linux divergence in Stat_t
            18 | // field names and types so callers use a single API regardless of platform.
            19 | //
