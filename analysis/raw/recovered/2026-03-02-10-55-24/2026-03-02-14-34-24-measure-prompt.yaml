            46 | 	// Name is the subtest name used with t.Run. Required.
            47 | 	Name string
            49 | 	// Args are command-line arguments passed to both binaries.
            50 | 	Args []string
            52 | 	// Stdin is piped to both binaries. nil means both binaries receive EOF
            53 | 	// immediately. An empty non-nil slice ([]byte{}) also produces no bytes
            54 | 	// but is semantically distinct (open stdin that is immediately closed).
            55 | 	//
