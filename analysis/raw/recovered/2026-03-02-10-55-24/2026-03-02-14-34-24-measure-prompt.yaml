            4 | // Package sys wraps Darwin and Linux syscalls, providing a stable interface
            5 | // for cmd/ packages. Only syscalls that have platform divergence between
            6 | // Darwin and Linux, or that Go's standard library does not expose cleanly,
            7 | // belong here. cmd/ packages use pkg/sys instead of importing
            8 | // golang.org/x/sys/unix directly.
            9 | //
            10 | // Implements prd002-sys (R1, R2).
            11 | package sys
            13 | import (
            14 | 	"fmt"
            16 | 	"golang.org/x/sys/unix"
            17 | )
            19 | // IsTerminal reports whether fd refers to a terminal device. It calls the
            20 | // TIOCGWINSZ ioctl via golang.org/x/sys/unix and returns true when the call
            21 | // succeeds. Returns false for pipes, regular files, and other non-terminal
            22 | // descriptors.
            23 | //
            24 | // prd002-sys R1.3.
            25 | func IsTerminal(fd uintptr) bool {
            26 | 	_, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            27 | 	return err == nil
            28 | }
            30 | // TerminalSize queries the terminal dimensions (rows and columns) for the given
            31 | // file descriptor using the TIOCGWINSZ ioctl via golang.org/x/sys/unix.
            32 | // Returns an error when fd is not a terminal or the ioctl fails.
            33 | //
            34 | // prd002-sys R1.1, R1.2.
            35 | func TerminalSize(fd uintptr) (rows int, cols int, err error) {
            36 | 	ws, err := unix.IoctlGetWinsize(int(fd), unix.TIOCGWINSZ)
            37 | 	if err != nil {
            38 | 		return 0, 0, fmt.Errorf("querying terminal size: %w", err)
            39 | 	}
            40 | 	return int(ws.Row), int(ws.Col), nil
            41 | }
