            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package format provides output formatting shared across utilities including
            5 | // column alignment, ANSI color output, and human-readable size conversion.
            6 | //
            7 | // Implements prd003-format (R1, R2, R3).
            8 | package format
            10 | import "fmt"
            12 | // HumanSizeOpts configures human-readable size formatting.
            13 | type HumanSizeOpts struct {
            14 | 	// Binary selects the unit base. true uses 1024-based units with suffixes
            15 | 	// K, M, G, T, P, E. false uses SI 1000-based units with suffixes
            16 | 	// kB, MB, GB, TB.
            17 | 	Binary bool
            18 | }
            20 | var (
            21 | 	binarySuffixes = []string{"", "K", "M", "G", "T", "P", "E"}
            22 | 	siSuffixes     = []string{"", "kB", "MB", "GB", "TB"}
            23 | )
            25 | // HumanSize converts a byte count to a human-readable string matching GNU
            26 | // coreutils human_readable() behavior. Values below the first unit threshold
            27 | // are returned as plain integers. Values at or above a unit threshold are
            28 | // formatted with one decimal place when under 10, or zero decimal places
            29 | // otherwise. Zero always returns "0".
            30 | //
            31 | // prd003-format R3.
            32 | func HumanSize(bytes int64, opts HumanSizeOpts) string {
            33 | 	if bytes == 0 {
            34 | 		return "0"
            35 | 	}
            37 | 	base := 1000.0
            38 | 	suffixes := siSuffixes
            39 | 	if opts.Binary {
            40 | 		base = 1024.0
            41 | 		suffixes = binarySuffixes
            42 | 	}
            44 | 	val := float64(bytes)
            45 | 	for i := 0; i < len(suffixes)-1; i++ {
            46 | 		if val < base {
            47 | 			if i == 0 {
            48 | 				return fmt.Sprintf("%d", bytes)
            49 | 			}
            50 | 			return formatWithSuffix(val, suffixes[i])
            51 | 		}
            52 | 		val /= base
            53 | 	}
            54 | 	return formatWithSuffix(val, suffixes[len(suffixes)-1])
            55 | }
            57 | // formatWithSuffix formats a scaled value with its unit suffix. Uses one
            58 | // decimal place for values under 10, no decimal place otherwise.
            59 | func formatWithSuffix(val float64, suffix string) string {
            60 | 	if val < 10 {
            61 | 		return fmt.Sprintf("%.1f%s", val, suffix)
            62 | 	}
            63 | 	return fmt.Sprintf("%.0f%s", val, suffix)
            64 | }
        - file: pkg/format/table.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package format
            6 | import (
            7 | 	"strings"
            8 | 	"unicode/utf8"
            9 | )
            11 | const columnGap = 2 // spaces between columns, matching GNU ls
            13 | // displayWidth returns the display width of s in terminal columns. Uses rune
            14 | // count, not byte count, so multi-byte UTF-8 characters are measured correctly.
            15 | // East-asian full-width handling is deferred per prd003-format R1.3.
            16 | func displayWidth(s string) int {
            17 | 	return utf8.RuneCountInString(s)
            18 | }
            20 | // Columns distributes entries into the maximum number of columns that fit
            21 | // within termWidth, using row-major (across) order matching gls --format=across.
            22 | // Column widths are computed from the longest entry in each column, not the
            23 | // global maximum. Returns nil for empty input.
            24 | //
            25 | // prd003-format R1.1, R1.4.
            26 | func Columns(entries []string, termWidth int) [][]string {
            27 | 	if len(entries) == 0 {
            28 | 		return nil
            29 | 	}
            31 | 	n := len(entries)
            33 | 	// Try column counts from maximum down to 1.
            34 | 	for numCols := n; numCols >= 1; numCols-- {
            35 | 		numRows := (n + numCols - 1) / numCols
            37 | 		// Calculate per-column widths from entries in row-major order.
            38 | 		colWidths := make([]int, numCols)
            39 | 		for i, entry := range entries {
            40 | 			col := i % numCols
            41 | 			w := displayWidth(entry)
            42 | 			if w > colWidths[col] {
            43 | 				colWidths[col] = w
            44 | 			}
            45 | 		}
            47 | 		// Total width: sum of column widths + gaps between columns.
            48 | 		totalWidth := 0
            49 | 		for _, w := range colWidths {
            50 | 			totalWidth += w
            51 | 		}
            52 | 		totalWidth += columnGap * (numCols - 1)
            54 | 		if totalWidth <= termWidth || numCols == 1 {
            55 | 			grid := make([][]string, numRows)
            56 | 			for r := 0; r < numRows; r++ {
            57 | 				row := make([]string, 0, numCols)
            58 | 				for c := 0; c < numCols; c++ {
            59 | 					idx := r*numCols + c
            60 | 					if idx < n {
            61 | 						row = append(row, entries[idx])
            62 | 					}
            63 | 				}
            64 | 				grid[r] = row
            65 | 			}
            66 | 			return grid
            67 | 		}
            68 | 	}
            70 | 	return nil // unreachable: numCols == 1 always succeeds
            71 | }
            73 | // PadRight returns s padded with trailing spaces to the specified display
            74 | // width. If s is already at or beyond width, it is returned unchanged.
            75 | //
            76 | // prd003-format R1.2.
            77 | func PadRight(s string, width int) string {
            78 | 	w := displayWidth(s)
            79 | 	if w >= width {
            80 | 		return s
            81 | 	}
            82 | 	return s + strings.Repeat(" ", width-w)
            83 | }
            85 | // PadLeft returns s padded with leading spaces to the specified display width.
            86 | // If s is already at or beyond width, it is returned unchanged.
            87 | //
            88 | // prd003-format R1.2.
            89 | func PadLeft(s string, width int) string {
            90 | 	w := displayWidth(s)
            91 | 	if w >= width {
            92 | 		return s
            93 | 	}
            94 | 	return strings.Repeat(" ", width-w) + s
            95 | }
