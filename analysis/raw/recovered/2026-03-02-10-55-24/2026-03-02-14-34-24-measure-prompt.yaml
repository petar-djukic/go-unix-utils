            22 | 	Mode    os.FileMode // file mode and type bits (from syscall.Stat_t.Mode)
            23 | 	Size    int64       // apparent file size in bytes (st_size)
            24 | 	Nlink   uint64      // hard-link count (st_nlink)
            25 | 	Uid     uint32      // owner user ID (st_uid)
            26 | 	Gid     uint32      // owner group ID (st_gid)
            27 | 	Rdev    uint64      // device ID for special files (st_rdev)
            28 | 	Dev     uint64      // device ID of the containing filesystem (st_dev)
            29 | 	Ino     uint64      // inode number (st_ino)
            30 | 	Blocks  int64       // number of 512-byte blocks allocated (st_blocks)
            31 | 	Blksize int64       // preferred I/O block size (st_blksize)
            32 | 	ModTime time.Time   // modification time (st_mtime / st_mtimespec)
            33 | 	Info    os.FileInfo // underlying os.FileInfo for os package compatibility
            34 | }
            36 | // Stat returns extended file metadata for path, following symbolic links.
            37 | // It combines os.Stat (for os.FileInfo compatibility) with unix.Stat (for
            38 | // extended Stat_t fields). Platform-divergent field extraction is handled
            39 | // by fillFromStat in stat_darwin.go / stat_linux.go.
            40 | //
            41 | // prd002-sys R2.1.
            42 | func Stat(path string) (*FileInfo, error) {
            43 | 	var st unix.Stat_t
            44 | 	if err := unix.Stat(path, &st); err != nil {
            45 | 		return nil, fmt.Errorf("stat %s: %w", path, err)
            46 | 	}
            47 | 	osInfo, err := os.Stat(path)
            48 | 	if err != nil {
            49 | 		return nil, fmt.Errorf("stat %s: %w", path, err)
            50 | 	}
            51 | 	return newFileInfo(&st, osInfo), nil
            52 | }
            54 | // Lstat returns extended file metadata for path without following symbolic
            55 | // links. When path is a symlink, the returned FileInfo describes the symlink
            56 | // itself, not its target.
            57 | //
            58 | // prd002-sys R2.1.
            59 | func Lstat(path string) (*FileInfo, error) {
            60 | 	var st unix.Stat_t
            61 | 	if err := unix.Lstat(path, &st); err != nil {
            62 | 		return nil, fmt.Errorf("lstat %s: %w", path, err)
            63 | 	}
            64 | 	osInfo, err := os.Lstat(path)
            65 | 	if err != nil {
