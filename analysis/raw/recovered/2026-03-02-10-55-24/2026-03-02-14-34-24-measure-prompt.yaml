            25 | )
            27 | var (
            28 | 	colorMu       sync.RWMutex
            29 | 	colorOverride *bool // nil = auto, non-nil = forced
            30 | )
            32 | // SetColorEnabled overrides automatic TTY detection. When set to true,
            33 | // FileTypeColor and Reset return ANSI sequences regardless of whether stdout
            34 | // is a TTY. When set to false, they return empty strings regardless. The
            35 | // override is process-global.
            36 | //
            37 | // prd003-format R2.6.
            38 | func SetColorEnabled(enabled bool) {
            39 | 	colorMu.Lock()
            40 | 	defer colorMu.Unlock()
            41 | 	colorOverride = &enabled
            42 | }
            44 | // ResetColorEnabled clears any override set by SetColorEnabled, reverting to
            45 | // automatic TTY detection via ColorEnabled. Utilities should call this in
            46 | // deferred cleanup or test teardown to avoid leaking the override.
            47 | //
            48 | // prd003-format R2.7.
            49 | func ResetColorEnabled() {
            50 | 	colorMu.Lock()
            51 | 	defer colorMu.Unlock()
            52 | 	colorOverride = nil
            53 | }
            55 | // ColorEnabled returns true when w is backed by a TTY file descriptor. It
            56 | // attempts a type assertion to *os.File and checks the descriptor with
            57 | // TIOCGWINSZ. Non-*os.File writers and pipe descriptors return false.
            58 | //
            59 | // prd003-format R2.3.
            60 | func ColorEnabled(w io.Writer) bool {
            61 | 	f, ok := w.(*os.File)
            62 | 	if !ok {
            63 | 		return false
            64 | 	}
            65 | 	return isTerminal(f.Fd())
            66 | }
            68 | // isColorActive checks the process-global color state. When an override is
            69 | // set, it returns the override value. In auto mode, it checks os.Stdout.
            70 | func isColorActive() bool {
            71 | 	colorMu.RLock()
            72 | 	defer colorMu.RUnlock()
