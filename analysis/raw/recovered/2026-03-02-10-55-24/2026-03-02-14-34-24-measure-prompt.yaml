            87 | // newFileInfo populates a FileInfo from a unix.Stat_t and the corresponding
            88 | // os.FileInfo. Fields with identical types across Darwin and Linux are set
            89 | // here. Platform-divergent fields (ModTime, Nlink, Dev, Rdev, Blksize) are
            90 | // populated by fillFromStat, defined in stat_darwin.go and stat_linux.go.
            91 | //
            92 | // prd002-sys R2.2, R2.3.
            93 | func newFileInfo(st *unix.Stat_t, osInfo os.FileInfo) *FileInfo {
            94 | 	fi := &FileInfo{
            95 | 		Mode:   osInfo.Mode(),
            96 | 		Size:   st.Size,
            97 | 		Uid:    st.Uid,
            98 | 		Gid:    st.Gid,
            99 | 		Ino:    st.Ino,
