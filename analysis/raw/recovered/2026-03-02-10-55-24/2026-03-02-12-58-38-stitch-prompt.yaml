            406 | 			},
            407 | 		}
            408 | 		checkExpectedFiles(t, tc, tmpDir)
            409 | 		return
            410 | 	}
            412 | 	cmd := exec.Command(os.Args[0], "-test.run=^TestCheckExpectedFiles_Mismatch$", "-test.v")
            413 | 	cmd.Env = append(os.Environ(), envSubprocess+"=file-mismatch")
            414 | 	out, err := cmd.CombinedOutput()
            415 | 	if err == nil {
            416 | 		t.Fatal("expected test to fail due to file content mismatch, but it passed")
            417 | 	}
            418 | 	if !strings.Contains(string(out), "file content divergence") {
            419 | 		t.Fatalf("expected 'file content divergence' in output, got:\n%s", out)
            420 | 	}
            421 | }
            423 | func TestCheckExpectedFiles_Missing(t *testing.T) {
            424 | 	if os.Getenv(envSubprocess) == "file-missing" {
            425 | 		tmpDir := t.TempDir()
            426 | 		tc := DiffTest{
