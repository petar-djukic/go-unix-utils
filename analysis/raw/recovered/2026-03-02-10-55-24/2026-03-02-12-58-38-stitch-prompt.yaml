            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package sys wraps Darwin and Linux syscalls into a portable API so that
            5 | // cmd/ packages never import platform-specific packages directly.
            6 | //
            7 | // Implements: prd002-sys R1 (terminal size), R2 (extended file metadata)
            8 | package sys
            10 | import (
            11 | 	"os"
            12 | 	"syscall"
            13 | 	"time"
            14 | )
            16 | // FileInfo holds extended file metadata extracted from syscall.Stat_t.
            17 | // Callers use this type to access fields that os.FileInfo does not expose,
            18 | // such as hard-link count, device and inode numbers, and physical block
            19 | // counts. Platform-specific Stat_t field extraction is handled by
            20 | // fillFromStat in the build-tagged files.
            21 | //
            22 | // Implements: prd002-sys R2.2
            23 | type FileInfo struct {
            24 | 	Mode    os.FileMode // file mode and type bits (from syscall.Stat_t.Mode)
            25 | 	Size    int64       // apparent file size in bytes (st_size)
            26 | 	Nlink   uint64      // hard-link count (st_nlink)
            27 | 	Uid     uint32      // owner user ID (st_uid)
            28 | 	Gid     uint32      // owner group ID (st_gid)
            29 | 	Rdev    uint64      // device ID for special files (st_rdev)
            30 | 	Dev     uint64      // device ID of the containing filesystem (st_dev)
            31 | 	Ino     uint64      // inode number (st_ino)
            32 | 	Blocks  int64       // number of 512-byte blocks allocated (st_blocks)
            33 | 	Blksize int64       // preferred I/O block size (st_blksize)
            34 | 	ModTime time.Time   // modification time (st_mtime / st_mtimespec)
            35 | 	Info    os.FileInfo // underlying os.FileInfo for os package compatibility
            36 | }
            38 | // Lstat returns extended file metadata without following symbolic links.
            39 | // It wraps os.Lstat and populates the FileInfo fields from the
            40 | // platform-specific syscall.Stat_t.
            41 | //
            42 | // Implements: prd002-sys R2.1, R2.3
            43 | func Lstat(path string) (*FileInfo, error) {
            44 | 	info, err := os.Lstat(path)
            45 | 	if err != nil {
            46 | 		return nil, err
            47 | 	}
            49 | 	fi := &FileInfo{
            50 | 		Mode: info.Mode(),
            51 | 		Size: info.Size(),
            52 | 		Info: info,
            53 | 	}
            55 | 	stat, ok := info.Sys().(*syscall.Stat_t)
            56 | 	if !ok {
            57 | 		return fi, nil
            58 | 	}
            60 | 	fillFromStat(fi, stat)
            61 | 	return fi, nil
            62 | }
