            84 | // buildHelper compiles a single-file Go main program and returns the binary path.
            85 | func buildHelper(parentDir, name, source string) (string, error) {
            86 | 	srcDir := filepath.Join(parentDir, "src-"+name)
            87 | 	if err := os.MkdirAll(srcDir, 0o755); err != nil {
            88 | 		return "", err
            89 | 	}
            91 | 	goMod := "module " + name + "\n\ngo 1.25\n"
            92 | 	if err := os.WriteFile(filepath.Join(srcDir, "go.mod"), []byte(goMod), 0o644); err != nil {
            93 | 		return "", err
            94 | 	}
            95 | 	if err := os.WriteFile(filepath.Join(srcDir, "main.go"), []byte(source), 0o644); err != nil {
            96 | 		return "", err
            97 | 	}
            99 | 	binPath := filepath.Join(parentDir, name)
            100 | 	cmd := exec.Command("go", "build", "-o", binPath, ".")
            101 | 	cmd.Dir = srcDir
            102 | 	if out, err := cmd.CombinedOutput(); err != nil {
            103 | 		return "", fmt.Errorf("go build %s: %w\n%s", name, err, out)
            104 | 	}
            105 | 	return binPath, nil
            106 | }
