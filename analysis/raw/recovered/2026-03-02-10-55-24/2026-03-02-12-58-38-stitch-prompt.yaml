            387 | 	}
            389 | 	tc := DiffTest{
            390 | 		ExpectedFiles: map[string][]byte{
            391 | 			"output.txt": content,
            392 | 		},
            393 | 	}
            394 | 	checkExpectedFiles(t, tc, tmpDir)
            395 | }
            397 | func TestCheckExpectedFiles_Mismatch(t *testing.T) {
            398 | 	if os.Getenv(envSubprocess) == "file-mismatch" {
            399 | 		tmpDir := t.TempDir()
            400 | 		if err := os.WriteFile(filepath.Join(tmpDir, "output.txt"), []byte("actual\n"), 0o644); err != nil {
            401 | 			t.Fatalf("writing test file: %v", err)
            402 | 		}
            403 | 		tc := DiffTest{
            404 | 			ExpectedFiles: map[string][]byte{
