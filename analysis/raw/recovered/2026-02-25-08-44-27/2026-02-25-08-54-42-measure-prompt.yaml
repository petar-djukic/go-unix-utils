            365 | // the remaining strftime directives to Go time.Format layout tokens.
            366 | // Per design decision D1 and prd004-ts R2.1-R2.3.
            367 | func convertFormat(strftimeFmt string) (goLayout string, hasDotS, hasDots, hasDotT bool) {
            368 | 	// Pre-process ts-specific extensions before general strftime conversion.
            369 | 	processed := strftimeFmt
            370 | 	if strings.Contains(processed, "%.S") {
            371 | 		hasDotS = true
            372 | 		processed = strings.ReplaceAll(processed, "%.S", sentinelDotS)
            373 | 	}
            374 | 	if strings.Contains(processed, "%.s") {
            375 | 		hasDots = true
            376 | 		processed = strings.ReplaceAll(processed, "%.s", sentinelDots)
            377 | 	}
            378 | 	if strings.Contains(processed, "%.T") {
            379 | 		hasDotT = true
            380 | 		processed = strings.ReplaceAll(processed, "%.T", sentinelDotT)
            381 | 	}
            383 | 	goLayout = strftimeToGo(processed)
            384 | 	return goLayout, hasDotS, hasDots, hasDotT
            385 | }
            387 | // strftimeToGo converts a strftime format string to a Go time.Format layout string.
            388 | // Per prd004-ts R2.2 and design decision D1.
            389 | func strftimeToGo(format string) string {
            390 | 	var result strings.Builder
            391 | 	runes := []rune(format)
            393 | 	for i := 0; i < len(runes); i++ {
            394 | 		if runes[i] == '%' && i+1 < len(runes) {
            395 | 			i++
            396 | 			switch runes[i] {
            397 | 			case 'Y': // Four-digit year
            398 | 				result.WriteString("2006")
            399 | 			case 'y': // Two-digit year
            400 | 				result.WriteString("06")
            401 | 			case 'm': // Month as zero-padded decimal
            402 | 				result.WriteString("01")
            403 | 			case 'd': // Day of month as zero-padded decimal
            404 | 				result.WriteString("02")
            405 | 			case 'e': // Day of month, space-padded
            406 | 				result.WriteString("_2")
            407 | 			case 'H': // Hour (24-hour) as zero-padded decimal
            408 | 				result.WriteString("15")
            409 | 			case 'I': // Hour (12-hour) as zero-padded decimal
            410 | 				result.WriteString("03")
            411 | 			case 'M': // Minute as zero-padded decimal
            412 | 				result.WriteString("04")
            413 | 			case 'S': // Second as zero-padded decimal
            414 | 				result.WriteString("05")
            415 | 			case 'b', 'h': // Abbreviated month name
            416 | 				result.WriteString("Jan")
            417 | 			case 'B': // Full month name
            418 | 				result.WriteString("January")
            419 | 			case 'a': // Abbreviated weekday name
            420 | 				result.WriteString("Mon")
            421 | 			case 'A': // Full weekday name
            422 | 				result.WriteString("Monday")
            423 | 			case 'p': // AM/PM
            424 | 				result.WriteString("PM")
            425 | 			case 'P': // am/pm
            426 | 				result.WriteString("pm")
            427 | 			case 'Z': // Timezone abbreviation
            428 | 				result.WriteString("MST")
            429 | 			case 'z': // Timezone offset
            430 | 				result.WriteString("-0700")
            431 | 			case 'j': // Day of year (001-366) - Go doesn't have a direct equivalent
            432 | 				result.WriteString("002") // Go's yearday placeholder, but non-standard
            433 | 			case 'u': // Weekday as number (1=Monday)
            434 | 				// Go has no direct equivalent; we use a placeholder
            435 | 				result.WriteString("Mon")
            436 | 			case 'w': // Weekday as number (0=Sunday)
            437 | 				result.WriteString("Mon")
            438 | 			case 's': // Unix epoch seconds
            439 | 				result.WriteString(sentinelEpoch)
            440 | 			case 'T': // Equivalent to %H:%M:%S
            441 | 				result.WriteString("15:04:05")
            442 | 			case 'F': // Equivalent to %Y-%m-%d
            443 | 				result.WriteString("2006-01-02")
            444 | 			case 'R': // Equivalent to %H:%M
            445 | 				result.WriteString("15:04")
            446 | 			case 'D': // Equivalent to %m/%d/%y
            447 | 				result.WriteString("01/02/06")
            448 | 			case 'n': // Newline
            449 | 				result.WriteRune('\n')
            450 | 			case 't': // Tab
            451 | 				result.WriteRune('\t')
            452 | 			case '%': // Literal percent
            453 | 				result.WriteRune('%')
            454 | 			case 'r': // 12-hour time (e.g., "11:11:04 PM")
            455 | 				result.WriteString("03:04:05 PM")
            456 | 			case 'c': // Date and time representation
            457 | 				result.WriteString("Mon Jan _2 15:04:05 2006")
            458 | 			case 'x': // Date representation
            459 | 				result.WriteString("01/02/06")
            460 | 			case 'X': // Time representation
            461 | 				result.WriteString("15:04:05")
            462 | 			default:
            463 | 				// Unknown directive: pass through literally.
            464 | 				result.WriteRune('%')
            465 | 				result.WriteRune(runes[i])
            466 | 			}
            467 | 		} else {
            468 | 			result.WriteRune(runes[i])
            469 | 		}
            470 | 	}
            472 | 	return result.String()
            473 | }
            475 | // formatTimestamp formats a wall-clock time using the converted Go layout,
            476 | // substituting subsecond extension sentinels with actual values.
            477 | // Per prd004-ts R2.3-R2.4.
            478 | func formatTimestamp(t time.Time, goLayout string, hasDotS, hasDots, hasDotT bool) string {
            479 | 	result := t.Format(goLayout)
            481 | 	usec := t.Nanosecond() / 1000 // Microseconds from a single time sample.
            483 | 	if hasDotS {
            484 | 		// %.S: seconds with microsecond suffix, e.g. "32.001234"
            485 | 		secStr := fmt.Sprintf("%02d.%06d", t.Second(), usec)
            486 | 		result = strings.ReplaceAll(result, sentinelDotS, secStr)
            487 | 	}
            488 | 	if hasDots {
            489 | 		// %.s: Unix epoch with microsecond suffix, e.g. "1708358732.001234"
            490 | 		epochStr := fmt.Sprintf("%d.%06d", t.Unix(), usec)
            491 | 		result = strings.ReplaceAll(result, sentinelDots, epochStr)
            492 | 	}
            493 | 	if hasDotT {
            494 | 		// %.T: HH:MM:SS with microsecond suffix, e.g. "14:05:32.001234"
            495 | 		timeStr := fmt.Sprintf("%02d:%02d:%02d.%06d", t.Hour(), t.Minute(), t.Second(), usec)
            496 | 		result = strings.ReplaceAll(result, sentinelDotT, timeStr)
            497 | 	}
            499 | 	// %s: standard Unix epoch seconds (no microseconds).
            500 | 	if strings.Contains(result, sentinelEpoch) {
            501 | 		result = strings.ReplaceAll(result, sentinelEpoch, fmt.Sprintf("%d", t.Unix()))
            502 | 	}
            504 | 	return result
            505 | }
            507 | // formatElapsed formats an elapsed duration using the converted Go layout with
            508 | // TZ=GMT. The delta is converted to a time.Time at epoch + delta for strftime
            509 | // compatibility.
            510 | // Per design decision D2 and prd004-ts R3.2, R4.2, R8.2.
            511 | func formatElapsed(d time.Duration, goLayout string, hasDotS, hasDots, hasDotT bool) string {
            512 | 	// Construct a time.Time from epoch + delta seconds in GMT.
            513 | 	epochGMT := time.Unix(0, 0).In(gmtZone)
            514 | 	t := epochGMT.Add(d)
            516 | 	result := t.Format(goLayout)
            518 | 	usec := int64(d/time.Microsecond) % 1000000
            520 | 	if hasDotS {
            521 | 		sec := int64(d / time.Second)
            522 | 		secStr := fmt.Sprintf("%02d.%06d", sec%60, usec)
            523 | 		result = strings.ReplaceAll(result, sentinelDotS, secStr)
            524 | 	}
            525 | 	if hasDots {
            526 | 		totalSec := int64(d / time.Second)
            527 | 		epochStr := fmt.Sprintf("%d.%06d", totalSec, usec)
            528 | 		result = strings.ReplaceAll(result, sentinelDots, epochStr)
            529 | 	}
            530 | 	if hasDotT {
            531 | 		totalSec := int64(d / time.Second)
            532 | 		hours := totalSec / 3600
            533 | 		minutes := (totalSec % 3600) / 60
            534 | 		seconds := totalSec % 60
            535 | 		timeStr := fmt.Sprintf("%02d:%02d:%02d.%06d", hours, minutes, seconds, usec)
            536 | 		result = strings.ReplaceAll(result, sentinelDotT, timeStr)
            537 | 	}
            539 | 	// %s: standard Unix epoch seconds for elapsed mode.
            540 | 	if strings.Contains(result, sentinelEpoch) {
            541 | 		totalSec := int64(d / time.Second)
            542 | 		result = strings.ReplaceAll(result, sentinelEpoch, fmt.Sprintf("%d", totalSec))
            543 | 	}
            545 | 	return result
            546 | }
