            53 | // parseFlags parses sponge command-line arguments using manual flag parsing.
            54 | // Per design decision D1: iterate over os.Args[1:], handle '-a' as append flag,
            55 | // treat '--' as end of flags, remaining positional arg is the output filename.
            56 | func parseFlags(args []string) (options, string, error) {
            57 | 	var opts options
            58 | 	var files []string
            60 | 	for i := 0; i < len(args); i++ {
            61 | 		arg := args[i]
            63 | 		if arg == "--" {
            64 | 			files = append(files, args[i+1:]...)
            65 | 			break
            66 | 		}
            68 | 		if len(arg) > 1 && arg[0] == '-' {
            69 | 			for _, ch := range arg[1:] {
            70 | 				switch ch {
            71 | 				case 'a':
            72 | 					// Per prd007-sponge R3: append mode.
            73 | 					opts.append = true
            74 | 				default:
            75 | 					return options{}, "", fmt.Errorf("invalid option -- '%c'", ch)
            76 | 				}
            77 | 			}
            78 | 		} else {
            79 | 			files = append(files, arg)
            80 | 		}
            81 | 	}
            83 | 	var outputFile string
            84 | 	if len(files) > 0 {
            85 | 		outputFile = files[0]
            86 | 	}
            88 | 	return opts, outputFile, nil
            89 | }
            91 | // run executes the sponge logic: soak stdin, then write to output.
            92 | func run(opts options, outputFile string) error {
            93 | 	// Soak all of stdin. Per prd007-sponge R1.1: read all bytes before
            94 | 	// opening the output file.
            95 | 	buf, tmpFile, err := soakStdin()
            96 | 	if err != nil {
            97 | 		if tmpFile != nil {
            98 | 			tmpFile.Close()
            99 | 			os.Remove(tmpFile.Name()) // best-effort cleanup
            100 | 		}
            101 | 		return fmt.Errorf("reading stdin: %w", err)
            102 | 	}
            104 | 	// Register cleanup for the temp file if one was created.
            105 | 	// Per prd007-sponge R1.5.
            106 | 	if tmpFile != nil {
            107 | 		registerCleanup(tmpFile.Name())
            108 | 	}
            110 | 	if outputFile == "" {
            111 | 		// Passthrough mode. Per prd007-sponge R4.1-R4.3.
            112 | 		err = writePassthrough(buf, tmpFile)
            113 | 		if tmpFile != nil {
            114 | 			tmpFile.Close()
            115 | 			os.Remove(tmpFile.Name()) // best-effort cleanup
            116 | 		}
            117 | 		return err
            118 | 	}
            120 | 	// Output file mode. Per prd007-sponge R2.
            121 | 	err = writeOutputFile(buf, tmpFile, outputFile, opts.append)
            122 | 	if tmpFile != nil {
            123 | 		tmpFile.Close()
            124 | 		os.Remove(tmpFile.Name()) // best-effort cleanup
            125 | 	}
            126 | 	return err
            127 | }
            129 | // soakStdin reads all of stdin into memory. If the buffer exceeds the memory
            130 | // threshold, it spills to a temp file and continues reading.
            131 | //
            132 | // Returns the in-memory buffer (may be nil if spilled) and a temp file (may be
            133 | // nil if everything fit in memory).
            134 | //
            135 | // Per prd007-sponge R1.1, R1.2, R1.3, R1.4.
            136 | func soakStdin() ([]byte, *os.File, error) {
            137 | 	buf := make([]byte, 0, initialBufSize)
            138 | 	threshold := memoryThreshold()
            140 | 	chunk := make([]byte, initialBufSize)
            141 | 	var tmpFile *os.File
            143 | 	for {
            144 | 		n, readErr := os.Stdin.Read(chunk)
            145 | 		if n > 0 {
            146 | 			if tmpFile != nil {
            147 | 				// Already spilled: write directly to temp file.
            148 | 				if _, err := tmpFile.Write(chunk[:n]); err != nil {
            149 | 					return nil, tmpFile, fmt.Errorf("writing to temp file: %w", err)
            150 | 				}
            151 | 			} else {
            152 | 				buf = append(buf, chunk[:n]...)
            153 | 				// Check if we need to spill.
            154 | 				// Per prd007-sponge R1.3.
            155 | 				if int64(len(buf)) > threshold {
            156 | 					var err error
            157 | 					tmpFile, err = createTempFile()
            158 | 					if err != nil {
            159 | 						return nil, nil, fmt.Errorf("creating temp file: %w", err)
            160 | 					}
            161 | 					// Write accumulated buffer to temp file.
            162 | 					if _, err := tmpFile.Write(buf); err != nil {
            163 | 						return nil, tmpFile, fmt.Errorf("spilling to temp file: %w", err)
            164 | 					}
            165 | 					buf = nil // Release memory.
            166 | 				}
            167 | 			}
            168 | 		}
            170 | 		if readErr == io.EOF {
            171 | 			return buf, tmpFile, nil
            172 | 		}
            173 | 		if readErr != nil {
            174 | 			return buf, tmpFile, readErr
            175 | 		}
            176 | 	}
            177 | }
            179 | // memoryThreshold returns the memory threshold above which stdin content
            180 | // is spilled to a temp file. Per prd007-sponge R1.3: derived from available
            181 | // memory. We use a fraction of the system memory as reported by runtime.
            182 | func memoryThreshold() int64 {
            183 | 	var m runtime.MemStats
            184 | 	runtime.ReadMemStats(&m)
            185 | 	// Use half of system memory as the threshold, with a minimum of 64 MB.
            186 | 	threshold := int64(m.Sys) / 2
            187 | 	const minThreshold = 64 * 1024 * 1024
            188 | 	if threshold < minThreshold {
            189 | 		threshold = minThreshold
            190 | 	}
            191 | 	return threshold
            192 | }
            194 | // createTempFile creates a temp file in the directory specified by TMPDIR,
            195 | // or the system default temp directory if TMPDIR is unset.
            196 | // Per prd007-sponge R1.4 and design decision D3.
            197 | func createTempFile() (*os.File, error) {
            198 | 	dir := os.Getenv("TMPDIR")
            199 | 	if dir == "" {
            200 | 		dir = os.TempDir()
            201 | 	}
            202 | 	return os.CreateTemp(dir, tempFilePrefix)
            203 | }
            205 | // registerCleanup registers signal handlers that delete the temp file if the
            206 | // process receives SIGINT, SIGTERM, SIGHUP, or SIGPIPE before completion.
            207 | // Per prd007-sponge R1.5.
            208 | func registerCleanup(tmpPath string) {
            209 | 	ch := make(chan os.Signal, 1)
            210 | 	signal.Notify(ch, syscall.SIGINT, syscall.SIGTERM, syscall.SIGHUP)
            211 | 	go func() {
            212 | 		<-ch
            213 | 		os.Remove(tmpPath) // best-effort cleanup
            214 | 		os.Exit(1)
            215 | 	}()
            216 | }
            218 | // writePassthrough writes the soaked stdin to stdout.
            219 | // Per prd007-sponge R4.1-R4.3.
            220 | func writePassthrough(buf []byte, tmpFile *os.File) error {
            221 | 	if tmpFile != nil {
            222 | 		// Per prd007-sponge R4.2: seek to beginning and copy to stdout.
            223 | 		if _, err := tmpFile.Seek(0, io.SeekStart); err != nil {
            224 | 			return fmt.Errorf("seeking temp file: %w", err)
            225 | 		}
            226 | 		if _, err := io.Copy(os.Stdout, tmpFile); err != nil {
            227 | 			return fmt.Errorf("writing to stdout: %w", err)
            228 | 		}
            229 | 		return nil
            230 | 	}
            232 | 	// Per prd007-sponge R4.3: write in-memory buffer directly to stdout.
            233 | 	if len(buf) > 0 {
            234 | 		if _, err := os.Stdout.Write(buf); err != nil {
            235 | 			return fmt.Errorf("writing to stdout: %w", err)
            236 | 		}
            237 | 	}
            238 | 	return nil
            239 | }
            241 | // writeOutputFile writes the soaked stdin to the output file, handling atomic
            242 | // write via temp file rename, append mode, and file mode preservation.
            243 | //
            244 | // Per prd007-sponge R2.1-R2.5, R3.1-R3.3.
            245 | func writeOutputFile(buf []byte, spillFile *os.File, outputPath string, appendMode bool) error {
            246 | 	// Per design decision D5: use os.Lstat (not os.Stat) to check output path.
            247 | 	// Per prd007-sponge R2.3, R2.4.
            248 | 	var existingMode os.FileMode
            249 | 	var outputExists bool
            251 | 	info, err := os.Lstat(outputPath)
            252 | 	if err == nil {
            253 | 		outputExists = true
            254 | 		existingMode = info.Mode()
            255 | 	}
            257 | 	// Create a temp file in the same directory as the output file for atomic rename.
            258 | 	// Per prd007-sponge R2.1.
            259 | 	outDir := dirOfPath(outputPath)
            260 | 	outTmp, err := os.CreateTemp(outDir, tempFilePrefix)
            261 | 	if err != nil {
            262 | 		return fmt.Errorf("creating output temp file: %w", err)
            263 | 	}
            264 | 	outTmpPath := outTmp.Name()
            266 | 	// Ensure cleanup of the output temp file on error.
            267 | 	success := false
            268 | 	defer func() {
            269 | 		if !success {
            270 | 			outTmp.Close()
            271 | 			os.Remove(outTmpPath) // best-effort cleanup
            272 | 		}
            273 | 	}()
            275 | 	// Per prd007-sponge R3.1-R3.3: in append mode, prepend original file content.
            276 | 	if appendMode && outputExists && info.Mode().IsRegular() {
            277 | 		// Per prd007-sponge R3.3: copy original file content into temp file first.
            278 | 		origFile, err := os.Open(outputPath)
            279 | 		if err != nil {
            280 | 			return fmt.Errorf("reading original file for append: %w", err)
            281 | 		}
            282 | 		if _, err := io.Copy(outTmp, origFile); err != nil {
            283 | 			origFile.Close()
            284 | 			return fmt.Errorf("copying original content for append: %w", err)
            285 | 		}
            286 | 		origFile.Close()
            287 | 	}
            289 | 	// Write the stdin content to the output temp file.
            290 | 	if spillFile != nil {
            291 | 		if _, err := spillFile.Seek(0, io.SeekStart); err != nil {
            292 | 			return fmt.Errorf("seeking spill file: %w", err)
            293 | 		}
            294 | 		if _, err := io.Copy(outTmp, spillFile); err != nil {
            295 | 			return fmt.Errorf("writing spill content to output: %w", err)
            296 | 		}
            297 | 	} else if len(buf) > 0 {
            298 | 		if _, err := outTmp.Write(buf); err != nil {
            299 | 			return fmt.Errorf("writing buffer to output: %w", err)
            300 | 		}
            301 | 	}
            303 | 	// Close the temp file before rename.
            304 | 	if err := outTmp.Close(); err != nil {
            305 | 		return fmt.Errorf("closing output temp file: %w", err)
            306 | 	}
            308 | 	// Apply file mode. Per prd007-sponge R2.3.
            309 | 	if outputExists {
            310 | 		if err := os.Chmod(outTmpPath, existingMode); err != nil {
            311 | 			return fmt.Errorf("setting file mode: %w", err)
            312 | 		}
            313 | 	}
            314 | 	// When the output file does not exist, os.CreateTemp uses 0600 by default.
            315 | 	// The PRD specifies 0666 masked by umask. Apply it explicitly for new files.
            316 | 	if !outputExists {
            317 | 		// Get umask by temporarily setting it and restoring.
            318 | 		umask := syscall.Umask(0)
            319 | 		syscall.Umask(umask)
            320 | 		if err := os.Chmod(outTmpPath, os.FileMode(0666&^umask)); err != nil {
            321 | 			return fmt.Errorf("setting file mode for new file: %w", err)
            322 | 		}
            323 | 	}
            325 | 	// Attempt atomic rename. Per prd007-sponge R2.1, design decision D4.
            326 | 	if err := os.Rename(outTmpPath, outputPath); err != nil {
            327 | 		// Per prd007-sponge R2.2 and design decision D4: cross-device fallback.
            328 | 		if isCrossDeviceError(err) {
            329 | 			if err := crossDeviceCopy(outTmpPath, outputPath, existingMode, outputExists); err != nil {
            330 | 				return err
            331 | 			}
            332 | 			os.Remove(outTmpPath) // best-effort cleanup of temp file
            333 | 			success = true
            334 | 			return nil
            335 | 		}
            336 | 		return fmt.Errorf("renaming temp file to output: %w", err)
            337 | 	}
            339 | 	success = true
            340 | 	return nil
            341 | }
            343 | // dirOfPath returns the directory component of a path. Returns "." if the path
            344 | // has no directory separator.
            345 | func dirOfPath(path string) string {
            346 | 	for i := len(path) - 1; i >= 0; i-- {
            347 | 		if path[i] == '/' {
            348 | 			if i == 0 {
            349 | 				return "/"
            350 | 			}
            351 | 			return path[:i]
            352 | 		}
            353 | 	}
            354 | 	return "."
            355 | }
            357 | // isCrossDeviceError checks if an error from os.Rename indicates a cross-device
            358 | // link failure. Per design decision D4.
            359 | func isCrossDeviceError(err error) bool {
            360 | 	linkErr, ok := err.(*os.LinkError)
            361 | 	if !ok {
            362 | 		return false
            363 | 	}
            364 | 	return linkErr.Err == syscall.EXDEV
            365 | }
            367 | // crossDeviceCopy performs a byte-for-byte copy as a fallback when atomic rename
            368 | // fails due to cross-device link. Per prd007-sponge R2.2.
            369 | func crossDeviceCopy(srcPath string, dstPath string, mode os.FileMode, dstExists bool) error {
            370 | 	src, err := os.Open(srcPath)
            371 | 	if err != nil {
            372 | 		return fmt.Errorf("opening temp file for cross-device copy: %w", err)
            373 | 	}
            374 | 	defer src.Close()
            376 | 	dst, err := os.Create(dstPath)
            377 | 	if err != nil {
            378 | 		return fmt.Errorf("creating output file for cross-device copy: %w", err)
            379 | 	}
            381 | 	if _, err := io.Copy(dst, src); err != nil {
            382 | 		dst.Close()
            383 | 		return fmt.Errorf("cross-device copy: %w", err)
            384 | 	}
            386 | 	if err := dst.Close(); err != nil {
            387 | 		return fmt.Errorf("closing output file after cross-device copy: %w", err)
            388 | 	}
            390 | 	if dstExists {
            391 | 		if err := os.Chmod(dstPath, mode); err != nil {
            392 | 			return fmt.Errorf("setting mode after cross-device copy: %w", err)
            393 | 		}
            394 | 	}
            396 | 	return nil
            397 | }
