            103 | 	if flagI && flagS {
            104 | 		return false, false, false, false, "", fmt.Errorf("-i and -s are mutually exclusive")
            105 | 	}
            106 | 	if flagR && flagI {
            107 | 		return false, false, false, false, "", fmt.Errorf("-r and -i are mutually exclusive")
            108 | 	}
            109 | 	if flagR && flagS {
            110 | 		return false, false, false, false, "", fmt.Errorf("-r and -s are mutually exclusive")
            111 | 	}
            113 | 	if len(positional) > 0 {
            114 | 		formatStr = positional[0]
            115 | 	}
            117 | 	return flagI, flagS, flagM, flagR, formatStr, nil
            118 | }
            120 | // runTimestampMode handles default, -i, -s, and -m timestamp modes.
            121 | // Per prd004-ts R1, R2, R3, R4, R5.
            122 | func runTimestampMode(flagI, flagS, flagM bool, formatStr string) {
