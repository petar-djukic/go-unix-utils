            163 | // parseFlags parses wc command-line arguments using manual flag parsing to
            164 | // support combined short flags (e.g., -lwc) and GNU-style long options
            165 | // (--total, --files0-from), matching the pattern in cmd/cat/main.go.
            166 | // Per design decision D2.
            167 | func parseFlags(args []string) (options, []string, error) {
            168 | 	var opts options
            169 | 	var files []string
            171 | 	for i := 0; i < len(args); i++ {
            172 | 		arg := args[i]
            174 | 		if arg == "--" {
            175 | 			files = append(files, args[i+1:]...)
            176 | 			break
            177 | 		}
            179 | 		if arg == "-" {
            180 | 			// Per prd005-wc R4.1: "-" means stdin, not a flag.
            181 | 			files = append(files, arg)
            182 | 			continue
            183 | 		}
            185 | 		// Handle GNU-style long options.
            186 | 		if strings.HasPrefix(arg, "--") {
            187 | 			if err := parseLongOption(arg, &opts); err != nil {
            188 | 				return options{}, nil, err
            189 | 			}
            190 | 			continue
            191 | 		}
            193 | 		if len(arg) > 1 && arg[0] == '-' {
            194 | 			for _, ch := range arg[1:] {
            195 | 				switch ch {
            196 | 				case 'l':
            197 | 					opts.printLines = true
            198 | 				case 'w':
            199 | 					opts.printWords = true
            200 | 				case 'c':
            201 | 					opts.printBytes = true
            202 | 				case 'm':
            203 | 					opts.printChars = true
            204 | 				case 'L':
            205 | 					opts.printMaxLine = true
            206 | 				default:
            207 | 					return options{}, nil, fmt.Errorf("invalid option -- '%c'", ch)
            208 | 				}
            209 | 			}
            210 | 		} else {
            211 | 			files = append(files, arg)
            212 | 		}
            213 | 	}
            215 | 	// Per prd005-wc R1.1: when no flags are given, default to lines, words, bytes.
            216 | 	if !opts.printLines && !opts.printWords && !opts.printBytes && !opts.printChars && !opts.printMaxLine {
            217 | 		opts.printLines = true
            218 | 		opts.printWords = true
            219 | 		opts.printBytes = true
            220 | 		opts.defaultMode = true
            221 | 	}
            223 | 	return opts, files, nil
            224 | }
            226 | // parseLongOption handles --total and --files0-from long options.
            227 | func parseLongOption(arg string, opts *options) error {
            228 | 	if arg == "--total" || strings.HasPrefix(arg, "--total=") {
            229 | 		val := "auto"
            230 | 		if strings.HasPrefix(arg, "--total=") {
            231 | 			val = arg[len("--total="):]
            232 | 		}
            233 | 		switch val {
            234 | 		case "auto":
            235 | 			opts.total = totalAuto
            236 | 		case "always":
            237 | 			opts.total = totalAlways
            238 | 		case "only":
            239 | 			opts.total = totalOnly
            240 | 		case "never":
            241 | 			opts.total = totalNever
            242 | 		default:
            243 | 			return fmt.Errorf("invalid argument '%s' for '--total'", val)
            244 | 		}
            245 | 		return nil
            246 | 	}
            248 | 	if arg == "--files0-from" || strings.HasPrefix(arg, "--files0-from=") {
            249 | 		if strings.HasPrefix(arg, "--files0-from=") {
            250 | 			opts.files0From = arg[len("--files0-from="):]
            251 | 		} else {
            252 | 			return fmt.Errorf("option '--files0-from' requires an argument")
            253 | 		}
            254 | 		opts.hasFiles0From = true
            255 | 		return nil
            256 | 	}
            258 | 	return fmt.Errorf("unrecognized option '%s'", arg)
            259 | }
            261 | // readFiles0From reads NUL-delimited filenames from the given file.
            262 | // Per prd005-wc R4.4: when FILE is "-", filenames are read from stdin.
            263 | func readFiles0From(file string) ([]string, error) {
            264 | 	var r io.Reader
