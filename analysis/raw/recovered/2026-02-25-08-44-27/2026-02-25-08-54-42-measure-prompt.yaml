            68 | // parseFlags parses ts command-line arguments and validates mutual exclusivity.
            69 | // Per design decision D3 and prd004-ts R3.4, R6.5, R7.2.
            70 | func parseFlags(args []string) (flagI, flagS, flagM, flagR bool, formatStr string, err error) {
            71 | 	var positional []string
            73 | 	for i := 0; i < len(args); i++ {
            74 | 		arg := args[i]
            75 | 		if arg == "--" {
            76 | 			positional = append(positional, args[i+1:]...)
            77 | 			break
            78 | 		}
            79 | 		if len(arg) > 1 && arg[0] == '-' && arg[1] != '-' {
            80 | 			// Parse short flags, potentially combined (e.g., -im)
            81 | 			for _, ch := range arg[1:] {
            82 | 				switch ch {
            83 | 				case 'i':
            84 | 					flagI = true
            85 | 				case 's':
            86 | 					flagS = true
            87 | 				case 'm':
            88 | 					flagM = true
            89 | 				case 'r':
            90 | 					flagR = true
            91 | 				default:
            92 | 					return false, false, false, false, "", fmt.Errorf("unrecognized option '-%c'", ch)
            93 | 				}
            94 | 			}
            95 | 		} else if len(arg) > 2 && arg[:2] == "--" {
            96 | 			return false, false, false, false, "", fmt.Errorf("unrecognized option '%s'", arg)
            97 | 		} else {
            98 | 			positional = append(positional, arg)
