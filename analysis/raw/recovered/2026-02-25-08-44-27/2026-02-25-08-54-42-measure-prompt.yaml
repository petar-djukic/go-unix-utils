        dependency_map:
            file: docs/specs/dependency-map.yaml
            name: dependency-map
            content:
                id: dependency-map
                title: "Shared Component Dependency Map"
                overview: |
                    We map each of the 14 utilities to the shared pkg/ components they will need in
                    their Go implementations. Dependencies are derived from C source analysis in
                    sources.yaml. The map justifies the scope and required API of each shared component
                    PRD (pkg/testutils, pkg/sys, pkg/format). We list a utility under a component when
                    it requires behavior that would be duplicated across cmd/ packages without that component.
                components:
                    - id: pkg/testutils
                      rationale: |
                        Every utility is verified by running the Go binary and the Homebrew GNU reference
                        binary side by side and comparing stdout, stderr, and exit code. This logic is
                        identical for all utilities: execute both binaries with the same stdin, args, and
                        environment; diff the outputs; report divergence. Without a shared harness each
                        cmd/ package would duplicate the execution and comparison logic. Additionally,
                        some utilities require output normalization before comparison (timestamps in ts,
                        path prefixes in find), and a shared hook mechanism avoids duplicating that too.
                      users:
                        - utility: ts
                          package: moreutils
                          need: timestamp normalization hook (output contains wall-clock timestamps that differ between runs)
                        - utility: sponge
                          package: moreutils
                          need: file-state comparison after execution (output is a written file, not stdout)
                        - utility: vidir
                          package: moreutils
                          need: file-state comparison (renames files; no stdout output to diff)
                        - utility: pee
                          package: moreutils
                          need: stdout comparison; multiple subcommands mean ordering may need normalization
                        - utility: chronic
                          package: moreutils
                          need: stdout/stderr suppression behavior; exit-code passthrough verification
                        - utility: ls
                          package: coreutils
                          need: timestamp normalization (-l shows mtime); path normalization for test fixtures
                        - utility: cat
                          package: coreutils
                          need: standard stdout/stderr diff; binary-input test cases
                        - utility: cp
                          package: coreutils
                          need: file-state comparison (output is a copied file); no stdout to diff
                        - utility: mv
                          package: coreutils
                          need: file-state comparison (output is a moved file); no stdout to diff
                        - utility: wc
                          package: coreutils
                          need: standard stdout diff; all output is deterministic counts
                        - utility: du
                          package: coreutils
                          need: path and size normalization (sizes vary by filesystem block size across machines)
                        - utility: grep
                          package: grep
                          need: standard stdout/stderr diff; exit-code verification (0/1/2 contract)
                        - utility: find
                          package: findutils
                          need: path normalization (output order varies by filesystem); file-state comparison for -exec
                        - utility: xargs
                          package: findutils
                          need: stdout comparison; exec order normalization for -P (parallel)
                    - id: pkg/sys
                      rationale: |
                        Several utilities need syscall surfaces that diverge between Darwin and Linux:
                        terminal width queries (ioctl TIOCGWINSZ), file metadata beyond what os.Stat
                        provides (device number, inode, hard-link count for ls -l), and signal handling
                        (SIGPIPE for clean exit when stdout closes, SIGWINCH for ls to re-query terminal
                        width on resize). Go's standard library does not provide a stable cross-platform
                        API for these. Wrapping them in pkg/sys avoids per-utility cgo or syscall imports
                        and ensures the Darwin/Linux divergence is handled once.
                      users:
                        - utility: ls
                          package: coreutils
                          needs:
                            - terminal_width: |
                                ls.c:2281 uses struct winsize via ioctl(TIOCGWINSZ) to determine column
                                count for multi-column layout. Go's standard library has no portable
                                terminal-width query; pkg/sys wraps golang.org/x/term or syscall.
                            - file_metadata: |
                                ls -l needs st_nlink (hard-link count), st_uid, st_gid, st_rdev (device
                                numbers for character/block devices), and st_blocks. os.FileInfo does not
                                expose these; pkg/sys exposes them via syscall.Stat_t.
                            - signal_handling: |
                                ls.c:1600-1620 sets up SIGPIPE (suppress broken-pipe on stdout close) and
                                ls.c:2281 registers SIGWINCH to re-query terminal width on resize. Go's
                                os/signal package provides the hook; pkg/sys provides a consistent interface.
                            - lstat: |
                                ls.c uses lstat for symlink targets (to show link target vs target info
                                depending on -L flag). os.Lstat is available but symlink metadata
                                (st_mode of the link itself) requires care on Darwin.
                        - utility: du
                          package: coreutils
                          needs:
                            - file_metadata: |
                                du.c:554 uses fts_statp (stat struct from fts traversal) to get st_blocks
                                and st_dev for deduplication of hard-linked files. pkg/sys exposes st_dev
                                and st_ino for hard-link detection and st_blocks for physical block count.
                            - signal_handling: |
                                du.c uses SIGPIPE for clean stdout close.
                        - utility: find
                          package: findutils
                          needs:
                            - file_metadata: |
                                find/ftsfind.c:172 calls apply_predicate with a stat struct for -type, -size,
                                -newer, -perm predicates. The full stat struct (st_mode, st_size, st_mtime,
                                st_uid, st_gid, st_nlink) is needed. pkg/sys exposes this.
                            - signal_handling: |
                                find/ftsfind.c:735-749 registers SIGUSR1/SIGUSR2 for debug output. pkg/sys
                                provides a clean signal registration interface.
                            - lstat: |
                                find uses lstat (not stat) by default to avoid following symlinks unless
                                -L is given. pkg/sys wraps os.Lstat with full stat metadata.
                        - utility: xargs
                          package: findutils
                          needs:
                            - signal_handling: |
                                xargs propagates signals to child processes (SIGTERM, SIGINT). pkg/sys
                                provides signal forwarding to process groups.
                    - id: pkg/format
                      rationale: |
                        Both ls and du produce human-readable output that requires formatting logic beyond
                        fmt.Sprintf: ls produces column-aligned tabular output with ANSI color codes for
                        file types, and both ls and du convert byte counts to human-readable sizes
                        (K/M/G/T). Without pkg/format each cmd/ package would implement its own column
                        math and ANSI escape handling, producing inconsistent output and making
                        differential testing harder.
                      users:
                        - utility: ls
                          package: coreutils
                          needs:
                            - column_alignment: |
                                ls.c uses multi-column layout (default) and long format (-l). Column widths
                                are computed from the longest filename or field value in the listing. pkg/format
                                provides a column-width computation function and a right/left-pad formatter.
                            - ansi_color: |
                                ls.c:103 includes dircolors.h. ls outputs ANSI escape sequences for file
                                types (directory=blue, symlink=cyan, executable=green, etc.) and resets
                                color after each entry. pkg/format provides a file-type-to-ANSI-code
                                lookup and a color-strip mode when stdout is not a TTY.
                            - human_readable_size: |
                                ls -h and ls -s --block-size=human both need human_readable() output.
                                pkg/format provides byte-to-unit conversion with configurable suffixes
                                (K/M/G/T) and SI vs binary rounding modes.
                        - utility: du
                          package: coreutils
                          needs:
                            - human_readable_size: |
                                du.c:153 declares human_output_opts; du.c:442 calls human_readable().
                                du -h outputs sizes like 4.0K, 128M. The same conversion logic as ls -h.
                                pkg/format provides this as a shared function to avoid duplication.
                utilities_without_shared_components:
                    - utility: cat
                      package: coreutils
                      reason: |
                        cat is pure I/O passthrough with flag-controlled output transformations (-n, -b,
                        -s, -v, -E, -T). It needs no terminal-width query, no file-metadata beyond
                        fstat for identity check (Go's os.SameFile covers this), no formatting, and
                        no ANSI color. cat does not use pkg/sys or pkg/format.
                    - utility: wc
                      package: coreutils
                      reason: |
                        wc counts lines, words, and bytes. It uses fstat only to detect when input and
                        output are the same file (no practical relevance in Go). Column alignment for
                        multi-file output is simple right-padding of numeric fields, not tabular
                        formatting. wc does not use pkg/sys or pkg/format.
                    - utility: ts
                      package: moreutils
                      reason: |
                        ts reads stdin line by line and prepends timestamps using POSIX strftime and
                        gettimeofday/clock_gettime (exposed via Go's time.Now(), time.Since(), and
                        time.Format()). Monotonic clock is available via time.Now() in Go. ts does
                        not use pkg/sys or pkg/format.
                    - utility: sponge
                      package: moreutils
                      reason: |
                        sponge reads stdin into a buffer, then writes to a file using a temp-file and
                        rename for atomicity. All operations are standard file I/O (os.CreateTemp,
                        os.Rename). sponge does not use pkg/sys or pkg/format.
                    - utility: pee
                      package: moreutils
                      reason: |
                        pee forks a subprocess for each argv command and tees stdin to all of them.
                        Go's os/exec and io.MultiWriter cover this without any pkg/ wrapping. pee
                        does not use pkg/sys or pkg/format.
                    - utility: vidir
                      package: moreutils
                      reason: |
                        vidir opens $EDITOR with a temp file listing directory entries. All operations
                        are standard file I/O and os/exec. vidir does not use pkg/sys or pkg/format.
                    - utility: chronic
                      package: moreutils
                      reason: |
                        chronic runs a subcommand and suppresses its output unless it fails. All
                        operations are os/exec and io.ReadAll. chronic does not use pkg/sys or
                        pkg/format.
                    - utility: cp
                      package: coreutils
                      reason: |
                        cp is handled in a later phase (coreutils phase 3). Not in the current batch.
                    - utility: mv
                      package: coreutils
                      reason: |
                        mv is handled in a later phase (coreutils phase 3). Not in the current batch.
                    - utility: grep
                      package: grep
                      reason: |
                        grep is handled in a later phase (search utilities phase 4). Not in the current batch.
                    - utility: find
                      package: findutils
                      reason: |
                        find is handled in a later phase (search utilities phase 4). pkg/sys dependency
                        is noted above but the PRD and use case are deferred.
                    - utility: xargs
                      package: findutils
                      reason: |
                        xargs is handled in a later phase (search utilities phase 4). Not in the current batch.
                notes:
                    - |
                      egrep and fgrep are shell script wrappers for grep -E and grep -F respectively.
                      They do not require separate Go implementations; they are handled as flags of the
                      grep PRD.
                    - |
                      The current batch (phase 1-2) focuses on ts, wc, cat, sponge from the dependency
                      analysis. These four utilities share only pkg/testutils and require no pkg/sys or
                      pkg/format, making them the lowest-risk starting point for the pipeline.
                    - |
                      ls requires all three shared components (pkg/testutils, pkg/sys, pkg/format) and
                      is the most complex utility in the batch. It is deferred to phase 3 (coreutils).
        sources:
            file: docs/specs/sources.yaml
            name: sources
            content:
                id: sources
                title: "C Source Repository Catalog"
                overview: |
                    Catalog of the four C source repositories used for spec extraction. For each utility
                    we record the source file, flag-parsing entry point, exit-code logic location, and
                    the Homebrew reference binary name used in differential testing. Clones live in
                    /tmp/sources/ (not committed). This file is the input for dependency-map.yaml.
                repositories:
                    - id: coreutils
                      clone_url: https://github.com/coreutils/coreutils.git
                      commit: 200cc6a5986f37777e6802ba4a0d38c9cbbf732e
                      brew_install: brew install coreutils
                      brew_note: |
                        Installs with g-prefix (gls, gcat, etc.) because the names conflict with
                        macOS BSD built-ins. Unprefixed names available via libexec/gnubin/ on PATH.
                      utilities:
                        - name: ls
                          source_file: src/ls.c
                          main_line: 1648
                          flag_parsing: "getopt_long at src/ls.c:1924; switch(c) at line 1930"
                          exit_code_logic: "exit(status) at src/ls.c:5638; status set to EXIT_FAILURE on stat errors (line 5339)"
                          exit_codes:
                            0: success
                            1: minor problems (e.g., cannot access a file)
                            2: serious trouble (e.g., invalid option)
                          homebrew_binary: gls
                        - name: cat
                          source_file: src/cat.c
                          main_line: 550
                          flag_parsing: "getopt_long at src/cat.c:595; switch(c) at line 598"
                          exit_code_logic: "return ok ? EXIT_SUCCESS : EXIT_FAILURE at src/cat.c:828"
                          exit_codes:
                            0: success
                            1: read or write error
                          homebrew_binary: gcat
                        - name: cp
                          source_file: src/cp.c
                          main_line: 1029
                          flag_parsing: "getopt_long at src/cp.c:1052; switch(c) at line 1056"
                          exit_code_logic: "main_exit(ok ? EXIT_SUCCESS : EXIT_FAILURE) at src/cp.c:1335"
                          exit_codes:
                            0: success
                            1: error
                          homebrew_binary: gcp
                        - name: mv
                          source_file: src/mv.c
                          main_line: 343
                          flag_parsing: "getopt_long at src/mv.c:368; switch(c) at line 371"
                          exit_code_logic: "main_exit(ok ? EXIT_SUCCESS : EXIT_FAILURE) at src/mv.c:572"
                          exit_codes:
                            0: success
                            1: error
                          homebrew_binary: gmv
                        - name: wc
                          source_file: src/wc.c
                          main_line: 792
                          flag_parsing: "getopt_long at src/wc.c:820; switch(optc) at line 637"
                          exit_code_logic: "return ok ? EXIT_SUCCESS : EXIT_FAILURE at src/wc.c:1049"
                          exit_codes:
                            0: success
                            1: read or write error
                          homebrew_binary: gwc
                        - name: du
                          source_file: src/du.c
                          main_line: 772
                          flag_parsing: "getopt_long at src/du.c:808; switch(c) at line 813"
                          exit_code_logic: "return ok ? EXIT_SUCCESS : EXIT_FAILURE at src/du.c:1191"
                          exit_codes:
                            0: success
                            1: error
                          homebrew_binary: gdu
                    - id: moreutils
                      clone_url: https://git.joeyh.name/git/moreutils.git
                      commit: e9a53e8922fbebe825f74ffbe309d4e57d6b09d5
                      brew_install: brew install moreutils
                      brew_note: |
                        Installs without g-prefix (ts, sponge, pee, vidir, chronic) because these
                        utilities do not conflict with any macOS built-ins.
                      utilities:
                        - name: ts
                          source_file: ts
                          language: Perl
                          flag_parsing: "Perl GetOptions at ts:64; flags: -r, -i, -s, -m"
                          exit_code_logic: "die on bad options (non-zero); implicit exit 0 on EOF"
                          exit_codes:
                            0: success, stdin consumed and timestamped
                            non-zero: bad option or missing Perl module (Time::Duration, Date::Parse for -r)
                          homebrew_binary: ts
                        - name: sponge
                          source_file: sponge.c
                          language: C
                          main_line: 279
                          flag_parsing: "getopt at sponge.c:290; flags: -a (append), -h (help)"
                          exit_code_logic: "exit(1) on any I/O failure (lines 191-237); exit(0) on success (line 48)"
                          exit_codes:
                            0: success
                            1: I/O error (read stdin, write temp file, rename, open output)
                          homebrew_binary: sponge
                        - name: vidir
                          source_file: vidir
                          language: Perl
                          flag_parsing: "Perl GetOptions; flags: --verbose"
                          exit_code_logic: "exit 0 on success; non-zero on editor failure or rename error"
                          exit_codes:
                            0: success
                            non-zero: editor failure or file operation error
                          homebrew_binary: vidir
                        - name: pee
                          source_file: pee.c
                          language: C
                          main_line: 33
                          flag_parsing: "no flags; all argv are command strings to pipe stdin into"
                          exit_code_logic: |
                            ret |= WEXITSTATUS(r) for each child (line 20-25); exit via close_pipes return (line 118).
                            Exits EXIT_FAILURE on fork/pipe errors (lines 65-112).
                          exit_codes:
                            0: all subcommands exited 0
                            non-zero: OR of all subcommand exit statuses; 1 if fork/pipe failed
                          homebrew_binary: pee
                        - name: chronic
                          source_file: chronic
                          language: Perl
                          flag_parsing: "Perl GetOptions; flags: -v (verbose), -e (check stderr)"
                          exit_code_logic: "propagates subcommand exit code; exits 0 if silent success"
                          exit_codes:
                            0: subcommand succeeded (and produced no output, or -v not set)
                            non-zero: subcommand exit code
                          homebrew_binary: chronic
                    - id: grep
                      clone_url: https://git.savannah.gnu.org/git/grep.git
                      commit: 071ac3aa76a575dd55dc184570da2192adafe267
                      brew_install: brew install grep
                      brew_note: |
                        Installs with g-prefix (ggrep) because grep conflicts with macOS BSD grep.
                        Unprefixed name available via libexec/gnubin/ on PATH.
                      utilities:
                        - name: grep
                          source_file: src/grep.c
                          main_line: 2468
                          flag_parsing: "getopt_long at src/grep.c:2140"
                          exit_code_logic: |
                            exit_failure set to EXIT_TROUBLE (2) at line 2477 for errors.
                            Returns EXIT_SUCCESS (0) when match found (line 2837).
                            Returns EXIT_FAILURE (1) when no match found (line 2916).
                          exit_codes:
                            0: match found
                            1: no match
                            2: error (invalid option, read error, etc.)
                          homebrew_binary: ggrep
                        - name: egrep
                          source_file: src/egrep.sh
                          language: shell
                          flag_parsing: "shell script wrapper: calls grep -E with all args forwarded"
                          exit_code_logic: "inherits grep exit codes via exec"
                          exit_codes:
                            0: match found
                            1: no match
                            2: error
                          homebrew_binary: gegrep
                          note: "egrep and fgrep are generated from egrep.sh at build time (Makefile.am:55-57)"
                        - name: fgrep
                          source_file: src/egrep.sh
                          language: shell
                          flag_parsing: "shell script wrapper: calls grep -F with all args forwarded"
                          exit_code_logic: "inherits grep exit codes via exec"
                          exit_codes:
                            0: match found
                            1: no match
                            2: error
                          homebrew_binary: gfgrep
                          note: "generated from egrep.sh; fgrep is obsolescent per POSIX, equivalent to grep -F"
                    - id: findutils
                      clone_url: https://git.savannah.gnu.org/git/findutils.git
                      commit: 6b49775f9d98c0ed6470c47844c7558d4854fc67
                      brew_install: brew install findutils
                      brew_note: |
                        Installs with g-prefix (gfind, gxargs) because find and xargs conflict with
                        macOS BSD built-ins. Unprefixed names available via libexec/gnubin/ on PATH.
                      utilities:
                        - name: find
                          source_files:
                            - find/ftsfind.c
                            - find/parser.c
                            - find/pred.c
                            - find/print.c
                          main_line: "find/ftsfind.c:714"
                          flag_parsing: |
                            Option and predicate parsing via process_option mechanism in find/parser.c.
                            getopt_long used at find/ftsfind.c:2140 for initial option pass.
                            Predicates (-name, -type, -exec, etc.) parsed by parser.c functions.
                          exit_code_logic: |
                            state.exit_status tracked in find/ftsfind.c; set to EXIT_FAILURE on
                            access errors (lines 655, 683). Returned at line 809.
                          exit_codes:
                            0: success (all files processed without error)
                            1: some files could not be examined
                          homebrew_binary: gfind
                        - name: xargs
                          source_file: xargs/xargs.c
                          main_line: 397
                          flag_parsing: "getopt_long at xargs/xargs.c:521; flags: -0, -a, -E, -e, -i, -I, -l, -L, -n, -o, -p, -r, -s, -t, -x, -P, -d"
                          exit_code_logic: |
                            Returns 0 if all invocations succeed; 1 if any invocation fails;
                            123 if any invocation exits with status 1-125; 124 if command exits 255;
                            125 if command not found; 126 if command cannot be run; 127 if command not found.
                          exit_codes:
                            0: all commands succeeded
                            1: invocation returned non-zero
                            123: any invocation exited 1-125
                            124: command exited with status 255
                            125: command not found (xargs itself)
                            126: command cannot be run
                            127: command not found
                          homebrew_binary: gxargs
    source_code:
        - file: cmd/cat/cat_test.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Differential tests for cmd/cat exercising all cat test cases from
            5 | // test-rel01.1.yaml.
            6 | //
            7 | // Implements: prd006-cat R1-R5 (differential testing), prd001-testutils R1-R3
            8 | package main
            10 | import (
            11 | 	"os"
            12 | 	"os/exec"
            13 | 	"path/filepath"
            14 | 	"testing"
            16 | 	"github.com/petar-djukic/go-unix-utils/pkg/testutils"
            17 | )
            19 | // goBinary is the path to the freshly built Go cat binary. Set by TestMain.
            20 | var goBinary string
            22 | // refBinary is the path to the Homebrew reference gcat binary. Set by TestMain.
            23 | var refBinary string
            25 | // baseEnv provides the standard test environment per test-rel01.1.yaml
            26 | // preconditions: LC_ALL=C to eliminate locale-dependent divergence.
            27 | var baseEnv = []string{"LC_ALL=C"}
            29 | // TestMain builds the Go cat binary and locates the Homebrew reference binary.
            30 | // Per design decision D1 and D4.
            31 | func TestMain(m *testing.M) {
            32 | 	// Build the Go cat binary into a temp directory.
            33 | 	tmpDir, err := os.MkdirTemp("", "cat-test-*")
            34 | 	if err != nil {
            35 | 		os.Exit(1)
            36 | 	}
            38 | 	goBinary = filepath.Join(tmpDir, "cat")
            39 | 	buildCmd := exec.Command("go", "build", "-o", goBinary, ".")
            40 | 	if _, err := buildCmd.CombinedOutput(); err != nil {
            41 | 		// Build failed; leave goBinary empty so tests skip gracefully.
            42 | 		goBinary = ""
            43 | 	}
            45 | 	// Locate the Homebrew reference binary (brew install coreutils).
            46 | 	// Per design decision D4: reference is gcat, not cat (macOS BSD).
            47 | 	refBinary, _ = exec.LookPath("gcat")
            49 | 	code := m.Run()
            50 | 	// Best-effort cleanup of temp directory.
            51 | 	_ = os.RemoveAll(tmpDir)
            52 | 	os.Exit(code)
            53 | }
            55 | // TestCatDifferential runs all differential test cases from test-rel01.1.yaml
            56 | // (cat section). Per prd001-testutils AC1, the test defines a []DiffTest slice
            57 | // and calls RunDiffTests(t, goBinary, refBinary, tests).
            58 | func TestCatDifferential(t *testing.T) {
            59 | 	if goBinary == "" {
            60 | 		t.Skip("Go cat binary could not be built; skipping differential tests")
            61 | 	}
            62 | 	if refBinary == "" {
            63 | 		t.Skip("reference gcat binary not found on PATH (brew install coreutils); skipping differential tests")
            64 | 	}
            66 | 	// --- File fixture setup ---
            67 | 	// Per design decision D2: create fixture files in t.TempDir() and set
            68 | 	// WorkDir on the DiffTest for file-based test cases.
            70 | 	defaultDir := t.TempDir()
            71 | 	if err := os.WriteFile(filepath.Join(defaultDir, "file1.txt"), []byte("hello\nworld\n"), 0644); err != nil {
            72 | 		t.Fatalf("creating fixture file1.txt: %v", err)
            73 | 	}
            75 | 	multiDir := t.TempDir()
            76 | 	if err := os.WriteFile(filepath.Join(multiDir, "file1.txt"), []byte("aaa\n"), 0644); err != nil {
            77 | 		t.Fatalf("creating fixture file1.txt: %v", err)
            78 | 	}
            79 | 	if err := os.WriteFile(filepath.Join(multiDir, "file2.txt"), []byte("bbb\n"), 0644); err != nil {
            80 | 		t.Fatalf("creating fixture file2.txt: %v", err)
            81 | 	}
            83 | 	missingDir := t.TempDir()
            84 | 	if err := os.WriteFile(filepath.Join(missingDir, "real.txt"), []byte("data\n"), 0644); err != nil {
            85 | 		t.Fatalf("creating fixture real.txt: %v", err)
            86 | 	}
            88 | 	// Construct 256-byte stdin for binary passthrough test.
            89 | 	// Per design decision D3: build programmatically, not as a literal.
            90 | 	allBytes := make([]byte, 256)
            91 | 	for i := 0; i < 256; i++ {
            92 | 		allBytes[i] = byte(i)
            93 | 	}
            95 | 	// Per design decision D5: no normalization is needed for any cat test case.
            96 | 	// Cat output is deterministic with no timestamps or non-deterministic fields.
            98 | 	tests := []testutils.DiffTest{
            99 | 		// --- Default behavior tests (prd006-cat R1) ---
            101 | 		{
            102 | 			// Per test-rel01.1.yaml: cat_default_passthrough.
            103 | 			// Traces: prd006-cat R1.1, R1.5.
            104 | 			Name:    "cat_default_passthrough",
            105 | 			Args:    []string{"file1.txt"},
            106 | 			Stdin:   nil,
            107 | 			Env:     baseEnv,
            108 | 			WorkDir: defaultDir,
            109 | 		},
            110 | 		{
            111 | 			// Per test-rel01.1.yaml: cat_binary_passthrough.
            112 | 			// Traces: prd006-cat R1.4.
            113 | 			Name:  "cat_binary_passthrough",
            114 | 			Args:  nil,
            115 | 			Stdin: allBytes,
            116 | 			Env:   baseEnv,
            117 | 		},
            119 | 		// --- Line numbering tests (prd006-cat R2) ---
            121 | 		{
            122 | 			// Per test-rel01.1.yaml: cat_line_numbering_n.
            123 | 			// Traces: prd006-cat R2.1.
            124 | 			Name:  "cat_line_numbering_n",
            125 | 			Args:  []string{"-n"},
            126 | 			Stdin: []byte("alpha\n\nbeta\n"),
            127 | 			Env:   baseEnv,
            128 | 		},
            129 | 		{
            130 | 			// Per test-rel01.1.yaml: cat_line_numbering_b.
            131 | 			// Traces: prd006-cat R2.2, R2.4.
            132 | 			Name:  "cat_line_numbering_b",
            133 | 			Args:  []string{"-b"},
            134 | 			Stdin: []byte("first\n\n\nsecond\n"),
            135 | 			Env:   baseEnv,
            136 | 		},
            138 | 		// --- Blank-line squeezing test (prd006-cat R3) ---
            140 | 		{
            141 | 			// Per test-rel01.1.yaml: cat_squeeze_blanks.
            142 | 			// Traces: prd006-cat R3.1.
            143 | 			Name:  "cat_squeeze_blanks",
            144 | 			Args:  []string{"-s"},
            145 | 			Stdin: []byte("a\n\n\n\nb\n"),
            146 | 			Env:   baseEnv,
            147 | 		},
            149 | 		// --- Non-printing display tests (prd006-cat R4) ---
            151 | 		{
            152 | 			// Per test-rel01.1.yaml: cat_show_nonprinting.
