            294 | // countFile opens and counts a single file (or stdin for "-").
            295 | // Per prd005-wc R1.2.
            296 | func countFile(file string) (counts, error) {
            297 | 	var r io.Reader
            298 | 	if file == "-" {
            299 | 		r = os.Stdin
            300 | 	} else {
            301 | 		f, err := os.Open(file)
