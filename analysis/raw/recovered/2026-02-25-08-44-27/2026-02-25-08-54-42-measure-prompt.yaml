            248 | 	}
            249 | }
            251 | // execBinary runs a single binary with the given args, stdin, environment, and
            252 | // working directory under a timeout. It captures stdout, stderr, and exit code.
            253 | //
            254 | // Per prd001-testutils R2.1-R2.5.
            255 | func execBinary(t *testing.T, binary string, args []string, stdin []byte, env []string, workDir string) binOutput {
            256 | 	t.Helper()
            258 | 	ctx, cancel := context.WithTimeout(context.Background(), execTimeout)
            259 | 	defer cancel()
            261 | 	cmd := exec.CommandContext(ctx, binary, args...)
            262 | 	cmd.Dir = workDir
            264 | 	if env != nil {
            265 | 		cmd.Env = append(os.Environ(), env...)
            266 | 	}
            268 | 	if stdin != nil {
            269 | 		cmd.Stdin = bytes.NewReader(stdin)
            270 | 	}
            272 | 	var stdoutBuf, stderrBuf bytes.Buffer
            273 | 	cmd.Stdout = &stdoutBuf
            274 | 	cmd.Stderr = &stderrBuf
            276 | 	err := cmd.Run()
            278 | 	// Check for timeout. Per prd001-testutils R2.3 and AC5.
            279 | 	if ctx.Err() == context.DeadlineExceeded {
            280 | 		t.Fatalf("binary %s exceeded %v timeout", binary, execTimeout)
            281 | 	}
            283 | 	exitCode := 0
            284 | 	if err != nil {
            285 | 		if exitErr, ok := err.(*exec.ExitError); ok {
