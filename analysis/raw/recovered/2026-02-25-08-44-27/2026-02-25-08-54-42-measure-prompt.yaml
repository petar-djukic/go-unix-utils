            183 | // processTransformed reads input byte-by-byte and applies transformations.
            184 | // Transformation order per prd006-cat R4.9 and design decision D1:
            185 | //  1. squeeze blanks (-s)
            186 | //  2. non-printing display (-v/-T)
            187 | //  3. end-of-line marker (-E)
            188 | //  4. line number prefix (-n/-b)
            189 | func processTransformed(r io.Reader, w *bufio.Writer, opts *options, state *catState) error {
            190 | 	buf := make([]byte, 4096)
            192 | 	for {
            193 | 		n, readErr := r.Read(buf)
            195 | 		for i := 0; i < n; i++ {
            196 | 			b := buf[i]
            198 | 			if state.atLineStart {
            199 | 				if b == '\n' {
            200 | 					// This is a blank line.
            201 | 					// Step 1: squeeze check. Per prd006-cat R3.1.
            202 | 					if opts.squeeze && state.prevBlank {
            203 | 						continue
            204 | 					}
            205 | 					state.prevBlank = true
            207 | 					// Step 4: line number prefix.
            208 | 					if opts.numberNonBlank {
            209 | 						// Per prd006-cat R2.2: blank lines get no number and no tab.
            210 | 					} else if opts.number {
            211 | 						if err := writeLineNumber(w, state.lineNum); err != nil {
            212 | 							return err
            213 | 						}
            214 | 						state.lineNum++
            215 | 					}
            217 | 					// Step 3: end-of-line marker. Per prd006-cat R4.3.
            218 | 					if opts.showEnds {
            219 | 						if err := w.WriteByte('$'); err != nil {
            220 | 							return err
            221 | 						}
            222 | 					}
            224 | 					if err := w.WriteByte('\n'); err != nil {
            225 | 						return err
            226 | 					}
            227 | 					continue
            228 | 				}
            230 | 				// Non-blank line start.
            231 | 				state.prevBlank = false
            232 | 				state.atLineStart = false
            234 | 				// Step 4: line number prefix. Per prd006-cat R2.1, R2.2.
            235 | 				if opts.number || opts.numberNonBlank {
            236 | 					if err := writeLineNumber(w, state.lineNum); err != nil {
            237 | 						return err
            238 | 					}
            239 | 					state.lineNum++
            240 | 				}
            241 | 			}
            243 | 			// Process the byte (steps 2 and 3).
            244 | 			if b == '\n' {
            245 | 				// End of a non-blank line.
            246 | 				// Step 3: end-of-line marker. Per prd006-cat R4.3.
            247 | 				if opts.showEnds {
            248 | 					if err := w.WriteByte('$'); err != nil {
            249 | 						return err
            250 | 					}
            251 | 				}
            252 | 				if err := w.WriteByte('\n'); err != nil {
            253 | 					return err
            254 | 				}
            255 | 				state.atLineStart = true
            256 | 				state.prevBlank = false
            257 | 				continue
            258 | 			}
            260 | 			if b == '\t' {
            261 | 				// Per prd006-cat R4.2, R4.4: -v does not alter tab. -T shows tab as ^I.
            262 | 				if opts.showTabs {
            263 | 					if _, err := w.WriteString("^I"); err != nil {
            264 | 						return err
            265 | 					}
            266 | 				} else {
            267 | 					if err := w.WriteByte(b); err != nil {
            268 | 						return err
            269 | 					}
            270 | 				}
            271 | 				continue
            272 | 			}
            274 | 			// Step 2: non-printing display. Per prd006-cat R4.1.
            275 | 			if opts.showNonPrinting {
            276 | 				if err := writeNonPrinting(w, b); err != nil {
            277 | 					return err
            278 | 				}
            279 | 			} else {
            280 | 				if err := w.WriteByte(b); err != nil {
            281 | 					return err
            282 | 				}
            283 | 			}
            284 | 		}
            286 | 		if readErr == io.EOF {
            287 | 			return nil
            288 | 		}
            289 | 		if readErr != nil {
            290 | 			return readErr
            291 | 		}
            292 | 	}
            293 | }
            295 | // writeLineNumber writes a right-justified line number with a tab separator.
            296 | // Format: "%6d\t" per prd006-cat R2.1.
            297 | func writeLineNumber(w *bufio.Writer, num int) error {
            298 | 	_, err := fmt.Fprintf(w, "%6d\t", num)
            299 | 	return err
            300 | }
            302 | // writeNonPrinting writes a byte using caret notation and M- prefix for
            303 | // non-printing characters. Per prd006-cat R4.1.
            304 | //
            305 | // This function must NOT be called with tab (0x09) or newline (0x0A) bytes;
            306 | // those are handled by the caller before reaching this function, per R4.2.
            307 | //
            308 | // Byte ranges:
            309 | //
            310 | //	0x00-0x1F → ^X (where X = byte + 64)
            311 | //	0x20-0x7E → pass through (printable ASCII)
            312 | //	0x7F      → ^?
            313 | //	0x80-0x9F → M-^X (where X = (byte - 128) + 64)
            314 | //	0xA0-0xFE → M-X (where X = byte - 128)
            315 | //	0xFF      → M-^?
            316 | func writeNonPrinting(w *bufio.Writer, b byte) error {
            317 | 	if b < 32 {
            318 | 		if err := w.WriteByte('^'); err != nil {
            319 | 			return err
            320 | 		}
            321 | 		return w.WriteByte(b + 64)
            322 | 	}
            324 | 	if b < 127 {
            325 | 		// Printable ASCII: 0x20-0x7E.
            326 | 		return w.WriteByte(b)
            327 | 	}
            329 | 	if b == 127 {
            330 | 		if err := w.WriteByte('^'); err != nil {
            331 | 			return err
            332 | 		}
            333 | 		return w.WriteByte('?')
            334 | 	}
            336 | 	// High bytes (0x80-0xFF): M- prefix.
            337 | 	if _, err := w.WriteString("M-"); err != nil {
            338 | 		return err
            339 | 	}
            340 | 	stripped := b - 128
            341 | 	if stripped < 32 {
            342 | 		// 0x80-0x9F → M-^X
            343 | 		if err := w.WriteByte('^'); err != nil {
            344 | 			return err
            345 | 		}
            346 | 		return w.WriteByte(stripped + 64)
            347 | 	}
            348 | 	if stripped == 127 {
            349 | 		// 0xFF → M-^?
            350 | 		if err := w.WriteByte('^'); err != nil {
            351 | 			return err
            352 | 		}
            353 | 		return w.WriteByte('?')
            354 | 	}
            355 | 	// 0xA0-0xFE → M-X
            356 | 	return w.WriteByte(stripped)
            357 | }
