            140 | 			t.Fatalf("setting up Go fixture: %v", err)
            141 | 		}
            142 | 		if err := tc.SetupFixture(refDir); err != nil {
            143 | 			t.Fatalf("setting up reference fixture: %v", err)
            144 | 		}
            145 | 	}
