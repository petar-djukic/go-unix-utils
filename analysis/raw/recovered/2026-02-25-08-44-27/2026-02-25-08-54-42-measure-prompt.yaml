        - file: cmd/wc/main.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | // Package main implements the wc utility: count lines, words, and bytes.
            5 | //
            6 | // Implements: prd005-wc (R1-R6)
            7 | package main
            9 | import (
            10 | 	"bufio"
            11 | 	"bytes"
            12 | 	"fmt"
            13 | 	"io"
            14 | 	"os"
            15 | 	"os/signal"
            16 | 	"strings"
            17 | 	"syscall"
            18 | 	"unicode"
            19 | 	"unicode/utf8"
            20 | )
            22 | // totalMode controls when the "total" summary line is printed.
            23 | // Per prd005-wc R3.3.
            24 | type totalMode int
            26 | const (
            27 | 	totalAuto   totalMode = iota // Print total when more than one file.
            28 | 	totalAlways                  // Print total even for one file.
            29 | 	totalOnly                    // Print only the total, no per-file lines.
            30 | 	totalNever                   // Never print total.
            31 | )
            33 | // options holds the parsed command-line flags for wc.
            34 | type options struct {
            35 | 	printLines     bool   // -l: count newline characters.
            36 | 	printWords     bool   // -w: count words.
            37 | 	printBytes     bool   // -c: count bytes.
            38 | 	printChars     bool   // -m: count characters (runes).
            39 | 	printMaxLine   bool   // -L: print length of longest line.
            40 | 	total          totalMode
            41 | 	files0From     string // --files0-from=FILE
            42 | 	hasFiles0From  bool
            43 | 	defaultMode    bool // True when no counting flags were given.
            44 | }
            46 | // counts holds the counting results for a single input.
            47 | type counts struct {
            48 | 	lines      int64
            49 | 	words      int64
            50 | 	bytesCount int64
            51 | 	chars      int64
            52 | 	maxLine    int64
            53 | }
            55 | func main() {
            56 | 	// SIGPIPE handling: exit 0 silently on broken pipe.
            57 | 	// Per prd005-wc R6.3 and design decision D1, matching cmd/cat pattern.
            58 | 	sigpipeCh := make(chan os.Signal, 1)
            59 | 	signal.Notify(sigpipeCh, syscall.SIGPIPE)
            60 | 	go func() {
            61 | 		<-sigpipeCh
            62 | 		os.Exit(0)
            63 | 	}()
            65 | 	opts, files, err := parseFlags(os.Args[1:])
            66 | 	if err != nil {
            67 | 		fmt.Fprintf(os.Stderr, "wc: %s\n", err)
            68 | 		os.Exit(1)
            69 | 	}
            71 | 	// Per prd005-wc R4.4: --files0-from reads NUL-delimited filenames.
            72 | 	if opts.hasFiles0From {
            73 | 		extraFiles, err := readFiles0From(opts.files0From)
            74 | 		if err != nil {
            75 | 			fmt.Fprintf(os.Stderr, "wc: %s\n", err)
            76 | 			os.Exit(1)
            77 | 		}
            78 | 		files = append(files, extraFiles...)
            79 | 	}
            81 | 	// Per prd005-wc R1.2: read from stdin when no file arguments are given.
            82 | 	if len(files) == 0 {
            83 | 		files = []string{"-"}
            84 | 	}
            86 | 	exitCode := 0
            87 | 	writer := bufio.NewWriter(os.Stdout)
            89 | 	type fileResult struct {
            90 | 		label string
            91 | 		c     counts
            92 | 		ok    bool
            93 | 	}
            95 | 	results := make([]fileResult, len(files))
            96 | 	var totalCounts counts
            97 | 	successCount := 0
            99 | 	for i, file := range files {
            100 | 		// Per prd005-wc R1.3: for stdin input, no filename is printed.
            101 | 		// GNU wc omits the filename label for stdin regardless of whether
            102 | 		// it was implied (no args) or explicit ("-" argument).
            103 | 		label := file
            104 | 		if file == "-" {
            105 | 			label = ""
            106 | 		}
            107 | 		c, err := countFile(file)
            108 | 		if err != nil {
            109 | 			fmt.Fprintf(os.Stderr, "wc: %s\n", err)
            110 | 			exitCode = 1
            111 | 			results[i] = fileResult{label: label, ok: false}
            112 | 			continue
            113 | 		}
            114 | 		results[i] = fileResult{label: label, c: c, ok: true}
            115 | 		successCount++
            116 | 		totalCounts.lines += c.lines
            117 | 		totalCounts.words += c.words
            118 | 		totalCounts.bytesCount += c.bytesCount
            119 | 		totalCounts.chars += c.chars
            120 | 		if c.maxLine > totalCounts.maxLine {
            121 | 			totalCounts.maxLine = c.maxLine
            122 | 		}
            123 | 	}
            125 | 	// Determine if we need a total line, to include it in column width calculation.
            126 | 	// Per prd005-wc R3.3: total considers total file count, not success count.
            127 | 	showTotal := shouldShowTotal(opts.total, len(files))
            129 | 	// Compute column width from the maximum count value across all entries.
            130 | 	// Per design decision D5.
            131 | 	successCounts := make([]counts, 0, successCount)
            132 | 	for _, r := range results {
            133 | 		if r.ok {
            134 | 			successCounts = append(successCounts, r.c)
            135 | 		}
            136 | 	}
            137 | 	colWidth := computeColumnWidth(successCounts, totalCounts, showTotal, &opts)
            139 | 	// Print per-file lines unless --total=only.
            140 | 	// Per prd005-wc R6.2: print counts only for successfully read files.
            141 | 	if opts.total != totalOnly {
            142 | 		for _, r := range results {
            143 | 			if !r.ok {
            144 | 				continue
            145 | 			}
            146 | 			printCounts(writer, r.c, r.label, colWidth, &opts)
            147 | 		}
            148 | 	}
            150 | 	// Print total line if needed. Per prd005-wc R1.4, R3.2.
            151 | 	if showTotal {
            152 | 		printCounts(writer, totalCounts, "total", colWidth, &opts)
