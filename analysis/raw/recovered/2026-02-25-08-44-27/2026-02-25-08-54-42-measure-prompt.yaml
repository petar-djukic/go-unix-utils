            116 | // runSingleFileDiffTest executes a single file-output differential test.
            117 | // Per design decision D1 and prd007-sponge R6.1: creates two isolated temp
            118 | // directories, runs each binary in its own directory, and compares the output
            119 | // files from both directories byte-for-byte.
            120 | //
            121 | // Per R2 requirements:
            122 | //
            123 | //	(a) creates two isolated temp directories with identical fixtures
            124 | //	(b) runs the Go binary in directory 1
            125 | //	(c) runs the reference binary in directory 2
            126 | //	(d) compares stdout and stderr byte-for-byte
            127 | //	(e) compares exit codes
            128 | //	(f) reads the output file from both directories and compares content
            129 | //	(g) on divergence reports: args, stdin, both file contents, both stdouts,
            130 | //	    both stderrs, and both exit codes
            131 | func runSingleFileDiffTest(t *testing.T, goBin string, refBin string, tc fileDiffTestCase) {
            132 | 	t.Helper()
            134 | 	// (a) Create two isolated temp directories with identical fixtures.
            135 | 	goDir := t.TempDir()
            136 | 	refDir := t.TempDir()
