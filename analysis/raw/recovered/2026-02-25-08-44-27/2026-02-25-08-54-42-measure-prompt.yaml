            150 | 	// Stat (following link) should show a regular file.
            151 | 	fiFolowed, err := Stat(link)
            152 | 	if err != nil {
            153 | 		t.Fatalf("Stat(%q): %v", link, err)
            154 | 	}
            155 | 	if !fiFolowed.Mode.IsRegular() {
            156 | 		t.Errorf("Stat on symlink target: Mode = %v, want regular file", fiFolowed.Mode)
            157 | 	}
            158 | }
            160 | // TestStat_Directory verifies that Stat returns correct Mode for a directory.
            161 | func TestStat_Directory(t *testing.T) {
            162 | 	dir := t.TempDir()
            164 | 	fi, err := Stat(dir)
            165 | 	if err != nil {
            166 | 		t.Fatalf("Stat(%q): %v", dir, err)
            167 | 	}
            169 | 	if !fi.Mode.IsDir() {
            170 | 		t.Errorf("Mode.IsDir() = false for directory; Mode = %v", fi.Mode)
            171 | 	}
            172 | }
            174 | // TestStat_NonExistent verifies that Stat returns an error for a non-existent
            175 | // path.
            176 | func TestStat_NonExistent(t *testing.T) {
            177 | 	_, err := Stat("/nonexistent/path/that/does/not/exist")
            178 | 	if err == nil {
            179 | 		t.Errorf("Stat on non-existent path returned nil error")
            180 | 	}
            181 | }
            183 | // TestLstat_NonExistent verifies that Lstat returns an error for a non-existent
            184 | // path.
            185 | func TestLstat_NonExistent(t *testing.T) {
            186 | 	_, err := Lstat("/nonexistent/path/that/does/not/exist")
            187 | 	if err == nil {
            188 | 		t.Errorf("Lstat on non-existent path returned nil error")
            189 | 	}
            190 | }
            192 | // TestInstallSIGPIPEHandler verifies that InstallSIGPIPEHandler can be called
            193 | // without panicking and registers the handler.
            194 | //
            195 | // Per prd002-sys AC4. Full behavior (os.Exit(0) on SIGPIPE) is verified in
            196 | // integration tests; here we verify the function runs without error.
            197 | func TestInstallSIGPIPEHandler(t *testing.T) {
            198 | 	// Should not panic.
            199 | 	InstallSIGPIPEHandler()
            200 | }
            202 | // TestOnTerminalResize verifies that OnTerminalResize registers callbacks
            203 | // without panicking. Full SIGWINCH behavior is not testable without a real
            204 | // terminal, but we verify registration works and multiple calls are accepted.
            205 | //
            206 | // Per prd002-sys AC5, R4.1-R4.2.
            207 | func TestOnTerminalResize(t *testing.T) {
            208 | 	called := false
            209 | 	OnTerminalResize(func(width int) {
            210 | 		called = true
            211 | 		_ = called
            212 | 	})
            214 | 	// Register a second callback to verify multiple registrations.
            215 | 	OnTerminalResize(func(width int) {
            216 | 		_ = width
            217 | 	})
            219 | 	// Verify callbacks were registered (internal state check).
            220 | 	resizeState.mu.Lock()
            221 | 	count := len(resizeState.callbacks)
            222 | 	resizeState.mu.Unlock()
            224 | 	if count < 2 {
            225 | 		t.Errorf("registered callback count = %d, want >= 2", count)
            226 | 	}
            227 | }
            229 | // TestStat_HardLink verifies that two hard links to the same file report the
            230 | // same Dev and Ino values and Nlink >= 2.
            231 | //
            232 | // Per prd002-sys R2.5 (du needs st_dev and st_ino for hard-link deduplication).
            233 | func TestStat_HardLink(t *testing.T) {
            234 | 	dir := t.TempDir()
            235 | 	original := filepath.Join(dir, "original")
            236 | 	linked := filepath.Join(dir, "linked")
            238 | 	if err := os.WriteFile(original, []byte("shared content\n"), 0644); err != nil {
            239 | 		t.Fatalf("creating original file: %v", err)
            240 | 	}
            241 | 	if err := os.Link(original, linked); err != nil {
            242 | 		t.Fatalf("creating hard link: %v", err)
            243 | 	}
            245 | 	fiOrig, err := Stat(original)
            246 | 	if err != nil {
            247 | 		t.Fatalf("Stat(%q): %v", original, err)
            248 | 	}
            249 | 	fiLink, err := Stat(linked)
            250 | 	if err != nil {
            251 | 		t.Fatalf("Stat(%q): %v", linked, err)
            252 | 	}
            254 | 	if fiOrig.Dev != fiLink.Dev {
            255 | 		t.Errorf("Dev mismatch: original=%d, linked=%d", fiOrig.Dev, fiLink.Dev)
            256 | 	}
            257 | 	if fiOrig.Ino != fiLink.Ino {
            258 | 		t.Errorf("Ino mismatch: original=%d, linked=%d", fiOrig.Ino, fiLink.Ino)
            259 | 	}
            260 | 	if fiOrig.Nlink < 2 {
            261 | 		t.Errorf("Nlink = %d after hard link, want >= 2", fiOrig.Nlink)
            262 | 	}
            263 | }
