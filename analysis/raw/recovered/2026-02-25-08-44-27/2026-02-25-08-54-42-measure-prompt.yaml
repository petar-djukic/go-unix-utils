            327 | // formatRelativeAge converts a duration to a human-readable relative age string.
            328 | // Per design decision D4: uses the largest two non-zero units.
            329 | func formatRelativeAge(d time.Duration) string {
            330 | 	if d < 0 {
            331 | 		d = -d
            332 | 	}
            334 | 	totalSeconds := int64(math.Round(d.Seconds()))
            336 | 	days := totalSeconds / 86400
            337 | 	hours := (totalSeconds % 86400) / 3600
            338 | 	minutes := (totalSeconds % 3600) / 60
            339 | 	seconds := totalSeconds % 60
            341 | 	var parts []string
            342 | 	if days > 0 {
            343 | 		parts = append(parts, fmt.Sprintf("%dd", days))
            344 | 	}
            345 | 	if hours > 0 {
            346 | 		parts = append(parts, fmt.Sprintf("%dh", hours))
            347 | 	}
            348 | 	if minutes > 0 {
            349 | 		parts = append(parts, fmt.Sprintf("%dm", minutes))
            350 | 	}
            351 | 	if seconds > 0 || len(parts) == 0 {
            352 | 		parts = append(parts, fmt.Sprintf("%ds", seconds))
            353 | 	}
            355 | 	// Use at most two units for readability.
            356 | 	if len(parts) > 2 {
            357 | 		parts = parts[:2]
            358 | 	}
            360 | 	return strings.Join(parts, "") + " ago"
