          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package sys
            6 | import (
            7 | 	"os"
            8 | 	"os/signal"
            9 | 	"sync"
            10 | 	"syscall"
            11 | )
            13 | // InstallSIGPIPEHandler installs a signal handler that calls os.Exit(0) when
            14 | // SIGPIPE is received. This suppresses the broken-pipe error when writing to a
            15 | // closed stdout or stderr, matching GNU behavior where SIGPIPE terminates
            16 | // silently. Uses a real signal handler (not signal.Ignore) so that deferred
            17 | // cleanup functions do not run.
            18 | //
            19 | // Per prd002-sys R3.1-R3.2.
            20 | // Utility context: ls, du, find, and xargs install SIGPIPE handlers to
            21 | // suppress broken-pipe errors when piped to head or other truncating consumers.
            22 | func InstallSIGPIPEHandler() {
            23 | 	ch := make(chan os.Signal, 1)
            24 | 	signal.Notify(ch, syscall.SIGPIPE)
            25 | 	go func() {
            26 | 		<-ch
            27 | 		os.Exit(0)
            28 | 	}()
            29 | }
            31 | // resizeState holds the registered SIGWINCH callbacks and installation state.
            32 | var resizeState struct {
            33 | 	mu        sync.Mutex
            34 | 	callbacks []func(width int)
            35 | 	installed bool
            36 | }
            38 | // OnTerminalResize registers a callback that is invoked with the new terminal
            39 | // width when a SIGWINCH signal is received (terminal resize). Multiple calls to
            40 | // OnTerminalResize are supported; each registered callback is called on resize.
            41 | //
            42 | // Per prd002-sys R4.1-R4.2.
            43 | // Utility context: ls re-queries terminal width on SIGWINCH to re-format output
            44 | // when the terminal window is resized during a long listing (ls.c:2281).
            45 | func OnTerminalResize(callback func(width int)) {
            46 | 	resizeState.mu.Lock()
            47 | 	defer resizeState.mu.Unlock()
            49 | 	resizeState.callbacks = append(resizeState.callbacks, callback)
            51 | 	if !resizeState.installed {
            52 | 		resizeState.installed = true
            53 | 		ch := make(chan os.Signal, 1)
            54 | 		signal.Notify(ch, syscall.SIGWINCH)
            55 | 		go func() {
            56 | 			for range ch {
            57 | 				width, err := TerminalWidth()
            58 | 				if err != nil {
            59 | 					// Terminal width unavailable; skip callback invocation.
            60 | 					continue
            61 | 				}
            62 | 				resizeState.mu.Lock()
            63 | 				cbs := make([]func(int), len(resizeState.callbacks))
            64 | 				copy(cbs, resizeState.callbacks)
            65 | 				resizeState.mu.Unlock()
            66 | 				for _, cb := range cbs {
            67 | 					cb(width)
            68 | 				}
            69 | 			}
            70 | 		}()
            71 | 	}
            72 | }
        - file: pkg/sys/stat_darwin.go
          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | //go:build darwin
            6 | package sys
            8 | import (
            9 | 	"syscall"
            10 | 	"time"
            11 | )
            13 | // fillFromStat extracts extended metadata fields from a Darwin syscall.Stat_t
            14 | // into a FileInfo. Abstracts the Darwin-specific field names and types:
            15 | //   - st_mtimespec (Darwin) for modification time
            16 | //   - st_nlink is uint16 on Darwin (vs uint64 on Linux amd64)
            17 | //   - st_dev and st_rdev are int32 on Darwin (vs uint64 on Linux)
            18 | //   - st_blksize is int32 on Darwin (vs int64 on Linux amd64)
            19 | //   - st_blocks counts in 512-byte units on both Darwin and Linux
            20 | //
            21 | // Per prd002-sys R2.3.
            22 | func fillFromStat(fi *FileInfo, st *syscall.Stat_t) {
            23 | 	fi.Nlink = uint64(st.Nlink)
            24 | 	fi.Uid = st.Uid
            25 | 	fi.Gid = st.Gid
            26 | 	fi.Rdev = uint64(st.Rdev)
            27 | 	fi.Dev = uint64(st.Dev)
            28 | 	fi.Ino = st.Ino
            29 | 	fi.Blocks = st.Blocks
            30 | 	fi.Blksize = int64(st.Blksize)
            31 | 	fi.ModTime = time.Unix(st.Mtimespec.Sec, st.Mtimespec.Nsec)
            32 | }
