            129 | 	}
            131 | 	isElapsed := flagI || flagS
            132 | 	goLayout, hasDotS, hasDots, hasDotT := convertFormat(formatStr)
            134 | 	startTime := time.Now()
            135 | 	prevTime := startTime
            137 | 	writer := bufio.NewWriter(os.Stdout)
            138 | 	scanner := bufio.NewScanner(os.Stdin)
            140 | 	for scanner.Scan() {
            141 | 		line := scanner.Text()
            142 | 		now := time.Now()
            144 | 		var ts string
            145 | 		if isElapsed {
            146 | 			var delta time.Duration
            147 | 			if flagS {
            148 | 				// Elapsed since start. Per prd004-ts R4.1.
            149 | 				if flagM {
            150 | 					delta = now.Sub(startTime)
            151 | 				} else {
            152 | 					delta = now.Sub(startTime)
            153 | 				}
            154 | 			} else {
            155 | 				// Incremental since previous line. Per prd004-ts R3.1.
            156 | 				if flagM {
            157 | 					delta = now.Sub(prevTime)
            158 | 				} else {
            159 | 					delta = now.Sub(prevTime)
            160 | 				}
            161 | 			}
            162 | 			ts = formatElapsed(delta, goLayout, hasDotS, hasDots, hasDotT)
            163 | 		} else {
            164 | 			ts = formatTimestamp(now, goLayout, hasDotS, hasDots, hasDotT)
            165 | 		}
