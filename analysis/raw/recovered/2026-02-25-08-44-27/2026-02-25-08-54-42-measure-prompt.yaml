            168 | 			return err
            169 | 		}
            170 | 		defer f.Close()
            171 | 		r = f
            172 | 	}
            174 | 	if opts.needsTransform() {
            175 | 		return processTransformed(r, w, opts, state)
            176 | 	}
            177 | 	// Per design decision D3: use io.Copy for efficient binary passthrough
            178 | 	// when no transformation flags are active.
            179 | 	_, err := io.Copy(w, r)
            180 | 	return err
