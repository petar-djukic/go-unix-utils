            315 | // countReader counts lines, words, bytes, characters, and max line length from
            316 | // a reader in a single pass.
            317 | //
            318 | // Per prd005-wc R2.1: -l counts newline characters (0x0A occurrences).
            319 | // Per prd005-wc R2.2: -w counts words (maximal sequences of non-whitespace).
            320 | // Per prd005-wc R2.3: -c counts bytes.
            321 | // Per prd005-wc R2.4: -m counts characters (runes); invalid UTF-8 bytes count as one character each.
            322 | // Per prd005-wc R2.5: -L measures longest line with tab expansion to next multiple of 8.
            323 | // Per design decision D3: count 0x0A bytes, not logical lines.
            324 | // Per design decision D4: use utf8 rune counting; invalid bytes count as one character.
            325 | func countReader(r io.Reader) (counts, error) {
            326 | 	var c counts
            327 | 	buf := make([]byte, 32*1024)
            328 | 	var inWord bool
            329 | 	var lineLen int64
            331 | 	// For character counting, we need to handle partial UTF-8 sequences
            332 | 	// that may span buffer boundaries.
            333 | 	var partial [utf8.UTFMax]byte
            334 | 	var partialLen int
            336 | 	for {
            337 | 		n, readErr := r.Read(buf)
            338 | 		data := buf[:n]
            340 | 		// If we have leftover partial bytes from the previous read,
            341 | 		// prepend them to the current data for character counting.
            342 | 		if partialLen > 0 && n > 0 {
            343 | 			// Try to complete the partial rune.
            344 | 			needed := runeIncompleteBytes(partial[:partialLen])
            345 | 			if needed > 0 && needed <= n {
            346 | 				combined := make([]byte, partialLen+needed)
            347 | 				copy(combined, partial[:partialLen])
            348 | 				copy(combined[partialLen:], data[:needed])
            349 | 				runeCount := countRunes(combined)
            350 | 				c.chars += int64(runeCount)
            351 | 				// Process the rest of the data for chars below,
            352 | 				// but skip the bytes we already consumed.
            353 | 				data = data[needed:]
            354 | 				partialLen = 0
            355 | 			} else if needed > n {
            356 | 				// Still not enough bytes, accumulate.
            357 | 				copy(partial[partialLen:], data[:n])
            358 | 				partialLen += n
            359 | 				c.bytesCount += int64(n)
            360 | 				// Process all original bytes for lines/words/maxline.
            361 | 				processLinesWordsMaxline(buf[:n], &c, &inWord, &lineLen)
            362 | 				if readErr == io.EOF {
            363 | 					// Count remaining partial as individual characters.
            364 | 					c.chars += int64(partialLen)
            365 | 					updateMaxLine(&c, lineLen)
            366 | 					return c, nil
            367 | 				}
            368 | 				if readErr != nil {
            369 | 					return c, readErr
            370 | 				}
            371 | 				continue
            372 | 			} else {
            373 | 				// needed == 0 means partial was actually complete or invalid.
            374 | 				c.chars += int64(countRunes(partial[:partialLen]))
            375 | 				partialLen = 0
            376 | 			}
            377 | 		} else if partialLen > 0 && n == 0 {
            378 | 			// EOF with leftover partial bytes: each counts as one character.
            379 | 			c.chars += int64(partialLen)
            380 | 			partialLen = 0
            381 | 		}
            383 | 		c.bytesCount += int64(len(data))
            385 | 		// Count characters, handling partial rune at end of buffer.
            386 | 		if len(data) > 0 {
            387 | 			// Check if the last bytes form an incomplete UTF-8 sequence.
            388 | 			trailingIncomplete := trailingIncompleteRune(data)
            389 | 			if trailingIncomplete > 0 {
            390 | 				charData := data[:len(data)-trailingIncomplete]
            391 | 				c.chars += int64(countRunes(charData))
            392 | 				copy(partial[:], data[len(data)-trailingIncomplete:])
            393 | 				partialLen = trailingIncomplete
            394 | 			} else {
            395 | 				c.chars += int64(countRunes(data))
            396 | 			}
            397 | 		}
            399 | 		// Process lines, words, and max line length from the original buffer chunk.
            400 | 		processLinesWordsMaxline(buf[:n], &c, &inWord, &lineLen)
            402 | 		if readErr == io.EOF {
            403 | 			// Update max line for the final unterminated line.
            404 | 			updateMaxLine(&c, lineLen)
            405 | 			return c, nil
            406 | 		}
            407 | 		if readErr != nil {
            408 | 			return c, readErr
            409 | 		}
            410 | 	}
            411 | }
            413 | // processLinesWordsMaxline processes a data chunk for line counting, word
            414 | // counting, and max line length computation.
            415 | func processLinesWordsMaxline(data []byte, c *counts, inWord *bool, lineLen *int64) {
            416 | 	for _, b := range data {
            417 | 		// Per design decision D3: count 0x0A bytes for -l.
            418 | 		if b == '\n' {
            419 | 			c.lines++
            420 | 			updateMaxLine(c, *lineLen)
            421 | 			*lineLen = 0
            422 | 			*inWord = false
            423 | 			continue
            424 | 		}
            426 | 		// Tab expansion for -L: advance to next multiple of 8.
            427 | 		// Per prd005-wc R2.5.
            428 | 		if b == '\t' {
            429 | 			*lineLen = (*lineLen/8 + 1) * 8
            430 | 		} else {
            431 | 			*lineLen++
            432 | 		}
            434 | 		// Word counting: whitespace detection.
            435 | 		// Per prd005-wc R2.2: word is a maximal sequence of non-whitespace.
            436 | 		if unicode.IsSpace(rune(b)) {
            437 | 			*inWord = false
            438 | 		} else {
            439 | 			if !*inWord {
            440 | 				c.words++
            441 | 				*inWord = true
            442 | 			}
            443 | 		}
            444 | 	}
            445 | }
            447 | // updateMaxLine updates the max line length if the current line is longer.
            448 | func updateMaxLine(c *counts, lineLen int64) {
            449 | 	if lineLen > c.maxLine {
            450 | 		c.maxLine = lineLen
            451 | 	}
            452 | }
            454 | // countRunes counts the number of runes in data. Invalid UTF-8 bytes each
            455 | // count as one character per prd005-wc R2.4.
            456 | func countRunes(data []byte) int {
            457 | 	count := 0
            458 | 	for len(data) > 0 {
            459 | 		_, size := utf8.DecodeRune(data)
            460 | 		count++
            461 | 		data = data[size:]
            462 | 	}
            463 | 	return count
            464 | }
            466 | // trailingIncompleteRune returns the number of trailing bytes in data that
            467 | // form an incomplete UTF-8 sequence. Returns 0 if the data ends on a complete
            468 | // rune boundary.
            469 | func trailingIncompleteRune(data []byte) int {
            470 | 	if len(data) == 0 {
            471 | 		return 0
            472 | 	}
            474 | 	// Check from the end of the buffer for the start of a multi-byte sequence.
            475 | 	for i := 1; i <= utf8.UTFMax && i <= len(data); i++ {
            476 | 		b := data[len(data)-i]
            477 | 		if b < 0x80 {
            478 | 			// ASCII byte: complete.
            479 | 			return 0
            480 | 		}
            481 | 		if b >= 0xC0 {
            482 | 			// This is a leading byte. Check if the sequence is complete.
            483 | 			var expectedLen int
            484 | 			if b < 0xE0 {
            485 | 				expectedLen = 2
            486 | 			} else if b < 0xF0 {
            487 | 				expectedLen = 3
            488 | 			} else {
            489 | 				expectedLen = 4
            490 | 			}
            491 | 			if i < expectedLen {
            492 | 				return i
            493 | 			}
            494 | 			return 0
            495 | 		}
            496 | 		// Continuation byte (0x80-0xBF): keep scanning backwards.
            497 | 	}
            498 | 	return 0
            499 | }
            501 | // runeIncompleteBytes returns the number of additional bytes needed to complete
            502 | // a partial UTF-8 sequence. Returns 0 if the partial is complete or invalid.
            503 | func runeIncompleteBytes(partial []byte) int {
            504 | 	if len(partial) == 0 {
            505 | 		return 0
            506 | 	}
            507 | 	r, size := utf8.DecodeRune(partial)
            508 | 	if r != utf8.RuneError || size != 1 || len(partial) == 1 {
            509 | 		// Complete rune or single invalid byte.
            510 | 		if size >= len(partial) {
            511 | 			return 0
            512 | 		}
            513 | 	}
            514 | 	// Determine expected length from the leading byte.
            515 | 	b := partial[0]
            516 | 	var expectedLen int
            517 | 	if b < 0xC0 {
            518 | 		return 0 // Invalid leading byte.
            519 | 	} else if b < 0xE0 {
            520 | 		expectedLen = 2
            521 | 	} else if b < 0xF0 {
            522 | 		expectedLen = 3
            523 | 	} else if b < 0xF8 {
            524 | 		expectedLen = 4
            525 | 	} else {
            526 | 		return 0 // Invalid.
            527 | 	}
            528 | 	if len(partial) >= expectedLen {
            529 | 		return 0 // Already have enough bytes.
            530 | 	}
            531 | 	return expectedLen - len(partial)
            532 | }
            534 | // shouldShowTotal determines whether to print a total line.
            535 | func shouldShowTotal(mode totalMode, fileCount int) bool {
            536 | 	switch mode {
            537 | 	case totalAlways, totalOnly:
            538 | 		return true
            539 | 	case totalNever:
            540 | 		return false
            541 | 	default: // totalAuto
            542 | 		return fileCount > 1
            543 | 	}
            544 | }
            546 | // computeColumnWidth determines the column width needed to right-align all
            547 | // count values. Per design decision D5.
            548 | func computeColumnWidth(allCounts []counts, total counts, showTotal bool, opts *options) int {
            549 | 	maxVal := int64(0)
            550 | 	for _, c := range allCounts {
            551 | 		updateMaxVal(&maxVal, c, opts)
            552 | 	}
            553 | 	if showTotal {
            554 | 		updateMaxVal(&maxVal, total, opts)
            555 | 	}
            556 | 	width := digitCount(maxVal)
            557 | 	if width < 1 {
            558 | 		width = 1
            559 | 	}
            560 | 	return width
            561 | }
            563 | // updateMaxVal updates maxVal with the largest printable count from c.
            564 | func updateMaxVal(maxVal *int64, c counts, opts *options) {
            565 | 	if opts.printLines && c.lines > *maxVal {
            566 | 		*maxVal = c.lines
            567 | 	}
            568 | 	if opts.printWords && c.words > *maxVal {
            569 | 		*maxVal = c.words
            570 | 	}
            571 | 	if opts.printChars && c.chars > *maxVal {
            572 | 		*maxVal = c.chars
            573 | 	} else if opts.printBytes && !opts.printChars && c.bytesCount > *maxVal {
            574 | 		*maxVal = c.bytesCount
            575 | 	}
            576 | 	if opts.printMaxLine && c.maxLine > *maxVal {
            577 | 		*maxVal = c.maxLine
            578 | 	}
            579 | }
            581 | // digitCount returns the number of digits in a non-negative integer.
            582 | func digitCount(n int64) int {
            583 | 	if n == 0 {
            584 | 		return 1
            585 | 	}
            586 | 	count := 0
            587 | 	for n > 0 {
            588 | 		count++
            589 | 		n /= 10
            590 | 	}
            591 | 	return count
            592 | }
            594 | // printCounts writes a formatted count line to the writer.
            595 | // Per prd005-wc R2.6: counts are printed in fixed order: lines, words,
            596 | // chars-or-bytes, max-line-length.
            597 | // Per prd005-wc R3.1: right-aligned in columns.
            598 | func printCounts(w *bufio.Writer, c counts, label string, colWidth int, opts *options) {
            599 | 	first := true
            600 | 	writeCount := func(val int64) {
            601 | 		if first {
            602 | 			fmt.Fprintf(w, "%*d", colWidth, val)
            603 | 			first = false
            604 | 		} else {
            605 | 			fmt.Fprintf(w, " %*d", colWidth, val)
            606 | 		}
            607 | 	}
            609 | 	if opts.printLines {
            610 | 		writeCount(c.lines)
            611 | 	}
            612 | 	if opts.printWords {
            613 | 		writeCount(c.words)
            614 | 	}
            615 | 	// Per prd005-wc R2.3: -m takes precedence over -c in output when both given.
            616 | 	if opts.printChars {
            617 | 		writeCount(c.chars)
            618 | 	} else if opts.printBytes {
            619 | 		writeCount(c.bytesCount)
            620 | 	}
            621 | 	if opts.printMaxLine {
            622 | 		writeCount(c.maxLine)
            623 | 	}
            625 | 	if label != "" {
            626 | 		fmt.Fprintf(w, " %s", label)
            627 | 	}
            628 | 	w.WriteByte('\n')
            629 | }
