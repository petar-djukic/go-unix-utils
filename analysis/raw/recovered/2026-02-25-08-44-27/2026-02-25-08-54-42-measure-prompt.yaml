          lines: |-
            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | package sys
            6 | import (
            7 | 	"fmt"
            8 | 	"os"
            9 | 	"syscall"
            10 | 	"time"
            11 | )
            13 | // FileInfo contains extended file metadata from syscall.Stat_t that is not
            14 | // available through os.FileInfo. The struct abstracts Darwin/Linux field name
            15 | // and type divergence so callers use a single API.
            16 | //
            17 | // Per prd002-sys R2.2.
            18 | type FileInfo struct {
            19 | 	// Mode is the file mode including type bits and permission bits.
            20 | 	Mode os.FileMode
            22 | 	// Size is the file size in bytes.
            23 | 	Size int64
            25 | 	// Nlink is the number of hard links (st_nlink).
            26 | 	Nlink uint64
            28 | 	// Uid is the user ID of the file owner (st_uid).
            29 | 	Uid uint32
            31 | 	// Gid is the group ID of the file owner (st_gid).
            32 | 	Gid uint32
            34 | 	// Rdev is the device ID for special files (st_rdev).
            35 | 	Rdev uint64
            37 | 	// Dev is the ID of the device containing the file (st_dev).
            38 | 	Dev uint64
            40 | 	// Ino is the inode number (st_ino).
            41 | 	Ino uint64
            43 | 	// Blocks is the number of 512-byte blocks allocated (st_blocks).
            44 | 	// On both Darwin and Linux, st_blocks counts in 512-byte units.
            45 | 	Blocks int64
            47 | 	// Blksize is the preferred I/O block size (st_blksize).
            48 | 	Blksize int64
            50 | 	// ModTime is the file modification time derived from st_mtimespec (Darwin)
            51 | 	// or st_mtim (Linux).
            52 | 	ModTime time.Time
            54 | 	// Info is the underlying os.FileInfo for compatibility with os package
            55 | 	// functions.
            56 | 	Info os.FileInfo
            57 | }
            59 | // Stat returns extended file metadata for path, following symbolic links.
            60 | //
            61 | // Per prd002-sys R2.1.
            62 | // Utility context: ls needs st_nlink, st_uid, st_gid, st_rdev for -l format;
            63 | // du needs st_dev and st_ino for hard-link deduplication (du.c:554).
            64 | func Stat(path string) (*FileInfo, error) {
            65 | 	return statPath(path, true)
            66 | }
            68 | // Lstat returns extended file metadata for path without following symbolic
            69 | // links. When path is a symlink, the returned FileInfo describes the symlink
            70 | // itself (type bits show symlink), not its target.
            71 | //
            72 | // Per prd002-sys R2.1, AC3.
            73 | func Lstat(path string) (*FileInfo, error) {
            74 | 	return statPath(path, false)
            75 | }
            77 | // statPath is the shared implementation for Stat and Lstat. When followLinks
            78 | // is true, it calls os.Stat; otherwise os.Lstat.
            79 | func statPath(path string, followLinks bool) (*FileInfo, error) {
            80 | 	var info os.FileInfo
            81 | 	var err error
            82 | 	if followLinks {
            83 | 		info, err = os.Stat(path)
            84 | 	} else {
            85 | 		info, err = os.Lstat(path)
            86 | 	}
            87 | 	if err != nil {
            88 | 		return nil, err
            89 | 	}
            91 | 	st, ok := info.Sys().(*syscall.Stat_t)
            92 | 	if !ok {
            93 | 		return nil, fmt.Errorf("extracting stat fields from %s: unsupported platform", path)
            94 | 	}
            96 | 	fi := &FileInfo{
            97 | 		Mode: info.Mode(),
            98 | 		Size: info.Size(),
            99 | 		Info: info,
            100 | 	}
            101 | 	// fillFromStat is defined in stat_darwin.go and stat_linux.go.
            102 | 	// It abstracts the Darwin/Linux divergence per prd002-sys R2.3.
            103 | 	fillFromStat(fi, st)
            105 | 	return fi, nil
            106 | }
