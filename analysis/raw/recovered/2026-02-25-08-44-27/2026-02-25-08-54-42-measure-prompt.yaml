            124 | // TestLstat_Symlink verifies that Lstat on a symlink returns FileInfo with Mode
            125 | // type bits showing symlink, not the target's mode.
            126 | //
            127 | // Per prd002-sys AC3.
            128 | func TestLstat_Symlink(t *testing.T) {
            129 | 	dir := t.TempDir()
            130 | 	target := filepath.Join(dir, "target")
            131 | 	link := filepath.Join(dir, "link")
            133 | 	if err := os.WriteFile(target, []byte("target content\n"), 0644); err != nil {
            134 | 		t.Fatalf("creating target file: %v", err)
            135 | 	}
            136 | 	if err := os.Symlink(target, link); err != nil {
            137 | 		t.Fatalf("creating symlink: %v", err)
            138 | 	}
            140 | 	fi, err := Lstat(link)
            141 | 	if err != nil {
