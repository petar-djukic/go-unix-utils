            13 | // TestTerminalWidth_NotTerminal verifies that TerminalWidth returns a non-nil
            14 | // error when stdout is not a terminal (it is a pipe in the test runner).
            15 | //
            16 | // Per prd002-sys AC1.
            17 | func TestTerminalWidth_NotTerminal(t *testing.T) {
            18 | 	// In the test runner, stdout is typically a pipe, not a terminal.
            19 | 	// TerminalWidth should return an error.
            20 | 	_, err := TerminalWidth()
            21 | 	if err == nil {
            22 | 		// If running in a real terminal (interactive test), this might pass.
            23 | 		// Skip rather than fail in that case.
            24 | 		t.Skip("stdout appears to be a terminal; cannot test non-terminal error path")
            25 | 	}
            26 | }
            28 | // TestIsTerminal_Pipe verifies that IsTerminal returns false for a pipe fd.
            29 | //
            30 | // Per prd002-sys R1.3.
            31 | func TestIsTerminal_Pipe(t *testing.T) {
            32 | 	r, w, err := os.Pipe()
            33 | 	if err != nil {
            34 | 		t.Fatalf("creating pipe: %v", err)
            35 | 	}
            36 | 	defer func() { _ = r.Close() }()
            37 | 	defer func() { _ = w.Close() }()
            39 | 	if IsTerminal(r.Fd()) {
            40 | 		t.Errorf("IsTerminal returned true for pipe read end")
            41 | 	}
            42 | 	if IsTerminal(w.Fd()) {
            43 | 		t.Errorf("IsTerminal returned true for pipe write end")
            44 | 	}
            45 | }
            47 | // TestStat_RegularFile verifies that Stat returns correct FileInfo fields for a
            48 | // known regular file.
            49 | //
            50 | // Per prd002-sys AC2.
            51 | func TestStat_RegularFile(t *testing.T) {
            52 | 	dir := t.TempDir()
            53 | 	path := filepath.Join(dir, "testfile")
            55 | 	content := []byte("hello world\n")
            56 | 	if err := os.WriteFile(path, content, 0644); err != nil {
            57 | 		t.Fatalf("creating test file: %v", err)
            58 | 	}
            60 | 	fi, err := Stat(path)
            61 | 	if err != nil {
            62 | 		t.Fatalf("Stat(%q): %v", path, err)
            63 | 	}
            65 | 	// Verify Mode indicates a regular file.
            66 | 	if !fi.Mode.IsRegular() {
            67 | 		t.Errorf("Mode.IsRegular() = false, want true; Mode = %v", fi.Mode)
            68 | 	}
            70 | 	// Verify Size matches written content.
            71 | 	if fi.Size != int64(len(content)) {
            72 | 		t.Errorf("Size = %d, want %d", fi.Size, len(content))
            73 | 	}
            75 | 	// Verify Nlink is at least 1.
            76 | 	if fi.Nlink < 1 {
            77 | 		t.Errorf("Nlink = %d, want >= 1", fi.Nlink)
            78 | 	}
            80 | 	// Verify Uid matches the current user.
            81 | 	if fi.Uid != uint32(os.Getuid()) {
            82 | 		t.Errorf("Uid = %d, want %d", fi.Uid, os.Getuid())
            83 | 	}
            85 | 	// Verify Gid matches the current group.
            86 | 	if fi.Gid != uint32(os.Getgid()) {
            87 | 		t.Errorf("Gid = %d, want %d", fi.Gid, os.Getgid())
            88 | 	}
            90 | 	// Verify Ino is non-zero.
            91 | 	if fi.Ino == 0 {
            92 | 		t.Errorf("Ino = 0, want non-zero")
            93 | 	}
            95 | 	// Verify Dev is non-zero.
            96 | 	if fi.Dev == 0 {
            97 | 		t.Errorf("Dev = 0, want non-zero")
            98 | 	}
            100 | 	// Verify Blocks is non-negative.
            101 | 	if fi.Blocks < 0 {
            102 | 		t.Errorf("Blocks = %d, want >= 0", fi.Blocks)
            103 | 	}
            105 | 	// Verify Blksize is positive.
            106 | 	if fi.Blksize <= 0 {
            107 | 		t.Errorf("Blksize = %d, want > 0", fi.Blksize)
            108 | 	}
            110 | 	// Verify ModTime is recent (within the last minute).
            111 | 	if time.Since(fi.ModTime) > time.Minute {
            112 | 		t.Errorf("ModTime = %v, want within the last minute", fi.ModTime)
            113 | 	}
            115 | 	// Verify Info is non-nil and consistent.
            116 | 	if fi.Info == nil {
            117 | 		t.Fatalf("Info is nil")
            118 | 	}
            119 | 	if fi.Info.Size() != fi.Size {
            120 | 		t.Errorf("Info.Size() = %d, want %d", fi.Info.Size(), fi.Size)
            121 | 	}
