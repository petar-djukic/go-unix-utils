            156 | // processFile opens and processes a single file (or stdin for "-").
            157 | // Per prd006-cat R1.1, R1.2, R5.2.
            158 | func processFile(file string, w *bufio.Writer, opts *options, state *catState) error {
            159 | 	var r io.Reader
            160 | 	if file == "-" {
            161 | 		r = os.Stdin
            162 | 	} else {
            163 | 		f, err := os.Open(file)
            164 | 		if err != nil {
