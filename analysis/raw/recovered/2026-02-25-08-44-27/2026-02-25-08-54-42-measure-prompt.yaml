            1 | // Copyright (c) 2026 Petar Djukic. All rights reserved.
            2 | // SPDX-License-Identifier: MIT
            4 | //go:build linux
            6 | package sys
            8 | import (
            9 | 	"syscall"
            10 | 	"time"
            11 | )
            13 | // fillFromStat extracts extended metadata fields from a Linux syscall.Stat_t
            14 | // into a FileInfo. Abstracts the Linux-specific field names and types:
            15 | //   - st_mtim (Linux) for modification time (vs st_mtimespec on Darwin)
            16 | //   - st_nlink varies by architecture: uint32 on arm64, uint64 on amd64
            17 | //   - st_blksize varies by architecture: int32 on arm64, int64 on amd64
            18 | //   - st_blocks counts in 512-byte units on both Darwin and Linux
            19 | //
            20 | // Explicit casts are used for Nlink and Blksize to handle cross-architecture
            21 | // type differences within Linux.
            22 | //
            23 | // Per prd002-sys R2.3.
            24 | func fillFromStat(fi *FileInfo, st *syscall.Stat_t) {
            25 | 	fi.Nlink = uint64(st.Nlink)
            26 | 	fi.Uid = st.Uid
            27 | 	fi.Gid = st.Gid
            28 | 	fi.Rdev = st.Rdev
            29 | 	fi.Dev = st.Dev
            30 | 	fi.Ino = st.Ino
            31 | 	fi.Blocks = st.Blocks
            32 | 	fi.Blksize = int64(st.Blksize)
            33 | 	fi.ModTime = time.Unix(st.Mtim.Sec, st.Mtim.Nsec)
            34 | }
