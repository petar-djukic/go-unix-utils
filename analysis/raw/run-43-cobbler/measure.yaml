  title: '[stitch] pkg/sys: extended file metadata error handling and TerminalWidth (srd002-sys R1.5-R1.7, R2.1)'
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd002-sys.yaml (full SRD for pkg/sys)
      - pkg/sys/ (all existing .go files -- read every file to understand the current implementation)
      - docs/ARCHITECTURE.yaml (pkg/sys component description)

    files:
      - path: pkg/sys/fileinfo.go
        action: modify
        note: Add error handling for Stat/Lstat edge cases per R1.5-R1.7
      - path: pkg/sys/terminal.go
        action: modify
        note: Implement TerminalWidth using TIOCGWINSZ ioctl

    requirements:
      - id: R1
        text: "Handle Stat/Lstat errors gracefully -- wrap os.Stat/os.Lstat errors and return them without masking the underlying cause. Callers must be able to use os.IsNotExist and os.IsPermission on the returned error. Traces to srd002-sys R1.5."
      - id: R2
        text: "When the underlying FileInfo does not have a syscall.Stat_t (e.g., on unsupported platforms or virtual filesystems), populate only the fields available from os.FileInfo (Mode, Size, ModTime, Info) and leave platform-specific fields at zero values. Traces to srd002-sys R1.6."
      - id: R3
        text: "Lstat on a symlink must populate FileInfo with the symlink's own metadata, not the target's. Mode must reflect ModeSymlink. Traces to srd002-sys R1.7."
      - id: R4
        text: "Implement TerminalWidth() (int, error) using the TIOCGWINSZ ioctl via golang.org/x/sys/unix. Query fd 1 (stdout). Return the column count. Return an error if stdout is not a terminal. Traces to srd002-sys R2.1."

    design_decisions:
      - id: D1
        text: "Use golang.org/x/sys/unix.IoctlGetWinsize for TIOCGWINSZ. Query file descriptor 1 (stdout) as the default terminal."
      - id: D2
        text: "Do not invent fallback terminal widths. If the ioctl fails, return 0 and the error. Callers decide the fallback."

    acceptance_criteria:
      - id: AC1
        text: "Stat on a nonexistent path returns an error where os.IsNotExist returns true."
      - id: AC2
        text: "Lstat on a symlink returns FileInfo with Mode containing os.ModeSymlink."
      - id: AC3
        text: "TerminalWidth returns a positive integer when stdout is a terminal."
      - id: AC4
        text: "TerminalWidth returns an error when stdout is not a terminal (e.g., redirected to a pipe)."
      - id: AC5
        text: "go build ./pkg/sys/... and go vet ./pkg/sys/... succeed with no errors."
