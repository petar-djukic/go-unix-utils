  title: '[stitch] pkg/sys: IsTerminal and terminal query operations (srd002-sys R2.2-R2.5)'
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd002-sys.yaml (full SRD for pkg/sys)
      - pkg/sys/ (all existing .go files -- read every file to understand the current state)
      - docs/ARCHITECTURE.yaml (pkg/sys component description)

    files:
      - path: pkg/sys/terminal.go
        action: modify
        note: Implement IsTerminal and additional terminal query functions

    requirements:
      - id: R1
        text: "Implement IsTerminal(fd uintptr) bool -- return true if the given file descriptor refers to a terminal device. Use golang.org/x/sys/unix.IoctlGetTermios or equivalent to test. Traces to srd002-sys R2.2."
      - id: R2
        text: "IsTerminal must work for any file descriptor (0 for stdin, 1 for stdout, 2 for stderr, or other fds). Do not hardcode fd values. Traces to srd002-sys R2.3."
      - id: R3
        text: "IsTerminal must not panic or return an error -- it is a boolean predicate. If the ioctl fails for any reason (invalid fd, not a terminal, permission denied), return false. Traces to srd002-sys R2.4."
      - id: R4
        text: "TerminalWidth must use IsTerminal internally to check if stdout is a terminal before attempting the TIOCGWINSZ ioctl. If IsTerminal returns false, return 0 and a descriptive error without attempting the ioctl. Traces to srd002-sys R2.5."

    design_decisions:
      - id: D1
        text: "Use golang.org/x/sys/unix.IoctlGetTermios with TCGETS (or equivalent) to detect terminal devices. This is the standard approach used by golang.org/x/term."
      - id: D2
        text: "IsTerminal is a pure predicate -- no error return, no side effects. If TerminalWidth already exists from a prior task, integrate IsTerminal as a guard check at the top of TerminalWidth."

    acceptance_criteria:
      - id: AC1
        text: "IsTerminal(os.Stdout.Fd()) returns true when stdout is a terminal and false when piped."
      - id: AC2
        text: "IsTerminal(os.Stdin.Fd()) returns true when stdin is a terminal and false when piped."
      - id: AC3
