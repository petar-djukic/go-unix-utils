  title: '[stitch] pkg/sys: FileInfo struct population and Stat/Lstat core (srd002-sys R1.1-R1.4)'
  description: |
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd002-sys.yaml (full SRD for pkg/sys)
      - pkg/sys/ (all existing contract stub files -- read every .go file in this directory)
      - docs/ARCHITECTURE.yaml (pkg/sys component description and design decisions)

    files:
      - path: pkg/sys/fileinfo.go
        action: modify
        note: Implement FileInfo struct population from os.FileInfo and syscall.Stat_t
      - path: pkg/sys/fileinfo_darwin.go
        action: create
        note: Darwin-specific Stat_t field extraction (Mtimespec, Atimespec, Ctimespec, Blocks, Blksize)
      - path: pkg/sys/fileinfo_linux.go
        action: create
        note: Linux-specific Stat_t field extraction (Mtim, Atim, Ctim, Blocks, Blksize)

    requirements:
      - id: R1
        text: "Implement Stat(path string) (*FileInfo, error) -- call os.Stat, then extract platform-specific fields from the underlying syscall.Stat_t into the FileInfo struct. Return the populated FileInfo. Traces to srd002-sys R1.1."
      - id: R2
        text: "Implement Lstat(path string) (*FileInfo, error) -- call os.Lstat (does not follow symlinks), then extract platform-specific fields from the underlying syscall.Stat_t into the FileInfo struct. Return the populated FileInfo. Traces to srd002-sys R1.2."
      - id: R3
        text: "Populate all FileInfo fields from syscall.Stat_t: Mode, Size, Nlink, Uid, Gid, Rdev, Dev, Ino, Blocks, Blksize. Use golang.org/x/sys/unix.Stat_t for field access. Traces to srd002-sys R1.3."
      - id: R4
        text: "Populate time fields (ModTime, AccessTime, ChangeTime) from syscall.Stat_t. On Darwin, use Mtimespec/Atimespec/Ctimespec. On Linux, use Mtim/Atim/Ctim. Use build-tagged files to abstract this divergence. Traces to srd002-sys R1.4."

    design_decisions:
      - id: D1
        text: "Use golang.org/x/sys/unix for Stat_t field access per ARCHITECTURE.yaml technology choices. Do not use syscall package directly for stat operations."
      - id: D2
        text: "Use Go build tags (//go:build darwin / //go:build linux) in separate files for platform-divergent field names. The platform-specific files export a helper function that the main fileinfo.go calls."
      - id: D3
        text: "Store the original os.FileInfo in the Info field of the FileInfo struct for callers that need the standard interface."

    acceptance_criteria:
      - id: AC1
        text: "Stat and Lstat return a fully populated *FileInfo for regular files, directories, and symlinks."
      - id: AC2
        text: "All FileInfo numeric fields (Nlink, Uid, Gid, Rdev, Dev, Ino, Blocks, Blksize) are populated from Stat_t."
      - id: AC3
        text: "ModTime, AccessTime, and ChangeTime are populated correctly on Darwin (Mtimespec) and Linux (Mtim)."
      - id: AC4
        text: "go build ./pkg/sys/... succeeds on darwin with no compilation errors."
      - id: AC5
        text: "go vet ./pkg/sys/... reports no issues."
  dependency: -1
