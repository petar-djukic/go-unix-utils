  title: '[stitch] pkg/sys: OnTerminalResize and signal handling (srd002-sys R2.6, R3.1-R3.3)'
  description: |-
    deliverable_type: code

    required_reading:
      - docs/specs/software-requirements/srd002-sys.yaml (full SRD for pkg/sys)
      - pkg/sys/ (all existing .go files -- read every file to understand the current state)
      - docs/ARCHITECTURE.yaml (pkg/sys component, SIGPIPE shared protocol)

    files:
      - path: pkg/sys/terminal.go
        action: modify
        note: Implement OnTerminalResize with SIGWINCH handling
      - path: pkg/sys/signal.go
        action: modify
        note: Implement InstallSIGPIPEHandler

    requirements:
      - id: R1
        text: "Implement OnTerminalResize(callback func(width int)) -- install a SIGWINCH signal handler that calls TerminalWidth() on each signal and invokes the callback with the new width. Use os/signal.Notify to register for syscall.SIGWINCH. Traces to srd002-sys R2.6."
      - id: R2
        text: "Implement InstallSIGPIPEHandler() -- install a SIGPIPE signal handler that causes the process to exit with code 0 when SIGPIPE is received. This matches GNU coreutils behavior when piped to head, grep -q, or other consumers that close stdin early. Use os/signal.Notify for syscall.SIGPIPE. Traces to srd002-sys R3.1."
      - id: R3
        text: "OnTerminalResize must run the callback in a separate goroutine to avoid blocking the signal handler. The goroutine must loop and read from the signal channel until the process exits. Traces to srd002-sys R3.2."
      - id: R4
        text: "InstallSIGPIPEHandler must be safe to call multiple times. Subsequent calls are no-ops. Use sync.Once or equivalent to ensure the handler is installed exactly once. Traces to srd002-sys R3.3."

    design_decisions:
      - id: D1
        text: "Use os/signal.Notify with a buffered channel (capacity 1) for both SIGWINCH and SIGPIPE handlers. Buffered channels prevent signal loss when the receiver is briefly busy."
      - id: D2
        text: "InstallSIGPIPEHandler exits with os.Exit(0) on SIGPIPE, matching GNU coreutils behavior. All cmd/ utilities call this at the start of main()."
      - id: D3
        text: "OnTerminalResize spawns a background goroutine. There is no mechanism to unregister -- the handler lives for the process lifetime, matching the typical use case (ls, pr)."

    acceptance_criteria:
      - id: AC1
        text: "InstallSIGPIPEHandler can be called multiple times without panic or duplicate handlers."
      - id: AC2
        text: "OnTerminalResize accepts a callback and does not block the caller."
      - id: AC3
        text: "OnTerminalResize invokes the callback with the current terminal width when SIGWINCH is received."
      - id: AC4
        text: "go build ./pkg/sys/... and go vet ./pkg/sys/... succeed with no errors."
